<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedGradPlus Marketing Card V2 - Refined</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #5eead4; /* Mint accent */
            --secondary: #3b82f6; /* Blue accent */
            --accent: #00ffa3;
            --bg: #030712;
            --card-glass: rgba(255, 255, 255, 0.05);
            --border: rgba(255, 255, 255, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            width: 1080px;
            height: 1080px;
            background: #030712;
            position: relative;
            display: flex;
            flex-direction: column;
            padding: 90px 100px;
            overflow: hidden;
            border: 1px solid var(--border);
            color: white;
        }

        /* Mint-Blue Duo Lighting */
        .card::before {
            content: '';
            position: absolute;
            top: -150px;
            right: -150px;
            width: 700px;
            height: 700px;
            background: radial-gradient(circle, rgba(94, 234, 212, 0.15) 0%, transparent 70%);
            z-index: 1;
        }

        .card::after {
            content: '';
            position: absolute;
            bottom: -150px;
            left: -150px;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.1) 0%, transparent 70%);
            z-index: 1;
        }

        .header {
            display: flex;
            justify-content: center;
            margin-bottom: 50px;
            z-index: 10;
        }

        .logo {
            font-weight: 900;
            font-size: 64px;
            letter-spacing: -2px;
            text-align: center;
        }

        .logo span {
            color: var(--primary);
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            z-index: 10;
        }

        .headline {
            font-size: 88px;
            font-weight: 800;
            line-height: 1.05;
            margin-bottom: 35px;
            text-align: center;
            letter-spacing: -2px;
        }

        .headline span {
            display: block;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subheadline {
            font-size: 34px;
            color: #ffffff; /* Improved from grey */
            text-align: center;
            max-width: 850px;
            margin: 0 auto 60px auto;
            line-height: 1.5;
            font-weight: 400;
        }

        .stats-row {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 50px;
        }

        .stat-badge {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid var(--primary);
            padding: 20px 40px;
            border-radius: 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 300px;
        }

        .stat-value {
            font-size: 72px;
            font-weight: 900;
            color: white;
            line-height: 1;
        }

        .stat-label {
            font-size: 24px;
            color: var(--primary);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .list-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            max-width: 800px;
            margin: 0 auto;
        }

        .list-item {
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 28px;
            color: #ffffff; /* Improved from grey */
            font-weight: 400;
        }

        .list-item i {
            width: 14px;
            height: 14px;
            background: var(--primary);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--primary);
        }

        .bottom-section {
            z-index: 10;
            margin-top: auto;
            text-align: center;
            padding-bottom: 20px;
        }

        .cta-text {
            font-size: 42px;
            font-weight: 900;
            color: white;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .cta-text span {
            color: var(--primary);
        }

        /* Abstract Pattern background */
        .pattern {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            opacity: 0.5;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="pattern"></div>
        
        <div class="header">
            <div class="logo">MEDGRAD<span>PLUS</span></div>
        </div>

        <div class="main-content">
            <h1 class="headline">SUA NOTA MÁXIMA <span>COMEÇA AQUI.</span></h1>
            <p class="subheadline">O Ciclo Básico completo (Módulo 1 ao Módulo 4) com tudo que você precisa para dominar as provas e atividades.</p>
            
            <div class="stats-row">
                <div class="stat-badge">
                    <span class="stat-value">22</span>
                    <span class="stat-label">Disciplinas</span>
                </div>
                <div class="stat-badge">
                    <span class="stat-value">100%</span>
                    <span class="stat-label">Mapeado</span>
                </div>
            </div>

            <div class="list-container">
                <div class="list-item"><i></i> Questões Comentadas</div>
                <div class="list-item"><i></i> Flashcards Inteligentes</div>
                <div class="list-item"><i></i> Atlas de Anatomia</div>
                <div class="list-item"><i></i> Suporte Mobile</div>
            </div>
        </div>

        <div class="bottom-section">
            <div class="cta-text">DISPONÍVEL <span>GRATUITAMENTE</span></div>
        </div>
    </div>
</body>
</html>
