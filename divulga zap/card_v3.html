<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedGradPlus Marketing Card V3 - Aprovação</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #FF3366; /* Hot Pink/Red for urgency */
            --accent: #FFCC00; /* Gold */
            --bg: #0F0F1A;
            --card-glass: rgba(255, 255, 255, 0.04);
            --border: rgba(255, 255, 255, 0.12);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            width: 1080px;
            height: 1080px;
            background: var(--bg);
            position: relative;
            display: flex;
            flex-direction: column;
            padding: 100px;
            overflow: hidden;
            border: 1px solid var(--border);
            color: white;
        }

        .card::before {
            content: '';
            position: absolute;
            top: -200px;
            right: -200px;
            width: 800px;
            height: 800px;
            background: radial-gradient(circle, rgba(255, 51, 102, 0.15) 0%, transparent 70%);
            z-index: 1;
        }

        .pattern {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 80px 80px;
            opacity: 0.5;
        }

        .header {
            z-index: 10;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 60px;
        }

        .logo {
            font-weight: 900;
            font-size: 54px;
            letter-spacing: -2px;
        }

        .logo span {
            color: var(--primary);
        }

        .badge {
            background: var(--primary);
            padding: 12px 30px;
            border-radius: 12px;
            font-weight: 800;
            font-size: 24px;
            letter-spacing: 1px;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            z-index: 10;
        }

        .headline {
            font-size: 100px;
            font-weight: 900;
            line-height: 0.95;
            margin-bottom: 40px;
            letter-spacing: -3px;
        }

        .headline span {
            color: var(--primary);
            display: block;
        }

        .description {
            font-size: 38px;
            line-height: 1.4;
            max-width: 800px;
            margin-bottom: 60px;
            color: rgba(255, 255, 255, 0.9);
            font-weight: 400;
        }

        .stats {
            display: flex;
            gap: 40px;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
        }

        .stat-value {
            font-size: 80px;
            font-weight: 900;
            color: #fff;
            line-height: 1;
        }

        .stat-label {
            font-size: 24px;
            color: var(--primary);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .footer {
            z-index: 10;
            margin-top: auto;
            border-top: 1px solid var(--border);
            padding-top: 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .footer-text {
            font-size: 32px;
            font-weight: 600;
        }

        .footer-text span {
            color: var(--accent);
        }

        .url {
            font-size: 32px;
            font-weight: 800;
            color: var(--primary);
        }

        .coupon-box {
            position: absolute;
            top: 40px;
            right: 40px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: #000;
            padding: 15px 35px;
            border-radius: 20px;
            font-size: 32px;
            font-weight: 900;
            box-shadow: 0 15px 35px rgba(255, 51, 102, 0.3);
            z-index: 100;
            display: none;
            transform: rotate(3deg);
        }

        /* Responsive Scaler */
        body {
            overflow: hidden;
            background: #000;
        }
        #card-scaler {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100vw;
            height: 100vh;
        }
        .card {
            flex-shrink: 0;
            transform-origin: center center;
        }
    </style>
</head>
<body>
    <div id="card-scaler">
        <div class="card">
            <div class="pattern"></div>
            
            <div id="couponDisplay" class="coupon-box">CUPOM: <span id="couponText"></span></div>

            <div class="header">
                <div class="logo">MEDGRAD<span>PLUS</span></div>
                <div class="badge">UNI9 VERGUEIRO</div>
            </div>

            <div class="main-content">
                <h1 class="headline">SUA NOTA,<br><span>SUA REGRAS.</span></h1>
                <p class="description">Pare de lutar com conteúdos que não caem na sua prova. Estude pelo material mapeado pelo plano de ensino oficial.</p>
                
                <div class="stats">
                    <div class="stat-item">
                        <span class="stat-value">4.000+</span>
                        <span class="stat-label">Cards</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-value">5.000+</span>
                        <span class="stat-label">Questões</span>
                    </div>
                </div>
            </div>

            <div class="footer">
                <div class="footer-text">TESTE <span>GRÁTIS</span> AGORA</div>
                <div class="url">medgradplus.web.app</div>
            </div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const coupon = urlParams.get('coupon');
        if (coupon) {
            document.getElementById('couponDisplay').style.display = 'block';
            document.getElementById('couponText').innerText = coupon.toUpperCase();
        }

        function updateScale() {
            const card = document.querySelector('.card');
            const scale = Math.min(1, (window.innerWidth - 40) / 1080, (window.innerHeight - 40) / 1080);
            card.style.transform = `scale(${scale})`;
        }
        window.addEventListener('resize', updateScale);
        updateScale();
    </script>
</body>
</html>
