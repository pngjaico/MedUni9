                <p style={{ color: 'var(--text-secondary)', marginBottom: '20px' }}>
                  {hasAnyCards ? 'Nenhum card para revisar agora!' : 'Flashcards em breve para esta matéria.'}
                </p>
                {hasAnyCards && <p style={{ color: 'var(--text-secondary)', fontSize: '13px' }}>Todos os cards estão em dia. Volte mais tarde.</p>}
                <button className="btn btn-secondary mt-2" style={{ marginTop: '20px' }} onClick={() => setStudying(false)}>Voltar</button>
              </div>
            </div>
          </>
        );
      }

      // Anki-style flashcard study session
      return (
        <>
          <div className="screen-content">
            <button className="back-btn" onClick={() => setStudying(false)}>← {backLabel}</button>

            <div className="flashcard-progress" style={{ marginBottom: '16px' }}>
              <div style={{ textAlign: 'center', fontSize: '13px', color: 'var(--text-secondary)', marginBottom: '8px' }}>
                {currentIndex + 1} de {deck.length}
              </div>
              <div className="progress-dots">
                {deck.slice(0, Math.min(deck.length, 30)).map((card, idx) => (
                  <div key={idx} className={`progress-dot ${idx === currentIndex ? 'current' : ''} ${idx < currentIndex ? 'completed' : ''}`}></div>
                ))}
                {deck.length > 30 && <span style={{ color: 'var(--text-secondary)', fontSize: '11px' }}>+{deck.length - 30}</span>}
              </div>
            </div>

            <div className="flashcard-container">
              <div className="flashcard" onClick={() => setIsFlipped(!isFlipped)} style={{ cursor: 'pointer' }}>
                <div className={`flashcard-inner ${isFlipped ? 'flipped' : ''}`}>
                  <div className="flashcard-front">
                    <div className="flashcard-label">Pergunta</div>
                    <div className="flashcard-text">{currentCard.pergunta}</div>
                    <div className="flashcard-hint">Espaço para virar</div>
                  </div>
                  <div className="flashcard-back">
                    <div className="flashcard-label">Resposta</div>
                    <div className="flashcard-text flashcard-answer">{currentCard.resposta}</div>
                    {currentCard.explicacao && (
                      <div className="flashcard-explanation">{currentCard.explicacao}</div>
                    )}
                  </div>
                </div>
              </div>
            </div>

            {isFlipped && (
              <div className="flashcard-actions anki-actions">
                <button className="rate-btn error" onClick={() => handleRate(1)}>
                  Difícil
                  <span className="rate-shortcut">1</span>
                </button>
                <button className="rate-btn warning" onClick={() => handleRate(3)}>
                  Médio
                  <span className="rate-shortcut">2</span>
                </button>
                <button className="rate-btn success" onClick={() => handleRate(5)}>
                  Fácil
                  <span className="rate-shortcut">3</span>
                </button>
              </div>
            )}

            {!isFlipped && (
              <div style={{ textAlign: 'center', marginTop: '16px' }}>
                <button className="btn btn-primary" onClick={() => setIsFlipped(true)} style={{ padding: '12px 32px' }}>
                  Mostrar Resposta
                </button>
              </div>
            )}
          </div>
        </>
      );
    };

    // Quiz Screen
    const QuizScreen = ({ flashcards, materias, selectedMateria, onSelectMateria, userSemester }) => {
      const [activeQuiz, setActiveQuiz] = useState(null);
      const [activeTemas, setActiveTemas] = useState([]);
      const [showTemaSelector, setShowTemaSelector] = useState(false);
      const [pendingQuiz, setPendingQuiz] = useState(null);
      const [pendingTemas, setPendingTemas] = useState([]);
      const [currentQuestion, setCurrentQuestion] = useState(0);
      const [selectedOption, setSelectedOption] = useState(null);
      const [crossedOut, setCrossedOut] = useState(new Set());
      const [answered, setAnswered] = useState(false);
      const [quizStats, setQuizStats] = useState({ correct: 0, total: 0 });
      const [startTime, setStartTime] = useState(Date.now());
      const [quizComplete, setQuizComplete] = useState(false);
      const [semesterFilter, setSemesterFilter] = useState(userSemester || null);
      const [searchQuery, setSearchQuery] = useState('');
      const [showCadernoErros, setShowCadernoErros] = useState(false);

      // Caderno de erros — localStorage
      const getErros = () => JSON.parse(localStorage.getItem('meduni9_caderno_erros') || '[]');
      const addErro = (questionId) => {
        const erros = getErros();
        if (!erros.includes(questionId)) {
          erros.push(questionId);
          localStorage.setItem('meduni9_caderno_erros', JSON.stringify(erros));
        }
      };
      const removeErro = (questionId) => {
        const erros = getErros().filter(id => id !== questionId);
        localStorage.setItem('meduni9_caderno_erros', JSON.stringify(erros));
      };
      const clearErros = () => localStorage.setItem('meduni9_caderno_erros', '[]');

      const quizQuestions = useMemo(() => {
        return flashcards.filter(f => f.tipo === 'quiz' && f.opcoes && f.opcoes.length > 0);
      }, [flashcards]);

      const quizzes = useMemo(() => {
        const grouped = {};
        materias.filter(m => m.ativo !== false).forEach(m => {
          const questions = quizQuestions.filter(f => f.materia === m.id);
          grouped[m.id] = { name: m.nome, sigla: m.sigla, cards: questions, icon: m.icon, semestre: m.modulo, ativo: m.ativo, cor: m.cor };
        });
        return grouped;
      }, [quizQuestions, materias]);

      const filteredQuizzes = useMemo(() => {
        let result = { ...quizzes };
        if (semesterFilter) {
          const f = {};
          Object.entries(result).forEach(([id, q]) => {
            if (q.semestre === semesterFilter && q.ativo !== false) f[id] = q;
          });
          result = f;
        }
        if (searchQuery) {
          const f = {};
          Object.entries(result).forEach(([id, q]) => {
            if (fuzzyMatch(searchQuery, q.name) || fuzzyMatch(searchQuery, q.sigla || '')) f[id] = q;
          });
          result = f;
        }
        return result;
      }, [quizzes, semesterFilter, searchQuery]);

      // Keyboard shortcuts for quiz
      useEffect(() => {
        if (!activeQuiz || quizComplete) return;
        const handleKey = (e) => {
          if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
          const activeCards = getActiveCards();
          const card = activeCards[currentQuestion];
          if (!card) return;

          if (!answered) {
            // 1-5 select option
            const num = parseInt(e.key);
            if (num >= 1 && num <= card.opcoes.length && !crossedOut.has(num - 1)) {
              setSelectedOption(num - 1);
            }
            // Enter = confirm
            if (e.key === 'Enter' && selectedOption !== null) {
              e.preventDefault();
              handleAnswer();
            }
          } else {
            // Enter or Space = next question
            if (e.key === 'Enter' || e.code === 'Space') {
              e.preventDefault();
              handleNextQuestion();
            }
          }
        };
        window.addEventListener('keydown', handleKey);
        return () => window.removeEventListener('keydown', handleKey);
      }, [activeQuiz, quizComplete, answered, selectedOption, currentQuestion, crossedOut]);

      const handleQuizStart = (materiaId, temasArray) => {
        setActiveQuiz(materiaId);
        setActiveTemas(temasArray || []);
        setCurrentQuestion(0);
        setSelectedOption(null);
        setCrossedOut(new Set());
        setAnswered(false);
        setQuizStats({ correct: 0, total: 0 });
        setStartTime(Date.now());
        setShowTemaSelector(false);
        setPendingQuiz(null);
        setPendingTemas([]);
        setQuizComplete(false);
      };

      const handleMateriaClick = (materiaId) => {
        const cards = quizzes[materiaId]?.cards || [];
        if (cards.length === 0) {
          handleQuizStart(materiaId, []);
          return;
        }
        const temas = [...new Set(cards.map(c => c.tema).filter(Boolean))];
        if (temas.length > 1) {
          setPendingQuiz(materiaId);
          setPendingTemas([]);
          setShowTemaSelector(true);
        } else {
          handleQuizStart(materiaId, []);
        }
      };

      const togglePendingTema = (temaId) => {
        setPendingTemas(prev =>
          prev.includes(temaId) ? prev.filter(t => t !== temaId) : [...prev, temaId]
        );
      };

      const toggleCross = (idx) => {
        const next = new Set(crossedOut);
        if (next.has(idx)) next.delete(idx);
        else next.add(idx);
        if (selectedOption === idx) setSelectedOption(null);
        setCrossedOut(next);
      };

      const getActiveCards = () => {
        if (showCadernoErros) {
          const erros = getErros();
          return quizQuestions.filter(q => erros.includes(q.id));
        }
        if (!activeQuiz) return [];
        const quiz = quizzes[activeQuiz];
        if (!quiz) return [];
        return activeTemas.length > 0
          ? quiz.cards.filter(c => activeTemas.includes(c.tema))
          : quiz.cards;
      };

      const handleAnswer = () => {
        const activeCards = getActiveCards();
        const card = activeCards[currentQuestion];
        const correct = selectedOption === card.correta;

        if (correct) {
          setQuizStats(prev => ({ ...prev, correct: prev.correct + 1 }));
          // Remove from caderno de erros if answered correctly
          removeErro(card.id);
        } else {
          // Add to caderno de erros on wrong answer
          addErro(card.id);
        }
        setAnswered(true);
      };

      const handleNextQuestion = () => {
        const activeCards = getActiveCards();
        if (currentQuestion < activeCards.length - 1) {
          setCurrentQuestion(currentQuestion + 1);
          setSelectedOption(null);
          setCrossedOut(new Set());
          setAnswered(false);
        } else {
          setQuizComplete(true);
          const quizHistory = JSON.parse(localStorage.getItem('meduni9_quiz_history') || '[]');
          quizHistory.push({
            date: new Date().toISOString(),
            materia: showCadernoErros ? 'caderno_erros' : activeQuiz,
            score: quizStats.correct,
            total: activeCards.length,
            time: formatTime(Date.now() - startTime)
          });
          localStorage.setItem('meduni9_quiz_history', JSON.stringify(quizHistory));
        }
      };

      const handleRestartQuiz = () => {
        if (showCadernoErros) {
          setCurrentQuestion(0);
          setSelectedOption(null);
          setCrossedOut(new Set());
          setAnswered(false);
          setQuizStats({ correct: 0, total: 0 });
          setStartTime(Date.now());
          setQuizComplete(false);
        } else {
          handleQuizStart(activeQuiz, activeTemas);
        }
      };

      // Start caderno de erros quiz
      const startCadernoErros = () => {
        setShowCadernoErros(true);
        setActiveQuiz('__erros__');
        setCurrentQuestion(0);
        setSelectedOption(null);
        setCrossedOut(new Set());
        setAnswered(false);
        setQuizStats({ correct: 0, total: 0 });
        setStartTime(Date.now());
        setQuizComplete(false);
      };

      if (quizComplete) {
        const activeCards = getActiveCards();
        const percentage = Math.round((quizStats.correct / Math.max(activeCards.length, 1)) * 100);

        return (
          <>
            <div className="screen-content">
              <div className="quiz-result-screen">
                <div style={{ fontSize: '60px', marginBottom: '20px' }}>
                  {percentage >= 70 ? '🎉' : percentage >= 50 ? '👍' : '💪'}
                </div>
                <div className="quiz-score">{percentage}%</div>
                <p style={{ color: 'var(--text-secondary)', marginBottom: '8px' }}>
                  {quizStats.correct} de {activeCards.length} questões
                  {activeTemas.length === 1 && <span> — {activeTemas[0]}</span>}
                  {activeTemas.length > 1 && <span> — {activeTemas.length} assuntos</span>}
                </p>
                <div className="quiz-time">{formatTime(Date.now() - startTime)}</div>
                <div style={{ marginTop: '32px', display: 'flex', flexDirection: 'column', gap: '12px' }}>
                  <button className="btn btn-primary" onClick={handleRestartQuiz}>Tentar Novamente</button>
                  <button className="btn btn-secondary" onClick={() => { setActiveQuiz(null); setActiveTemas([]); setQuizComplete(false); setShowCadernoErros(false); }}>Voltar</button>
                </div>
              </div>
            </div>
          </>
        );
      }

      // Tema selector screen for quiz (multi-select) — uses aulas from materias.json
      if (showTemaSelector && pendingQuiz) {
        const quiz = quizzes[pendingQuiz];
        const materiaObj = materias.find(m => m.id === pendingQuiz);
        const aulas = materiaObj?.aulas || [];
        const hasAulas = aulas.length > 0;
        const temasFromCardsQ = [...new Set(quiz.cards.map(c => c.tema).filter(Boolean))];

        return (
          <>
            <div className="screen-content">
              <button className="back-btn" onClick={() => { setShowTemaSelector(false); setPendingQuiz(null); setPendingTemas([]); }}>← Questões</button>
              <h2 className="section-title">{quiz.sigla || quiz.name}</h2>
              <p style={{ color: 'var(--text-secondary)', fontSize: '14px', marginBottom: '16px' }}>
                Selecione um ou mais assuntos:
              </p>
              <div className="subject-select-list" style={{ paddingBottom: pendingTemas.length > 0 ? '72px' : '0' }}>
                <div className="subject-select-card" onClick={() => handleQuizStart(pendingQuiz, [])}
                  style={{ borderColor: 'var(--primary)', background: 'rgba(0,180,216,0.06)', marginBottom: '8px' }}>
                  <div className="subject-select-icon" style={{ background: 'rgba(0,180,216,0.15)', color: 'var(--primary)' }}><IconClipboardList /></div>
                  <div className="subject-select-info">
                    <div className="subject-select-name">Todas as questões</div>
                    <div className="subject-select-meta">{quiz.cards.length} questões</div>
                  </div>
                  <div style={{ color: 'var(--primary)' }}><IconChevronRight /></div>
                </div>
                {hasAulas ? (
                  aulas.map(aula => {
                    const count = quiz.cards.filter(c => c.tema === aula.id).length;
                    const isChecked = pendingTemas.includes(aula.id);
                    const hasQs = count > 0;
                    return (
                      <div key={aula.id} className={`subject-select-card${isChecked ? ' tema-selected' : ''}${!hasQs ? ' subject-card-empty' : ''}`} onClick={() => hasQs && togglePendingTema(aula.id)}>
                        <div className={`tema-checkbox${isChecked ? ' tema-checkbox-checked' : ''}`}>{isChecked ? '✓' : ''}</div>
                        <div className="subject-select-info">
                          <div className="subject-select-name">{aula.tema}</div>
                          <div className="subject-select-meta">{hasQs ? `${count} questões` : 'Em breve'}</div>
                        </div>
                      </div>
                    );
                  })
                ) : (
                  temasFromCardsQ.sort().map(tema => {
                    const count = quiz.cards.filter(c => c.tema === tema).length;
                    const isChecked = pendingTemas.includes(tema);
                    return (
                      <div key={tema} className={`subject-select-card${isChecked ? ' tema-selected' : ''}`} onClick={() => togglePendingTema(tema)}>
                        <div className={`tema-checkbox${isChecked ? ' tema-checkbox-checked' : ''}`}>{isChecked ? '✓' : ''}</div>
                        <div className="subject-select-info">
                          <div className="subject-select-name">{tema}</div>
                          <div className="subject-select-meta">{count} questões</div>
                        </div>
                      </div>
                    );
                  })
                )}
              </div>

              {pendingTemas.length > 0 && (
                <div className="tema-start-bar">
                  <span style={{ color: 'var(--text-secondary)', fontSize: '13px' }}>
                    {pendingTemas.length} assunto{pendingTemas.length > 1 ? 's' : ''} selecionado{pendingTemas.length > 1 ? 's' : ''}
                  </span>
                  <button className="btn btn-primary" style={{ padding: '8px 20px', fontSize: '14px' }} onClick={() => handleQuizStart(pendingQuiz, pendingTemas)}>
                    Iniciar questões →
                  </button>
                </div>
              )}
            </div>
          </>
        );
      }

      if (activeQuiz) {
        const activeCards = getActiveCards();

        if (activeCards.length === 0) {
          const emptyMsg = showCadernoErros
            ? 'Nenhuma questão no caderno de erros!'
            : 'Questões em breve para esta matéria.';
          return (
            <>
              <div className="screen-content">
                <button className="back-btn" onClick={() => { setActiveQuiz(null); setActiveTemas([]); setShowCadernoErros(false); }}>← Questões</button>
                <div style={{ textAlign: 'center', marginTop: '60px' }}>
                  <div style={{ fontSize: '60px', marginBottom: '20px' }}>{showCadernoErros ? '✨' : '🚧'}</div>
                  <p style={{ color: 'var(--text-secondary)', marginBottom: '20px' }}>{emptyMsg}</p>
                  <button className="btn btn-secondary" onClick={() => { setActiveQuiz(null); setActiveTemas([]); setShowCadernoErros(false); }}>Voltar</button>
                </div>
              </div>
            </>
          );
        }

        const card = activeCards[currentQuestion];
        const progress = ((currentQuestion + 1) / activeCards.length) * 100;
        const quizLabel = showCadernoErros ? 'Caderno de Erros' : (quizzes[activeQuiz]?.sigla || quizzes[activeQuiz]?.name || 'Questões');

        return (
          <>
            <div className="screen-content">
              <button className="back-btn" onClick={() => { setActiveQuiz(null); setActiveTemas([]); setShowCadernoErros(false); }}>
                ← {activeTemas.length === 1 ? activeTemas[0] : quizLabel}
              </button>
              <div className="quiz-screen">
                <div className="quiz-progress-section">
                  <div className="quiz-progress-bar">
                    <div className="quiz-progress-fill" style={{ width: `${progress}%` }}></div>
                  </div>
                  <div className="quiz-counter">
                    {currentQuestion + 1} de {activeCards.length}
                    {card.tema && activeTemas.length !== 1 && <span style={{ marginLeft: '8px', color: 'var(--primary)', fontSize: '11px' }}>{card.tema}</span>}
                  </div>
                </div>

                <div className="quiz-question-card">
                  <div className="quiz-question">{card.pergunta}</div>
                </div>

                <div className="quiz-options">
                  {card.opcoes.map((option, idx) => (
                    <div
                      key={idx}
                      className={`quiz-option ${
                        crossedOut.has(idx) ? 'crossed-out' : ''
                      } ${
                        selectedOption === idx && !answered ? 'selected' : ''
                      } ${
                        answered && idx === card.correta ? 'correct' : ''
                      } ${
                        answered && selectedOption === idx && idx !== card.correta ? 'incorrect' : ''
                      }`}
                      onClick={() => {
                        if (!answered && !crossedOut.has(idx)) setSelectedOption(idx);
                      }}
                    >
                      <span className="quiz-option-number">{idx + 1}</span>
                      <span>{option}</span>
                      {!answered && !crossedOut.has(idx) && (
                        <button
                          className="cross-btn"
                          onClick={(e) => { e.stopPropagation(); toggleCross(idx); }}
                          title="Riscar alternativa"
                        >✕</button>
                      )}
                    </div>
                  ))}
                </div>

                {answered && card.explicacao && (
                  <div className="quiz-feedback">
                    <div className="quiz-feedback-title">
                      {selectedOption === card.correta ? '✓ Correto!' : '✗ Incorreto'}
                    </div>
                    <p style={{ color: 'var(--text-secondary)', lineHeight: '1.6' }}>{card.explicacao}</p>
                  </div>
                )}

                <div className="quiz-action-bar">
                  {!answered ? (
                    <button
                      className="btn btn-primary"
                      onClick={handleAnswer}
                      disabled={selectedOption === null}
                    >
                      Confirmar Resposta <span className="kbd-hint">Enter</span>
                    </button>
                  ) : (
                    <button className="btn btn-primary" onClick={handleNextQuestion}>
                      {currentQuestion === activeCards.length - 1 ? 'Finalizar' : 'Próxima Questão'} <span className="kbd-hint">Enter</span>
                    </button>
                  )}
                </div>
              </div>
            </div>
          </>
        );
      }

      // Quiz list with caderno de erros, semester filter, search
      const semesters = [...new Set(Object.values(quizzes).filter(q => q.ativo !== false).map(q => q.semestre))].sort((a,b) => a-b);
      const errosCount = getErros().length;

      return (
        <>
          <div className="screen-content">
            <h2 className="section-title">Questões</h2>

            {semesters.length > 1 && (
              <div className="semester-tabs">
                <button
                  className={`semester-tab ${!semesterFilter ? 'active' : ''}`}
                  onClick={() => setSemesterFilter(null)}
                >Todos</button>
                {semesters.map(s => (
                  <button
                    key={s}
                    className={`semester-tab ${semesterFilter === s ? 'active' : ''}`}
                    onClick={() => setSemesterFilter(s)}
                  >Módulo {s}</button>
                ))}
              </div>
            )}

            <div className="subject-search-wrap">
              <span className="subject-search-icon">🔍</span>
              <input
                type="search"
                className="subject-search"
                placeholder="Buscar matéria..."
                value={searchQuery}
                onChange={e => setSearchQuery(e.target.value)}
              />
            </div>

            {/* Caderno de Erros */}
            {errosCount > 0 && (
              <div className="subject-select-card caderno-erros-card" onClick={startCadernoErros}
                style={{ borderColor: 'var(--error)', background: 'rgba(239,68,68,0.06)', marginBottom: '12px' }}>
                <div className="subject-select-icon" style={{ background: 'rgba(239,68,68,0.15)', color: 'var(--error)', width: '40px', height: '40px', borderRadius: '10px', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '18px' }}>📕</div>
                <div className="subject-select-info">
                  <div className="subject-select-name" style={{ color: 'var(--error)' }}>Caderno de Erros</div>
                  <div className="subject-select-meta">{errosCount} questões para revisar</div>
                </div>
                <div style={{ color: 'var(--error)' }}><IconChevronRight /></div>
              </div>
            )}

            <div className="subject-select-list">
              {Object.entries(filteredQuizzes).length === 0 && (
                <div style={{ textAlign: 'center', padding: '40px 0', color: 'var(--text-secondary)' }}>
                  <p>Nenhuma questão encontrada.</p>
                </div>
              )}
              {Object.entries(filteredQuizzes).map(([id, quiz]) => (
                <div key={id} className={`subject-select-card${quiz.cards.length === 0 ? ' subject-card-empty' : ''}`} onClick={() => handleMateriaClick(id)}>
                  <SubjectIcon materiaId={id} icon={quiz.icon} cor={quiz.cor} />
                  <div className="subject-select-info">
                    <div className="subject-select-name">{quiz.sigla || quiz.name}</div>
                    <div className="subject-select-meta">
                      {quiz.cards.length > 0 ? `${quiz.cards.length} questões — Módulo ${quiz.semestre}` : 'Em breve'}
                    </div>
                  </div>
                  <div style={{ color: 'var(--text-secondary)' }}>
                    <IconChevronRight />
                  </div>
                </div>
              ))}
            </div>
          </div>
        </>
      );
    };

    // Materials Screen
    const MaterialsScreen = ({ materias, userSemester, onNavigateTo }) => {
      const [expandedMaterias, setExpandedMaterias] = useState({});
      const [searchQuery, setSearchQuery] = useState('');
      const [semesterFilter, setSemesterFilter] = useState(userSemester || null);
      const [selectedMaterial, setSelectedMaterial] = useState(null);
      const [materialContent, setMaterialContent] = useState('');
      const [materialLoading, setMaterialLoading] = useState(false);
      const [materialError, setMaterialError] = useState('');
      const [preProvaVisible, setPreProvaVisible] = useState(false);
      const markdownRef = useRef(null);

      // Split markdown at "## Pré-Prova" section
      const splitAtPreProva = (content) => {
        const markers = ['## Pré-Prova', '## Pre-Prova', '## PRÉ-PROVA', '## PRE-PROVA', '## Pré prova'];
        for (const m of markers) {
          const idx = content.indexOf(m);
          if (idx !== -1) return { main: content.slice(0, idx).trim(), preProva: content.slice(idx).trim() };
        }
        return { main: content, preProva: null };
      };

      // Post-process markdown header: breadcrumb + meta pills
      useEffect(() => {
        if (!markdownRef.current || !materialContent) return;
        const root = markdownRef.current;

        // --- Breadcrumb: first <p> that contains → ---
        const allPs = root.querySelectorAll('p');
        const bcP = Array.from(allPs).find(p => p.textContent.includes('→'));
        if (bcP && !bcP.classList.contains('md-breadcrumb')) {
          const parts = bcP.textContent.split('→').map(s => s.trim()).filter(Boolean);
          bcP.className = 'md-breadcrumb';
          bcP.innerHTML = parts.map((part, i) =>
            `<span class="bc-item${i === parts.length - 1 ? ' current' : ''}">${part}</span>${i < parts.length - 1 ? '<span class="bc-sep">›</span>' : ''}`
          ).join('');
        }

        // --- Meta pills: <p> that contains ⏱ ---
        const metaP = Array.from(allPs).find(p => p.textContent.includes('⏱') || p.textContent.includes('min ·'));
        if (metaP && !metaP.classList.contains('md-meta')) {
          const parts = metaP.textContent.split('·').map(s => s.trim()).filter(Boolean);
          metaP.className = 'md-meta';
          metaP.innerHTML = parts.map(p =>
            `<span class="md-meta-pill">${p}</span>`
          ).join('');
        }
      }, [materialContent, selectedMaterial]);

      // Enable interactive checkboxes with localStorage persistence
      useEffect(() => {
        if (!markdownRef.current || !selectedMaterial) return;
        const key = `checklist_${selectedMaterial.path}`;
        const saved = JSON.parse(localStorage.getItem(key) || '{}');
        const boxes = markdownRef.current.querySelectorAll('input[type="checkbox"]');
        boxes.forEach((cb, i) => {
          cb.removeAttribute('disabled');
          cb.checked = !!saved[i];
          cb.style.cursor = 'pointer';
          cb.style.accentColor = '#00B4D8';
          cb.style.width = '15px';
          cb.style.height = '15px';
          cb.style.marginRight = '6px';
          cb.style.verticalAlign = 'middle';
          cb.addEventListener('change', () => {
            saved[i] = cb.checked;
            localStorage.setItem(key, JSON.stringify(saved));
          });
        });
      }, [materialContent, selectedMaterial]);

      const toggleMateria = (id) => {
        setExpandedMaterias(prev => ({ ...prev, [id]: !prev[id] }));
      };

      const resolveTemaId = (materia, tema) => {
        if (tema?.id) return tema.id;
        const aulas = Array.isArray(materia?.aulas) ? materia.aulas : [];
        if (!aulas.length) return null;

        const byNome = aulas.find(a => normalizeText(a.tema) === normalizeText(tema?.nome || ''));
        if (byNome?.id) return byNome.id;

        const byDesc = aulas.find(a => normalizeText(a.descricao) === normalizeText(tema?.descricao || ''));
        if (byDesc?.id) return byDesc.id;

        return null;
      };

      const openMaterial = async (materia, tema) => {
        const modulo = materia.modulo || materia.semestre;
        const temaId = resolveTemaId(materia, tema);

        if (!temaId) {
          setSelectedMaterial({
            materiaNome: materia.nome,
            temaNome: tema.nome,
            path: 'sem-id',
            materiaId: materia.id,
          });
          setMaterialContent('');
          setMaterialError('Nao foi possivel identificar o ID da aula para abrir o material.');
          setMaterialLoading(false);
          return;
        }

        const primaryPath = `materiais/modulo${modulo}/${materia.id}/${temaId}.md`;
        const fallbackPaths = [
          primaryPath,
          `/materiais/modulo${modulo}/${materia.id}/${temaId}.md`,
          `materiais/modulo1/${materia.id}/${temaId}.md`,
          `materiais/modulo2/${materia.id}/${temaId}.md`,
          `materiais/modulo3/${materia.id}/${temaId}.md`,
          `materiais/modulo4/${materia.id}/${temaId}.md`,
          `materiais/modulo5/${materia.id}/${temaId}.md`,
          `materiais/modulo6/${materia.id}/${temaId}.md`,
        ];

        setSelectedMaterial({
          materiaNome: materia.nome,
          temaNome: tema.nome,
          path: primaryPath,
          materiaId: materia.id,
        });
        setMaterialContent('');
        setMaterialError('');
        setMaterialLoading(true);
        setPreProvaVisible(false);

        try {
          let loaded = false;
          for (const p of fallbackPaths) {
            const res = await fetch(p);
            if (!res.ok) continue;
            const text = await res.text();
            setMaterialContent(text);
            setSelectedMaterial(prev => ({ ...prev, path: p }));
            loaded = true;
            break;
          }

          if (!loaded) {
            throw new Error(`Material ainda nao disponivel para esta aula. Caminho tentado: ${primaryPath}`);
          }
        } catch (err) {
          setMaterialError(err?.message || 'Erro ao carregar material.');
        } finally {
          setMaterialLoading(false);
        }
      };

      const getMateriaModulos = (materia) => {
        const config = getModulos(materia.id);
        if (config) return config;
        if (materia.modulos) return materia.modulos;
        if (materia.aulas && materia.aulas.length > 0) {
          return [{ nome: materia.nome, temas: materia.aulas.map(a => ({ id: a.id, nome: a.tema, descricao: a.descricao })) }];
        }
        return null;
      };

      const totalTemas = (materia) => {
        const mods = getMateriaModulos(materia);
        if (!mods) return 0;
        return mods.reduce((acc, mod) => acc + (mod.temas?.length || 0), 0);
      };

      const semesters = [...new Set(materias.filter(m => m.ativo !== false).map(m => m.modulo))].sort((a,b) => a-b);

      const filteredMaterias = materias.filter(m => {
        if (semesterFilter && m.modulo !== semesterFilter) return false;
        return fuzzyMatch(searchQuery, m.nome) || fuzzyMatch(searchQuery, m.sigla || '');
      });

      // --- DETAIL VIEW: when a material is selected, replace entire screen ---
      if (selectedMaterial) {
        return (
          <div className="screen-content" style={{ paddingBottom: '32px' }}>

            {/* Header bar */}
            <div style={{
              display: 'flex',
              alignItems: 'center',
              gap: '10px',
              marginBottom: '20px',
            }}>
              <button
                onClick={() => { setSelectedMaterial(null); setMaterialContent(''); setMaterialError(''); }}
                style={{
                  background: 'rgba(0,180,216,0.08)',
                  border: '1px solid rgba(0,180,216,0.25)',
                  borderRadius: '8px',
                  color: '#00B4D8',
                  fontSize: '0.82rem',
                  fontWeight: 500,
                  padding: '7px 13px',
                  cursor: 'pointer',
                  display: 'flex',
                  alignItems: 'center',
                  gap: '5px',
                  flexShrink: 0,
                  transition: 'background 0.2s',
                  fontFamily: 'DM Sans, sans-serif',
                }}
              >← Voltar</button>

              <div style={{ minWidth: 0, flex: 1 }}>
                <div style={{
                  fontSize: '0.7rem',
                  color: '#64748B',
                  fontWeight: 500,
                  textTransform: 'uppercase',
                  letterSpacing: '0.07em',
                  marginBottom: '2px',
                  fontFamily: 'DM Sans, sans-serif',
                }}>{selectedMaterial.materiaNome}</div>
                <div style={{
                  fontSize: '1rem',
                  fontWeight: 700,
                  color: '#F1F5F9',
                  fontFamily: 'Outfit, sans-serif',
                  lineHeight: 1.25,
                  whiteSpace: 'nowrap',
                  overflow: 'hidden',
                  textOverflow: 'ellipsis',
                }}>{selectedMaterial.temaNome}</div>
              </div>
            </div>

            {/* Botões de ação — Flashcards e Questões */}
            {onNavigateTo && selectedMaterial.materiaId && (
              <div style={{
                display: 'flex',
                gap: '8px',
                marginBottom: '16px',
              }}>
                <button
                  onClick={() => onNavigateTo('cards', selectedMaterial.materiaId)}
                  style={{
                    flex: 1,
                    display: 'flex',
                    alignItems: 'center',
                    justifyContent: 'center',
                    gap: '7px',
                    background: 'rgba(124,58,237,0.12)',
                    border: '1px solid rgba(124,58,237,0.3)',
                    borderRadius: '10px',
                    padding: '10px 14px',
                    cursor: 'pointer',
                    color: '#C4B5FD',
                    fontSize: '0.82rem',
                    fontWeight: 600,
                    fontFamily: 'DM Sans, sans-serif',
                    transition: 'background 0.2s',
                  }}
                >
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>
                  Flashcards
                </button>
                <button
                  onClick={() => onNavigateTo('quiz', selectedMaterial.materiaId)}
                  style={{
                    flex: 1,
                    display: 'flex',
                    alignItems: 'center',
                    justifyContent: 'center',
                    gap: '7px',
                    background: 'rgba(16,185,129,0.1)',
                    border: '1px solid rgba(16,185,129,0.3)',
                    borderRadius: '10px',
                    padding: '10px 14px',
                    cursor: 'pointer',
                    color: '#6EE7B7',
                    fontSize: '0.82rem',
                    fontWeight: 600,
                    fontFamily: 'DM Sans, sans-serif',
                    transition: 'background 0.2s',
                  }}
                >
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
                  Questões
                </button>
              </div>
            )}

            {/* Loading */}
            {materialLoading && (
              <div style={{
                display: 'flex',
                flexDirection: 'column',
                alignItems: 'center',
                gap: '12px',
                padding: '48px 0',
                color: '#64748B',
                fontSize: '0.85rem',
                fontFamily: 'DM Sans, sans-serif',
              }}>
                <div style={{
                  width: '32px', height: '32px',
                  border: '3px solid rgba(0,180,216,0.15)',
                  borderTop: '3px solid #00B4D8',
                  borderRadius: '50%',
                  animation: 'spin 0.8s linear infinite',
                }} />
                Carregando material...
              </div>
            )}

            {/* Error */}
            {!materialLoading && materialError && (
              <div style={{
                background: 'rgba(239,68,68,0.08)',
                border: '1px solid rgba(239,68,68,0.2)',
                borderRadius: '10px',
                padding: '14px 16px',
                color: '#FCA5A5',
                fontSize: '0.85rem',
                fontFamily: 'DM Sans, sans-serif',
              }}>{materialError}</div>
            )}

            {/* Content */}
            {!materialLoading && !materialError && materialContent && (() => {
              const { main, preProva } = splitAtPreProva(materialContent);
              return (
                <>
                  <div
                    ref={markdownRef}
                    className="markdown-body"
                    style={{
                      background: 'linear-gradient(180deg, rgba(0,180,216,0.05) 0%, rgba(15,23,42,0.7) 120px)',
                      border: '1px solid rgba(0,180,216,0.15)',
                      borderTop: '3px solid #00B4D8',
                      borderRadius: '14px',
                      padding: '22px 20px 26px',
                      wordBreak: 'break-word',
                      boxShadow: '0 4px 32px rgba(0,180,216,0.08), 0 2px 12px rgba(0,0,0,0.3)',
                    }}
                    dangerouslySetInnerHTML={{ __html: marked.parse(main) }}
                  />

                  {/* Pré-Prova collapsible */}
                  {preProva && (
                    <div style={{ marginTop: '16px' }}>
                      <button
                        onClick={() => setPreProvaVisible(v => !v)}
                        style={{
                          width: '100%',
                          display: 'flex',
                          alignItems: 'center',
                          justifyContent: 'space-between',
                          background: preProvaVisible
                            ? 'rgba(245,158,11,0.15)'
                            : 'rgba(245,158,11,0.08)',
                          border: '1px solid rgba(245,158,11,0.3)',
                          borderRadius: preProvaVisible ? '12px 12px 0 0' : '12px',
                          padding: '13px 18px',
                          cursor: 'pointer',
                          transition: 'background 0.2s',
                          fontFamily: 'Outfit, sans-serif',
                        }}
                      >
                        <div style={{ display: 'flex', alignItems: 'center', gap: '10px' }}>
                          <span style={{ fontSize: '1.1rem' }}>⚡</span>
                          <div style={{ textAlign: 'left' }}>
                            <div style={{ fontSize: '0.78rem', color: '#D97706', fontWeight: 600, textTransform: 'uppercase', letterSpacing: '0.07em' }}>
                              Resumo
                            </div>
                            <div style={{ fontSize: '0.95rem', fontWeight: 700, color: '#FCD34D' }}>
                              Pré-Prova
                            </div>
                          </div>
                        </div>
                        <span style={{
                          color: '#FCD34D',
                          fontSize: '1rem',
                          transform: preProvaVisible ? 'rotate(180deg)' : 'rotate(0)',
                          transition: 'transform 0.25s',
                          display: 'inline-block',
                        }}>▼</span>
                      </button>

                      {preProvaVisible && (
                        <div
                          className="markdown-body preprova-content"
                          style={{
                            background: 'rgba(245,158,11,0.05)',
                            border: '1px solid rgba(245,158,11,0.2)',
                            borderTop: 'none',
                            borderRadius: '0 0 12px 12px',
                            padding: '18px 20px',
                            wordBreak: 'break-word',
                          }}
                          dangerouslySetInnerHTML={{ __html: marked.parse(preProva) }}
                        />
                      )}
                    </div>
                  )}
                </>
              );
            })()}
          </div>
        );
      }

      // --- LIST VIEW: normal materials list ---
      return (
        <>
          <div className="screen-content">
            <h2 className="section-title">Materiais de Apoio</h2>

            {semesters.length > 1 && (
              <div className="semester-tabs">
                <button
                  className={`semester-tab ${!semesterFilter ? 'active' : ''}`}
                  onClick={() => setSemesterFilter(null)}
                >Todos</button>
                {semesters.map(s => (
                  <button
                    key={s}
                    className={`semester-tab ${semesterFilter === s ? 'active' : ''}`}
                    onClick={() => setSemesterFilter(s)}
                  >Módulo {s}</button>
                ))}
              </div>
            )}

            <input
              type="search"
              className="subject-search"
              placeholder="Buscar matéria..."
              value={searchQuery}
              onChange={e => setSearchQuery(e.target.value)}
              style={{ marginBottom: '16px' }}
            />
            <div className="materials-list">
              {filteredMaterias.map(materia => {
                const total = totalTemas(materia);
                const isExpanded = expandedMaterias[materia.id];
                return (
                  <div key={materia.id} className="material-subject">
                    <div className="material-subject-name" style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
                      <span style={{ display: 'flex', alignItems: 'center', gap: '8px' }}>
                        <SubjectIcon materiaId={materia.id} icon={materia.icon} cor={materia.cor} />
                        {materia.sigla || materia.nome}
                      </span>
                      {total > 0 && (
                        <button
                          onClick={() => toggleMateria(materia.id)}
                          style={{
                            background: 'rgba(255,255,255,0.06)',
                            border: '1px solid rgba(255,255,255,0.12)',
                            borderRadius: '8px',
                            color: 'var(--text-secondary)',
                            fontSize: '0.78rem',
                            padding: '4px 10px',
                            cursor: 'pointer',
                            display: 'flex',
                            alignItems: 'center',
                            gap: '5px'
                          }}
                        >
                          {isExpanded ? '▲' : '▼'} {total} aulas
                        </button>
                      )}
                    </div>

                    {total > 0 && isExpanded && (
                      <div style={{ marginTop: '10px', marginBottom: '4px' }}>
                        {getMateriaModulos(materia).map((mod, mi) => (
                          <div key={mi} style={{ marginBottom: '10px' }}>
                            <div style={{
                              fontSize: '0.72rem',
                              fontWeight: 700,
                              textTransform: 'uppercase',
                              letterSpacing: '0.06em',
                              color: 'var(--text-secondary)',
                              marginBottom: '6px',
                              paddingLeft: '2px'
                            }}>{mod.nome}</div>
                            {mod.temas.map((tema, ti) => (
                              <div
                                key={ti}
                                onClick={() => openMaterial(materia, tema)}
                                title="Abrir material da aula"
                                style={{
                                display: 'flex',
                                alignItems: 'flex-start',
                                gap: '8px',
                                padding: '7px 10px',
                                borderRadius: '8px',
                                background: 'rgba(255,255,255,0.03)',
                                border: '1px solid rgba(255,255,255,0.06)',
                                marginBottom: '4px',
                                cursor: 'pointer'
                              }}>
                                <span style={{ color: materia.cor || 'var(--primary)', fontSize: '0.85rem', marginTop: '1px' }}>•</span>
                                <div>
                                  <div style={{ fontSize: '0.88rem', color: 'var(--text-primary)', fontWeight: 500 }}>{tema.nome}</div>
                                  {tema.descricao && (
                                    <div style={{ fontSize: '0.75rem', color: 'var(--text-secondary)', marginTop: '2px' }}>{tema.descricao}</div>
                                  )}
                                </div>
                              </div>
                            ))}
                          </div>
                        ))}
                      </div>
                    )}

                    <div className="material-slots" style={{ marginTop: total > 0 ? '8px' : undefined }}>
                      <div className="material-slot">
                        <span className="material-slot-name">
                          <span style={{ color: 'var(--text-secondary)', display: 'flex' }}><IconFileText /></span>
                          Resumo Didático
                        </span>
                        <span className="material-badge">Em breve</span>
                      </div>
                      <div className="material-slot">
                        <span className="material-slot-name">
                          <span style={{ color: 'var(--text-secondary)', display: 'flex' }}><IconPieChart /></span>
                          Análise de Provas
                        </span>
                        <span className="material-badge">Em breve</span>
                      </div>
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        </>
      );
    };

    // Profile Screen
    const ProfileScreen = ({ user, onLogout, onChangeSemester }) => {
      const [showPicker, setShowPicker] = useState(false);
      const [stats, setStats] = useState({
        cardsReviewed: 0,
        questionsAnswered: 0,
        streak: 0,
        studyHours: 0
      });

      useEffect(() => {
        const srData = JSON.parse(localStorage.getItem('meduni9_sr_data') || '{}');
        const quizHistory = JSON.parse(localStorage.getItem('meduni9_quiz_history') || '[]');

        setStats({
          cardsReviewed: Object.keys(srData).length,
          questionsAnswered: quizHistory.length,
          streak: 5,
          studyHours: Math.floor(quizHistory.length * 0.5)
        });
      }, []);

      const username = user.email ? user.email.split('@')[0] : 'Usuário';
      const avatarLetter = username.charAt(0).toUpperCase();

      return (
        <>
          <div className="screen-content">
            <div className="profile-avatar">{avatarLetter}</div>
            <div className="profile-name">{username}</div>
            <div className="profile-meta">Módulo {user.modulo || 1} · Plano Básico</div>

            <div className="profile-stats">
              <div className="profile-stat">
                <div className="profile-stat-icon" style={{ color: 'var(--primary)' }}><IconLayers /></div>
                <div className="profile-stat-value">{stats.cardsReviewed}</div>
                <div className="profile-stat-label">Cards</div>
              </div>
              <div className="profile-stat">
                <div className="profile-stat-icon" style={{ color: 'var(--success)' }}><IconClipboardList /></div>
                <div className="profile-stat-value">{stats.questionsAnswered}</div>
                <div className="profile-stat-label">Questões</div>
              </div>
              <div className="profile-stat">
                <div className="profile-stat-icon" style={{ color: 'var(--warning)' }}><IconFlame /></div>
                <div className="profile-stat-value">{stats.streak}</div>
                <div className="profile-stat-label">Sequência</div>
              </div>
              <div className="profile-stat">
                <div className="profile-stat-icon" style={{ color: 'var(--purple)' }}><IconClock /></div>
                <div className="profile-stat-value">{stats.studyHours}h</div>
                <div className="profile-stat-label">Estudo</div>
              </div>
            </div>

            <div className="profile-section">
              <div className="profile-item">
                <span className="profile-label">Email</span>
                <span className="profile-value" style={{ fontSize: '13px' }}>{user.email}</span>
              </div>
              <div className="profile-item">
                <span className="profile-label">Módulo</span>
                <span className="profile-value" style={{ display: 'flex', alignItems: 'center', gap: '8px' }}>
                  Módulo {user.semestre || user.modulo || 1}
                  <button
                    className="semester-tab"
                    style={{ fontSize: '11px', padding: '4px 10px' }}
                    onClick={() => setShowPicker(!showPicker)}
                  >Trocar</button>
                </span>
              </div>
              {showPicker && (
                <div className="semester-grid" style={{ marginTop: '8px', marginBottom: '8px' }}>
                  {[1,2,3,4,5,6].map(s => (
                    <button
                      key={s}
                      className={`semester-btn ${(user.semestre || user.modulo || 1) === s ? 'selected' : ''}`}
                      onClick={() => { onChangeSemester(s); setShowPicker(false); }}
                    >
                      Módulo {s}
                    </button>
                  ))}
                </div>
              )}
              <div className="profile-item">
                <span className="profile-label">Código</span>
                <span className="profile-value" style={{ fontSize: '12px', fontFamily: 'monospace' }}>{user.code}</span>
              </div>
            </div>

            <button className="btn btn-error" onClick={onLogout} style={{ marginTop: '8px' }}>
              <IconLogOut />
              Fazer Logout
            </button>

            <div style={{ textAlign: 'center', marginTop: '24px', paddingBottom: '20px' }}>
              <p style={{ color: 'var(--text-secondary)', fontSize: '11px' }}>MedUni9 v1.0.0</p>
            </div>
          </div>
        </>
      );
    };

    // ===================== Main App =====================
    function normalizeText(str) {
      return (str || '').toLowerCase()
        .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
        .replace(/\s+/g, '').replace(/[^a-z0-9]/g, '');
    }
    function fuzzyMatch(query, target) {
      const q = normalizeText(query);
      const t = normalizeText(target);
      if (!q) return true;
      if (t.includes(q)) return true;
      let qi = 0;
      for (let ti = 0; ti < t.length && qi < q.length; ti++) {
        if (t[ti] === q[qi]) qi++;
      }
      return qi === q.length;
    }

    const MedUni9App = () => {
      const VALID_TABS = ['home', 'cards', 'quiz', 'materials', 'feedback', 'profile'];
      const getInitialTab = () => {
        const hash = window.location.hash.replace('#', '');
        return VALID_TABS.includes(hash) ? hash : 'home';
      };

      const [stage, setStage] = useState('splash'); // splash, auth, app
      const [user, setUser] = useState(null);
      const [currentTab, setCurrentTab] = useState(getInitialTab);

      const navigateTo = (tab) => {
        setCurrentTab(tab);
        window.location.hash = tab;
      };
      const [materias, setMaterias] = useState([]);
      const [flashcards, setFlashcards] = useState([]);
      const [selectedMateria, setSelectedMateria] = useState(null);
      const [loading, setLoading] = useState(true);
      const [sidebarOpen, setSidebarOpen] = useState(true);

      useEffect(() => {
        // Check if user is already logged in
        const savedUser = localStorage.getItem('meduni9_user');
        if (savedUser) {
          setUser(JSON.parse(savedUser));
          setStage('app');
        }
      }, []);

      useEffect(() => {
        // Load data when app starts
        if (stage === 'app' && loading) {
          loadAppData();
        }
      }, [stage, loading]);

      const loadAppData = async () => {
        try {
          // Load data from external JSON files
          const [materiasRes, flashcardsRes, questoesRes] = await Promise.all([
            fetch('data/materias.json').catch(() => null),
            fetch('data/flashcards.json').catch(() => null),
            fetch('data/questoes.json').catch(() => null)
          ]);

          let materiasData = [];
          let flashcardsData = [];

          if (materiasRes && materiasRes.ok) {
            const raw = await materiasRes.json();
            // Convert object format to array with id
            materiasData = Object.entries(raw)
              .filter(([k]) => !k.startsWith('_'))
              .map(([id, val]) => ({ id, ...val, pergunta: val.frente, resposta: val.verso }));
          }

          if (flashcardsRes && flashcardsRes.ok) {
            const raw = await flashcardsRes.json();
            const cards = raw.flashcards || raw;
            flashcardsData = (Array.isArray(cards) ? cards : []).map(c => ({
              ...c,
              pergunta: c.frente || c.pergunta,
              resposta: c.verso || c.resposta
            }));
          }

          let questoesArray = [];
          
          if (questoesRes && questoesRes.ok) {
            const raw = await questoesRes.json();
            const questoes = raw.questoes || raw;
            questoesArray = questoesArray.concat(Array.isArray(questoes) ? questoes : []);
          }

          // Merge questoes as flashcards with quiz format
          if (questoesArray.length > 0) {
            questoesArray.forEach(q => {
              flashcardsData.push({
                id: 'q_' + q.id,
                materia: q.materia,
                pergunta: q.enunciado,
                resposta: q.opcoes && q.correta !== null && q.opcoes[q.correta] ? q.opcoes[q.correta].replace(/^[A-D]\)\s*/, '') : '',
                explicacao: q.explicacao,
                opcoes: q.opcoes || [],
                correta: q.correta,
                tipo: 'quiz',
                tema: q.tema,
                dificuldade: q.dificuldade
              });
            });
          }

          // Fallback if no JSON files loaded
          if (materiasData.length === 0) {
            materiasData = [
              { id: 'sus', nome: 'Princípios e Organização do SUS', sigla: 'SUS', semestre: 1, cor: '#6366F1' },
              { id: 'semiologia1', nome: 'Semiologia Médica 1 — Sistema Locomotor', sigla: 'SEMIO1', semestre: 1, cor: '#C0392B' },
              { id: 'bmf1', nome: 'Bases Morfofuncionais 1 — Sistema Locomotor', sigla: 'BMF1', semestre: 1, cor: '#E85D75' },
              { id: 'pmh', nome: 'Práticas nas Humanidades Médicas', sigla: 'PMH', semestre: 1, cor: '#8B5CF6' },
              { id: 'bmf2', nome: 'Bases Morfofuncionais 2 — Sistema Cardiopulmonar', sigla: 'BMF2', semestre: 2, cor: '#EF4444' },
              { id: 'mad1', nome: 'Mecanismos de Agressão e Defesa 1 — Imunologia', sigla: 'MAD1', semestre: 2, cor: '#F59E0B' },
              { id: 'indicadores', nome: 'Indicadores de Saúde e Epidemiologia', sigla: 'IND', semestre: 2, cor: '#10B981' },
              { id: 'bcm1', nome: 'Bases Moleculares e Celulares', sigla: 'BCM1', semestre: 2, cor: '#4A90E2' },
              { id: 'semiologia2', nome: 'Semiologia Médica 2 — Sistema Cardiopulmonar', sigla: 'SEMIO2', semestre: 2, cor: '#C0392B' },
              { id: 'mad2', nome: 'Mecanismos de Agressão e Defesa 2 — Patologia Geral', sigla: 'MAD2', semestre: 3, cor: '#EF4444' },
            ];
          }

          if (flashcardsData.length === 0) {
            flashcardsData = [
              { id: 'fc1', materia: 'bcm1', frente: 'Como interpretar gasometria com pH=7.28, pCO2=32, HCO3=15?', verso: 'Acidose metabólica com compensação respiratória. pH baixo indica acidemia, HCO3 baixo confirma origem metabólica, pCO2 reduzido mostra hiperventilação compensatória.', tema: 'bcm1_acido_base', dificuldade: 2 },
              { id: 'fc2', materia: 'bcm1', frente: 'Qual molécula regula a fluidez da membrana plasmática?', verso: 'O colesterol. Ele se intercala entre os fosfolipídeos, reduzindo a fluidez em altas temperaturas e impedindo a solidificação em baixas temperaturas.', tema: 'bcm1_membrana', dificuldade: 1 },
              { id: 'fc3', materia: 'bmf1', frente: 'Qual célula é responsável pela síntese de matriz óssea?', verso: 'O osteoblasto. Sintetiza e secreta os componentes orgânicos da matriz óssea (colágeno tipo I e proteoglicanos), participando da mineralização.', tema: 'bmf1_tec_osseo', dificuldade: 1 },
              { id: 'fc4', materia: 'sus', frente: 'Quais são os três princípios doutrinários do SUS?', verso: 'Universalidade (acesso a toda população), equidade (tratamento diferenciado conforme necessidade) e integralidade (atendimento completo de saúde individual e coletiva).', tema: 'SUS Princípios', dificuldade: 1 },
            ];
          }

          setMaterias(materiasData);
          setFlashcards(flashcardsData);
          setLoading(false);
        } catch (error) {
          console.error('Erro ao carregar dados:', error);
          setLoading(false);
        }
      };

      const handleAuthSuccess = (userData) => {
        setUser(userData);
        setStage('app');
      };

      const handleLogout = () => {
        localStorage.removeItem('meduni9_user');
        localStorage.removeItem('meduni9_sr_data');
        localStorage.removeItem('meduni9_quiz_history');
        localStorage.removeItem('meduni9_stats');
        setUser(null);
        setStage('auth');
        setCurrentTab('home');
        window.location.hash = '';
      };

      if (stage === 'splash') {
        return <SplashScreen onComplete={() => {
          const savedUser = localStorage.getItem('meduni9_user');
          if (savedUser) {
            setUser(JSON.parse(savedUser));
            setStage('app');
          } else {
            setStage('auth');
          }
        }} />;
      }

      if (stage === 'auth') {
        return <AuthScreen onAuthSuccess={handleAuthSuccess} />;
      }

      if (loading) {
        return (
          <div className="app-container">
            <div className="loading">
              <div className="spinner"></div>
            </div>
          </div>
        );
      }

      const handleChangeSemester = (newSem) => {
        const parsed = typeof newSem === 'number' ? newSem : parseInt(newSem);
        if (parsed >= 1 && parsed <= 6) {
          const updated = { ...user, semestre: parsed, modulo: parsed };
          setUser(updated);
          localStorage.setItem('meduni9_user', JSON.stringify(updated));
        }
      };

      const navItems = [
        { id: 'home', label: 'Início', icon: <IconHome /> },
        { id: 'cards', label: 'Flashcards', icon: <IconLayers /> },
        { id: 'quiz', label: 'Questões', icon: <IconTarget /> },
        { id: 'feedback', label: 'Feedback', icon: <IconMessageSquare /> },
        { id: 'materials', label: 'Materiais', icon: <IconBookOpen /> },
        { id: 'profile', label: 'Perfil', icon: <IconUser /> },
      ];

      // App UI with desktop sidebar
      return (
        <div className="desktop-layout">
          {/* Desktop Sidebar */}
          <div className={`desktop-sidebar${sidebarOpen ? '' : ' collapsed'}`}>
            <div className="sidebar-logo">
              <button
                className="sidebar-toggle-btn"
                onClick={() => setSidebarOpen(false)}
                title="Fechar menu"
                style={{ marginRight: '4px' }}
              ><IconMenu /></button>
              <span className="sidebar-logo-icon" style={{ color: 'var(--primary)', display: 'flex', alignItems: 'center' }}><IconLogoMed size={28} /></span>
              <span className="sidebar-logo-text">MedUni9</span>
            </div>
            <div className="sidebar-nav">
              {navItems.map(item => (
                <div
                  key={item.id}
                  className={`sidebar-item ${currentTab === item.id ? 'active' : ''}`}
                  onClick={() => navigateTo(item.id)}
                >
                  {item.icon}
                  <span>{item.label}</span>
                </div>
              ))}
            </div>
            <div className="sidebar-footer">
              <div className="sidebar-user-block">
                <div className="sidebar-user-avatar">
                  {user.email ? user.email.charAt(0).toUpperCase() : 'U'}
                </div>
                <div className="sidebar-user-info">
                  <div className="sidebar-user-name">{user.email ? user.email.split('@')[0] : 'Usuário'}</div>
                  <div className="sidebar-user-meta">Módulo {user.semestre || user.modulo || 1} · Básico</div>
                </div>
              </div>
            </div>
          </div>

          {/* Main Content */}
          <div className="app-container">
            {!sidebarOpen && (
              <button
                className="sidebar-toggle-btn"
                onClick={() => setSidebarOpen(true)}
                title="Abrir menu"
                style={{ position: 'fixed', top: '16px', left: '16px', zIndex: 200 }}
              ><IconMenu /></button>
            )}
            {currentTab === 'home' && (
              <DashboardScreen
                user={user}
                materias={materias}
                flashcards={flashcards}
                onSelectMateria={(id) => {
                  setSelectedMateria(id);
                  navigateTo('cards');
                }}
              />
            )}

            {currentTab === 'cards' && (
              <FlashcardsScreen
                flashcards={flashcards}
                materias={materias}
                selectedMateria={selectedMateria}
                onSelectMateria={setSelectedMateria}
                userSemester={user.semestre}
              />
            )}

            {currentTab === 'quiz' && (
              <QuizScreen
                flashcards={flashcards}
                materias={materias}
                selectedMateria={selectedMateria}
                onSelectMateria={setSelectedMateria}
                userSemester={user.semestre}
              />
            )}

            {currentTab === 'materials' && (
              <MaterialsScreen
                materias={materias}
                userSemester={user.semestre}
                onNavigateTo={(tab, materiaId) => {
                  if (materiaId) setSelectedMateria(materiaId);
                  navigateTo(tab);
                }}
              />
            )}

            {currentTab === 'feedback' && (
              <FeedbackScreen currentMateria={selectedMateria} />
            )}

            {currentTab === 'profile' && (
              <ProfileScreen user={user} onLogout={handleLogout} onChangeSemester={handleChangeSemester} />
            )}

            {/* Bottom Navigation (mobile only) */}
            <div className="bottom-nav">
              {navItems.map(item => (
                <div
                  key={item.id}
                  className={`nav-item ${currentTab === item.id ? 'active' : ''}`}
                  onClick={() => navigateTo(item.id)}
                >
                  <div className="nav-icon">{item.icon}</div>
                  <div className="nav-label">{item.label}</div>
                </div>
              ))}
            </div>

          </div>
        </div>
      );
    };

    // Render App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<MedUni9App />);
  </script>
</body>
</html>
