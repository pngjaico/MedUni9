<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#00B4D8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="MedGradPlus — Plataforma de estudos para estudantes de medicina">
  <title>MedGradPlus</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%230A1628'/><rect x='13' y='28' width='38' height='8' rx='3' fill='%2300B4D8'/><rect x='28' y='13' width='8' height='38' rx='3' fill='%2300B4D8'/><rect x='26' y='26' width='12' height='12' rx='2' fill='%2300C9E8'/></svg>">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><rect width='192' height='192' rx='40' fill='%230A1628'/><rect x='38' y='84' width='116' height='24' rx='8' fill='%2300B4D8'/><rect x='84' y='38' width='24' height='116' rx='8' fill='%2300B4D8'/><rect x='78' y='78' width='36' height='36' rx='6' fill='%2300C9E8'/></svg>">

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@600;700;800&family=Lexend:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-user-select: none;
      user-select: none;
    }

    html {
      background-color: var(--bg-dark, #181C27);
      height: 100%;
    }

    html, body {
      width: 100%;
      height: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      min-height: -webkit-fill-available;
      font-family: 'DM Sans', sans-serif;
      background: var(--bg-body, linear-gradient(160deg, #181C27 0%, #1D2130 55%, #1B2035 100%));
      background-attachment: fixed;
      color: var(--text-primary, #E5E7EB);
      overflow: hidden;
      transition: background 0.3s ease, color 0.3s ease;
    }

    #root {
      width: 100%;
      height: 100%;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding-top: env(safe-area-inset-top, 0px);
      padding-right: env(safe-area-inset-right, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      padding-left: env(safe-area-inset-left, 0px);
      box-sizing: border-box;
    }

    /* Typography */
    h1, h2, h3, h4, h5, h6 {
      font-family: 'Outfit', sans-serif;
      font-weight: 700;
    }

    /* Colors & Design Tokens */
    :root {
      --primary: #00C896;
      --mint: #00C896;
      --success: #10B981;
      --warning: #F59E0B;
      --error: #EF4444;
      --purple: #8B5CF6;

      /* Background — cinza-azulado carvão, identidade própria */
      --bg-body: linear-gradient(160deg, #181C27 0%, #1D2130 55%, #1B2035 100%);
      --bg-dark: #181C27;
      --bg-sidebar: #1D2130;
      --bg-card: rgba(255, 255, 255, 0.05);
      --border-card: rgba(255, 255, 255, 0.07);
      --text-primary: #E8EBF0;
      --text-secondary: #8B95A8;

      /* Surfaces */
      --surface-1: rgba(255, 255, 255, 0.06);
      --surface-2: rgba(255, 255, 255, 0.09);
      --surface-3: rgba(255, 255, 255, 0.14);
      --border-subtle: rgba(255, 255, 255, 0.09);
      --border-strong: rgba(255, 255, 255, 0.18);

      /* Elevação */
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.18);
      --shadow-md: 0 4px 20px rgba(0, 0, 0, 0.25);
      --shadow-lg: 0 8px 40px rgba(0, 0, 0, 0.35);

      /* Animação */
      --ease-spring: cubic-bezier(0.16, 1, 0.3, 1);
      --duration-fast: 150ms;
      --duration-base: 250ms;

      /* Cores por matéria */
      --color-sus: #6366F1;
      --color-semiologia: #C0392B;
      --color-bmf1: #E85D75;
      --color-bmf2: #EF4444;
      --color-bmf3: #3B82F6;
      --color-bmf4: #A855F7;
      --color-bcm1: #4A90E2;
      --color-mad: #F59E0B;
      --color-indicadores: #10B981;
      --color-mfc: #16A34A;
      --color-pediatria: #F59E0B;
      --color-go: #EC4899;
    }

    /* ── Light Theme ───────────────────────────────────── */
    html[data-theme="light"] {
      background-color: var(--bg-dark, #F1F5F9);
      --bg-body: linear-gradient(135deg, #EFF6FF 0%, #F1F5F9 50%, #E2EAF4 100%);
      --bg-dark: #F1F5F9;
      --bg-sidebar: rgba(255, 255, 255, 0.97);
      --bg-card: rgba(0, 0, 0, 0.04);
      --border-card: rgba(0, 0, 0, 0.08);
      --text-primary: #1E293B;
      --text-secondary: #64748B;
      --surface-1: rgba(0, 0, 0, 0.04);
      --surface-2: rgba(0, 0, 0, 0.06);
      --surface-3: rgba(0, 0, 0, 0.10);
      --border-subtle: rgba(0, 0, 0, 0.07);
      --border-strong: rgba(0, 0, 0, 0.15);
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.07);
      --shadow-md: 0 4px 20px rgba(0, 0, 0, 0.10);
      --shadow-lg: 0 8px 40px rgba(0, 0, 0, 0.14);
    }

    html[data-theme="light"] body {
      background: var(--bg-body);
      color: #1E293B;
    }

    html[data-theme="light"] .desktop-layout,
    html[data-theme="light"] .app-container,
    html[data-theme="light"] .splash-screen {
      background: var(--bg-body) !important;
    }

    html[data-theme="light"] .desktop-sidebar {
      background: var(--bg-sidebar) !important;
      border-right-color: rgba(0, 0, 0, 0.08) !important;
      box-shadow: 2px 0 16px rgba(0, 0, 0, 0.06) !important;
    }

    html[data-theme="light"] .sidebar-item {
      color: #475569 !important;
    }
    html[data-theme="light"] .sidebar-item:hover {
      background: rgba(0, 200, 150, 0.10) !important;
      color: #1E293B !important;
    }
    html[data-theme="light"] .sidebar-item.active {
      background: rgba(0, 200, 150, 0.16) !important;
      color: var(--primary) !important;
    }
    html[data-theme="light"] .sidebar-footer {
      border-top-color: rgba(0, 0, 0, 0.08) !important;
    }
    html[data-theme="light"] .sidebar-logo {
      border-bottom-color: rgba(0, 0, 0, 0.08) !important;
    }
    html[data-theme="light"] .bottom-nav {
      background: rgba(255, 255, 255, 0.95) !important;
      border-top: 1px solid rgba(0, 0, 0, 0.08) !important;
    }
    html[data-theme="light"] .nav-item { color: #64748B !important; }
    html[data-theme="light"] .nav-item.active { color: var(--primary) !important; }
    html[data-theme="light"] .screen-content { background: transparent !important; }
    html[data-theme="light"] .sidebar-open-bar {
      background: rgba(255,255,255,0.97) !important;
      border-bottom-color: rgba(0,0,0,0.08) !important;
    }
    html[data-theme="light"] .feedback-panel,
    html[data-theme="light"] .feedback-modal {
      background: #ffffff !important;
      border-color: rgba(0,0,0,0.1) !important;
    }
    html[data-theme="light"] .feedback-select,
    html[data-theme="light"] .feedback-textarea {
      background: #F8FAFC !important;
      border-color: rgba(0,0,0,0.12) !important;
      color: #1E293B !important;
    }
    html[data-theme="light"] .feedback-select option { background: #ffffff !important; color: #1E293B !important; }

    /* ── Light Mode: Card/Surface contrast fixes ─────── */
    html[data-theme="light"] .stat-card {
      background: rgba(255, 255, 255, 0.88) !important;
      border: 1px solid rgba(0, 0, 0, 0.10) !important;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.07) !important;
    }
    html[data-theme="light"] .question-card,
    html[data-theme="light"] .flashcard-item,
    html[data-theme="light"] .material-item {
      background: rgba(255, 255, 255, 0.85) !important;
      border-color: rgba(0, 0, 0, 0.10) !important;
      box-shadow: 0 1px 6px rgba(0, 0, 0, 0.07) !important;
    }
    html[data-theme="light"] .screen-header {
      background: rgba(255, 255, 255, 0.90) !important;
      border-bottom-color: rgba(0, 0, 0, 0.08) !important;
    }
    html[data-theme="light"] .subject-select-item {
      background: rgba(255, 255, 255, 0.80) !important;
      border-color: rgba(0, 0, 0, 0.10) !important;
    }
    html[data-theme="light"] .subject-select-item:hover {
      background: rgba(255, 255, 255, 0.97) !important;
    }
    html[data-theme="light"] .btn-primary {
      box-shadow: 0 2px 12px rgba(0, 200, 150, 0.3) !important;
    }
    html[data-theme="light"] .markdown-body {
      background: rgba(255, 255, 255, 0.95) !important;
    }
    html[data-theme="light"] .material-header-card {
      background: rgba(255, 255, 255, 0.88) !important;
      border-color: rgba(0, 0, 0, 0.10) !important;
    }

    /* ── Theme Toggle Button ─────────────────────────── */
    .theme-toggle-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 16px;
      transition: color 0.2s, opacity 0.2s;
      flex-shrink: 0;
      opacity: 0.7;
    }
    .theme-toggle-btn:hover {
      color: var(--primary);
      opacity: 1;
    }

    /* Main Container */
    .app-container {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      width: 100%;
      max-width: 430px;
      margin: 0 auto;
      background: var(--bg-body, linear-gradient(160deg, #181C27 0%, #1D2130 55%, #1B2035 100%));
      position: relative;
      transition: background 0.3s ease;
    }

    /* Rota pública Sobre (#about-public): largura total no desktop — sem max-width 430px */
    .about-public-shell {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      width: 100%;
      max-width: none;
      margin: 0;
      overflow: hidden;
      background: var(--bg-body, linear-gradient(160deg, #181C27 0%, #1D2130 55%, #1B2035 100%));
      position: relative;
      transition: background 0.3s ease;
    }

    html[data-theme="light"] .about-public-shell {
      background: var(--bg-body) !important;
    }

    /* Desktop layout wrapper */
    .desktop-layout {
      display: flex;
      flex: 1;
      min-height: 0;
      width: 100%;
      overflow: hidden;
      background: var(--bg-body, linear-gradient(160deg, #181C27 0%, #1D2130 55%, #1B2035 100%));
      transition: background 0.3s ease;
    }

    .desktop-layout .app-container {
      max-width: none;
      margin: 0;
      height: 100%;
      flex: 1;
      min-width: 0;
      min-height: 0;
    }

    /* Desktop Sidebar */
    .desktop-sidebar {
      display: none;
      width: 240px;
      min-width: 240px;
      background: var(--bg-sidebar, #1D2130);
      border-right: 1px solid var(--border-card);
      transition: background 0.3s ease;
      flex-direction: column;
      padding: 24px 0;
      height: 100vh;
      position: sticky;
      top: 0;
    }

    .sidebar-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 20px 24px;
      border-bottom: 1px solid var(--border-card);
      margin-bottom: 16px;
      justify-content: flex-start;
    }

    .sidebar-logo-icon { font-size: 28px; }

    .sidebar-logo-text {
      font-family: 'Outfit', sans-serif;
      font-size: 20px;
      font-weight: 700;
      color: var(--primary);
    }

    .sidebar-nav {
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 0 12px;
      flex: 1;
    }

    .sidebar-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      border-radius: 10px;
      cursor: pointer;
      color: var(--text-secondary);
      font-size: 14px;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .sidebar-item:hover {
      background: rgba(0, 200, 150, 0.08);
      color: var(--text-primary);
    }

    .sidebar-item.active {
      background: rgba(0, 200, 150, 0.15);
      color: var(--primary);
    }

    .sidebar-item svg {
      flex-shrink: 0;
    }

    .sidebar-footer {
      padding: 16px 20px;
      border-top: 1px solid var(--border-card);
      font-size: 11px;
      color: var(--text-secondary);
      text-align: center;
    }

    .screen-content {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 20px 16px 100px 16px;
      -webkit-overflow-scrolling: touch;
    }

    /* Hamburger/sidebar toggle button */
    .sidebar-toggle-btn {
      display: none;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border-radius: 8px;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 18px;
      line-height: 1;
      flex-shrink: 0;
      transition: color 0.2s;
    }
    .sidebar-toggle-btn:hover {
      background: transparent;
      color: var(--primary);
    }

    /* Sticky open-bar (replaces the old fixed toggle when sidebar is collapsed) */
    .sidebar-open-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      position: sticky;
      top: 0;
      z-index: 150;
      background: var(--bg-dark, #181C27);
      border-bottom: 1px solid var(--border-card);
    }

    /* Sidebar collapsed state */
    .desktop-sidebar.collapsed {
      width: 0 !important;
      min-width: 0 !important;
      padding: 0 !important;
      overflow: hidden;
      border-right: none;
    }

    /* Study mode selector */
    .study-mode-selector {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 16px;
    }
    .study-mode-btn {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 20px;
      background: var(--bg-card);
      border: 1.5px solid var(--border-card);
      border-radius: 14px;
      cursor: pointer;
      transition: all 0.2s;
      text-align: left;
      color: var(--text-primary);
      font-family: 'DM Sans', sans-serif;
    }
    .study-mode-btn:hover {
      border-color: var(--primary);
      background: rgba(0, 200, 150, 0.07);
    }
    .study-mode-icon { font-size: 24px; }
    .study-mode-title { font-size: 14px; font-weight: 600; margin-bottom: 2px; }
    .study-mode-desc { font-size: 12px; color: var(--text-secondary); }

    /* Search input for subjects */
    .subject-search {
      width: 100%;
      padding: 11px 14px 11px 38px;
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: 10px;
      color: var(--text-primary);
      font-size: 14px;
      font-family: 'DM Sans', sans-serif;
      margin-bottom: 14px;
      transition: border-color 0.2s;
    }
    .subject-search:focus {
      outline: none;
      border-color: var(--primary);
    }
    .subject-search-wrap {
      position: relative;
      margin-bottom: 4px;
    }
    .subject-search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-secondary);
      pointer-events: none;
      display: flex;
      align-items: center;
      line-height: 0;
    }

    /* Category tabs for questions */
    .category-tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 20px;
    }
    .category-tab {
      flex: 1;
      padding: 9px 10px;
      border-radius: 10px;
      border: 1.5px solid var(--border-card);
      background: transparent;
      color: var(--text-secondary);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
      min-height: auto;
      text-transform: none;
      letter-spacing: 0;
      font-family: 'DM Sans', sans-serif;
    }
    .category-tab.active {
      background: var(--primary);
      color: #000;
      border-color: var(--primary);
    }

    /* Quiz question card with better readability */
    .quiz-question-card {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      padding: 20px 22px;
      margin-bottom: 20px;
    }

    @media (min-width: 769px) {
      #root {
        display: flex;
      }

      .desktop-sidebar {
        display: flex;
        transition: width 0.25s ease, min-width 0.25s ease, padding 0.25s ease;
      }

      .desktop-layout .bottom-nav {
        display: none;
      }

      .desktop-layout .screen-content {
        padding: 28px 40px 40px;
      }

      .desktop-layout .flashcard {
        min-height: 360px;
      }

      .desktop-layout .stats-grid {
        grid-template-columns: 1fr 1fr 1fr;
      }

      .desktop-layout .quiz-question {
        font-size: 20px;
      }

      .sidebar-toggle-btn {
        display: flex;
      }
    }

    /* Splash Screen */
    .splash-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      min-height: 0;
      width: 100%;
      height: 100%;
      background: var(--bg-body, linear-gradient(160deg, #181C27 0%, #1D2130 55%, #1B2035 100%));
      gap: 20px;
    }

    .splash-logo-wrap {
      animation: splash-fade-in 0.7s var(--ease-spring, cubic-bezier(0.16, 1, 0.3, 1)) both;
    }

    .splash-logo-inner {
      animation: logo-glow 4s ease-in-out infinite;
      filter: drop-shadow(0 0 6px rgba(0,200,150,0.4)) drop-shadow(0 0 18px rgba(0,200,150,0.2));
    }

    @keyframes logo-glow {
      0%, 100% { filter: drop-shadow(0 0 4px rgba(0,200,150,0.3)) drop-shadow(0 0 12px rgba(0,200,150,0.15)); }
      50%       { filter: drop-shadow(0 0 20px rgba(0,200,150,0.9)) drop-shadow(0 0 40px rgba(0,200,150,0.55)); }
    }

    @keyframes splash-fade-in {
      from { opacity: 0; transform: scale(0.85) translateY(12px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }

    .splash-text {
      font-size: 28px;
      font-family: 'Outfit', sans-serif;
      font-weight: 800;
      color: var(--text-primary, #E5E7EB);
      text-align: center;
      animation: splash-fade-in 0.7s 0.15s var(--ease-spring, cubic-bezier(0.16, 1, 0.3, 1)) both;
      letter-spacing: -0.02em;
    }

    .splash-tagline {
      font-size: 12px;
      font-family: 'DM Sans', sans-serif;
      font-weight: 500;
      color: var(--mint, #00C896);
      text-align: center;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      animation: splash-fade-in 0.7s 0.28s var(--ease-spring, cubic-bezier(0.16, 1, 0.3, 1)) both;
    }

    @keyframes fade-in {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* ── Auth Full-Screen Layout ─────────────────────────────── */
    .auth-page {
      display: flex;
      flex: 1;
      min-height: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: linear-gradient(135deg, #080f1e 0%, #0a1628 50%, #0c1f38 100%);
    }

    /* Left brand panel — shown only on desktop */
    .auth-brand-panel {
      display: none;
      flex-direction: column;
      justify-content: space-between;
      width: 52%;
      min-width: 480px;
      padding: 48px 56px;
      background: linear-gradient(160deg, #0a1e3a 0%, #072040 40%, #061830 100%);
      border-right: 1px solid rgba(0,200,150,0.12);
      position: relative;
      overflow: hidden;
    }

    .auth-brand-panel::before {
      content: '';
      position: absolute;
      top: -120px;
      right: -80px;
      width: 420px;
      height: 420px;
      background: radial-gradient(circle, rgba(0,200,150,0.12) 0%, transparent 70%);
      pointer-events: none;
    }
    .auth-brand-panel::after {
      content: '';
      position: absolute;
      bottom: -100px;
      left: -60px;
      width: 340px;
      height: 340px;
      background: radial-gradient(circle, rgba(0,200,150,0.08) 0%, transparent 70%);
      pointer-events: none;
    }

    .auth-brand-top { position: relative; z-index: 1; }
    .auth-brand-logo {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 56px;
    }
    .auth-brand-logo-text {
      font-family: 'Outfit', sans-serif;
      font-size: 22px;
      font-weight: 800;
      color: #fff;
      letter-spacing: -0.02em;
    }
    .auth-brand-logo-text sup {
      font-size: 0.5em;
      color: #00C896;
      font-weight: 800;
      vertical-align: super;
      line-height: 0;
    }
    .auth-brand-headline {
      font-family: 'Outfit', sans-serif;
      font-size: 36px;
      font-weight: 800;
      color: #fff;
      line-height: 1.2;
      margin-bottom: 16px;
      letter-spacing: -0.02em;
    }
    .auth-brand-headline span { color: #00C896; }
    .auth-brand-sub {
      font-size: 15px;
      color: rgba(255,255,255,0.65);
      line-height: 1.6;
      margin-bottom: 40px;
      max-width: 380px;
    }
    .auth-brand-features {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 48px;
    }
    .auth-brand-feature {
      display: flex;
      align-items: flex-start;
      gap: 14px;
    }
    .auth-brand-feature-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: rgba(0,200,150,0.15);
      border: 1px solid rgba(0,200,150,0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }
    .auth-brand-feature-text strong {
      display: block;
      font-size: 13px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 2px;
    }
    .auth-brand-feature-text span {
      font-size: 12px;
      color: rgba(255,255,255,0.5);
    }

    /* Mascote posicionado no brand panel */
    .auth-brand-mascot-wrap {
      position: relative;
      z-index: 1;
      flex: 1;
      display: flex;
      flex-direction: row;
      align-items: stretch;
      gap: 0;
    }
    .auth-brand-mascot-wrap .auth-brand-top {
      flex: 1;
      min-width: 0;
    }
    .auth-brand-mascot-col {
      width: 180px;
      flex-shrink: 0;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding-top: 52px;
    }
    .auth-brand-mascot-img {
      width: 160px;
      height: auto;
      pointer-events: none;
      user-select: none;
      filter: drop-shadow(0 4px 20px rgba(0,0,0,0.4));
      position: static;
    }
    .auth-brand-tagline {
      font-size: 11px;
      color: rgba(255,255,255,0.3);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      position: relative;
      z-index: 1;
    }

    /* Right form panel */
    .auth-form-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      padding: 40px 32px;
      justify-content: center;
    }
    .auth-form-inner {
      width: 100%;
      max-width: 400px;
      margin: 0 auto;
    }

    /* Mobile logo (shown only on mobile) */
    .auth-mobile-header {
      text-align: center;
      margin-bottom: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .auth-mascot {
      width: 160px;
      height: auto;
      pointer-events: none;
      user-select: none;
      filter: drop-shadow(0 4px 20px rgba(0,0,0,0.22));
      margin: 0 auto 8px;
      display: block;
    }

    @keyframes slide-in {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Desktop breakpoint: show brand panel */
    @media (min-width: 900px) {
      .auth-brand-panel { display: flex; }
      .auth-form-panel { padding: 40px 56px; }
      .auth-mobile-header { display: none; }
    }

    /* Upsell banner (free plan) */
    .upsell-banner {
      background: linear-gradient(135deg, rgba(245,158,11,0.12) 0%, rgba(245,158,11,0.06) 100%);
      border: 1px solid rgba(245,158,11,0.35);
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 20px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }
    .upsell-banner-icon { font-size: 20px; flex-shrink: 0; margin-top: 1px; }
    .upsell-banner-text strong {
      display: block;
      font-size: 13px;
      font-weight: 700;
      color: #F59E0B;
      margin-bottom: 2px;
    }
    .upsell-banner-text span {
      font-size: 12px;
      color: rgba(255,255,255,0.6);
    }
    .upsell-banner-btn {
      margin-left: auto;
      flex-shrink: 0;
      background: #F59E0B;
      color: #000;
      border: none;
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }

    .upsell-banner--demo {
      background: linear-gradient(135deg, rgba(0,200,150,0.14) 0%, rgba(59,130,246,0.08) 100%);
      border: 1px solid rgba(0,200,150,0.35);
    }
    .upsell-banner--demo .upsell-banner-text strong {
      color: #6ee7b7;
    }
    .upsell-banner--demo .upsell-banner-btn {
      background: linear-gradient(135deg, #00C896, #059669);
      color: #0f172a;
    }

    .auth-free-compact-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px 14px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-family: 'Outfit', sans-serif;
      font-size: 12px;
      font-weight: 700;
      background: linear-gradient(135deg, #00C896, #059669);
      color: #0f172a;
      box-shadow: 0 2px 10px rgba(0, 200, 150, 0.28);
      transition: background 0.15s ease, box-shadow 0.15s ease;
    }
    .auth-free-compact-btn:hover:not(:disabled) {
      box-shadow: 0 3px 12px rgba(0, 200, 150, 0.38);
    }
    .auth-free-compact-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* Free access divider */
    .free-access-divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 20px 0 16px;
    }
    .free-access-divider::before,
    .free-access-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(255,255,255,0.08);
    }
    .free-access-divider span {
      font-size: 11px;
      color: rgba(255,255,255,0.35);
      white-space: nowrap;
    }

    .form-group {
      margin-bottom: 24px;
    }

    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-input {
      width: 100%;
      padding: 14px 16px;
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: 12px;
      color: var(--text-primary);
      font-size: 16px;
      font-family: 'DM Sans', sans-serif;
      transition: all 0.2s ease;
    }

    .form-input:focus {
      outline: none;
      border-color: var(--primary);
      background: rgba(0, 200, 150, 0.1);
    }

    .form-input::placeholder {
      color: var(--text-secondary);
    }

    .code-input-group {
      display: flex;
      gap: 8px;
      justify-content: space-between;
      margin-bottom: 24px;
    }

    .code-input-group input {
      flex: 1;
      padding: 12px;
      text-align: center;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 2px;
    }

    .fingerprint-display {
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 24px;
      font-size: 11px;
      color: var(--text-secondary);
      font-family: 'Courier New', monospace;
      word-break: break-all;
      max-height: 100px;
      overflow-y: auto;
    }

    .btn {
      padding: 14px 20px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: 'DM Sans', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 48px;
    }

    .btn-primary {
      background: var(--primary);
      color: #000;
      width: 100%;
    }

    .btn-primary:active {
      transform: scale(0.98);
      background: #0099B8;
    }

    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-secondary {
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      color: var(--text-primary);
      width: 100%;
    }

    .btn-secondary:active {
      background: rgba(255, 255, 255, 0.08);
    }

    .btn-small {
      padding: 8px 12px;
      font-size: 14px;
      min-height: auto;
    }

    .btn-success {
      background: var(--success);
      color: #000;
    }

    .btn-warning {
      background: var(--warning);
      color: #000;
    }

    .btn-error {
      background: var(--error);
      color: #fff;
    }

    .error-message {
      color: var(--error);
      font-size: 13px;
      margin-top: 8px;
    }

    .success-message {
      color: var(--success);
      font-size: 13px;
      margin-top: 8px;
    }

    /* Dashboard */
    .home-screen-content {
      flex: 1;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      padding: 16px 16px 0;
    }
    .dashboard-header {
      margin-bottom: 12px;
      padding-top: 4px;
    }

    .dashboard-welcome {
      font-size: 24px;
      font-family: 'Outfit', sans-serif;
      margin-bottom: 4px;
    }

    .dashboard-date {
      font-size: 13px;
      color: var(--text-secondary);
    }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
      margin-bottom: 12px;
    }

    .stat-card {
      background: var(--surface-2);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      padding: 14px 10px;
      text-align: center;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      min-width: 0;
      overflow: hidden;
    }

    .stat-icon {
      color: var(--primary);
      opacity: 0.75;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .stat-value {
      font-size: 20px;
      font-weight: 700;
      color: var(--primary);
      line-height: 1;
      margin-bottom: 2px;
      font-family: 'Outfit', sans-serif;
    }

    .stat-label {
      font-size: 10px;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.6px;
      font-weight: 600;
      width: 100%;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .daily-suggestion {
      background: linear-gradient(135deg, rgba(0, 200, 150, 0.12), rgba(0, 200, 150, 0.12));
      border: 1px solid rgba(0, 200, 150, 0.2);
      border-radius: 14px;
      padding: 14px 16px;
      margin-bottom: 12px;
      box-shadow: var(--shadow-sm);
    }

    .suggestion-cta {
      margin-top: 14px;
      background: var(--primary);
      color: #000;
      border: none;
      border-radius: 10px;
      padding: 10px 20px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      transition: opacity var(--duration-fast) ease, transform var(--duration-fast) var(--ease-spring);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: 'DM Sans', sans-serif;
      min-height: 40px;
    }

    .suggestion-cta:active {
      opacity: 0.85;
      transform: scale(0.97);
    }

    .suggestion-label {
      font-size: 11px;
      color: var(--purple);
      text-transform: uppercase;
      font-weight: 600;
      margin-bottom: 8px;
      letter-spacing: 0.5px;
    }

    .suggestion-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 12px;
    }

    .suggestion-progress {
      background: var(--bg-card);
      height: 6px;
      border-radius: 3px;
      overflow: hidden;
      margin-bottom: 8px;
    }

    .suggestion-progress-bar {
      height: 100%;
      background: var(--primary);
      transition: width 0.3s ease;
    }

    .suggestion-meta {
      font-size: 12px;
      color: var(--text-secondary);
    }

    .section-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 16px;
      margin-top: 24px;
    }

    .subjects-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .subject-card {
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: 12px;
      padding: 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .subject-card:active {
      background: rgba(0, 200, 150, 0.1);
      border-color: var(--primary);
    }

    .subject-icon {
      width: 48px;
      height: 48px;
      border-radius: 10px;
      background: rgba(0, 200, 150, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      flex-shrink: 0;
    }

    .subject-info {
      flex: 1;
    }

    .subject-name {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 4px;
    }

    .subject-meta {
      font-size: 12px;
      color: var(--text-secondary);
    }

    .subject-arrow {
      color: var(--text-secondary);
    }

    /* Flashcards Screen */
    .flashcards-header {
      margin-bottom: 24px;
    }

    .filter-bar {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      margin-bottom: 24px;
      padding-bottom: 8px;
      -webkit-overflow-scrolling: touch;
    }

    .filter-bar::-webkit-scrollbar {
      display: none;
    }

    .filter-btn {
      padding: 8px 16px;
      border-radius: 20px;
      border: 1px solid var(--border-card);
      background: transparent;
      color: var(--text-secondary);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
    }

    .filter-btn.active {
      background: var(--primary);
      color: #000;
      border-color: var(--primary);
    }

    .flashcard-container {
      margin-bottom: 24px;
    }

    .flashcard {
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: 16px;
      min-height: 320px;
      height: 320px;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      perspective: 1000px;
      transition: all 0.2s ease;
      position: relative;
      overflow: hidden;
    }

    .flashcard::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(135deg, rgba(0, 200, 150, 0.1), transparent);
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }

    .flashcard:active::before {
      opacity: 1;
    }

    .flashcard-inner {
      width: 100%;
      height: 100%;
      transition: transform 0.6s;
      transform-style: preserve-3d;
      position: relative;
    }

    .flashcard-inner.flipped {
      transform: rotateY(180deg);
    }

    .flashcard-front, .flashcard-back {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      backface-visibility: hidden;
      text-align: center;
      padding: 24px;
      overflow-y: auto;
    }

    .flashcard-back {
      transform: rotateY(180deg);
    }

    .flashcard-label {
      font-size: 11px;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 600;
    }

    .flashcard-text {
      font-size: 18px;
      line-height: 1.5;
      color: var(--text-primary);
      word-wrap: break-word;
    }

    .flashcard-progress {
      width: 100%;
      padding: 0 16px;
      margin-bottom: 20px;
    }

    .progress-dots {
      display: flex;
      gap: 6px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .progress-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
    }

    .progress-dot.current {
      background: var(--primary);
      width: 8px;
      height: 8px;
    }

    .progress-dot.completed {
      background: var(--success);
    }

    .flashcard-actions {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      width: 100%;
      margin-top: 24px;
    }

    .rate-btn {
      padding: 10px;
      border: 1px solid var(--border-card);
      border-radius: 8px;
      background: var(--bg-card);
      color: var(--text-primary);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .rate-btn.error {
      border-color: var(--error);
      color: var(--error);
    }

    .rate-btn.error:active {
      background: rgba(239, 68, 68, 0.1);
    }

    .rate-btn.warning {
      border-color: var(--warning);
      color: var(--warning);
    }

    .rate-btn.warning:active {
      background: rgba(245, 158, 11, 0.1);
    }

    .rate-btn.success {
      border-color: var(--success);
      color: var(--success);
    }

    .rate-btn.success:active {
      background: rgba(16, 185, 129, 0.1);
    }

    /* Anki-style flashcard enhancements */
    .flashcard-hint {
      fontSize: 12px;
      color: var(--text-secondary);
      margin-top: 8px;
      opacity: 0.6;
      font-size: 12px;
    }

    .flashcard-answer {
      font-size: 16px;
      line-height: 1.6;
    }

    .flashcard-explanation {
      font-size: 12px;
      line-height: 1.5;
      color: var(--text-secondary);
      opacity: 0.5;
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      text-align: left;
      width: 100%;
    }

    .anki-actions {
      margin-top: 16px;
    }

    .anki-actions .rate-btn {
      font-size: 14px;
      font-weight: 700;
      padding: 14px 10px;
      flex-direction: row;
      justify-content: center;
      gap: 8px;
    }

    .rate-shortcut {
      font-size: 10px;
      opacity: 0.5;
      background: rgba(255, 255, 255, 0.08);
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 500;
    }

    /* Quiz keyboard hints */
    .kbd-hint {
      font-size: 10px;
      opacity: 0.5;
      background: rgba(255, 255, 255, 0.08);
      padding: 2px 6px;
      border-radius: 4px;
      margin-left: 8px;
      font-weight: 500;
    }

    .quiz-option-number {
      font-size: 11px;
      font-weight: 600;
      opacity: 0.4;
      min-width: 18px;
      height: 18px;
      border-radius: 4px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.06);
      margin-right: 8px;
      flex-shrink: 0;
    }

    .quiz-action-bar {
      margin-top: 16px;
    }

    .subject-card-empty {
      opacity: 0.45;
    }

    .subject-card-empty .subject-select-meta {
      font-style: italic;
    }

    .session-complete {
      text-align: center;
      padding: 40px 0;
    }

    .session-icon {
      font-size: 80px;
      margin-bottom: 24px;
      animation: bounce 0.6s ease;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .session-title {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 16px;
    }

    .session-stats {
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 24px;
    }

    .session-stat {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid var(--border-card);
    }

    .session-stat:last-child {
      border-bottom: none;
    }

    .session-stat-label {
      color: var(--text-secondary);
      font-size: 13px;
    }

    .session-stat-value {
      font-size: 18px;
      font-weight: 700;
      color: var(--primary);
    }

    /* Quiz Screen */
    .quiz-header {
      margin-bottom: 24px;
    }

    .quiz-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .quiz-item {
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: 12px;
      padding: 16px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .quiz-item:active {
      background: rgba(0, 200, 150, 0.1);
      border-color: var(--primary);
    }

    .quiz-subject {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 4px;
    }

    .quiz-count {
      font-size: 12px;
      color: var(--text-secondary);
    }

    .quiz-screen {
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .quiz-progress-section {
      margin-bottom: 24px;
    }

    .quiz-progress-bar {
      width: 100%;
      height: 4px;
      background: var(--bg-card);
      border-radius: 2px;
      overflow: hidden;
      margin-bottom: 12px;
    }

    .quiz-progress-fill {
      height: 100%;
      background: var(--primary);
      transition: width 0.3s ease;
    }

    .quiz-counter {
      font-size: 12px;
      color: var(--text-secondary);
    }

    .quiz-question {
      font-size: 18px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .quiz-options {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 24px;
    }

    .quiz-option {
      padding: 14px;
      background: var(--bg-card);
      border: 2px solid var(--border-card);
      border-radius: 12px;
      color: var(--text-primary);
      cursor: pointer;
      transition: all 0.2s ease;
      font-size: 14px;
      text-align: left;
    }

    .quiz-option:active {
      border-color: var(--primary);
    }

    .quiz-option.selected {
      border-color: var(--primary);
      background: rgba(0, 200, 150, 0.1);
    }

    .quiz-option.correct {
      border-color: var(--success);
      background: rgba(16, 185, 129, 0.1);
    }

    .quiz-option.incorrect {
      border-color: var(--error);
      background: rgba(239, 68, 68, 0.1);
    }

    .quiz-option.crossed-out {
      text-decoration: line-through;
      opacity: 0.35;
      pointer-events: none;
      border-color: var(--border-card);
      background: transparent;
    }

    .quiz-option {
      position: relative;
      padding-right: 44px;
    }

    .cross-btn {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 1px solid var(--border-card);
      background: transparent;
      color: var(--text-secondary);
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      padding: 0;
      min-height: auto;
      text-transform: none;
      letter-spacing: 0;
    }

    .cross-btn:hover {
      border-color: var(--error);
      color: var(--error);
      background: rgba(239, 68, 68, 0.1);
      transform: translateY(-50%);
      box-shadow: none;
    }

    .quiz-feedback {
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 24px;
      font-size: 13px;
      line-height: 1.6;
    }

    .quiz-feedback-title {
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--text-primary);
    }

    .quiz-result-screen {
      text-align: center;
      padding: 40px 0;
    }

    .quiz-score {
      font-size: 72px;
      font-weight: 800;
      color: var(--primary);
      margin-bottom: 16px;
    }

    .quiz-time {
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 32px;
    }

    .materials-mod-chips-label {

    .materials-mod-subgroup {

    .materials-mod-subgroup:last-child {

    .materials-mod-title {

    .material-subject {

    .material-badge {

    /* ── Material Document Layout ─────────────────────────────── */
    .material-doc-outer {
      display: flex;
      justify-content: center;
      width: 100%;
    }

    .material-doc-inner {
      max-width: 960px;
      width: 100%;

    }

    /* Briefing ### Figura sugerida é removido no app; resta aviso “em breve” até haver URL no JSON */
    .markdown-body .material-fig-placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-height: 56px;

    }
