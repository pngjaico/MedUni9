      );
    };

    const MATERIALS_CYCLES = [
      { id: 'basico', label: 'Ciclo Básico', sub: 'Módulos 1 a 4', min: 1, max: 4, anchor: 'materials-cycle-basico' },
      { id: 'clinico', label: 'Ciclo Clínico', sub: 'Módulos 5 a 8', min: 5, max: 8, anchor: 'materials-cycle-clinico' },
      { id: 'internato', label: 'Internato', sub: 'Módulos 9 a 12', min: 9, max: 12, anchor: 'materials-cycle-internato' },
    ];

    function getMaterialsCycleForModule(modulo) {
      const n = parseInt(modulo, 10);
      if (!Number.isFinite(n)) return null;
      return MATERIALS_CYCLES.find(c => n >= c.min && n <= c.max) || null;
    }

    function getInitialMaterialsModuleFilter(userSemester) {
      const n = parseInt(userSemester, 10);
      const base = { basico: null, clinico: null, internato: null };
      const cycle = getMaterialsCycleForModule(n);
      if (cycle) base[cycle.id] = n;
      return base;
    }

      if (!cu) return false;
      const em = normalizeAuthEmail(cu.email || '');
      return MATERIAL_ADMIN_EMAILS.includes(em) && cu.emailVerified === true;

    function isListedMaterialAdminAuth() {

    const MaterialsScreen = ({ materias, materiasCatalog, user, userSemester, onNavigateTo, initialMateriaId, initialTemaId, onRouteChange }) => {

      const [toInstLoading, setToInstLoading] = useState(false);
      const [toInstError, setToInstError] = useState('');
      const [toInstItems, setToInstItems] = useState(null);
      const [toInstTitulo, setToInstTitulo] = useState('');
      const [toGuideSearch, setToGuideSearch] = useState('');
      const [toQuiz, setToQuiz] = useState(null);

      const [toImgBroken, setToImgBroken] = useState({});
      const [toQuizInlineWarn, setToQuizInlineWarn] = useState('');

      useEffect(() => {
        setModuleFilterByCycle((prev) => {
          const n = parseInt(userSemester, 10);
          const cycle = getMaterialsCycleForModule(n);
          if (!cycle || prev[cycle.id] != null) return prev;
          return { ...prev, [cycle.id]: n };
        });
      }, [userSemester]);

      useEffect(() => {
        if (!initialMateriaId || !materias.length) return;
        const materia = materias.find(m => m.id === initialMateriaId);
        if (!materia) return;
        const modulo = parseInt(materia.modulo ?? materia.semestre, 10);
        const cycle = getMaterialsCycleForModule(modulo);
        setExpandedMaterias(prev => ({ ...prev, [initialMateriaId]: true }));
        if (cycle) {
          setModuleFilterByCycle(prev => ({ ...prev, [cycle.id]: modulo }));
        }
        setTimeout(() => {
          const el = document.getElementById(`material-subject-${initialMateriaId}`);
          if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }, 0);
      }, [initialMateriaId, materias]);

      // ── Material Mini Quiz Component (Inner Scope) ──────────────────────────
      const MaterialMiniQuiz = ({ materialId }) => {
        const [phase, setPhase] = useState('quiz');
        const [current, setCurrent] = useState(0);
        const [selected, setSelected] = useState(null);
        const [answered, setAnswered] = useState(false);
        const [score, setScore] = useState(0);

        const qs = useMemo(() => {
          return parseMdMiniQuiz(materialContent);
        }, [materialContent]);

        useEffect(() => {
          setPhase('quiz'); setCurrent(0); setSelected(null); setAnswered(false); setScore(0);
        }, [materialId]);

        if (qs.length === 0) {
          return (
            <div className="material-mini-quiz material-mini-quiz--empty" style={{ display: 'flex', alignItems: 'center', gap: '14px', padding: '16px 20px' }}>
              <span style={{ fontSize: '18px' }}>⚡</span>
              <div style={{ flex: 1 }}>
                <div style={{ fontFamily: 'Outfit', fontSize: 13, fontWeight: 700, color: 'var(--primary)', textTransform: 'uppercase', letterSpacing: '0.05em', marginBottom: 2 }}>
                  Fixação Rápida <span className="material-badge" style={{ marginLeft: 4, verticalAlign: 'middle' }}>BETA</span>
                </div>
                <div style={{ fontSize: 12, color: 'var(--text-secondary)' }}>Questões conceituais em breve para esta aula.</div>
              </div>
              <span className="material-badge" style={{ flexShrink: 0 }}>Em breve</span>
            </div>
          );
        }

        const q = qs[current];
        const progress = ((current + (answered ? 1 : 0)) / qs.length) * 100;

        const handleConfirm = () => {
          if (selected === null) return;
          if (selected === q.correta) setScore(s => s + 1);
          setAnswered(true);
        };

        const handleNext = () => {
          if (current < qs.length - 1) { setCurrent(c => c + 1); setSelected(null); setAnswered(false); }
          else setPhase('result');
        };

        const handleReset = () => { setPhase('quiz'); setCurrent(0); setSelected(null); setAnswered(false); setScore(0); };

        if (phase === 'result') {
          const pct = Math.round((score / qs.length) * 100);
          const great = pct >= 70;
          return (
            <div className="material-mini-quiz" style={{ margin: '24px 0 16px', borderRadius: '16px', border: '1px solid rgba(255, 255, 255, 0.08)', borderTop: '2px solid var(--primary)', background: 'rgba(0, 200, 150, 0.04)', overflow: 'hidden' }}>
              <div className="material-mini-quiz-result" style={{ padding: '30px 20px', textAlign: 'center' }}>
                <div style={{ fontSize: 32, marginBottom: 12 }}>{great ? '🎯' : '📚'}</div>
                <div style={{ fontFamily: 'Outfit', fontWeight: 800, fontSize: 24, color: great ? 'var(--primary)' : 'var(--text-primary)', marginBottom: 6 }}>{pct}%</div>
                <div style={{ fontSize: 13, color: 'var(--text-secondary)', marginBottom: 20 }}>
                  {score} de {qs.length} corretas · {great ? 'Ótimo trabalho!' : 'Continue revisando.'}
                </div>
                <button className="material-mini-quiz-btn material-mini-quiz-btn--secondary" onClick={handleReset}>Tentar novamente</button>
              </div>
            </div>
          );
        }

        return (
          <div className="material-mini-quiz" style={{ margin: '24px 0 16px', borderRadius: '16px', border: '1px solid rgba(255, 255, 255, 0.08)', borderTop: '2px solid var(--primary)', background: 'rgba(0, 200, 150, 0.05)', overflow: 'hidden' }}>
            {/* Header removido para evitar duplicidade com o container externo */}
            
            <div className="material-mini-quiz-progress" style={{ height: 3, background: 'rgba(255, 255, 255, 0.08)', margin: '0 20px', borderRadius: 2, overflow: 'hidden' }}>
              <div className="material-mini-quiz-progress-fill" style={{ width: `${progress}%`, height: '100%', background: 'var(--primary)', boxShadow: '0 0 8px var(--primary)', transition: 'width 0.4s cubic-bezier(0.16, 1, 0.3, 1)' }} />
            </div>

            <div className="material-mini-quiz-body" style={{ padding: '20px 20px 20px' }} key={current}>
              <div className="material-mini-quiz-question" style={{ fontSize: 15, fontWeight: 500, color: '#FFF', lineHeight: 1.6, marginBottom: 20 }}>{q.pergunta}</div>
              
              <div className="material-mini-quiz-options" style={{ display: 'flex', flexDirection: 'column', gap: 10, marginBottom: 20 }}>
                {q.opcoes.map((op, idx) => {
                  let cls = 'material-mini-quiz-option';
                  if (answered && idx === q.correta) cls += ' correct';
                  else if (answered && idx === selected && idx !== q.correta) cls += ' incorrect';
                  else if (!answered && idx === selected) cls += ' selected';
                  
                  return (
                    <button key={idx} className={cls} onClick={() => !answered && setSelected(idx)} disabled={answered}
                      style={{ display: 'flex', alignItems: 'center', gap: 12, padding: '12px 16px', borderRadius: 12, width: '100%', textAlign: 'left', border: '1px solid rgba(255, 255, 255, 0.07)', background: 'rgba(255, 255, 255, 0.03)', color: '#FFF', cursor: 'pointer' }}>
                      <span className="material-mini-quiz-option-letter" 
                        style={{ width: 24, height: 24, borderRadius: 6, background: (selected === idx && !answered) ? 'var(--primary)' : 'rgba(255, 255, 255, 0.1)', color: (selected === idx && !answered) ? '#000' : 'var(--text-secondary)', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 11, fontWeight: 800, flexShrink: 0 }}>
                        {String.fromCharCode(65 + idx)}
                      </span>
                      <span style={{ fontSize: 14 }}>{op}</span>
                    </button>
                  );
                })}
              </div>

              {answered && q.explicacao && (
                <div className="material-mini-quiz-feedback" style={{ fontSize: 13, lineHeight: 1.6, color: 'var(--text-secondary)', padding: '14px 16px', borderRadius: 12, background: 'rgba(255, 255, 255, 0.04)', border: '1px solid rgba(255, 255, 255, 0.1)', marginBottom: 20 }}>{q.explicacao}</div>
              )}

              <div className="material-mini-quiz-action" style={{ display: 'flex', justifyContent: 'flex-end' }}>
                {!answered ? (
                  <button className="material-mini-quiz-btn material-mini-quiz-btn--primary" onClick={handleConfirm} disabled={selected === null}>Confirmar</button>
                ) : (
                  <button className="material-mini-quiz-btn material-mini-quiz-btn--primary" onClick={handleNext}>
                    {current < qs.length - 1 ? 'Próxima →' : 'Ver resultado →'}
                  </button>
                )}
              </div>
            </div>
          </div>
        );
      };
      const materialBaseMdRef = useRef('');
      const materialAdminTextareaRef = useRef(null);
      const [materialHasFirestoreOverride, setMaterialHasFirestoreOverride] = useState(false);
      const [materialAdminEditMode, setMaterialAdminEditMode] = useState(false);
      const [materialAdminDraft, setMaterialAdminDraft] = useState('');
      const [materialAdminBusy, setMaterialAdminBusy] = useState(false);
      const [materialAdminMsg, setMaterialAdminMsg] = useState('');

      useEffect(() => {
        let cancelled = false;
        fetch('/data/materiais_figuras.json')
          .then((r) => (r.ok ? r.json() : null))
          .then((j) => {
            if (cancelled) return;
            if (j && Array.isArray(j.entries)) setFigurasCatalog(j);
            else setFigurasCatalog({ version: 1, entries: [] });
          })
          .catch(() => {
            if (!cancelled) setFigurasCatalog({ version: 1, entries: [] });
          });
        return () => { cancelled = true; };
      }, []);

      useEffect(() => {
        let cancelled = false;
        fetchResumoA4Manifest()
          .then((manifest) => {
            if (cancelled) return;
            setResumosA4Manifest(manifest);
            setResumosA4ManifestError('');
          })
          .catch((err) => {
            if (cancelled) return;
            setResumosA4Manifest({ schemaVersion: 1, items: [] });
            setResumosA4ManifestError(err?.message || 'Nao foi possivel carregar os resumos didaticos.');
          });
        return () => { cancelled = true; };
      }, []);

      const figurasDestaAulaComLink = useMemo(() => {
        if (!figurasCatalog?.entries || !selectedMaterial?.temaId) return [];
        return figurasCatalog.entries.filter(
          (e) => e.aula === selectedMaterial.temaId && e.usarNoMaterial !== false && String(e.urlImagem || '').trim()
        );
      }, [figurasCatalog, selectedMaterial?.temaId]);

      const figurasPlanejadasCount = useMemo(() => {
        if (!figurasCatalog?.entries || !selectedMaterial?.temaId) return 0;
        return figurasCatalog.entries.filter((e) => e.aula === selectedMaterial.temaId && e.usarNoMaterial !== false).length;
      }, [figurasCatalog, selectedMaterial?.temaId]);

      /** Figuras com URL que não têm slot inline no texto (sem **Figura-ID:** no .md antes do Pré-Prova). */
      const figurasRodapeAula = useMemo(() => {
        if (!materialContent || !figurasDestaAulaComLink.length) return [];
        const preRe = /^## Pr(?:e|\u00e9)[- ]?Prova/im;
        const pre = preRe.exec(materialContent);
        const main = pre ? materialContent.slice(0, pre.index) : materialContent;
        const inlineIds = new Set();
        const idRe = /\*\*Figura-ID:\*\*\s*`?([A-Z0-9-]+)`?/gi;
        let mm;
        while ((mm = idRe.exec(main))) inlineIds.add(mm[1]);
        const slotRe = /<!--\s*IMG_SLOT\b([\s\S]*?)-->/gi;
        let slotMatch;
        while ((slotMatch = slotRe.exec(main))) {
          const attrs = slotMatch[1] || '';
          const attrId = attrs.match(/\bid\s*=\s*["']([^"']+)["']/i)?.[1];
          const tokenId = attrs.match(/^\s*([A-Z0-9-]+)/i)?.[1];
          const figId = (attrId || tokenId || '').trim();
          if (figId) inlineIds.add(figId);
        }
        return figurasDestaAulaComLink.filter((f) => !inlineIds.has(f.id));
      }, [materialContent, figurasDestaAulaComLink]);

      // Split markdown safely into Main, Quiz and Pré-Prova
      const splitMaterialContent = (content) => {
        if (!content) return { main: '', preProva: null, hasQuiz: false };
        
        const quizMarker = /^#{2,3}\s*Mini\s*Quiz/im;
        const preMarker = /^## Pr(?:e|\u00e9)[- ]?Prova/im;
        
        const quizMatch = quizMarker.exec(content);
        const preMatch = preMarker.exec(content);
        
        // Find indices
        const qIdx = quizMatch ? quizMatch.index : Infinity;
        const pIdx = preMatch ? preMatch.index : Infinity;
        const firstIdx = Math.min(qIdx, pIdx);
        
        let main = firstIdx === Infinity ? content : content.slice(0, firstIdx).trim();
        let preProva = null;
        
        if (preMatch) {
          // Get everything starting from Pré-Prova
          const sub = content.slice(pIdx);
          // But only until the next big header (if any)
          // Actually, our convention is that Pré-Prova is near the end.
          // Let's just take the section content properly.
          const parts = sub.split(/^#{2,3}\s*Mini\s*Quiz/im); 
          preProva = parts[0].trim();
        }
        
        return { main, preProva, hasQuiz: !!quizMatch };
      };

      // Post-process markdown header: breadcrumb + meta pills
      useEffect(() => {
        if (!markdownRef.current || !materialContent) return;
        const root = markdownRef.current;

        // --- Breadcrumb: only direct <p> children at the top (not inside lists/quotes) ---
        const directTopPs = Array.from(root.children).filter(el => el.tagName === 'P').slice(0, 3);
        const bcP = directTopPs.find(p => p.textContent.includes('→'));
        if (bcP && !bcP.classList.contains('md-breadcrumb')) {
          const parts = bcP.textContent.split('→').map(s => s.trim()).filter(Boolean);
          bcP.className = 'md-breadcrumb';
          bcP.innerHTML = parts.map((part, i) =>
            `<span class="bc-item${i === parts.length - 1 ? ' current' : ''}">${part}</span>${i < parts.length - 1 ? '<span class="bc-sep">›</span>' : ''}`
          ).join('');
        }

        // --- Meta pills: only direct <p> children at the top ---
        const normalizeMetaParts = (p) => {
          const holder = document.createElement('div');
          holder.innerHTML = p.innerHTML
            .replace(/<br\s*\/?>/gi, ' · ')
            .replace(/\s*\|\s*/g, ' · ');
          return holder.textContent
            .split('·')
            .map(s => s.replace(/\s+/g, ' ').trim())
            .filter(Boolean);
        };
        const escapeMetaHtml = (value) => String(value ?? '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
        const metaP = directTopPs.find(p => {
          const text = p.textContent || '';
          return text.includes('⏱')
            || text.includes('min ·')
            || /Disciplina:\s|M[oó]dulo:\s|Tempo de estudo sugerido:\s/i.test(text);
        });
        if (metaP && !metaP.classList.contains('md-meta')) {
          const parts = normalizeMetaParts(metaP);
          metaP.className = 'md-meta';
          metaP.innerHTML = parts.map(p =>
            `<span class="md-meta-pill">${escapeMetaHtml(p)}</span>`
          ).join('');
        }
      }, [materialContent, selectedMaterial]);

      // Hidratar slots .material-fig-slot com imagens do catálogo (inline no texto)
      useEffect(() => {
        if (!markdownRef.current || !figurasCatalog?.entries) return;
        const root = markdownRef.current;
        const slots = root.querySelectorAll('.material-fig-slot[data-fig-id]');
        slots.forEach((slot) => {
          const id = slot.getAttribute('data-fig-id');
          if (!id) return;
          const fig = figurasCatalog.entries.find((e) => e.id === id);
          if (!fig) {
            slot.innerHTML = MATERIAL_FIG_PENDING_HTML;
            return;
          }
          if (String(fig.urlImagem || '').trim()) {
            slot.innerHTML = buildMaterialFigureHtml(fig);
            slot.classList.add('material-fig-slot--filled');
          } else {
            slot.innerHTML = MATERIAL_FIG_PENDING_HTML;
          }
        });
      }, [materialContent, figurasCatalog, selectedMaterial?.path, selectedMaterial?.temaId]);

      // Enable interactive checkboxes with localStorage persistence
      useEffect(() => {
        if (!markdownRef.current || !selectedMaterial) return;
        const key = `checklist_${selectedMaterial.path}`;
        const saved = JSON.parse(localStorage.getItem(key) || '{}');
        const boxes = markdownRef.current.querySelectorAll('input[type="checkbox"]');
        boxes.forEach((cb, i) => {
          cb.removeAttribute('disabled');
          cb.checked = !!saved[i];
          cb.style.cursor = 'pointer';
          cb.style.accentColor = '#00C896';
          cb.style.width = '15px';
          cb.style.height = '15px';
          cb.style.marginRight = '6px';
          cb.style.verticalAlign = 'middle';
          cb.addEventListener('change', () => {
            saved[i] = cb.checked;
            localStorage.setItem(key, JSON.stringify(saved));
          });
        });
      }, [materialContent, selectedMaterial]);

      // Highlight (Grifar) logic - Temporary session only
      useEffect(() => {
        if (!markdownRef.current || !materialContent) return;
        return setupHighlighter(markdownRef.current);
      }, [materialContent, selectedMaterial]);

      const toggleMateria = (id) => {
        setExpandedMaterias(prev => ({ ...prev, [id]: !prev[id] }));
      };

      const getResumoA4ItemsForMateria = (materiaId) => {
        return (resumosA4Manifest?.items || [])
          .filter((item) => item?.materiaId === materiaId)
          .sort((a, b) => String(a.aulaId || '').localeCompare(String(b.aulaId || ''), 'pt-BR', { numeric: true }));
      };

      const openResumoDidaticoMateria = (materia) => {
        const items = getResumoA4ItemsForMateria(materia.id);
        if (!items.length) {
          const message = resumosA4ManifestError || 'Resumo didatico ainda indisponivel para esta disciplina.';
          toast.error(message);
          return;
        }
        setSelectedMaterial(null);
        setMaterialContent('');
        setMaterialError('');
        setMaterialAdminEditMode(false);
        setMaterialAdminDraft('');
        setMaterialAdminMsg('');
        setMaterialHasFirestoreOverride(false);
        setResumoDidaticoMateria({
          id: materia.id,
          nome: materia.nome || materia.sigla || materia.id,
          sigla: materia.sigla || materia.id,
          cor: materia.cor || 'var(--primary)',
        });
        setResumoA4Error('');
        setShowResumoA4(false);
        setResumoA4(null);
        setResumoTrace(null);
        if (onRouteChange) onRouteChange('materials', { materiaId: materia.id });
        setTimeout(() => window.scrollTo({ top: 0, behavior: 'smooth' }), 0);
      };

      const handleReportMaterial = () => {
        if (!selectedMaterial) return;
        const reason = prompt('Descreva o erro no material (opcional):', '');
        if (reason === null) return;

        submitContentFeedback({
          origem: 'materiais',
          mensagem: reason?.trim() || 'Erro reportado em material',
          itemId: `${selectedMaterial.materiaId || ''}:${selectedMaterial.temaId || ''}`,
          materia: selectedMaterial.materiaId || '',
          tema: selectedMaterial.temaId || '',
          contexto: {
            materiaNome: selectedMaterial.materiaNome,
            temaNome: selectedMaterial.temaNome,
            path: selectedMaterial.path
          }
        })
          .then(() => alert('Reporte enviado para o admin. Obrigado!'))
          .catch(() => alert('Nao foi possivel enviar agora. Tente novamente em instantes.'));
      };

      const handleOpenResumoA4 = async () => {
        if (!selectedMaterial?.materiaId || !selectedMaterial?.temaId) return;
        setResumoA4Loading(true);
        setResumoA4Error('');
        try {
          const resumo = await fetchResumoA4(selectedMaterial.materiaId, selectedMaterial.temaId);
          const trace = await createResumoTrace(resumo);
          setResumoA4(resumo);
          setResumoTrace(trace);
          setShowResumoA4(true);
          setTimeout(() => window.scrollTo({ top: 0, behavior: 'smooth' }), 0);
        } catch (err) {
          const message = err?.message || 'Nao foi possivel abrir o Resumo A4.';
          setResumoA4Error(message);
          toast.error(message);
        } finally {
          setResumoA4Loading(false);
        }
      };

      const handleOpenResumoA4Item = async (item) => {
        if (!item?.materiaId || !item?.aulaId) return;
        setResumoA4Loading(true);
        setResumoA4Error('');
        try {
          const resumo = await fetchResumoA4(item.materiaId, item.aulaId, item.path);
          const trace = await createResumoTrace(resumo);
          setResumoA4(resumo);
          setResumoTrace(trace);
          setShowResumoA4(true);
          setTimeout(() => window.scrollTo({ top: 0, behavior: 'smooth' }), 0);
        } catch (err) {
          const message = err?.message || 'Nao foi possivel abrir o Resumo Didatico.';
          setResumoA4Error(message);
          toast.error(message);
        } finally {
          setResumoA4Loading(false);
        }
      };

      const handleCloseResumoA4 = () => {
        setShowResumoA4(false);
        setResumoA4Error('');
        if (onRouteChange) onRouteChange('home');
      };

      const resolveTemaId = (materia, tema) => {
        if (tema?.id) return tema.id;
        const aulas = Array.isArray(materia?.aulas) ? materia.aulas : [];
        if (!aulas.length) return null;

        const byNome = aulas.find(a => normalizeText(a.tema) === normalizeText(tema?.nome || ''));
        if (byNome?.id) return byNome.id;

        const byDesc = aulas.find(a => normalizeText(a.descricao) === normalizeText(tema?.descricao || ''));
        if (byDesc?.id) return byDesc.id;

        return null;
      };

      const openMaterial = async (materia, tema, options = {}) => {
        const { updateHash = true } = options;
        const modulo = materia.modulo || materia.semestre;
        const temaId = resolveTemaId(materia, tema);

        if (!temaId) {
          setSelectedMaterial({
            materiaNome: materia.nome,
            temaNome: tema.nome,
            path: 'sem-id',
            materiaId: materia.id,
            temaId: null,
          });
          setMaterialContent('');
          setMaterialError('Nao foi possivel identificar o ID da aula para abrir o material.');
          setMaterialLoading(false);
          setShowResumoA4(false);
          setResumoA4(null);
          setResumoTrace(null);
          setResumoA4Error('');
          setResumoDidaticoMateria(null);
          return;
        }

        const primaryPath = `materiais/modulo${modulo}/${materia.id}/${temaId}.md`;
        const fallbackPaths = [
          primaryPath,
          `/materiais/modulo${modulo}/${materia.id}/${temaId}.md`,
          `materiais/modulo1/${materia.id}/${temaId}.md`,
          `materiais/modulo2/${materia.id}/${temaId}.md`,
          `materiais/modulo3/${materia.id}/${temaId}.md`,
          `materiais/modulo4/${materia.id}/${temaId}.md`,
          `materiais/modulo5/${materia.id}/${temaId}.md`,
          `materiais/modulo6/${materia.id}/${temaId}.md`,
          `materiais/modulo7/${materia.id}/${temaId}.md`,
          `materiais/modulo8/${materia.id}/${temaId}.md`,
          `materiais/modulo9/${materia.id}/${temaId}.md`,
          `materiais/modulo10/${materia.id}/${temaId}.md`,
          `materiais/modulo11/${materia.id}/${temaId}.md`,
          `materiais/modulo12/${materia.id}/${temaId}.md`,
        ];

        setSelectedMaterial({
          materiaNome: materia.nome,
          temaNome: tema.nome,
          path: primaryPath,
          materiaId: materia.id,
          temaId,
        });
        setMaterialContent('');
        setMaterialError('');
        setMaterialLoading(true);
        setPreProvaVisible(false);
        setShowResumoA4(false);
        setResumoA4(null);
        setResumoTrace(null);
        setResumoA4Error('');
        setResumoDidaticoMateria(null);

        if (updateHash && onRouteChange) {
          onRouteChange('materials', { materiaId: materia.id, aulaId: temaId });
        }

        setMaterialAdminEditMode(false);
        setMaterialAdminDraft('');
        setMaterialAdminMsg('');
        setMaterialHasFirestoreOverride(false);

        try {
          let loaded = false;
          let baseText = '';
          let resolvedPath = primaryPath;
          for (const p of fallbackPaths) {
            const res = await fetch(p);
            if (!res.ok) continue;
            baseText = await res.text();
            resolvedPath = p;
            setSelectedMaterial(prev => ({ ...prev, path: p }));
            loaded = true;
            break;
          }

          if (!loaded) {
            throw new Error(`Material ainda nao disponivel para esta aula. Caminho tentado: ${primaryPath}`);
          }

          materialBaseMdRef.current = baseText;
          let shown = baseText;
          let hasOv = false;

          if (window.__fbAuth?.currentUser && window.__fbDb && window.__fbFirestore) {
            try {
              const { doc, getDoc } = window.__fbFirestore;
              const ovKey = `${materia.id}__${temaId}`;
              const snap = await getDoc(doc(window.__fbDb, 'material_overrides', ovKey));
              if (snap.exists()) {
                const d = snap.data();
                const md = d && d.markdown != null ? String(d.markdown) : '';
                if (md.trim().length) {
                  shown = md;
                  hasOv = true;
                }
              }
            } catch (e) {
              console.warn('[material_overrides] leitura ignorada:', e?.message || e);
            }
          }

          setPreProvaVisible(/^## Pr(?:e|\u00e9)[- ]?Prova/im.test(shown));
          setMaterialContent(shown);
          setMaterialHasFirestoreOverride(hasOv);
        } catch (err) {
          setMaterialError(err?.message || 'Erro ao carregar material.');
          materialBaseMdRef.current = '';
        } finally {
          setMaterialLoading(false);
        }
      };

      const getMaterialOverrideDocKey = () => {
        if (!selectedMaterial?.materiaId || !selectedMaterial?.temaId) return null;
        return `${selectedMaterial.materiaId}__${selectedMaterial.temaId}`;
      };

      const materialAdminInsertBold = () => {
        const ta = materialAdminTextareaRef.current;
        const v = materialAdminDraft;
        const wrap = (start, end, inner) => `${v.slice(0, start)}**${inner}**${v.slice(end)}`;
        if (!ta) {
          setMaterialAdminDraft(wrap(0, v.length, (v && v.trim()) ? v : 'negrito'));
          return;
        }
        const start = ta.selectionStart ?? 0;
        const end = ta.selectionEnd ?? 0;
        const sel = v.slice(start, end) || 'negrito';
        setMaterialAdminDraft(wrap(start, end, sel));
        setTimeout(() => {
          try {
            ta.focus();
            const pos = start + 2 + sel.length + 2;
            ta.setSelectionRange(pos, pos);
          } catch (e) {}
        }, 0);
      };

      const materialAdminInsertLink = () => {
        const url = window.prompt('URL (https://… ou caminho /data/… /materiais/…):', 'https://');
        if (url == null || !String(url).trim()) return;
        const label = window.prompt('Texto do link:', 'link');
        if (label == null) return;
        const piece = `[${String(label).trim() || 'link'}](${String(url).trim()})`;
        const ta = materialAdminTextareaRef.current;
        const v = materialAdminDraft;
        if (!ta) {
          setMaterialAdminDraft((prev) => `${prev}${piece}`);
          return;
        }
        const start = ta.selectionStart ?? 0;
        const end = ta.selectionEnd ?? 0;
        setMaterialAdminDraft(`${v.slice(0, start)}${piece}${v.slice(end)}`);
        setTimeout(() => {
          try {
            ta.focus();
            const pos = start + piece.length;
            ta.setSelectionRange(pos, pos);
          } catch (e) {}
        }, 0);
      };

      const materialAdminSaveOverride = async () => {
        const key = getMaterialOverrideDocKey();
        if (!key || !isMaterialAdminSession()) return;
        const cu = window.__fbAuth?.currentUser;
        if (!cu?.email) {
          setMaterialAdminMsg('É necessário sessão Firebase (mesmo email verificado).');
          return;
        }
        const md = materialAdminDraft;
        if (!String(md).trim().length) {
          setMaterialAdminMsg('Markdown vazio.');
          return;
        }
        if (String(md).length > 900000) {
          setMaterialAdminMsg('Texto demasiado longo (limite ~900k caracteres).');
          return;
        }
        setMaterialAdminBusy(true);
        setMaterialAdminMsg('');
        try {
          const { doc, setDoc } = window.__fbFirestore;
          await setDoc(
            doc(window.__fbDb, 'material_overrides', key),
            {
              markdown: md,
              updatedAt: new Date().toISOString(),
              updatedBy: cu.email,
              materiaId: selectedMaterial.materiaId,
              temaId: selectedMaterial.temaId,
              basePath: selectedMaterial.path || '',
            },
            { merge: true }
          );
          setMaterialContent(md);
          setMaterialHasFirestoreOverride(true);
          setMaterialAdminEditMode(false);
          setMaterialAdminMsg('Guardado no Firestore (substitui o .md para utilizadores com login).');
        } catch (e) {
          setMaterialAdminMsg(e?.message || String(e) || 'Erro ao guardar (regras / rede / email verificado).');
        } finally {
          setMaterialAdminBusy(false);
        }
      };

      const materialAdminCancelEdit = () => {
        setMaterialAdminDraft(materialContent);
        setMaterialAdminEditMode(false);
        setMaterialAdminMsg('');
      };

      const materialAdminRevertToRepoFile = async () => {
        const key = getMaterialOverrideDocKey();
        if (!key || !isMaterialAdminSession()) return;
        if (!window.confirm('Apagar a sobreposição no Firestore e voltar ao texto do ficheiro .md do site?')) return;
        setMaterialAdminBusy(true);
        setMaterialAdminMsg('');
        try {
          const { doc, deleteDoc } = window.__fbFirestore;
          await deleteDoc(doc(window.__fbDb, 'material_overrides', key));
        } catch (e) {
          if ((e && e.code) !== 'not-found') {
            setMaterialAdminMsg(e?.message || String(e) || 'Erro ao apagar.');
            setMaterialAdminBusy(false);
            return;
          }
        }
        const base = materialBaseMdRef.current || '';
        setMaterialContent(base);
        setMaterialHasFirestoreOverride(false);
        setMaterialAdminEditMode(false);
        setMaterialAdminDraft('');
        setMaterialAdminMsg('Reposto: versão do repositório (ficheiro estático).');
        setMaterialAdminBusy(false);
      };

      const getMateriaModulos = (materia) => {
        const config = getModulos(materia.id);
        if (config) return config;
        if (materia.modulos) return materia.modulos;
        if (materia.aulas && materia.aulas.length > 0) {
          return [{ nome: materia.nome, temas: materia.aulas.map(a => ({ id: a.id, nome: a.tema, descricao: a.descricao })) }];
        }
        return null;
      };

      const totalTemas = (materia) => {
        const mods = getMateriaModulos(materia);
        if (!mods) return 0;
        return mods.reduce((acc, mod) => acc + (mod.temas?.length || 0), 0);
      };

      /** Próxima aula da mesma disciplina, na ordem dos módulos/temas do catálogo. */
      const nextSequentialMaterial = useMemo(() => {
        if (!selectedMaterial?.materiaId || !selectedMaterial?.temaId) return null;
        const materia = materias.find((m) => m.id === selectedMaterial.materiaId);
        if (!materia) return null;
        const modulos = getMateriaModulos(materia) || [];
        const flatTemas = [];
        for (const mod of modulos) {
          for (const tema of mod.temas || []) {
            if (tema && tema.id) flatTemas.push(tema);
          }
        }
        const i = flatTemas.findIndex((t) => t.id === selectedMaterial.temaId);
        if (i < 0 || i >= flatTemas.length - 1) return null;
        return { materia, tema: flatTemas[i + 1] };
      }, [selectedMaterial, materias]);

      const catalog = Array.isArray(materiasCatalog) ? materiasCatalog : [];

      const moduloInRange = (m, min, max) => {
        const mod = parseInt(m?.modulo ?? m?.semestre, 10);
        return Number.isFinite(mod) && mod >= min && mod <= max;
      };

      const catalogHasDisciplinasInRange = (min, max) =>
        catalog.some((m) => m.ativo !== false && moduloInRange(m, min, max));

      const userHasAccessToCycle = (min, max) => {
        for (let n = min; n <= max; n++) {
          if (hasModuleAccess(user || {}, n)) return true;
        }
        return false;
      };

      useEffect(() => {
        if (!initialMateriaId || !initialTemaId || !materias.length) return;
        const routeKey = `${initialMateriaId}:${initialTemaId}`;
        if (restoredRouteRef.current === routeKey) return;
        if (selectedMaterial?.materiaId === initialMateriaId && selectedMaterial?.temaId === initialTemaId) {
          restoredRouteRef.current = routeKey;
          return;
        }

        const materia = materias.find(m => m.id === initialMateriaId);
        if (!materia) return;

        const modulos = getMateriaModulos(materia) || [];
        let tema = null;
        modulos.some(mod => {
          tema = (mod.temas || []).find(item => (item?.id || null) === initialTemaId) || null;
          return !!tema;
        });
        if (!tema) return;

        restoredRouteRef.current = routeKey;
        openMaterial(materia, tema, { updateHash: false });
      }, [initialMateriaId, initialTemaId, materias, selectedMaterial]);

      const searchActive = Boolean(String(searchQuery || '').trim());
      const buildTemaSearchText = (tema) => [
        tema?.id,
        tema?.nome,
        tema?.tema,
        tema?.descricao
      ].filter(Boolean).join(' ');

      const materiaMatchesSearch = (materia) => {
        if (!searchActive) return true;
        const materiaText = [
          materia?.id,
          materia?.nome,
          materia?.sigla,
          materia?.descricao
        ].filter(Boolean).join(' ');
        if (fuzzyMatch(searchQuery, materiaText)) return true;
        const mods = getMateriaModulos(materia) || [];
        return mods.some((mod) => (mod.temas || []).some((tema) => fuzzyMatch(searchQuery, buildTemaSearchText(tema))));
      };

      const getVisibleModulosForSearch = (materia, modulosList) => {
        if (!searchActive) return modulosList;
        const materiaOnlyMatch = fuzzyMatch(searchQuery, [
          materia?.id,
          materia?.nome,
          materia?.sigla,
          materia?.descricao
        ].filter(Boolean).join(' '));
        if (materiaOnlyMatch) return modulosList;
        return modulosList
          .map((mod) => ({
            ...mod,
            temas: (mod.temas || []).filter((tema) => fuzzyMatch(searchQuery, buildTemaSearchText(tema)))
          }))
          .filter((mod) => (mod.temas || []).length > 0);
      };

      const filteredMaterias = materias.filter((m) => materiaMatchesSearch(m));

      const showToEstudosEntry =
        catalog.some((m) => m.id === TO_ESTUDOS_MATERIA_ID && m.ativo !== false) &&
        hasModuleAccess(user || {}, 6);

      const loadToInstrumentaisIfNeeded = () => {
        const cached = toInstrumentaisCacheRef.current;
        if (cached && Array.isArray(cached.items)) {
          setToInstItems(cached.items);
          if (cached.titulo) setToInstTitulo(cached.titulo);
          setToInstError('');
          setToInstLoading(false);
          return;
        }
        setToInstLoading(true);
        setToInstError('');
        fetch('/data/to_instrumentais.json')
          .then((r) => {
            if (!r.ok) throw new Error('fetch');
            return r.json();
          })
          .then((j) => {
            const items = Array.isArray(j.instrumentos) ? j.instrumentos : [];
            const titulo = j.titulo ? String(j.titulo) : '';
            toInstrumentaisCacheRef.current = { items, titulo };
            setToInstItems(items);
            if (titulo) setToInstTitulo(titulo);
          })
          .catch(() => {
            setToInstError('Não foi possível carregar o guia de instrumentais. Verifique a conexão e tente novamente.');
            setToInstItems(null);
          })
          .finally(() => setToInstLoading(false));
      };

      const retryLoadToInstrumentais = () => {
        toInstrumentaisCacheRef.current = null;
        loadToInstrumentaisIfNeeded();
      };

      const openToEstudos = (mode) => {
        setToGuideSearch('');
        setToQuizInlineWarn('');
        toInstrumentaisCacheRef.current = null;
        setToEstudosMode(mode);
        setToQuiz(null);
        loadToInstrumentaisIfNeeded();
      };

      const closeToEstudos = () => {
        setToEstudosMode(null);
        setToQuiz(null);
        setToGuideSearch('');
        setToQuizInlineWarn('');
      };

      useEffect(() => {
        if (toEstudosMode !== 'quiz' || !toInstItems?.length) return;
        setToQuiz((prev) => {
          if (prev && prev.phase === 'summary') return prev;
          if (prev && prev.order?.length) return prev;
          return {
            order: shuffleInstrumentIds(toInstItems.map((i) => i.id)),
            idx: 0,
            input: '',
            phase: 'play',
            submittedForIdx: null,
            log: [],
          };
        });
      }, [toEstudosMode, toInstItems]);

      const toGuideFiltered = useMemo(() => {
        if (!toInstItems?.length) return [];
        const q = String(toGuideSearch || '').trim();
        if (!q) return toInstItems;
        return toInstItems.filter(
          (it) =>
            fuzzyMatch(q, it.nome || '') ||
            fuzzyMatch(q, it.categoria || '') ||
            fuzzyMatch(q, it.funcao || '') ||
            fuzzyMatch(q, String(it.id || ''))
        );
      }, [toInstItems, toGuideSearch]);

      const getToInstrumentById = (id) => (toInstItems || []).find((i) => i.id === id);

      const submitToQuizAnswer = () => {
        if (!toQuiz || toQuiz.phase !== 'play') return;
        const curId = toQuiz.order[toQuiz.idx];
        const curInst = getToInstrumentById(curId);
        if (!curInst) return;
        if (toQuiz.submittedForIdx === toQuiz.idx) return;
        const diff = buildInstrumentAnswerDiff(toQuiz.input, curInst.nome);
        if (diff.isEmpty) {
          setToQuizInlineWarn('Digite o nome do instrumental para conferir.');
          return;
        }
        setToQuizInlineWarn('');
        const entry = {
          idx: toQuiz.idx,
          id: curInst.id,
          userRaw: toQuiz.input,
          isCorrect: diff.isCorrect,
          userSpans: diff.userSpans,
          gabarito: curInst.nome,
        };
        setToQuiz({
          ...toQuiz,
          submittedForIdx: toQuiz.idx,
          log: [...toQuiz.log, entry],
        });
      };

      const goToNextToQuizQ = () => {
        if (!toQuiz || toQuiz.phase !== 'play') return;
        if (toQuiz.idx >= toQuiz.order.length - 1) {
          setToQuiz({ ...toQuiz, phase: 'summary' });
          return;
        }
        setToQuiz({
          ...toQuiz,
          idx: toQuiz.idx + 1,
          input: '',
          submittedForIdx: null,
        });
        setToQuizInlineWarn('');
      };

      const restartToQuiz = () => {
        if (!toInstItems?.length) return;
        setToQuizInlineWarn('');
        setToQuiz({
          order: shuffleInstrumentIds(toInstItems.map((i) => i.id)),
          idx: 0,
          input: '',
          phase: 'play',
          submittedForIdx: null,
          log: [],
        });
      };

      const renderResumoDidaticoHub = () => {
        const items = getResumoA4ItemsForMateria(resumoDidaticoMateria?.id);
        return (
          <div className="screen-content">
            <button
              type="button"
              className="back-btn"
              onClick={() => {
                setResumoDidaticoMateria(null);
                setResumoA4Error('');
                if (onRouteChange) onRouteChange('home');
              }}
            >
              ← Início
            </button>

            <div style={{ margin: '18px 0 20px' }}>
              <div style={{ fontSize: '0.74rem', color: '#7FFFD4', fontWeight: 800, letterSpacing: '0.08em', textTransform: 'uppercase', marginBottom: 6 }}>
                {resumoDidaticoMateria?.sigla || 'MedGradPlus'}
              </div>
              <h2 style={{ margin: 0, color: 'var(--text-primary)', fontFamily: 'Outfit', fontSize: '1.65rem', lineHeight: 1.15 }}>
                Resumo Didático
              </h2>
              <p style={{ margin: '8px 0 0', color: 'var(--text-secondary)', fontSize: '0.92rem', lineHeight: 1.55, maxWidth: 720 }}>
                Resumos A4 rastreáveis disponíveis para {resumoDidaticoMateria?.nome || 'esta disciplina'}.
              </p>
            </div>

            {resumosA4ManifestError && (
              <div className="resumo-a4-warning" style={{ marginBottom: 14 }}>
                {resumosA4ManifestError}
              </div>
            )}

            {resumoA4Error && (
              <div className="resumo-a4-warning" style={{ marginBottom: 14 }}>
                {resumoA4Error}
              </div>
            )}

            <div className="resumo-didatico-list">
              {items.length ? items.map((item) => (
                <button
                  type="button"
                  className="resumo-didatico-card"
                  key={`${item.materiaId}:${item.aulaId}`}
                  onClick={() => handleOpenResumoA4Item(item)}
                  disabled={resumoA4Loading}
                >
                  <span>
                    <span className="resumo-didatico-card__title">{item.titulo || item.aulaId}</span>
                    <span className="resumo-didatico-card__meta">
                      {String(item.aulaId || '').toUpperCase()} {'\u00b7'} {item.pages || 2} páginas A4 {'\u00b7'} material rastreável
                    </span>
                  </span>
                  <span className="resumo-didatico-card__action">{resumoA4Loading ? 'Assinando...' : 'Abrir'}</span>
                </button>
              )) : (
                <div className="materials-cycle-empty">
                  Ainda não há resumo didático liberado para esta disciplina.
                </div>
              )}
            </div>
          </div>
        );
      };

      const renderMateriaCard = (materia) => {
        const total = totalTemas(materia);
        const isExpanded = expandedMaterias[materia.id];
        const modulosList = getMateriaModulos(materia) || [];
        const visibleModulosList = getVisibleModulosForSearch(materia, modulosList);
        const visibleTotal = visibleModulosList.reduce((acc, mod) => acc + (mod.temas?.length || 0), 0);
        const showAulas = total > 0 && (isExpanded || searchActive || materia.id === initialMateriaId);
        const resumoItems = getResumoA4ItemsForMateria(materia.id);
        const hasResumoDidatico = resumoItems.length > 0;
        return (
          <div key={materia.id} id={`material-subject-${materia.id}`} className="material-subject" style={materia.id === initialMateriaId ? { borderColor: 'rgba(0,200,150,0.36)', boxShadow: '0 0 0 1px rgba(0,200,150,0.12)' } : undefined}>
            <div className="material-subject-name" style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
              <span style={{ display: 'flex', alignItems: 'center', gap: '8px' }}>
                <SubjectIcon materiaId={materia.id} icon={materia.icon} cor={materia.cor} />
                {materia.sigla || materia.nome}
              </span>
              {total > 0 && (
                <button
                  type="button"
                  onClick={() => toggleMateria(materia.id)}
                  style={{
                    background: 'rgba(255,255,255,0.06)',
                    border: '1px solid rgba(255,255,255,0.12)',
                    borderRadius: '8px',
                    color: 'var(--text-secondary)',
                    fontSize: '0.78rem',
                    padding: '4px 10px',
                    cursor: 'pointer',
                    display: 'flex',
                    alignItems: 'center',
                    gap: '5px'
                  }}
                >
                  {showAulas && !searchActive ? '▲ Ocultar' : `▼ ${visibleTotal || total} aulas`}
                </button>
              )}
            </div>

            {showAulas && (
              <div style={{ marginTop: '10px', marginBottom: '4px' }}>
                {visibleModulosList.length === 0 ? (
                  <div className="materials-cycle-empty" style={{ padding: '14px', marginTop: '8px' }}>
                    Nenhuma aula desta disciplina bate com a busca.
                  </div>
                ) : visibleModulosList.map((mod, mi) => (
                  <div key={mi} style={{ marginBottom: '10px' }}>
                    <div style={{
                      fontSize: '0.72rem',
                      fontWeight: 700,
                      textTransform: 'uppercase',
                      letterSpacing: '0.06em',
                      color: 'var(--text-secondary)',
                      marginBottom: '6px',
                      paddingLeft: '2px'
                    }}>{mod.nome}</div>
                    {(mod.temas || []).map((tema, ti) => (
                      <button
                        key={ti}
                        type="button"
                        onClick={() => openMaterial(materia, tema)}
                        title="Abrir material da aula"
                        style={{
                          width: '100%',
                          display: 'flex',
                          alignItems: 'flex-start',
                          justifyContent: 'space-between',
                          gap: '8px',
                          padding: '10px 12px',
                          borderRadius: '8px',
                          background: 'rgba(255,255,255,0.03)',
                          border: '1px solid rgba(255,255,255,0.06)',
                          marginBottom: '4px',
                          cursor: 'pointer',
                          color: 'inherit',
                          font: 'inherit',
                          textAlign: 'left',
                          fontFamily: 'DM Sans, sans-serif'
                        }}
                      >
                        <span style={{ color: materia.cor || 'var(--primary)', fontSize: '0.85rem', marginTop: '1px', flexShrink: 0 }}>•</span>
                        <div style={{ minWidth: 0, flex: 1 }}>
                          <div style={{ fontSize: '0.88rem', color: 'var(--text-primary)', fontWeight: 500 }}>{tema.nome}</div>
                          {tema.id && (
                            <div style={{ fontSize: '0.68rem', color: 'var(--text-secondary)', marginTop: '2px', fontWeight: 700, textTransform: 'uppercase', letterSpacing: '0.04em' }}>{tema.id}</div>
                          )}
                          {tema.descricao && (
                            <div style={{ fontSize: '0.75rem', color: 'var(--text-secondary)', marginTop: '2px' }}>{tema.descricao}</div>
                          )}
                        </div>
                        <span className="material-badge material-badge--ready" style={{ flexShrink: 0, marginTop: '1px' }}>Abrir</span>
                      </button>
                    ))}
                  </div>
                ))}
              </div>
            )}

            {hasResumoDidatico && (
            <div className="material-slots" style={{ marginTop: total > 0 ? '8px' : undefined }}>
              <button
                type="button"
                className="material-slot material-slot--button"
                onClick={() => openResumoDidaticoMateria(materia)}
                title="Abrir resumos didaticos desta disciplina"
              >
                <span className="material-slot-name">
                  <span style={{ color: 'var(--text-secondary)', display: 'flex' }}><IconFileText /></span>
                  Resumo Didático
                </span>
                <span className="material-badge material-badge--ready">
                  {`${resumoItems.length} disponível${resumoItems.length > 1 ? 's' : ''}`}
                </span>
              </button>
            </div>
            )}

            {materia.id === TO_ESTUDOS_MATERIA_ID && showToEstudosEntry && (
              <div
                style={{
                  marginTop: '12px',
                  paddingTop: '12px',
                  borderTop: '1px solid rgba(255,255,255,0.08)',
                  display: 'flex',
                  flexWrap: 'wrap',
                  gap: '8px',
                }}
              >
                <div style={{ width: '100%', display: 'flex', alignItems: 'center', flexWrap: 'wrap', gap: '8px', marginBottom: '2px' }}>
                  <span style={{ fontSize: '0.72rem', fontWeight: 800, textTransform: 'uppercase', letterSpacing: '0.06em', color: '#6ee7b7' }}>TO Estudos</span>
                  <span className="to-estudos-beta-pill">Beta</span>
                </div>
                <button
                  type="button"
                  onClick={() => openToEstudos('guide')}
                  style={{
                    flex: 1,
                    minWidth: '120px',
                    padding: '9px 12px',
                    borderRadius: '10px',
                    border: '1px solid rgba(0,200,150,0.35)',
                    background: 'rgba(0,200,150,0.12)',
                    color: '#6ee7b7',
                    fontSize: '0.8rem',
                    fontWeight: 700,
                    cursor: 'pointer',
                    fontFamily: 'DM Sans, sans-serif',
                  }}
                >Guia de instrumentais</button>
                <button
                  type="button"
                  onClick={() => openToEstudos('quiz')}
                  style={{
                    flex: 1,
                    minWidth: '120px',
                    padding: '9px 12px',
                    borderRadius: '10px',
                    border: '1px solid rgba(124,58,237,0.4)',
                    background: 'rgba(124,58,237,0.14)',
                    color: '#c4b5fd',
                    fontSize: '0.8rem',
                    fontWeight: 700,
                    cursor: 'pointer',
                    fontFamily: 'DM Sans, sans-serif',
                  }}
                >Quiz de instrumentais</button>
              </div>
            )}
          </div>
        );
      };

      const userHasDisciplinaInCatalogForAccess = (min, max) =>
        catalog.some(
          (m) =>
            m.ativo !== false &&
            moduloInRange(m, min, max) &&
            hasModuleAccess(user || {}, m.modulo ?? m.semestre)
        );

      const getMateriaModuloNum = (m) => {
        const n = parseInt(m?.modulo ?? m?.semestre, 10);
        return Number.isFinite(n) ? n : null;
      };

      const renderCycleSection = (cycle) => {
        const { min, max, label, sub, anchor, id: cycleId } = cycle;
        const hasAccess = userHasAccessToCycle(min, max);
        const hasCatalog = catalogHasDisciplinasInRange(min, max);
        const hasDisciplinaForUser = userHasDisciplinaInCatalogForAccess(min, max);
        const sectionMaterias = filteredMaterias.filter((m) => moduloInRange(m, min, max));
        const q = String(searchQuery || '').trim();

        const moduleNums = [...new Set(sectionMaterias.map(getMateriaModuloNum).filter((n) => n != null))].sort((a, b) => a - b);
        const rawFilter = moduleFilterByCycle[cycleId];
        const moduleFilter = q ? null : (rawFilter != null && moduleNums.includes(rawFilter) ? rawFilter : null);
        const modulesToShow = moduleFilter == null ? moduleNums : moduleNums.filter((n) => n === moduleFilter);

        const renderModuleChips = () => {
          if (moduleNums.length <= 1) return null;
          return (
            <div className="materials-mod-chips">
              <span className="materials-mod-chips-label">Módulo</span>
              <button
                type="button"
                className={`semester-tab${moduleFilter == null ? ' active' : ''}`}
                onClick={() => setModuleFilterByCycle((prev) => ({ ...prev, [cycleId]: null }))}
              >Todos</button>
              {moduleNums.map((n) => (
                <button
                  key={n}
                  type="button"
                  className={`semester-tab${moduleFilter === n ? ' active' : ''}`}
                  onClick={() => setModuleFilterByCycle((prev) => ({ ...prev, [cycleId]: n }))}
                >{n}</button>
              ))}
            </div>
          );
        };

        const renderGroupedList = () => (
          <>
            {renderModuleChips()}
            {modulesToShow.length === 0 ? (
              <div className="materials-cycle-empty">
                {moduleFilter != null
                  ? 'Nenhuma matéria neste módulo com os filtros atuais.'
                  : 'Nenhuma disciplina disponível aqui no momento.'}
              </div>
            ) : (
              modulesToShow.map((modNum) => {
                const group = sectionMaterias.filter((m) => getMateriaModuloNum(m) === modNum);
                return (
                  <div key={modNum} id={`${anchor}-mod-${modNum}`} className="materials-mod-subgroup" style={{ scrollMarginTop: '88px' }}>
                    <h4 className="materials-mod-title">Módulo {modNum}</h4>
                    <div className="materials-list">{group.map((m) => renderMateriaCard(m))}</div>
                  </div>
                );
              })
            )}
          </>
        );

        let body = null;
        if (!hasAccess) {
          body = (
            <div className="materials-cycle-empty">
              Este ciclo não está incluído no seu plano. Atualize o plano ou o convite para acessar estes módulos.
            </div>
          );
        } else if (!hasCatalog) {
          body = (
            <div className="materials-cycle-empty" style={{ display: 'flex', alignItems: 'center', gap: '12px', flexWrap: 'wrap' }}>
              <span className="material-badge" style={{ flexShrink: 0 }}>Em breve</span>
              <span>Conteúdo ainda por vir neste ciclo. Volte em breve para novos materiais.</span>
            </div>
          );
        } else if (!hasDisciplinaForUser) {
          body = (
            <div className="materials-cycle-empty" style={{ display: 'flex', alignItems: 'center', gap: '12px', flexWrap: 'wrap' }}>
              <span className="material-badge" style={{ flexShrink: 0 }}>Em breve</span>
              <span>Materiais para os módulos do seu plano neste ciclo ainda por vir.</span>
            </div>
          );
        } else if (sectionMaterias.length === 0 && q) {
          body = (
            <div className="materials-cycle-empty">
              Nenhuma matéria encontrada com esse termo neste ciclo.
            </div>
          );
        } else if (sectionMaterias.length === 0) {
          body = (
            <div className="materials-cycle-empty">
              Nenhuma disciplina disponível aqui no momento.
            </div>
          );
        } else {
          body = renderGroupedList();
        }

        return (
          <section key={cycle.id} id={anchor} className="materials-cycle-section">
            <h3 className="materials-cycle-header">{label}</h3>
            <p className="materials-cycle-sub">{sub}</p>
            {body}
          </section>
        );
      };

      // --- TO ESTUDOS (instrumentais) — tela dedicada dentro de Materiais ---
      if (toEstudosMode) {
        const headerTitulo = toInstTitulo || 'TO Estudos — Instrumentais';
        const curQuizId = toQuiz?.order?.[toQuiz.idx];
        const curQuizInst = curQuizId ? getToInstrumentById(curQuizId) : null;
        const curQuizAttempt = toQuiz?.log?.find((l) => l.idx === toQuiz?.idx);
        const quizCorrectCount = toQuiz?.log?.filter((l) => l.isCorrect).length ?? 0;
        const quizTotal = toQuiz?.order?.length ?? 0;
        const quizWrong = (toQuiz?.log || []).filter((l) => !l.isCorrect);

        return (
          <div className="screen-content screen-content--material-detail">

              display: 'flex',
              alignItems: 'center',
              gap: '10px',
              marginBottom: '18px',

              <button
                type="button"
                onClick={() => {
                  closeToEstudos();
                  if (onRouteChange) onRouteChange('home');
                }}
                style={{
                  background: 'rgba(0,200,150,0.08)',
                  border: '1px solid rgba(0,200,150,0.25)',
                  borderRadius: '8px',
                  color: '#00C896',
                  fontSize: '0.82rem',
                  fontWeight: 500,
                  padding: '7px 13px',
                  cursor: 'pointer',
                  display: 'flex',
                  alignItems: 'center',
                  gap: '5px',
                  flexShrink: 0,
                  fontFamily: 'DM Sans, sans-serif',
                }}
              >← Início</button>
              <div style={{ minWidth: 0, flex: 1 }}>
                <div style={{
                  fontSize: '0.7rem',
                  color: '#64748B',
                  fontWeight: 500,
                  textTransform: 'uppercase',
                  letterSpacing: '0.07em',
                  marginBottom: '2px',
                  fontFamily: 'DM Sans, sans-serif',
                }}>Técnica Operatória</div>
                <div style={{
                  fontSize: '1rem',
                  fontWeight: 700,
                  color: '#F1F5F9',
                  fontFamily: 'Outfit, sans-serif',
                  lineHeight: 1.25,
                }}>{headerTitulo}</div>
              </div>
            </div>

              <span className="to-estudos-beta-pill">Beta</span>
              <span style={{ flex: 1, minWidth: 0 }}>

              </span>
            </div>

            <div className="to-estudos-seg" role="tablist">

                role="tab"

                role="tab"
                className={toEstudosMode === 'quiz' ? 'active' : ''}

                display: 'flex',
                flexDirection: 'column',
                alignItems: 'center',
                gap: '12px',
                padding: '40px 0',
                color: '#64748B',
                fontSize: '0.85rem',
                fontFamily: 'DM Sans, sans-serif',

                  width: '32px',
                  height: '32px',
                  border: '3px solid rgba(0,200,150,0.15)',
                  borderTop: '3px solid #00C896',
                  borderRadius: '50%',
                  animation: 'spin 0.8s linear infinite',

                fontSize: '0.85rem',

                  onClick={retryLoadToInstrumentais}

              </div>

            {!toInstLoading && !toInstError && Array.isArray(toInstItems) && toInstItems.length === 0 && (

            {!toInstLoading && !toInstError && toInstItems?.length > 0 && toEstudosMode === 'guide' && (

                  type="search"
                  className="subject-search to-estudos-guide-search"

                {toGuideFiltered.length === 0 ? (

                            alt={inst.nome}

                      className="btn btn-primary"
                      onClick={restartToQuiz}
                      style={{ marginBottom: quizWrong.length ? '18px' : 0 }}

                      <div className="to-quiz-review-block">

                            <div key={`${att.idx}-${att.id}`} className="to-quiz-review-item">

                              <div style={{ marginBottom: '6px' }}>
                                <span style={{ color: '#94a3b8', fontSize: '0.72rem', fontWeight: 700, textTransform: 'uppercase' }}>Sua resposta (comparação)</span>
                                <div style={{ fontFamily: 'ui-monospace, monospace', marginTop: '4px' }}>
                                  {(att.userSpans || []).map((s, si) => (
                                    <span key={si} className={s.ok ? 'to-quiz-char-ok' : 'to-quiz-char-bad'}>{s.ch}</span>
                                  ))}
                                  {!att.userSpans?.length ? <span className="to-quiz-char-bad">(vazio)</span> : null}
                                </div>
                              </div>
                              <div className="to-quiz-gabarito" style={{ marginTop: '8px' }}>
                                <strong>Gabarito:</strong> {att.gabarito}
                              </div>
                            </div>
                          );
                        })}
                      </div>
                    ) : null}
                  </div>
                ) : curQuizInst ? (
                  <div className="to-estudos-card">
                    <div className="to-quiz-progress">
                      Questão {toQuiz.idx + 1} de {toQuiz.order.length}
                      {toQuiz.submittedForIdx === toQuiz.idx ? (
                        <span style={{ marginLeft: '8px', color: curQuizAttempt?.isCorrect ? '#4ade80' : '#f87171' }}>
                          {curQuizAttempt?.isCorrect ? ' — correto' : ' — incorreto ou incompleto'}
                        </span>
                      ) : null}
                    </div>

                    <div className="to-estudos-card-img-wrap">
                      {(!curQuizInst.imagem || !String(curQuizInst.imagem).trim() || toImgBroken[curQuizInst.id]) ? (
                        <div className="to-estudos-ph">
                          {(curQuizInst.imagem && String(curQuizInst.imagem).trim() && toImgBroken[curQuizInst.id])
                            ? 'Imagem indisponível.'
                            : 'Sem imagem.'}
                        </div>
                      ) : (
                        <ToEstudosInstrumentFigure
                          src={encodeLocalAssetPath(curQuizInst.imagem)}
                          alt="Instrumental em quiz"
                          onError={() => setToImgBroken((p) => ({ ...p, [curQuizInst.id]: true }))}
                        />
                      )}
                    </div>

                    <label htmlFor="to-quiz-nome-input" style={{ display: 'block', fontSize: '0.72rem', fontWeight: 800, color: '#94a3b8', textTransform: 'uppercase', letterSpacing: '0.05em', marginBottom: '6px' }}>
                      Nome do instrumental
                    </label>
                    <input
                      id="to-quiz-nome-input"
                      type="text"
                      autoComplete="off"
                      disabled={toQuiz.submittedForIdx === toQuiz.idx}
                      value={toQuiz.input}
                      onChange={(e) => {
                        setToQuiz({ ...toQuiz, input: e.target.value });
                        if (toQuizInlineWarn) setToQuizInlineWarn('');
                      }}
                      placeholder=""
                      className="subject-search"
                      style={{ marginBottom: '10px', width: '100%', boxSizing: 'border-box' }}
                      onKeyDown={(e) => {
                        if (e.key === 'Enter') {
                          e.preventDefault();
                          if (toQuiz.submittedForIdx === toQuiz.idx) goToNextToQuizQ();
                          else submitToQuizAnswer();
                        }
                      }}
                    />

                    {toQuizInlineWarn ? (
                      <div style={{ fontSize: '0.78rem', color: '#fca5a5', marginBottom: '10px' }}>{toQuizInlineWarn}</div>
                    ) : null}

                    {toQuiz.submittedForIdx === toQuiz.idx && curQuizAttempt ? (
                      <>
                        <div style={{ fontSize: '0.72rem', fontWeight: 700, color: '#94a3b8', textTransform: 'uppercase', letterSpacing: '0.05em', marginBottom: '6px' }}>
                          Sua resposta (caractere a caractere)
                        </div>
                        <div style={{ fontFamily: 'ui-monospace, monospace', fontSize: '1.05rem', lineHeight: 1.65, marginBottom: '10px' }}>
                          {curQuizAttempt.userSpans.map((s, si) => (
                            <span key={si} className={s.ok ? 'to-quiz-char-ok' : 'to-quiz-char-bad'}>{s.ch}</span>
                          ))}
                        </div>
                        <div className="to-quiz-gabarito">
                          <strong>Gabarito:</strong> {curQuizInst.nome}
                        </div>
                        <button type="button" className="btn btn-primary" style={{ marginTop: '14px', width: '100%' }} onClick={goToNextToQuizQ}>
                          {toQuiz.idx >= toQuiz.order.length - 1 ? 'Ver resultado' : 'Próxima'}
                        </button>
                      </>
                    ) : (
                      <button type="button" className="btn btn-primary" style={{ width: '100%' }} onClick={submitToQuizAnswer}>
                        Conferir resposta
                      </button>
                    )}
                  </div>
                ) : (
                  <div className="materials-cycle-empty">Preparando o quiz...</div>
                )}
              </>
            )}
          </div>
        );
      }

      // --- DETAIL VIEW: when a material is selected, replace entire screen ---
      if (showResumoA4 && resumoA4 && resumoTrace) {
        return (
          <div className="screen-content screen-content--material-detail">
            <ResumoA4View
              resumo={resumoA4}
              trace={resumoTrace}
              user={user}
              onBack={handleCloseResumoA4}
              backLabel="Voltar ao Início"
            />
          </div>
        );
      }

      if (resumoDidaticoMateria) {
        return renderResumoDidaticoHub();
      }

      if (selectedMaterial) {
        const preProvaMd = !materialLoading && materialContent ? splitMaterialContent(materialContent).preProva : null;
        return (
          <div className="screen-content screen-content--material-detail">

            {/* Header bar */}
            <div style={{
              display: 'flex',
              alignItems: 'center',
              flexWrap: 'wrap',
              gap: '10px',
              marginBottom: '20px',
            }}>
              <button
                onClick={() => {
                  setSelectedMaterial(null);
                  setMaterialContent('');
                  setMaterialError('');
                  setMaterialAdminEditMode(false);
                  setMaterialAdminDraft('');
                  setMaterialAdminMsg('');
                  setMaterialHasFirestoreOverride(false);
                  setShowResumoA4(false);
                  setResumoA4(null);
                  setResumoTrace(null);
                  setResumoA4Error('');
                  setResumoDidaticoMateria(null);
                  materialBaseMdRef.current = '';
                  if (onRouteChange) onRouteChange('home');
                }}
                style={{
                  background: 'rgba(0,200,150,0.08)',
                  border: '1px solid rgba(0,200,150,0.25)',
                  borderRadius: '8px',
                  color: '#00C896',
                  fontSize: '0.82rem',
                  fontWeight: 500,
                  padding: '7px 13px',
                  cursor: 'pointer',
                  display: 'flex',
                  alignItems: 'center',
                  gap: '5px',
                  flexShrink: 0,
                  transition: 'background 0.2s',
                  fontFamily: 'DM Sans, sans-serif',
                }}
              >← Início</button>

              <div style={{ minWidth: 0, flex: 1 }}>
                <div style={{
                  fontSize: '0.7rem',
                  color: '#64748B',
                  fontWeight: 500,
                  textTransform: 'uppercase',
                  letterSpacing: '0.07em',
                  marginBottom: '2px',
                  fontFamily: 'DM Sans, sans-serif',
                }}>{selectedMaterial.materiaNome}</div>
                <div style={{
                  fontSize: '1rem',
                  fontWeight: 700,
                  color: '#F1F5F9',
                  fontFamily: 'Outfit, sans-serif',
                  lineHeight: 1.25,
                  whiteSpace: 'nowrap',
                  overflow: 'hidden',
                  textOverflow: 'ellipsis',
                }}>{selectedMaterial.temaNome}</div>
              </div>
              {nextSequentialMaterial && (
                <button
                  type="button"
                  disabled={materialLoading}
                  title={`Abrir a próxima aula: ${nextSequentialMaterial.tema.nome || ''}`}
                  onClick={() => {
                    openMaterial(nextSequentialMaterial.materia, nextSequentialMaterial.tema);
                    window.scrollTo(0, 0);
                  }}
                  style={{
                    background: 'rgba(96,165,250,0.1)',
                    border: '1px solid rgba(96,165,250,0.35)',
                    borderRadius: '8px',
                    color: '#93C5FD',
                    fontSize: '0.82rem',
                    fontWeight: 600,
                    padding: '7px 13px',
                    cursor: materialLoading ? 'not-allowed' : 'pointer',
                    display: 'flex',
                    alignItems: 'center',
                    gap: '6px',
                    flexShrink: 0,
                    opacity: materialLoading ? 0.55 : 1,
                    transition: 'background 0.2s, opacity 0.2s',
                    fontFamily: 'DM Sans, sans-serif',
                  }}
                >
                  Próximo material<span aria-hidden="true">→</span>
                </button>
              )}
              {preProvaMd && (
                <button
                  type="button"
                  className="material-jump-preprova"
                  title="Ir para o resumo Pré-Prova"
                  onClick={() => {
                    document.getElementById('material-preprova-block')?.scrollIntoView({ behavior: 'smooth', block: 'center' });
                  }}
                >
                  <span className="material-jump-preprova__icon" aria-hidden="true">⚡</span>
                  <span className="material-jump-preprova__label">Pré-Prova</span>
                  <span className="material-jump-preprova__arrow" aria-hidden="true">↓</span>
                </button>
              )}
            </div>

            {onNavigateTo && selectedMaterial.materiaId && (
              <div style={{
                display: 'flex',
                flexWrap: 'wrap',
                gap: '8px',
                marginBottom: '16px',
              }}>
                <button
                  onClick={() => onNavigateTo('cards', selectedMaterial.materiaId, selectedMaterial.temaId)}
                  style={{
                    flex: 1,
                    display: 'flex',
                    alignItems: 'center',
                    justifyContent: 'center',
                    gap: '7px',
                    background: 'rgba(124,58,237,0.12)',
                    border: '1px solid rgba(124,58,237,0.3)',
                    borderRadius: '10px',
                    padding: '10px 14px',
                    cursor: 'pointer',
                    color: '#C4B5FD',
                    fontSize: '0.82rem',
                    fontWeight: 600,
                    fontFamily: 'DM Sans, sans-serif',
                    transition: 'background 0.2s',
                  }}
                >
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>
                  Flashcards
                </button>
                <button
                  onClick={() => onNavigateTo('quiz', selectedMaterial.materiaId, selectedMaterial.temaId)}
                  style={{
                    flex: 1,
                    display: 'flex',
                    alignItems: 'center',
                    justifyContent: 'center',
                    gap: '7px',
                    background: 'rgba(16,185,129,0.1)',
                    border: '1px solid rgba(16,185,129,0.3)',
                    borderRadius: '10px',
                    padding: '10px 14px',
                    cursor: 'pointer',
                    color: '#6EE7B7',
                    fontSize: '0.82rem',
                    fontWeight: 600,
                    fontFamily: 'DM Sans, sans-serif',
                    transition: 'background 0.2s',

                >
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>

                    display: 'flex',
                    alignItems: 'center',

                    gap: '7px',
                    background: 'rgba(0,200,150,0.11)',

                    cursor: 'pointer',
                    color: '#EF4444',
                    fontSize: '0.8rem',

            {resumoA4Error && (

                color: '#FDE68A',
                fontSize: '0.78rem',
                fontFamily: 'DM Sans, sans-serif',
                lineHeight: 1.45,
              }}>{resumoA4Error}</div>

        const srData = JSON.parse(localStorage.getItem('meduni9_sr_data') || '{}');

        const currentUser = window.__fbAuth?.currentUser;
        if (!currentUser || !window.__fbFirestore) return;
        try {
          const { collection, getDocs, query, where } = window.__fbFirestore;
          const snap = await getDocs(query(collection(window.__fbDb, 'profile_change_requests'), where('userId', '==', currentUser.uid)));
          const docs = snap.docs.map(docSnap => ({ id: docSnap.id, ...docSnap.data() }));
          docs.sort((a, b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0));
          setChangeRequests(docs);
        } catch {
          setChangeRequests([]);
        }
      };

        loadChangeRequests();
      }, []);

      const pendingRequest = changeRequests.find(item => item.status === 'pending');

      const submitInstitutionRequest = async () => {
        const currentUser = window.__fbAuth?.currentUser;
        const faculty = getFacultyById(requestFacultyId);
        const campus = getCampusById(requestFacultyId, requestCampusId);

        setRequestError('');
        setRequestInfo('');

        if (!currentUser) { setRequestError('Faça login novamente para enviar a solicitação.'); return; }
        if (!faculty?.active || !campus?.active) { setRequestError('Escolha uma faculdade e campus disponíveis.'); return; }
        if (pendingRequest) { setRequestError('Já existe uma solicitação pendente para sua conta.'); return; }
        if (user.faculdadeId === faculty.id && user.campusId === campus.id) { setRequestError('Você já está nesse campus.'); return; }

        setRequestLoading(true);
        try {
          const { collection, addDoc } = window.__fbFirestore;
          await addDoc(collection(window.__fbDb, 'profile_change_requests'), {
            userId: currentUser.uid,
            userEmail: currentUser.email || user.email || '',
            currentFacultyId: user.faculdadeId,
            currentFacultyName: user.faculdadeNome,
            currentCampusId: user.campusId,
            currentCampusName: user.campusNome,
            requestedFacultyId: faculty.id,
            requestedFacultyName: faculty.name,
            requestedCampusId: campus.id,
            requestedCampusName: campus.name,
            semestre: user.semestre || user.modulo || 1,

            createdAt: new Date().toISOString(),

          setRequestLoading(false);
          setShowInstitutionRequest(false);
          setRequestInfo('Solicitação enviada. A alteração só aparece após aprovação pela equipe de desenvolvimento.');

          setRequestLoading(false);
          setRequestError('Não foi possível enviar a solicitação.');
