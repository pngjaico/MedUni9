    // Auth Screen
    const AuthScreen = ({ onAuthSuccess }) => {
      const [step, setStep] = useState(1);
      const [code, setCode] = useState('');
      const [email, setEmail] = useState('');
      const [semester, setSemester] = useState(null);
      const [fingerprint, setFingerprint] = useState('');
      const [error, setError] = useState('');
      const [loading, setLoading] = useState(false);
      const [validatedCode, setValidatedCode] = useState(null);

      useEffect(() => {
        generateDeviceFingerprint().then(fp => setFingerprint(fp));
      }, []);

      const handleCodeChange = (e) => {
        let value = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
        if (value.length > 12) value = value.slice(0, 12);

        if (value.length > 8) {
          value = value.slice(0, 4) + '-' + value.slice(4, 8) + '-' + value.slice(8);
        } else if (value.length > 4) {
          value = value.slice(0, 4) + '-' + value.slice(4);
        }
        setCode(value);
      };

      const handleCodeSubmit = async () => {
        setError('');
        if (!code || code.length < 14) {
          setError('Código inválido. Use o formato XXXX-XXXX-XXXX');
          return;
        }

        // Rate limit check
        const rl = checkRateLimit();
        if (!rl.allowed) {
          setError(rl.message);
          return;
        }

        setLoading(true);
        try {
          // Hash the code
          const codeHash = await hashCode(code);

          // Fetch codes database
          const response = await fetch('data/codigos.json?_=' + Date.now());
          if (!response.ok) throw new Error('Erro ao verificar código');
          const data = await response.json();

          const codeEntry = data.codigos[codeHash];

          // Validate code exists
          if (!codeEntry) {
            recordFailedAttempt();
            setLoading(false);
            setError('Código de acesso inválido.');
            return;
          }

          // Validate code is active
          if (!codeEntry.ativo) {
            recordFailedAttempt();
            setLoading(false);
            setError('Este código foi desativado.');
            return;
          }

          // Validate expiration
          if (codeEntry.expira) {
            const expirationDate = new Date(codeEntry.expira);
            if (new Date() > expirationDate) {
              recordFailedAttempt();
              setLoading(false);
              setError('Este código expirou em ' + expirationDate.toLocaleDateString('pt-BR') + '.');
              return;
            }
          }

          // Validate device limit
          const registeredDevices = codeEntry.dispositivos || [];
          if (!registeredDevices.includes(fingerprint) && registeredDevices.length >= codeEntry.maxDispositivos) {
            recordFailedAttempt();
            setLoading(false);
            setError('Limite de dispositivos atingido para este código.');
            return;
          }

          // Code is valid!
          resetRateLimit();
          setValidatedCode({ hash: codeHash, ...codeEntry });
          setLoading(false);
          setStep(2);

        } catch (err) {
          setLoading(false);
          setError('Erro ao verificar código. Verifique sua conexão.');
        }
      };

      const handleEmailSubmit = async () => {
        setError('');
        if (!email) {
          setError('Email é obrigatório');
          return;
        }
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
          setError('Email inválido');
          return;
        }

        // Validate email against code's associated email
        if (validatedCode && validatedCode.email && validatedCode.email !== email) {
          setError('Este código está associado a outro email.');
          return;
        }

        setLoading(true);
        setTimeout(() => {
          setLoading(false);
          setStep(3);
        }, 500);
      };

      const handleSemesterSubmit = () => {
        if (!semester) {
          setError('Selecione seu módulo');
          return;
        }

        // Generate session integrity token
        const sessionToken = btoa(JSON.stringify({
          ts: Date.now(),
          fp: fingerprint,
          ch: validatedCode?.hash?.substring(0, 8) || ''
        }));

        const userData = {
          email,
          codeHash: validatedCode?.hash?.substring(0, 8) || '',
          plano: validatedCode?.plano || 'basico',
          semestre: semester,
          modulo: semester,
          deviceId: fingerprint,
          loginDate: new Date().toISOString(),
          sessionToken
        };
        localStorage.setItem('meduni9_user', JSON.stringify(userData));
        onAuthSuccess(userData);
      };

      return (
        <div className="app-container">
          <div className="screen-content" style={{ display: 'flex', flexDirection: 'column', justifyContent: 'center', height: '100%', paddingBottom: '40px' }}>
            <div className="auth-header">
              <div className="auth-logo">🩺</div>
              <h1 className="auth-title">MedUni9</h1>
              <p className="auth-subtitle">Plataforma de estudos para medicina</p>
            </div>

            <div style={{ maxWidth: '400px', width: '100%', margin: '0 auto' }}>
              {/* Step 1: Code */}
              <div className={`auth-step ${step === 1 ? 'active' : ''}`}>
                <h2 style={{ fontSize: '18px', marginBottom: '8px', color: 'var(--text-primary)' }}>
                  Etapa 1: Código de Acesso
                </h2>
                <p style={{ fontSize: '13px', color: 'var(--text-secondary)', marginBottom: '24px' }}>
                  Digite seu código de ativação no formato XXXX-XXXX-XXXX
                </p>
                {error && step === 1 && <div className="error-message" style={{ marginBottom: '16px' }}>{error}</div>}
                <input
                  className="form-input"
                  type="text"
                  placeholder="XXXX-XXXX-XXXX"
                  value={code}
                  onChange={handleCodeChange}
                  maxLength={14}
                  style={{ textAlign: 'center', fontSize: '20px', letterSpacing: '2px', marginBottom: '16px' }}
                />
                <button
                  className="btn btn-primary"
                  onClick={handleCodeSubmit}
                  disabled={loading}
                >
                  {loading ? 'Verificando...' : 'Continuar'}
                </button>
              </div>

              {/* Step 2: Email */}
              <div className={`auth-step ${step === 2 ? 'active' : ''}`}>
                <h2 style={{ fontSize: '18px', marginBottom: '8px', color: 'var(--text-primary)' }}>
                  Etapa 2: Seu Email
                </h2>
                <p style={{ fontSize: '13px', color: 'var(--text-secondary)', marginBottom: '24px' }}>
                  Informe seu email institucional ou pessoal
                </p>
                {error && step === 2 && <div className="error-message">{error}</div>}
                <input
                  className="form-input"
                  type="email"
                  placeholder="seu@email.com"
                  value={email}
                  onChange={e => setEmail(e.target.value)}
                  style={{ marginBottom: '16px' }}
                />
                <button className="btn btn-primary" onClick={handleEmailSubmit} disabled={loading}>
                  {loading ? 'Verificando...' : 'Continuar'}
                </button>
                <button className="btn btn-secondary mt-2" onClick={() => { setStep(1); setError(''); }}>
                  Voltar
                </button>
              </div>

              {/* Step 3: Module */}
              <div className={`auth-step ${step === 3 ? 'active' : ''}`}>
                <h2 style={{ fontSize: '18px', marginBottom: '8px', color: 'var(--text-primary)' }}>
                  Etapa 3: Seu Módulo
                </h2>
                <p style={{ fontSize: '13px', color: 'var(--text-secondary)', marginBottom: '24px' }}>
                  Em qual módulo da Uninove você está?
                </p>
                {error && step === 3 && <div className="error-message" style={{ marginBottom: '16px' }}>{error}</div>}
                <div className="semester-grid">
                  {[1,2,3,4].map(s => (
                    <button
                      key={s}
                      className={`semester-btn ${semester === s ? 'selected' : ''}`}
                      onClick={() => { setSemester(s); setError(''); }}
                    >
                      Módulo {s}
                    </button>
                  ))}
                </div>
                <button className="btn btn-primary" onClick={handleSemesterSubmit}>
                  Entrar
                </button>
                <button className="btn btn-secondary mt-2" onClick={() => { setStep(2); setError(''); }}>
                  Voltar
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    };

    // Dashboard Screen
    const DashboardScreen = ({ user, materias, flashcards, onSelectMateria }) => {
      const [stats, setStats] = useState({ cardsToday: 0, questionsToday: 0, accuracy: 0 });
      const [viewAll, setViewAll] = useState(false);
      const userSemester = user.semestre || user.modulo || 1;

      useEffect(() => {
        const srData = JSON.parse(localStorage.getItem('meduni9_sr_data') || '{}');
        const quizHistory = JSON.parse(localStorage.getItem('meduni9_quiz_history') || '[]');

        const today = new Date().toDateString();
        const todayQuizzes = quizHistory.filter(q => new Date(q.date).toDateString() === today);
        const correctCount = todayQuizzes.filter(q => q.score === q.total).length;

        setStats({
          cardsToday: Object.keys(srData).length,
          questionsToday: todayQuizzes.length,
          accuracy: todayQuizzes.length > 0 ? Math.round((correctCount / todayQuizzes.length) * 100) : 0
        });
      }, []);

      const dueCards = SM2.getDueCards(flashcards, JSON.parse(localStorage.getItem('meduni9_sr_data') || '{}'));

      const displayMaterias = viewAll
        ? materias.filter(m => m.ativo !== false)
        : materias.filter(m => m.modulo === userSemester && m.ativo !== false);

      // Group by semester when viewing all
      const groupedMaterias = useMemo(() => {
        if (!viewAll) return { [userSemester]: displayMaterias };
        const groups = {};
        displayMaterias.forEach(m => {
          const sem = m.modulo || 0;
          if (!groups[sem]) groups[sem] = [];
          groups[sem].push(m);
        });
        return groups;
      }, [displayMaterias, viewAll, userSemester]);

      return (
        <>
          <div className="screen-content">
            <div className="dashboard-header">
              <h1 className="dashboard-welcome">Olá, {user.email.split('@')[0]}!</h1>
              <p className="dashboard-date">{new Date().toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long' })} — Módulo {userSemester}</p>
            </div>

            <div className="stats-grid">
              <div className="stat-card">
                <div className="stat-icon"><IconLayers /></div>
                <div className="stat-value">{stats.cardsToday}</div>
                <div className="stat-label">Cards</div>
              </div>
              <div className="stat-card">
                <div className="stat-icon"><IconClipboardList /></div>
                <div className="stat-value">{stats.questionsToday}</div>
                <div className="stat-label">Questões</div>
              </div>
              <div className="stat-card">
                <div className="stat-icon"><IconTarget /></div>
                <div className="stat-value">{stats.accuracy}%</div>
                <div className="stat-label">Acurácia</div>
              </div>
            </div>

            {dueCards.length > 0 && (
              <div className="daily-suggestion">
                <div className="suggestion-label">Sugestão do Dia</div>
                <div className="suggestion-title">{dueCards.length} cards para revisar</div>
                <div className="suggestion-progress">
                  <div className="suggestion-progress-bar" style={{ width: `${Math.min(100, Math.round((dueCards.length / Math.max(flashcards.length, 1)) * 100))}%` }}></div>
                </div>
                <div className="suggestion-meta">
                  {Math.round((dueCards.length / Math.max(flashcards.length, 1)) * 100)}% do seu deck
                </div>
                <button className="suggestion-cta" onClick={() => onSelectMateria(null)}>
                  <IconPlay /> Estudar agora
                </button>
              </div>
            )}

            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
              <div className="section-title" style={{ margin: 0 }}>Disciplinas</div>
              <button
                className="semester-tab"
                style={{ marginTop: '24px', fontSize: '12px', padding: '6px 12px' }}
                onClick={() => setViewAll(!viewAll)}
              >
                {viewAll ? 'Meu módulo' : 'Ver todos'}
              </button>
            </div>

            <div className="subject-select-list" style={{ marginTop: '16px' }}>
              {Object.entries(groupedMaterias).sort(([a],[b]) => Number(a) - Number(b)).map(([sem, mats]) => (
                <React.Fragment key={sem}>
                  {viewAll && (
                    <div className="semester-group-header">Módulo {sem}</div>
                  )}
                  {mats.map((materia) => {
                    const materiaCards = flashcards.filter(f => f.materia === materia.id && f.tipo !== 'quiz');
                    const srData = JSON.parse(localStorage.getItem('meduni9_sr_data') || '{}');
                    const reviewedCount = materiaCards.filter(f => srData[f.id]).length;
                    const pct = materiaCards.length > 0 ? Math.round((reviewedCount / materiaCards.length) * 100) : 0;
                    const subjectColor = SUBJECT_ICON_MAP[materia.id]?.color || materia.cor || 'var(--primary)';
                    return (
                      <div
                        key={materia.id}
                        className="subject-select-card"
                        onClick={() => onSelectMateria(materia.id)}
                      >
                        <SubjectIcon materiaId={materia.id} icon={materia.icon} cor={materia.cor} />
                        <div className="subject-select-info">
                          <div className="subject-select-name">{materia.sigla || materia.nome}</div>
                          <div className="subject-select-meta">
                            {materia.nome}{materiaCards.length > 0 ? ` — ${materiaCards.length} cards` : ''}
                          </div>
                          {materiaCards.length > 0 && (
                            <div className="subject-progress-bar">
                              <div className="subject-progress-fill" style={{ width: `${pct}%`, background: subjectColor }} />
                            </div>
                          )}
                        </div>
                        <div style={{ color: 'var(--text-secondary)' }}>
                          <IconChevronRight />
                        </div>
                      </div>
                    );
                  })}
                </React.Fragment>
              ))}

              {displayMaterias.length === 0 && (
                <div style={{ textAlign: 'center', padding: '40px 0', color: 'var(--text-secondary)' }}>
                  <p>Nenhuma disciplina para o Módulo {userSemester} ainda.</p>
                  <button className="btn btn-secondary mt-2" onClick={() => setViewAll(true)}>
                    Ver todas as disciplinas
                  </button>
                </div>
              )}
            </div>
          </div>
        </>
      );
    };

    // Flashcards Screen
    const FlashcardsScreen = ({ flashcards, materias, selectedMateria, onSelectMateria, userSemester }) => {
      const [currentIndex, setCurrentIndex] = useState(0);
      const [isFlipped, setIsFlipped] = useState(false);
      const [sessionComplete, setSessionComplete] = useState(false);
      const [sessionStats, setSessionStats] = useState({ correct: 0, total: 0, skipped: 0 });
      const [semesterFilter, setSemesterFilter] = useState(userSemester || null);
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedTemas, setSelectedTemas] = useState([]); // array de assuntos selecionados
      const [studyMode, setStudyMode] = useState(null); // null = choosing, 'sm2', 'random', 'sequential'
      const srData = JSON.parse(localStorage.getItem('meduni9_sr_data') || '{}');

      // Reset session whenever materia changes (bug fix: sessão não persiste entre matérias)
      useEffect(() => {
        setCurrentIndex(0);
        setIsFlipped(false);
        setSessionComplete(false);
        setSessionStats({ correct: 0, total: 0, skipped: 0 });
        setStudyMode(null);
        setSelectedTemas([]);
      }, [selectedMateria]);

      // Only non-quiz flashcards
      const pureFlashcards = flashcards.filter(f => f.tipo !== 'quiz');

      const filteredByMateria = pureFlashcards.filter(
        f => !selectedMateria || f.materia === selectedMateria
      );

      // Filter by selected temas (empty array = todos os cards da materia)
      const filtered = selectedTemas.length === 0
        ? filteredByMateria
        : filteredByMateria.filter(f => selectedTemas.includes(f.tema));

      // Build deck based on study mode
      const buildDeck = () => {
        if (studyMode === 'random') {
          return [...filtered].sort(() => Math.random() - 0.5);
        } else if (studyMode === 'sequential') {
          return [...filtered];
        } else {
          return SM2.getDueCards(filtered, srData);
        }
      };

      const deck = useMemo(() => {
        if (!selectedMateria || !studyMode) return [];
        return buildDeck();
      }, [selectedMateria, studyMode, filtered.length, selectedTemas.length]);

      const currentCard = deck[currentIndex];

      const handleRate = (quality) => {
        const card = currentCard;
        if (studyMode === 'sm2') {
          const currentData = srData[card.id] || { reps: 0, ef: 2.5, interval: 0, nextReview: Date.now() };
          const result = SM2.calculateNextReview(quality, currentData.reps, currentData.ef, currentData.interval);
          srData[card.id] = { ...result };
          localStorage.setItem('meduni9_sr_data', JSON.stringify(srData));
        }

        if (currentIndex < deck.length - 1) {
          setCurrentIndex(currentIndex + 1);
          setIsFlipped(false);
        } else {
          setSessionComplete(true);
          setSessionStats({
            correct: sessionStats.correct + (quality >= 4 ? 1 : 0),
            total: deck.length,
            skipped: 0
          });
        }
      };

      const resetSession = () => {
        setCurrentIndex(0);
        setIsFlipped(false);
        setSessionComplete(false);
        setSessionStats({ correct: 0, total: 0, skipped: 0 });
        setStudyMode(null);
        setSelectedTemas([]);
      };

      const toggleTema = (temaId) => {
        setSelectedTemas(prev =>
          prev.includes(temaId) ? prev.filter(t => t !== temaId) : [...prev, temaId]
        );
      };

      // If no materia selected, show selection screen
      if (!selectedMateria) {
        const materiasWithCards = materias.filter(m => {
          const count = pureFlashcards.filter(f => f.materia === m.id).length;
          return count > 0;
        });

        const semFiltered = semesterFilter
          ? materiasWithCards.filter(m => m.modulo === semesterFilter)
          : materiasWithCards;

        const filteredMaterias = semFiltered.filter(m =>
          fuzzyMatch(searchQuery, m.nome) || fuzzyMatch(searchQuery, m.sigla || '')
        );

        const semesters = [...new Set(materiasWithCards.filter(m => m.ativo !== false).map(m => m.modulo))].sort((a,b) => a-b);

        return (
          <>
            <div className="screen-content">
              <h2 className="section-title">Flashcards</h2>

              {semesters.length > 1 && (
                <div className="semester-tabs">
                  <button
                    className={`semester-tab ${!semesterFilter ? 'active' : ''}`}
                    onClick={() => setSemesterFilter(null)}
                  >Todos</button>
                  {semesters.map(s => (
                    <button
                      key={s}
                      className={`semester-tab ${semesterFilter === s ? 'active' : ''}`}
                      onClick={() => setSemesterFilter(s)}
                    >Módulo {s}</button>
                  ))}
                </div>
              )}

              <div className="subject-search-wrap">
                <span className="subject-search-icon"><IconSearch /></span>
                <input
                  type="search"
                  className="subject-search"
                  placeholder="Buscar matéria..."
                  value={searchQuery}
                  onChange={e => setSearchQuery(e.target.value)}
                />
              </div>

              <div className="subject-select-list">
                {filteredMaterias.length === 0 && (
                  <div style={{ textAlign: 'center', padding: '40px 0', color: 'var(--text-secondary)' }}>
                    <p>Nenhum resultado encontrado.</p>
                  </div>
                )}
                {filteredMaterias.map(m => {
                  const count = pureFlashcards.filter(f => f.materia === m.id).length;
                  const dueCount = SM2.getDueCards(pureFlashcards.filter(f => f.materia === m.id), srData).length;
                  const reviewedCount = count - dueCount;
                  const pct = count > 0 ? Math.round((reviewedCount / count) * 100) : 0;
                  const subjectColor = SUBJECT_ICON_MAP[m.id]?.color || m.cor || 'var(--primary)';
                  return (
                    <div key={m.id} className="subject-select-card" onClick={() => { onSelectMateria(m.id); setStudyMode(null); }}>
                      <SubjectIcon materiaId={m.id} icon={m.icon} cor={m.cor} />
                      <div className="subject-select-info">
                        <div className="subject-select-name">{m.sigla || m.nome}</div>
                        <div className="subject-select-meta">
                          {count} cards{dueCount > 0 ? ` — ${dueCount} para revisar` : ' — em dia ✓'}
                        </div>
                        <div className="subject-progress-bar">
                          <div className="subject-progress-fill" style={{ width: `${pct}%`, background: subjectColor }} />
                        </div>
                      </div>
                      <div style={{ color: 'var(--text-secondary)' }}><IconChevronRight /></div>
                    </div>
                  );
                })}
              </div>
            </div>
          </>
        );
      }

      const selectedMateriaObj = materias.find(m => m.id === selectedMateria);
      const backLabel = selectedMateriaObj ? (selectedMateriaObj.sigla || selectedMateriaObj.nome) : 'Flashcards';

      // Tema/assunto selection screen (between materia and study mode)
      if (!studyMode) {
        const totalCards = filteredByMateria.length;
        const materiaObj = materias.find(m => m.id === selectedMateria);
        const modulos = getModulos(selectedMateria) || materiaObj?.modulos || null;
        const hasModulos = modulos && modulos.length > 0;

        // Collect all temas that have cards (for unmatched fallback)
        const temasFromCards = [...new Set(filteredByMateria.map(f => f.tema).filter(Boolean))];

        return (
          <>
            <div className="screen-content">
              <button className="back-btn" onClick={() => onSelectMateria(null)}>← Flashcards</button>
              <h2 className="section-title">{backLabel}</h2>
              <p style={{ color: 'var(--text-secondary)', fontSize: '14px', marginBottom: '16px' }}>
                Selecione um ou mais assuntos para estudar:
              </p>
              <div className="subject-select-list" style={{ paddingBottom: selectedTemas.length > 0 ? '72px' : '0' }}>
                {/* Opção: todos os cards — início rápido */}
                <div className="subject-select-card" onClick={() => { setSelectedTemas([]); setStudyMode('choose'); }}
                  style={{ borderColor: 'var(--primary)', background: 'rgba(0,180,216,0.06)', marginBottom: '8px' }}>
                  <div className="subject-select-icon" style={{ background: 'rgba(0,180,216,0.15)', color: 'var(--primary)' }}><IconBookOpen /></div>
                  <div className="subject-select-info">
                    <div className="subject-select-name">Todos os assuntos</div>
                    <div className="subject-select-meta">{totalCards} flashcards</div>
                  </div>
                  <div style={{ color: 'var(--primary)' }}><IconChevronRight /></div>
                </div>

                {hasModulos ? (
                  // Show organized by modules with checkboxes
                  modulos.map((mod, mi) => {
                    const temasWithCards = mod.temas.filter(t => filteredByMateria.some(f => f.tema === t.id));
                    if (temasWithCards.length === 0) return null;
                    return (
                      <div key={mi} style={{ marginBottom: '4px' }}>
                        <div style={{
                          fontSize: '0.72rem', fontWeight: 700, textTransform: 'uppercase',
                          letterSpacing: '0.06em', color: 'var(--text-secondary)',
                          padding: '10px 4px 6px', borderTop: '1px solid rgba(255,255,255,0.06)'
                        }}>{mod.nome}</div>
                        {temasWithCards.map(tema => {
                          const cards = filteredByMateria.filter(f => f.tema === tema.id);
                          const dueCount = SM2.getDueCards(cards, srData).length;
                          const isChecked = selectedTemas.includes(tema.id);
                          return (
                            <div key={tema.id} className={`subject-select-card${isChecked ? ' tema-selected' : ''}`} onClick={() => toggleTema(tema.id)}>
                              <div className={`tema-checkbox${isChecked ? ' tema-checkbox-checked' : ''}`}>{isChecked ? '✓' : ''}</div>
                              <div className="subject-select-info">
                                <div className="subject-select-name">{tema.nome}</div>
                                <div className="subject-select-meta">
                                  {cards.length} cards{dueCount > 0 ? ` — ${dueCount} para revisar` : ' — em dia'}
                                </div>
                              </div>
                            </div>
                          );
                        })}
                      </div>
                    );
                  })
                ) : (
                  // Fallback: flat list from card data with checkboxes
                  temasFromCards.sort().map(tema => {
                    const count = filteredByMateria.filter(f => f.tema === tema).length;
                    const dueCount = SM2.getDueCards(filteredByMateria.filter(f => f.tema === tema), srData).length;
                    const isChecked = selectedTemas.includes(tema);
                    return (
                      <div key={tema} className={`subject-select-card${isChecked ? ' tema-selected' : ''}`} onClick={() => toggleTema(tema)}>
                        <div className={`tema-checkbox${isChecked ? ' tema-checkbox-checked' : ''}`}>{isChecked ? '✓' : ''}</div>
                        <div className="subject-select-info">
                          <div className="subject-select-name">{tema}</div>
                          <div className="subject-select-meta">
                            {count} cards{dueCount > 0 ? ` — ${dueCount} para revisar` : ' — em dia'}
                          </div>
                        </div>
                      </div>
                    );
                  })
                )}
              </div>

              {/* Barra sticky de início com aulas selecionadas */}
              {selectedTemas.length > 0 && (
                <div className="tema-start-bar">
                  <span style={{ color: 'var(--text-secondary)', fontSize: '13px' }}>
                    {selectedTemas.length} assunto{selectedTemas.length > 1 ? 's' : ''} selecionado{selectedTemas.length > 1 ? 's' : ''}
                  </span>
                  <button className="btn btn-primary" style={{ padding: '8px 20px', fontSize: '14px' }} onClick={() => setStudyMode('choose')}>
                    Iniciar estudo →
                  </button>
                </div>
              )}
            </div>
          </>
        );
      }

      // Build temaLabel for study mode / session screens
      const temaLabel = selectedTemas.length === 0
        ? 'Todos os assuntos'
        : selectedTemas.length === 1
          ? (() => {
              const mods = getModulos(selectedMateria) || materias.find(m => m.id === selectedMateria)?.modulos || [];
              const obj = mods.flatMap(mod => mod.temas).find(t => t.id === selectedTemas[0]);
              return obj?.nome || selectedTemas[0];
            })()
          : `${selectedTemas.length} assuntos`;

      // Study mode selection screen
      if (studyMode === 'choose') {
        const dueCount = SM2.getDueCards(filtered, srData).length;
        return (
          <>
            <div className="screen-content">
              <button className="back-btn" onClick={() => setStudyMode(null)}>← {backLabel}</button>
              <h2 className="section-title" style={{ fontSize: '16px' }}>{temaLabel}</h2>
              <p style={{ color: 'var(--text-secondary)', fontSize: '14px', marginBottom: '8px' }}>
                {filtered.length} cards disponíveis. Escolha o modo:
              </p>
              <div className="study-mode-selector">
                <button className="study-mode-btn" onClick={() => setStudyMode('sm2')} disabled={dueCount === 0}>
                  <span className="study-mode-icon">🧠</span>
                  <div>
                    <div className="study-mode-title">Revisão Espaçada</div>
                    <div className="study-mode-desc">{dueCount > 0 ? `${dueCount} cards para revisar hoje` : 'Nenhum pendente hoje'}</div>
                  </div>
                </button>
                <button className="study-mode-btn" onClick={() => setStudyMode('random')}>
                  <span className="study-mode-icon">🎲</span>
                  <div>
                    <div className="study-mode-title">Aleatório</div>
                    <div className="study-mode-desc">Todos os {filtered.length} cards embaralhados</div>
                  </div>
                </button>
                <button className="study-mode-btn" onClick={() => setStudyMode('sequential')}>
                  <span className="study-mode-icon">📋</span>
                  <div>
                    <div className="study-mode-title">Sequencial</div>
                    <div className="study-mode-desc">Todos os {filtered.length} cards em ordem</div>
                  </div>
                </button>
              </div>
            </div>
          </>
        );
      }

      // Session complete
      if (sessionComplete) {
        return (
          <>
            <div className="screen-content">
              <div className="session-complete">
                <div className="session-icon">🎉</div>
                <h2 className="session-title">Sessão Concluída!</h2>
                <div className="session-stats">
                  <div className="session-stat">
                    <span className="session-stat-label">Cards Revisados</span>
                    <span className="session-stat-value">{sessionStats.total}</span>
                  </div>
                  <div className="session-stat">
                    <span className="session-stat-label">Acertos</span>
                    <span className="session-stat-value">{sessionStats.correct}</span>
                  </div>
                  <div className="session-stat">
                    <span className="session-stat-label">Taxa de Acerto</span>
                    <span className="session-stat-value">
                      {Math.round((sessionStats.correct / Math.max(sessionStats.total, 1)) * 100)}%
                    </span>
                  </div>
                </div>
                <button className="btn btn-primary" onClick={resetSession}>Nova Sessão</button>
                <button className="btn btn-secondary mt-2" onClick={() => { setStudyMode(null); setSelectedTemas([]); }}>Escolher outro assunto</button>
              </div>
            </div>
          </>
        );
      }

      // No cards
      if (deck.length === 0) {
        return (
          <>
            <div className="screen-content">
              <button className="back-btn" onClick={() => setStudyMode(null)}>← {temaLabel}</button>
              <div style={{ textAlign: 'center', marginTop: '60px' }}>
                <div style={{ fontSize: '60px', marginBottom: '20px' }}>✨</div>
                <p style={{ color: 'var(--text-secondary)', marginBottom: '20px' }}>
                  Nenhum card para revisar agora!
                </p>
                <p style={{ color: 'var(--text-secondary)', fontSize: '13px' }}>
                  Todos os cards estão em dia. Volte mais tarde.
                </p>
                <button className="btn btn-secondary mt-2" style={{ marginTop: '20px' }} onClick={() => setStudyMode(null)}>Escolher outro modo</button>
              </div>
            </div>
          </>
        );
      }

      // Flashcard study session
      return (
        <>
          <div className="screen-content">
            <button className="back-btn" onClick={() => setStudyMode(null)}>
              ← {temaLabel}
            </button>

            <div className="flashcard-progress" style={{ marginBottom: '16px' }}>
              <div style={{ textAlign: 'center', fontSize: '13px', color: 'var(--text-secondary)', marginBottom: '8px' }}>
                {currentIndex + 1} de {deck.length}
              </div>
              <div className="progress-dots">
                {deck.slice(0, Math.min(deck.length, 30)).map((card, idx) => (
                  <div
                    key={idx}
                    className={`progress-dot ${idx === currentIndex ? 'current' : ''} ${idx < currentIndex ? 'completed' : ''}`}
                  ></div>
                ))}
                {deck.length > 30 && <span style={{ color: 'var(--text-secondary)', fontSize: '11px' }}>+{deck.length - 30}</span>}
              </div>
            </div>

            <div className="flashcard-container">
              <div className="flashcard">
                <div
                  className={`flashcard-inner ${isFlipped ? 'flipped' : ''}`}
                  onClick={() => setIsFlipped(!isFlipped)}
                  style={{ cursor: 'pointer' }}
                >
                  <div className="flashcard-front">
                    <div className="flashcard-label">Pergunta</div>
                    <div className="flashcard-text">{currentCard.pergunta}</div>
                    <div style={{ fontSize: '12px', color: 'var(--text-secondary)', marginTop: '8px' }}>Toque para ver a resposta</div>
                  </div>
                  <div className="flashcard-back">
                    <div className="flashcard-label">Resposta</div>
                    <div className="flashcard-text">{currentCard.resposta}</div>
                  </div>
                </div>
              </div>
            </div>

            <div className="flashcard-actions">
              <button className="rate-btn error" onClick={() => handleRate(1)}>
                <IconX />
                Errei
              </button>
              <button className="rate-btn warning" onClick={() => handleRate(3)}>
                <IconClock />
                Difícil
              </button>
              <button className="rate-btn success" onClick={() => handleRate(5)}>
                <IconCheck />
                Fácil
              </button>
            </div>
          </div>
        </>
      );
    };

    // Quiz Screen
    const QuizScreen = ({ flashcards, materias, selectedMateria, onSelectMateria, userSemester }) => {
      const [activeQuiz, setActiveQuiz] = useState(null);
      const [activeTemas, setActiveTemas] = useState([]); // array de assuntos selecionados para o quiz
      const [showTemaSelector, setShowTemaSelector] = useState(false); // showing tema list for a materia
      const [pendingQuiz, setPendingQuiz] = useState(null); // materia waiting for tema selection
      const [pendingTemas, setPendingTemas] = useState([]); // temas sendo selecionados no selector
      const [currentQuestion, setCurrentQuestion] = useState(0);
      const [selectedOption, setSelectedOption] = useState(null);
      const [crossedOut, setCrossedOut] = useState(new Set());
      const [answered, setAnswered] = useState(false);
      const [quizStats, setQuizStats] = useState({ correct: 0, total: 0 });
      const [startTime, setStartTime] = useState(Date.now());
      const [quizComplete, setQuizComplete] = useState(false);
      const [semesterFilter, setSemesterFilter] = useState(userSemester || null);
      const [categoryFilter, setCategoryFilter] = useState('todas');
      const [searchQuery, setSearchQuery] = useState('');

      // Separate real quiz questions from flashcards
      const quizQuestions = useMemo(() => {
        return flashcards.filter(f => f.tipo === 'quiz' && f.opcoes && f.opcoes.length > 0);
      }, [flashcards]);

      const quizzes = useMemo(() => {
        const grouped = {};
        materias.forEach(m => {
          const questions = quizQuestions.filter(f => f.materia === m.id);
          if (questions.length > 0) {
            grouped[m.id] = { name: m.nome, sigla: m.sigla, cards: questions, icon: m.icon, semestre: m.modulo, ativo: m.ativo };
          }
        });
        return grouped;
      }, [quizQuestions, materias]);

      const filteredQuizzes = useMemo(() => {
        let result = { ...quizzes };
        // semester filter
        if (semesterFilter) {
          const f = {};
          Object.entries(result).forEach(([id, q]) => {
            if (q.semestre === semesterFilter && q.ativo !== false) f[id] = q;
          });
          result = f;
        }
        // category filter — filter cards inside each quiz
        if (categoryFilter !== 'todas') {
          const f = {};
          Object.entries(result).forEach(([id, q]) => {
            const cards = q.cards.filter(c => c.categoria === categoryFilter);
            if (cards.length > 0) f[id] = { ...q, cards };
          });
          result = f;
        }
        // search filter
        if (searchQuery) {
          const f = {};
          Object.entries(result).forEach(([id, q]) => {
            if (fuzzyMatch(searchQuery, q.name) || fuzzyMatch(searchQuery, q.sigla || '')) f[id] = q;
          });
          result = f;
        }
        return result;
      }, [quizzes, semesterFilter, categoryFilter, searchQuery]);

      const handleQuizStart = (materiaId, temasArray) => {
        setActiveQuiz(materiaId);
        setActiveTemas(temasArray || []);
        setCurrentQuestion(0);
        setSelectedOption(null);
        setCrossedOut(new Set());
        setAnswered(false);
        setQuizStats({ correct: 0, total: 0 });
        setStartTime(Date.now());
        setShowTemaSelector(false);
        setPendingQuiz(null);
        setPendingTemas([]);
        setQuizComplete(false);
      };

      const handleMateriaClick = (materiaId) => {
        // Check if this materia has multiple temas — show selector
        const cards = quizzes[materiaId]?.cards || [];
        const temas = [...new Set(cards.map(c => c.tema).filter(Boolean))];
        if (temas.length > 1) {
          setPendingQuiz(materiaId);
          setPendingTemas([]);
          setShowTemaSelector(true);
        } else {
          handleQuizStart(materiaId, []);
        }
      };

      const togglePendingTema = (temaId) => {
        setPendingTemas(prev =>
          prev.includes(temaId) ? prev.filter(t => t !== temaId) : [...prev, temaId]
        );
      };

      const toggleCross = (idx) => {
        const next = new Set(crossedOut);
        if (next.has(idx)) next.delete(idx);
        else next.add(idx);
        if (selectedOption === idx) setSelectedOption(null);
        setCrossedOut(next);
      };

      const getActiveCards = () => {
        if (!activeQuiz) return [];
        const quiz = quizzes[activeQuiz];
        if (!quiz) return [];
        return activeTemas.length > 0
          ? quiz.cards.filter(c => activeTemas.includes(c.tema))
          : quiz.cards;
      };

      const handleAnswer = () => {
        const activeCards = getActiveCards();
        const card = activeCards[currentQuestion];
        const correct = selectedOption === card.correta;

        if (correct) {
          setQuizStats(prev => ({ ...prev, correct: prev.correct + 1 }));
        }
        setAnswered(true);
      };

      const handleNextQuestion = () => {
        const activeCards = getActiveCards();
        if (currentQuestion < activeCards.length - 1) {
          setCurrentQuestion(currentQuestion + 1);
          setSelectedOption(null);
          setCrossedOut(new Set());
          setAnswered(false);
        } else {
          const card = activeCards[currentQuestion];
          const lastCorrect = selectedOption === card.correta;
          const finalCorrect = quizStats.correct + (lastCorrect && !answered ? 1 : 0);
          setQuizComplete(true);
          const quizHistory = JSON.parse(localStorage.getItem('meduni9_quiz_history') || '[]');
          quizHistory.push({
            date: new Date().toISOString(),
            materia: activeQuiz,
            score: finalCorrect,
            total: getActiveCards().length,
            time: formatTime(Date.now() - startTime)
          });
          localStorage.setItem('meduni9_quiz_history', JSON.stringify(quizHistory));
        }
      };

      const handleRestartQuiz = () => {
        handleQuizStart(activeQuiz, activeTemas);
        setQuizComplete(false);
      };

      if (quizComplete) {
        const activeCards = getActiveCards();
        const percentage = Math.round((quizStats.correct / Math.max(activeCards.length, 1)) * 100);

        return (
          <>
            <div className="screen-content">
              <div className="quiz-result-screen">
                <div style={{ fontSize: '60px', marginBottom: '20px' }}>
                  {percentage >= 70 ? '🎉' : percentage >= 50 ? '👍' : '💪'}
                </div>
                <div className="quiz-score">{percentage}%</div>
                <p style={{ color: 'var(--text-secondary)', marginBottom: '8px' }}>
                  {quizStats.correct} de {activeCards.length} questões
                  {activeTemas.length === 1 && <span> — {activeTemas[0]}</span>}
                  {activeTemas.length > 1 && <span> — {activeTemas.length} assuntos</span>}
                </p>
                <div className="quiz-time">{formatTime(Date.now() - startTime)}</div>
                <div style={{ marginTop: '32px', display: 'flex', flexDirection: 'column', gap: '12px' }}>
                  <button className="btn btn-primary" onClick={handleRestartQuiz}>Tentar Novamente</button>
                  <button className="btn btn-secondary" onClick={() => { setActiveQuiz(null); setActiveTemas([]); setQuizComplete(false); }}>Voltar</button>
                </div>
              </div>
            </div>
          </>
        );
      }

      // Tema selector screen for quiz (multi-select)
      if (showTemaSelector && pendingQuiz) {
        const quiz = quizzes[pendingQuiz];
        const modulosQ = getModulos(pendingQuiz) || materias.find(m => m.id === pendingQuiz)?.modulos || null;
        const hasModulosQ = modulosQ && modulosQ.length > 0;
        const temasFromCardsQ = [...new Set(quiz.cards.map(c => c.tema).filter(Boolean))];

        return (
          <>
            <div className="screen-content">
              <button className="back-btn" onClick={() => { setShowTemaSelector(false); setPendingQuiz(null); setPendingTemas([]); }}>← Questões</button>
              <h2 className="section-title">{quiz.sigla || quiz.name}</h2>
              <p style={{ color: 'var(--text-secondary)', fontSize: '14px', marginBottom: '16px' }}>
                Selecione um ou mais assuntos:
              </p>
              <div className="subject-select-list" style={{ paddingBottom: pendingTemas.length > 0 ? '72px' : '0' }}>
                {/* Início rápido: todas as questões */}
                <div className="subject-select-card" onClick={() => handleQuizStart(pendingQuiz, [])}
                  style={{ borderColor: 'var(--primary)', background: 'rgba(0,180,216,0.06)', marginBottom: '8px' }}>
                  <div className="subject-select-icon" style={{ background: 'rgba(0,180,216,0.15)', color: 'var(--primary)' }}><IconClipboardList /></div>
                  <div className="subject-select-info">
                    <div className="subject-select-name">Todas as questões</div>
                    <div className="subject-select-meta">{quiz.cards.length} questões</div>
                  </div>
                  <div style={{ color: 'var(--primary)' }}><IconChevronRight /></div>
                </div>
                {hasModulosQ ? (
                  modulosQ.map((mod, mi) => {
                    const temasWithCards = mod.temas.filter(t => quiz.cards.some(c => c.tema === t.id));
                    if (temasWithCards.length === 0) return null;
                    return (
                      <div key={mi}>
                        <div style={{
                          fontSize: '0.72rem', fontWeight: 700, textTransform: 'uppercase',
                          letterSpacing: '0.06em', color: 'var(--text-secondary)',
                          padding: '10px 4px 6px', borderTop: '1px solid rgba(255,255,255,0.06)'
                        }}>{mod.nome}</div>
                        {temasWithCards.map(tema => {
                          const count = quiz.cards.filter(c => c.tema === tema.id).length;
                          const isChecked = pendingTemas.includes(tema.id);
                          return (
                            <div key={tema.id} className={`subject-select-card${isChecked ? ' tema-selected' : ''}`} onClick={() => togglePendingTema(tema.id)}>
                              <div className={`tema-checkbox${isChecked ? ' tema-checkbox-checked' : ''}`}>{isChecked ? '✓' : ''}</div>
                              <div className="subject-select-info">
                                <div className="subject-select-name">{tema.nome}</div>
                                <div className="subject-select-meta">{count} questões</div>
                              </div>
                            </div>
                          );
                        })}
                      </div>
                    );
                  })
                ) : (
                  temasFromCardsQ.sort().map(tema => {
                    const count = quiz.cards.filter(c => c.tema === tema).length;
                    const isChecked = pendingTemas.includes(tema);
                    return (
                      <div key={tema} className={`subject-select-card${isChecked ? ' tema-selected' : ''}`} onClick={() => togglePendingTema(tema)}>
                        <div className={`tema-checkbox${isChecked ? ' tema-checkbox-checked' : ''}`}>{isChecked ? '✓' : ''}</div>
                        <div className="subject-select-info">
                          <div className="subject-select-name">{tema}</div>
                          <div className="subject-select-meta">{count} questões</div>
                        </div>
                      </div>
                    );
                  })
                )}
              </div>

              {/* Barra sticky de início com aulas selecionadas */}
              {pendingTemas.length > 0 && (
                <div className="tema-start-bar">
                  <span style={{ color: 'var(--text-secondary)', fontSize: '13px' }}>
                    {pendingTemas.length} assunto{pendingTemas.length > 1 ? 's' : ''} selecionado{pendingTemas.length > 1 ? 's' : ''}
                  </span>
                  <button className="btn btn-primary" style={{ padding: '8px 20px', fontSize: '14px' }} onClick={() => handleQuizStart(pendingQuiz, pendingTemas)}>
                    Iniciar questões →
                  </button>
                </div>
              )}
            </div>
          </>
        );
      }

      if (activeQuiz) {
        const quiz = quizzes[activeQuiz];
        const activeCards = getActiveCards();
        const card = activeCards[currentQuestion];
        const progress = ((currentQuestion + 1) / activeCards.length) * 100;

        return (
          <>
            <div className="screen-content">
              <button className="back-btn" onClick={() => { setActiveQuiz(null); setActiveTemas([]); }}>
                ← {activeTemas.length === 1 ? activeTemas[0] : (quiz.sigla || quiz.name)}
              </button>
              <div className="quiz-screen">
                <div className="quiz-progress-section">
                  <div className="quiz-progress-bar">
                    <div className="quiz-progress-fill" style={{ width: `${progress}%` }}></div>
                  </div>
                  <div className="quiz-counter">
                    {currentQuestion + 1} de {activeCards.length}
                    {card.tema && activeTemas.length !== 1 && <span style={{ marginLeft: '8px', color: 'var(--primary)', fontSize: '11px' }}>{card.tema}</span>}
                  </div>
                </div>

                <div className="quiz-question-card">
                  <div className="quiz-question">{card.pergunta}</div>
                </div>

                <div className="quiz-options">
                  {card.opcoes.map((option, idx) => (
                    <div
                      key={idx}
                      className={`quiz-option ${
                        crossedOut.has(idx) ? 'crossed-out' : ''
                      } ${
                        selectedOption === idx && !answered ? 'selected' : ''
                      } ${
                        answered && idx === card.correta ? 'correct' : ''
                      } ${
                        answered && selectedOption === idx && idx !== card.correta ? 'incorrect' : ''
                      }`}
                      onClick={() => {
                        if (!answered && !crossedOut.has(idx)) setSelectedOption(idx);
                      }}
                    >
                      <span>{option}</span>
                      {!answered && !crossedOut.has(idx) && (
                        <button
                          className="cross-btn"
                          onClick={(e) => { e.stopPropagation(); toggleCross(idx); }}
                          title="Riscar alternativa"
                        >✕</button>
                      )}
                    </div>
                  ))}
                </div>

                {answered && card.explicacao && (
                  <div className="quiz-feedback">
                    <div className="quiz-feedback-title">
                      {selectedOption === card.correta ? '✓ Correto!' : '✗ Incorreto'}
                    </div>
                    <p style={{ color: 'var(--text-secondary)', lineHeight: '1.6' }}>{card.explicacao}</p>
                  </div>
                )}

                {!answered ? (
                  <button
                    className="btn btn-primary"
                    onClick={handleAnswer}
                    disabled={selectedOption === null}
                  >
                    Confirmar Resposta
                  </button>
                ) : (
                  <button className="btn btn-primary" onClick={handleNextQuestion}>
                    {currentQuestion === activeCards.length - 1 ? 'Finalizar' : 'Próxima Questão'}
                  </button>
                )}
              </div>
            </div>
          </>
        );
      }

      // Quiz list with semester filter, category tabs, search
      const semesters = [...new Set(Object.values(quizzes).filter(q => q.ativo !== false).map(q => q.semestre))].sort((a,b) => a-b);

      return (
        <>
          <div className="screen-content">
            <h2 className="section-title">Questões</h2>

            {/* Category tabs */}
            <div className="category-tabs">
              {[['todas','Todas'],['antiga','Questões Antigas'],['inedita','Inéditas']].map(([val, label]) => (
                <button
                  key={val}
                  className={`category-tab ${categoryFilter === val ? 'active' : ''}`}
                  onClick={() => setCategoryFilter(val)}
                >{label}</button>
              ))}
            </div>

            {semesters.length > 1 && (
              <div className="semester-tabs">
                <button
                  className={`semester-tab ${!semesterFilter ? 'active' : ''}`}
                  onClick={() => setSemesterFilter(null)}
                >Todos</button>
                {semesters.map(s => (
                  <button
                    key={s}
                    className={`semester-tab ${semesterFilter === s ? 'active' : ''}`}
                    onClick={() => setSemesterFilter(s)}
                  >Módulo {s}</button>
                ))}
              </div>
            )}

            <div className="subject-search-wrap">
              <span className="subject-search-icon">🔍</span>
              <input
                type="search"
                className="subject-search"
                placeholder="Buscar matéria..."
                value={searchQuery}
                onChange={e => setSearchQuery(e.target.value)}
              />
            </div>

            <div className="subject-select-list">
              {Object.entries(filteredQuizzes).length === 0 && (
                <div style={{ textAlign: 'center', padding: '40px 0', color: 'var(--text-secondary)' }}>
                  <p>Nenhuma questão encontrada.</p>
                </div>
              )}
              {Object.entries(filteredQuizzes).map(([id, quiz]) => (
                <div key={id} className="subject-select-card" onClick={() => handleMateriaClick(id)}>
                  <SubjectIcon materiaId={id} icon={quiz.icon} cor={quiz.cor} />
                  <div className="subject-select-info">
                    <div className="subject-select-name">{quiz.sigla || quiz.name}</div>
                    <div className="subject-select-meta">{quiz.cards.length} questões — Módulo {quiz.semestre}</div>
                  </div>
                  <div style={{ color: 'var(--text-secondary)' }}>
                    <IconChevronRight />
                  </div>
                </div>
              ))}
            </div>
          </div>
        </>
      );
    };

    // Materials Screen
    const MaterialsScreen = ({ materias }) => {
      const [expandedMaterias, setExpandedMaterias] = useState({});
      const [searchQuery, setSearchQuery] = useState('');

      const toggleMateria = (id) => {
        setExpandedMaterias(prev => ({ ...prev, [id]: !prev[id] }));
      };

      const getMateriaModulos = (materia) => getModulos(materia.id) || materia.modulos || null;

      const totalTemas = (materia) => {
        const mods = getMateriaModulos(materia);
        if (!mods) return 0;
        return mods.reduce((acc, mod) => acc + (mod.temas?.length || 0), 0);
      };

      const filteredMaterias = materias.filter(m =>
        fuzzyMatch(searchQuery, m.nome) || fuzzyMatch(searchQuery, m.sigla || '')
      );

      return (
        <>
          <div className="screen-content">
            <h2 className="section-title">Materiais de Apoio</h2>
            <input
              type="search"
              className="subject-search"
              placeholder="Buscar matéria..."
              value={searchQuery}
              onChange={e => setSearchQuery(e.target.value)}
              style={{ marginBottom: '16px' }}
            />
            <div className="materials-list">
              {filteredMaterias.map(materia => {
                const total = totalTemas(materia);
                const isExpanded = expandedMaterias[materia.id];
                return (
                  <div key={materia.id} className="material-subject">
                    <div className="material-subject-name" style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
                      <span style={{ display: 'flex', alignItems: 'center', gap: '8px' }}>
                        <SubjectIcon materiaId={materia.id} icon={materia.icon} cor={materia.cor} />
                        {materia.sigla || materia.nome}
                      </span>
                      {total > 0 && (
                        <button
                          onClick={() => toggleMateria(materia.id)}
                          style={{
                            background: 'rgba(255,255,255,0.06)',
                            border: '1px solid rgba(255,255,255,0.12)',
                            borderRadius: '8px',
                            color: 'var(--text-secondary)',
                            fontSize: '0.78rem',
                            padding: '4px 10px',
                            cursor: 'pointer',
                            display: 'flex',
                            alignItems: 'center',
                            gap: '5px'
                          }}
                        >
                          {isExpanded ? '▲' : '▼'} {total} aulas
                        </button>
                      )}
                    </div>

                    {total > 0 && isExpanded && (
                      <div style={{ marginTop: '10px', marginBottom: '4px' }}>
                        {getMateriaModulos(materia).map((mod, mi) => (
                          <div key={mi} style={{ marginBottom: '10px' }}>
                            <div style={{
                              fontSize: '0.72rem',
                              fontWeight: 700,
                              textTransform: 'uppercase',
                              letterSpacing: '0.06em',
                              color: 'var(--text-secondary)',
                              marginBottom: '6px',
                              paddingLeft: '2px'
                            }}>{mod.nome}</div>
                            {mod.temas.map((tema, ti) => (
                              <div key={ti} style={{
                                display: 'flex',
                                alignItems: 'flex-start',
                                gap: '8px',
                                padding: '7px 10px',
                                borderRadius: '8px',
                                background: 'rgba(255,255,255,0.03)',
                                border: '1px solid rgba(255,255,255,0.06)',
                                marginBottom: '4px'
                              }}>
                                <span style={{ color: materia.cor || 'var(--primary)', fontSize: '0.85rem', marginTop: '1px' }}>•</span>
                                <div>
                                  <div style={{ fontSize: '0.88rem', color: 'var(--text-primary)', fontWeight: 500 }}>{tema.nome}</div>
                                  {tema.descricao && (
                                    <div style={{ fontSize: '0.75rem', color: 'var(--text-secondary)', marginTop: '2px' }}>{tema.descricao}</div>
                                  )}
                                </div>
                              </div>
                            ))}
                          </div>
                        ))}
                      </div>
                    )}

                    <div className="material-slots" style={{ marginTop: total > 0 ? '8px' : undefined }}>
                      <div className="material-slot">
                        <span className="material-slot-name">
                          <span style={{ color: 'var(--text-secondary)', display: 'flex' }}><IconFileText /></span>
                          Resumo Didático
                        </span>
                        <span className="material-badge">Em breve</span>
                      </div>
                      <div className="material-slot">
                        <span className="material-slot-name">
                          <span style={{ color: 'var(--text-secondary)', display: 'flex' }}><IconPieChart /></span>
                          Análise de Provas
                        </span>
                        <span className="material-badge">Em breve</span>
                      </div>
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        </>
      );
    };

    // Profile Screen
    const ProfileScreen = ({ user, onLogout, onChangeSemester }) => {
      const [stats, setStats] = useState({
        cardsReviewed: 0,
        questionsAnswered: 0,
        streak: 0,
        studyHours: 0
      });

      useEffect(() => {
        const srData = JSON.parse(localStorage.getItem('meduni9_sr_data') || '{}');
        const quizHistory = JSON.parse(localStorage.getItem('meduni9_quiz_history') || '[]');

        setStats({
          cardsReviewed: Object.keys(srData).length,
          questionsAnswered: quizHistory.length,
          streak: 5,
          studyHours: Math.floor(quizHistory.length * 0.5)
        });
      }, []);

      const username = user.email ? user.email.split('@')[0] : 'Usuário';
      const avatarLetter = username.charAt(0).toUpperCase();

      return (
        <>
          <div className="screen-content">
            <div className="profile-avatar">{avatarLetter}</div>
            <div className="profile-name">{username}</div>
            <div className="profile-meta">Módulo {user.modulo || 1} · Plano Básico</div>

            <div className="profile-stats">
              <div className="profile-stat">
                <div className="profile-stat-icon" style={{ color: 'var(--primary)' }}><IconLayers /></div>
                <div className="profile-stat-value">{stats.cardsReviewed}</div>
                <div className="profile-stat-label">Cards</div>
              </div>
              <div className="profile-stat">
                <div className="profile-stat-icon" style={{ color: 'var(--success)' }}><IconClipboardList /></div>
                <div className="profile-stat-value">{stats.questionsAnswered}</div>
                <div className="profile-stat-label">Questões</div>
              </div>
              <div className="profile-stat">
                <div className="profile-stat-icon" style={{ color: 'var(--warning)' }}><IconFlame /></div>
                <div className="profile-stat-value">{stats.streak}</div>
                <div className="profile-stat-label">Sequência</div>
              </div>
              <div className="profile-stat">
                <div className="profile-stat-icon" style={{ color: 'var(--purple)' }}><IconClock /></div>
                <div className="profile-stat-value">{stats.studyHours}h</div>
                <div className="profile-stat-label">Estudo</div>
              </div>
            </div>

            <div className="profile-section">
              <div className="profile-item">
                <span className="profile-label">Email</span>
                <span className="profile-value" style={{ fontSize: '13px' }}>{user.email}</span>
              </div>
              <div className="profile-item">
                <span className="profile-label">Módulo</span>
                <span className="profile-value" style={{ display: 'flex', alignItems: 'center', gap: '8px' }}>
                  Módulo {user.semestre || user.modulo || 1}
                  <button
                    className="semester-tab"
                    style={{ fontSize: '11px', padding: '4px 10px' }}
                    onClick={onChangeSemester}
                  >Trocar</button>
                </span>
              </div>
              <div className="profile-item">
                <span className="profile-label">Código</span>
                <span className="profile-value" style={{ fontSize: '12px', fontFamily: 'monospace' }}>{user.code}</span>
              </div>
            </div>

            <button className="btn btn-error" onClick={onLogout} style={{ marginTop: '8px' }}>
              <IconLogOut />
              Fazer Logout
            </button>

            <div style={{ textAlign: 'center', marginTop: '24px', paddingBottom: '20px' }}>
              <p style={{ color: 'var(--text-secondary)', fontSize: '11px' }}>MedUni9 v1.0.0</p>
            </div>
          </div>
        </>
      );
    };

    // ===================== Main App =====================
    function normalizeText(str) {
      return (str || '').toLowerCase()
        .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
        .replace(/\s+/g, '').replace(/[^a-z0-9]/g, '');
    }
    function fuzzyMatch(query, target) {
      const q = normalizeText(query);
      const t = normalizeText(target);
      if (!q) return true;
      if (t.includes(q)) return true;
      let qi = 0;
      for (let ti = 0; ti < t.length && qi < q.length; ti++) {
        if (t[ti] === q[qi]) qi++;
      }
      return qi === q.length;
    }

    const MedUni9App = () => {
      const [stage, setStage] = useState('splash'); // splash, auth, app
      const [user, setUser] = useState(null);
      const [currentTab, setCurrentTab] = useState('home');
      const [materias, setMaterias] = useState([]);
      const [flashcards, setFlashcards] = useState([]);
      const [selectedMateria, setSelectedMateria] = useState(null);
      const [loading, setLoading] = useState(true);
      const [sidebarOpen, setSidebarOpen] = useState(true);

      useEffect(() => {
        // Check if user is already logged in
        const savedUser = localStorage.getItem('meduni9_user');
        if (savedUser) {
          setUser(JSON.parse(savedUser));
          setStage('app');
        }
      }, []);

      useEffect(() => {
        // Load data when app starts
        if (stage === 'app' && loading) {
          loadAppData();
        }
      }, [stage, loading]);

      const loadAppData = async () => {
        try {
          // Load data from external JSON files
          const [materiasRes, flashcardsRes, questoesRes, antigasRes, ineditasRes] = await Promise.all([
            fetch('data/materias.json').catch(() => null),
            fetch('data/flashcards.json').catch(() => null),
            fetch('data/questoes.json').catch(() => null),
            fetch('data/questoes_antigas.json').catch(() => null),
            fetch('data/questoes_ineditas.json').catch(() => null)
          ]);

          let materiasData = [];
          let flashcardsData = [];

          if (materiasRes && materiasRes.ok) {
            const raw = await materiasRes.json();
            // Convert object format to array with id
            materiasData = Object.entries(raw)
              .filter(([k]) => !k.startsWith('_'))
              .map(([id, val]) => ({ id, ...val, pergunta: val.frente, resposta: val.verso }));
          }

          if (flashcardsRes && flashcardsRes.ok) {
            const raw = await flashcardsRes.json();
            const cards = raw.flashcards || raw;
            flashcardsData = (Array.isArray(cards) ? cards : []).map(c => ({
              ...c,
              pergunta: c.frente || c.pergunta,
              resposta: c.verso || c.resposta
            }));
          }

          let questoesArray = [];
          
          if (questoesRes && questoesRes.ok) {
            const raw = await questoesRes.json();
            const questoes = raw.questoes || raw;
            questoesArray = questoesArray.concat(Array.isArray(questoes) ? questoes : []);
          }
          
          if (antigasRes && antigasRes.ok) {
            const raw = await antigasRes.json();
            const questoes = raw.questoes || raw;
            questoesArray = questoesArray.concat(Array.isArray(questoes) ? questoes : []);
          }
          
          if (ineditasRes && ineditasRes.ok) {
            const raw = await ineditasRes.json();
            const questoes = raw.questoes || raw;
            questoesArray = questoesArray.concat(Array.isArray(questoes) ? questoes : []);
          }

          // Merge questoes as flashcards with quiz format
          if (questoesArray.length > 0) {
            questoesArray.forEach(q => {
              flashcardsData.push({
                id: 'q_' + q.id,
                materia: q.materia,
                pergunta: q.enunciado,
                resposta: q.opcoes && q.correta !== null && q.opcoes[q.correta] ? q.opcoes[q.correta].replace(/^[A-D]\)\s*/, '') : '',
                explicacao: q.explicacao,
                opcoes: q.opcoes || [],
                correta: q.correta,
                tipo: 'quiz',
                tema: q.tema,
                dificuldade: q.dificuldade,
                categoria: q.categoria || 'antiga'
              });
            });
          }

          // Fallback if no JSON files loaded
          if (materiasData.length === 0) {
            materiasData = [
              { id: 'sus', nome: 'Princípios e Organização do SUS', sigla: 'SUS', semestre: 1, cor: '#6366F1' },
              { id: 'semiologia1', nome: 'Semiologia Médica 1 — Sistema Locomotor', sigla: 'SEMIO1', semestre: 1, cor: '#C0392B' },
              { id: 'bmf1', nome: 'Bases Morfofuncionais 1 — Sistema Locomotor', sigla: 'BMF1', semestre: 1, cor: '#E85D75' },
              { id: 'pmh', nome: 'Práticas nas Humanidades Médicas', sigla: 'PMH', semestre: 1, cor: '#8B5CF6' },
              { id: 'bmf2', nome: 'Bases Morfofuncionais 2 — Sistema Cardiopulmonar', sigla: 'BMF2', semestre: 2, cor: '#EF4444' },
              { id: 'mad1', nome: 'Mecanismos de Agressão e Defesa 1 — Imunologia', sigla: 'MAD1', semestre: 2, cor: '#F59E0B' },
              { id: 'indicadores', nome: 'Indicadores de Saúde e Epidemiologia', sigla: 'IND', semestre: 2, cor: '#10B981' },
              { id: 'bcm1', nome: 'Bases Moleculares e Celulares', sigla: 'BCM1', semestre: 2, cor: '#4A90E2' },
              { id: 'semiologia2', nome: 'Semiologia Médica 2 — Sistema Cardiopulmonar', sigla: 'SEMIO2', semestre: 2, cor: '#C0392B' },
              { id: 'mad2', nome: 'Mecanismos de Agressão e Defesa 2 — Patologia Geral', sigla: 'MAD2', semestre: 3, cor: '#EF4444' },
            ];
          }

          if (flashcardsData.length === 0) {
            flashcardsData = [
              { id: 'fc1', materia: 'bcm1', frente: 'Como interpretar gasometria com pH=7.28, pCO2=32, HCO3=15?', verso: 'Acidose metabólica com compensação respiratória. pH baixo indica acidemia, HCO3 baixo confirma origem metabólica, pCO2 reduzido mostra hiperventilação compensatória.', tema: 'bcm1_acido_base', dificuldade: 2 },
              { id: 'fc2', materia: 'bcm1', frente: 'Qual molécula regula a fluidez da membrana plasmática?', verso: 'O colesterol. Ele se intercala entre os fosfolipídeos, reduzindo a fluidez em altas temperaturas e impedindo a solidificação em baixas temperaturas.', tema: 'bcm1_membrana', dificuldade: 1 },
              { id: 'fc3', materia: 'bmf1', frente: 'Qual célula é responsável pela síntese de matriz óssea?', verso: 'O osteoblasto. Sintetiza e secreta os componentes orgânicos da matriz óssea (colágeno tipo I e proteoglicanos), participando da mineralização.', tema: 'bmf1_tec_osseo', dificuldade: 1 },
              { id: 'fc4', materia: 'sus', frente: 'Quais são os três princípios doutrinários do SUS?', verso: 'Universalidade (acesso a toda população), equidade (tratamento diferenciado conforme necessidade) e integralidade (atendimento completo de saúde individual e coletiva).', tema: 'SUS Princípios', dificuldade: 1 },
            ];
          }

          setMaterias(materiasData);
          setFlashcards(flashcardsData);
          setLoading(false);
        } catch (error) {
          console.error('Erro ao carregar dados:', error);
          setLoading(false);
        }
      };

      const handleAuthSuccess = (userData) => {
        setUser(userData);
        setStage('app');
      };

      const handleLogout = () => {
        localStorage.removeItem('meduni9_user');
        localStorage.removeItem('meduni9_sr_data');
        localStorage.removeItem('meduni9_quiz_history');
        localStorage.removeItem('meduni9_stats');
        setUser(null);
        setStage('auth');
        setCurrentTab('home');
      };

      if (stage === 'splash') {
        return <SplashScreen onComplete={() => {
          const savedUser = localStorage.getItem('meduni9_user');
          if (savedUser) {
            setUser(JSON.parse(savedUser));
            setStage('app');
          } else {
            setStage('auth');
          }
        }} />;
      }

      if (stage === 'auth') {
        return <AuthScreen onAuthSuccess={handleAuthSuccess} />;
      }

      if (loading) {
        return (
          <div className="app-container">
            <div className="loading">
              <div className="spinner"></div>
            </div>
          </div>
        );
      }

      const handleChangeSemester = () => {
        const newSem = prompt('Digite o número do módulo (1-4):');
        const parsed = parseInt(newSem);
        if (parsed >= 1 && parsed <= 4) {
          const updated = { ...user, semestre: parsed, modulo: parsed };
          setUser(updated);
          localStorage.setItem('meduni9_user', JSON.stringify(updated));
        } else if (newSem !== null) {
          alert('Por enquanto apenas os módulos 1 a 4 estão disponíveis.');
        }
      };

      const navItems = [
        { id: 'home', label: 'Início', icon: <IconHome /> },
        { id: 'cards', label: 'Flashcards', icon: <IconLayers /> },
        { id: 'quiz', label: 'Questões', icon: <IconTarget /> },
        { id: 'materials', label: 'Materiais', icon: <IconBookOpen /> },
        { id: 'profile', label: 'Perfil', icon: <IconUser /> },
      ];

      // App UI with desktop sidebar
      return (
        <div className="desktop-layout">
          {/* Desktop Sidebar */}
          <div className={`desktop-sidebar${sidebarOpen ? '' : ' collapsed'}`}>
            <div className="sidebar-logo">
              <button
                className="sidebar-toggle-btn"
                onClick={() => setSidebarOpen(false)}
                title="Fechar menu"
                style={{ marginRight: '4px' }}
              ><IconMenu /></button>
              <span className="sidebar-logo-icon" style={{ color: 'var(--primary)', display: 'flex', alignItems: 'center' }}><IconLogoMed size={28} /></span>
              <span className="sidebar-logo-text">MedUni9</span>
            </div>
            <div className="sidebar-nav">
              {navItems.map(item => (
                <div
                  key={item.id}
                  className={`sidebar-item ${currentTab === item.id ? 'active' : ''}`}
                  onClick={() => setCurrentTab(item.id)}
                >
                  {item.icon}
                  <span>{item.label}</span>
                </div>
              ))}
            </div>
            <div className="sidebar-footer">
              <div className="sidebar-user-block">
                <div className="sidebar-user-avatar">
                  {user.email ? user.email.charAt(0).toUpperCase() : 'U'}
                </div>
                <div className="sidebar-user-info">
                  <div className="sidebar-user-name">{user.email ? user.email.split('@')[0] : 'Usuário'}</div>
                  <div className="sidebar-user-meta">Módulo {user.semestre || user.modulo || 1} · Básico</div>
                </div>
              </div>
            </div>
          </div>

          {/* Main Content */}
          <div className="app-container">
            {!sidebarOpen && (
              <button
                className="sidebar-toggle-btn"
                onClick={() => setSidebarOpen(true)}
                title="Abrir menu"
                style={{ position: 'fixed', top: '16px', left: '16px', zIndex: 200 }}
              ><IconMenu /></button>
            )}
            {currentTab === 'home' && (
              <DashboardScreen
                user={user}
                materias={materias}
                flashcards={flashcards}
                onSelectMateria={(id) => {
                  setSelectedMateria(id);
                  setCurrentTab('cards');
                }}
              />
            )}

            {currentTab === 'cards' && (
              <FlashcardsScreen
                flashcards={flashcards}
                materias={materias}
                selectedMateria={selectedMateria}
                onSelectMateria={setSelectedMateria}
                userSemester={user.semestre}
              />
            )}

            {currentTab === 'quiz' && (
              <QuizScreen
                flashcards={flashcards}
                materias={materias}
                selectedMateria={selectedMateria}
                onSelectMateria={setSelectedMateria}
                userSemester={user.semestre}
              />
            )}

            {currentTab === 'materials' && (
              <MaterialsScreen materias={materias} />
            )}

            {currentTab === 'profile' && (
              <ProfileScreen user={user} onLogout={handleLogout} onChangeSemester={handleChangeSemester} />
            )}

            {/* Bottom Navigation (mobile only) */}
            <div className="bottom-nav">
              {navItems.map(item => (
                <div
                  key={item.id}
                  className={`nav-item ${currentTab === item.id ? 'active' : ''}`}
                  onClick={() => setCurrentTab(item.id)}
                >
                  <div className="nav-icon">{item.icon}</div>
                  <div className="nav-label">{item.label}</div>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    };

    // Render App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<MedUni9App />);
  </script>
</body>
</html>
