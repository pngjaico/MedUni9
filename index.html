    const AtlasIconMale = () => (<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><circle cx="10" cy="14" r="5"/><path d="M14.5 9.5L19 5M19 5h-4M19 5v4"/></svg>);
    const AtlasIconFemale = () => (<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="9" r="5"/><line x1="12" y1="14" x2="12" y2="22"/><line x1="9" y1="18" x2="15" y2="18"/></svg>);
    const AtlasIconBrain = () => (<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="M9.5 2C6.5 2 4 4.5 4 8c0 2 .9 3.7 2.2 4.9L7 20h10l.8-7.1C19.1 11.7 20 10 20 8c0-3.5-2.5-6-5.5-6C13 2 12 3 12 3S11 2 9.5 2z"/><line x1="12" y1="3" x2="12" y2="11"/><path d="M9 8.5Q10.5 10.5 12 9.5Q13.5 8.5 15 10"/></svg>);
    const AtlasIconChevron = () => (<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><polyline points="9 18 15 12 9 6"/></svg>);
    const AtlasIconBack = () => (<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><polyline points="15 18 9 12 15 6"/></svg>);
    const AtlasIconImage = () => (<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>);
    const AtlasIconSearch = () => (<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="7"/><line x1="16.65" y1="16.65" x2="21" y2="21"/></svg>);
    const AtlasIconPin = () => (<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>);

    const ATLAS_ICON_MAP = {
      bone: AtlasIconBone, joint: AtlasIconJoint, muscle: AtlasIconMuscle,
      heart: AtlasIconHeart, lungs: AtlasIconLungs, stomach: AtlasIconStomach,
      kidney: AtlasIconKidney, male: AtlasIconMale, female: AtlasIconFemale, brain: AtlasIconBrain,
    };

    /** Definir como true para voltar a exibir créditos, links e etiquetas de fonte (Asclépio/Wikimedia) após autorização. */
    const ATLAS_SHOW_SOURCE_ATTRIBUTION = false;

    const AnatomiaAtlasPlate = ({ lamina, accentColor, sistemaTitulo, divisaoTitulo, referenciaAsclepio, onBack }) => {
      const formatLegendLine = (raw) => {
        const text = String(raw || '').trim();
        if (!text) return '';
        const keep = ['HE', 'HF', 'H.E', 'H.F', 'DNA', 'RNA'];
        const isMostlyUpper = /[A-ZÁÀÂÃÉÈÊÍÌÎÓÒÔÕÚÙÛÇ]/.test(text) && text === text.toUpperCase();
        if (!isMostlyUpper) return text;
        let pretty = text.toLowerCase();
        pretty = pretty.charAt(0).toUpperCase() + pretty.slice(1);
        keep.forEach((token) => {
          const re = new RegExp(`\\b${token.toLowerCase().replace('.', '\\.')}\\b`, 'g');
          pretty = pretty.replace(re, token);
        });
        return pretty;
      };

      const healLegends = (lines) => {
        if (!Array.isArray(lines) || lines.length === 0) return [];
        const healed = [];
        let buffer = "";

        for (let i = 0; i < lines.length; i++) {
          let current = String(lines[i] || '').trim();
          if (!current) continue;

          // OCR Cleanup
          current = current.replace(/OUE/g, 'QUE').replace(/CILiN/g, 'CILIN');

          if (buffer) {
            const lastChar = buffer.slice(-1);
            
            // Heurística de união
            const endsWithPunctuation = /[.!?:;)]$/.test(buffer);
            // Se a linha anterior não terminou em pontuação, ou termina em hífen, junta
            const isContinuation = !endsWithPunctuation || lastChar === '-';

            if (lastChar === '-') {
              buffer = buffer.slice(0, -1) + current;
            } else if (isContinuation) {
              buffer += " " + current;
            } else {
              healed.push(buffer);
              buffer = current;
            }
          } else {
            buffer = current;
          }
        }
        if (buffer) healed.push(buffer);
        return healed.map(s => s.replace(/\s+/g, ' ').trim());
      };

      const [openPin, setOpenPin] = React.useState(null);
      const [hoverPin, setHoverPin] = React.useState(null);
      const [imgError, setImgError] = React.useState(false);
      const [imgLoaded, setImgLoaded] = React.useState(false);
      const [lightboxOpen, setLightboxOpen] = React.useState(false);
      const wrapRef = React.useRef(null);
      const reduceMotion = typeof window !== 'undefined' && window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const pinos = lamina.pinos || [];
      const hasImage = lamina.urlImagem && lamina.urlImagem.length > 0;
      const showTip = (i) => openPin === i || hoverPin === i;
      const urlAmpliada = lamina.urlImagemCompleta || lamina.urlImagemZoom || lamina.urlImagem;
      const podeAmpliar = hasImage && urlAmpliada && String(urlAmpliada).length > 0;

      const legendaBox = (opts) => {
        const compact = opts && opts.compact;
        const rawLines = Array.isArray(lamina.legendaTranscrita) ? lamina.legendaTranscrita : [];
        const lines = healLegends(rawLines);
        
        if (lines.length === 0) return null;
        
        return (
          <div style={{
            marginTop: compact ? '0' : '14px', 
            padding: compact ? '12px' : '14px 16px', 
            borderRadius: '14px',
            border: '1px solid rgba(255,255,255,0.14)',
            background: 'linear-gradient(180deg, rgba(18,28,46,0.92) 0%, rgba(12,22,38,0.96) 100%)',
            boxShadow: '0 8px 28px rgba(0,0,0,0.24)',
            height: compact ? '100%' : 'auto',
            overflowY: compact ? 'auto' : 'visible'
          }}>
            <div style={{
              fontFamily: 'Outfit', fontSize: compact ? '14px' : '16px', fontWeight: 700, color: '#EAF2FF',
              marginBottom: '10px', letterSpacing: '0.01em', display: 'flex', alignItems: 'center', gap: '8px'
            }}>
               <span style={{ opacity: 0.6 }}>📋</span> Legenda
            </div>
            <div style={{ display: 'grid', gap: '10px' }}>
              {lines.map((item, i) => (
                <div key={(opts && opts.prefix ? opts.prefix : 'p') + '-' + lamina.id + '-leg_h-' + i} style={{
                  display: 'flex', alignItems: 'flex-start', gap: '10px',
                  fontSize: compact ? '13px' : '14px', color: '#DCE8FF', lineHeight: 1.55, fontWeight: 500,
                }}>
                  <span style={{ color: accentColor, marginTop: '4px', fontSize: '10px', flexShrink: 0 }}>●</span>
                  <span>{formatLegendLine(item)}</span>
                </div>
              ))}
            </div>
            {lamina.notaTranscricao && (
              <div style={{ marginTop: '12px', paddingTop: '10px', borderTop: '1px solid rgba(255,255,255,0.08)', fontSize: '11px', color: 'rgba(255,255,255,0.4)', fontStyle: 'italic' }}>
                {lamina.notaTranscricao}
              </div>
            )}
          </div>
        );
      };

      React.useEffect(() => {
        setImgError(false); setImgLoaded(false); setOpenPin(null); setLightboxOpen(false);
      }, [lamina.id]);

      React.useEffect(() => {
        if (!lightboxOpen) return;
        const onKey = (e) => { if (e.key === 'Escape') setLightboxOpen(false); };
        document.addEventListener('keydown', onKey);
        return () => document.removeEventListener('keydown', onKey);
      }, [lightboxOpen]);

      React.useEffect(() => {
        const el = wrapRef.current;
        if (!el) return;
        const onDoc = (e) => { if (!el.contains(e.target)) setOpenPin(null); };
        document.addEventListener('touchstart', onDoc, { passive: true });
        document.addEventListener('click', onDoc);
        return () => { document.removeEventListener('touchstart', onDoc); document.removeEventListener('click', onDoc); };
      }, []);

      const backBtn = {
        display: 'inline-flex', alignItems: 'center', gap: '6px', marginBottom: '16px',
        padding: '8px 14px', borderRadius: '10px', border: '1px solid rgba(255,255,255,0.1)',
        background: 'rgba(255,255,255,0.04)', color: 'var(--text-secondary)', fontSize: '13px', fontWeight: 600,
        cursor: 'pointer', fontFamily: 'inherit', transition: 'background 0.15s ease',
      };

      return (
        <div style={{ animation: reduceMotion ? 'none' : 'aboutFadeUp 0.3s ease both' }}>
          <button type="button" onClick={onBack} style={backBtn} onMouseEnter={e => e.currentTarget.style.background='rgba(255,255,255,0.08)'} onMouseLeave={e => e.currentTarget.style.background='rgba(255,255,255,0.04)'}>
            <AtlasIconBack /> Voltar
          </button>
          <div style={{ marginBottom: '12px' }}>
            <div style={{ fontSize: '11px', fontWeight: 700, color: accentColor, textTransform: 'uppercase', letterSpacing: '0.08em', marginBottom: '4px' }}>{sistemaTitulo}</div>
            <h3 style={{ fontFamily: 'Outfit', fontSize: '20px', fontWeight: 800, color: 'var(--text-primary)', margin: 0, lineHeight: 1.3 }}>{lamina.titulo}</h3>
            <div style={{ fontSize: '12px', color: 'var(--text-secondary)', marginTop: '4px' }}>{divisaoTitulo}</div>
          </div>

          <div className="atlas-plate-layout" style={{
            display: 'grid',
            gridTemplateColumns: 'minmax(0, 1fr)',
            gap: '16px'
          }}>
            <div className="atlas-plate-media" style={{ minWidth: 0 }}>
              {hasImage && !imgError ? (
                <div ref={wrapRef} style={{
                  position: 'relative', borderRadius: '16px', overflow: 'hidden',
                  border: '1px solid rgba(255,255,255,0.08)',
                  boxShadow: '0 8px 32px rgba(0,0,0,0.3), 0 2px 8px rgba(0,0,0,0.2)',
                  background: '#0D1117',
                  minHeight: imgLoaded ? undefined : '220px',
                }}>
                  {!imgLoaded && (
                    <div style={{ position: 'absolute', inset: 0, display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 1 }}>
                      <div style={{ width: '28px', height: '28px', border: '3px solid rgba(255,255,255,0.1)', borderTopColor: accentColor, borderRadius: '50%', animation: 'spin 0.8s linear infinite' }} />
                    </div>
                  )}
                  <button
                    type="button"
                    onClick={() => { if (podeAmpliar) setLightboxOpen(true); }}
                    disabled={!podeAmpliar}
                    aria-label={podeAmpliar ? 'Ampliar fotografia da lâmina com legenda' : undefined}
                    style={{
                      display: 'block', width: '100%', padding: 0, margin: 0, border: 'none', background: 'transparent',
                      cursor: podeAmpliar ? 'zoom-in' : 'default',
                    }}
                  >
                    <img
                      src={lamina.urlImagem}
                      alt={lamina.alt || lamina.titulo}
                      loading="lazy"
                      decoding="async"
                      onLoad={() => setImgLoaded(true)}
                      onError={() => setImgError(true)}
                      style={{ 
                        width: '132%', 
                        maxWidth: 'none',
                        height: 'auto', 
                        display: 'block', 
                        verticalAlign: 'top', 
                        opacity: imgLoaded ? 1 : 0, 
                        transition: reduceMotion ? 'none' : 'opacity 0.25s ease', 
                        pointerEvents: 'none',
                        objectFit: 'cover',
                        objectPosition: 'left center'
                      }}
                    />
                  </button>
                  {imgLoaded && podeAmpliar && (
                    <div style={{ position: 'absolute', bottom: '10px', right: '10px', zIndex: 3, pointerEvents: 'none' }}>
                      <span style={{
                        fontSize: '11px', fontWeight: 700, padding: '6px 10px', borderRadius: '10px',
                        background: 'rgba(10,10,15,0.88)', color: '#E8EEFF', border: '1px solid rgba(255,255,255,0.12)',
                        boxShadow: '0 4px 14px rgba(0,0,0,0.35)',
                      }}>Toque para ampliar</span>
                    </div>
                  )}
                  {imgLoaded && pinos.map((p, i) => (
                    <button key={i} type="button" className="atlas-pin-hitbox" aria-label={p.rotulo} aria-pressed={showTip(i)}
                      onClick={(e) => { e.stopPropagation(); setOpenPin(prev => prev === i ? null : i); }}
                      onMouseEnter={() => setHoverPin(i)} onMouseLeave={() => setHoverPin(null)}
                      style={{
                        position: 'absolute', left: p.x + '%', top: p.y + '%', transform: 'translate(-50%, -50%)',
                        width: '48px', height: '48px', padding: 0, margin: 0, border: 'none', background: 'transparent',
                        cursor: 'pointer', zIndex: showTip(i) ? 4 : 2,
                      }}
                    />
                  ))}
                  {imgLoaded && pinos.map((p, i) => showTip(i) && (
                    <div key={'tip-' + i} role="status" style={{
                      position: 'absolute', left: p.x + '%', top: p.y + '%',
                      transform: p.y < 20 ? 'translate(-50%, 18px)' : 'translate(-50%, calc(-100% - 18px))',
                      maxWidth: 'min(200px, 65vw)', padding: '7px 12px', borderRadius: '8px',
                      background: 'rgba(10,10,15,0.94)', backdropFilter: 'blur(8px)',
                      border: '1px solid rgba(255,255,255,0.12)', color: '#F5F3FF',
                      fontSize: '12px', fontWeight: 700, lineHeight: 1.3, pointerEvents: 'none', zIndex: 5,
                      boxShadow: '0 6px 20px rgba(0,0,0,0.5)',
                    }}>
                      {p.rotulo}
                    </div>
                  ))}
                </div>
              ) : (
                <div style={{
                  borderRadius: '16px', overflow: 'hidden', border: '1px dashed rgba(255,255,255,0.12)',
                  background: 'linear-gradient(135deg, rgba(255,255,255,0.02) 0%, rgba(139,92,246,0.04) 100%)',
                  padding: '40px 24px', textAlign: 'center',
                }}>
                  <div style={{ display: 'flex', justifyContent: 'center', marginBottom: '14px', color: 'rgba(255,255,255,0.2)' }}>
                    <AtlasIconImage />
                  </div>
                  <div style={{ fontFamily: 'Outfit', fontWeight: 700, fontSize: '14px', color: 'var(--text-secondary)', marginBottom: '8px' }}>
                    {imgError ? 'Imagem indisponível' : 'Imagem pendente'}
                  </div>
                  <p style={{ fontSize: '12px', color: 'rgba(255,255,255,0.35)', lineHeight: 1.6, margin: 0, maxWidth: '320px', marginLeft: 'auto', marginRight: 'auto' }}>
                    {lamina.descricaoNecessaria || lamina.alt || 'Esta lâmina ainda precisa de uma imagem. Volte em breve.'}
                  </p>
                </div>
              )}
            </div>

            <div className="atlas-plate-legend" style={{ minWidth: 0 }}>
              {legendaBox()}
            </div>
          </div>

          {lightboxOpen && podeAmpliar && (
            <div
              role="dialog"
              aria-modal="true"
              aria-labelledby={'atlas-lb-title-' + lamina.id}
              style={{
                position: 'fixed', inset: 0, zIndex: 10050, display: 'flex', flexDirection: 'column',
                alignItems: 'center', justifyContent: 'flex-start', padding: '16px 14px 24px',
                background: 'rgba(5,8,14,0.92)', backdropFilter: 'blur(10px)', overflowY: 'auto',
              }}
              onClick={(e) => { if (e.target === e.currentTarget) setLightboxOpen(false); }}
            >
              <div style={{ width: '100%', maxWidth: '900px', flexShrink: 0, display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '12px' }}>
                <div id={'atlas-lb-title-' + lamina.id} style={{ fontFamily: 'Outfit', fontWeight: 800, fontSize: '16px', color: '#F8FAFC', paddingRight: '12px', lineHeight: 1.35 }}>
                  {lamina.titulo}
                </div>
                <button
                  type="button"
                  onClick={() => setLightboxOpen(false)}
                  style={{
                    flexShrink: 0, padding: '10px 16px', borderRadius: '12px', border: '1px solid rgba(255,255,255,0.18)',
                    background: 'rgba(255,255,255,0.08)', color: '#F8FAFC', fontWeight: 700, fontSize: '13px', cursor: 'pointer', fontFamily: 'inherit',
                  }}
                >Fechar</button>
              </div>
              <div
                style={{
                  width: '100%', maxWidth: '900px', borderRadius: '14px', overflow: 'hidden',
                  border: '1px solid rgba(255,255,255,0.12)', background: '#0D1117', boxShadow: '0 12px 48px rgba(0,0,0,0.45)',
                }}
                onClick={(e) => e.stopPropagation()}
              >
                <img
                  src={urlAmpliada}
                  alt={(lamina.alt || lamina.titulo) + ' — vista completa'}
                  style={{ width: '100%', height: 'auto', display: 'block', verticalAlign: 'top' }}
                />
              </div>
              <div style={{ width: '100%', maxWidth: '900px' }} onClick={(e) => e.stopPropagation()}>
                {legendaBox({ compact: true, prefix: 'lb' })}
              </div>
            </div>
          )}

          {ATLAS_SHOW_SOURCE_ATTRIBUTION && (
            <div style={{
              marginTop: '14px', padding: '12px 14px', borderRadius: '12px',
              background: 'rgba(255,255,255,0.03)', border: '1px solid rgba(255,255,255,0.06)',
              fontSize: '11px', color: 'var(--text-secondary)', lineHeight: 1.6,
            }}>
              {lamina.fonte === 'commons' ? (
                <div>
                  <div style={{ fontWeight: 700, color: 'var(--text-primary)', marginBottom: '4px', fontSize: '12px' }}>Créditos e licença</div>
                  {lamina.credito && <div>{lamina.credito}</div>}
                  {lamina.licenca && <div style={{ marginTop: '2px', opacity: 0.8 }}>{lamina.licenca}</div>}
                  {lamina.urlPaginaFonte && (
                    <a href={lamina.urlPaginaFonte} target="_blank" rel="noopener noreferrer" style={{ color: '#A78BFA', fontWeight: 600, marginTop: '4px', display: 'inline-block' }}>
                      Ver no Wikimedia Commons
                    </a>
                  )}
                </div>
              ) : (
                <div>
                  <div style={{ fontWeight: 700, color: 'var(--text-primary)', marginBottom: '4px', fontSize: '12px' }}>Fonte</div>
                  <div>{lamina.credito || referenciaAsclepio.nome}</div>
                  <a href={referenciaAsclepio.url} target="_blank" rel="noopener noreferrer" style={{ color: '#A78BFA', fontWeight: 600, display: 'inline-block', marginTop: '4px' }}>
                    {referenciaAsclepio.nome}
                  </a>
                </div>
              )}
            </div>
          )}
        </div>
      );
    };

    const ANATOMIA_INTRO_STORAGE_KEY = 'medgrad_anatomia_intro_dismissed';

    const AnatomiaScreen = ({ user }) => {
      const [viewMode, setViewMode] = React.useState('atlas');
      const [openSystem, setOpenSystem] = React.useState(null);
      const [openSub, setOpenSub] = React.useState({});
      const [search, setSearch] = React.useState('');
      const [atlasData, setAtlasData] = React.useState(null);
      const [atlasErr, setAtlasErr] = React.useState(null);
      const [atlasNav, setAtlasNav] = React.useState({ step: 'systems', sistemaId: null, divisaoId: null, laminaAtual: null });
      const [revisaoData, setRevisaoData] = React.useState(null);
      const [revisaoErr, setRevisaoErr] = React.useState(null);
      const [atlasDemoNotice, setAtlasDemoNotice] = React.useState(null);
      const [anatomiaIntroOpen, setAnatomiaIntroOpen] = React.useState(() => {
        try { return localStorage.getItem(ANATOMIA_INTRO_STORAGE_KEY) !== '1'; } catch (e) { return true; }
      });

      const atlasFreeLock = isFreeTierUser(user);

      React.useEffect(() => {
        fetch('data/anatomia_atlas.json?_=' + Date.now())
          .then(r => { if (!r.ok) throw new Error('Falha ao carregar atlas'); return r.json(); })
          .then(setAtlasData)
          .catch(e => setAtlasErr(e.message || String(e)));
      }, []);

      React.useEffect(() => {
        fetch('data/anatomia_revisao.json?_=' + Date.now())
          .then(r => { if (!r.ok) throw new Error('Falha ao carregar revisão'); return r.json(); })

                        <div key={sys.id} style={{ marginBottom: '8px', borderRadius: '14px', overflow: 'hidden', border: '1px solid rgba(255,255,255,0.06)', background: 'rgba(255,255,255,0.02)' }}>
                          <div onClick={() => toggleSystem(sys.id)} style={{
                            display: 'flex', alignItems: 'center', gap: '12px', padding: '13px 16px',
                            cursor: 'pointer', userSelect: 'none',
                            borderBottom: openSystem === sys.id ? '1px solid rgba(255,255,255,0.06)' : 'none',
                          }}>
                            <span style={{
                              width: '36px', height: '36px', borderRadius: '10px', display: 'flex', alignItems: 'center', justifyContent: 'center',
                              background: (sys.color || '#8B5CF6') + '22', color: sys.color || '#8B5CF6', flexShrink: 0,
                            }}>
                              <SysIcon />
                            </span>
                            <span style={{ fontWeight: 700, fontSize: '14px', color: 'var(--text-primary)', flex: 1 }}>{sys.name}</span>
                            <span style={{ fontSize: '11px', color: 'var(--text-secondary)', marginRight: '4px' }}>
                              {nItems === 1 ? '1 item' : `${nItems} itens`}
                            </span>
                            <span style={{
                              display: 'flex', transition: 'transform 0.2s',
                              transform: openSystem === sys.id ? 'rotate(90deg)' : 'rotate(0deg)',
                              color: 'var(--text-secondary)', opacity: 0.5,
                            }}><AtlasIconChevron /></span>
                          </div>
                          {openSystem === sys.id && (
                            <div style={{ padding: '8px 12px 12px' }}>
                              {(sys.subsections || []).map((sub, si) => {
                                const subKey = sys.id + '_' + si;
                                const blocks = normalizeRevisaoBlocks(sub);
                                return (
                                  <div key={subKey} style={{ marginBottom: '6px' }}>
                                    <div onClick={() => toggleSub(subKey)} style={{
                                      display: 'flex', alignItems: 'center', justifyContent: 'space-between',
                                      padding: '9px 12px', borderRadius: '9px', cursor: 'pointer',
                                      background: openSub[subKey] ? 'rgba(255,255,255,0.06)' : 'rgba(255,255,255,0.02)',
                                      fontSize: '13px', fontWeight: 600, color: 'var(--text-primary)', transition: 'background 0.15s ease',
                                    }}>
                                      <span>{sub.title}</span>
                                      <span style={{ display: 'flex', transition: 'transform 0.2s', transform: openSub[subKey] ? 'rotate(90deg)' : 'none', color: 'var(--text-secondary)', opacity: 0.5 }}><AtlasIconChevron /></span>
                                    </div>
                                    {openSub[subKey] && (
                                      <div style={{ padding: '8px 4px 0' }}>
                                        {blocks.map((block, bi) => (
                                          <div key={bi}>
                                            {block.type === 'sequence' && (
                                              <RevisaoSequenceBlock block={block} accentColor={sys.color} />
                                            )}
                                            {block.type === 'hub' && (
                                              <RevisaoHubBlock block={block} accentColor={sys.color} />
                                            )}
                                            {block.type === 'cards' && (
                                              <RevisaoCardsBlock block={block} accentColor={sys.color} />
                                            )}
                                          </div>
                                        ))}
                                      </div>
                                    )}
                                  </div>
                                );
                              })}
                            </div>
                          )}
                        </div>
                      );
                    })}
                  </>
                )}
              </>
            )}
          </div>
        </div>
      );
    };

    const HISTOLOGIA_INTRO_STORAGE_KEY = 'medgrad_histologia_intro_dismissed';

    const HistologiaScreen = () => {
      const [viewMode, setViewMode] = React.useState('atlas');
      const [openSystem, setOpenSystem] = React.useState(null);
      const [openSub, setOpenSub] = React.useState({});
      const [search, setSearch] = React.useState('');
      const [atlasData, setAtlasData] = React.useState(null);
      const [atlasErr, setAtlasErr] = React.useState(null);
      const [atlasNav, setAtlasNav] = React.useState({ step: 'categories', categoryId: null, systemId: null, organId: null, laminaAtual: null });
      const [revisaoData, setRevisaoData] = React.useState(null);
      const [revisaoErr, setRevisaoErr] = React.useState(null);
      const [histoIntroOpen, setHistoIntroOpen] = React.useState(() => {
        try { return localStorage.getItem(HISTOLOGIA_INTRO_STORAGE_KEY) !== '1'; } catch (e) { return true; }
      });

      React.useEffect(() => {
        fetch('data/histologia_atlas_v2.json?_=' + Date.now())
          .then(r => { if (!r.ok) throw new Error('Falha ao carregar atlas'); return r.json(); })
          .then(setAtlasData)
          .catch(e => setAtlasErr(e.message || String(e)));
      }, []);

      React.useEffect(() => {
        fetch('data/histologia_revisao.json?_=' + Date.now())
          .then(r => { if (!r.ok) throw new Error('Falha ao carregar revisão'); return r.json(); })
          .then(setRevisaoData)
          .catch(e => setRevisaoErr(e.message || String(e)));
      }, []);

      const q = search.toLowerCase().trim();

      const atlasResults = React.useMemo(() => {
        if (!atlasData || !q || viewMode !== 'atlas') return [];
        const results = [];
        atlasData.categorias.forEach(cat => {
          cat.sistemas.forEach(sys => {
            sys.orgaos.forEach(org => {
              org.laminas.forEach(lam => {
                const combined = ((lam.titulo || '') + ' ' + (org.titulo || '') + ' ' + (sys.titulo || '') + ' ' + (cat.titulo || '')).toLowerCase();
                if (combined.includes(q)) {
                  results.push({ ...lam, category: cat, system: sys, organ: org });
                }
              });
            });
          });
        });
        return results;
      }, [atlasData, q, viewMode]);

      const sistemasBase = revisaoData && Array.isArray(revisaoData.sistemas) ? revisaoData.sistemas : [];
      const filteredRevisao = React.useMemo(() => {
        if (!sistemasBase.length) return [];
        return sistemasBase.map(sys => {
          const regionFiltered = sys.subsections || [];
          if (!q) return { ...sys, subsections: regionFiltered };
          const nameMatch = (sys.name || '').toLowerCase().includes(q);
          const matchingSubs = regionFiltered.filter(sub => subsectionMatchesRevisaoQuery(sub, q));
          let finalSubs;
          if (matchingSubs.length) finalSubs = matchingSubs.map(sub => applyRevisaoQueryToSub(sub, q));
          else if (nameMatch) finalSubs = regionFiltered.map(sub => applyRevisaoQueryToSub(sub, q));
          else return null;
          return { ...sys, subsections: finalSubs };
        }).filter(sys => sys && (sys.subsections || []).length > 0);
      }, [sistemasBase, q]);

      const toggleSystem = (id) => { setOpenSystem(prev => prev === id ? null : id); setOpenSub({}); };
      const toggleSub = (key) => setOpenSub(prev => ({ ...prev, [key]: !prev[key] }));

      React.useEffect(() => {
        if (q && viewMode === 'revisao' && filteredRevisao.length === 1) setOpenSystem(filteredRevisao[0].id);
      }, [q, filteredRevisao, viewMode]);

      const atlasCategory = atlasData && atlasNav.categoryId ? atlasData.categorias.find(c => c.id === atlasNav.categoryId) : null;
      const atlasSystem = atlasCategory && atlasNav.systemId ? atlasCategory.sistemas.find(s => s.id === atlasNav.systemId) : null;
      const atlasOrgan = atlasSystem && atlasNav.organId ? atlasSystem.orgaos.find(o => o.id === atlasNav.organId) : null;

      const atlasGoBack = () => {
        if (atlasNav.step === 'plate') setAtlasNav(prev => ({ ...prev, step: 'laminas', laminaAtual: null }));
        else if (atlasNav.step === 'laminas') setAtlasNav(prev => ({ ...prev, step: 'organs', organId: null }));
        else if (atlasNav.step === 'organs') setAtlasNav(prev => ({ ...prev, step: 'systems', systemId: null }));
        else if (atlasNav.step === 'systems') setAtlasNav(prev => ({ ...prev, step: 'categories', categoryId: null }));
      };

      const histoSegBtnStyle = (active) => ({
        flex: 1, padding: '10px 0', borderRadius: '10px', border: 'none',
        fontSize: '13px', fontWeight: 700, fontFamily: 'Outfit, sans-serif', cursor: 'pointer',
        transition: 'all 0.2s ease',
        background: active ? 'linear-gradient(135deg, rgba(16,185,129,0.28), rgba(6,182,212,0.18))' : 'transparent',
        color: active ? '#D1FAE5' : 'var(--text-secondary)',
        boxShadow: active ? '0 2px 12px rgba(16,185,129,0.12)' : 'none',
      });

      const backBtn = {
        display: 'inline-flex', alignItems: 'center', gap: '6px', marginBottom: '16px',
        padding: '8px 14px', borderRadius: '10px', border: '1px solid rgba(255,255,255,0.1)',
        background: 'rgba(255,255,255,0.04)', color: 'var(--text-secondary)', fontSize: '13px', fontWeight: 600,
        cursor: 'pointer', fontFamily: 'inherit', transition: 'background 0.15s ease',
      };

      return (
        <div className="screen-content">
          <div style={{ maxWidth: '720px', margin: '0 auto' }}>
            <h2 style={{ fontFamily: 'Outfit', fontSize: '24px', fontWeight: 800, color: 'var(--text-primary)', marginBottom: '2px', letterSpacing: '-0.02em' }}>Histologia</h2>
            <p style={{ fontSize: '13px', color: 'var(--text-secondary)', marginBottom: '14px', lineHeight: 1.5 }}>
              {viewMode === 'revisao'
                ? 'Texto para revisar microanatomia por sistema e por órgão. Abra cada bloco na ordem que preferir.'
                : 'Atlas categorizado por Sistema e Órgão. Use a busca para achar tecidos ou lâminas específicas.'}
            </p>

            {histoIntroOpen && (
              <div style={{
                marginBottom: '18px', padding: '16px 18px', borderRadius: '14px',
                border: '1px solid rgba(16,185,129,0.35)',
                background: 'linear-gradient(165deg, rgba(16,185,129,0.12), rgba(6,182,212,0.06))',
              }}>
                <div style={{ fontSize: '12px', fontWeight: 800, letterSpacing: '0.08em', textTransform: 'uppercase', color: '#6EE7B7', marginBottom: '10px', fontFamily: 'Outfit, sans-serif' }}>Novo Sistema de Atlas</div>
                <div style={{ fontSize: '13px', color: 'var(--text-primary)', lineHeight: 1.65, marginBottom: '12px' }}>
                  <strong>Navegação Hierárquica:</strong> Organizamos as lâminas por <strong>Categorias &rarr; Sistemas &rarr; Órgãos</strong>. <br/>
                  <strong>Busca Global:</strong> Encontre qualquer lâmina ou estrutura instantaneamente usando a barra de busca abaixo.
                </div>
                <button type="button" className="btn btn-primary" style={{ padding: '8px 16px', fontSize: '12px', background: 'linear-gradient(135deg, #10B981, #06B6D4)', border: 'none' }} onClick={() => { try { localStorage.setItem(HISTOLOGIA_INTRO_STORAGE_KEY, '1'); } catch (e) {} setHistoIntroOpen(false); }}>
                  Entendi, continuar
                </button>
              </div>
            )}

            <div style={{
              display: 'flex', gap: '4px', padding: '4px',
              background: 'rgba(255,255,255,0.03)', borderRadius: '12px',
              border: '1px solid rgba(255,255,255,0.06)', marginBottom: '20px',
            }}>
              <button type="button" style={histoSegBtnStyle(viewMode === 'atlas')} onClick={() => {setViewMode('atlas'); setSearch('');}}>Atlas de lâminas</button>
              <button type="button" style={histoSegBtnStyle(viewMode === 'revisao')} onClick={() => {setViewMode('revisao'); setSearch('');}}>Revisão rápida</button>
            </div>

            {atlasNav.step !== 'plate' && (
              <div style={{ position: 'relative', marginBottom: '18px' }}>
                <input type="text" placeholder={viewMode === 'atlas' ? 'Buscar lâmina, órgão ou categoria...' : 'Buscar estrutura, sistema ou tópico...'}
                  value={search} onChange={e => setSearch(e.target.value)}
                  style={{
                    width: '100%', padding: '10px 14px 10px 38px',
                    background: 'rgba(255,255,255,0.04)', border: '1px solid rgba(255,255,255,0.08)',
                    borderRadius: '10px', color: 'var(--text-primary)', fontSize: '14px', outline: 'none',
                    transition: 'border-color 0.15s ease',
                  }}
                  onFocus={e => e.target.style.borderColor = 'rgba(16,185,129,0.45)'}
                  onBlur={e => e.target.style.borderColor = 'rgba(255,255,255,0.08)'}
                />
                <span style={{ position: 'absolute', left: '12px', top: '50%', transform: 'translateY(-50%)', color: 'var(--text-secondary)', pointerEvents: 'none', display: 'flex' }}>
                  <AtlasIconSearch />
                </span>
              </div>
            )}

            {viewMode === 'atlas' && (
              <div style={{ animation: 'aboutFadeIn 0.3s ease' }}>
                {atlasErr && (
                  <div style={{ padding: '16px', borderRadius: '14px', background: 'rgba(239,68,68,0.08)', border: '1px solid rgba(239,68,68,0.2)', color: '#FCA5A5', fontSize: '13px', lineHeight: 1.6 }}> {atlasErr} </div>
                )}
                {!atlasData && !atlasErr && (
                  <div style={{ padding: '48px 24px', textAlign: 'center' }}>
                    <div style={{ width: '28px', height: '28px', margin: '0 auto 12px', border: '3px solid rgba(255,255,255,0.1)', borderTopColor: '#10B981', borderRadius: '50%', animation: 'spin 0.8s linear infinite' }} />
                    <div style={{ fontSize: '13px', color: 'var(--text-secondary)' }}>Carregando atlas...</div>
                  </div>
                )}

                {atlasData && q && atlasNav.step !== 'plate' && (
                  <div style={{ display: 'flex', flexDirection: 'column', gap: '8px' }}>
                    <div style={{ fontSize: '12px', fontWeight: 700, color: 'var(--text-secondary)', marginBottom: '4px' }}> Resultados ({atlasResults.length}) </div>
                    {atlasResults.length === 0 && (
                      <div style={{ textAlign: 'center', color: 'var(--text-secondary)', padding: '40px 0' }}>Nenhum resultado encontrado.</div>
                    )}
                    {atlasResults.map((lam, li) => (
                      <button key={lam.id + li} type="button"
                        onClick={() => { setSearch(''); setAtlasNav({ step: 'plate', categoryId: lam.category.id, systemId: lam.system.id, organId: lam.organ.id, laminaAtual: lam }); }}
                        style={{ display: 'flex', alignItems: 'center', gap: '14px', padding: '14px 16px', borderRadius: '12px', textAlign: 'left', border: '1px solid rgba(255,255,255,0.06)', background: 'rgba(255,255,255,0.02)', cursor: 'pointer', fontFamily: 'inherit' }}
                      >
                         <div style={{ flex: 1 }}>
                            <div style={{ fontWeight: 700, fontSize: '13px', color: 'var(--text-primary)' }}>{lam.titulo}</div>
                            <div style={{ fontSize: '10px', color: 'var(--text-secondary)', marginTop: '2px', textTransform: 'uppercase' }}> {lam.category.titulo} &bull; {lam.system.titulo} &bull; {lam.organ.titulo} </div>
                         </div>
                         <AtlasIconChevron />
                      </button>
                    ))}
                  </div>
                )}

                {atlasData && !q && (
                  <>
                    {atlasNav.step === 'categories' && (
                      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(1, 1fr)', gap: '10px' }}>
                        {atlasData.categorias.map((cat, idx) => {
                          const Icon = ATLAS_ICON_MAP[cat.icone] || AtlasIconBone;
                          return (
                            <button key={cat.id} type="button" onClick={() => setAtlasNav({ ...atlasNav, step: 'systems', categoryId: cat.id })}
                              style={{ display: 'flex', alignItems: 'center', gap: '16px', padding: '24px 20px', borderRadius: '16px', textAlign: 'left', border: '1px solid rgba(255,255,255,0.08)', background: 'linear-gradient(135deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01))', cursor: 'pointer', fontFamily: 'inherit', animation: `aboutFadeUp 0.3s ease ${idx * 0.05}s both` }}
                            >
                              <div style={{ width: '48px', height: '48px', borderRadius: '12px', display: 'flex', alignItems: 'center', justifyContent: 'center', background: cat.cor + '22', color: cat.cor, flexShrink: 0 }}> <Icon /> </div>
                              <div style={{ flex: 1 }}>
                                <div style={{ fontWeight: 800, fontSize: '16px', color: 'var(--text-primary)', marginBottom: '4px', fontFamily: 'Outfit' }}>{cat.titulo}</div>
                                <div style={{ fontSize: '12px', color: 'var(--text-secondary)' }}>Explore sistemas e órgãos</div>
                              </div>
                              <AtlasIconChevron />
                            </button>
                          );
                        })}
                      </div>
                    )}

                    {atlasNav.step === 'systems' && atlasCategory && (
                      <div>
                        <button type="button" onClick={atlasGoBack} style={backBtn}> <AtlasIconBack /> Categorias </button>
                        <h3 style={{ fontFamily: 'Outfit', fontWeight: 800, fontSize: '18px', color: 'var(--text-primary)', marginBottom: '16px' }}>{atlasCategory.titulo}</h3>
                        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(2, 1fr)', gap: '8px' }}>
                          {atlasCategory.sistemas.map((sys) => (
                            <button key={sys.id} type="button" onClick={() => setAtlasNav({ ...atlasNav, step: 'organs', systemId: sys.id })}
                              style={{ display: 'flex', flexDirection: 'column', alignItems: 'flex-start', padding: '16px 18px', borderRadius: '12px', textAlign: 'left', border: '1px solid rgba(255,255,255,0.06)', background: 'rgba(255,255,255,0.02)', cursor: 'pointer', fontFamily: 'inherit' }}
                            >
                              <span style={{ fontWeight: 700, fontSize: '14px', color: 'var(--text-primary)', marginBottom: '4px' }}>{sys.titulo}</span>
                              <span style={{ fontSize: '11px', color: 'var(--text-secondary)' }}>{sys.orgaos.length} grupos</span>
                            </button>
                          ))}
                        </div>
                      </div>
                    )}

                    {atlasNav.step === 'organs' && atlasSystem && (
                      <div>
                        <button type="button" onClick={atlasGoBack} style={backBtn}> <AtlasIconBack /> {atlasCategory.titulo} </button>
                        <h3 style={{ fontFamily: 'Outfit', fontWeight: 800, fontSize: '18px', color: 'var(--text-primary)', marginBottom: '16px' }}>{atlasSystem.titulo}</h3>
                        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(2, 1fr)', gap: '10px' }}>
                          {atlasSystem.orgaos.map((org) => (
                            <button key={org.id} type="button" onClick={() => setAtlasNav({ ...atlasNav, step: 'laminas', organId: org.id })}
                              style={{ padding: '14px', borderRadius: '12px', textAlign: 'left', border: '1px solid rgba(255,255,255,0.06)', background: 'rgba(255,255,255,0.02)', cursor: 'pointer', fontFamily: 'inherit' }}
                            >
                              <div style={{ fontWeight: 700, fontSize: '13px', color: 'var(--text-primary)', marginBottom: '4px' }}>{org.titulo}</div>
                              <div style={{ fontSize: '11px', color: 'var(--text-secondary)' }}>{org.laminas.length} lâminas</div>
                            </button>
                          ))}
                        </div>
                      </div>
                    )}

                    {atlasNav.step === 'laminas' && atlasOrgan && (
                      <div>
                        <button type="button" onClick={atlasGoBack} style={backBtn}> <AtlasIconBack /> {atlasSystem.titulo} </button>
                        <h3 style={{ fontFamily: 'Outfit', fontWeight: 800, fontSize: '18px', color: 'var(--text-primary)', marginBottom: '16px' }}>{atlasOrgan.titulo}</h3>
                        <div style={{ display: 'flex', flexDirection: 'column', gap: '8px' }}>
                          {atlasOrgan.laminas.map((lam) => (
                            <button key={lam.id} type="button" onClick={() => setAtlasNav({ ...atlasNav, step: 'plate', laminaAtual: lam })}
                              style={{ display: 'flex', alignItems: 'center', gap: '14px', padding: '14px 16px', borderRadius: '12px', textAlign: 'left', border: '1px solid rgba(255,255,255,0.06)', background: 'rgba(255,255,255,0.02)', cursor: 'pointer', fontFamily: 'inherit' }}
                            >
                              <div style={{ width: '32px', height: '32px', borderRadius: '8px', flexShrink: 0, display: 'flex', alignItems: 'center', justifyContent: 'center', background: 'rgba(255,255,255,0.04)', color: 'rgba(255,255,255,0.2)' }}> <AtlasIconImage /> </div>
                              <div style={{ flex: 1 }}> <div style={{ fontWeight: 700, fontSize: '13px', color: 'var(--text-primary)' }}>{lam.titulo}</div> </div>
                              <AtlasIconChevron />
                            </button>
                          ))}
                        </div>
                      </div>
                    )}

                    {atlasNav.step === 'plate' && atlasNav.laminaAtual && (
                      <AnatomiaAtlasPlate lamina={atlasNav.laminaAtual} accentColor={atlasCategory.cor} sistemaTitulo={atlasSystem.titulo} divisaoTitulo={atlasOrgan.titulo} referenciaAsclepio={atlasData.referenciaAsclepio || { nome: '', url: '' }} onBack={atlasGoBack} />
                    )}
                  </>
                )}
              </div>
            )}

            {viewMode === 'revisao' && (
              <div style={{ animation: 'aboutFadeIn 0.3s ease' }}>
                {revisaoErr && ( <div style={{ padding: '16px', borderRadius: '14px', background: 'rgba(239,68,68,0.08)', border: '1px solid rgba(239,68,68,0.2)', color: '#FCA5A5', fontSize: '13px', lineHeight: 1.6, marginBottom: '16px' }}> Erro ao carregar revisão. </div> )}
                {!revisaoData && !revisaoErr && (
                  <div style={{ padding: '48px 24px', textAlign: 'center', marginBottom: '8px' }}>
                    <div style={{ width: '28px', height: '28px', margin: '0 auto 12px', border: '3px solid rgba(255,255,255,0.1)', borderTopColor: '#10B981', borderRadius: '50%', animation: 'spin 0.8s linear infinite' }} />
                    <div style={{ fontSize: '13px', color: 'var(--text-secondary)' }}>Carregando revisão...</div>
                  </div>
                )}
                {revisaoData && (
                  <>
                    {filteredRevisao.length === 0 && ( <div style={{ textAlign: 'center', color: 'var(--text-secondary)', padding: '40px 0', fontSize: '14px' }}>Nenhum resultado para "{search}".</div> )}
                    {filteredRevisao.map(sys => {
                      const SysIcon = ATLAS_ICON_MAP[sys.icone] || AtlasIconBone;
                      const nItems = (sys.subsections || []).reduce((t, s) => t + countRevisaoSubItems(s), 0);
                      return (
                        <div key={sys.id} style={{ marginBottom: '8px', borderRadius: '14px', overflow: 'hidden', border: '1px solid rgba(255,255,255,0.06)', background: 'rgba(255,255,255,0.02)' }}>
                          <div onClick={() => toggleSystem(sys.id)} style={{ display: 'flex', alignItems: 'center', gap: '12px', padding: '13px 16px', cursor: 'pointer', userSelect: 'none', borderBottom: openSystem === sys.id ? '1px solid rgba(255,255,255,0.06)' : 'none' }}>
                            <span style={{ width: '36px', height: '36px', borderRadius: '10px', display: 'flex', alignItems: 'center', justifyContent: 'center', background: (sys.color || '#10B981') + '22', color: sys.color || '#10B981', flexShrink: 0 }}> <SysIcon /> </span>
                            <span style={{ fontWeight: 700, fontSize: '14px', color: 'var(--text-primary)', flex: 1 }}>{sys.name}</span>
                            <span style={{ fontSize: '11px', color: 'var(--text-secondary)', marginRight: '4px' }}>{nItems} itens</span>
                            <span style={{ display: 'flex', transition: 'transform 0.2s', transform: openSystem === sys.id ? 'rotate(90deg)' : 'rotate(0deg)', color: 'var(--text-secondary)', opacity: 0.5 }}><AtlasIconChevron /></span>
                          </div>
                          {openSystem === sys.id && (
                            <div style={{ padding: '8px 12px 12px' }}>
                              {(sys.subsections || []).map((sub, si) => {
                                const subKey = sys.id + '_' + si;
                                const blocks = normalizeRevisaoBlocks(sub);
                                return (

    const MedGradPlusApp = () => {
      const VALID_TABS = ['home', 'cards', 'quiz', 'materials', 'feedback', 'about', 'profile', 'anatomy_hist', 'ambassador', 'gradbook', 'antigas'];
      const parseRouteFromHash = () => {
        const raw = window.location.hash.replace(/^#/, '').trim();
        if (raw === 'about-public') {
          return {
            tab: 'about',
            materiaId: null,
            aulaId: null,
            publicOnly: true,
          };
        }
        const [tabRaw, materiaRaw, aulaRaw] = raw.split(':');
        let resolvedTab = tabRaw;
        if (tabRaw === 'anatomy') resolvedTab = 'anatomy_hist';
        if (tabRaw === 'histology') resolvedTab = 'anatomy_hist';
        const tab = VALID_TABS.includes(resolvedTab) ? resolvedTab : 'home';
        let materiaId = materiaRaw ? decodeURIComponent(materiaRaw) : null;
        if (tabRaw === 'anatomy' && !materiaId) materiaId = 'anatomy';
        if (tabRaw === 'histology' && !materiaId) materiaId = 'histology';
        if (tab === 'anatomy_hist' && !materiaId) materiaId = 'anatomy';
        return {
          tab,
          materiaId,
          aulaId: aulaRaw ? decodeURIComponent(aulaRaw) : null,
          publicOnly: false,
        };
      };
      const buildHash = ({ tab, materiaId, aulaId }) => {
        const parts = [tab || 'home'];
        if (tab === 'anatomy_hist') {
          if (materiaId && materiaId !== 'anatomy') parts.push(encodeURIComponent(materiaId));
          if (aulaId) parts.push(encodeURIComponent(aulaId));
          return `#${parts.join(':')}`;
        }
        if (materiaId) parts.push(encodeURIComponent(materiaId));
        if (aulaId) parts.push(encodeURIComponent(aulaId));
        return `#${parts.join(':')}`;
      };
      const initialRoute = parseRouteFromHash();

      const [stage, setStage] = useState('splash'); // splash, auth, app
      const [user, setUser] = useState(null);
      const [routeState, setRouteState] = useState(initialRoute);
      const [currentTab, setCurrentTab] = useState(initialRoute.tab);
      const isAmbassadorUser = !!(user?.ambassadorId || user?.ambassadorVitalicio || user?.couponCode);
      const [darkMode, setDarkMode] = useState(() => {
        const saved = localStorage.getItem('meduni9_theme');
        return saved ? saved !== 'light' : true;
      });

      useEffect(() => {
        document.documentElement.setAttribute('data-theme', darkMode ? 'dark' : 'light');
        localStorage.setItem('meduni9_theme', darkMode ? 'dark' : 'light');
      }, [darkMode]);

      const renderThemeToggle = () => (
        <button
          className="theme-toggle-btn"
          onClick={() => setDarkMode(d => !d)}
          title={darkMode ? 'Modo claro' : 'Modo escuro'}
          aria-label={darkMode ? 'Ativar modo claro' : 'Ativar modo escuro'}
        >
          {darkMode ? (
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
          ) : (
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          )}
        </button>
      );

      const [sidebarOpen, setSidebarOpen] = useState(() =>
        typeof window !== 'undefined' &&
        window.matchMedia &&
        window.matchMedia('(min-width: 769px)').matches
      );

      const navigateTo = (tab, options = {}) => {
        if (tab === 'about') {
          const em = user?.email;
          window.location.href = (em && !user?.isGuest && /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em))
            ? `landing.html?email=${encodeURIComponent(em)}`
            : 'landing.html';
          return;
        }
        const resolvedTab = VALID_TABS.includes(tab) ? tab : 'home';
        const materiaIdForAnatomyHist = options.materiaId !== undefined ? options.materiaId : 'anatomy';
        const nextRoute = {
          tab: resolvedTab,
          materiaId: resolvedTab === 'anatomy_hist' ? materiaIdForAnatomyHist : (options.materiaId || null),
          aulaId: options.aulaId || null,
          publicOnly: !!options.publicOnly,
        };
        setRouteState(nextRoute);
        setCurrentTab(nextRoute.tab);
        const nextHash = nextRoute.publicOnly ? '#about-public' : buildHash(nextRoute);
        if (window.location.hash !== nextHash) {
          window.location.hash = nextHash;
        }
        try {
          if (window.matchMedia('(max-width: 768px)').matches) setSidebarOpen(false);
        } catch (_) {}
      };
      const [materias, setMaterias] = useState([]);
      const [flashcards, setFlashcards] = useState([]);
      const [questoesAntigas, setQuestoesAntigas] = useState([]);
      const [selectedMateria, setSelectedMateria] = useState(null);
      const [homeMateriaPicker, setHomeMateriaPicker] = useState({ open: false, materiaId: null, materiaNome: '' });
      const [loading, setLoading] = useState(true);
      const [showInstallTip, setShowInstallTip] = useState(false);
      const [installTipPlatform, setInstallTipPlatform] = useState('ios');

      // Dica “adicionar à tela inicial” (iOS Safari / Android Chrome). Mostra a cada visita até “Não mostrar novamente”.
      useEffect(() => {
        try {
          if (localStorage.getItem('meduni9_install_tip_never_again') === '1') return;
          if (localStorage.getItem('meduni9_dismiss_ios_install_tip')) return;
          const isStandalone =
            window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
          if (isStandalone) return;
          const ua = navigator.userAgent || '';
          const isIos =
            /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
          const isAndroid = /Android/i.test(ua);
          if (isIos) {
            setInstallTipPlatform('ios');
            setShowInstallTip(true);
          } else if (isAndroid) {
            setInstallTipPlatform('android');
            setShowInstallTip(true);
          }
        } catch (_) {}
      }, []);

      // Auth state refs (stable across renders, safe in closures)
      const splashDoneRef = useRef(false);
      const authStateRef  = useRef(undefined); // undefined = resolving | null = no user | object = profile

      useEffect(() => {
        const handleHashChange = () => {
          const nextRoute = parseRouteFromHash();
          setRouteState(nextRoute);
          setCurrentTab(nextRoute.tab);
        };
        window.addEventListener('hashchange', handleHashChange);
        return () => window.removeEventListener('hashchange', handleHashChange);
      }, []);

      useEffect(() => {
        if (routeState.tab === 'cards' || routeState.tab === 'quiz' || routeState.tab === 'feedback') {
          setSelectedMateria(routeState.materiaId || null);
        }
      }, [routeState.tab, routeState.materiaId]);

      useEffect(() => {
        if (currentTab === 'ambassador' && !isAmbassadorUser) {
          navigateTo('home');
        }
      }, [currentTab, isAmbassadorUser]);

      const applyResolvedAuth = (profile) => {
        if (profile) { setUser(normalizeUserProfile(profile)); setStage('app'); }
        else          { setStage('auth'); }
      };

      // Firebase Auth listener: resolves well before splash ends (~2400ms)
      useEffect(() => {
        if (!window.__fbAuth || !window.__fbAuthFns || !window.__fbFirestore) {
          // Fallback: Firebase SDK unavailable — use localStorage cache
          const cached = localStorage.getItem('meduni9_user');
          authStateRef.current = cached ? JSON.parse(cached) : null;
          if (splashDoneRef.current) applyResolvedAuth(authStateRef.current);
          return;
        }
        const { onAuthStateChanged, signOut: fbSignOut } = window.__fbAuthFns;
        const unsubscribe = onAuthStateChanged(window.__fbAuth, async (firebaseUser) => {
          if (firebaseUser) {
            let cachedProfile = null;
            try {
              const cached = localStorage.getItem('meduni9_user');
              if (cached) {
                const p = JSON.parse(cached);
                if (p.uid === firebaseUser.uid) cachedProfile = normalizeUserProfile(p);
              }
            } catch {}
            try {
              const p = await loadUserProfile(firebaseUser);
              if (p) {
                const synced = await syncProfileAccessFromCodeEntry(firebaseUser, p);
                const syncedEmail = await syncProfileAccessFromEmailGrant(firebaseUser, synced);
                const qualified = await checkAmbassadorQualification(syncedEmail);
                const normalized = persistLocalUser(qualified);
                authStateRef.current = normalized;
                if (splashDoneRef.current) applyResolvedAuth(qualified);
              } else {
                let grantPending = null;
                try {
                  grantPending = await loadEmailAccessGrant(firebaseUser.email);
                } catch {}
                if (grantPending && isEmailGrantValid(grantPending)) {
                  authStateRef.current = null;
                  if (splashDoneRef.current) applyResolvedAuth(null);
                } else if (cachedProfile) {
                  authStateRef.current = cachedProfile;
                  if (splashDoneRef.current) applyResolvedAuth(cachedProfile);
                } else {
                  authStateRef.current = null;
                  if (splashDoneRef.current) applyResolvedAuth(null);
                }
              }
            } catch {
              authStateRef.current = cachedProfile;
              if (splashDoneRef.current) applyResolvedAuth(cachedProfile);
            }
          } else {
            localStorage.removeItem('meduni9_user');
            authStateRef.current = null;
            if (splashDoneRef.current) applyResolvedAuth(null);
          }
        });
        return () => unsubscribe();
      }, []); // eslint-disable-line

      useEffect(() => {
        // Load data when app starts
        if (stage === 'app' && loading) {
          loadAppData();
        }
      }, [stage, loading]);

      const loadAppData = async () => {
        try {
          // Load data from external JSON files
          const [materiasRes, flashcardsRes, questoesRes, antigasRes] = await Promise.all([
            fetch('data/materias.json').catch(() => null),
            fetch('data/flashcards.json').catch(() => null),
            fetch('data/questoes.json').catch(() => null),
            fetch('data/questoes_antigas.json').catch(() => null)
          ]);

          let materiasData = [];
          let flashcardsData = [];

          if (materiasRes && materiasRes.ok) {
            const raw = await materiasRes.json();
            // Convert object format to array with id
            materiasData = Object.entries(raw)
              .filter(([k]) => !k.startsWith('_'))
              .map(([id, val]) => ({ id, ...val, pergunta: val.frente, resposta: val.verso }));
          }

          if (flashcardsRes && flashcardsRes.ok) {
            const raw = await flashcardsRes.json();
            const cards = raw.flashcards || raw;
            flashcardsData = (Array.isArray(cards) ? cards : []).map(c => ({
              ...c,
              pergunta: c.frente || c.pergunta,
              resposta:
                c.verso ||
                c.resposta ||
                ((typeof (c.frente || c.pergunta) === 'string' && (c.frente || c.pergunta).match(CLOZE_REGEX_SINGLE))
                  ? ((c.frente || c.pergunta).match(CLOZE_REGEX_SINGLE)[1] || '').trim()
                  : '')
            }));
          }

          let questoesArray = [];
          
          if (questoesRes && questoesRes.ok) {
            const raw = await questoesRes.json();
            const questoes = raw.questoes || raw;
            questoesArray = questoesArray.concat(Array.isArray(questoes) ? questoes : []);
          }

          let questoesAntigasArray = [];
          if (antigasRes && antigasRes.ok) {
            const raw = await antigasRes.json();
            const antigas = raw.questoes || raw;
            const antigasParsed = Array.isArray(antigas) ? antigas : [];
            antigasParsed.forEach(q => {
              questoesAntigasArray.push({
                id: 'qa_' + q.id,
                materia: q.materia,
                pergunta: q.enunciado,
                resposta: q.opcoes && q.correta !== null && q.opcoes[q.correta] ? q.opcoes[q.correta].replace(/^[A-D]\)\s*/, '') : '',
                explicacao: q.explicacao,
                explicacao_geral: q.explicacao_geral || '',

              <AnatomiaHistologiaScreen
                user={user}
                mode={routeState.materiaId === 'histology' ? 'histology' : 'anatomy'}
                onModeChange={(m) => navigateTo('anatomy_hist', { materiaId: m })}
              />
            )}

            {homeMateriaPicker.open && (
              <div className="feedback-overlay" onClick={closeHomeMateriaPicker}>
                <div className="feedback-modal" onClick={(e) => e.stopPropagation()}>
                  <h3>Escolher destino</h3>
                  <p>{homeMateriaPicker.materiaNome}</p>
                  <div className="home-destination-actions">
                    <button className="feedback-btn home-destination-option" onClick={() => goFromHomeTo('materials')}>
                      <IconBookOpen /> Materiais
                    </button>
                    <button className="feedback-btn home-destination-option" onClick={() => goFromHomeTo('quiz')}>
                      <IconClipboardList /> Questões
                    </button>
                    <button className="feedback-btn home-destination-option" onClick={() => goFromHomeTo('cards')}>
                      <IconLayers /> Flashcards
                    </button>
                    <button className="feedback-btn home-destination-cancel" onClick={closeHomeMateriaPicker}>
                      <IconX /> Cancelar
                    </button>
                  </div>
                </div>
              </div>
            )}

          </div>
        </div>
        </>
      );
    };

    // Render App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<MedGradPlusApp />);
  </script>
</body>
</html>
