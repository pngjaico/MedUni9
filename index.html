<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1E2433">
  <meta name="theme-color" content="#F1F5F9" media="(prefers-color-scheme: light)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="MedGradPlus — Plataforma de estudos para estudantes de medicina">
  <title>MedGradPlus</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%230A1628'/><rect x='13' y='28' width='38' height='8' rx='3' fill='%2300B4D8'/><rect x='28' y='13' width='8' height='38' rx='3' fill='%2300B4D8'/><rect x='26' y='26' width='12' height='12' rx='2' fill='%2300C9E8'/></svg>">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><rect width='192' height='192' rx='40' fill='%230A1628'/><rect x='38' y='84' width='116' height='24' rx='8' fill='%2300B4D8'/><rect x='84' y='38' width='24' height='116' rx='8' fill='%2300B4D8'/><rect x='78' y='78' width='36' height='36' rx='6' fill='%2300C9E8'/></svg>">

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@600;700;800&family=Lexend:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-user-select: none;
      user-select: none;
    }

    html {
      background-color: var(--bg-dark, #1E2433);
      height: 100%;
      color-scheme: dark;
    }

    html[data-theme="light"] {
      color-scheme: light;
    }

    html, body {
      width: 100%;
      height: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      min-height: -webkit-fill-available;
      font-family: 'DM Sans', sans-serif;
      background: var(--bg-body, linear-gradient(160deg, #1E2433 0%, #252B3A 55%, #232D42 100%));
      /* fixed no iOS Safari costuma gerar tela preta / fundo que não pinta */
      background-attachment: scroll;
      color: var(--text-primary, #E5E7EB);
      overflow: hidden;
      transition: background 0.3s ease, color 0.3s ease;
    }

    #root {
      width: 100%;
      height: 100%;
      min-height: 100dvh;
      min-height: -webkit-fill-available;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding-top: env(safe-area-inset-top, 0px);
      padding-right: env(safe-area-inset-right, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      padding-left: env(safe-area-inset-left, 0px);
      box-sizing: border-box;
    }

    /* Typography */
    h1, h2, h3, h4, h5, h6 {
      font-family: 'Outfit', sans-serif;
      font-weight: 700;
    }

    /* Colors & Design Tokens */
    :root {
      --primary: #00C896;
      --mint: #00C896;
      --success: #10B981;
      --warning: #F59E0B;
      --error: #EF4444;
      --purple: #8B5CF6;

      /* Background — cinza-azulado (um tom mais claro que o carvão puro, mantém legibilidade) */
      --bg-body: linear-gradient(160deg, #1E2433 0%, #252B3A 55%, #232D42 100%);
      --bg-dark: #1E2433;
      --bg-sidebar: #252B3A;
      --bg-card: rgba(255, 255, 255, 0.05);
      --border-card: rgba(255, 255, 255, 0.07);
      --text-primary: #E8EBF0;
      --text-secondary: #8B95A8;

      /* Surfaces */
      --surface-1: rgba(255, 255, 255, 0.06);
      --surface-2: rgba(255, 255, 255, 0.09);
      --surface-3: rgba(255, 255, 255, 0.14);
      --border-subtle: rgba(255, 255, 255, 0.09);
      --border-strong: rgba(255, 255, 255, 0.18);

      /* Elevação */
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.18);
      --shadow-md: 0 4px 20px rgba(0, 0, 0, 0.25);
      --shadow-lg: 0 8px 40px rgba(0, 0, 0, 0.35);

      /* Animação */
      --ease-spring: cubic-bezier(0.16, 1, 0.3, 1);
      --duration-fast: 150ms;
      --duration-base: 250ms;

      /* Cores por matéria */
      --color-sus: #6366F1;
      --color-semiologia: #C0392B;
      --color-bmf1: #E85D75;
      --color-bmf2: #EF4444;
      --color-bmf3: #3B82F6;
      --color-bmf4: #A855F7;
      --color-bcm1: #4A90E2;
      --color-mad: #F59E0B;
      --color-indicadores: #10B981;
      --color-mfc: #16A34A;
      --color-pediatria: #F59E0B;
      --color-go: #EC4899;
    }

    /* ── Light Theme ───────────────────────────────────── */
    html[data-theme="light"] {
      background-color: var(--bg-dark, #F1F5F9);
      --bg-body: linear-gradient(135deg, #EFF6FF 0%, #F1F5F9 50%, #E2EAF4 100%);
      --bg-dark: #F1F5F9;
      --bg-sidebar: rgba(255, 255, 255, 0.97);
      --bg-card: rgba(0, 0, 0, 0.04);
      --border-card: rgba(0, 0, 0, 0.08);
      --text-primary: #1E293B;
      --text-secondary: #64748B;
      --surface-1: rgba(0, 0, 0, 0.04);
      --surface-2: rgba(0, 0, 0, 0.06);
      --surface-3: rgba(0, 0, 0, 0.10);
      --border-subtle: rgba(0, 0, 0, 0.07);
      --border-strong: rgba(0, 0, 0, 0.15);
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.07);
      --shadow-md: 0 4px 20px rgba(0, 0, 0, 0.10);
      --shadow-lg: 0 8px 40px rgba(0, 0, 0, 0.14);
    }

    html[data-theme="light"] body {
      background: var(--bg-body);
      color: #1E293B;
    }

    html[data-theme="light"] .desktop-layout,
    html[data-theme="light"] .app-container,
    html[data-theme="light"] .splash-screen {
      background: var(--bg-body) !important;
    }

    html[data-theme="light"] .desktop-sidebar {
      background: var(--bg-sidebar) !important;
      border-right-color: rgba(0, 0, 0, 0.08) !important;
      box-shadow: 2px 0 16px rgba(0, 0, 0, 0.06) !important;
    }

    html[data-theme="light"] .sidebar-item {
      color: #475569 !important;
    }
    html[data-theme="light"] .sidebar-item:hover {
      background: rgba(0, 200, 150, 0.10) !important;
      color: #1E293B !important;
    }
    html[data-theme="light"] .sidebar-item.active {
      background: rgba(0, 200, 150, 0.16) !important;
      color: var(--primary) !important;
    }
    html[data-theme="light"] .sidebar-footer {
      border-top-color: rgba(0, 0, 0, 0.08) !important;
    }
    html[data-theme="light"] .sidebar-logo {
      border-bottom-color: rgba(0, 0, 0, 0.08) !important;
    }
    html[data-theme="light"] .screen-content { background: transparent !important; }
    html[data-theme="light"] .sidebar-open-bar {
      background: rgba(255,255,255,0.97) !important;
      border-bottom-color: rgba(0,0,0,0.08) !important;
    }
    html[data-theme="light"] .feedback-panel,
    html[data-theme="light"] .feedback-modal {
      background: #ffffff !important;
      border-color: rgba(0,0,0,0.1) !important;
    }
    html[data-theme="light"] .feedback-select,
    html[data-theme="light"] .feedback-textarea {
      background: #F8FAFC !important;
      border-color: rgba(0,0,0,0.12) !important;
      color: #1E293B !important;
    }
    html[data-theme="light"] .feedback-select option { background: #ffffff !important; color: #1E293B !important; }

    /* ── Light Mode: Card/Surface contrast fixes ─────── */
    html[data-theme="light"] .stat-card {
      background: rgba(255, 255, 255, 0.88) !important;
      border: 1px solid rgba(0, 0, 0, 0.10) !important;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.07) !important;
    }
    html[data-theme="light"] .question-card,
    html[data-theme="light"] .flashcard-item,
    html[data-theme="light"] .material-item {
      background: rgba(255, 255, 255, 0.85) !important;
      border-color: rgba(0, 0, 0, 0.10) !important;
      box-shadow: 0 1px 6px rgba(0, 0, 0, 0.07) !important;
    }
    html[data-theme="light"] .screen-header {
      background: rgba(255, 255, 255, 0.90) !important;
      border-bottom-color: rgba(0, 0, 0, 0.08) !important;
    }
    html[data-theme="light"] .subject-select-item {
      background: rgba(255, 255, 255, 0.80) !important;
      border-color: rgba(0, 0, 0, 0.10) !important;
    }
    html[data-theme="light"] .subject-select-item:hover {
      background: rgba(255, 255, 255, 0.97) !important;
    }
    html[data-theme="light"] .btn-primary {
      box-shadow: 0 2px 12px rgba(0, 200, 150, 0.3) !important;
    }
    html[data-theme="light"] .markdown-body {
      background: rgba(255, 255, 255, 0.95) !important;
    }

    /* Grifar (Highlight) - Áreas permitidas */
    .markdown-body, 
    .markdown-body *,
    .preprova-content,
    .preprova-content *,
    .quiz-screen,
    .quiz-screen * {
      -webkit-user-select: text !important;
      user-select: text !important;
    }

    /* O restante do app continua não selecionável para manter a sensação de plataforma */

    .mg-highlight {
      background-color: #fef08a !important; 
      color: #000 !important;
      padding: 1px 0;
      border-radius: 0;
      cursor: pointer;
      display: inline;
      box-shadow: 0 0 6px rgba(254, 240, 138, 0.4);
      transition: all 0.2s ease;
      -webkit-box-decoration-break: clone;
      box-decoration-break: clone;
    }
    .mg-hl-start {
      padding-left: 4px !important;
      border-top-left-radius: 4px !important;
      border-bottom-left-radius: 4px !important;
    }
    .mg-hl-end {
      padding-right: 4px !important;
      border-top-right-radius: 4px !important;
      border-bottom-right-radius: 4px !important;
    }
    /* Garante que negritos, itálicos e títulos dentro do grifo fiquem pretos para contraste */
    .mg-highlight *, 
    .mg-highlight strong, 
    .mg-highlight b, 
    .mg-highlight h1, 
    .mg-highlight h2, 
    .mg-highlight h3, 
    .mg-highlight h4 {
      color: #000 !important;
      font-weight: 800 !important; /* Reforça o negrito para destacar no fundo amarelo */
    }
    html[data-theme="dark"] .mg-highlight {
      background-color: #fde047 !important;
      color: #000 !important;
    }
    html[data-theme="dark"] .mg-highlight * {
      color: #000 !important;
    }
    html[data-theme="light"] .material-header-card {
      background: rgba(255, 255, 255, 0.88) !important;
      border-color: rgba(0, 0, 0, 0.10) !important;
    }

    /* ── Theme Toggle Button ─────────────────────────── */
    .theme-toggle-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 16px;
      transition: color 0.2s, opacity 0.2s;
      flex-shrink: 0;
      opacity: 0.7;
    }
    .theme-toggle-btn:hover {
      color: var(--primary);
      opacity: 1;
    }

    /* Main Container */
    .app-container {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      width: 100%;
      max-width: 430px;
      margin: 0 auto;
      background: var(--bg-body, linear-gradient(160deg, #1E2433 0%, #252B3A 55%, #232D42 100%));
      position: relative;
      transition: background 0.3s ease;
    }

    /* Rota pública Sobre (#about-public): largura total no desktop — sem max-width 430px */
    .about-public-shell {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      width: 100%;
      max-width: none;
      margin: 0;
      overflow: hidden;
      background: var(--bg-body, linear-gradient(160deg, #1E2433 0%, #252B3A 55%, #232D42 100%));
      position: relative;
      transition: background 0.3s ease;
    }

    html[data-theme="light"] .about-public-shell {
      background: var(--bg-body) !important;
    }

    /* Desktop layout wrapper */
    .desktop-layout {
      display: flex;
      flex: 1;
      min-height: 0;
      width: 100%;
      overflow: hidden;
      background: var(--bg-body, linear-gradient(160deg, #1E2433 0%, #252B3A 55%, #232D42 100%));
      transition: background 0.3s ease;
    }

    .desktop-layout .app-container {
      max-width: none;
      margin: 0;
      height: 100%;
      flex: 1;
      min-width: 0;
      min-height: 0;
    }

    /* Desktop Sidebar */
    .desktop-sidebar {
      display: none;
      width: 240px;
      min-width: 240px;
      background: var(--bg-sidebar, #252B3A);
      border-right: 1px solid var(--border-card);
      transition: background 0.3s ease;
      flex-direction: column;
      padding: 24px 0;
      height: 100vh;
      position: sticky;
      top: 0;
    }

    .sidebar-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 20px 24px;
      border-bottom: 1px solid var(--border-card);
      margin-bottom: 16px;
      justify-content: flex-start;
    }

    .sidebar-logo-icon { font-size: 28px; }

    .sidebar-logo-text {
      font-family: 'Outfit', sans-serif;
      font-size: 20px;
      font-weight: 700;
      color: var(--primary);
    }

    .sidebar-nav {
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 0 12px;
      flex: 1;
    }

    .sidebar-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      border-radius: 10px;
      cursor: pointer;
      color: var(--text-secondary);
      font-size: 14px;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .sidebar-item:hover {
      background: rgba(0, 200, 150, 0.08);
      color: var(--text-primary);
    }

    .sidebar-item.active {
      background: rgba(0, 200, 150, 0.15);
      color: var(--primary);
    }

    .sidebar-item svg {
      flex-shrink: 0;
    }

    /* Teaser não clicável — alinhado ao .sidebar-item (altura / padding) */
    .sidebar-gradbook-teaser {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin: 4px 0 0;
      padding: 12px 16px;
      border-radius: 10px;
      border: 1px solid rgba(245, 158, 11, 0.28);
      background: rgba(245, 158, 11, 0.07);
      pointer-events: auto;
      user-select: none;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
      line-height: 1.2;
      transition: background 0.18s ease, border-color 0.18s ease;
    }
    .sidebar-gradbook-teaser:hover {
      background: rgba(245, 158, 11, 0.14);
      border-color: rgba(245, 158, 11, 0.45);
    }
    .sidebar-gradbook-teaser.active {
      background: rgba(245, 158, 11, 0.18);
      border-color: rgba(245, 158, 11, 0.55);
    }

    html[data-theme="light"] .sidebar-gradbook-teaser {
      background: rgba(254, 243, 199, 0.45);
      border-color: rgba(217, 119, 6, 0.22);
    }

    .sidebar-gradbook-teaser__label {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-family: 'DM Sans', sans-serif;
    }

    .sidebar-footer {
      padding: 16px 20px;
      border-top: 1px solid var(--border-card);
      font-size: 11px;
      color: var(--text-secondary);
      text-align: center;
    }

    .screen-content {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 20px 16px calc(28px + env(safe-area-inset-bottom, 0px)) 16px;
      -webkit-overflow-scrolling: touch;
    }

    /* Atalho «Pré-Prova» no topo do material (mobile + desktop) */
    .material-jump-preprova {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      flex-shrink: 0;
      padding: 8px 16px;
      border-radius: 999px;
      border: 1px solid rgba(245, 158, 11, 0.45);
      background: linear-gradient(155deg, rgba(245, 158, 11, 0.22) 0%, rgba(251, 191, 36, 0.09) 55%, rgba(15, 23, 42, 0.35) 100%);
      color: #FDE68A;
      font-size: 0.8125rem;
      font-weight: 700;
      font-family: 'DM Sans', sans-serif;
      letter-spacing: 0.02em;
      cursor: pointer;
      white-space: nowrap;
      box-shadow:
        0 2px 16px rgba(245, 158, 11, 0.2),
        inset 0 1px 0 rgba(255, 255, 255, 0.06);
      transition: transform 0.18s ease, box-shadow 0.22s ease, background 0.22s ease, border-color 0.22s ease;
    }

    .material-jump-preprova:hover {
      background: linear-gradient(155deg, rgba(245, 158, 11, 0.35) 0%, rgba(251, 191, 36, 0.2) 50%, rgba(15, 23, 42, 0.25) 100%);
      border-color: rgba(251, 191, 36, 0.6);
      box-shadow: 0 8px 28px rgba(245, 158, 11, 0.32);
      transform: translateY(-2px);
    }

    .material-jump-preprova:active {
      transform: translateY(0);
      box-shadow: 0 2px 12px rgba(245, 158, 11, 0.22);
    }

    .material-jump-preprova:focus-visible {
      outline: 2px solid rgba(251, 191, 36, 0.85);
      outline-offset: 3px;
    }

    .material-jump-preprova__icon {
      font-size: 1.05rem;
      line-height: 1;
      filter: drop-shadow(0 0 10px rgba(251, 191, 36, 0.45));
    }

    .material-jump-preprova__arrow {
      font-size: 0.88rem;
      font-weight: 800;
      opacity: 0.92;
      line-height: 1;
    }

    html[data-theme="light"] .material-jump-preprova {
      color: #92400E;
      border-color: rgba(217, 119, 6, 0.45);
      background: linear-gradient(155deg, #FFFBEB 0%, #FEF3C7 45%, #FDE68A 100%);
      box-shadow: 0 2px 14px rgba(217, 119, 6, 0.18), inset 0 1px 0 rgba(255, 255, 255, 0.8);
    }

    html[data-theme="light"] .material-jump-preprova:hover {
      background: linear-gradient(155deg, #FFFBEB 0%, #FDE68A 50%, #FCD34D 100%);
      border-color: rgba(180, 83, 9, 0.45);
      box-shadow: 0 8px 26px rgba(217, 119, 6, 0.22);
    }

    html[data-theme="light"] .material-jump-preprova__icon {
      filter: none;
    }

    /* Hamburger/sidebar toggle button */
    .sidebar-toggle-btn {
      display: none;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border-radius: 8px;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 18px;
      line-height: 1;
      flex-shrink: 0;
      transition: color 0.2s;
    }
    .sidebar-toggle-btn:hover {
      background: transparent;
      color: var(--primary);
    }

    /* Sticky open-bar (replaces the old fixed toggle when sidebar is collapsed) */
    .sidebar-open-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      position: sticky;
      top: 0;
      z-index: 150;
      background: var(--bg-dark, #1E2433);
      border-bottom: 1px solid var(--border-card);
    }

    /* Sidebar collapsed state */
    .desktop-sidebar.collapsed {
      width: 0 !important;
      min-width: 0 !important;
      padding: 0 !important;
      overflow: hidden;
      border-right: none;
    }

    /* Study mode selector */
    .study-mode-selector {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 16px;
    }
    .study-mode-btn {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 20px;
      background: var(--bg-card);
      border: 1.5px solid var(--border-card);
      border-radius: 14px;
      cursor: pointer;
      transition: all 0.2s;
      text-align: left;
      color: var(--text-primary);
      font-family: 'DM Sans', sans-serif;
    }
    .study-mode-btn:hover {
      border-color: var(--primary);
      background: rgba(0, 200, 150, 0.07);
    }
    .study-mode-icon { font-size: 24px; }
    .study-mode-title { font-size: 14px; font-weight: 600; margin-bottom: 2px; }
    .study-mode-desc { font-size: 12px; color: var(--text-secondary); }

    /* Search input for subjects */
    .subject-search {
      width: 100%;
      padding: 11px 14px 11px 38px;
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: 10px;
      color: var(--text-primary);
      font-size: 14px;
      font-family: 'DM Sans', sans-serif;
      margin-bottom: 14px;
      transition: border-color 0.2s;
    }
    .subject-search:focus {
      outline: none;
      border-color: var(--primary);
    }
    .subject-search-wrap {
      position: relative;
      margin-bottom: 4px;
    }
    .subject-search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-secondary);
      pointer-events: none;
      display: flex;
      align-items: center;
      line-height: 0;
    }

    /* Category tabs for questions */
    .category-tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 20px;
    }
    .category-tab {
      flex: 1;
      padding: 9px 10px;
      border-radius: 10px;
      border: 1.5px solid var(--border-card);
      background: transparent;
      color: var(--text-secondary);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
      min-height: auto;
      text-transform: none;
      letter-spacing: 0;
      font-family: 'DM Sans', sans-serif;
    }
    .category-tab.active {
      background: var(--primary);
      color: #000;
      border-color: var(--primary);
    }

    /* Quiz question card with better readability */
    .quiz-question-card {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 16px;
      padding: 20px 22px;
      margin-bottom: 20px;
    }

    @media (min-width: 769px) {
      #root {
        display: flex;
      }

      .desktop-sidebar {
        display: flex;
        transition: width 0.25s ease, min-width 0.25s ease, padding 0.25s ease;
      }

      .desktop-layout .screen-content {
        padding: 28px 40px 40px;
      }

      .desktop-layout .flashcard {
        min-height: 360px;
      }

      .desktop-layout .stats-grid {
        grid-template-columns: 1fr 1fr 1fr;
      }

      .desktop-layout .quiz-question {
        font-size: 20px;
      }

      .sidebar-toggle-btn {
        display: flex;
      }

      /* Desktop: barra superior só quando a sidebar está recolhida */
      .sidebar-backdrop {
        display: none !important;
        pointer-events: none;
      }

      .mobile-app-top-bar {
        display: none;
      }

    }

    /* Mobile / tablet estreito: drawer lateral + barra com hamburger */
    @media (max-width: 768px) {
      .mobile-app-top-bar {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-shrink: 0;
        position: sticky;
        top: 0;
        z-index: 160;
        padding: 10px 14px;
        padding-top: max(10px, env(safe-area-inset-top, 0px));
        background: var(--bg-dark, #1E2433);
        border-bottom: 1px solid var(--border-card);
      }

      html[data-theme="light"] .mobile-app-top-bar {
        background: var(--bg-body);
        border-bottom-color: var(--border-card);
      }

      .mobile-app-top-bar__menu {
        display: flex !important;
      }

      .mobile-app-top-bar__title {
        flex: 1;
        min-width: 0;
        font-family: 'Outfit', sans-serif;
        font-size: 1.05rem;
        font-weight: 700;
        color: var(--text-primary);
        letter-spacing: -0.02em;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .desktop-sidebar {
        display: flex !important;
        position: fixed;
        left: 0;
        top: 0;
        height: 100dvh;
        height: 100vh;
        width: min(288px, 88vw);
        max-width: 288px;
        min-width: 0 !important;
        z-index: 220;
        transform: translateX(-100%);
        transition: transform 0.28s ease;
        box-shadow: none;
        border-right: 1px solid var(--border-card);
        padding-top: max(12px, env(safe-area-inset-top, 0px));
      }

      .desktop-sidebar:not(.collapsed) {
        transform: translateX(0);
        box-shadow: 12px 0 40px rgba(0, 0, 0, 0.4);
      }

      .desktop-sidebar.collapsed {
        width: min(288px, 88vw) !important;
        min-width: 0 !important;
        padding: 24px 0 !important;
        padding-top: max(24px, env(safe-area-inset-top, 12px)) !important;
        overflow: hidden;
        transform: translateX(-100%);
        border-right: none;
      }

      .sidebar-backdrop {
        display: block !important;
        pointer-events: auto;
        position: fixed;
        inset: 0;
        z-index: 210;
        background: rgba(15, 23, 42, 0.52);
        backdrop-filter: blur(2px);
        -webkit-backdrop-filter: blur(2px);
      }

      html[data-theme="light"] .sidebar-backdrop {
        background: rgba(15, 23, 42, 0.35);
      }

      .sidebar-open-bar {
        display: none !important;
      }

      .screen-content {
        scroll-padding-bottom: calc(32px + env(safe-area-inset-bottom, 0px));
      }

      .screen-content--material-detail {
        padding-bottom: calc(48px + env(safe-area-inset-bottom, 0px)) !important;
      }

      .material-detail-end-spacer {
        min-height: 28px;
        flex-shrink: 0;
        pointer-events: none;
      }

      .material-jump-preprova {
        padding: 6px 12px;
        gap: 6px;
        font-size: 0.78rem;
      }

      .material-doc-inner .markdown-body.material-markdown-card {
        padding: 24px 18px 36px !important;
        border-radius: 18px !important;
      }

      .markdown-body.preprova-content.material-markdown-card--pre {
        padding: 14px 12px 16px !important;
      }

      .material-preprova-block {
        scroll-margin-bottom: calc(36px + env(safe-area-inset-bottom, 0px));
      }

      .markdown-body .table-wrap {
        -webkit-overflow-scrolling: touch;
        overflow-x: auto;
        overscroll-behavior-x: contain;
        margin-left: -4px;
        margin-right: -4px;
        width: calc(100% + 8px);
        max-width: none;
      }

      .markdown-body table {
        min-width: 560px;
        font-size: clamp(0.78rem, 2.1vw, 0.86rem);
      }

      .markdown-body th {
        white-space: nowrap;
        font-size: clamp(0.68rem, 1.9vw, 0.78rem);
        padding: 6px 8px;
        letter-spacing: 0.01em;
      }

      .markdown-body td {
        padding: 6px 8px;
        font-size: clamp(0.76rem, 2.05vw, 0.84rem);
      }

      .material-doc-inner .flow-box {
        padding-left: 12px;
        padding-right: 12px;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
      }

      .flow-v .flow-step {
        min-width: min(200px, 88vw);
      }
    }

    /* Tablet: leitura de materiais um pouco mais compacta; desktop largo intacto */
    @media (min-width: 769px) and (max-width: 1024px) {
      .material-doc-inner .markdown-body.material-markdown-card {
        padding: 36px 32px 42px !important;
      }

      .markdown-body table {
        font-size: 0.94rem;
      }

      .markdown-body th {
        font-size: 0.85rem;
        padding: 8px 10px;
      }

      .markdown-body td {
        padding: 8px 10px;
      }
    }

    /* Splash Screen */
    .splash-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      min-height: 0;
      width: 100%;
      height: 100%;
      background: var(--bg-body, linear-gradient(160deg, #1E2433 0%, #252B3A 55%, #232D42 100%));
      gap: 20px;
    }

    .splash-logo-wrap {
      animation: splash-fade-in 0.7s var(--ease-spring, cubic-bezier(0.16, 1, 0.3, 1)) both;
    }

    .splash-logo-inner {
      animation: logo-glow 4s ease-in-out infinite;
      filter: drop-shadow(0 0 6px rgba(0,200,150,0.4)) drop-shadow(0 0 18px rgba(0,200,150,0.2));
    }

    @keyframes logo-glow {
      0%, 100% { filter: drop-shadow(0 0 4px rgba(0,200,150,0.3)) drop-shadow(0 0 12px rgba(0,200,150,0.15)); }
      50%       { filter: drop-shadow(0 0 20px rgba(0,200,150,0.9)) drop-shadow(0 0 40px rgba(0,200,150,0.55)); }
    }

    @keyframes splash-fade-in {
      from { opacity: 0; transform: scale(0.85) translateY(12px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }

    .splash-text {
      font-size: 28px;
      font-family: 'Outfit', sans-serif;
      font-weight: 800;
      color: var(--text-primary, #E5E7EB);
      text-align: center;
      animation: splash-fade-in 0.7s 0.15s var(--ease-spring, cubic-bezier(0.16, 1, 0.3, 1)) both;
      letter-spacing: -0.02em;
    }

    .splash-tagline {
      font-size: 12px;
      font-family: 'DM Sans', sans-serif;
      font-weight: 500;
      color: var(--mint, #00C896);
      text-align: center;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      animation: splash-fade-in 0.7s 0.28s var(--ease-spring, cubic-bezier(0.16, 1, 0.3, 1)) both;
    }

    @keyframes fade-in {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* ── Auth Full-Screen Layout ─────────────────────────────── */
    .auth-page {
      display: flex;
      flex: 1;
      min-height: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      align-items: stretch;
      background: linear-gradient(135deg, #080f1e 0%, #0a1628 50%, #0c1f38 100%);
    }

    /* Left brand panel — shown only on desktop */
    .auth-brand-panel {
      display: none;
      flex-direction: column;
      justify-content: space-between;
      width: 52%;
      min-width: 480px;
      min-height: 0;
      padding: 48px 56px;
      background: linear-gradient(160deg, #0a1e3a 0%, #072040 40%, #061830 100%);
      border-right: 1px solid rgba(0,200,150,0.12);
      position: relative;
      overflow: hidden;
    }

    .auth-brand-panel::before {
      content: '';
      position: absolute;
      top: -120px;
      right: -80px;
      width: 420px;
      height: 420px;
      background: radial-gradient(circle, rgba(0,200,150,0.12) 0%, transparent 70%);
      pointer-events: none;
    }
    .auth-brand-panel::after {
      content: '';
      position: absolute;
      bottom: -100px;
      left: -60px;
      width: 340px;
      height: 340px;
      background: radial-gradient(circle, rgba(0,200,150,0.08) 0%, transparent 70%);
      pointer-events: none;
    }

    .auth-brand-top { position: relative; z-index: 1; }
    .auth-brand-logo {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 56px;
    }
    .auth-brand-logo-text {
      font-family: 'Outfit', sans-serif;
      font-size: 22px;
      font-weight: 800;
      color: #fff;
      letter-spacing: -0.02em;
    }
    .auth-brand-logo-text sup {
      font-size: 0.5em;
      color: #00C896;
      font-weight: 800;
      vertical-align: super;
      line-height: 0;
    }
    .auth-brand-headline {
      font-family: 'Outfit', sans-serif;
      font-size: 36px;
      font-weight: 800;
      color: #fff;
      line-height: 1.2;
      margin-bottom: 16px;
      letter-spacing: -0.02em;
    }
    .auth-brand-headline span { color: #00C896; }
    .auth-brand-sub {
      font-size: 15px;
      color: rgba(255,255,255,0.65);
      line-height: 1.6;
      margin-bottom: 40px;
      max-width: 380px;
    }
    .auth-brand-features {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 48px;
    }
    .auth-brand-feature {
      display: flex;
      align-items: flex-start;
      gap: 14px;
    }
    .auth-brand-feature-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: rgba(0,200,150,0.15);
      border: 1px solid rgba(0,200,150,0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }
    .auth-brand-feature-text strong {
      display: block;
      font-size: 13px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 2px;
    }
    .auth-brand-feature-text span {
      font-size: 12px;
      color: rgba(255,255,255,0.5);
    }

    /* Mascote posicionado no brand panel */
    .auth-brand-mascot-wrap {
      position: relative;
      z-index: 1;
      flex: 1;
      display: flex;
      flex-direction: row;
      align-items: stretch;
      gap: 0;
    }
    .auth-brand-mascot-wrap .auth-brand-top {
      flex: 1;
      min-width: 0;
    }
    .auth-brand-mascot-col {
      width: 180px;
      flex-shrink: 0;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding-top: 52px;
    }
    .auth-brand-mascot-img {
      width: 160px;
      height: auto;
      pointer-events: none;
      user-select: none;
      filter: drop-shadow(0 4px 20px rgba(0,0,0,0.4));
      position: static;
    }
    .auth-brand-tagline {
      font-size: 11px;
      color: rgba(255,255,255,0.3);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      position: relative;
      z-index: 1;
    }

    /* Right form panel — min-height:0 permite rolagem dentro do painel (flex) */
    .auth-form-panel {
      flex: 1;
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      overflow-y: auto;
      padding: 40px 32px;
      justify-content: center;
      -webkit-overflow-scrolling: touch;
    }

    /* Passo faculdade/campus: conteúdo alto — alinhar ao topo para overflow-y funcionar de forma previsível */
    .auth-form-panel.auth-form-panel--tall {
      justify-content: flex-start;
    }
    .auth-form-inner {
      width: 100%;
      max-width: 400px;
      margin: 0 auto;
    }

    /* Mobile logo (shown only on mobile) */
    .auth-mobile-header {
      text-align: center;
      margin-bottom: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .auth-mascot {
      width: 160px;
      height: auto;
      pointer-events: none;
      user-select: none;
      filter: drop-shadow(0 4px 20px rgba(0,0,0,0.22));
      margin: 0 auto 8px;
      display: block;
    }

    @keyframes slide-in {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Desktop breakpoint: show brand panel */
    @media (min-width: 900px) {
      .auth-brand-panel { display: flex; }
      .auth-form-panel { padding: 40px 56px; }
      .auth-mobile-header { display: none; }
    }

    /* Upsell banner (free plan) */
    .upsell-banner {
      background: linear-gradient(135deg, rgba(245,158,11,0.12) 0%, rgba(245,158,11,0.06) 100%);
      border: 1px solid rgba(245,158,11,0.35);
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 20px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }
    .upsell-banner-icon { font-size: 20px; flex-shrink: 0; margin-top: 1px; }
    .upsell-banner-text strong {
      display: block;
      font-size: 13px;
      font-weight: 700;
      color: #F59E0B;
      margin-bottom: 2px;
    }
    .upsell-banner-text span {
      font-size: 12px;
      color: rgba(255,255,255,0.6);
    }
    .upsell-banner-btn {
      margin-left: auto;
      flex-shrink: 0;
      background: #F59E0B;
      color: #000;
      border: none;
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }

    .upsell-banner--demo {
      background: linear-gradient(135deg, rgba(0,200,150,0.14) 0%, rgba(59,130,246,0.08) 100%);
      border: 1px solid rgba(0,200,150,0.35);
    }
    .upsell-banner--demo .upsell-banner-text strong {
      color: #6ee7b7;
    }
    .upsell-banner--demo .upsell-banner-btn {
      background: linear-gradient(135deg, #00C896, #059669);
      color: #0f172a;
    }

    .auth-free-compact-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px 14px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-family: 'Outfit', sans-serif;
      font-size: 12px;
      font-weight: 700;
      background: linear-gradient(135deg, #00C896, #059669);
      color: #0f172a;
      box-shadow: 0 2px 10px rgba(0, 200, 150, 0.28);
      transition: background 0.15s ease, box-shadow 0.15s ease;
    }
    .auth-free-compact-btn:hover:not(:disabled) {
      box-shadow: 0 3px 12px rgba(0, 200, 150, 0.38);
    }
    .auth-free-compact-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* Free access divider */
    .free-access-divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 20px 0 16px;
    }
    .free-access-divider::before,
    .free-access-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(255,255,255,0.08);
    }
    .free-access-divider span {
      font-size: 11px;
      color: rgba(255,255,255,0.35);
      white-space: nowrap;
    }

    .form-group {
      margin-bottom: 24px;
    }

    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-input {
      width: 100%;
      padding: 14px 16px;
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: 12px;
      color: var(--text-primary);
      font-size: 16px;
      font-family: 'DM Sans', sans-serif;
      transition: all 0.2s ease;
    }

    .form-input:focus {
      outline: none;
      border-color: var(--primary);
      background: rgba(0, 200, 150, 0.1);
    }

    .form-input::placeholder {
      color: var(--text-secondary);
    }

    .code-input-group {
      display: flex;
      gap: 8px;
      justify-content: space-between;
      margin-bottom: 24px;
    }

    .code-input-group input {
      flex: 1;
      padding: 12px;
      text-align: center;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 2px;
    }

    .fingerprint-display {
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 24px;
      font-size: 11px;
      color: var(--text-secondary);
      font-family: 'Courier New', monospace;
      word-break: break-all;
      max-height: 100px;
      overflow-y: auto;
    }

    .btn {
      padding: 14px 20px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: 'DM Sans', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 48px;
    }

    .btn-primary {
      background: var(--primary);
      color: #000;
      width: 100%;
    }

    .btn-primary:active {
      transform: scale(0.98);
      background: #0099B8;
    }

    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-secondary {
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      color: var(--text-primary);
      width: 100%;
    }

    .btn-secondary:active {
      background: rgba(255, 255, 255, 0.08);
    }

    .btn-small {
      padding: 8px 12px;
      font-size: 14px;
      min-height: auto;
    }

    .btn-success {
      background: var(--success);
      color: #000;
    }

    .btn-warning {
      background: var(--warning);
      color: #000;
    }

    .btn-error {
      background: var(--error);
      color: #fff;
    }

    .error-message {
      color: var(--error);
      font-size: 13px;
      margin-top: 8px;
    }

    .success-message {
      color: var(--success);
      font-size: 13px;
      margin-top: 8px;
    }

    /* Dashboard */
    .home-screen-content {
      flex: 1;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      padding: 16px 16px 0;
    }
    .dashboard-header {
      margin-bottom: 12px;
      padding-top: 4px;
    }

    .dashboard-welcome {
      font-size: 24px;
      font-family: 'Outfit', sans-serif;
      margin-bottom: 4px;
    }

    .dashboard-date {
      font-size: 13px;
      color: var(--text-secondary);
    }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
      margin-bottom: 12px;
    }

    .stat-card {
      background: var(--surface-2);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      padding: 14px 10px;
      text-align: center;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      min-width: 0;
      overflow: hidden;
    }

    .stat-icon {
      color: var(--primary);
      opacity: 0.75;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .stat-value {
      font-size: 20px;
      font-weight: 700;
      color: var(--primary);
      line-height: 1;
      margin-bottom: 2px;
      font-family: 'Outfit', sans-serif;
    }

    .stat-label {
      font-size: 10px;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.6px;
      font-weight: 600;
      width: 100%;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .daily-suggestion {
      background: linear-gradient(135deg, rgba(0, 200, 150, 0.12), rgba(0, 200, 150, 0.12));
      border: 1px solid rgba(0, 200, 150, 0.2);
      border-radius: 14px;
      padding: 14px 16px;
      margin-bottom: 12px;
      box-shadow: var(--shadow-sm);
    }

    .suggestion-cta {
      margin-top: 14px;
      background: var(--primary);
      color: #000;
      border: none;
      border-radius: 10px;
      padding: 10px 20px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      transition: opacity var(--duration-fast) ease, transform var(--duration-fast) var(--ease-spring);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: 'DM Sans', sans-serif;
      min-height: 40px;
    }

    .suggestion-cta:active {
      opacity: 0.85;
      transform: scale(0.97);
    }

    .suggestion-label {
      font-size: 11px;
      color: var(--purple);
      text-transform: uppercase;
      font-weight: 600;
      margin-bottom: 8px;
      letter-spacing: 0.5px;
    }

    .suggestion-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 12px;
    }

    .suggestion-progress {
      background: var(--bg-card);
      height: 6px;
      border-radius: 3px;
      overflow: hidden;
      margin-bottom: 8px;
    }

    .suggestion-progress-bar {
      height: 100%;
      background: var(--primary);
      transition: width 0.3s ease;
    }

    .suggestion-meta {
      font-size: 12px;
      color: var(--text-secondary);
    }

    .section-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 16px;
      margin-top: 24px;
    }

    .subjects-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .subject-card {
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: 12px;
      padding: 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .subject-card:active {
      background: rgba(0, 200, 150, 0.1);
      border-color: var(--primary);
    }

    .subject-icon {
      width: 48px;
      height: 48px;
      border-radius: 10px;
      background: rgba(0, 200, 150, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      flex-shrink: 0;
    }

    .subject-info {
      flex: 1;
    }

    .subject-name {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 4px;
    }

    .subject-meta {
      font-size: 12px;
      color: var(--text-secondary);
    }

    .subject-arrow {
      color: var(--text-secondary);
    }

    /* Flashcards Screen */
    .flashcards-header {
      margin-bottom: 24px;
    }

    .filter-bar {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      margin-bottom: 24px;
      padding-bottom: 8px;
      -webkit-overflow-scrolling: touch;
    }

    .filter-bar::-webkit-scrollbar {
      display: none;
    }

    .filter-btn {
      padding: 8px 16px;
      border-radius: 20px;
      border: 1px solid var(--border-card);
      background: transparent;
      color: var(--text-secondary);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
    }

    .filter-btn.active {
      background: var(--primary);
      color: #000;
      border-color: var(--primary);
    }

    .flashcard-container {
      margin-bottom: 24px;
    }

    .flashcard {
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: 16px;
      min-height: 320px;
      height: 320px;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      perspective: 1000px;
      transition: all 0.2s ease;
      position: relative;
      overflow: hidden;
    }

    .flashcard::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(135deg, rgba(0, 200, 150, 0.1), transparent);
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }

    .flashcard:active::before {
      opacity: 1;
    }

    .flashcard-inner {
      width: 100%;
      height: 100%;
      transition: transform 0.6s;
      transform-style: preserve-3d;
      position: relative;
    }

    .flashcard-inner.flipped {
      transform: rotateY(180deg);
    }

    .flashcard-front, .flashcard-back {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      backface-visibility: hidden;
      text-align: center;
      padding: 24px;
      overflow-y: auto;
    }

    .flashcard-back {
      transform: rotateY(180deg);
    }

    .flashcard-label {
      font-size: 11px;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 600;
    }

    .flashcard-text {
      font-size: 18px;
      line-height: 1.5;
      color: var(--text-primary);
      word-wrap: break-word;
    }

    .flashcard-progress {
      width: 100%;
      padding: 0 16px;
      margin-bottom: 20px;
    }

    .progress-dots {
      display: flex;
      gap: 6px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .progress-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
    }

    .progress-dot.current {
      background: var(--primary);
      width: 8px;
      height: 8px;
    }

    .progress-dot.completed {
      background: var(--success);
    }

    .flashcard-actions {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      width: 100%;
      margin-top: 24px;
    }

    .rate-btn {
      padding: 10px;
      border: 1px solid var(--border-card);
      border-radius: 8px;
      background: var(--bg-card);
      color: var(--text-primary);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .rate-btn.error {
      border-color: var(--error);
      color: var(--error);
    }

    .rate-btn.error:active {
      background: rgba(239, 68, 68, 0.1);
    }

    .rate-btn.warning {
      border-color: var(--warning);
      color: var(--warning);
    }

    .rate-btn.warning:active {
      background: rgba(245, 158, 11, 0.1);
    }

    .rate-btn.success {
      border-color: var(--success);
      color: var(--success);
    }

    .rate-btn.success:active {
      background: rgba(16, 185, 129, 0.1);
    }

    /* Anki-style flashcard enhancements */
    .flashcard-hint {
      fontSize: 12px;
      color: var(--text-secondary);
      margin-top: 8px;
      opacity: 0.6;
      font-size: 12px;
    }

    .flashcard-answer {
      font-size: 16px;
      line-height: 1.6;
    }

    .flashcard-explanation {
      font-size: 12px;
      line-height: 1.45;
      color: var(--text-secondary);
      opacity: 0.38;
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      text-align: center;
      width: 100%;
      font-weight: 400;
    }

    html[data-theme="light"] .flashcard-explanation {
      opacity: 0.42;
      border-top-color: rgba(0, 0, 0, 0.06);
    }

    .flashcards-category-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
      align-items: center;
    }

    .flashcards-category-chips-label {
      font-size: 12px;
      color: var(--text-secondary);
      width: 100%;
      margin-bottom: 2px;
    }

    .fc-cat-chip {
      border: 1px solid rgba(0, 200, 150, 0.28);
      background: rgba(0, 200, 150, 0.06);
      color: var(--text-secondary);
      font-size: 12px;
      font-family: 'DM Sans', sans-serif;
      padding: 6px 12px;
      border-radius: 999px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
    }

    .fc-cat-chip:hover {
      border-color: rgba(0, 200, 150, 0.45);
      color: var(--text-primary);
    }

    .fc-cat-chip.active {
      background: rgba(0, 200, 150, 0.2);
      border-color: var(--mint, #00C896);
      color: #E2E8F0;
      font-weight: 600;
    }

    html[data-theme="light"] .fc-cat-chip.active {
      color: #0f172a;
    }

    .anki-actions {
      margin-top: 16px;
    }

    .anki-actions .rate-btn {
      font-size: 14px;
      font-weight: 700;
      padding: 14px 10px;
      flex-direction: row;
      justify-content: center;
      gap: 8px;
    }

    .rate-shortcut {
      font-size: 10px;
      opacity: 0.5;
      background: rgba(255, 255, 255, 0.08);
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 500;
    }

    /* Quiz keyboard hints */
    .kbd-hint {
      font-size: 10px;
      opacity: 0.5;
      background: rgba(255, 255, 255, 0.08);
      padding: 2px 6px;
      border-radius: 4px;
      margin-left: 8px;
      font-weight: 500;
    }

    .quiz-option-number {
      font-size: 11px;
      font-weight: 600;
      opacity: 0.4;
      min-width: 18px;
      height: 18px;
      border-radius: 4px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.06);
      margin-right: 8px;
      flex-shrink: 0;
    }

    .quiz-action-bar {
      margin-top: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .quiz-action-bar .btn-primary {
      margin-left: 0;
      flex: 1;
    }

    .quiz-report-btn {
      width: auto;
      min-width: 120px;
      min-height: 44px;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.28);
      color: #FCA5A5;
      flex-shrink: 0;
    }

    .quiz-result-actions {
      margin-top: 24px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    .quiz-result-secondary {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      color: var(--text-primary);
    }

    .subject-card-empty {
      opacity: 0.45;
    }

    .subject-card-empty .subject-select-meta {
      font-style: italic;
    }

    .session-complete {
      text-align: center;
      padding: 40px 0;
    }

    .session-icon {
      font-size: 80px;
      margin-bottom: 24px;
      animation: bounce 0.6s ease;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .session-title {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 16px;
    }

    .session-stats {
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 24px;
    }

    .session-stat {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid var(--border-card);
    }

    .session-stat:last-child {
      border-bottom: none;
    }

    .session-stat-label {
      color: var(--text-secondary);
      font-size: 13px;
    }

    .session-stat-value {
      font-size: 18px;
      font-weight: 700;
      color: var(--primary);
    }

    /* Quiz Screen */
    .quiz-header {
      margin-bottom: 24px;
    }

    .quiz-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .quiz-item {
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: 12px;
      padding: 16px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .quiz-item:active {
      background: rgba(0, 200, 150, 0.1);
      border-color: var(--primary);
    }

    .quiz-subject {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 4px;
    }

    .quiz-count {
      font-size: 12px;
      color: var(--text-secondary);
    }

    .quiz-screen {
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .quiz-progress-section {
      margin-bottom: 24px;
    }

    .quiz-progress-bar {
      width: 100%;
      height: 4px;
      background: var(--bg-card);
      border-radius: 2px;
      overflow: hidden;
      margin-bottom: 12px;
    }

    .quiz-progress-fill {
      height: 100%;
      background: var(--primary);
      transition: width 0.3s ease;
    }

    .quiz-counter {
      font-size: 12px;
      color: var(--text-secondary);
    }

    .quiz-question {
      font-size: 18px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .quiz-options {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 24px;
    }

    .quiz-option {
      padding: 14px;
      background: rgba(255,255,255,0.04);
      border: 2px solid rgba(255,255,255,0.14);
      border-radius: 12px;
      color: var(--text-primary);
      cursor: pointer;
      transition: all 0.2s ease;
      font-size: 14px;
      text-align: left;
      line-height: 1.45;
    }

    .quiz-option:active {
      border-color: var(--primary);
    }

    .quiz-option.selected {
      border-color: var(--primary);
      background: rgba(0, 200, 150, 0.1);
    }

    .quiz-option.correct {
      border-color: var(--success);
      background: rgba(16, 185, 129, 0.16);
    }

    .quiz-option.incorrect {
      border-color: rgba(239,68,68,0.48);
      background: rgba(239,68,68,0.16);
      color: #FECACA;
    }

    .quiz-option.incorrect-selected {
      border-color: #EF4444;
      background: rgba(239,68,68,0.24);
      color: #FFFFFF;
      box-shadow: 0 0 0 1px rgba(239,68,68,0.28) inset;
    }

    .quiz-option.crossed-out {
      text-decoration: line-through;
      opacity: 0.35;
      pointer-events: none;
      border-color: var(--border-card);
      background: transparent;
    }

    .quiz-option {
      position: relative;
      padding-right: 44px;
    }

    .cross-btn {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 1px solid var(--border-card);
      background: transparent;
      color: var(--text-secondary);
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      padding: 0;
      min-height: auto;
      text-transform: none;
      letter-spacing: 0;
    }

    .cross-btn:hover {
      border-color: var(--error);
      color: var(--error);
      background: rgba(239, 68, 68, 0.1);
      transform: translateY(-50%);
      box-shadow: none;
    }

    .quiz-feedback {
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 24px;
      font-size: 13px;
      line-height: 1.6;
    }

    .quiz-feedback-title {
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--text-primary);
    }

    .quiz-result-screen {
      text-align: center;
      padding: 40px 0;
    }

    .quiz-score {
      font-size: 72px;
      font-weight: 800;
      color: var(--primary);
      margin-bottom: 16px;
    }

    .quiz-time {
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 32px;
    }

    /* Materials Screen */
    .materials-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .materials-cycle-section {
      margin-bottom: 28px;
      scroll-margin-top: 88px;
    }

    .materials-cycle-header {
      font-family: Outfit, sans-serif;
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text-primary);
      margin: 0 0 6px;
      letter-spacing: -0.02em;
    }

    .materials-cycle-sub {
      font-size: 0.78rem;
      color: var(--text-secondary);
      margin: 0 0 14px;
      line-height: 1.5;
    }

    .materials-cycle-empty {
      font-size: 0.85rem;
      color: var(--text-secondary);
      line-height: 1.55;
      padding: 14px 16px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-subtle);
    }

    .materials-cycle-nav {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 18px;
    }

    .materials-cycle-nav a {
      text-decoration: none;
    }

    .materials-mod-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin-bottom: 14px;
    }

    .materials-mod-chips-label {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-secondary);
      margin-right: 4px;
    }

    .materials-mod-subgroup {
      margin-bottom: 18px;
    }

    .materials-mod-subgroup:last-child {
      margin-bottom: 0;
    }

    .materials-mod-title {
      font-family: 'DM Sans', sans-serif;
      font-size: 0.82rem;
      font-weight: 700;
      color: #00C896;
      margin: 0 0 10px;
      padding-bottom: 6px;
      border-bottom: 1px solid rgba(0, 200, 150, 0.2);
    }

    /* TO Estudos — instrumentais (Materiais) */
    .to-estudos-callout {
      margin-bottom: 20px;
      padding: 16px 18px;
      border-radius: 14px;
      background: linear-gradient(135deg, rgba(55, 65, 81, 0.35), rgba(0, 200, 150, 0.12));
      border: 1px solid rgba(0, 200, 150, 0.22);
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.18);
    }
    .to-estudos-callout h3 {
      font-family: Outfit, sans-serif;
      font-size: 1rem;
      font-weight: 800;
      color: #e5e7eb;
      margin: 0 0 6px;
      letter-spacing: -0.02em;
    }
    .to-estudos-callout p {
      margin: 0 0 14px;
      font-size: 0.82rem;
      color: var(--text-secondary);
      line-height: 1.55;
    }
    .to-estudos-callout-head {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px 10px;
      margin-bottom: 6px;
    }
    .to-estudos-callout-head h3 {
      margin: 0;
    }
    .to-estudos-beta-pill {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.62rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      padding: 3px 8px;
      border-radius: 999px;
      background: rgba(245, 158, 11, 0.18);
      border: 1px solid rgba(245, 158, 11, 0.4);
      color: #fcd34d;
    }
    .to-estudos-beta-banner {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 10px 12px;
      margin-bottom: 14px;
      border-radius: 10px;
      background: rgba(245, 158, 11, 0.07);
      border: 1px solid rgba(245, 158, 11, 0.26);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.76rem;
      color: rgba(253, 230, 138, 0.94);
      line-height: 1.5;
    }
    .to-estudos-beta-banner > span:last-child {
      min-width: 0;
    }
    .to-estudos-callout-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    .to-estudos-callout-actions button {
      flex: 1;
      min-width: 140px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.82rem;
      font-weight: 700;
      padding: 11px 16px;
      border-radius: 10px;
      cursor: pointer;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(15, 23, 42, 0.65);
      color: #e5e7eb;
      transition: background 0.2s, border-color 0.2s, transform 0.15s;
    }
    @media (hover: hover) {
      .to-estudos-callout-actions button:hover {
        background: linear-gradient(135deg, rgba(0, 200, 150, 0.2), rgba(59, 130, 246, 0.16));
        border-color: rgba(0, 200, 150, 0.35);
      }
    }
    .to-estudos-seg {
      display: flex;
      gap: 8px;
      margin-bottom: 18px;
    }
    .to-estudos-seg button {
      flex: 1;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.8rem;
      font-weight: 700;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(255, 255, 255, 0.04);
      color: var(--text-secondary);
      cursor: pointer;
    }
    .to-estudos-seg button.active {
      background: rgba(0, 200, 150, 0.16);
      border-color: rgba(0, 200, 150, 0.35);
      color: #6ee7b7;
    }
    .to-estudos-guide-search {
      width: 100%;
      margin-bottom: 14px;
    }
    .to-estudos-card {
      background: var(--surface-2);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 12px;
      box-shadow: var(--shadow-sm);
    }
    /* Tabuleiro claro: PNGs com transparência leem-se bem; o bloco acompanha o tamanho real da imagem. */
    .to-estudos-card-img-wrap {
      border-radius: 12px;
      overflow: hidden;
      background: #ffffff;
      border: 1px solid rgba(15, 23, 42, 0.1);
      box-shadow:
        0 2px 14px rgba(0, 0, 0, 0.14),
        inset 0 1px 0 rgba(255, 255, 255, 0.85);
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 14px;
      width: fit-content;
      max-width: 100%;
      box-sizing: border-box;
    }
    .to-estudos-card-img-wrap img {
      width: auto;
      height: auto;
      max-width: 100%;
      max-height: min(52vh, 300px);
      object-fit: contain;
      display: block;
      vertical-align: bottom;
    }
    html[data-theme="light"] .to-estudos-card-img-wrap {
      border: 1px solid rgba(15, 23, 42, 0.14);

    /* Light mode: doc gets a paper feel */

    }
    html[data-theme="light"] .markdown-body h2 { color: var(--mint, #00C896) !important; }
    html[data-theme="light"] .markdown-body h3 { color: #0284C7 !important; }
    html[data-theme="light"] .markdown-body h4 { color: #0369A1 !important; }
    html[data-theme="light"] .markdown-body p { color: #334155; }
    html[data-theme="light"] .markdown-body strong { color: #000000 !important; font-weight: 700 !important; }
    html[data-theme="light"] .markdown-body em { color: #475569 !important; }
    html[data-theme="light"] .markdown-body ul li::marker { color: var(--mint) !important; }
    html[data-theme="light"] .markdown-body ol li::marker { color: var(--mint) !important; }
    html[data-theme="light"] .markdown-body blockquote {
      border-left-color: var(--mint) !important;
      background: rgba(0,200,150,0.06) !important;

    }
    html[data-theme="light"] .markdown-body code {
      background: rgba(0,200,150,0.08) !important;
