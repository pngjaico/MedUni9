                  {viewAll && (
                    <div className="semester-group-header">Módulo {sem}</div>

                    const reviewedCount = materiaCards.filter(f => srData[f.id]).length;
                    const pct = materiaCards.length > 0 ? Math.round((reviewedCount / materiaCards.length) * 100) : 0;
                    const subjectColor = SUBJECT_ICON_MAP[materia.id]?.color || materia.cor || 'var(--primary)';

                      <div
                        key={materia.id}
                        className="subject-select-card"
                        onClick={() => onSelectMateria(materia.id)}

                          {materiaCards.length > 0 && (
                            <div className="subject-progress-bar">
                              <div className="subject-progress-fill" style={{ width: `${pct}%`, background: subjectColor }} />
                            </div>
                          )}
                        </div>
                        <div style={{ color: 'var(--text-secondary)' }}>
                          <IconChevronRight />
                        </div>
                      </div>
                    );
                  })}
                </React.Fragment>
              ))}

              {displayMaterias.length === 0 && (
                <div style={{ textAlign: 'center', padding: '40px 0', color: 'var(--text-secondary)' }}>
                  <p>Nenhuma disciplina para o Módulo {userSemester} ainda.</p>
                  <button className="btn btn-secondary mt-2" onClick={() => setViewAll(true)}>
                    Ver todas as disciplinas
                  </button>
                </div>
              )}
            </div>
            </div>
          </div>
        </>
      );
    };

    const FC_CATEGORY_LABELS = {
      definicao: 'Definição',
      mecanismo: 'Mecanismo',
      clinica: 'Clínica',
      diferenciacao: 'Diferenciação',
      prova: 'Prova',
      extra_livro: 'Extra (livro)',
    };
    const FC_CATEGORY_ORDER = ['definicao', 'mecanismo', 'clinica', 'diferenciacao', 'prova', 'extra_livro'];
    const CLOZE_REGEX_GLOBAL = /\{\{c\d+::([^}|]+)(?:\|[^}]+)?\}\}/g;
    const CLOZE_REGEX_SINGLE = /\{\{c\d+::([^}|]+)(?:\|[^}]+)?\}\}/;

    function parseCloze(text) {
      if (typeof text !== 'string' || !text.trim()) return null;
      const matches = [...text.matchAll(CLOZE_REGEX_GLOBAL)];
      if (!matches.length) return null;
      const answers = matches.map((m) => (m[1] || '').trim()).filter(Boolean);
      const frontMasked = text.replace(CLOZE_REGEX_GLOBAL, '_____');
      return {
        frontMasked,
        answers,
      };
    }

    // Flashcards Screen
    const FlashcardsScreen = ({ flashcards, materias, selectedMateria, onSelectMateria, userSemester, initialAulaId }) => {
      const [currentIndex, setCurrentIndex] = useState(0);
      const [isFlipped, setIsFlipped] = useState(false);
      const [sessionComplete, setSessionComplete] = useState(false);
      const [sessionStats, setSessionStats] = useState({ correct: 0, total: 0 });
      const [semesterFilter, setSemesterFilter] = useState(userSemester || null);
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedTemas, setSelectedTemas] = useState([]);
      const [selectedCategorias, setSelectedCategorias] = useState([]);
      const [studying, setStudying] = useState(false);
      const [sessionDeck, setSessionDeck] = useState([]);
      const [srTick, setSrTick] = useState(0);
      const [reportFlashOpen, setReportFlashOpen] = useState(false);
      const [reportFlashReason, setReportFlashReason] = useState('');
      const [reportFlashSending, setReportFlashSending] = useState(false);
      const [reportFlashError, setReportFlashError] = useState('');
      const [reportFlashTarget, setReportFlashTarget] = useState(null);
      const routeAulaAppliedRef = useRef(false);
      const srData = useMemo(() => JSON.parse(localStorage.getItem('meduni9_sr_data') || '{}'), [srTick]);

      useEffect(() => {
        setCurrentIndex(0);
        setIsFlipped(false);
        setSessionComplete(false);
        setSessionStats({ correct: 0, total: 0 });
        setStudying(false);
        setSelectedTemas([]);
        setSelectedCategorias([]);
        setSessionDeck([]);
        routeAulaAppliedRef.current = false;
      }, [selectedMateria]);

      useEffect(() => {
        if (!selectedMateria) routeAulaAppliedRef.current = false;
      }, [selectedMateria]);

      useEffect(() => {
        routeAulaAppliedRef.current = false;
      }, [initialAulaId]);

      const pureFlashcards = useMemo(() => flashcards.filter(f => f.tipo !== 'quiz'), [flashcards]);

      const filteredByMateria = useMemo(
        () => pureFlashcards.filter(f => !selectedMateria || f.materia === selectedMateria),
        [pureFlashcards, selectedMateria]
      );

      useEffect(() => {
        if (routeAulaAppliedRef.current || !initialAulaId || !selectedMateria) return;
        const ok = pureFlashcards.some(f => f.materia === selectedMateria && f.tema === initialAulaId);
        if (ok) {
          const temaCards = pureFlashcards.filter(
            (f) => f.materia === selectedMateria && f.tema === initialAulaId && !srData[f.id]?.buried
          );
          const due = SM2.getDueCards(temaCards, srData);
          const autoDeck = due.length > 0 ? due : [...temaCards].sort(() => Math.random() - 0.5);
          setSelectedTemas([initialAulaId]);
          setSessionDeck(autoDeck);
          setCurrentIndex(0);
          setIsFlipped(false);
          setSessionComplete(false);
          setSessionStats({ correct: 0, total: 0 });
          setStudying(true);
          routeAulaAppliedRef.current = true;
        }
      }, [initialAulaId, selectedMateria, pureFlashcards, srData]);

      const filtered = useMemo(() => {
        let pool = filteredByMateria.filter((f) => !srData[f.id]?.buried);
        if (selectedTemas.length > 0) pool = pool.filter((f) => selectedTemas.includes(f.tema));
        if (selectedCategorias.length > 0) pool = pool.filter((f) => f.categoria && selectedCategorias.includes(f.categoria));
        return pool;
      }, [filteredByMateria, selectedTemas, selectedCategorias, srData]);

      const availableCategories = useMemo(() => {
        const set = new Set();
        filteredByMateria.forEach((f) => {
          if (f.categoria) set.add(f.categoria);
        });
        return FC_CATEGORY_ORDER.filter((c) => set.has(c));
      }, [filteredByMateria]);

      const toggleCategoria = (cat) => {
        setSelectedCategorias((prev) =>
          prev.includes(cat) ? prev.filter((c) => c !== cat) : [...prev, cat]
        );
      };

      const buildDeck = useCallback(
        (cards) => {
          const due = SM2.getDueCards(cards, srData);
          if (due.length > 0) return due;
          return [...cards].sort(() => Math.random() - 0.5);
        },
        [srData]
      );

      const deck = useMemo(() => {
        if (!selectedMateria) return [];
        return buildDeck(filtered);
      }, [selectedMateria, filtered, buildDeck]);

      const currentCard = sessionDeck[currentIndex];
      const currentCardCloze = parseCloze(currentCard?.pergunta);

      const handleRate = useCallback((quality) => {
        const card = currentCard;
        if (!card) return;
        const raw = JSON.parse(localStorage.getItem('meduni9_sr_data') || '{}');
        const prev = normalizeSrEntry(raw[card.id]) || { reps: 0, ef: 2.5, interval: 0, nextReview: Date.now() };
        const result = SM2.calculateNextReview(quality, prev.reps, prev.ef, prev.interval);
        raw[card.id] = {
          reps: result.reps,
          ef: result.ef,
          interval: result.interval,
          nextReview: result.nextReview,
          buried: false,
        };
        localStorage.setItem('meduni9_sr_data', JSON.stringify(raw));
        setSrTick((t) => t + 1);

        const isGood = quality >= 3;
        const newStats = { ...sessionStats, total: sessionStats.total + 1, correct: sessionStats.correct + (isGood ? 1 : 0) };

        if (currentIndex < sessionDeck.length - 1) {
          setCurrentIndex(currentIndex + 1);
          setIsFlipped(false);
          setSessionStats(newStats);
        } else {
          setSessionStats(newStats);
          setSessionComplete(true);
        }
      }, [currentCard, currentIndex, sessionDeck, sessionStats]);

      const handleDeNovo = useCallback(() => {
        const card = currentCard;
        if (!card) return;
        const remaining = sessionDeck.length - currentIndex - 1;
        if (remaining > 0) {
          const newDeck = [
            ...sessionDeck.slice(0, currentIndex),
            ...sessionDeck.slice(currentIndex + 1),
            card,
          ];
          setSessionDeck(newDeck);
          setIsFlipped(false);
        } else {
          handleRate(1);
        }
      }, [currentCard, currentIndex, sessionDeck, handleRate]);

      const handleBury = () => {
        const card = currentCard;
        if (!card) return;
        const raw = JSON.parse(localStorage.getItem('meduni9_sr_data') || '{}');
        const prev = normalizeSrEntry(raw[card.id]) || { reps: 0, ef: 2.5, interval: 0, nextReview: Date.now() };
        raw[card.id] = { ...prev, buried: true };
        localStorage.setItem('meduni9_sr_data', JSON.stringify(raw));
        setSrTick((t) => t + 1);
        if (currentIndex < sessionDeck.length - 1) {
          setCurrentIndex(currentIndex + 1);
          setIsFlipped(false);
        } else {
          setSessionComplete(true);
        }
      };

      useEffect(() => {
        if (!studying || sessionComplete) return;
        const handleKey = (e) => {
          if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
          if (!isFlipped) {
            if (e.code === 'Space' || e.key === ' ') {
              e.preventDefault();
              setIsFlipped(true);
            }
          } else {
            if (e.key === '1') handleDeNovo();
            else if (e.key === '2') handleRate(5);
            else if (e.key === '3') handleRate(3);
            else if (e.key === '4') handleRate(2);
            else if (e.code === 'Space' || e.key === ' ') {
              e.preventDefault();
              setIsFlipped(false);
            }
          }
        };
        window.addEventListener('keydown', handleKey);
        return () => window.removeEventListener('keydown', handleKey);
      }, [studying, sessionComplete, isFlipped, currentIndex, handleRate, handleDeNovo]);

      const handleReport = () => {
        const card = currentCard;
        if (!card) return;
        setReportFlashTarget(card);
        setReportFlashReason('');
        setReportFlashError('');
        setReportFlashOpen(true);
      };

      const submitFlashReport = async () => {
        if (!reportFlashTarget) return;
        setReportFlashSending(true);
        setReportFlashError('');
        try {
          await submitContentFeedback({
            origem: 'flashcards',
            mensagem: reportFlashReason?.trim() || 'Erro reportado em flashcard',
            itemId: reportFlashTarget.id,
            materia: reportFlashTarget.materia,
            tema: reportFlashTarget.tema,
            contexto: {
              pergunta: reportFlashTarget.pergunta,
              resposta: reportFlashTarget.resposta,
              explicacao: reportFlashTarget.explicacao || ''
            }
          });
          setReportFlashOpen(false);
          setReportFlashTarget(null);
        } catch (e) {
          setReportFlashError('Nao foi possivel enviar agora. Tente novamente em instantes.');
        } finally {
          setReportFlashSending(false);
        }
      };

      const resetSession = () => {
        setCurrentIndex(0);
        setIsFlipped(false);
        setSessionComplete(false);
        setSessionStats({ correct: 0, total: 0 });
        setStudying(false);
        setSelectedTemas([]);
        setSelectedCategorias([]);
        setSessionDeck([]);
      };

      const toggleTema = (temaId) => {
        setSelectedTemas(prev =>
          prev.includes(temaId) ? prev.filter(t => t !== temaId) : [...prev, temaId]
        );
      };

      // Materia selection screen
      if (!selectedMateria) {
        const allMaterias = materias.filter(m => m.ativo !== false);
        const semFiltered = semesterFilter ? allMaterias.filter(m => m.modulo === semesterFilter) : allMaterias;
        const filteredMaterias = semFiltered.filter(m => fuzzyMatch(searchQuery, m.nome) || fuzzyMatch(searchQuery, m.sigla || ''));
        const semesters = [...new Set(allMaterias.map(m => m.modulo))].sort((a,b) => a-b);

        return (
          <>
            <div className="screen-content">
              <h2 className="section-title">Flashcards</h2>
              {semesters.length > 1 && (
                <div className="semester-tabs">
                  <button className={`semester-tab ${!semesterFilter ? 'active' : ''}`} onClick={() => setSemesterFilter(null)}>Todos</button>
                  {semesters.map(s => (
                    <button key={s} className={`semester-tab ${semesterFilter === s ? 'active' : ''}`} onClick={() => setSemesterFilter(s)}>Módulo {s}</button>
                  ))}
                </div>
              )}
              <div className="subject-search-wrap">
                <span className="subject-search-icon"><IconSearch /></span>
                <input type="search" className="subject-search" placeholder="Buscar matéria..." value={searchQuery} onChange={e => setSearchQuery(e.target.value)} />
              </div>
              <div className="subject-select-list">
                {filteredMaterias.length === 0 && (
                  <div style={{ textAlign: 'center', padding: '40px 0', color: 'var(--text-secondary)' }}><p>Nenhum resultado encontrado.</p></div>
                )}
                {filteredMaterias.map(m => {
                  const count = pureFlashcards.filter(f => f.materia === m.id).length;
                  const dueCount = SM2.getDueCards(pureFlashcards.filter(f => f.materia === m.id), srData).length;
                  const reviewedCount = count - dueCount;
                  const pct = count > 0 ? Math.round((reviewedCount / count) * 100) : 0;
                  const subjectColor = SUBJECT_ICON_MAP[m.id]?.color || m.cor || 'var(--primary)';
                  return (
                    <div key={m.id} className={`subject-select-card${count === 0 ? ' subject-card-empty' : ''}`} onClick={() => { onSelectMateria(m.id); setStudying(false); }}>
                      <SubjectIcon materiaId={m.id} icon={m.icon} cor={m.cor} />
                      <div className="subject-select-info">
                        <div className="subject-select-name">{m.sigla || m.nome}</div>
                        <div className="subject-select-meta">
                          {count > 0 ? `${count} cards${dueCount > 0 ? ` — ${dueCount} para revisar` : ' — em dia ✓'}` : 'Em breve'}
                        </div>
                        {count > 0 && (
                          <div className="subject-progress-bar">
                            <div className="subject-progress-fill" style={{ width: `${pct}%`, background: subjectColor }} />
                          </div>
                        )}
                      </div>
                      <div style={{ color: 'var(--text-secondary)' }}><IconChevronRight /></div>
                    </div>
                  );
                })}
              </div>
            </div>
          </>
        );
      }

      const selectedMateriaObj = materias.find(m => m.id === selectedMateria);
      const backLabel = selectedMateriaObj ? (selectedMateriaObj.sigla || selectedMateriaObj.nome) : 'Flashcards';

      // Tema selector
      if (!studying) {
        const totalCards = filteredByMateria.length;
        const dueTotal = SM2.getDueCards(filteredByMateria, srData).length;
        const materiaObj = materias.find(m => m.id === selectedMateria);
        const temasFromCards = [...new Set(filteredByMateria.map(f => f.tema).filter(Boolean))];

        // Use aulas from materias.json for organized display
        const aulas = materiaObj?.aulas || [];
        const hasAulas = aulas.length > 0;

        return (
          <>
            <div className="screen-content">
              <button className="back-btn" onClick={() => onSelectMateria(null)}>← Flashcards</button>
              <h2 className="section-title">{backLabel}</h2>
              <p style={{ color: 'var(--text-secondary)', fontSize: '14px', marginBottom: '16px' }}>
                {totalCards > 0 ? (dueTotal > 0 ? `${dueTotal} cards para revisar hoje` : 'Todos os cards em dia!') : 'Nenhum flashcard ainda'} — {totalCards} total
              </p>
              {totalCards > 0 && availableCategories.length > 0 && (
                <div className="flashcards-category-chips">
                  <span className="flashcards-category-chips-label">Categoria</span>
                  <button
                    type="button"
                    className={'fc-cat-chip' + (selectedCategorias.length === 0 ? ' active' : '')}
                    onClick={() => setSelectedCategorias([])}
                  >
                    Todas
                  </button>
                  {availableCategories.map((cat) => (
                    <button
                      key={cat}
                      type="button"
                      className={'fc-cat-chip' + (selectedCategorias.includes(cat) ? ' active' : '')}
                      onClick={() => toggleCategoria(cat)}
                    >
                      {FC_CATEGORY_LABELS[cat] || cat}
                    </button>
                  ))}
                </div>
              )}
              <div className="subject-select-list" style={{ paddingBottom: selectedTemas.length > 0 ? '72px' : '0' }}>
                <div className="subject-select-card" onClick={() => {
                  let pool = filteredByMateria.filter(f => !srData[f.id]?.buried);
                  if (selectedCategorias.length > 0) pool = pool.filter(f => f.categoria && selectedCategorias.includes(f.categoria));
                  setSelectedTemas([]);
                  setSessionDeck(buildDeck(pool));
                  setStudying(true);
                }}
                  style={{ borderColor: 'var(--primary)', background: 'rgba(0,200,150,0.06)', marginBottom: '8px' }}>
                  <div className="subject-select-icon" style={{ background: 'rgba(0,200,150,0.15)', color: 'var(--primary)' }}><IconBookOpen /></div>
                  <div className="subject-select-info">
                    <div className="subject-select-name">Todos os assuntos</div>
                    <div className="subject-select-meta">{totalCards} cards{dueTotal > 0 ? ` — ${dueTotal} para revisar` : ''}</div>
                  </div>
                  <div style={{ color: 'var(--primary)' }}><IconChevronRight /></div>
                </div>

                {hasAulas ? (
                  aulas.map(aula => {
                    const cards = filteredByMateria.filter(f => f.tema === aula.id);
                    const dueCount = SM2.getDueCards(cards, srData).length;
                    const isChecked = selectedTemas.includes(aula.id);
                    const hasCards = cards.length > 0;
                    return (
                      <div key={aula.id} className={`subject-select-card${isChecked ? ' tema-selected' : ''}${!hasCards ? ' subject-card-empty' : ''}`} onClick={() => hasCards && toggleTema(aula.id)}>
                        <div className={`tema-checkbox${isChecked ? ' tema-checkbox-checked' : ''}`}>{isChecked ? '✓' : ''}</div>
                        <div className="subject-select-info">
                          <div className="subject-select-name">{aula.tema}</div>
                          <div className="subject-select-meta">{hasCards ? `${cards.length} cards${dueCount > 0 ? ` — ${dueCount} para revisar` : ' — em dia'}` : 'Em breve'}</div>
                        </div>
                      </div>
                    );
                  })
                ) : (
                  temasFromCards.sort().map(tema => {
                    const count = filteredByMateria.filter(f => f.tema === tema).length;
                    const dueCount = SM2.getDueCards(filteredByMateria.filter(f => f.tema === tema), srData).length;
                    const isChecked = selectedTemas.includes(tema);
                    return (
                      <div key={tema} className={`subject-select-card${isChecked ? ' tema-selected' : ''}`} onClick={() => toggleTema(tema)}>
                        <div className={`tema-checkbox${isChecked ? ' tema-checkbox-checked' : ''}`}>{isChecked ? '✓' : ''}</div>
                        <div className="subject-select-info">
                          <div className="subject-select-name">{tema}</div>
                          <div className="subject-select-meta">{count} cards{dueCount > 0 ? ` — ${dueCount} para revisar` : ' — em dia'}</div>
                        </div>
                      </div>
                    );
                  })
                )}
              </div>

              {selectedTemas.length > 0 && (
                <div className="tema-start-bar">
                  <span style={{ color: 'var(--text-secondary)', fontSize: '13px' }}>
                    {selectedTemas.length} assunto{selectedTemas.length > 1 ? 's' : ''} selecionado{selectedTemas.length > 1 ? 's' : ''}
                  </span>
                  <button className="btn btn-primary" style={{ padding: '8px 20px', fontSize: '14px' }} onClick={() => { setSessionDeck(buildDeck(filtered)); setStudying(true); }}>
                    Iniciar estudo →
                  </button>
                </div>
              )}
            </div>
          </>
        );
      }

      // Session complete
      if (sessionComplete) {
        return (
          <>
            <div className="screen-content">
              <div className="session-complete">
                <div className="session-icon">🎉</div>
                <h2 className="session-title">Sessão Concluída!</h2>
                <div className="session-stats">
                  <div className="session-stat">
                    <span className="session-stat-label">Cards Revisados</span>
                    <span className="session-stat-value">{sessionStats.total}</span>
                  </div>
                  <div className="session-stat">
                    <span className="session-stat-label">Acertos</span>
                    <span className="session-stat-value">{sessionStats.correct}</span>
                  </div>
                  <div className="session-stat">
                    <span className="session-stat-label">Taxa de Acerto</span>
                    <span className="session-stat-value">
                      {Math.round((sessionStats.correct / Math.max(sessionStats.total, 1)) * 100)}%
                    </span>
                  </div>
                </div>
                <button className="btn btn-primary" onClick={resetSession}>Nova Sessão</button>
                <button className="btn btn-secondary mt-2" onClick={() => { setStudying(false); setSelectedTemas([]); }}>Escolher outro assunto</button>
              </div>
            </div>
          </>
        );
      }

      // No cards
      if (deck.length === 0) {
        const hasAnyCards = filteredByMateria.length > 0;
        return (
          <>
            <div className="screen-content">
              <button className="back-btn" onClick={() => setStudying(false)}>← {backLabel}</button>
              <div style={{ textAlign: 'center', marginTop: '60px' }}>
                <div style={{ fontSize: '60px', marginBottom: '20px' }}>{hasAnyCards ? '✨' : '🚧'}</div>
                <p style={{ color: 'var(--text-secondary)', marginBottom: '20px' }}>
                  {hasAnyCards ? 'Nenhum card para revisar agora!' : 'Flashcards em breve para esta matéria.'}
                </p>
                {hasAnyCards && <p style={{ color: 'var(--text-secondary)', fontSize: '13px' }}>Todos os cards estão em dia. Volte mais tarde.</p>}
                <button className="btn btn-secondary mt-2" style={{ marginTop: '20px' }} onClick={() => setStudying(false)}>Voltar</button>
              </div>
            </div>
          </>
        );
      }

      // Anki-style flashcard study session
      return (
        <>
          <div className="screen-content">
            <button className="back-btn" onClick={() => setStudying(false)}>← {backLabel}</button>

            <div className="flashcard-progress" style={{ marginBottom: '16px' }}>
              <div style={{ textAlign: 'center', fontSize: '13px', color: 'var(--text-secondary)', marginBottom: '8px' }}>
                {currentIndex + 1} de {sessionDeck.length}
              </div>
              <div className="progress-dots">
                {sessionDeck.slice(0, Math.min(sessionDeck.length, 30)).map((card, idx) => (
                  <div key={idx} className={`progress-dot ${idx === currentIndex ? 'current' : ''} ${idx < currentIndex ? 'completed' : ''}`}></div>
                ))}
                {sessionDeck.length > 30 && <span style={{ color: 'var(--text-secondary)', fontSize: '11px' }}>+{sessionDeck.length - 30}</span>}
              </div>
            </div>

            <div className="flashcard-container">
              <div className="flashcard" onClick={() => setIsFlipped(!isFlipped)} style={{ cursor: 'pointer' }}>
                <div className={`flashcard-inner ${isFlipped ? 'flipped' : ''}`}>
                  <div className="flashcard-front">
                    <div className="flashcard-label">{currentCardCloze ? 'Lacuna' : 'Pergunta'}</div>
                    <div className="flashcard-text">
                      {currentCardCloze?.frontMasked || currentCard.pergunta}
                    </div>
                    <div className="flashcard-hint">Espaço para virar</div>
                  </div>
                  <div className="flashcard-back">
                    <div className="flashcard-label">Resposta</div>
                    <div className="flashcard-text flashcard-answer">{currentCard.resposta}</div>
                    {currentCard.explicacao && (
                      <div className="flashcard-explanation">{currentCard.explicacao}</div>
                    )}
                  </div>
                </div>
              </div>
            </div>

            {isFlipped && (
              <div style={{ marginTop: '20px' }}>
                {/* Utility row: bury + report */}
                <div style={{ display: 'flex', justifyContent: 'center', gap: '20px', marginBottom: '14px' }}>
                  <button
                    onClick={handleBury}
                    title="Enterrar este card"
                    style={{ background: 'none', border: 'none', color: 'var(--text-secondary)', cursor: 'pointer', fontSize: '17px', lineHeight: 1, padding: '4px', opacity: 0.5, transition: 'opacity 0.15s' }}
                    onMouseEnter={e => e.currentTarget.style.opacity = '1'}
                    onMouseLeave={e => e.currentTarget.style.opacity = '0.5'}
                  >✕</button>
                  <button
                    onClick={handleReport}
                    title="Reportar erro neste card"
                    style={{ background: 'none', border: 'none', color: '#EF4444', cursor: 'pointer', fontSize: '15px', lineHeight: 1, padding: '4px', opacity: 0.72, transition: 'opacity 0.15s' }}
                    onMouseEnter={e => e.currentTarget.style.opacity = '1'}
                    onMouseLeave={e => e.currentTarget.style.opacity = '0.72'}
                  ><IconMessageSquare /></button>
                </div>
                {/* Rating buttons — no container box */}
                <div style={{ display: 'flex', gap: '8px', justifyContent: 'center' }}>
                  <button
                    onClick={handleDeNovo}
                    style={{ flex: 1, maxWidth: '90px', padding: '10px 4px', borderRadius: '10px', border: 'none', background: 'rgba(239,68,68,0.15)', color: '#f87171', fontFamily: 'Outfit', fontWeight: 700, fontSize: '13px', cursor: 'pointer', transition: 'background 0.15s' }}
                    onMouseEnter={e => e.currentTarget.style.background = 'rgba(239,68,68,0.28)'}
                    onMouseLeave={e => e.currentTarget.style.background = 'rgba(239,68,68,0.15)'}
                  >
                    <div>De Novo</div>
                    <div style={{ fontSize: '10px', opacity: 0.7, fontWeight: 400, marginTop: '2px' }}>1</div>
                  </button>
                  <button
                    onClick={() => handleRate(5)}
                    style={{ flex: 1, maxWidth: '90px', padding: '10px 4px', borderRadius: '10px', border: 'none', background: 'rgba(0,200,150,0.15)', color: '#00C896', fontFamily: 'Outfit', fontWeight: 700, fontSize: '13px', cursor: 'pointer', transition: 'background 0.15s' }}
                    onMouseEnter={e => e.currentTarget.style.background = 'rgba(0,200,150,0.28)'}
                    onMouseLeave={e => e.currentTarget.style.background = 'rgba(0,200,150,0.15)'}
                  >
                    <div>Fácil</div>
                    <div style={{ fontSize: '10px', opacity: 0.7, fontWeight: 400, marginTop: '2px' }}>2</div>
                  </button>
                  <button
                    onClick={() => handleRate(3)}
                    style={{ flex: 1, maxWidth: '90px', padding: '10px 4px', borderRadius: '10px', border: 'none', background: 'rgba(234,179,8,0.15)', color: '#fbbf24', fontFamily: 'Outfit', fontWeight: 700, fontSize: '13px', cursor: 'pointer', transition: 'background 0.15s' }}
                    onMouseEnter={e => e.currentTarget.style.background = 'rgba(234,179,8,0.28)'}
                    onMouseLeave={e => e.currentTarget.style.background = 'rgba(234,179,8,0.15)'}
                  >
                    <div>Médio</div>
                    <div style={{ fontSize: '10px', opacity: 0.7, fontWeight: 400, marginTop: '2px' }}>3</div>
                  </button>
                  <button
                    onClick={() => handleRate(2)}
                    style={{ flex: 1, maxWidth: '90px', padding: '10px 4px', borderRadius: '10px', border: 'none', background: 'rgba(249,115,22,0.15)', color: '#fb923c', fontFamily: 'Outfit', fontWeight: 700, fontSize: '13px', cursor: 'pointer', transition: 'background 0.15s' }}
                    onMouseEnter={e => e.currentTarget.style.background = 'rgba(249,115,22,0.28)'}
                    onMouseLeave={e => e.currentTarget.style.background = 'rgba(249,115,22,0.15)'}
                  >
                    <div>Difícil</div>
                    <div style={{ fontSize: '10px', opacity: 0.7, fontWeight: 400, marginTop: '2px' }}>4</div>
                  </button>
                </div>
              </div>
            )}

            {!isFlipped && (
              <div style={{ textAlign: 'center', marginTop: '16px' }}>
                <button className="btn btn-primary" onClick={() => setIsFlipped(true)} style={{ padding: '12px 32px' }}>
                  Mostrar Resposta
                </button>
              </div>
            )}
          </div>
          <ContentReportModal
            open={reportFlashOpen}
            title="Reportar flashcard"
            subtitle="Conte para a equipe o que está inconsistente neste card."
            reason={reportFlashReason}
            setReason={setReportFlashReason}
            sending={reportFlashSending}
            errorMsg={reportFlashError}
            onClose={() => { if (!reportFlashSending) { setReportFlashOpen(false); setReportFlashTarget(null); } }}
            onSubmit={submitFlashReport}
          />
        </>
      );
    };

    // Quiz Screen
    const QuizScreen = ({ flashcards, materias, selectedMateria, onSelectMateria, userSemester, initialAulaId, title = "Questões" }) => {
      const QUIZ_PROGRESS_KEY = 'meduni9_quiz_progress';
      const [activeQuiz, setActiveQuiz] = useState(null);
      const [activeTemas, setActiveTemas] = useState([]);
      const [showTemaSelector, setShowTemaSelector] = useState(false);
      const [pendingQuiz, setPendingQuiz] = useState(null);
      const [pendingTemas, setPendingTemas] = useState([]);
      const [pendingTemaSearch, setPendingTemaSearch] = useState('');
      const [currentQuestion, setCurrentQuestion] = useState(0);
      const [selectedOption, setSelectedOption] = useState(null);
      const [crossedOut, setCrossedOut] = useState(new Set());
      const [answered, setAnswered] = useState(false);
      const [quizStats, setQuizStats] = useState({ correct: 0, total: 0 });
      const [startTime, setStartTime] = useState(Date.now());
      const [quizComplete, setQuizComplete] = useState(false);
      const [answerResults, setAnswerResults] = useState({});
      const [reviewQuestionIds, setReviewQuestionIds] = useState([]);
      const [semesterFilter, setSemesterFilter] = useState(userSemester || null);
      const [searchQuery, setSearchQuery] = useState('');
      const [showCadernoErros, setShowCadernoErros] = useState(false);
      const [reportQuizOpen, setReportQuizOpen] = useState(false);
      const [reportQuizReason, setReportQuizReason] = useState('');
      const [reportQuizSending, setReportQuizSending] = useState(false);
      const [reportQuizError, setReportQuizError] = useState('');
      const [reportQuizTarget, setReportQuizTarget] = useState(null);
      const quizRouteAulaAppliedRef = useRef(false);
      const highlighterRef = useRef(null);

      // Highlight logic for Quiz
      useEffect(() => {
        if (!highlighterRef.current) return;
        return setupHighlighter(highlighterRef.current);
      }, [currentQuestion, activeQuiz, showCadernoErros, reviewQuestionIds, quizComplete]);

      // Caderno de erros — localStorage
      const getErros = () => JSON.parse(localStorage.getItem('meduni9_caderno_erros') || '[]');
      const addErro = (questionId) => {
        const erros = getErros();
        if (!erros.includes(questionId)) {
          erros.push(questionId);
          localStorage.setItem('meduni9_caderno_erros', JSON.stringify(erros));
        }
      };
      const removeErro = (questionId) => {
        const erros = getErros().filter(id => id !== questionId);
        localStorage.setItem('meduni9_caderno_erros', JSON.stringify(erros));
      };
      const clearErros = () => localStorage.setItem('meduni9_caderno_erros', '[]');
      const getQuizProgress = () => JSON.parse(localStorage.getItem(QUIZ_PROGRESS_KEY) || '{}');
      const markQuizAsDone = (questionId, correct) => {
        if (questionId == null) return;
        const map = getQuizProgress();
        const key = String(questionId);
        const prev = map[key] || { attempts: 0, correctAttempts: 0, done: false };
        map[key] = {
          ...prev,
          done: true,
          attempts: (prev.attempts || 0) + 1,
          correctAttempts: (prev.correctAttempts || 0) + (correct ? 1 : 0),
          lastAnsweredAt: Date.now(),
          lastResult: correct ? 'correct' : 'wrong'
        };
        localStorage.setItem(QUIZ_PROGRESS_KEY, JSON.stringify(map));
      };

      const quizQuestions = useMemo(() => {
        return flashcards.filter(f => f.tipo === 'quiz' && f.opcoes && f.opcoes.length > 0);
      }, [flashcards]);

      const quizzes = useMemo(() => {
        const grouped = {};
        materias.filter(m => m.ativo !== false).forEach(m => {
          const questions = quizQuestions.filter(f => f.materia === m.id);
          grouped[m.id] = { name: m.nome, sigla: m.sigla, cards: questions, icon: m.icon, semestre: m.modulo, ativo: m.ativo, cor: m.cor };
        });
        return grouped;
      }, [quizQuestions, materias]);

      const materiasById = useMemo(() => {
        const map = {};
        (materias || []).forEach((m) => { map[m.id] = m; });
        return map;
      }, [materias]);

      const getTemaDisplayName = (materiaId, temaId) => {
        if (!temaId) return '';
        const materia = materiasById[materiaId];
        const aulas = Array.isArray(materia?.aulas) ? materia.aulas : [];
        const aula = aulas.find(a => a.id === temaId);
        return aula?.tema || temaId;
      };

      const filteredQuizzes = useMemo(() => {
        let result = { ...quizzes };
        if (semesterFilter) {
          const f = {};
          Object.entries(result).forEach(([id, q]) => {
            if (q.semestre === semesterFilter && q.ativo !== false) f[id] = q;
          });
          result = f;
        }
        if (searchQuery) {
          const f = {};
          Object.entries(result).forEach(([id, q]) => {
            if (fuzzyMatch(searchQuery, q.name) || fuzzyMatch(searchQuery, q.sigla || '')) f[id] = q;
          });
          result = f;
        }
        return result;
      }, [quizzes, semesterFilter, searchQuery]);

      // Keyboard shortcuts for quiz
      useEffect(() => {
        if (!activeQuiz || quizComplete) return;
        const handleKey = (e) => {
          if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
          const activeCards = getActiveCards();
          const card = activeCards[currentQuestion];
          if (!card) return;

          if (!answered) {
            // 1-5 select option
            const num = parseInt(e.key);
            if (num >= 1 && num <= card.opcoes.length && !crossedOut.has(num - 1)) {
              setSelectedOption(num - 1);
            }
            // Enter = confirm
            if (e.key === 'Enter' && selectedOption !== null) {
              e.preventDefault();
              handleAnswer();
            }
          } else {
            // Enter or Space = next question
            if (e.key === 'Enter' || e.code === 'Space') {
              e.preventDefault();
              handleNextQuestion();
            }
          }
        };
        window.addEventListener('keydown', handleKey);
        return () => window.removeEventListener('keydown', handleKey);
      }, [activeQuiz, quizComplete, answered, selectedOption, currentQuestion, crossedOut]);

      const handleQuizStart = (materiaId, temasArray) => {
        setActiveQuiz(materiaId);
        setActiveTemas(temasArray || []);
        setReviewQuestionIds([]);
        setPendingTemaSearch('');
        setCurrentQuestion(0);
        setSelectedOption(null);
        setCrossedOut(new Set());
        setAnswered(false);
        setQuizStats({ correct: 0, total: 0 });
        setAnswerResults({});
        setStartTime(Date.now());
        setShowTemaSelector(false);
        setPendingQuiz(null);
        setPendingTemas([]);
        setQuizComplete(false);
      };

      const handleMateriaClick = (materiaId) => {
        onSelectMateria(materiaId);
        const cards = quizzes[materiaId]?.cards || [];
        if (cards.length === 0) {
          handleQuizStart(materiaId, []);
          return;
        }
        const temas = [...new Set(cards.map(c => c.tema).filter(Boolean))];
        if (temas.length > 1) {
          setPendingQuiz(materiaId);
          setPendingTemas([]);
          setPendingTemaSearch('');
          setShowTemaSelector(true);
        } else {
          handleQuizStart(materiaId, []);
        }
      };

      useEffect(() => {
        quizRouteAulaAppliedRef.current = false;
      }, [initialAulaId, selectedMateria]);

      useEffect(() => {
        if (!selectedMateria || activeQuiz || showTemaSelector || showCadernoErros || quizComplete) return;
        if (!quizzes[selectedMateria]) return;
        if (initialAulaId && !quizRouteAulaAppliedRef.current) {
          const cards = quizzes[selectedMateria]?.cards || [];
          if (cards.some(c => c.tema === initialAulaId)) {
            quizRouteAulaAppliedRef.current = true;
            handleQuizStart(selectedMateria, [initialAulaId]);
            return;
          }
        }
        handleMateriaClick(selectedMateria);
      }, [selectedMateria, quizzes, activeQuiz, showTemaSelector, showCadernoErros, quizComplete, initialAulaId]);

      const togglePendingTema = (temaId) => {
        setPendingTemas(prev =>
          prev.includes(temaId) ? prev.filter(t => t !== temaId) : [...prev, temaId]
        );
      };

      const toggleCross = (idx) => {
        const next = new Set(crossedOut);
        if (next.has(idx)) next.delete(idx);
        else next.add(idx);
        if (selectedOption === idx) setSelectedOption(null);
        setCrossedOut(next);
      };

      const getActiveCards = () => {
        if (reviewQuestionIds.length > 0) {
          const byId = new Map(quizQuestions.map(q => [q.id, q]));
          return reviewQuestionIds.map(id => byId.get(id)).filter(Boolean);
        }
        if (showCadernoErros) {
          const erros = getErros();
          return quizQuestions.filter(q => erros.includes(q.id));
        }
        if (!activeQuiz) return [];
        const quiz = quizzes[activeQuiz];
        if (!quiz) return [];
        return activeTemas.length > 0
          ? quiz.cards.filter(c => activeTemas.includes(c.tema))
          : quiz.cards;
      };

      const parseQuizExplanation = (card) => {
        const options = card?.opcoes || [];
        const letters = options.map((_, idx) => String.fromCharCode(65 + idx));

        const parseOptionMapFromText = (text) => {
          if (!text || typeof text !== 'string') return {};
          const map = {};
          for (const letter of letters) {
            const regex = new RegExp(`${letter}\\)\\s*(?:CORRETA\\.?|INCORRETA\\.?)?\\s*([\\s\\S]*?)(?=\\n[A-D]\\)|$)`, 'i');
            const match = text.match(regex);
            if (match && match[1]) map[letter] = match[1].trim();
          }
          return map;
        };

        const explicacoesOpcoes = Array.isArray(card?.explicacoes_opcoes)
          ? card.explicacoes_opcoes.reduce((acc, txt, idx) => {
              const letter = String.fromCharCode(65 + idx);
              if (txt) acc[letter] = String(txt).trim();
              return acc;
            }, {})
          : (card?.explicacoes_opcoes || {});

        const parsedFromText = parseOptionMapFromText(card?.explicacao || '');
        const optionMap = { ...parsedFromText, ...explicacoesOpcoes };

        const resumoMatch = typeof card?.explicacao === 'string'
          ? card.explicacao.match(/Resumo:\s*([\s\S]*?)(?=\n[A-D]\)|$)/i)
          : null;
        const generalRaw = card?.explicacao_geral || (resumoMatch ? resumoMatch[1].trim() : (card?.explicacao || ''));
        const general = String(generalRaw || '').trim();

        const optionExplanations = letters.map((letter, idx) => {
          const explanation = optionMap[letter];
          if (explanation) return explanation;
          if (idx === card?.correta) return 'Alternativa correta para este enunciado.';
          return 'Alternativa incorreta neste contexto.';
        });

        return { general, optionExplanations };
      };

      const handleAnswer = () => {
        const activeCards = getActiveCards();
        const card = activeCards[currentQuestion];
        const correct = selectedOption === card.correta;
        markQuizAsDone(card?.id, correct);
        if (card?.id != null) {
          setAnswerResults(prev => ({ ...prev, [card.id]: correct }));
        }

        if (correct) {
          setQuizStats(prev => ({ ...prev, correct: prev.correct + 1 }));
          // Remove from caderno de erros if answered correctly
          removeErro(card.id);
        } else {
          // Add to caderno de erros on wrong answer
          addErro(card.id);
        }
        setAnswered(true);
      };

      const handleNextQuestion = () => {
        const activeCards = getActiveCards();
        if (currentQuestion < activeCards.length - 1) {
          setCurrentQuestion(currentQuestion + 1);
          setSelectedOption(null);
          setCrossedOut(new Set());
          setAnswered(false);
        } else {
          setQuizComplete(true);
          const quizHistory = JSON.parse(localStorage.getItem('meduni9_quiz_history') || '[]');
          quizHistory.push({
            date: new Date().toISOString(),
            materia: showCadernoErros ? 'caderno_erros' : activeQuiz,
            score: quizStats.correct,
            total: activeCards.length,
            time: formatTime(Date.now() - startTime)
          });
          localStorage.setItem('meduni9_quiz_history', JSON.stringify(quizHistory));
        }
      };

      const handleReportQuestion = () => {
        const activeCards = getActiveCards();
        const card = activeCards[currentQuestion];
        if (!card) return;
        setReportQuizTarget(card);
        setReportQuizReason('');
        setReportQuizError('');
        setReportQuizOpen(true);
      };

      const submitQuizReport = async () => {
        if (!reportQuizTarget) return;
        setReportQuizSending(true);
        setReportQuizError('');
        try {
          await submitContentFeedback({
            origem: 'questoes',
            mensagem: reportQuizReason?.trim() || 'Erro reportado em questão',
            itemId: reportQuizTarget.id,
            materia: reportQuizTarget.materia || activeQuiz,
            tema: reportQuizTarget.tema,
            contexto: {
              pergunta: reportQuizTarget.pergunta,
              opcoes: reportQuizTarget.opcoes || [],
              correta: reportQuizTarget.correta,
              explicacao: reportQuizTarget.explicacao || ''
            }
          });
          setReportQuizOpen(false);
          setReportQuizTarget(null);
        } catch (e) {
          setReportQuizError('Nao foi possivel enviar agora. Tente novamente em instantes.');
        } finally {
          setReportQuizSending(false);
        }
      };

      const handleRestartQuiz = () => {
        if (showCadernoErros) {
          setCurrentQuestion(0);
          setSelectedOption(null);
          setCrossedOut(new Set());
          setAnswered(false);
          setQuizStats({ correct: 0, total: 0 });
          setAnswerResults({});
          setReviewQuestionIds([]);
          setStartTime(Date.now());
          setQuizComplete(false);
        } else {
          handleQuizStart(activeQuiz, activeTemas);
        }
      };

      // Start caderno de erros quiz
      const startCadernoErros = () => {
        onSelectMateria(null);
        setShowCadernoErros(true);
        setActiveQuiz('__erros__');
        setReviewQuestionIds([]);
        setCurrentQuestion(0);
        setSelectedOption(null);
        setCrossedOut(new Set());
        setAnswered(false);
        setQuizStats({ correct: 0, total: 0 });
        setAnswerResults({});
        setStartTime(Date.now());
        setQuizComplete(false);
      };

      const openTemaSelectorFromResult = () => {
        if (showCadernoErros || !activeQuiz) return;
        setQuizComplete(false);
        setActiveQuiz(null);
        setActiveTemas([]);
        setShowCadernoErros(false);
        setReviewQuestionIds([]);
        setPendingQuiz(activeQuiz);
        setPendingTemas([]);
        setShowTemaSelector(true);
      };

      const startWrongOnlyReview = () => {
        const activeCards = getActiveCards();
        const wrongIds = activeCards
          .filter(card => card?.id != null && answerResults[card.id] === false)
          .map(card => card.id);
        if (!wrongIds.length) return;
        setQuizComplete(false);
        setShowCadernoErros(false);
        setReviewQuestionIds(wrongIds);
        setCurrentQuestion(0);
        setSelectedOption(null);
        setCrossedOut(new Set());
        setAnswered(false);
        setQuizStats({ correct: 0, total: 0 });
        setAnswerResults({});
        setStartTime(Date.now());
      };

      const getNextRecommendedTemaId = () => {
        if (!activeQuiz || showCadernoErros) return null;
        const quiz = quizzes[activeQuiz];
        const materia = materiasById[activeQuiz];
        if (!quiz) return null;
        const temasComQuestoes = [...new Set((quiz.cards || []).map(c => c.tema).filter(Boolean))];
        if (!temasComQuestoes.length) return null;
        const aulas = Array.isArray(materia?.aulas) ? materia.aulas : [];
        const ordenadas = aulas.length
          ? aulas.map(a => a.id).filter(id => temasComQuestoes.includes(id))
          : temasComQuestoes;
        if (!ordenadas.length) return null;
        const temaAtual = activeTemas.length === 1 ? activeTemas[0] : (getActiveCards()[0]?.tema || null);
        if (!temaAtual) return ordenadas[0];
        const idx = ordenadas.indexOf(temaAtual);
        if (idx >= 0 && idx < ordenadas.length - 1) return ordenadas[idx + 1];
        return ordenadas.find(id => id !== temaAtual) || null;
      };

      const startNextRecommendedTema = () => {
        const nextTema = getNextRecommendedTemaId();
        if (!nextTema) return;
        handleQuizStart(activeQuiz, [nextTema]);
      };

      if (quizComplete) {
        const activeCards = getActiveCards();
        const percentage = Math.round((quizStats.correct / Math.max(activeCards.length, 1)) * 100);
        const wrongIds = activeCards
          .filter(card => card?.id != null && answerResults[card.id] === false)
          .map(card => card.id);
        const nextTemaId = getNextRecommendedTemaId();

        return (
          <>
            <div className="screen-content">
              <div className="quiz-result-screen">
                <div style={{
                  width: '64px', height: '64px', margin: '0 auto 18px',
                  borderRadius: '999px', border: '1px solid rgba(255,255,255,0.16)',
                  background: percentage >= 70 ? 'rgba(16,185,129,0.12)' : 'rgba(255,255,255,0.06)',
                  color: percentage >= 70 ? '#34D399' : 'var(--text-primary)',
                  display: 'flex', alignItems: 'center', justifyContent: 'center',
                }}>
                  {percentage >= 70 ? <IconTrophy /> : <IconTarget />}
                </div>
                <div className="quiz-score">{percentage}%</div>
                <p style={{ color: 'var(--text-secondary)', marginBottom: '8px' }}>
                  {quizStats.correct} de {activeCards.length} questões
                  {activeTemas.length === 1 && <span> — {getTemaDisplayName(activeQuiz, activeTemas[0])}</span>}
                  {activeTemas.length > 1 && <span> — {activeTemas.length} assuntos</span>}
                </p>
                <div className="quiz-time">{formatTime(Date.now() - startTime)}</div>
                <div className="quiz-result-actions">
                  {wrongIds.length > 0 && (
                    <button className="btn quiz-result-secondary" onClick={startWrongOnlyReview}>
                      <IconFileText /> Revisar apenas erradas
                    </button>
                  )}
                  {!showCadernoErros && (
                    <button className="btn quiz-result-secondary" onClick={openTemaSelectorFromResult}>
                      <IconLayers /> Trocar aula ou assuntos
                    </button>
                  )}
                  {!showCadernoErros && nextTemaId && (
                    <button className="btn quiz-result-secondary" onClick={startNextRecommendedTema}>
                      <IconChevronRight /> Próxima aula sugerida
                    </button>
                  )}
                  <button className="btn btn-primary" onClick={handleRestartQuiz}>Tentar Novamente</button>
                  <button className="btn btn-secondary" onClick={() => { setActiveQuiz(null); setActiveTemas([]); setQuizComplete(false); setShowCadernoErros(false); setReviewQuestionIds([]); setAnswerResults({}); onSelectMateria(null); }}>Voltar</button>
                </div>
              </div>
            </div>
          </>
        );
      }

      // Tema selector screen for quiz (multi-select) — uses aulas from materias.json
      if (showTemaSelector && pendingQuiz) {
        const quiz = quizzes[pendingQuiz];
        const materiaObj = materias.find(m => m.id === pendingQuiz);
        const aulas = materiaObj?.aulas || [];
        const hasAulas = aulas.length > 0;
        const temasFromCardsQ = [...new Set(quiz.cards.map(c => c.tema).filter(Boolean))];
        const temaSearch = normalizeText(pendingTemaSearch || '');
        const aulasFiltradas = hasAulas
          ? aulas.filter((aula) => {
              if (!temaSearch) return true;
              return (
                normalizeText(aula.tema || '').includes(temaSearch) ||
                normalizeText(aula.descricao || '').includes(temaSearch) ||
                normalizeText(aula.id || '').includes(temaSearch)
              );
            })
          : [];
        const temasFallbackFiltrados = hasAulas
          ? []
          : temasFromCardsQ.sort().filter((tema) => {
              if (!temaSearch) return true;
              const label = getTemaDisplayName(pendingQuiz, tema);
              return normalizeText(label).includes(temaSearch) || normalizeText(tema).includes(temaSearch);
            });

    function normalizeInstrumentAnswerText(s) {
      const base = String(s || '')
        .trim()
        .replace(/\s+/g, ' ')
        .toLowerCase();
      try {
        return base.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
      } catch (e) {
        return base;
      }
    }

    /**
     * Aceita nome completo ou parte principal: ignora maiúsculas/minúsculas e acentos (após normalizar).
     * Ex.: "farabeuf", "FARABEUF" ou "Afastador Farabeuf" para gabarito "Afastador Farabeuf".
     */
    function instrumentAnswerMatchesRelaxed(nu, ne) {
      if (!nu || !ne) return false;
      if (nu.length < 2) return false;
      if (nu === ne) return true;
      if (ne.endsWith(' ' + nu)) return true;
      const tokens = ne.split(/\s+/).filter(Boolean);
      const last = tokens[tokens.length - 1] || '';
      if (nu === last) return true;
      const stop = new Set(['de', 'da', 'do', 'das', 'dos', 'e', 'o', 'a', 'em', 'no', 'na', 'tipo', 'com', 'para']);
      for (const t of tokens) {
        if (t === nu && t.length >= 3 && !stop.has(t)) return true;
      }
      return false;
    }

    /** Compara resposta ao nome canônico; destaca caracteres (verde se acerto ou resposta aceita no modo flexível). */
    function buildInstrumentAnswerDiff(userRaw, expectedNome) {
      const nu = normalizeInstrumentAnswerText(userRaw);
      const ne = normalizeInstrumentAnswerText(expectedNome);
      if (!nu.length) {
        return { isEmpty: true, isCorrect: false, userSpans: [], normalizedExpected: ne };
      }
      const relaxedOk = instrumentAnswerMatchesRelaxed(nu, ne);
      const userSpans = [];
      if (relaxedOk) {
        for (let i = 0; i < nu.length; i += 1) {
          userSpans.push({ ch: nu[i], ok: true });
        }
      } else {
        for (let i = 0; i < nu.length; i += 1) {
          const ch = nu[i];
          const ok = i < ne.length && ne[i] === ch;
          userSpans.push({ ch, ok });
        }
      }
      return { isEmpty: false, isCorrect: relaxedOk, userSpans, normalizedUser: nu, normalizedExpected: ne };
    }

    function shuffleInstrumentIds(ids) {
      const a = ids.slice();
      for (let i = a.length - 1; i > 0; i -= 1) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    /** Codifica segmentos do path para img src (espaços e caracteres especiais nos nomes de ficheiro). */
    function encodeLocalAssetPath(p) {
      const s = String(p || '').trim();
      if (!s) return s;
      return s.split('/').map((seg) => (seg === '' ? '' : encodeURIComponent(seg))).join('/');
    }

    /** Negrito estilo Markdown `**trecho**` em texto inline (guia TO). */
    function renderInlineBoldMarkdown(s, strongStyle) {
      const str = String(s || '');
      const style = strongStyle || { fontWeight: 700, color: 'inherit' };
      const parts = str.split(/(\*\*.+?\*\*)/g);
      return parts.map((part, i) => {
        const m = part.match(/^\*\*([\s\S]+?)\*\*$/);
        if (m) return <strong key={i} style={style}>{m[1]}</strong>;
        return part ? <span key={i}>{part}</span> : null;
      });
    }

    /**
     * Troca pixels muito escuros (fundo preto “embutido” em raster) por branco.
     * Quando r,g,b <= threshold. Cuidado: sombras muito escuras do instrumento também podem clarear.
     */
    function toEstudosWhitenEmbeddedBlackBg(img, opts) {
      const threshold = opts && typeof opts.threshold === 'number' ? opts.threshold : 40;
      const maxMegapixels = 18;
      const w = img.naturalWidth;
      const h = img.naturalHeight;
      if (!w || !h) return false;
      if (w * h > maxMegapixels * 1_000_000) return false;
      const canvas = document.createElement('canvas');
      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext('2d');
      if (!ctx) return false;
      ctx.drawImage(img, 0, 0);
      let data;
      try {
        data = ctx.getImageData(0, 0, w, h);
      } catch (e) {
        return false;
      }
      const px = data.data;
      let changed = false;
      for (let i = 0; i < px.length; i += 4) {
        const r = px[i];
        const g = px[i + 1];
        const b = px[i + 2];
        if (r <= threshold && g <= threshold && b <= threshold) {
          px[i] = 255;
          px[i + 1] = 255;
          px[i + 2] = 255;
          changed = true;
        }
      }
      if (!changed) return false;
      ctx.putImageData(data, 0, 0);
      try {
        img.src = canvas.toDataURL('image/png');
        return true;
      } catch (e) {
        return false;
      }
    }

    function ToEstudosInstrumentFigure({ src, alt, onError }) {
      const doneRef = useRef(false);
      const onLoad = useCallback(
        (e) => {
          const el = e.currentTarget;
          if (doneRef.current) return;
          const s = String(src || '');
          if (!/\.(png|jpe?g)(\?|#|$)/i.test(s)) return;
          try {
            if (toEstudosWhitenEmbeddedBlackBg(el, { threshold: 40 })) {
              doneRef.current = true;
            }
          } catch (err) {}
        },
        [src],
      );
      return (
        <img src={src} alt={alt} loading="lazy" decoding="async" onLoad={onLoad} onError={onError} />
      );
    }
