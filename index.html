<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#00C896">
  <meta name="description" content="MedGradPlus — Plataforma de estudos para estudantes de medicina">
  <title>MedGradPlus</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%230A1628'/><rect x='13' y='28' width='38' height='8' rx='3' fill='%2300B4D8'/><rect x='28' y='13' width='8' height='38' rx='3' fill='%2300B4D8'/><rect x='26' y='26' width='12' height='12' rx='2' fill='%2300C9E8'/></svg>">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><rect width='192' height='192' rx='40' fill='%230A1628'/><rect x='38' y='84' width='116' height='24' rx='8' fill='%2300B4D8'/><rect x='84' y='38' width='24' height='116' rx='8' fill='%2300B4D8'/><rect x='78' y='78' width='36' height='36' rx='6' fill='%2300C9E8'/></svg>">

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@600;700;800&family=Lexend:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-user-select: none;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      font-family: 'DM Sans', sans-serif;
      background: var(--bg-body, linear-gradient(160deg, #181C27 0%, #1D2130 55%, #1B2035 100%));
      background-attachment: fixed;
      color: var(--text-primary, #E5E7EB);
      overflow: hidden;
      transition: background 0.3s ease, color 0.3s ease;
    }

    #root {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    /* Typography */
    h1, h2, h3, h4, h5, h6 {
      font-family: 'Outfit', sans-serif;
      font-weight: 700;
    }

    /* Colors & Design Tokens */
    :root {
      --primary: #00C896;
      --mint: #00C896;
      --success: #10B981;
      --warning: #F59E0B;
      --error: #EF4444;
      --purple: #8B5CF6;

      /* Background — cinza-azulado carvão, identidade própria */
      --bg-body: linear-gradient(160deg, #181C27 0%, #1D2130 55%, #1B2035 100%);
      --bg-dark: #181C27;
      --bg-sidebar: #1D2130;
      --bg-card: rgba(255, 255, 255, 0.05);
      --border-card: rgba(255, 255, 255, 0.07);
      --text-primary: #E8EBF0;
      --text-secondary: #8B95A8;

      /* Surfaces */
      --surface-1: rgba(255, 255, 255, 0.06);
      --surface-2: rgba(255, 255, 255, 0.09);
      --surface-3: rgba(255, 255, 255, 0.14);
      --border-subtle: rgba(255, 255, 255, 0.09);
      --border-strong: rgba(255, 255, 255, 0.18);

      /* Elevação */
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.18);
      --shadow-md: 0 4px 20px rgba(0, 0, 0, 0.25);
      --shadow-lg: 0 8px 40px rgba(0, 0, 0, 0.35);

      /* Animação */
      --ease-spring: cubic-bezier(0.16, 1, 0.3, 1);
      --duration-fast: 150ms;
      --duration-base: 250ms;

      /* Cores por matéria */
      --color-sus: #6366F1;
      --color-semiologia: #C0392B;
      --color-bmf1: #E85D75;
      --color-bmf2: #EF4444;
      --color-bmf3: #3B82F6;
      --color-bmf4: #A855F7;
      --color-bcm1: #4A90E2;
      --color-mad: #F59E0B;
      --color-indicadores: #10B981;
      --color-mfc: #16A34A;
      --color-pediatria: #F59E0B;
      --color-go: #EC4899;
    }

    /* ── Light Theme ───────────────────────────────────── */
    html[data-theme="light"] {
      --bg-body: linear-gradient(135deg, #EFF6FF 0%, #F1F5F9 50%, #E2EAF4 100%);
      --bg-dark: #F1F5F9;
      --bg-sidebar: rgba(255, 255, 255, 0.97);
      --bg-card: rgba(0, 0, 0, 0.04);
      --border-card: rgba(0, 0, 0, 0.08);
      --text-primary: #1E293B;
      --text-secondary: #64748B;
      --surface-1: rgba(0, 0, 0, 0.04);
      --surface-2: rgba(0, 0, 0, 0.06);
      --surface-3: rgba(0, 0, 0, 0.10);
      --border-subtle: rgba(0, 0, 0, 0.07);
      --border-strong: rgba(0, 0, 0, 0.15);
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.07);
      --shadow-md: 0 4px 20px rgba(0, 0, 0, 0.10);
      --shadow-lg: 0 8px 40px rgba(0, 0, 0, 0.14);
    }

    html[data-theme="light"] body {
      background: var(--bg-body);
      color: #1E293B;
    }

    html[data-theme="light"] .desktop-layout,
    html[data-theme="light"] .app-container,
    html[data-theme="light"] .splash-screen {
      background: var(--bg-body) !important;
    }

    html[data-theme="light"] .desktop-sidebar {
      background: var(--bg-sidebar) !important;
      border-right-color: rgba(0, 0, 0, 0.08) !important;
      box-shadow: 2px 0 16px rgba(0, 0, 0, 0.06) !important;
    }

    html[data-theme="light"] .sidebar-item {
      color: #475569 !important;
    }
    html[data-theme="light"] .sidebar-item:hover {
      background: rgba(0, 200, 150, 0.10) !important;
      color: #1E293B !important;
    }
    html[data-theme="light"] .sidebar-item.active {
      background: rgba(0, 200, 150, 0.16) !important;
      color: var(--primary) !important;
    }
    html[data-theme="light"] .sidebar-footer {
      border-top-color: rgba(0, 0, 0, 0.08) !important;
    }
    html[data-theme="light"] .sidebar-logo {
      border-bottom-color: rgba(0, 0, 0, 0.08) !important;
    }
    html[data-theme="light"] .bottom-nav {
      background: rgba(255, 255, 255, 0.95) !important;
      border-top: 1px solid rgba(0, 0, 0, 0.08) !important;
    }
    html[data-theme="light"] .nav-item { color: #64748B !important; }
    html[data-theme="light"] .nav-item.active { color: var(--primary) !important; }
    html[data-theme="light"] .screen-content { background: transparent !important; }
    html[data-theme="light"] .sidebar-open-bar {
      background: rgba(255,255,255,0.97) !important;
      border-bottom-color: rgba(0,0,0,0.08) !important;
    }
    html[data-theme="light"] .feedback-panel,
    html[data-theme="light"] .feedback-modal {
      background: #ffffff !important;
      border-color: rgba(0,0,0,0.1) !important;
    }
    html[data-theme="light"] .feedback-select,
    html[data-theme="light"] .feedback-textarea {
      background: #F8FAFC !important;
      border-color: rgba(0,0,0,0.12) !important;
      color: #1E293B !important;
    }
    html[data-theme="light"] .feedback-select option { background: #ffffff !important; color: #1E293B !important; }

    /* ── Light Mode: Card/Surface contrast fixes ─────── */
    html[data-theme="light"] .stat-card {
      background: rgba(255, 255, 255, 0.88) !important;
      border: 1px solid rgba(0, 0, 0, 0.10) !important;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.07) !important;
    }
    html[data-theme="light"] .question-card,
    html[data-theme="light"] .flashcard-item,
    html[data-theme="light"] .material-item {
      background: rgba(255, 255, 255, 0.85) !important;
      border-color: rgba(0, 0, 0, 0.10) !important;
      box-shadow: 0 1px 6px rgba(0, 0, 0, 0.07) !important;
    }
    html[data-theme="light"] .screen-header {
      background: rgba(255, 255, 255, 0.90) !important;
      border-bottom-color: rgba(0, 0, 0, 0.08) !important;
    }
    html[data-theme="light"] .subject-select-item {
      background: rgba(255, 255, 255, 0.80) !important;
      border-color: rgba(0, 0, 0, 0.10) !important;
    }
    html[data-theme="light"] .subject-select-item:hover {
      background: rgba(255, 255, 255, 0.97) !important;
    }
    html[data-theme="light"] .btn-primary {
      box-shadow: 0 2px 12px rgba(0, 200, 150, 0.3) !important;
    }
    html[data-theme="light"] .markdown-body {
      background: rgba(255, 255, 255, 0.95) !important;
    }
    html[data-theme="light"] .material-header-card {
      background: rgba(255, 255, 255, 0.88) !important;
      border-color: rgba(0, 0, 0, 0.10) !important;
    }

    /* ── Theme Toggle Button ─────────────────────────── */
    .theme-toggle-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 16px;
      transition: color 0.2s, opacity 0.2s;
      flex-shrink: 0;
      opacity: 0.7;
    }
    .theme-toggle-btn:hover {
      color: var(--primary);
      opacity: 1;
    }

    /* Main Container */
    .app-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      width: 100%;
      max-width: 430px;
      margin: 0 auto;
      height: 100vh;
      background: var(--bg-body, linear-gradient(160deg, #181C27 0%, #1D2130 55%, #1B2035 100%));
      position: relative;
      transition: background 0.3s ease;
    }

    /* Desktop layout wrapper */
    .desktop-layout {
      display: flex;
      width: 100%;
      height: 100vh;
      background: var(--bg-body, linear-gradient(160deg, #181C27 0%, #1D2130 55%, #1B2035 100%));
      transition: background 0.3s ease;
    }

    .desktop-layout .app-container {
      max-width: none;
      margin: 0;
      height: 100%;
      flex: 1;
      min-width: 0;
    }

    /* Desktop Sidebar */
    .desktop-sidebar {
      display: none;
      width: 240px;
      min-width: 240px;
      background: var(--bg-sidebar, #1D2130);
      border-right: 1px solid var(--border-card);
      transition: background 0.3s ease;
      flex-direction: column;
      padding: 24px 0;
      height: 100vh;
      position: sticky;
      top: 0;
    }

    .sidebar-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 20px 24px;
      border-bottom: 1px solid var(--border-card);
      margin-bottom: 16px;
      justify-content: flex-start;
    }

    .sidebar-logo-icon { font-size: 28px; }

    .sidebar-logo-text {
      font-family: 'Outfit', sans-serif;
      font-size: 20px;
      font-weight: 700;
      color: var(--primary);
    }

    .sidebar-nav {
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 0 12px;
      flex: 1;
    }

    .sidebar-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      border-radius: 10px;
      cursor: pointer;
      color: var(--text-secondary);
      font-size: 14px;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .sidebar-item:hover {
      background: rgba(0, 200, 150, 0.08);
      color: var(--text-primary);
    }

    .sidebar-item.active {
      background: rgba(0, 200, 150, 0.15);
      color: var(--primary);
    }

    .sidebar-item svg {
      flex-shrink: 0;
    }

    .sidebar-footer {
      padding: 16px 20px;
      border-top: 1px solid var(--border-card);
      font-size: 11px;
      color: var(--text-secondary);
      text-align: center;
    }

    .screen-content {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 20px 16px 100px 16px;
      -webkit-overflow-scrolling: touch;
    }

    /* Hamburger/sidebar toggle button */
    .sidebar-toggle-btn {
      display: none;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border-radius: 8px;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 18px;
      line-height: 1;
      flex-shrink: 0;
      transition: color 0.2s;
    }
    .sidebar-toggle-btn:hover {
      background: transparent;
      color: var(--primary);
    }

    /* Sticky open-bar (replaces the old fixed toggle when sidebar is collapsed) */
    .sidebar-open-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      position: sticky;
      top: 0;
      z-index: 150;
      background: var(--bg-dark, #181C27);
      border-bottom: 1px solid var(--border-card);
    }

    /* Sidebar collapsed state */
    .desktop-sidebar.collapsed {
      width: 0 !important;
      min-width: 0 !important;
      padding: 0 !important;
      overflow: hidden;
      border-right: none;
    }

    /* Study mode selector */
    .study-mode-selector {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 16px;
    }
    .study-mode-btn {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 20px;
      background: var(--bg-card);
      border: 1.5px solid var(--border-card);
      border-radius: 14px;
      cursor: pointer;
      transition: all 0.2s;
      text-align: left;
      color: var(--text-primary);
      font-family: 'DM Sans', sans-serif;
    }
    .study-mode-btn:hover {
      border-color: var(--primary);
      background: rgba(0, 200, 150, 0.07);
    }
    .study-mode-icon { font-size: 24px; }
    .study-mode-title { font-size: 14px; font-weight: 600; margin-bottom: 2px; }
    .study-mode-desc { font-size: 12px; color: var(--text-secondary); }

    /* Search input for subjects */
    .subject-search {
      width: 100%;
      padding: 11px 14px 11px 38px;
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: 10px;
      color: var(--text-primary);
      font-size: 14px;
      font-family: 'DM Sans', sans-serif;
      margin-bottom: 14px;
      transition: border-color 0.2s;
    }
    .subject-search:focus {
      outline: none;
      border-color: var(--primary);
    }
    .subject-search-wrap {
      position: relative;
      margin-bottom: 4px;
    }
    .subject-search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-secondary);
      pointer-events: none;
      display: flex;
      align-items: center;
      line-height: 0;
    }

    /* Category tabs for questions */
    .category-tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 20px;
    }
    .category-tab {
      flex: 1;
      padding: 9px 10px;
      border-radius: 10px;
      border: 1.5px solid var(--border-card);
      background: transparent;
      color: var(--text-secondary);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
      min-height: auto;
      text-transform: none;
      letter-spacing: 0;
      font-family: 'DM Sans', sans-serif;
    }
    .category-tab.active {
      background: var(--primary);
      color: #000;
      border-color: var(--primary);
    }

    /* Quiz question card with better readability */
    .quiz-question-card {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      padding: 20px 22px;
      margin-bottom: 20px;
    }

    @media (min-width: 769px) {
      #root {
        display: flex;
      }

      .desktop-sidebar {
        display: flex;
        transition: width 0.25s ease, min-width 0.25s ease, padding 0.25s ease;
      }

      .desktop-layout .bottom-nav {
        display: none;
      }

      .desktop-layout .screen-content {
        padding: 28px 40px 40px;
      }

      .desktop-layout .flashcard {
        min-height: 360px;
      }

      .desktop-layout .stats-grid {
        grid-template-columns: 1fr 1fr 1fr;
      }

      .desktop-layout .quiz-question {
        font-size: 20px;
      }

      .sidebar-toggle-btn {
        display: flex;
      }
    }

    /* Splash Screen */
    .splash-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      background: var(--bg-body, linear-gradient(160deg, #181C27 0%, #1D2130 55%, #1B2035 100%));
      gap: 20px;
    }

    .splash-logo-wrap {
      animation: splash-fade-in 0.7s var(--ease-spring, cubic-bezier(0.16, 1, 0.3, 1)) both;
    }

    .splash-logo-inner {
      animation: logo-glow 4s ease-in-out infinite;
      filter: drop-shadow(0 0 6px rgba(0,200,150,0.4)) drop-shadow(0 0 18px rgba(0,200,150,0.2));
    }

    @keyframes logo-glow {
      0%, 100% { filter: drop-shadow(0 0 4px rgba(0,200,150,0.3)) drop-shadow(0 0 12px rgba(0,200,150,0.15)); }
      50%       { filter: drop-shadow(0 0 20px rgba(0,200,150,0.9)) drop-shadow(0 0 40px rgba(0,200,150,0.55)); }
    }

    @keyframes splash-fade-in {
      from { opacity: 0; transform: scale(0.85) translateY(12px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }

    .splash-text {
      font-size: 28px;
      font-family: 'Outfit', sans-serif;
      font-weight: 800;
      color: var(--text-primary, #E5E7EB);
      text-align: center;
      animation: splash-fade-in 0.7s 0.15s var(--ease-spring, cubic-bezier(0.16, 1, 0.3, 1)) both;
      letter-spacing: -0.02em;
    }

    .splash-tagline {
      font-size: 12px;
      font-family: 'DM Sans', sans-serif;
      font-weight: 500;
      color: var(--mint, #00C896);
      text-align: center;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      animation: splash-fade-in 0.7s 0.28s var(--ease-spring, cubic-bezier(0.16, 1, 0.3, 1)) both;
    }

    @keyframes fade-in {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* ── Auth Full-Screen Layout ─────────────────────────────── */
    .auth-page {
      display: flex;
      width: 100%;
      height: 100vh;
      overflow: hidden;
      background: linear-gradient(135deg, #080f1e 0%, #0a1628 50%, #0c1f38 100%);
    }

    /* Left brand panel — shown only on desktop */
    .auth-brand-panel {
      display: none;
      flex-direction: column;
      justify-content: space-between;
      width: 52%;
      min-width: 480px;
      padding: 48px 56px;
      background: linear-gradient(160deg, #0a1e3a 0%, #072040 40%, #061830 100%);
      border-right: 1px solid rgba(0,200,150,0.12);
      position: relative;
      overflow: hidden;
    }

    .auth-brand-panel::before {
      content: '';
      position: absolute;
      top: -120px;
      right: -80px;
      width: 420px;
      height: 420px;
      background: radial-gradient(circle, rgba(0,200,150,0.12) 0%, transparent 70%);
      pointer-events: none;
    }
    .auth-brand-panel::after {
      content: '';
      position: absolute;
      bottom: -100px;
      left: -60px;
      width: 340px;
      height: 340px;
      background: radial-gradient(circle, rgba(0,200,150,0.08) 0%, transparent 70%);
      pointer-events: none;
    }

    .auth-brand-top { position: relative; z-index: 1; }
    .auth-brand-logo {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 56px;
    }
    .auth-brand-logo-text {
      font-family: 'Outfit', sans-serif;
      font-size: 22px;
      font-weight: 800;
      color: #fff;
      letter-spacing: -0.02em;
    }
    .auth-brand-logo-text sup {
      font-size: 0.5em;
      color: #00C896;
      font-weight: 800;
      vertical-align: super;
      line-height: 0;
    }
    .auth-brand-headline {
      font-family: 'Outfit', sans-serif;
      font-size: 36px;
      font-weight: 800;
      color: #fff;
      line-height: 1.2;
      margin-bottom: 16px;
      letter-spacing: -0.02em;
    }
    .auth-brand-headline span { color: #00C896; }
    .auth-brand-sub {
      font-size: 15px;
      color: rgba(255,255,255,0.65);
      line-height: 1.6;
      margin-bottom: 40px;
      max-width: 380px;
    }
    .auth-brand-features {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 48px;
    }
    .auth-brand-feature {
      display: flex;
      align-items: flex-start;
      gap: 14px;
    }
    .auth-brand-feature-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: rgba(0,200,150,0.15);
      border: 1px solid rgba(0,200,150,0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }
    .auth-brand-feature-text strong {
      display: block;
      font-size: 13px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 2px;
    }
    .auth-brand-feature-text span {
      font-size: 12px;
      color: rgba(255,255,255,0.5);
    }

    /* Mascote posicionado no brand panel */
    .auth-brand-mascot-wrap {
      position: relative;
      z-index: 1;
      flex: 1;
      display: flex;
      flex-direction: row;
      align-items: stretch;
      gap: 0;
    }
    .auth-brand-mascot-wrap .auth-brand-top {
      flex: 1;
      min-width: 0;
    }
    .auth-brand-mascot-col {
      width: 180px;
      flex-shrink: 0;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding-top: 52px;
    }
    .auth-brand-mascot-img {
      width: 160px;
      height: auto;
      pointer-events: none;
      user-select: none;
      filter: drop-shadow(0 4px 20px rgba(0,0,0,0.4));
      position: static;
    }
    .auth-brand-tagline {
      font-size: 11px;
      color: rgba(255,255,255,0.3);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      position: relative;
      z-index: 1;
    }

    /* Right form panel */
    .auth-form-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      padding: 40px 32px;
      justify-content: center;
    }
    .auth-form-inner {
      width: 100%;
      max-width: 400px;
      margin: 0 auto;
    }

    /* Mobile logo (shown only on mobile) */
    .auth-mobile-header {
      text-align: center;
      margin-bottom: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .auth-mascot {
      width: 160px;
      height: auto;
      pointer-events: none;
      user-select: none;
      filter: drop-shadow(0 4px 20px rgba(0,0,0,0.22));
      margin: 0 auto 8px;
      display: block;
    }

    @keyframes slide-in {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Desktop breakpoint: show brand panel */
    @media (min-width: 900px) {
      .auth-brand-panel { display: flex; }
      .auth-form-panel { padding: 40px 56px; }
      .auth-mobile-header { display: none; }
    }

    /* Upsell banner (free plan) */
    .upsell-banner {
      background: linear-gradient(135deg, rgba(245,158,11,0.12) 0%, rgba(245,158,11,0.06) 100%);
      border: 1px solid rgba(245,158,11,0.35);
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 20px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }
    .upsell-banner-icon { font-size: 20px; flex-shrink: 0; margin-top: 1px; }
    .upsell-banner-text strong {
      display: block;
      font-size: 13px;
      font-weight: 700;
      color: #F59E0B;
      margin-bottom: 2px;
    }
    .upsell-banner-text span {
      font-size: 12px;
      color: rgba(255,255,255,0.6);
    }
    .upsell-banner-btn {
      margin-left: auto;
      flex-shrink: 0;
      background: #F59E0B;
      color: #000;
      border: none;
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }

    /* Free access divider */
    .free-access-divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 20px 0 16px;
    }
    .free-access-divider::before,
    .free-access-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(255,255,255,0.08);
    }
    .free-access-divider span {
      font-size: 11px;
      color: rgba(255,255,255,0.35);
      white-space: nowrap;
    }

    .form-group {
      margin-bottom: 24px;
    }

    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-input {
      width: 100%;
      padding: 14px 16px;
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: 12px;
      color: var(--text-primary);
      font-size: 16px;
      font-family: 'DM Sans', sans-serif;
      transition: all 0.2s ease;
    }

    .form-input:focus {
      outline: none;
      border-color: var(--primary);
      background: rgba(0, 200, 150, 0.1);
    }

    .form-input::placeholder {
      color: var(--text-secondary);
    }

    .code-input-group {
      display: flex;
      gap: 8px;
      justify-content: space-between;
      margin-bottom: 24px;
    }

    .code-input-group input {
      flex: 1;
      padding: 12px;
      text-align: center;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 2px;
    }

    .fingerprint-display {
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 24px;
      font-size: 11px;
      color: var(--text-secondary);
      font-family: 'Courier New', monospace;
      word-break: break-all;
      max-height: 100px;
      overflow-y: auto;
    }

    .btn {
      padding: 14px 20px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: 'DM Sans', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 48px;
    }

    .btn-primary {
      background: var(--primary);
      color: #000;
      width: 100%;
    }

    .btn-primary:active {
      transform: scale(0.98);
      background: #0099B8;
    }

    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-secondary {
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      color: var(--text-primary);
      width: 100%;
    }

    .btn-secondary:active {
      background: rgba(255, 255, 255, 0.08);
    }

    .btn-small {
      padding: 8px 12px;
      font-size: 14px;
      min-height: auto;
    }

    .btn-success {
      background: var(--success);
      color: #000;
    }

    .btn-warning {
      background: var(--warning);
      color: #000;
    }

    .btn-error {
      background: var(--error);
      color: #fff;
    }

    .error-message {
      color: var(--error);
      font-size: 13px;
      margin-top: 8px;
    }

    .success-message {
      color: var(--success);
      font-size: 13px;
      margin-top: 8px;
    }

    /* Dashboard */
    .home-screen-content {
      flex: 1;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      padding: 16px 16px 0;
    }
    .dashboard-header {
      margin-bottom: 12px;
      padding-top: 4px;
    }

    .dashboard-welcome {
      font-size: 24px;
      font-family: 'Outfit', sans-serif;
      margin-bottom: 4px;
    }

    .dashboard-date {
      font-size: 13px;
      color: var(--text-secondary);
    }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
      margin-bottom: 12px;
    }

    .stat-card {
      background: var(--surface-2);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      padding: 14px 10px;
      text-align: center;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      min-width: 0;
      overflow: hidden;
    }

    .stat-icon {
      color: var(--primary);
      opacity: 0.75;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .stat-value {
      font-size: 20px;
      font-weight: 700;
      color: var(--primary);
      line-height: 1;
      margin-bottom: 2px;
      font-family: 'Outfit', sans-serif;
    }

    .stat-label {
      font-size: 10px;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.6px;
      font-weight: 600;
      width: 100%;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .daily-suggestion {
      background: linear-gradient(135deg, rgba(0, 200, 150, 0.12), rgba(0, 200, 150, 0.12));
      border: 1px solid rgba(0, 200, 150, 0.2);
      border-radius: 14px;
      padding: 14px 16px;
      margin-bottom: 12px;
      box-shadow: var(--shadow-sm);
    }

    .suggestion-cta {
      margin-top: 14px;
      background: var(--primary);
      color: #000;
      border: none;
      border-radius: 10px;
      padding: 10px 20px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      transition: opacity var(--duration-fast) ease, transform var(--duration-fast) var(--ease-spring);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: 'DM Sans', sans-serif;
      min-height: 40px;
    }

    .suggestion-cta:active {
      opacity: 0.85;
      transform: scale(0.97);
    }

    .suggestion-label {
      font-size: 11px;
      color: var(--purple);
      text-transform: uppercase;
      font-weight: 600;
      margin-bottom: 8px;
      letter-spacing: 0.5px;
    }

    .suggestion-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 12px;
    }

    .suggestion-progress {
      background: var(--bg-card);
      height: 6px;
      border-radius: 3px;
      overflow: hidden;
      margin-bottom: 8px;
    }

    .suggestion-progress-bar {
      height: 100%;
      background: var(--primary);
      transition: width 0.3s ease;
    }

    .suggestion-meta {
      font-size: 12px;
      color: var(--text-secondary);
    }

    .section-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 16px;
      margin-top: 24px;
    }

    .subjects-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .subject-card {
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: 12px;
      padding: 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .subject-card:active {
      background: rgba(0, 200, 150, 0.1);
      border-color: var(--primary);
    }

    .subject-icon {
      width: 48px;
      height: 48px;
      border-radius: 10px;
      background: rgba(0, 200, 150, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      flex-shrink: 0;
    }

    .subject-info {
      flex: 1;
    }

    .subject-name {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 4px;
    }

    .subject-meta {
      font-size: 12px;
      color: var(--text-secondary);
    }

    .subject-arrow {
      color: var(--text-secondary);
    }

    /* Flashcards Screen */
    .flashcards-header {
      margin-bottom: 24px;
    }

    .filter-bar {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      margin-bottom: 24px;
      padding-bottom: 8px;
      -webkit-overflow-scrolling: touch;
    }

    .filter-bar::-webkit-scrollbar {
      display: none;
    }

    .filter-btn {
      padding: 8px 16px;
      border-radius: 20px;
      border: 1px solid var(--border-card);
      background: transparent;
      color: var(--text-secondary);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
    }

    .filter-btn.active {
      background: var(--primary);
      color: #000;
      border-color: var(--primary);
    }

    .flashcard-container {
      margin-bottom: 24px;
    }

    .flashcard {
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: 16px;
      min-height: 320px;
      height: 320px;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      perspective: 1000px;
      transition: all 0.2s ease;
      position: relative;
      overflow: hidden;
    }

    .flashcard::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(135deg, rgba(0, 200, 150, 0.1), transparent);
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }

    .flashcard:active::before {
      opacity: 1;
    }

    .flashcard-inner {
      width: 100%;
      height: 100%;
      transition: transform 0.6s;
      transform-style: preserve-3d;
      position: relative;
    }

    .flashcard-inner.flipped {
      transform: rotateY(180deg);
    }

    .flashcard-front, .flashcard-back {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      backface-visibility: hidden;
      text-align: center;
      padding: 24px;
      overflow-y: auto;
    }

    .flashcard-back {
      transform: rotateY(180deg);
    }

    .flashcard-label {
      font-size: 11px;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 600;
    }

    .flashcard-text {
      font-size: 18px;
      line-height: 1.5;
      color: var(--text-primary);
      word-wrap: break-word;
    }

    .flashcard-progress {
      width: 100%;
      padding: 0 16px;
      margin-bottom: 20px;
    }

    .progress-dots {
      display: flex;
      gap: 6px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .progress-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
    }

    .progress-dot.current {
      background: var(--primary);
      width: 8px;
      height: 8px;
    }

    .progress-dot.completed {
      background: var(--success);
    }

    .flashcard-actions {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      width: 100%;
      margin-top: 24px;
    }

    .rate-btn {
      padding: 10px;
      border: 1px solid var(--border-card);
      border-radius: 8px;
      background: var(--bg-card);
      color: var(--text-primary);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .rate-btn.error {
      border-color: var(--error);
      color: var(--error);
    }

    .rate-btn.error:active {
      background: rgba(239, 68, 68, 0.1);
    }

    .rate-btn.warning {
      border-color: var(--warning);
      color: var(--warning);
    }

    .rate-btn.warning:active {
      background: rgba(245, 158, 11, 0.1);
    }

    .rate-btn.success {
      border-color: var(--success);
      color: var(--success);
    }

    .rate-btn.success:active {
      background: rgba(16, 185, 129, 0.1);
    }

    /* Anki-style flashcard enhancements */
    .flashcard-hint {
      fontSize: 12px;
      color: var(--text-secondary);
      margin-top: 8px;
      opacity: 0.6;
      font-size: 12px;
    }

    .flashcard-answer {
      font-size: 16px;
      line-height: 1.6;
    }

    .flashcard-explanation {
      font-size: 12px;
      line-height: 1.5;
      color: var(--text-secondary);
      opacity: 0.5;
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      text-align: left;
      width: 100%;
    }

    .anki-actions {
      margin-top: 16px;
    }

    .anki-actions .rate-btn {
      font-size: 14px;
      font-weight: 700;
      padding: 14px 10px;
      flex-direction: row;
      justify-content: center;
      gap: 8px;
    }

    .rate-shortcut {
      font-size: 10px;
      opacity: 0.5;
      background: rgba(255, 255, 255, 0.08);
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 500;
    }

    /* Quiz keyboard hints */
    .kbd-hint {
      font-size: 10px;
      opacity: 0.5;
      background: rgba(255, 255, 255, 0.08);
      padding: 2px 6px;
      border-radius: 4px;
      margin-left: 8px;
      font-weight: 500;
    }

    .quiz-option-number {
      font-size: 11px;
      font-weight: 600;
      opacity: 0.4;
      min-width: 18px;
      height: 18px;
      border-radius: 4px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.06);
      margin-right: 8px;
      flex-shrink: 0;
    }

    .quiz-action-bar {
      margin-top: 16px;
    }

    .subject-card-empty {
      opacity: 0.45;
    }

    .subject-card-empty .subject-select-meta {
      font-style: italic;
    }

    .session-complete {
      text-align: center;
      padding: 40px 0;
    }

    .session-icon {
      font-size: 80px;
      margin-bottom: 24px;
      animation: bounce 0.6s ease;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .session-title {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 16px;
    }

    .session-stats {
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 24px;
    }

    .session-stat {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid var(--border-card);
    }

    .session-stat:last-child {
      border-bottom: none;
    }

    .session-stat-label {
      color: var(--text-secondary);
      font-size: 13px;
    }

    .session-stat-value {
      font-size: 18px;
      font-weight: 700;
      color: var(--primary);
    }

    /* Quiz Screen */
    .quiz-header {
      margin-bottom: 24px;
    }

    .quiz-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .quiz-item {
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: 12px;
      padding: 16px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .quiz-item:active {
      background: rgba(0, 200, 150, 0.1);
      border-color: var(--primary);
    }

    .quiz-subject {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 4px;
    }

    .quiz-count {
      font-size: 12px;
      color: var(--text-secondary);
    }

    .quiz-screen {
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .quiz-progress-section {
      margin-bottom: 24px;
    }

    .quiz-progress-bar {
      width: 100%;
      height: 4px;
      background: var(--bg-card);
      border-radius: 2px;
      overflow: hidden;
      margin-bottom: 12px;
    }

    .quiz-progress-fill {
      height: 100%;
      background: var(--primary);
      transition: width 0.3s ease;
    }

    .quiz-counter {
      font-size: 12px;
      color: var(--text-secondary);
    }

    .quiz-question {
      font-size: 18px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .quiz-options {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 24px;
    }

    .quiz-option {
      padding: 14px;
      background: var(--bg-card);
      border: 2px solid var(--border-card);
      border-radius: 12px;
      color: var(--text-primary);
      cursor: pointer;
      transition: all 0.2s ease;
      font-size: 14px;
      text-align: left;
    }

    .quiz-option:active {
      border-color: var(--primary);
    }

    .quiz-option.selected {
      border-color: var(--primary);
      background: rgba(0, 200, 150, 0.1);
    }

    .quiz-option.correct {
      border-color: var(--success);
      background: rgba(16, 185, 129, 0.1);
    }

    .quiz-option.incorrect {
      border-color: var(--error);
      background: rgba(239, 68, 68, 0.1);
    }

    .quiz-option.crossed-out {
      text-decoration: line-through;
      opacity: 0.35;
      pointer-events: none;
      border-color: var(--border-card);
      background: transparent;
    }

    .quiz-option {
      position: relative;
      padding-right: 44px;
    }

    .cross-btn {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 1px solid var(--border-card);
      background: transparent;
      color: var(--text-secondary);
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      padding: 0;
      min-height: auto;
      text-transform: none;
      letter-spacing: 0;
    }

    .cross-btn:hover {
      border-color: var(--error);
      color: var(--error);
      background: rgba(239, 68, 68, 0.1);
      transform: translateY(-50%);
      box-shadow: none;
    }

    .quiz-feedback {
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 24px;
      font-size: 13px;
      line-height: 1.6;
    }

    .quiz-feedback-title {
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--text-primary);
    }

    .quiz-result-screen {
      text-align: center;
      padding: 40px 0;
    }

    .quiz-score {
      font-size: 72px;
      font-weight: 800;
      color: var(--primary);
      margin-bottom: 16px;
    }

    .quiz-time {
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 32px;
    }

    /* Materials Screen */
    .materials-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .material-subject {
      background: var(--surface-2);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      padding: 16px;
      box-shadow: var(--shadow-sm);
    }

    .material-subject-name {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .material-slots {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .material-slot {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 10px;
      padding: 11px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      opacity: 0.6;
    }

    .material-slot-name {
      font-size: 13px;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .material-badge {
      background: rgba(245, 158, 11, 0.15);
      color: var(--warning);
      border: 1px solid rgba(245, 158, 11, 0.25);
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    /* ── Material Document Layout ─────────────────────────────── */
    .material-doc-outer {
      display: flex;
      justify-content: center;
      width: 100%;
    }

    .material-doc-inner {
      max-width: 960px;
      width: 100%;
      min-width: 280px;
    }

    /* Light mode: doc gets a paper feel */
    html[data-theme="light"] .markdown-body {
      background: rgba(255,255,255,0.92) !important;
      border-color: rgba(0,200,150,0.15) !important;
      border-top-color: #00C896 !important;
      color: #1E293B !important;
      box-shadow: 0 4px 32px rgba(0,0,0,0.08), 0 1px 4px rgba(0,0,0,0.05) !important;
    }
    html[data-theme="light"] .markdown-body h1 {
      background: linear-gradient(135deg, #0F172A 0%, #0284C7 55%, #00C896 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      border-bottom-color: rgba(0,200,150,0.2) !important;
    }
    html[data-theme="light"] .markdown-body h2 { color: #1E293B !important; }
    html[data-theme="light"] .markdown-body h3 { color: #0284C7 !important; }
    html[data-theme="light"] .markdown-body h4 { color: #0369A1 !important; }
    html[data-theme="light"] .markdown-body p { color: #334155; }
    html[data-theme="light"] .markdown-body strong { color: #0F172A !important; }
    html[data-theme="light"] .markdown-body em { color: #475569 !important; }
    html[data-theme="light"] .markdown-body ul li::marker { color: var(--mint) !important; }
    html[data-theme="light"] .markdown-body ol li::marker { color: var(--mint) !important; }
    html[data-theme="light"] .markdown-body blockquote {
      border-left-color: var(--mint) !important;
      background: rgba(0,200,150,0.06) !important;
      color: #475569 !important;
    }
    html[data-theme="light"] .markdown-body code {
      background: rgba(0,200,150,0.08) !important;
      color: #0369A1 !important;
    }
    html[data-theme="light"] .markdown-body pre {
      background: #F8FAFC !important;
      border-color: rgba(0,0,0,0.08) !important;
    }
    html[data-theme="light"] .flow-box {
      background: linear-gradient(140deg, rgba(0,200,150,0.05) 0%, rgba(56,189,248,0.05) 100%) !important;
      border-color: rgba(0,200,150,0.35) !important;
    }
    html[data-theme="light"] .flow-step { color: #1E293B !important; }
    html[data-theme="light"] .flow-vc { color: #059669 !important; }
    html[data-theme="light"] .flow-ha { color: #059669 !important; }
    html[data-theme="light"] .flow-vc-note { color: #64748B !important; }
    html[data-theme="light"] .flow-label { color: #64748B !important; }
    html[data-theme="light"] .flow-branch-note { color: #64748B !important; }
    html[data-theme="light"] .flow-raw { color: #1E293B !important; }
    html[data-theme="light"] .markdown-body hr { border-top-color: rgba(0,0,0,0.1) !important; }
    html[data-theme="light"] .markdown-body td { color: #334155 !important; }
    html[data-theme="light"] .markdown-body .table-wrap {
      background: rgba(240,249,255,0.8) !important;
      border-color: rgba(0,200,150,0.2) !important;
    }
    html[data-theme="light"] .markdown-body thead tr {
      background: rgba(0,200,150,0.1) !important;
    }
    html[data-theme="light"] .markdown-body tbody tr:nth-child(even) {
      background: rgba(0,0,0,0.02) !important;
    }
    html[data-theme="light"] .md-breadcrumb .bc-item { color: #64748B !important; }
    html[data-theme="light"] .md-breadcrumb .bc-sep { color: #94A3B8 !important; }
    html[data-theme="light"] .md-meta-pill { color: #0369A1 !important; }

    /* ── Markdown Reader ───────────────────────────────────────── */
    .markdown-body {
      font-family: 'Lexend', 'DM Sans', sans-serif;
      font-size: 1rem;
      line-height: 1.82;
      color: #D1D9E6;
      user-select: text;
      -webkit-user-select: text;
    }

    /* Headings */
    .markdown-body h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 1.4rem;
      font-weight: 800;
      text-align: center;
      background: linear-gradient(135deg, #F1F5F9 0%, #38BDF8 55%, #00C896 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin: 6px 0 4px;
      padding-bottom: 14px;
      border-bottom: 2px solid rgba(0,200,150,0.25);
      line-height: 1.3;
      letter-spacing: -0.02em;
    }

    /* Breadcrumb linha gerada via JS */
    .md-breadcrumb {
      text-align: center;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.72rem;
      color: #475569;
      margin: 0 0 2px;
      letter-spacing: 0.02em;
    }
    .md-breadcrumb .bc-item { color: #475569; font-weight: 500; }
    .md-breadcrumb .bc-item.current { color: #00C896; font-weight: 600; }
    .md-breadcrumb .bc-sep { color: #334155; margin: 0 5px; }

    /* Metadata pills geradas via JS */
    .md-meta {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 6px;
      margin: 8px 0 20px;
    }
    .md-meta-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: rgba(0,200,150,0.1);
      border: 1px solid rgba(0,200,150,0.2);
      border-radius: 20px;
      padding: 3px 11px;
      font-size: 0.75rem;
      color: #7DD3FC;
      font-family: 'DM Sans', sans-serif;
      font-weight: 500;
    }
    .markdown-body h2 {
      font-family: 'Outfit', sans-serif;
      font-size: 1.12rem;
      font-weight: 700;
      color: #E2E8F0;
      margin: 1.7rem 0 0.65rem;
      padding-left: 12px;
      border-left: 3px solid var(--mint, #00C896);
      line-height: 1.35;
    }
    .markdown-body h3 {
      font-family: 'Outfit', sans-serif;
      font-size: 1rem;
      font-weight: 600;
      color: #38BDF8;
      margin: 1.2rem 0 0.5rem;
      line-height: 1.35;
    }
    .markdown-body h4 {
      font-size: 0.88rem;
      font-weight: 600;
      color: #7DD3FC;
      margin: 1rem 0 0.35rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    /* Paragraphs & text */
    .markdown-body p { margin: 0 0 0.85em; }
    .markdown-body strong {
      font-weight: 600;
      color: #F1F5F9;
    }
    .markdown-body em { color: #94A3B8; font-style: italic; }

    /* Lists */
    .markdown-body ul, .markdown-body ol {
      padding-left: 1.3em;
      margin: 0.5em 0 0.9em;
    }
    .markdown-body li { margin: 0.35em 0; }
    .markdown-body ul li::marker { color: var(--mint, #00C896); }
    .markdown-body ol li::marker { color: var(--mint, #00C896); font-weight: 600; }
    .markdown-body li > ul, .markdown-body li > ol { margin: 0.2em 0 0.3em; }

    /* Blockquote — destaque / nota importante */
    .markdown-body blockquote {
      border-left: 3px solid #00C896;
      margin: 1em 0;
      padding: 10px 14px;
      background: rgba(0, 200, 150, 0.07);
      border-radius: 0 8px 8px 0;
      color: #94A3B8;
      font-style: italic;
    }
    .markdown-body blockquote p { margin: 0; }

    /* Inline code */
    .markdown-body code {
      background: rgba(0, 200, 150, 0.12);
      border: 1px solid rgba(0, 200, 150, 0.2);
      border-radius: 4px;
      padding: 1px 6px;
      font-size: 0.82em;
      font-family: 'Courier New', monospace;
      color: #67E8F9;
    }

    /* Code block */
    .markdown-body pre {
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px;
      padding: 14px 16px;
      overflow-x: auto;
      margin: 1em 0;
    }
    .markdown-body pre code {
      background: none;
      border: none;
      padding: 0;
      font-size: 0.83rem;
      color: #A5F3FC;
    }

    /* ── Flow Diagram Visual Components ─────────────────────── */
    .flow-box {
      position: relative;
      background: linear-gradient(140deg, rgba(0,200,150,0.07) 0%, rgba(56,189,248,0.07) 100%);
      border: 1px solid rgba(0,200,150,0.3);
      border-radius: 14px;
      padding: 38px 18px 20px;
      margin: 1.4em 0;
      overflow-x: auto;
    }
    .flow-box::before {
      content: "FLUXO";
      position: absolute;
      top: 10px; left: 14px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.58rem; font-weight: 700;
      letter-spacing: 0.14em;
      color: #00C896;
      background: rgba(0,200,150,0.12);
      border: 1px solid rgba(0,200,150,0.3);
      border-radius: 20px;
      padding: 2px 9px;
    }
    /* Shared step box */
    .flow-step {
      display: inline-flex; align-items: center; justify-content: center;
      padding: 7px 15px;
      border: 1.5px solid; border-radius: 9px;
      font-family: 'DM Sans', sans-serif; font-size: 0.82rem; font-weight: 600;
      text-align: center; line-height: 1.35; flex-shrink: 0;
    }
    .flow-step-dim { opacity: 0.72; border-style: dashed !important; }
    /* Vertical flow */
    .flow-v {
      display: flex; flex-direction: column;
      align-items: center; gap: 3px; padding: 4px 0;
    }
    .flow-v .flow-step { min-width: 200px; max-width: 90%; white-space: normal; }
    .flow-vc {
      color: #00C896; font-size: 1.35rem; line-height: 1.5;
      text-align: center; user-select: none;
    }
    .flow-vc-note {
      font-family: 'DM Sans', sans-serif; font-size: 0.74rem;
      color: #475569; text-align: center; line-height: 1.8;
    }
    .flow-vc-note span { color: #7DD3FC; }
    /* Horizontal flow */
    .flow-h {
      display: flex; flex-wrap: wrap;
      align-items: center; justify-content: center;
      gap: 5px; padding: 4px 0;
    }
    .flow-ha {
      color: #00C896; font-size: 1.05rem; font-weight: 700;
      flex-shrink: 0; padding: 0 1px; user-select: none;
    }
    /* Gene structure */
    .flow-gene .flow-step { font-size: 0.76rem; padding: 5px 11px; }
    .flow-gene .flow-ha { color: #475569; font-weight: 400; font-size: 0.85rem; }
    .flow-label {
      font-family: 'DM Sans', sans-serif; font-size: 0.8rem;
      color: #94A3B8; padding: 0 3px;
    }
    /* Branch annotation */
    .flow-branch {
      margin-top: 12px; padding-top: 10px;
      border-top: 1px dashed rgba(148,163,184,0.2);
      display: flex; flex-direction: column; align-items: center; gap: 5px;
    }
    .flow-branch-arr { color: #00C896; font-size: 1.2rem; line-height: 1.4; }
    .flow-branch-note {
      font-family: 'DM Sans', sans-serif; font-size: 0.77rem;
      color: #94A3B8; text-align: center;
    }
    .flow-branch-note .fba { color: #00C896; font-weight: 700; }
    .flow-step-branch { font-size: 0.79rem; }
    /* Raw fallback */
    .flow-raw {
      font-family: 'Lexend', 'DM Sans', sans-serif; font-size: 0.84rem;
      color: #E2E8F0; text-align: center; line-height: 1.9; white-space: pre-wrap;
    }

    /* Horizontal rule */
    .markdown-body hr {
      border: none;
      border-top: 1px solid rgba(255,255,255,0.1);
      margin: 1.5em 0;
    }

    /* Tables */
    .markdown-body .table-wrap {
      overflow-x: auto;
      border-radius: 10px;
      border: 1px solid rgba(0, 200, 150, 0.25);
      margin: 1.2em 0;
      background: rgba(255,255,255,0.04);
      box-shadow: 0 2px 12px rgba(0,0,0,0.2), inset 0 1px 0 rgba(0,200,150,0.08);
    }
    .markdown-body table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
      min-width: 360px;
    }
    .markdown-body thead tr {
      background: rgba(0, 200, 150, 0.18);
      border-bottom: 2px solid rgba(0, 200, 150, 0.35);
    }
    .markdown-body th {
      padding: 10px 14px;
      font-weight: 600;
      color: #E2E8F0;
      text-align: left;
      white-space: nowrap;
      font-size: 0.82rem;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }
    .markdown-body td {
      padding: 9px 14px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      color: #CBD5E1;
      line-height: 1.5;
    }
    .markdown-body tbody tr:nth-child(even) { background: rgba(255,255,255,0.03); }
    .markdown-body tbody tr:last-child td { border-bottom: none; }
    .markdown-body tbody tr:hover { background: rgba(0, 200, 150, 0.07); transition: background 0.15s; }

    /* Checklist interativo */
    .markdown-body input[type="checkbox"] {
      accent-color: #00C896;
      cursor: pointer;
      width: 15px;
      height: 15px;
      vertical-align: middle;
      margin-right: 6px;
      flex-shrink: 0;
    }
    .markdown-body li:has(input[type="checkbox"]) {
      list-style: none;
      margin-left: -1.3em;
      display: flex;
      align-items: flex-start;
      gap: 2px;
      padding: 3px 0;
      border-radius: 6px;
      transition: background 0.15s;
    }
    .markdown-body li:has(input[type="checkbox"]:checked) {
      color: #475569;
      text-decoration: line-through;
      text-decoration-color: #334155;
    }

    /* Pré-Prova amber headings override */
    .markdown-body.preprova-content h2 {
      color: #FCD34D;
      border-left-color: #F59E0B;
    }
    .markdown-body.preprova-content h3 { color: #FBBF24; }
    .markdown-body.preprova-content ul li::marker { color: #F59E0B; }
    .markdown-body.preprova-content blockquote {
      border-left-color: #F59E0B;
      background: rgba(245,158,11,0.07);
    }

    /* Profile Screen */
    .profile-avatar {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary), var(--purple));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: 700;
      font-family: 'Outfit', sans-serif;
      color: #fff;
      margin: 0 auto 8px;
      box-shadow: 0 4px 16px rgba(0, 200, 150, 0.3);
    }

    .profile-name {
      font-size: 18px;
      font-weight: 700;
      color: var(--text-primary);
      text-align: center;
      margin-bottom: 4px;
      font-family: 'Outfit', sans-serif;
    }

    .profile-meta {
      font-size: 13px;
      color: var(--text-secondary);
      text-align: center;
      margin-bottom: 24px;
    }

    .profile-section {
      background: var(--surface-2);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: var(--shadow-sm);
    }

    .profile-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 11px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .profile-item:last-child {
      border-bottom: none;
    }

    .profile-label {
      font-size: 12px;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 600;
    }

    .profile-value {
      font-size: 14px;
      color: var(--text-primary);
      font-weight: 600;
      word-break: break-all;
      text-align: right;
    }

    .profile-value-small {
      font-size: 11px;
      font-family: 'Courier New', monospace;
      color: var(--text-secondary);
    }

    .profile-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 16px;
    }

    .profile-stat {
      background: var(--surface-2);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      padding: 14px 12px;
      text-align: center;
      box-shadow: var(--shadow-sm);
    }

    .profile-stat-icon {
      font-size: 18px;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .profile-stat-value {
      font-size: 22px;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 4px;
      font-family: 'Outfit', sans-serif;
    }

    .profile-stat-label {
      font-size: 10px;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 600;
    }

    /* Bottom Navigation */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      max-width: 430px;
      margin: 0 auto;
      background: rgba(24, 28, 39, 0.96);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid var(--border-subtle);
      box-shadow: 0 -4px 24px rgba(0, 0, 0, 0.3);
      display: flex;
      justify-content: space-around;
      padding: 8px 4px 20px;
      z-index: 100;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      cursor: pointer;
      padding: 6px 12px;
      border-radius: 12px;
      transition: background var(--duration-fast) ease, color var(--duration-fast) ease;
      position: relative;
      min-width: 56px;
    }

    .nav-item.active {
      color: var(--primary);
      background: rgba(0, 200, 150, 0.12);
    }

    .nav-item.active::after {
      content: '';
      position: absolute;
      top: -8px;
      left: 50%;
      transform: translateX(-50%);
      width: 20px;
      height: 2px;
      background: var(--primary);
      border-radius: 0 0 2px 2px;
    }

    .nav-item:not(.active) {
      color: var(--text-secondary);
    }

    .nav-item:not(.active):active {
      background: var(--surface-2);
    }

    .nav-icon {
      width: 22px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .nav-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.01em;
    }

    /* Loading */
    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--border-card);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Semester Selector */
    .semester-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 24px;
    }

    .semester-btn {
      padding: 14px 8px;
      border: 2px solid var(--border-card);
      border-radius: 12px;
      background: var(--bg-card);
      color: var(--text-secondary);
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
      min-height: auto;
      text-transform: none;
      letter-spacing: 0;
    }

    .semester-btn:hover {
      border-color: var(--primary);
      color: var(--primary);
      background: rgba(0, 200, 150, 0.08);
      transform: none;
      box-shadow: none;
    }

    .semester-btn.selected {
      border-color: var(--primary);
      background: rgba(0, 200, 150, 0.15);
      color: var(--primary);
    }

    .institution-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 16px;
    }

    .institution-card {
      border: 1px solid var(--border-card);
      border-radius: 14px;
      padding: 14px;
      background: var(--bg-card);
      cursor: pointer;
      transition: all 0.2s ease;
      min-height: 92px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 8px;
    }

    .institution-card:hover {
      border-color: var(--primary);
      background: rgba(0, 200, 150, 0.08);
    }

    .institution-card.selected {
      border-color: var(--primary);
      background: rgba(0, 200, 150, 0.12);
      box-shadow: 0 0 0 1px rgba(0, 200, 150, 0.15) inset;
    }

    .institution-card.disabled {
      opacity: 0.5;
      cursor: not-allowed;
      filter: grayscale(0.15);
    }

    .institution-name {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1.3;
    }

    .institution-meta {
      font-size: 11px;
      color: var(--text-secondary);
      line-height: 1.4;
    }

    .institution-badge {
      display: inline-flex;
      align-items: center;
      width: fit-content;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      border-radius: 999px;
      padding: 4px 8px;
      background: rgba(0, 200, 150, 0.15);

  <!-- Service Worker: registro + limpeza de SWs antigos de deploys anteriores -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {

        // Limpar SWs de versões anteriores registrados em paths diferentes
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          registrations.forEach(function(reg) {
            var url = reg.active ? reg.active.scriptURL : (reg.installing ? reg.installing.scriptURL : '');
            if (!url.endsWith('/sw.js')) reg.unregister();
          });
        });

        // Registrar SW atual
        navigator.serviceWorker.register('/sw.js').then(function(registration) {
          if (registration.waiting) {
            registration.waiting.postMessage({ type: 'SKIP_WAITING' });
          }
          registration.addEventListener('updatefound', function() {
            var newWorker = registration.installing;
            if (!newWorker) return;
            newWorker.addEventListener('statechange', function() {
              if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                newWorker.postMessage({ type: 'SKIP_WAITING' });
              }
            });
          });
        }).catch(function(err) {
          console.warn('MedGrad+: SW registration failed:', err);
        });

        // Recarregar quando novo SW assumir o controle
        var refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', function() {
          if (refreshing) return;
          refreshing = true;
          window.location.reload();
        });

      });
    }
  </script>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback, useMemo } = React;

    // ===================== Flow diagram parser =====================
    function buildFlowHTML(raw) {
      const COLORS = ['#00C896','#38BDF8','#A78BFA','#34D399','#FB923C','#F472B6'];
      function rgb(hex) {
        return [parseInt(hex.slice(1,3),16), parseInt(hex.slice(3,5),16), parseInt(hex.slice(5,7),16)];
      }
      function stepStyle(i, overrideColor) {
        const c = overrideColor || COLORS[i % COLORS.length];
        const [r,g,b] = rgb(c);
        return `border-color:${c};background:rgba(${r},${g},${b},0.13);color:${c}`;
      }
      function mkStep(text, idx, extra) {
        const plus = text.startsWith('+');
        const label = plus ? text.slice(1).trim() : text;
        const cls = 'flow-step' + (plus ? ' flow-step-dim' : '') + (extra || '');
        return `<div class="${cls}" style="${stepStyle(idx)}">${label}</div>`;
      }

      const lines = raw.split('\n').filter(l => l.trim());
      const trimmed = lines.map(l => l.trim());

      // ── Vertical flow (has standalone ↓ lines) ─────────────────
      if (trimmed.some(l => l === '↓')) {
        let html = '<div class="flow-v">'; let si = 0;
        for (const line of trimmed) {
          if (line === '↓') {
            html += '<div class="flow-vc">↓</div>';
          } else if (/^↓\s+(.+)$/.test(line)) {
            const note = line.match(/^↓\s+(.+)$/)[1];
            html += `<div class="flow-vc-note">↓ <span>${note}</span></div>`;
          } else {
            html += mkStep(line, si++);
          }
        }
        return html + '</div>';
      }

      // ── Gene structure ([Token] separated by ——) ──────────────
      const geneLine = trimmed.find(l => /\[.+\]/.test(l) && !l.includes('→'));
      if (geneLine) {
        const parts = geneLine.split('——').map(p => p.trim()).filter(Boolean);
        let html = '<div class="flow-h flow-gene">';
        parts.forEach((p, i) => {
          if (p.startsWith('[') && p.endsWith(']')) {
            const label = p.slice(1,-1);
            let c;
            if (/exon/i.test(label))        c = '#00C896';
            else if (/[íi]nton/i.test(label)) c = '#64748B';
            else if (/utr/i.test(label))    c = '#38BDF8';
            else if (/poly/i.test(label))   c = '#A78BFA';
            else                             c = '#FB923C';
            const [r,g,b] = rgb(c);
            html += `<div class="flow-step" style="border-color:${c};background:rgba(${r},${g},${b},0.13);color:${c}">${label}</div>`;
          } else {
            html += `<div class="flow-label">${p}</div>`;
          }
          if (i < parts.length - 1) html += '<div class="flow-ha">——</div>';
        });
        html += '</div>';
        const others = trimmed.filter(l => l !== geneLine);
        if (others.length) html += '<div class="flow-branch">' + others.map(l => `<div class="flow-branch-note">${l}</div>`).join('') + '</div>';
        return html;
      }

      // ── Horizontal flow (→ separators) ────────────────────────
      const mainLine = trimmed.find(l => l.includes('→'));
      if (!mainLine) {
        return '<div class="flow-raw">' + trimmed.join('<br>') + '</div>';
      }
      const branchLines = trimmed.filter(l => l !== mainLine);
      const steps = mainLine.split('→').map(s => s.trim()).filter(Boolean);
      let html = '<div class="flow-h">';
      steps.forEach((step, i) => {
        html += `<div class="flow-step" style="${stepStyle(i)}">${step}</div>`;
        if (i < steps.length - 1) html += '<div class="flow-ha">→</div>';
      });
      html += '</div>';

      if (branchLines.length) {
        html += '<div class="flow-branch">';
        let pendingArr = null;
        for (const bl of branchLines) {
          const arrMatch = bl.match(/^([↑↓]{1,2})\s*(.*)$/);
          if (arrMatch) {
            const [, arr, note] = arrMatch;
            if (note.trim()) {
              html += `<div class="flow-branch-note"><span class="fba">${arr}</span> ${note}</div>`;
            } else {
              pendingArr = arr;
            }
          } else if (bl.trim()) {
            if (pendingArr) { html += `<div class="flow-branch-arr">${pendingArr}</div>`; pendingArr = null; }
            const c = COLORS[steps.length % COLORS.length]; const [r,g,b] = rgb(c);
            html += `<div class="flow-step flow-step-branch" style="border-color:${c};background:rgba(${r},${g},${b},0.13);color:${c}">${bl}</div>`;
          }
        }
        if (pendingArr) html += `<div class="flow-branch-arr">${pendingArr}</div>`;
        html += '</div>';
      }
      return html;
    }

    // ===================== Markdown renderer =====================
    function renderMd(text) {
      const cleaned = text
        .replace(/\r\n/g, '\n')
        .replace(/(\|[^\n]*)\n\n+(?=\|)/g, '$1\n');
      let html = marked.parse(cleaned)
        .replace(/<table>/g, '<div class="table-wrap"><table>')
        .replace(/<\/table>/g, '</table></div>');
      html = html.replace(
        /<pre><code class="language-flow">([\s\S]*?)<\/code><\/pre>/g,
        (_, content) => {
          const raw = content
            .replace(/&amp;/g, '&').replace(/&lt;/g, '<')
            .replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&#39;/g, "'");
          return '<div class="flow-box">' + buildFlowHTML(raw) + '</div>';
        }
      );
      return html;
    }

    // ===================== Utilities =====================

    // Device Fingerprint
    const generateDeviceFingerprint = async () => {
      const userAgent = navigator.userAgent;
      const screen_res = `${screen.width}x${screen.height}`;
      const timezone = Intl.DateTimeFormat().resolvedOptions().timeZone;

      let canvas_hash = '';
      try {
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        ctx.fillText('MedGradPlus', 10, 10);
        canvas_hash = canvas.toDataURL().substring(0, 50);
      } catch (e) {}

      return `${userAgent.substring(0, 30)}_${screen_res}_${timezone}_${canvas_hash}`.substring(0, 128);
    };

    // SM-2 Algorithm
    const SM2 = {
      calculateNextReview: (quality, reps, ef, interval) => {
        let newReps = reps + 1;
        let newEf = ef + 0.1 - (5 - quality) * (0.08 + (5 - quality) * 0.02);
        if (newEf < 1.3) newEf = 1.3;

        let newInterval;
        if (newReps === 1) newInterval = 1;
        else if (newReps === 2) newInterval = 3;
        else newInterval = Math.round(interval * newEf);

        const nextReview = Date.now() + (newInterval * 24 * 60 * 60 * 1000);
        return { newReps, newEf, newInterval, nextReview };
      },

      getDueCards: (cards, srData) => {
        const now = Date.now();
        return cards.filter(card => {
          const data = srData[card.id] || { nextReview: 0 };
          return data.nextReview <= now;
        }).sort((a, b) => {
          const aData = srData[a.id] || { nextReview: 0 };
          const bData = srData[b.id] || { nextReview: 0 };
          return aData.nextReview - bData.nextReview;
        });
      },

      // Only returns cards already seen at least once (reps > 0) that are due
      getReviewDueCards: (cards, srData) => {
        const now = Date.now();
        return cards.filter(card => {
          const data = srData[card.id];
          return data !== undefined && !data.buried && data.nextReview <= now;
        }).sort((a, b) => srData[a.id].nextReview - srData[b.id].nextReview);
      }
    };

    // Format time
    const formatTime = (ms) => {
      const seconds = Math.floor(ms / 1000);
      const minutes = Math.floor(seconds / 60);
      const hours = Math.floor(minutes / 60);

      if (hours > 0) return `${hours}h ${minutes % 60}m`;
      if (minutes > 0) return `${minutes}m ${seconds % 60}s`;
      return `${seconds}s`;
    };

    async function submitContentFeedback(payload) {
      const currentUser = window.__fbAuth?.currentUser || null;
      const localUser = JSON.parse(localStorage.getItem('meduni9_user') || '{}');
      const body = {
        tipo: 'bug',
        origem: payload.origem || 'geral',
        mensagem: payload.mensagem || 'Erro reportado pelo usuário',
        itemId: payload.itemId || '',
        materia: payload.materia || '',
        disciplina: payload.materia || '',
        tema: payload.tema || '',
        contexto: payload.contexto || null,
        userEmail: currentUser?.email || localUser?.email || '',
        userId: currentUser?.uid || localUser?.uid || '',
      };

      const endpoints = [
        '/api/feedback/raw/create',
        'http://127.0.0.1:3001/api/feedback/raw/create',
        'http://localhost:3001/api/feedback/raw/create',
      ];

      for (const endpoint of endpoints) {
        try {
          const res = await fetch(endpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body),
          });
          if (!res.ok) continue;
          const contentType = res.headers.get('content-type') || '';
          if (!contentType.includes('application/json')) continue;
          const data = await res.json();
          if (data.ok) return data;
        } catch {}
      }

      throw new Error('Falha ao enviar feedback');

    // ===================== Security Utilities =====================
    const CODE_SALT = 'meduni9_2026_';
    const MAX_ATTEMPTS = 5;
    const LOCKOUT_BASE_MS = 60000; // 1 minute base lockout

    async function hashCode(code) {
      const encoder = new TextEncoder();
      const data = encoder.encode(CODE_SALT + code);
      const hashBuffer = await crypto.subtle.digest('SHA-256', data);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    function getRateLimitState() {
      try {
        const raw = localStorage.getItem('meduni9_rl');
        if (!raw) return { attempts: 0, lockedUntil: 0, history: [] };
        return JSON.parse(raw);
      } catch { return { attempts: 0, lockedUntil: 0, history: [] }; }
    }

    function setRateLimitState(state) {
      localStorage.setItem('meduni9_rl', JSON.stringify(state));
    }

    function checkRateLimit() {
      const state = getRateLimitState();
      const now = Date.now();
      if (state.lockedUntil > now) {
        const remainSec = Math.ceil((state.lockedUntil - now) / 1000);
        const mins = Math.floor(remainSec / 60);
        const secs = remainSec % 60;
        return { allowed: false, message: `Muitas tentativas. Tente novamente em ${mins}m${secs}s.` };
      }
      // Clear old attempts (older than 10 minutes)
      state.history = (state.history || []).filter(t => now - t < 600000);
      if (state.history.length >= MAX_ATTEMPTS) {
        // Exponential backoff: 1min, 2min, 4min, 8min, 16min, max 30min
        const lockoutMs = Math.min(LOCKOUT_BASE_MS * Math.pow(2, state.attempts - MAX_ATTEMPTS), 1800000);
        state.lockedUntil = now + lockoutMs;
        state.attempts++;
        setRateLimitState(state);
        return { allowed: false, message: `Muitas tentativas. Bloqueado por ${Math.ceil(lockoutMs/60000)} minutos.` };
      }
      return { allowed: true };
    }

    function recordFailedAttempt() {
      const state = getRateLimitState();
      state.history = [...(state.history || []), Date.now()];
      state.attempts = (state.attempts || 0) + 1;
      setRateLimitState(state);
    }

    function resetRateLimit() {
      localStorage.removeItem('meduni9_rl');
