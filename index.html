    };

    const FC_CATEGORY_LABELS = {
      definicao: 'Definição',
      mecanismo: 'Mecanismo',
      clinica: 'Clínica',
      diferenciacao: 'Diferenciação',
      prova: 'Prova',
      extra_livro: 'Extra (livro)',
    };
    const FC_CATEGORY_ORDER = ['definicao', 'mecanismo', 'clinica', 'diferenciacao', 'prova', 'extra_livro'];
    const CLOZE_REGEX_GLOBAL = /\{\{c\d+::([^}|]+)(?:\|[^}]+)?\}\}/g;
    const CLOZE_REGEX_SINGLE = /\{\{c\d+::([^}|]+)(?:\|[^}]+)?\}\}/;

    function parseCloze(text) {
      if (typeof text !== 'string' || !text.trim()) return null;
      const matches = [...text.matchAll(CLOZE_REGEX_GLOBAL)];
      if (!matches.length) return null;
      
      const answers = matches.map((m) => (m[1] || '').trim()).filter(Boolean);
      
      // Front: Replace with styled placeholder [...]
      const frontMasked = text.replace(CLOZE_REGEX_GLOBAL, '<span class="cloze-gap">[...]</span>');
      
      // Back: Replace with highlighted answer
      const backHighlighted = text.replace(CLOZE_REGEX_GLOBAL, (match, p1) => {
        return `<span class="cloze-answer">${p1}</span>`;
      });

      return {
        frontMasked,
        backHighlighted,
        answers,
      };
    }

    // Flashcards Screen
    const FlashcardsScreen = ({ flashcards, materias, selectedMateria, onSelectMateria, userSemester, initialAulaId, onGoHome }) => {
      const [currentIndex, setCurrentIndex] = useState(0);
      const [isFlipped, setIsFlipped] = useState(false);
      const [sessionComplete, setSessionComplete] = useState(false);
      const [sessionStats, setSessionStats] = useState({ correct: 0, total: 0 });
      const [semesterFilter, setSemesterFilter] = useState(userSemester || null);
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedTemas, setSelectedTemas] = useState([]);
      const [selectedCategorias, setSelectedCategorias] = useState([]);
      const [studying, setStudying] = useState(false);
      const [sessionDeck, setSessionDeck] = useState([]);
      const [srTick, setSrTick] = useState(0);
      const [reportFlashOpen, setReportFlashOpen] = useState(false);
      const [reportFlashReason, setReportFlashReason] = useState('');
      const [reportFlashSending, setReportFlashSending] = useState(false);
      const [reportFlashError, setReportFlashError] = useState('');
      const [reportFlashTarget, setReportFlashTarget] = useState(null);
      const routeAulaAppliedRef = useRef(false);
      const srData = useMemo(() => JSON.parse(localStorage.getItem('meduni9_sr_data') || '{}'), [srTick]);

      useEffect(() => {
        setCurrentIndex(0);
        setIsFlipped(false);
        setSessionComplete(false);
        setSessionStats({ correct: 0, total: 0 });
        setStudying(false);
        setSelectedTemas([]);
        setSelectedCategorias([]);
        setSessionDeck([]);
        routeAulaAppliedRef.current = false;
      }, [selectedMateria]);

      useEffect(() => {
        if (!selectedMateria) routeAulaAppliedRef.current = false;
      }, [selectedMateria]);

      useEffect(() => {
        routeAulaAppliedRef.current = false;
      }, [initialAulaId]);

      const pureFlashcards = useMemo(() => flashcards.filter(f => f.tipo !== 'quiz'), [flashcards]);

      const filteredByMateria = useMemo(
        () => pureFlashcards.filter(f => !selectedMateria || f.materia === selectedMateria),
        [pureFlashcards, selectedMateria]
      );

      useEffect(() => {
        if (routeAulaAppliedRef.current || !initialAulaId || !selectedMateria) return;
        const ok = pureFlashcards.some(f => f.materia === selectedMateria && f.tema === initialAulaId);
        if (ok) {
          const temaCards = pureFlashcards.filter(
            (f) => f.materia === selectedMateria && f.tema === initialAulaId && !srData[f.id]?.buried
          );
          const due = SM2.getDueCards(temaCards, srData);
          const autoDeck = due.length > 0 ? due : [...temaCards].sort(() => Math.random() - 0.5);
          setSelectedTemas([initialAulaId]);
          setSessionDeck(autoDeck);
          setCurrentIndex(0);
          setIsFlipped(false);
          setSessionComplete(false);
          setSessionStats({ correct: 0, total: 0 });
          setStudying(true);
          routeAulaAppliedRef.current = true;
        }
      }, [initialAulaId, selectedMateria, pureFlashcards, srData]);

      const filtered = useMemo(() => {
        let pool = filteredByMateria.filter((f) => !srData[f.id]?.buried);
        if (selectedTemas.length > 0) pool = pool.filter((f) => selectedTemas.includes(f.tema));
        if (selectedCategorias.length > 0) pool = pool.filter((f) => f.categoria && selectedCategorias.includes(f.categoria));
        return pool;
      }, [filteredByMateria, selectedTemas, selectedCategorias, srData]);

      const availableCategories = useMemo(() => {
        const set = new Set();
        filteredByMateria.forEach((f) => {
          if (f.categoria) set.add(f.categoria);
        });
        return FC_CATEGORY_ORDER.filter((c) => set.has(c));
      }, [filteredByMateria]);

      const toggleCategoria = (cat) => {
        setSelectedCategorias((prev) =>
          prev.includes(cat) ? prev.filter((c) => c !== cat) : [...prev, cat]
        );
      };

      const buildDeck = useCallback(
        (cards) => {
          const due = SM2.getDueCards(cards, srData);
          if (due.length > 0) return due;
          return [...cards].sort(() => Math.random() - 0.5);
        },
        [srData]
      );

      const deck = useMemo(() => {
        if (!selectedMateria) return [];
        return buildDeck(filtered);
      }, [selectedMateria, filtered, buildDeck]);

      const currentCard = sessionDeck[currentIndex];
      const currentCardCloze = parseCloze(currentCard?.pergunta);

      const handleRate = useCallback((quality) => {
        const card = currentCard;
        if (!card) return;
        const raw = JSON.parse(localStorage.getItem('meduni9_sr_data') || '{}');
        const prev = normalizeSrEntry(raw[card.id]) || { reps: 0, ef: 2.5, interval: 0, nextReview: Date.now() };
        const result = SM2.calculateNextReview(quality, prev.reps, prev.ef, prev.interval);
        raw[card.id] = {
          reps: result.reps,
          ef: result.ef,
          interval: result.interval,
          nextReview: result.nextReview,
          buried: false,
        };
        localStorage.setItem('meduni9_sr_data', JSON.stringify(raw));
        setSrTick((t) => t + 1);

        const isGood = quality >= 3;
        const newStats = { ...sessionStats, total: sessionStats.total + 1, correct: sessionStats.correct + (isGood ? 1 : 0) };

        if (currentIndex < sessionDeck.length - 1) {
          setCurrentIndex(currentIndex + 1);
          setIsFlipped(false);
          setSessionStats(newStats);
        } else {
          setSessionStats(newStats);
          setSessionComplete(true);
        }
      }, [currentCard, currentIndex, sessionDeck, sessionStats]);

      const handleDeNovo = useCallback(() => {
        const card = currentCard;
        if (!card) return;
        const remaining = sessionDeck.length - currentIndex - 1;
        if (remaining > 0) {
          const newDeck = [
            ...sessionDeck.slice(0, currentIndex),
            ...sessionDeck.slice(currentIndex + 1),
            card,
          ];
          setSessionDeck(newDeck);
          setIsFlipped(false);
        } else {
          handleRate(1);
        }
      }, [currentCard, currentIndex, sessionDeck, handleRate]);

      const handleBury = () => {
        const card = currentCard;
        if (!card) return;
        const raw = JSON.parse(localStorage.getItem('meduni9_sr_data') || '{}');
        const prev = normalizeSrEntry(raw[card.id]) || { reps: 0, ef: 2.5, interval: 0, nextReview: Date.now() };
        raw[card.id] = { ...prev, buried: true };
        localStorage.setItem('meduni9_sr_data', JSON.stringify(raw));
        setSrTick((t) => t + 1);
        if (currentIndex < sessionDeck.length - 1) {
          setCurrentIndex(currentIndex + 1);
          setIsFlipped(false);
        } else {
          setSessionComplete(true);
        }
      };

      useEffect(() => {
        if (!studying || sessionComplete) return;
        const handleKey = (e) => {
          if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
          if (!isFlipped) {
            if (e.code === 'Space' || e.key === ' ') {
              e.preventDefault();
              setIsFlipped(true);
            }
          } else {
            if (e.key === '1') handleDeNovo();
            else if (e.key === '2') handleRate(5);
            else if (e.key === '3') handleRate(3);
            else if (e.key === '4') handleRate(2);
            else if (e.code === 'Space' || e.key === ' ') {
              e.preventDefault();
              setIsFlipped(false);
            }
          }
        };
        window.addEventListener('keydown', handleKey);
        return () => window.removeEventListener('keydown', handleKey);
      }, [studying, sessionComplete, isFlipped, currentIndex, handleRate, handleDeNovo]);

      const handleReport = () => {
        const card = currentCard;
        if (!card) return;
        setReportFlashTarget(card);
        setReportFlashReason('');
        setReportFlashError('');
        setReportFlashOpen(true);
      };

      const submitFlashReport = async () => {
        if (!reportFlashTarget) return;
        setReportFlashSending(true);
        setReportFlashError('');
        try {
          await submitContentFeedback({
            origem: 'flashcards',
            mensagem: reportFlashReason?.trim() || 'Erro reportado em flashcard',
            itemId: reportFlashTarget.id,
            materia: reportFlashTarget.materia,
            tema: reportFlashTarget.tema,
            contexto: {
              pergunta: reportFlashTarget.pergunta,
              resposta: reportFlashTarget.resposta,
              explicacao: reportFlashTarget.explicacao || ''
            }
          });
          setReportFlashOpen(false);
          setReportFlashTarget(null);
        } catch (e) {
          setReportFlashError('Nao foi possivel enviar agora. Tente novamente em instantes.');
        } finally {
          setReportFlashSending(false);
        }
      };

      const resetSession = () => {
        setCurrentIndex(0);
        setIsFlipped(false);
        setSessionComplete(false);
        setSessionStats({ correct: 0, total: 0 });
        setStudying(false);
        setSelectedTemas([]);
        setSelectedCategorias([]);
        setSessionDeck([]);
      };

      const toggleTema = (temaId) => {
        setSelectedTemas(prev =>
          prev.includes(temaId) ? prev.filter(t => t !== temaId) : [...prev, temaId]
        );
      };

      // Materia selection screen
      if (!selectedMateria) {
        const allMaterias = materias.filter(m => m.ativo !== false);
        const semFiltered = semesterFilter ? allMaterias.filter(m => m.modulo === semesterFilter) : allMaterias;
        const filteredMaterias = semFiltered.filter(m => fuzzyMatch(searchQuery, m.nome) || fuzzyMatch(searchQuery, m.sigla || ''));
        const semesters = [...new Set(allMaterias.map(m => m.modulo))].sort((a,b) => a-b);

        return (
          <>
            <div className="screen-content">
              <h2 className="section-title">Flashcards</h2>
              {semesters.length > 1 && (
                <div className="semester-tabs">
                  <button className={`semester-tab ${!semesterFilter ? 'active' : ''}`} onClick={() => setSemesterFilter(null)}>Todos</button>
                  {semesters.map(s => (
                    <button key={s} className={`semester-tab ${semesterFilter === s ? 'active' : ''}`} onClick={() => setSemesterFilter(s)}>Módulo {s}</button>
                  ))}
                </div>
              )}
              <div className="subject-search-wrap">
                <span className="subject-search-icon"><IconSearch /></span>
                <input type="search" className="subject-search" placeholder="Buscar matéria..." value={searchQuery} onChange={e => setSearchQuery(e.target.value)} />
              </div>
              <div className="subject-select-list">
                {filteredMaterias.length === 0 && (
                  <div style={{ textAlign: 'center', padding: '40px 0', color: 'var(--text-secondary)' }}><p>Nenhum resultado encontrado.</p></div>
                )}
                {filteredMaterias.map(m => {
                  const count = pureFlashcards.filter(f => f.materia === m.id).length;
                  const dueCount = SM2.getDueCards(pureFlashcards.filter(f => f.materia === m.id), srData).length;
                  const reviewedCount = count - dueCount;
                  const pct = count > 0 ? Math.round((reviewedCount / count) * 100) : 0;
                  const subjectColor = SUBJECT_ICON_MAP[m.id]?.color || m.cor || 'var(--primary)';
                  return (
                    <div key={m.id} className={`subject-select-card${count === 0 ? ' subject-card-empty' : ''}`} onClick={() => { onSelectMateria(m.id); setStudying(false); }}>
                      <SubjectIcon materiaId={m.id} icon={m.icon} cor={m.cor} />
                      <div className="subject-select-info">
                        <div className="subject-select-name">{m.sigla || m.nome}</div>
                        <div className="subject-select-meta">
                          {count > 0 ? `${count} cards${dueCount > 0 ? ` — ${dueCount} para revisar` : ' — em dia ✓'}` : 'Em breve'}
                        </div>
                        {count > 0 && (
                          <div className="subject-progress-bar">
                            <div className="subject-progress-fill" style={{ width: `${pct}%`, background: subjectColor }} />
                          </div>
                        )}
                      </div>
                      <div style={{ color: 'var(--text-secondary)' }}><IconChevronRight /></div>
                    </div>
                  );
                })}
              </div>
            </div>
          </>
        );
      }

      const selectedMateriaObj = materias.find(m => m.id === selectedMateria);
      const backLabel = selectedMateriaObj ? (selectedMateriaObj.sigla || selectedMateriaObj.nome) : 'Flashcards';
      const exitToHome = onGoHome || (() => onSelectMateria(null));

      // Tema selector
      if (!studying) {
        const totalCards = filteredByMateria.length;
        const dueTotal = SM2.getDueCards(filteredByMateria, srData).length;
        const materiaObj = materias.find(m => m.id === selectedMateria);
        const temasFromCards = [...new Set(filteredByMateria.map(f => f.tema).filter(Boolean))];

        // Use aulas from materias.json for organized display
        const aulas = materiaObj?.aulas || [];
        const hasAulas = aulas.length > 0;

        return (
          <>
            <div className="screen-content">
              <button className="back-btn" onClick={exitToHome}>← Início</button>
              <h2 className="section-title">{backLabel}</h2>
              <p style={{ color: 'var(--text-secondary)', fontSize: '14px', marginBottom: '16px' }}>
                {totalCards > 0 ? (dueTotal > 0 ? `${dueTotal} cards para revisar hoje` : 'Todos os cards em dia!') : 'Nenhum flashcard ainda'} — {totalCards} total
              </p>
              {totalCards > 0 && availableCategories.length > 0 && (
                <div className="flashcards-category-chips">
                  <span className="flashcards-category-chips-label">Categoria</span>
                  <button
                    type="button"
                    className={'fc-cat-chip' + (selectedCategorias.length === 0 ? ' active' : '')}
                    onClick={() => setSelectedCategorias([])}
                  >
                    Todas
                  </button>
                  {availableCategories.map((cat) => (
                    <button
                      key={cat}
                      type="button"
                      className={'fc-cat-chip' + (selectedCategorias.includes(cat) ? ' active' : '')}
                      onClick={() => toggleCategoria(cat)}
                    >
                      {FC_CATEGORY_LABELS[cat] || cat}
                    </button>
                  ))}
                </div>
              )}
              <div className="subject-select-list" style={{ paddingBottom: selectedTemas.length > 0 ? '72px' : '0' }}>
                <div className="subject-select-card" onClick={() => {
                  let pool = filteredByMateria.filter(f => !srData[f.id]?.buried);
                  if (selectedCategorias.length > 0) pool = pool.filter(f => f.categoria && selectedCategorias.includes(f.categoria));
                  setSelectedTemas([]);
                  setSessionDeck(buildDeck(pool));
                  setStudying(true);
                }}
                  style={{ borderColor: 'var(--primary)', background: 'rgba(0,200,150,0.06)', marginBottom: '8px' }}>
                  <div className="subject-select-icon" style={{ background: 'rgba(0,200,150,0.15)', color: 'var(--primary)' }}><IconBookOpen /></div>
                  <div className="subject-select-info">
                    <div className="subject-select-name">Todos os assuntos</div>
                    <div className="subject-select-meta">{totalCards} cards{dueTotal > 0 ? ` — ${dueTotal} para revisar` : ''}</div>
                  </div>
                  <div style={{ color: 'var(--primary)' }}><IconChevronRight /></div>
                </div>

                {hasAulas ? (
                  aulas.map(aula => {
                    const cards = filteredByMateria.filter(f => f.tema === aula.id);
                    const dueCount = SM2.getDueCards(cards, srData).length;
                    const isChecked = selectedTemas.includes(aula.id);
                    const hasCards = cards.length > 0;
                    return (
                      <div key={aula.id} className={`subject-select-card${isChecked ? ' tema-selected' : ''}${!hasCards ? ' subject-card-empty' : ''}`} onClick={() => hasCards && toggleTema(aula.id)}>
                        <div className={`tema-checkbox${isChecked ? ' tema-checkbox-checked' : ''}`}>{isChecked ? '✓' : ''}</div>
                        <div className="subject-select-info">
                          <div className="subject-select-name">{aula.tema}</div>
                          <div className="subject-select-meta">{hasCards ? `${cards.length} cards${dueCount > 0 ? ` — ${dueCount} para revisar` : ' — em dia'}` : 'Em breve'}</div>
                        </div>
                      </div>
                    );
                  })
                ) : (
                  temasFromCards.sort().map(tema => {
                    const count = filteredByMateria.filter(f => f.tema === tema).length;
                    const dueCount = SM2.getDueCards(filteredByMateria.filter(f => f.tema === tema), srData).length;
                    const isChecked = selectedTemas.includes(tema);
                    return (
                      <div key={tema} className={`subject-select-card${isChecked ? ' tema-selected' : ''}`} onClick={() => toggleTema(tema)}>
                        <div className={`tema-checkbox${isChecked ? ' tema-checkbox-checked' : ''}`}>{isChecked ? '✓' : ''}</div>
                        <div className="subject-select-info">
                          <div className="subject-select-name">{tema}</div>
                          <div className="subject-select-meta">{count} cards{dueCount > 0 ? ` — ${dueCount} para revisar` : ' — em dia'}</div>
                        </div>
                      </div>
                    );
                  })
                )}
              </div>

              {selectedTemas.length > 0 && (
                <div className="tema-start-bar">
                  <span style={{ color: 'var(--text-secondary)', fontSize: '13px' }}>
                    {selectedTemas.length} assunto{selectedTemas.length > 1 ? 's' : ''} selecionado{selectedTemas.length > 1 ? 's' : ''}
                  </span>
                  <button className="btn btn-primary" style={{ padding: '8px 20px', fontSize: '14px' }} onClick={() => { setSessionDeck(buildDeck(filtered)); setStudying(true); }}>
                    Iniciar estudo →
                  </button>
                </div>
              )}
            </div>
          </>
        );
      }

      // Session complete
      if (sessionComplete) {
        return (
          <>
            <div className="screen-content">
              <div className="session-complete">
                <div className="session-icon">🎉</div>
                <h2 className="session-title">Sessão Concluída!</h2>
                <div className="session-stats">
                  <div className="session-stat">
                    <span className="session-stat-label">Cards Revisados</span>
                    <span className="session-stat-value">{sessionStats.total}</span>
                  </div>
                  <div className="session-stat">
                    <span className="session-stat-label">Acertos</span>
                    <span className="session-stat-value">{sessionStats.correct}</span>
                  </div>
                  <div className="session-stat">
                    <span className="session-stat-label">Taxa de Acerto</span>
                    <span className="session-stat-value">
                      {Math.round((sessionStats.correct / Math.max(sessionStats.total, 1)) * 100)}%
                    </span>
                  </div>
                </div>
                <button className="btn btn-primary" onClick={resetSession}>Nova Sessão</button>
                <button className="btn btn-secondary mt-2" onClick={() => { setStudying(false); setSelectedTemas([]); }}>Escolher outro assunto</button>
              </div>
            </div>
          </>
        );
      }

      // No cards
      if (deck.length === 0) {
        const hasAnyCards = filteredByMateria.length > 0;
        return (
          <>
            <div className="screen-content">
              <button className="back-btn" onClick={exitToHome}>← Início</button>
              <div style={{ textAlign: 'center', marginTop: '60px' }}>
                <div style={{ fontSize: '60px', marginBottom: '20px' }}>{hasAnyCards ? '✨' : '🚧'}</div>
                <p style={{ color: 'var(--text-secondary)', marginBottom: '20px' }}>
                  {hasAnyCards ? 'Nenhum card para revisar agora!' : 'Flashcards em breve para esta matéria.'}
                </p>
                {hasAnyCards && <p style={{ color: 'var(--text-secondary)', fontSize: '13px' }}>Todos os cards estão em dia. Volte mais tarde.</p>}
                <button className="btn btn-secondary mt-2" style={{ marginTop: '20px' }} onClick={exitToHome}>Voltar ao Início</button>
              </div>
            </div>
          </>
        );
      }

      // Anki-style flashcard study session
      return (
        <>
          <div className="screen-content">
            <button className="back-btn" onClick={exitToHome}>← Início</button>

            <div className="flashcard-progress" style={{ marginBottom: '16px' }}>
              <div style={{ textAlign: 'center', fontSize: '13px', color: 'var(--text-secondary)', marginBottom: '8px' }}>
                {currentIndex + 1} de {sessionDeck.length}
              </div>
              <div className="progress-dots">
                {sessionDeck.slice(0, Math.min(sessionDeck.length, 30)).map((card, idx) => (
                  <div key={idx} className={`progress-dot ${idx === currentIndex ? 'current' : ''} ${idx < currentIndex ? 'completed' : ''}`}></div>
                ))}
                {sessionDeck.length > 30 && <span style={{ color: 'var(--text-secondary)', fontSize: '11px' }}>+{sessionDeck.length - 30}</span>}
              </div>
            </div>

            <div className="flashcard-container">
              <div className="flashcard" onClick={() => setIsFlipped(!isFlipped)} style={{ cursor: 'pointer' }}>
                <div className={`flashcard-inner ${isFlipped ? 'flipped' : ''}`}>
                  <div className="flashcard-front">
                    <div className="flashcard-label">{currentCardCloze ? 'Lacuna' : 'Pergunta'}</div>
                    <div className="flashcard-text">
                      {currentCardCloze ? (
                        <div dangerouslySetInnerHTML={{ __html: currentCardCloze.frontMasked }} />
                      ) : (
                        currentCard.pergunta
                      )}
                    </div>
                    <div className="flashcard-hint">Espaço para virar</div>
                  </div>
                  <div className="flashcard-back">
                    <div className="flashcard-label">Resposta</div>
                    <div className="flashcard-text flashcard-answer">
                      {currentCardCloze ? (
                        <div dangerouslySetInnerHTML={{ __html: currentCardCloze.backHighlighted }} />
                      ) : (
                        currentCard.resposta
                      )}
                    </div>
                    {currentCard.explicacao && (
                      <div className="flashcard-explanation">{currentCard.explicacao}</div>
                    )}
                  </div>
                </div>
              </div>
            </div>

            {isFlipped && (
              <div style={{ marginTop: '20px' }}>
                {/* Utility row: bury + report */}
                <div style={{ display: 'flex', justifyContent: 'center', gap: '20px', marginBottom: '14px' }}>
                  <button
                    onClick={handleBury}
                    title="Enterrar este card"
                    style={{ background: 'none', border: 'none', color: 'var(--text-secondary)', cursor: 'pointer', fontSize: '17px', lineHeight: 1, padding: '4px', opacity: 0.5, transition: 'opacity 0.15s' }}
                    onMouseEnter={e => e.currentTarget.style.opacity = '1'}
                    onMouseLeave={e => e.currentTarget.style.opacity = '0.5'}
                  >✕</button>
                  <button
                    onClick={handleReport}
                    title="Reportar erro neste card"
                    style={{ background: 'none', border: 'none', color: '#EF4444', cursor: 'pointer', fontSize: '15px', lineHeight: 1, padding: '4px', opacity: 0.72, transition: 'opacity 0.15s' }}
                    onMouseEnter={e => e.currentTarget.style.opacity = '1'}
                    onMouseLeave={e => e.currentTarget.style.opacity = '0.72'}
                  ><IconMessageSquare /></button>
                </div>
                {/* Rating buttons — no container box */}
                <div style={{ display: 'flex', gap: '8px', justifyContent: 'center' }}>
                  <button
                    onClick={handleDeNovo}
                    style={{ flex: 1, maxWidth: '90px', padding: '10px 4px', borderRadius: '10px', border: 'none', background: 'rgba(239,68,68,0.15)', color: '#f87171', fontFamily: 'Outfit', fontWeight: 700, fontSize: '13px', cursor: 'pointer', transition: 'background 0.15s' }}
                    onMouseEnter={e => e.currentTarget.style.background = 'rgba(239,68,68,0.28)'}
                    onMouseLeave={e => e.currentTarget.style.background = 'rgba(239,68,68,0.15)'}
                  >
                    <div>De Novo</div>
                    <div style={{ fontSize: '10px', opacity: 0.7, fontWeight: 400, marginTop: '2px' }}>1</div>
                  </button>
                  <button
                    onClick={() => handleRate(5)}
                    style={{ flex: 1, maxWidth: '90px', padding: '10px 4px', borderRadius: '10px', border: 'none', background: 'rgba(0,200,150,0.15)', color: '#00C896', fontFamily: 'Outfit', fontWeight: 700, fontSize: '13px', cursor: 'pointer', transition: 'background 0.15s' }}
                    onMouseEnter={e => e.currentTarget.style.background = 'rgba(0,200,150,0.28)'}
                    onMouseLeave={e => e.currentTarget.style.background = 'rgba(0,200,150,0.15)'}
                  >
                    <div>Fácil</div>
                    <div style={{ fontSize: '10px', opacity: 0.7, fontWeight: 400, marginTop: '2px' }}>2</div>
                  </button>
                  <button
                    onClick={() => handleRate(3)}
                    style={{ flex: 1, maxWidth: '90px', padding: '10px 4px', borderRadius: '10px', border: 'none', background: 'rgba(234,179,8,0.15)', color: '#fbbf24', fontFamily: 'Outfit', fontWeight: 700, fontSize: '13px', cursor: 'pointer', transition: 'background 0.15s' }}
                    onMouseEnter={e => e.currentTarget.style.background = 'rgba(234,179,8,0.28)'}
                    onMouseLeave={e => e.currentTarget.style.background = 'rgba(234,179,8,0.15)'}
                  >
                    <div>Médio</div>
                    <div style={{ fontSize: '10px', opacity: 0.7, fontWeight: 400, marginTop: '2px' }}>3</div>
                  </button>
                  <button
                    onClick={() => handleRate(2)}
                    style={{ flex: 1, maxWidth: '90px', padding: '10px 4px', borderRadius: '10px', border: 'none', background: 'rgba(249,115,22,0.15)', color: '#fb923c', fontFamily: 'Outfit', fontWeight: 700, fontSize: '13px', cursor: 'pointer', transition: 'background 0.15s' }}
                    onMouseEnter={e => e.currentTarget.style.background = 'rgba(249,115,22,0.28)'}
                    onMouseLeave={e => e.currentTarget.style.background = 'rgba(249,115,22,0.15)'}
                  >
                    <div>Difícil</div>
                    <div style={{ fontSize: '10px', opacity: 0.7, fontWeight: 400, marginTop: '2px' }}>4</div>
                  </button>
                </div>
              </div>
            )}

            {!isFlipped && (
              <div style={{ textAlign: 'center', marginTop: '16px' }}>
                <button className="btn btn-primary" onClick={() => setIsFlipped(true)} style={{ padding: '12px 32px' }}>
                  Mostrar Resposta
                </button>
              </div>
            )}
          </div>
          <ContentReportModal
            open={reportFlashOpen}
            title="Reportar flashcard"
            subtitle="Conte para a equipe o que está inconsistente neste card."
            reason={reportFlashReason}
            setReason={setReportFlashReason}
            sending={reportFlashSending}
            errorMsg={reportFlashError}
            onClose={() => { if (!reportFlashSending) { setReportFlashOpen(false); setReportFlashTarget(null); } }}
            onSubmit={submitFlashReport}
          />
        </>
      );
    };

    // Quiz Screen
    const QuizScreen = ({ flashcards, materias, selectedMateria, onSelectMateria, userSemester, initialAulaId, title = "Questões", onGoHome }) => {
      const QUIZ_PROGRESS_KEY = 'meduni9_quiz_progress';
      const QUIZ_ERRORS_KEY = 'meduni9_caderno_erros';
      const [activeQuiz, setActiveQuiz] = useState(null);
      const [activeTemas, setActiveTemas] = useState([]);
      const [showTemaSelector, setShowTemaSelector] = useState(false);
      const [pendingQuiz, setPendingQuiz] = useState(null);
      const [pendingTemas, setPendingTemas] = useState([]);
      const [pendingTemaSearch, setPendingTemaSearch] = useState('');
      const [currentQuestion, setCurrentQuestion] = useState(0);
      const [selectedOption, setSelectedOption] = useState(null);
      const [crossedOut, setCrossedOut] = useState(new Set());
      const [answered, setAnswered] = useState(false);
      const [userAnswers, setUserAnswers] = useState({}); // New: Persist answers for navigation
      const [quizStats, setQuizStats] = useState({ correct: 0, total: 0 });
      const [startTime, setStartTime] = useState(Date.now());
      const [quizComplete, setQuizComplete] = useState(false);
      const [answerResults, setAnswerResults] = useState({});
      const [reviewQuestionIds, setReviewQuestionIds] = useState([]);
      const [semesterFilter, setSemesterFilter] = useState(userSemester || null);
      const [searchQuery, setSearchQuery] = useState('');
      const [showCadernoErros, setShowCadernoErros] = useState(false);
      const [reportQuizOpen, setReportQuizOpen] = useState(false);
      const [reportQuizReason, setReportQuizReason] = useState('');
      const [reportQuizTarget, setReportQuizTarget] = useState(null);
      const [reportQuizSending, setReportQuizSending] = useState(false);
      const [reportQuizError, setReportQuizError] = useState('');
      const quizRouteAulaAppliedRef = useRef(false);
      const highlighterRef = useRef(null);

      useEffect(() => {
        if (!highlighterRef.current) return;
        return setupHighlighter(highlighterRef.current);
      }, [currentQuestion, activeQuiz, showCadernoErros, reviewQuestionIds, quizComplete]);

      const getErros = () => {
        const raw = parseLocalJson(QUIZ_ERRORS_KEY, []);
        if (!Array.isArray(raw)) {
          localStorage.setItem(QUIZ_ERRORS_KEY, JSON.stringify([]));
          return [];
        }
        const normalized = [...new Set(raw.filter(id => id != null).map(id => String(id)))];
        if (normalized.length !== raw.length || normalized.some((id, idx) => id !== raw[idx])) {
          localStorage.setItem(QUIZ_ERRORS_KEY, JSON.stringify(normalized));
        }
        return normalized;
      };
      const addErro = (questionId) => {
        if (questionId == null) return;
        const key = String(questionId);
        const erros = getErros();
        if (!erros.includes(key)) {
          erros.push(key);
          localStorage.setItem(QUIZ_ERRORS_KEY, JSON.stringify(erros));
        }
      };
      const removeErro = (questionId) => {
        if (questionId == null) return;
        const key = String(questionId);
        const erros = getErros().filter(id => id !== key);
        localStorage.setItem(QUIZ_ERRORS_KEY, JSON.stringify(erros));
      };
      const getQuizProgress = () => {
        const raw = parseLocalJson(QUIZ_PROGRESS_KEY, {});
        return raw && typeof raw === 'object' && !Array.isArray(raw) ? raw : {};
      };
      const markQuizAsDone = (questionId, correct) => {
        if (questionId == null) return;
        const map = getQuizProgress();
        const key = String(questionId);
        const prev = map[key] || { attempts: 0, correctAttempts: 0, done: false, level: 0 };
        const newLevel = correct ? Math.min((prev.level || 0) + 1, 5) : 0;
        const intervals = [0, 1, 3, 7, 14, 30];
        const nextInterval = intervals[newLevel] || 0;
        map[key] = {
          ...prev,
          done: true,
          attempts: (prev.attempts || 0) + 1,
          correctAttempts: (prev.correctAttempts || 0) + (correct ? 1 : 0),
          lastAnsweredAt: Date.now(),
          lastResult: correct ? 'correct' : 'wrong',
          level: newLevel,
          nextReview: nextInterval > 0 ? Date.now() + nextInterval * 24 * 60 * 60 * 1000 : null
        };
        localStorage.setItem(QUIZ_PROGRESS_KEY, JSON.stringify(map));
      };

      const quizQuestions = useMemo(() => {
        return flashcards.filter(f => f.tipo === 'quiz' && f.opcoes && f.opcoes.length > 0);
      }, [flashcards]);

      const quizzes = useMemo(() => {
        const grouped = {};
        materias.filter(m => m.ativo !== false).forEach(m => {
          const questions = m.id === 'todas' ? quizQuestions : quizQuestions.filter(f => f.materia === m.id);
          grouped[m.id] = { name: m.nome, sigla: m.sigla, cards: questions, icon: m.icon, semestre: m.modulo, ativo: m.ativo, cor: m.cor };
        });
        return grouped;
      }, [quizQuestions, materias]);

      const materiasById = useMemo(() => {
        const map = {};
        (materias || []).forEach((m) => { map[m.id] = m; });
        return map;
      }, [materias]);

      const getTemaDisplayName = (materiaId, temaId) => {
        if (!temaId) return '';
        const materia = materiasById[materiaId];
        const aulas = Array.isArray(materia?.aulas) ? materia.aulas : [];
        const aula = aulas.find(a => a.id === temaId);
        return aula?.tema || temaId;
      };
      const cardMatchesTema = (card, temaId) => card?.tema === temaId || card?.aula_id === temaId;
      const exitToHome = onGoHome || (() => {
        setActiveQuiz(null);
        setActiveTemas([]);
        setQuizComplete(false);
        setShowCadernoErros(false);
        setReviewQuestionIds([]);
        onSelectMateria(null);
      });

      const filteredQuizzes = useMemo(() => {
        let result = { ...quizzes };
        if (semesterFilter) {
          const f = {};
          Object.entries(result).forEach(([id, q]) => {
            if (q.semestre === semesterFilter && q.ativo !== false) f[id] = q;
          });
          result = f;
        }
        if (searchQuery) {
          const f = {};
          Object.entries(result).forEach(([id, q]) => {
            if (fuzzyMatch(searchQuery, q.name) || fuzzyMatch(searchQuery, q.sigla || '')) f[id] = q;
          });
          result = f;
        }
        return result;
      }, [quizzes, semesterFilter, searchQuery]);

      const isTypingTarget = (target) => {
        const tag = target?.tagName;
        return tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || !!target?.isContentEditable;
      };

      const getShortcutOptionIndex = (e) => {
        const key = e.key || '';
        const code = e.code || '';
        if (/^[1-5]$/.test(key)) return Number(key) - 1;
        if (/^(Digit|Numpad)[1-5]$/.test(code)) return Number(code.slice(-1)) - 1;
        const letter = key.toUpperCase();
        if (/^[A-E]$/.test(letter)) return letter.charCodeAt(0) - 65;
        return null;
      };

      useEffect(() => {
        if (!activeQuiz || quizComplete) return;
        const handleKey = (e) => {
          if (isTypingTarget(e.target)) return;
          const activeCards = getActiveCards();
          const currentCard = activeCards[currentQuestion];
          
          // Navigation Shortcuts
          if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
            e.preventDefault();
            if (answered) handleNextQuestion();
            return;
          }
          if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
            e.preventDefault();
            if (currentQuestion > 0) handlePreviousQuestion();
            return;
          }

          // Option Selection (1-5 or A-E)
          if (!answered) {
            const idx = getShortcutOptionIndex(e);
            if (idx !== null && currentCard?.opcoes && idx < currentCard.opcoes.length && !crossedOut.has(idx)) {
              e.preventDefault();
              setSelectedOption(idx);
              return;
            }
          }

          if (!answered) {
            if (e.key === 'Enter' && selectedOption !== null) { e.preventDefault(); handleAnswer(); }
          } else {
            if (e.key === 'Enter') { e.preventDefault(); handleNextQuestion(); }
          }
        };
        window.addEventListener('keydown', handleKey);
        return () => window.removeEventListener('keydown', handleKey);
      }, [activeQuiz, quizComplete, answered, selectedOption, currentQuestion, crossedOut, quizzes, activeTemas, reviewQuestionIds, showCadernoErros, quizQuestions]);

      const handleQuizStart = (materiaId, temasArray) => {
        setActiveQuiz(materiaId);
        setActiveTemas(temasArray || []);
        setReviewQuestionIds([]);
        setCurrentQuestion(0);
        setSelectedOption(null);
        setUserAnswers({}); // Reset persistence
        setCrossedOut(new Set());
        setAnswered(false);
        setQuizStats({ correct: 0, total: 0 });
        setAnswerResults({});
        setStartTime(Date.now());
        setShowTemaSelector(false);
        setQuizComplete(false);
      };

      const handleMateriaClick = (materiaId) => {
        onSelectMateria(materiaId);
        const cards = quizzes[materiaId]?.cards || [];
        if (cards.length === 0) { handleQuizStart(materiaId, []); return; }
        const materiaObj = materias.find(m => m.id === materiaId);
        const aulasCount = (materiaObj?.aulas || []).length;
        const temas = [...new Set(cards.map(c => c.tema).filter(Boolean))];
        if (aulasCount > 1 || temas.length > 1) {
          setPendingQuiz(materiaId);
          setPendingTemas([]);
          setPendingTemaSearch('');
          setShowTemaSelector(true);
        } else {
          handleQuizStart(materiaId, []);
        }
      };

      useEffect(() => {
        quizRouteAulaAppliedRef.current = false;
      }, [initialAulaId, selectedMateria, title]);

      useEffect(() => {
        if (quizRouteAulaAppliedRef.current || !initialAulaId || !selectedMateria) return;
        const cards = quizzes[selectedMateria]?.cards || [];
        if (!cards.some((card) => cardMatchesTema(card, initialAulaId))) return;
        handleQuizStart(selectedMateria, [initialAulaId]);
        quizRouteAulaAppliedRef.current = true;
      }, [initialAulaId, selectedMateria, quizzes]);

      useEffect(() => {
        if (!selectedMateria || initialAulaId || activeQuiz || showTemaSelector || quizComplete) return;
        const cards = quizzes[selectedMateria]?.cards || [];
        if (cards.length === 0) {
          handleQuizStart(selectedMateria, []);
          return;
        }
        const materiaObj = materias.find(m => m.id === selectedMateria);
        const aulasCount = (materiaObj?.aulas || []).length;
        const temas = [...new Set(cards.map(c => c.tema).filter(Boolean))];
        if (aulasCount > 1 || temas.length > 1) {
          setPendingQuiz(selectedMateria);
          setPendingTemas([]);
          setPendingTemaSearch('');
          setShowTemaSelector(true);
        } else {
          handleQuizStart(selectedMateria, []);
        }
      }, [selectedMateria, initialAulaId, activeQuiz, showTemaSelector, quizComplete, quizzes, materias]);

      const togglePendingTema = (temaId) => {
        setPendingTemas(prev => prev.includes(temaId) ? prev.filter(t => t !== temaId) : [...prev, temaId]);
      };

      const toggleCross = (idx) => {
        const next = new Set(crossedOut);
        if (next.has(idx)) next.delete(idx); else next.add(idx);
        if (selectedOption === idx) setSelectedOption(null);
        setCrossedOut(next);
      };

      const getActiveCards = () => {
        if (reviewQuestionIds.length > 0) {
          const byId = new Map(quizQuestions.map(q => [String(q.id), q]));
          return reviewQuestionIds.map(id => byId.get(String(id))).filter(Boolean);
        }
        if (showCadernoErros) {
          const erros = getErros();
          const erroSet = new Set(erros);
          return quizQuestions.filter(q => erroSet.has(String(q.id)));
        }
        if (!activeQuiz) return [];
        const quiz = quizzes[activeQuiz];
        if (!quiz) return [];
        return activeTemas.length > 0 ? quiz.cards.filter(c => activeTemas.some((temaId) => cardMatchesTema(c, temaId))) : quiz.cards;
      };

      const pruneCadernoErros = () => {
        const validIds = new Set(quizQuestions.map(q => String(q.id)));
        const validErros = getErros().filter(id => validIds.has(String(id)));
        localStorage.setItem(QUIZ_ERRORS_KEY, JSON.stringify(validErros));
        return validErros;
      };

      const parseQuizExplanation = (card) => {
        const options = card?.opcoes || [];
        const letters = options.map((_, idx) => String.fromCharCode(65 + idx));
        const parseOptionMapFromText = (text) => {
          if (!text || typeof text !== 'string') return {};
          const map = {};
          for (const letter of letters) {
            const regex = new RegExp(`${letter}\\)\\s*(?:CORRETA\\.?|INCORRETA\\.?)?\\s*([\\s\\S]*?)(?=\\n[A-D]\\)|$)`, 'i');
            const match = text.match(regex);
            if (match && match[1]) map[letter] = match[1].trim();
          }
          return map;
        };
        const explicacoesOpcoes = Array.isArray(card?.explicacoes_opcoes)
          ? card.explicacoes_opcoes.reduce((acc, txt, idx) => {
              const letter = String.fromCharCode(65 + idx);
              if (txt) acc[letter] = String(txt).trim();
              return acc;
            }, {})
          : (card?.explicacoes_opcoes || {});
        const parsedFromText = parseOptionMapFromText(card?.explicacao || '');
        const optionMap = { ...parsedFromText, ...explicacoesOpcoes };
        const resumoMatch = typeof card?.explicacao === 'string' ? card.explicacao.match(/Resumo:\s*([\s\S]*?)(?=\n[A-D]\)|$)/i) : null;
        const generalRaw = card?.explicacao_geral || (resumoMatch ? resumoMatch[1].trim() : (card?.explicacao || ''));
        const general = String(generalRaw || '').trim();
        const optionExplanations = letters.map((letter, idx) => {
          const explanation = optionMap[letter];
          if (explanation) return explanation;
          if (idx === card?.correta) return 'Alternativa correta para este enunciado.';
          return 'Alternativa incorreta neste contexto.';
        });
        return { general, optionExplanations };
      };

      const handleAnswer = () => {
        const activeCards = getActiveCards();
        const card = activeCards[currentQuestion];
        const correct = selectedOption === card.correta;
        markQuizAsDone(card?.id, correct);
        
        setUserAnswers(prev => ({ ...prev, [currentQuestion]: selectedOption }));
        
        if (card?.id != null) setAnswerResults(prev => ({ ...prev, [card.id]: correct }));
        if (correct) { setQuizStats(prev => ({ ...prev, correct: prev.correct + 1 })); removeErro(card.id); }
        else { addErro(card.id); }
        setAnswered(true);
      };

      const handleNextQuestion = () => {
        const activeCards = getActiveCards();
        if (currentQuestion < activeCards.length - 1) {
          const nextIdx = currentQuestion + 1;
          const prevAnswer = userAnswers[nextIdx];
          
          setCurrentQuestion(nextIdx);
          setCrossedOut(new Set());
          
          if (prevAnswer !== undefined) {
            setSelectedOption(prevAnswer);
            setAnswered(true);
          } else {
            setSelectedOption(null);
            setAnswered(false);
          }
        } else {
          setQuizComplete(true);
          const quizHistory = readQuizHistory();
          quizHistory.push({ date: new Date().toISOString(), materia: showCadernoErros ? 'caderno_erros' : activeQuiz, score: quizStats.correct, total: activeCards.length, time: formatTime(Date.now() - startTime) });
          localStorage.setItem('meduni9_quiz_history', JSON.stringify(quizHistory));
        }
      };

      const handlePreviousQuestion = () => {
        if (currentQuestion > 0) {
          const prevIdx = currentQuestion - 1;
          const prevAnswer = userAnswers[prevIdx];
          
          setCurrentQuestion(prevIdx);
          setCrossedOut(new Set());
          
          if (prevAnswer !== undefined) {
            setSelectedOption(prevAnswer);
            setAnswered(true);
          } else {
            setSelectedOption(null);
            setAnswered(false);
          }
        }
      };

      const handleRestartQuiz = () => {
        if (showCadernoErros) {
          setCurrentQuestion(0); setSelectedOption(null); setUserAnswers({}); setCrossedOut(new Set()); setAnswered(false); setQuizStats({ correct: 0, total: 0 }); setAnswerResults({}); setReviewQuestionIds([]); setStartTime(Date.now()); setQuizComplete(false);
        } else {
          handleQuizStart(activeQuiz, activeTemas);
        }
      };

      const handleReportQuestion = () => {
        const activeCards = getActiveCards();
        const card = activeCards[currentQuestion];
        if (!card) return;
        setReportQuizTarget(card); setReportQuizReason(''); setReportQuizError(''); setReportQuizOpen(true);
      };

      const submitQuizReport = async () => {
        if (!reportQuizTarget) return;
        setReportQuizSending(true); setReportQuizError('');
        try {
          await submitContentFeedback({ origem: 'questoes', mensagem: reportQuizReason?.trim() || 'Erro reportado em questão', itemId: reportQuizTarget.id, materia: reportQuizTarget.materia || activeQuiz, tema: reportQuizTarget.tema, contexto: { pergunta: reportQuizTarget.pergunta, opcoes: reportQuizTarget.opcoes || [], correta: reportQuizTarget.correta, explicacao: reportQuizTarget.explicacao || '' } });
          setReportQuizOpen(false); setReportQuizTarget(null);
        } catch (e) { setReportQuizError('Erro ao enviar report.'); } finally { setReportQuizSending(false); }
      };

      const startCadernoErros = () => {
        pruneCadernoErros();
        onSelectMateria(null); setShowCadernoErros(true); setActiveQuiz('__erros__'); setReviewQuestionIds([]);
        setCurrentQuestion(0); setSelectedOption(null); setCrossedOut(new Set()); setAnswered(false); setQuizStats({ correct: 0, total: 0 }); setAnswerResults({}); setStartTime(Date.now()); setQuizComplete(false);
      };

      const startWrongOnlyReview = () => {
        const activeCards = getActiveCards();
        const wrongIds = activeCards.filter(card => card?.id != null && answerResults[card.id] === false).map(card => card.id);
        if (!wrongIds.length) return;
        setQuizComplete(false); setShowCadernoErros(false); setReviewQuestionIds(wrongIds); setCurrentQuestion(0); setSelectedOption(null); setUserAnswers({}); setCrossedOut(new Set()); setAnswered(false); setQuizStats({ correct: 0, total: 0 }); setAnswerResults({}); setStartTime(Date.now());
      };

      const getNextRecommendedTemaId = () => {
        if (!activeQuiz || showCadernoErros) return null;
        const quiz = quizzes[activeQuiz]; const materia = materiasById[activeQuiz]; if (!quiz) return null;
        const temasComQuestoes = [...new Set((quiz.cards || []).map(c => c.tema).filter(Boolean))];
        const aulas = Array.isArray(materia?.aulas) ? materia.aulas : [];
        const ordenadas = aulas.length ? aulas.map(a => a.id).filter(id => temasComQuestoes.includes(id)) : temasComQuestoes;
        const temaAtual = activeTemas.length === 1 ? activeTemas[0] : (getActiveCards()[0]?.tema || null);
        if (!temaAtual) return ordenadas[0];
        const idx = ordenadas.indexOf(temaAtual);
        if (idx >= 0 && idx < ordenadas.length - 1) return ordenadas[idx + 1];
        return ordenadas.find(id => id !== temaAtual) || null;
      };

      const startNextRecommendedTema = () => { const nextTema = getNextRecommendedTemaId(); if (nextTema) handleQuizStart(activeQuiz, [nextTema]); };

      if (quizComplete) {
        const activeCards = getActiveCards();
        const percentage = Math.round((quizStats.correct / Math.max(activeCards.length, 1)) * 100);
        const wrongIds = activeCards.filter(card => card?.id != null && answerResults[card.id] === false).map(card => card.id);
        const nextTemaId = getNextRecommendedTemaId();
        return (
          <div className="screen-content">
            <div className="quiz-result-screen">
              <div style={{ width: '64px', height: '64px', margin: '0 auto 18px', borderRadius: '50%', border: '1px solid rgba(255,255,255,0.16)', background: percentage >= 70 ? 'rgba(16,185,129,0.12)' : 'rgba(255,255,255,0.06)', color: percentage >= 70 ? '#34D399' : 'var(--text-primary)', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                {percentage >= 70 ? <IconTrophy /> : <IconTarget />}
              </div>
              <div className="quiz-score">{percentage}%</div>
              <p style={{ color: 'var(--text-secondary)' }}>{quizStats.correct} de {activeCards.length} questões</p>
              <div className="quiz-time">{formatTime(Date.now() - startTime)}</div>
              <div className="quiz-result-actions" style={{ display: 'grid', gap: '10px', marginTop: '20px' }}>
                {wrongIds.length > 0 && <button className="btn btn-secondary" onClick={startWrongOnlyReview}>Revisar Erradas</button>}
                {nextTemaId && <button className="btn btn-secondary" onClick={startNextRecommendedTema}>Próxima Aula</button>}
                <button className="btn btn-primary" onClick={handleRestartQuiz}>Tentar Novamente</button>
                <button className="btn btn-secondary" onClick={exitToHome}>Voltar ao Início</button>
              </div>
            </div>
          </div>
        );
      }

      if (showTemaSelector && pendingQuiz) {
        const quiz = quizzes[pendingQuiz];
        const materiaObj = materias.find(m => m.id === pendingQuiz);
        const aulas = materiaObj?.aulas || [];
        const filteredAulas = aulas.filter(a => !pendingTemaSearch || normalizeText(a.tema).includes(normalizeText(pendingTemaSearch)));
        return (
          <div className="screen-content">
            <button className="back-btn" onClick={exitToHome}>← Início</button>
            <h2 className="section-title">{quiz.sigla || quiz.name}</h2>
            <div className="subject-search-wrap" style={{ marginBottom: '16px' }}><span className="subject-search-icon"><IconSearch /></span><input type="search" className="subject-search" placeholder="Buscar aula..." value={pendingTemaSearch} onChange={e => setPendingTemaSearch(e.target.value)} /></div>
            <div className="subject-select-list">
              <div className="subject-select-card" onClick={() => handleQuizStart(pendingQuiz, [])} style={{ borderColor: 'var(--primary)', background: 'rgba(0,200,150,0.06)', marginBottom: '12px' }}>
                <div className="subject-select-icon" style={{ background: 'rgba(0,200,150,0.15)', color: 'var(--primary)' }}><IconClipboardList /></div>
                <div className="subject-select-info"><div className="subject-select-name">Tudo desta matéria</div><div className="subject-select-meta">{quiz.cards.length} questões</div></div>
              </div>
              {filteredAulas.map(aula => {
                const count = quiz.cards.filter(c => cardMatchesTema(c, aula.id)).length;
                if (count === 0) return null;
                const isSelected = pendingTemas.includes(aula.id);
                return (
                  <div key={aula.id} className={`subject-select-card ${isSelected ? 'tema-selected' : ''}`} onClick={() => togglePendingTema(aula.id)}>
                    <div className={`tema-checkbox ${isSelected ? 'tema-checkbox-checked' : ''}`}>{isSelected ? '✓' : ''}</div>
                    <div className="subject-select-info"><div className="subject-select-name">{aula.tema}</div><div className="subject-select-meta">{count} questões</div></div>
                  </div>
                );
              })}
            </div>
            {pendingTemas.length > 0 && (
              <div className="tema-start-bar"><button className="btn btn-primary" onClick={() => handleQuizStart(pendingQuiz, pendingTemas)}>Iniciar {pendingTemas.length} assunto(s)</button></div>
            )}
          </div>
        );
      }

      if (activeQuiz) {
        const activeCards = getActiveCards();
        const card = activeCards[currentQuestion];
        if (!card) {
          return (
            <div className="screen-content">
              <button className="back-btn" onClick={exitToHome}>← Início</button>
              <div className="quiz-result-screen">
                <div style={{ width: '64px', height: '64px', margin: '0 auto 18px', borderRadius: '50%', border: '1px solid rgba(255,255,255,0.16)', background: 'rgba(255,255,255,0.06)', color: 'var(--text-secondary)', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                  <IconFileText />
                </div>
                <div className="quiz-score" style={{ fontSize: '24px' }}>
                  {showCadernoErros ? 'Caderno vazio' : 'Sem questões'}
                </div>
                <p style={{ color: 'var(--text-secondary)', lineHeight: 1.6 }}>
                  {showCadernoErros
                    ? 'Nenhuma questão válida ficou no caderno de erros. IDs antigos ou removidos foram ignorados.'
                    : 'Não há questões carregadas para esta seleção.'}
                </p>
                <div className="quiz-result-actions" style={{ display: 'grid', gap: '10px', marginTop: '20px' }}>
                  <button className="btn btn-primary" onClick={exitToHome}>Voltar ao Início</button>
                </div>
              </div>
            </div>
          );
        }
        const progress = ((currentQuestion + 1) / activeCards.length) * 100;
        const explanationBundle = parseQuizExplanation(card);
        return (
          <div className="screen-content">
            <button className="back-btn" onClick={exitToHome}>← Sair</button>
            <div className="quiz-screen">
              <div className="quiz-progress-section">
                <div className="quiz-progress-bar"><div className="quiz-progress-fill" style={{ width: `${progress}%` }}></div></div>
                <div className="quiz-counter">{currentQuestion + 1} de {activeCards.length}</div>
              </div>
              <div className="quiz-question-card" ref={highlighterRef}><div className="quiz-question" dangerouslySetInnerHTML={{ __html: renderMarkdown(card.pergunta) }} /></div>
              <div className="quiz-options">
                {card.opcoes.map((option, idx) => (
                  <div key={idx} className={`quiz-option ${selectedOption === idx && !answered ? 'selected' : ''} ${answered && idx === card.correta ? 'correct' : ''} ${answered && selectedOption === idx && idx !== card.correta ? 'incorrect-selected' : ''} ${crossedOut.has(idx) ? 'crossed-out' : ''}`} onClick={() => !answered && !crossedOut.has(idx) && setSelectedOption(idx)}>
                    <span className="quiz-option-number">{String.fromCharCode(65 + idx)}</span>
                    <span style={{ flex: 1 }} dangerouslySetInnerHTML={{ __html: renderMarkdown(option) }} />
                    {!answered && !crossedOut.has(idx) && <button className="cross-btn" onClick={(e) => { e.stopPropagation(); toggleCross(idx); }}>✕</button>}
                  </div>
                ))}
              </div>
              {answered && (
                <div className="quiz-feedback" style={{ marginTop: '20px', borderTop: '1px solid rgba(255,255,255,0.1)', paddingTop: '20px', animation: 'mgFadeSlide 0.3s ease-out' }}>
                  <div style={{ display: 'flex', gap: '10px', alignItems: 'center', marginBottom: '16px', color: selectedOption === card.correta ? '#10B981' : '#EF4444', fontWeight: 800 }}>
                    {selectedOption === card.correta ? <><IconCheck /> Correto!</> : <><IconX /> Incorreto</>}
                  </div>
                  
                  {explanationBundle.general && (
                    <div style={{ marginBottom: '20px' }}>

    const TO_ESTUDOS_MATERIA_ID = 'tecnica_operatoria';

    function normalizeInstrumentAnswerText(s) {
      const base = String(s || '').trim().replace(/\s+/g, ' ').toLowerCase();
      try { return base.normalize('NFD').replace(/[\u0300-\u036f]/g, ''); } catch (e) { return base; }
    }

    function instrumentAnswerMatchesRelaxed(nu, ne) {
      if (!nu || !ne || nu.length < 2) return false;
      if (nu === ne) return true;
      if (ne.endsWith(' ' + nu)) return true;
      const tokens = ne.split(/\s+/).filter(Boolean);
      const last = tokens[tokens.length - 1] || '';
      if (nu === last) return true;
      const stop = new Set(['de', 'da', 'do', 'das', 'dos', 'e', 'o', 'a', 'em', 'no', 'na', 'tipo', 'com', 'para']);
      for (const t of tokens) { if (t === nu && t.length >= 3 && !stop.has(t)) return true; }
      return false;
    }

    function buildInstrumentAnswerDiff(userRaw, expectedNome) {
      const nu = normalizeInstrumentAnswerText(userRaw);
      const ne = normalizeInstrumentAnswerText(expectedNome);
      if (!nu.length) return { isEmpty: true, isCorrect: false, userSpans: [], normalizedExpected: ne };
      const relaxedOk = instrumentAnswerMatchesRelaxed(nu, ne);
      const userSpans = [];
      if (relaxedOk) { for (let i = 0; i < nu.length; i += 1) userSpans.push({ ch: nu[i], ok: true }); }
      else { for (let i = 0; i < nu.length; i += 1) { const ch = nu[i]; userSpans.push({ ch, ok: i < ne.length && ne[i] === ch }); } }
      return { isEmpty: false, isCorrect: relaxedOk, userSpans, normalizedUser: nu, normalizedExpected: ne };
    }

    function shuffleInstrumentIds(ids) {
      const a = ids.slice();
      for (let i = a.length - 1; i > 0; i -= 1) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
      return a;
    }

    function encodeLocalAssetPath(p) {
      const s = String(p || '').trim();
      if (!s) return s;
      return s.split('/').map((seg) => (seg === '' ? '' : encodeURIComponent(seg))).join('/');
    }

    function renderInlineBoldMarkdown(s, strongStyle) {
      const str = String(s || '');
      const style = strongStyle || { fontWeight: 700, color: 'inherit' };
      const parts = str.split(/(\*\*.+?\*\*)/g);
      return parts.map((part, i) => {
        const m = part.match(/^\*\*([\s\S]+?)\*\*$/);
        if (m) return <strong key={i} style={style}>{m[1]}</strong>;
        return part ? <span key={i}>{part}</span> : null;
      });
    }

    function stripMiniQuizInlineMarkdown(value) {
      return String(value || '')
        .replace(/^\s*>+\s?/, '')
        .replace(/\*\*([^*]+)\*\*/g, '$1')
        .replace(/__([^_]+)__/g, '$1')
        .replace(/`([^`]+)`/g, '$1')
        .trim();
    }

    function parseMdMiniQuiz(markdown) {
      try {
        const md = String(markdown || '');
        const headingMatch = /^#{2,3}\s*Mini\s*Quiz\s*$/im.exec(md);
        if (!headingMatch) return [];

        const start = headingMatch.index + headingMatch[0].length;
        const rest = md.slice(start);
        const nextHeading = /^#{2,3}\s+\S.*$/im.exec(rest);
        const section = (nextHeading ? rest.slice(0, nextHeading.index) : rest).trim();
        if (!section) return [];

        const questionRe = /^\s*(?:\*\*(\d+)\.\s*([\s\S]*?)\*\*|(\d+)\.\s*\*\*([\s\S]*?)\*\*)\s*$/gm;
        const questionMatches = [];
        let questionMatch;
        while ((questionMatch = questionRe.exec(section))) {
          questionMatches.push({
            index: questionMatch.index,
            end: questionRe.lastIndex,
            pergunta: stripMiniQuizInlineMarkdown(questionMatch[2] || questionMatch[4]),
          });
        }

        return questionMatches.map((question, idx) => {
          const nextQuestion = questionMatches[idx + 1];
          const block = section.slice(question.end, nextQuestion ? nextQuestion.index : section.length);
          const opcoes = [];
          let correta = -1;
          const optionRe = /^\s*[-*]\s*\[(x|X|\s)\]\s*(.+?)\s*$/gm;
          let optionMatch;
          while ((optionMatch = optionRe.exec(block))) {
            if (/x/i.test(optionMatch[1])) correta = opcoes.length;
            opcoes.push(stripMiniQuizInlineMarkdown(optionMatch[2]));
          }

          const explanationMatch = /^\s*>\s*\*\*Explica[^:]*:\*\*\s*([\s\S]*?)(?=\n\s*\n|$)/im.exec(block);
          return {
            pergunta: question.pergunta,
            opcoes,
            correta,
            explicacao: explanationMatch ? stripMiniQuizInlineMarkdown(explanationMatch[1]) : '',
          };
        }).filter((question) => (
          question.pergunta &&
          question.opcoes.length >= 2 &&
          question.correta >= 0
        ));
      } catch (err) {
        console.warn('Falha ao parsear Mini Quiz do material:', err);
        return [];
      }
    }

    function toEstudosWhitenEmbeddedBlackBg(img, opts) {
      const threshold = opts && typeof opts.threshold === 'number' ? opts.threshold : 40;
      const w = img.naturalWidth; const h = img.naturalHeight;
      if (!w || !h || w * h > 18_000_000) return false;
      const canvas = document.createElement('canvas'); canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d'); if (!ctx) return false;
      ctx.drawImage(img, 0, 0); let data; try { data = ctx.getImageData(0, 0, w, h); } catch (e) { return false; }
      const px = data.data; let changed = false;
      for (let i = 0; i < px.length; i += 4) { if (px[i] <= threshold && px[i + 1] <= threshold && px[i + 2] <= threshold) { px[i] = 255; px[i + 1] = 255; px[i + 2] = 255; changed = true; } }
      if (!changed) return false; ctx.putImageData(data, 0, 0);
      try { img.src = canvas.toDataURL('image/png'); return true; } catch (e) { return false; }
    }

    function ToEstudosInstrumentFigure({ src, alt, onError }) {
      const doneRef = useRef(false);
      const onLoad = useCallback((e) => { const el = e.currentTarget; if (doneRef.current) return; const s = String(src || ''); if (!/\.(png|jpe?g)(\?|#|$)/i.test(s)) return; try { if (toEstudosWhitenEmbeddedBlackBg(el, { threshold: 40 })) doneRef.current = true; } catch (err) {} }, [src]);
      return <img src={src} alt={alt} loading="lazy" decoding="async" onLoad={onLoad} onError={onError} />;
    }

    function maskResumoEmail(email) {
      const clean = String(email || '').trim().toLowerCase();
      const [local, domain] = clean.split('@');
      if (!local || !domain) return clean || 'usuario sem email';
      const head = local.slice(0, Math.min(2, local.length));
      return `${head}${local.length > 2 ? '***' : '*'}@${domain}`;
    }

    function buildResumoDisplayName(user) {
      const fbUser = window.__fbAuth?.currentUser || null;
      const rawName =
        user?.nome ||
        user?.name ||
        user?.displayName ||
        (!String(fbUser?.displayName || '').startsWith('mgp|') ? fbUser?.displayName : '') ||
        '';
      if (String(rawName || '').trim()) return String(rawName).trim();
      const email = user?.email || fbUser?.email || '';
      const local = String(email).split('@')[0] || 'Aluno MedGradPlus';
      return local
        .split(/[._-]+/)
        .filter(Boolean)
        .slice(0, 2)
        .map((part) => part.charAt(0).toUpperCase() + part.slice(1))
        .join(' ') || 'Aluno MedGradPlus';
    }

    function buildResumoIdentity(user, trace, resumo) {
      const fbUser = window.__fbAuth?.currentUser || null;
      const email = user?.email || fbUser?.email || '';
      const createdAt = trace?.createdAt || new Date().toISOString();
      const when = new Date(createdAt).toLocaleString('pt-BR', {
        day: '2-digit',
        month: '2-digit',
        year: 'numeric',
        hour: '2-digit',
        minute: '2-digit',
      });
      return {
        name: buildResumoDisplayName(user),
        emailMasked: maskResumoEmail(email),
        label: `${buildResumoDisplayName(user)} · ${maskResumoEmail(email)} · ${String(resumo?.aulaId || '').toUpperCase()} · ${when}`,
      };
    }

    function resumoSeed(traceId) {
      return String(traceId || 'MGP')
        .split('')
        .reduce((sum, ch) => sum + ch.charCodeAt(0), 0);
    }

    function repairMojibakeText(value) {
      if (typeof value !== 'string' || !/[ÃÂâ]/.test(value)) return value;
      try {
        const bytes = new Uint8Array(Array.from(value, (ch) => ch.charCodeAt(0) & 255));
        const decoded = new TextDecoder('utf-8', { fatal: false }).decode(bytes);
        return decoded && !decoded.includes('\uFFFD') ? decoded : value;
      } catch (_) {
        return value;
      }
    }

    function repairResumoPayload(value) {
      if (typeof value === 'string') return repairMojibakeText(value);
      if (Array.isArray(value)) return value.map(repairResumoPayload);
      if (value && typeof value === 'object') {
        return Object.fromEntries(Object.entries(value).map(([key, item]) => [key, repairResumoPayload(item)]));
      }
      return value;
    }

    function isLocalResumoPreviewContext() {
      const host = String(window.location.hostname || '').toLowerCase();
      return (
        window.location.protocol === 'file:' ||
        host === 'localhost' ||
        host === '127.0.0.1' ||
        host === '0.0.0.0' ||
        /^192\.168\./.test(host) ||
        /^10\./.test(host) ||
        /^172\.(1[6-9]|2\d|3[0-1])\./.test(host)
      );
    }

    function buildLocalResumoTrace(resumo) {
      const stamp = new Date().toISOString();
      const raw = `${resumo?.aulaId || 'aula'}:${resumo?.sourceHash || ''}:${stamp}`;
      const seed = resumoSeed(raw).toString(36).toUpperCase().padStart(6, '0');
      return {
        traceId: `LOCAL-${String(resumo?.aulaId || 'AULA').toUpperCase()}-${seed}`,
        marker: 'PREVIEW-LOCAL-SEM-ASSINATURA-SERVIDOR',
        createdAt: stamp,
        localPreview: true,
      };
    }

    async function fetchResumoA4Manifest() {
      const res = await fetch(`data/resumos_a4/index.json?v=${Date.now()}`, { cache: 'no-store' });
      if (res.status === 404) {
        return { schemaVersion: 1, items: [] };
      }
      if (!res.ok) {
        throw new Error('Nao foi possivel carregar o indice de resumos didaticos.');
      }
      const manifest = repairResumoPayload(await res.json());
      return {
        ...manifest,
        items: Array.isArray(manifest.items) ? manifest.items : [],
      };
    }

    async function fetchResumoA4(materiaId, aulaId, explicitPath = '') {
      const cleanPath = String(explicitPath || '').trim();
      const path = cleanPath || `data/resumos_a4/${materiaId}/${aulaId}.json`;
      const res = await fetch(`${path}${path.includes('?') ? '&' : '?'}v=${Date.now()}`, { cache: 'no-store' });
      if (res.status === 404) {
        throw new Error('Resumo A4 ainda indisponivel para esta aula.');
      }
      if (!res.ok) {
        throw new Error('Nao foi possivel carregar o Resumo A4 agora.');
      }
      return repairResumoPayload(await res.json());
    }

    async function createResumoTrace(resumo) {
      const fbUser = window.__fbAuth?.currentUser || null;
      if (!fbUser) {
        if (isLocalResumoPreviewContext()) return buildLocalResumoTrace(resumo);
        throw new Error('Entre com uma conta para gerar o Resumo A4 rastreavel.');
      }
      let token;
      try {
        token = await fbUser.getIdToken();
      } catch (err) {
        if (isLocalResumoPreviewContext()) return buildLocalResumoTrace(resumo);
        throw err;
      }
      let res;
      try {
        res = await fetch('https://southamerica-east1-medgradplus.cloudfunctions.net/createResumoTrace', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`,
          },
          body: JSON.stringify({
            aulaId: resumo.aulaId,
            materiaId: resumo.materiaId,
            sourceHash: resumo.sourceHash,
            sourcePath: resumo.sourcePath,
            generatedAt: resumo.generatedAt || '',
          }),
        });
      } catch (err) {
        if (isLocalResumoPreviewContext()) return buildLocalResumoTrace(resumo);
        throw err;
      }
      const body = await res.json().catch(() => ({}));
      if (!res.ok) {
        if (isLocalResumoPreviewContext()) return buildLocalResumoTrace(resumo);
        throw new Error(body.error || 'Falha ao assinar o rastreio do resumo.');
      }
      if (!body.traceId) {
        throw new Error('Rastreio retornou sem traceId.');
      }
      return body;
    }

    function renderResumoRichText(text, keyPrefix = 'rt') {
      const value = String(text ?? '');
      if (!value) return null;
      const nodes = [];
      const regex = /\*\*([^*]+)\*\*/g;
      let lastIndex = 0;
      let match;
      let index = 0;

      while ((match = regex.exec(value)) !== null) {
        if (match.index > lastIndex) {
          nodes.push(<React.Fragment key={`${keyPrefix}-t-${index}`}>{value.slice(lastIndex, match.index)}</React.Fragment>);
        }
        nodes.push(<strong key={`${keyPrefix}-b-${index}`}>{match[1]}</strong>);
        lastIndex = regex.lastIndex;
        index += 1;
      }

      if (lastIndex < value.length) {
        nodes.push(<React.Fragment key={`${keyPrefix}-t-${index}`}>{value.slice(lastIndex)}</React.Fragment>);
      }

      return nodes.length ? nodes : value;
    }

    function ResumoA4Block({ block, index }) {
      if (!block) return null;
      const tapeRot = `${((index % 5) - 2) * 1.2}deg`;
      const renderInlineText = (text) => {
        const value = String(text || '');
        const colonIndex = value.indexOf(':');
        if (!value.startsWith('**') && colonIndex > 0 && colonIndex <= 28) {
          return (
            <>
              <span className="resumo-a4-inline-lead">{value.slice(0, colonIndex + 1)}</span>
              {renderResumoRichText(value.slice(colonIndex + 1), `inline-${index}`)}
            </>
          );
        }
        return renderResumoRichText(value, `inline-${index}`);
      };
      const slotClass = block.slot ? ` resumo-a4-slot--${resumoA4ClassToken(block.slot)}` : '';
      const sizeClass = block.size ? ` resumo-a4-block--${resumoA4ClassToken(block.size)}` : '';
      return (
        <section className={`resumo-a4-block resumo-a4-block--${block.kind || 'note'}${slotClass}${sizeClass}`} style={{ '--tape-rot': tapeRot }}>
          <h2>{renderResumoRichText(block.title, `title-${index}`)}</h2>
          {block.kind === 'figure' && <ResumoA4Figure block={block} />}
          {Array.isArray(block.rows) && block.rows.length > 0 && (
            <table className="resumo-a4-table">
              <tbody>
                {block.rows.map((row, rowIndex) => (
                  <tr key={rowIndex}>
                    <td>{renderInlineText(row[0])}</td>
                    <td>{renderInlineText(row[1])}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          )}
          {Array.isArray(block.items) && block.items.length > 0 && (
            <ul>
              {block.items.map((item, itemIndex) => (
                <li key={itemIndex}>{renderInlineText(item)}</li>
              ))}
            </ul>
          )}
          {Array.isArray(block.steps) && block.steps.length > 0 && (
            <div className="resumo-a4-flow">
              {block.steps.map((step, stepIndex) => (
                <div className="resumo-a4-flow-step" key={stepIndex}>{renderResumoRichText(step, `step-${index}-${stepIndex}`)}</div>
              ))}
            </div>
          )}
          {block.note && <div className="resumo-a4-note">{renderResumoRichText(block.note, `note-${index}`)}</div>}
        </section>
      );
    }

    const ResumoA4View = ({ resumo, trace, user, onBack, backLabel = 'Voltar ao Início' }) => {
      const stageRef = React.useRef(null);
      const [screenScale, setScreenScale] = React.useState(1);
      React.useEffect(() => {
        document.body.classList.add('resumo-a4-print-mode');
        return () => document.body.classList.remove('resumo-a4-print-mode');
      }, []);
      React.useEffect(() => {
        const stage = stageRef.current;
        if (!stage) return undefined;
        const a4WidthPx = (210 / 25.4) * 96;
        const updateScale = () => {
          const available = Math.max(320, stage.clientWidth - 28);
          const next = Math.min(1, Math.max(0.46, available / a4WidthPx));
          setScreenScale((current) => Math.abs(current - next) > 0.01 ? Number(next.toFixed(3)) : current);
        };
        updateScale();
        if (typeof ResizeObserver === 'undefined') {
          window.addEventListener('resize', updateScale);
          return () => window.removeEventListener('resize', updateScale);
        }
        const observer = new ResizeObserver(updateScale);
        observer.observe(stage);
        return () => observer.disconnect();
      }, []);
      const seed = resumoSeed(trace?.traceId);
      const identity = buildResumoIdentity(user, trace, resumo);
      const traceShort = String(trace?.traceId || '').slice(0, 18);
      const visual = resumo.visual || {};
      const templateClass = resumo.template ? ` resumo-a4-page--${resumoA4ClassToken(resumo.template)}` : '';
      const variantFromResumo = Number(visual.variant);
      const variant = [1, 2, 3].includes(variantFromResumo) ? variantFromResumo : ((seed % 3) + 1);
      const pageNotes = Array.isArray(visual.notes) ? visual.notes : [];

          {resumo.reviewStatus?.warning && (

          {trace?.localPreview && (

          <div className="resumo-a4-stage" ref={stageRef}>
            <div className="resumo-a4-print-root" style={{ '--a4-screen-scale': screenScale }}>
              {(resumo.pages || []).map((page) => {
                const blocks = Object.entries(page.blocks || {});
                return (
                  <div
                    className="resumo-a4-page-shell"
                    key={page.number}
                    style={{
                      width: `${Math.round(((210 / 25.4) * 96) * screenScale)}px`,
                      minHeight: `${Math.round(((297 / 25.4) * 96) * screenScale)}px`,

                    <article className={`resumo-a4-page resumo-a4-page--v${variant}${templateClass}`}>

                      </div>
                      <div className="resumo-a4-content">
                        <header className="resumo-a4-brand">
                          <div className="resumo-a4-logo">
                            <span className="resumo-a4-logo-mark" aria-hidden="true"></span>
                            <span>MedGradPlus+</span>
                          </div>
                          <div className="resumo-a4-student">
                            <strong>{identity.name}</strong><br />
                            {identity.emailMasked}<br />
                            ID: {traceShort}
                          </div>
                        </header>

                        <div className="resumo-a4-title">
                          <h1><span>{resumo.titulo}</span></h1>
                          <div className="resumo-a4-subtitle">{resumo.subtitulo}</div>
                        </div>

                        <div className="resumo-a4-page-label">Página {page.number} · {page.title}</div>
                        <div className={`resumo-a4-grid resumo-a4-grid--${resumoA4ClassToken(page.layout, 'balanced-grid')}`}>
                          {blocks.map(([key, block], index) => (
                            <ResumoA4Block block={block} index={index + page.number + seed} key={key} />

                        <span>{identity.label}</span>
                        <span>{trace?.marker || trace?.traceId}</span>
                      </div>
                    </article>

                );
