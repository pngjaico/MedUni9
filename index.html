<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#00B4D8">
  <meta name="description" content="MedUni9 - Plataforma de estudos para alunos de medicina da Uninove Vergueiro">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><rect fill='%2300B4D8' width='192' height='192'/><text x='96' y='120' font-size='80' fill='white' text-anchor='middle' font-weight='bold'>🩺</text></svg>">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><rect fill='%2300B4D8' width='192' height='192'/><text x='96' y='120' font-size='80' fill='white' text-anchor='middle' font-weight='bold'>🩺</text></svg>">

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@600;700;800&family=Lexend:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-user-select: none;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      font-family: 'DM Sans', sans-serif;
      background: linear-gradient(135deg, #0A1628 0%, #0D2137 50%, #0F2D4A 100%);
      background-attachment: fixed;
      color: #E5E7EB;
      overflow: hidden;
    }

    #root {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    /* Typography */
    h1, h2, h3, h4, h5, h6 {
      font-family: 'Outfit', sans-serif;
      font-weight: 700;
    }

    /* Colors & Design Tokens */
    :root {
      --primary: #00B4D8;
      --success: #10B981;
      --warning: #F59E0B;
      --error: #EF4444;
      --purple: #8B5CF6;
      --bg-dark: #0A1628;
      --bg-card: rgba(255, 255, 255, 0.04);
      --border-card: rgba(255, 255, 255, 0.06);
      --text-primary: #E5E7EB;
      --text-secondary: #9CA3AF;

      /* Surfaces */
      --surface-1: rgba(255, 255, 255, 0.04);
      --surface-2: rgba(255, 255, 255, 0.07);
      --surface-3: rgba(255, 255, 255, 0.12);
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-strong: rgba(255, 255, 255, 0.16);

      /* Elevação */
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.18);
      --shadow-md: 0 4px 20px rgba(0, 0, 0, 0.25);
      --shadow-lg: 0 8px 40px rgba(0, 0, 0, 0.35);

      /* Animação */
      --ease-spring: cubic-bezier(0.16, 1, 0.3, 1);
      --duration-fast: 150ms;
      --duration-base: 250ms;

      /* Cores por matéria */
      --color-sus: #6366F1;
      --color-semiologia: #C0392B;
      --color-bmf1: #E85D75;
      --color-bmf2: #EF4444;
      --color-bmf3: #3B82F6;
      --color-bmf4: #A855F7;
      --color-bcm1: #4A90E2;
      --color-mad: #F59E0B;
      --color-indicadores: #10B981;
      --color-mfc: #16A34A;
      --color-pediatria: #F59E0B;
      --color-go: #EC4899;
    }

    /* Main Container */
    .app-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      width: 100%;
      max-width: 430px;
      margin: 0 auto;
      height: 100vh;
      background: linear-gradient(135deg, #0A1628 0%, #0D2137 50%, #0F2D4A 100%);
      position: relative;
    }

    /* Desktop layout wrapper */
    .desktop-layout {
      display: flex;
      width: 100%;
      height: 100vh;
      background: linear-gradient(135deg, #0A1628 0%, #0D2137 50%, #0F2D4A 100%);
    }

    .desktop-layout .app-container {
      max-width: none;
      margin: 0;
      height: 100%;
      flex: 1;
      min-width: 0;
    }

    /* Desktop Sidebar */
    .desktop-sidebar {
      display: none;
      width: 240px;
      min-width: 240px;
      background: rgba(10, 22, 40, 0.95);
      border-right: 1px solid var(--border-card);
      flex-direction: column;
      padding: 24px 0;
      height: 100vh;
      position: sticky;
      top: 0;
    }

    .sidebar-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 20px 24px;
      border-bottom: 1px solid var(--border-card);
      margin-bottom: 16px;
    }

    .sidebar-logo-icon { font-size: 28px; }

    .sidebar-logo-text {
      font-family: 'Outfit', sans-serif;
      font-size: 20px;
      font-weight: 700;
      color: var(--primary);
    }

    .sidebar-nav {
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 0 12px;
      flex: 1;
    }

    .sidebar-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      border-radius: 10px;
      cursor: pointer;
      color: var(--text-secondary);
      font-size: 14px;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .sidebar-item:hover {
      background: rgba(0, 180, 216, 0.08);
      color: var(--text-primary);
    }

    .sidebar-item.active {
      background: rgba(0, 180, 216, 0.15);
      color: var(--primary);
    }

    .sidebar-item svg {
      flex-shrink: 0;
    }

    .sidebar-footer {
      padding: 16px 20px;
      border-top: 1px solid var(--border-card);
      font-size: 11px;
      color: var(--text-secondary);
      text-align: center;
    }

    .screen-content {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 20px 16px 100px 16px;
      -webkit-overflow-scrolling: touch;
    }

    /* Hamburger/sidebar toggle button */
    .sidebar-toggle-btn {
      display: none;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border-radius: 8px;
      border: 1px solid var(--border-card);
      background: rgba(255,255,255,0.05);
      color: var(--text-primary);
      cursor: pointer;
      font-size: 18px;
      line-height: 1;
      flex-shrink: 0;
      transition: background 0.2s;
    }
    .sidebar-toggle-btn:hover {
      background: rgba(255,255,255,0.1);
    }

    /* Sidebar collapsed state */
    .desktop-sidebar.collapsed {
      width: 0 !important;
      min-width: 0 !important;
      padding: 0 !important;
      overflow: hidden;
      border-right: none;
    }

    /* Study mode selector */
    .study-mode-selector {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 16px;
    }
    .study-mode-btn {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 20px;
      background: var(--bg-card);
      border: 1.5px solid var(--border-card);
      border-radius: 14px;
      cursor: pointer;
      transition: all 0.2s;
      text-align: left;
      color: var(--text-primary);
      font-family: 'DM Sans', sans-serif;
    }
    .study-mode-btn:hover {
      border-color: var(--primary);
      background: rgba(0, 180, 216, 0.07);
    }
    .study-mode-icon { font-size: 24px; }
    .study-mode-title { font-size: 14px; font-weight: 600; margin-bottom: 2px; }
    .study-mode-desc { font-size: 12px; color: var(--text-secondary); }

    /* Search input for subjects */
    .subject-search {
      width: 100%;
      padding: 11px 14px 11px 38px;
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: 10px;
      color: var(--text-primary);
      font-size: 14px;
      font-family: 'DM Sans', sans-serif;
      margin-bottom: 14px;
      transition: border-color 0.2s;
    }
    .subject-search:focus {
      outline: none;
      border-color: var(--primary);
    }
    .subject-search-wrap {
      position: relative;
      margin-bottom: 4px;
    }
    .subject-search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-secondary);
      pointer-events: none;
      display: flex;
      align-items: center;
      line-height: 0;
    }

    /* Category tabs for questions */
    .category-tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 20px;
    }
    .category-tab {
      flex: 1;
      padding: 9px 10px;
      border-radius: 10px;
      border: 1.5px solid var(--border-card);
      background: transparent;
      color: var(--text-secondary);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
      min-height: auto;
      text-transform: none;
      letter-spacing: 0;
      font-family: 'DM Sans', sans-serif;
    }
    .category-tab.active {
      background: var(--primary);
      color: #000;
      border-color: var(--primary);
    }

    /* Quiz question card with better readability */
    .quiz-question-card {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      padding: 20px 22px;
      margin-bottom: 20px;
    }

    @media (min-width: 769px) {
      #root {
        display: flex;
      }

      .desktop-sidebar {
        display: flex;
        transition: width 0.25s ease, min-width 0.25s ease, padding 0.25s ease;
      }

      .desktop-layout .bottom-nav {
        display: none;
      }

      .desktop-layout .screen-content {
        padding: 28px 40px 40px;
      }

      .desktop-layout .flashcard {
        min-height: 360px;
      }

      .desktop-layout .stats-grid {
        grid-template-columns: 1fr 1fr 1fr;
      }

      .desktop-layout .quiz-question {
        font-size: 20px;
      }

      .sidebar-toggle-btn {
        display: flex;
      }
    }

    /* Splash Screen */
    .splash-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      background: linear-gradient(135deg, #0A1628 0%, #0D2137 50%, #0F2D4A 100%);
    }

    .splash-logo {
      font-size: 80px;
      animation: pulse-splash 1s ease-in-out infinite;
      margin-bottom: 20px;
    }

    @keyframes pulse-splash {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }

    .splash-text {
      font-size: 32px;
      font-family: 'Outfit', sans-serif;
      font-weight: 700;
      color: var(--primary);
      text-align: center;
      animation: fade-in 0.8s ease-out;
    }

    @keyframes fade-in {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* Auth Screen */
    .auth-screen {
      display: flex;
      flex-direction: column;
      padding-top: 40px;
    }

    .auth-header {
      text-align: center;
      margin-bottom: 40px;
    }

    .auth-logo {
      font-size: 60px;
      margin-bottom: 16px;
    }

    .auth-title {
      font-size: 24px;
      color: var(--text-primary);
      margin-bottom: 8px;
    }

    .auth-subtitle {
      font-size: 14px;
      color: var(--text-secondary);
    }

    .auth-step {
      display: none;
    }

    .auth-step.active {
      display: block;
      animation: slide-in 0.3s ease-out;
    }

    @keyframes slide-in {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .form-group {
      margin-bottom: 24px;
    }

    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-input {
      width: 100%;
      padding: 14px 16px;
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: 12px;
      color: var(--text-primary);
      font-size: 16px;
      font-family: 'DM Sans', sans-serif;
      transition: all 0.2s ease;
    }

    .form-input:focus {
      outline: none;
      border-color: var(--primary);
      background: rgba(0, 180, 216, 0.1);
    }

    .form-input::placeholder {
      color: var(--text-secondary);
    }

    .code-input-group {
      display: flex;
      gap: 8px;
      justify-content: space-between;
      margin-bottom: 24px;
    }

    .code-input-group input {
      flex: 1;
      padding: 12px;
      text-align: center;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 2px;
    }

    .fingerprint-display {
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 24px;
      font-size: 11px;
      color: var(--text-secondary);
      font-family: 'Courier New', monospace;
      word-break: break-all;
      max-height: 100px;
      overflow-y: auto;
    }

    .btn {
      padding: 14px 20px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: 'DM Sans', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 48px;
    }

    .btn-primary {
      background: var(--primary);
      color: #000;
      width: 100%;
    }

    .btn-primary:active {
      transform: scale(0.98);
      background: #0099B8;
    }

    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-secondary {
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      color: var(--text-primary);
      width: 100%;
    }

    .btn-secondary:active {
      background: rgba(255, 255, 255, 0.08);
    }

    .btn-small {
      padding: 8px 12px;
      font-size: 14px;
      min-height: auto;
    }

    .btn-success {
      background: var(--success);
      color: #000;
    }

    .btn-warning {
      background: var(--warning);
      color: #000;
    }

    .btn-error {
      background: var(--error);
      color: #fff;
    }

    .error-message {
      color: var(--error);
      font-size: 13px;
      margin-top: 8px;
    }

    .success-message {
      color: var(--success);
      font-size: 13px;
      margin-top: 8px;
    }

    /* Dashboard */
    .dashboard-header {
      margin-bottom: 32px;
      padding-top: 8px;
    }

    .dashboard-welcome {
      font-size: 24px;
      font-family: 'Outfit', sans-serif;
      margin-bottom: 4px;
    }

    .dashboard-date {
      font-size: 13px;
      color: var(--text-secondary);
    }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 12px;
      margin-bottom: 32px;
    }

    .stat-card {
      background: var(--surface-2);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      padding: 14px 10px;
      text-align: center;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      min-width: 0;
      overflow: hidden;
    }

    .stat-icon {
      color: var(--primary);
      opacity: 0.75;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .stat-value {
      font-size: 26px;
      font-weight: 700;
      color: var(--primary);
      line-height: 1;
      margin-bottom: 4px;
      font-family: 'Outfit', sans-serif;
    }

    .stat-label {
      font-size: 10px;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.6px;
      font-weight: 600;
      width: 100%;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .daily-suggestion {
      background: linear-gradient(135deg, rgba(139, 92, 246, 0.18), rgba(0, 180, 216, 0.18));
      border: 1px solid rgba(139, 92, 246, 0.25);
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 32px;
      box-shadow: var(--shadow-sm);
    }

    .suggestion-cta {
      margin-top: 14px;
      background: var(--primary);
      color: #000;
      border: none;
      border-radius: 10px;
      padding: 10px 20px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      transition: opacity var(--duration-fast) ease, transform var(--duration-fast) var(--ease-spring);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: 'DM Sans', sans-serif;
      min-height: 40px;
    }

    .suggestion-cta:active {
      opacity: 0.85;
      transform: scale(0.97);
    }

    .suggestion-label {
      font-size: 11px;
      color: var(--purple);
      text-transform: uppercase;
      font-weight: 600;
      margin-bottom: 8px;
      letter-spacing: 0.5px;
    }

    .suggestion-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 12px;
    }

    .suggestion-progress {
      background: var(--bg-card);
      height: 6px;
      border-radius: 3px;
      overflow: hidden;
      margin-bottom: 8px;
    }

    .suggestion-progress-bar {
      height: 100%;
      background: var(--primary);
      transition: width 0.3s ease;
    }

    .suggestion-meta {
      font-size: 12px;
      color: var(--text-secondary);
    }

    .section-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 16px;
      margin-top: 24px;
    }

    .subjects-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .subject-card {
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: 12px;
      padding: 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .subject-card:active {
      background: rgba(0, 180, 216, 0.1);
      border-color: var(--primary);
    }

    .subject-icon {
      width: 48px;
      height: 48px;
      border-radius: 10px;
      background: rgba(0, 180, 216, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      flex-shrink: 0;
    }

    .subject-info {
      flex: 1;
    }

    .subject-name {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 4px;
    }

    .subject-meta {
      font-size: 12px;
      color: var(--text-secondary);
    }

    .subject-arrow {
      color: var(--text-secondary);
    }

    /* Flashcards Screen */
    .flashcards-header {
      margin-bottom: 24px;
    }

    .filter-bar {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      margin-bottom: 24px;
      padding-bottom: 8px;
      -webkit-overflow-scrolling: touch;
    }

    .filter-bar::-webkit-scrollbar {
      display: none;
    }

    .filter-btn {
      padding: 8px 16px;
      border-radius: 20px;
      border: 1px solid var(--border-card);
      background: transparent;
      color: var(--text-secondary);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
    }

    .filter-btn.active {
      background: var(--primary);
      color: #000;
      border-color: var(--primary);
    }

    .flashcard-container {
      margin-bottom: 24px;
    }

    .flashcard {
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: 16px;
      min-height: 320px;
      height: 320px;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      perspective: 1000px;
      transition: all 0.2s ease;
      position: relative;
      overflow: hidden;
    }

    .flashcard::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(135deg, rgba(0, 180, 216, 0.1), transparent);
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }

    .flashcard:active::before {
      opacity: 1;
    }

    .flashcard-inner {
      width: 100%;
      height: 100%;
      transition: transform 0.6s;
      transform-style: preserve-3d;
      position: relative;
    }

    .flashcard-inner.flipped {
      transform: rotateY(180deg);
    }

    .flashcard-front, .flashcard-back {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      backface-visibility: hidden;
      text-align: center;
      padding: 24px;
      overflow-y: auto;
    }

    .flashcard-back {
      transform: rotateY(180deg);
    }

    .flashcard-label {
      font-size: 11px;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 600;
    }

    .flashcard-text {
      font-size: 18px;
      line-height: 1.5;
      color: var(--text-primary);
      word-wrap: break-word;
    }

    .flashcard-progress {
      width: 100%;
      padding: 0 16px;
      margin-bottom: 20px;
    }

    .progress-dots {
      display: flex;
      gap: 6px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .progress-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
    }

    .progress-dot.current {
      background: var(--primary);
      width: 8px;
      height: 8px;
    }

    .progress-dot.completed {
      background: var(--success);
    }

    .flashcard-actions {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      width: 100%;
      margin-top: 24px;
    }

    .rate-btn {
      padding: 10px;
      border: 1px solid var(--border-card);
      border-radius: 8px;
      background: var(--bg-card);
      color: var(--text-primary);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .rate-btn.error {
      border-color: var(--error);
      color: var(--error);
    }

    .rate-btn.error:active {
      background: rgba(239, 68, 68, 0.1);
    }

    .rate-btn.warning {
      border-color: var(--warning);
      color: var(--warning);
    }

    .rate-btn.warning:active {
      background: rgba(245, 158, 11, 0.1);
    }

    .rate-btn.success {
      border-color: var(--success);
      color: var(--success);
    }

    .rate-btn.success:active {
      background: rgba(16, 185, 129, 0.1);
    }

    /* Anki-style flashcard enhancements */
    .flashcard-hint {
      fontSize: 12px;
      color: var(--text-secondary);
      margin-top: 8px;
      opacity: 0.6;
      font-size: 12px;
    }

    .flashcard-answer {
      font-size: 16px;
      line-height: 1.6;
    }

    .flashcard-explanation {
      font-size: 12px;
      line-height: 1.5;
      color: var(--text-secondary);
      opacity: 0.5;
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      text-align: left;
      width: 100%;
    }

    .anki-actions {
      margin-top: 16px;
    }

    .anki-actions .rate-btn {
      font-size: 14px;
      font-weight: 700;
      padding: 14px 10px;
      flex-direction: row;
      justify-content: center;
      gap: 8px;
    }

    .rate-shortcut {
      font-size: 10px;
      opacity: 0.5;
      background: rgba(255, 255, 255, 0.08);
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 500;
    }

    /* Quiz keyboard hints */
    .kbd-hint {
      font-size: 10px;
      opacity: 0.5;
      background: rgba(255, 255, 255, 0.08);
      padding: 2px 6px;
      border-radius: 4px;
      margin-left: 8px;
      font-weight: 500;
    }

    .quiz-option-number {
      font-size: 11px;
      font-weight: 600;
      opacity: 0.4;
      min-width: 18px;
      height: 18px;
      border-radius: 4px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.06);
      margin-right: 8px;
      flex-shrink: 0;
    }

    .quiz-action-bar {
      margin-top: 16px;
    }

    .subject-card-empty {
      opacity: 0.45;
    }

    .subject-card-empty .subject-select-meta {
      font-style: italic;
    }

    .session-complete {
      text-align: center;
      padding: 40px 0;
    }

    .session-icon {
      font-size: 80px;
      margin-bottom: 24px;
      animation: bounce 0.6s ease;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .session-title {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 16px;
    }

    .session-stats {
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 24px;
    }

    .session-stat {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid var(--border-card);
    }

    .session-stat:last-child {
      border-bottom: none;
    }

    .session-stat-label {
      color: var(--text-secondary);
      font-size: 13px;
    }

    .session-stat-value {
      font-size: 18px;
      font-weight: 700;
      color: var(--primary);
    }

    /* Quiz Screen */
    .quiz-header {
      margin-bottom: 24px;
    }

    .quiz-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .quiz-item {
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: 12px;
      padding: 16px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .quiz-item:active {
      background: rgba(0, 180, 216, 0.1);
      border-color: var(--primary);
    }

    .quiz-subject {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 4px;
    }

    .quiz-count {
      font-size: 12px;
      color: var(--text-secondary);
    }

    .quiz-screen {
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .quiz-progress-section {
      margin-bottom: 24px;
    }

    .quiz-progress-bar {
      width: 100%;
      height: 4px;
      background: var(--bg-card);
      border-radius: 2px;
      overflow: hidden;
      margin-bottom: 12px;
    }

    .quiz-progress-fill {
      height: 100%;
      background: var(--primary);
      transition: width 0.3s ease;
    }

    .quiz-counter {
      font-size: 12px;
      color: var(--text-secondary);
    }

    .quiz-question {
      font-size: 18px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .quiz-options {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 24px;
    }

    .quiz-option {
      padding: 14px;
      background: var(--bg-card);
      border: 2px solid var(--border-card);
      border-radius: 12px;
      color: var(--text-primary);
      cursor: pointer;
      transition: all 0.2s ease;
      font-size: 14px;
      text-align: left;
    }

    .quiz-option:active {
      border-color: var(--primary);
    }

    .quiz-option.selected {
      border-color: var(--primary);
      background: rgba(0, 180, 216, 0.1);
    }

    .quiz-option.correct {
      border-color: var(--success);
      background: rgba(16, 185, 129, 0.1);
    }

    .quiz-option.incorrect {
      border-color: var(--error);
      background: rgba(239, 68, 68, 0.1);
    }

    .quiz-option.crossed-out {
      text-decoration: line-through;
      opacity: 0.35;
      pointer-events: none;
      border-color: var(--border-card);
      background: transparent;
    }

    .quiz-option {
      position: relative;
      padding-right: 44px;
    }

    .cross-btn {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 1px solid var(--border-card);
      background: transparent;
      color: var(--text-secondary);
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      padding: 0;
      min-height: auto;
      text-transform: none;
      letter-spacing: 0;
    }

    .cross-btn:hover {
      border-color: var(--error);
      color: var(--error);
      background: rgba(239, 68, 68, 0.1);
      transform: translateY(-50%);
      box-shadow: none;
    }

    .quiz-feedback {
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 24px;
      font-size: 13px;
      line-height: 1.6;
    }

    .quiz-feedback-title {
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--text-primary);
    }

    .quiz-result-screen {
      text-align: center;
      padding: 40px 0;
    }

    .quiz-score {
      font-size: 72px;
      font-weight: 800;
      color: var(--primary);
      margin-bottom: 16px;
    }

    .quiz-time {
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 32px;
    }

    /* Materials Screen */
    .materials-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .material-subject {
      background: var(--surface-2);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      padding: 16px;
      box-shadow: var(--shadow-sm);
    }

    .material-subject-name {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .material-slots {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .material-slot {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 10px;
      padding: 11px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      opacity: 0.6;
    }

    .material-slot-name {
      font-size: 13px;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .material-badge {
      background: rgba(245, 158, 11, 0.15);
      color: var(--warning);
      border: 1px solid rgba(245, 158, 11, 0.25);
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    /* ── Markdown Reader ───────────────────────────────────────── */
    .markdown-body {
      font-family: 'Lexend', 'DM Sans', sans-serif;
      font-size: 0.93rem;
      line-height: 1.78;
      color: #CBD5E1;
      user-select: text;
      -webkit-user-select: text;
    }

    /* Headings */
    .markdown-body h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 1.4rem;
      font-weight: 800;
      text-align: center;
      background: linear-gradient(135deg, #F1F5F9 0%, #38BDF8 55%, #00B4D8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin: 6px 0 4px;
      padding-bottom: 14px;
      border-bottom: 2px solid rgba(0,180,216,0.25);
      line-height: 1.3;
      letter-spacing: -0.02em;
    }

    /* Breadcrumb linha gerada via JS */
    .md-breadcrumb {
      text-align: center;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.72rem;
      color: #475569;
      margin: 0 0 2px;
      letter-spacing: 0.02em;
    }
    .md-breadcrumb .bc-item { color: #475569; font-weight: 500; }
    .md-breadcrumb .bc-item.current { color: #00B4D8; font-weight: 600; }
    .md-breadcrumb .bc-sep { color: #334155; margin: 0 5px; }

    /* Metadata pills geradas via JS */
    .md-meta {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 6px;
      margin: 8px 0 20px;
    }
    .md-meta-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: rgba(0,180,216,0.1);
      border: 1px solid rgba(0,180,216,0.2);
      border-radius: 20px;
      padding: 3px 11px;
      font-size: 0.75rem;
      color: #7DD3FC;
      font-family: 'DM Sans', sans-serif;
      font-weight: 500;
    }
    .markdown-body h2 {
      font-family: 'Outfit', sans-serif;
      font-size: 1.1rem;
      font-weight: 700;
      color: #E2E8F0;
      margin: 1.6rem 0 0.6rem;
      padding-left: 10px;
      border-left: 3px solid #00B4D8;
      line-height: 1.35;
    }
    .markdown-body h3 {
      font-family: 'Outfit', sans-serif;
      font-size: 0.97rem;
      font-weight: 600;
      color: #38BDF8;
      margin: 1.2rem 0 0.45rem;
      line-height: 1.35;
    }
    .markdown-body h4 {
      font-size: 0.88rem;
      font-weight: 600;
      color: #7DD3FC;
      margin: 1rem 0 0.35rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    /* Paragraphs & text */
    .markdown-body p { margin: 0 0 0.85em; }
    .markdown-body strong {
      font-weight: 600;
      color: #F1F5F9;
    }
    .markdown-body em { color: #94A3B8; font-style: italic; }

    /* Lists */
    .markdown-body ul, .markdown-body ol {
      padding-left: 1.3em;
      margin: 0.5em 0 0.9em;
    }
    .markdown-body li { margin: 0.35em 0; }
    .markdown-body ul li::marker { color: #00B4D8; }
    .markdown-body ol li::marker { color: #00B4D8; font-weight: 600; }
    .markdown-body li > ul, .markdown-body li > ol { margin: 0.2em 0 0.3em; }

    /* Blockquote — destaque / nota importante */
    .markdown-body blockquote {
      border-left: 3px solid #00B4D8;
      margin: 1em 0;
      padding: 10px 14px;
      background: rgba(0, 180, 216, 0.07);
      border-radius: 0 8px 8px 0;
      color: #94A3B8;
      font-style: italic;
    }
    .markdown-body blockquote p { margin: 0; }

    /* Inline code */
    .markdown-body code {
      background: rgba(0, 180, 216, 0.12);
      border: 1px solid rgba(0, 180, 216, 0.2);
      border-radius: 4px;
      padding: 1px 6px;
      font-size: 0.82em;
      font-family: 'Courier New', monospace;
      color: #67E8F9;
    }

    /* Code block */
    .markdown-body pre {
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px;
      padding: 14px 16px;
      overflow-x: auto;
      margin: 1em 0;
    }
    .markdown-body pre code {
      background: none;
      border: none;
      padding: 0;
      font-size: 0.83rem;
      color: #A5F3FC;
    }

    /* Horizontal rule */
    .markdown-body hr {
      border: none;
      border-top: 1px solid rgba(255,255,255,0.1);
      margin: 1.5em 0;
    }

    /* Tables */
    .markdown-body table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
      margin: 1em 0;
      border-radius: 8px;
      overflow: hidden;
    }
    .markdown-body thead tr {
      background: rgba(0, 180, 216, 0.15);
    }
    .markdown-body th {
      padding: 9px 12px;
      font-weight: 600;
      color: #E2E8F0;
      text-align: left;
      border-bottom: 1px solid rgba(0, 180, 216, 0.3);
    }
    .markdown-body td {
      padding: 8px 12px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      color: #CBD5E1;
    }
    .markdown-body tbody tr:last-child td { border-bottom: none; }
    .markdown-body tbody tr:hover { background: rgba(255,255,255,0.03); }

    /* Checklist interativo */
    .markdown-body input[type="checkbox"] {
      accent-color: #00B4D8;
      cursor: pointer;
      width: 15px;
      height: 15px;
      vertical-align: middle;
      margin-right: 6px;
      flex-shrink: 0;
    }
    .markdown-body li:has(input[type="checkbox"]) {
      list-style: none;
      margin-left: -1.3em;
      display: flex;
      align-items: flex-start;
      gap: 2px;
      padding: 3px 0;
      border-radius: 6px;
      transition: background 0.15s;
    }
    .markdown-body li:has(input[type="checkbox"]:checked) {
      color: #475569;
      text-decoration: line-through;
      text-decoration-color: #334155;
    }

    /* Pré-Prova amber headings override */
    .markdown-body.preprova-content h2 {
      color: #FCD34D;
      border-left-color: #F59E0B;
    }
    .markdown-body.preprova-content h3 { color: #FBBF24; }
    .markdown-body.preprova-content ul li::marker { color: #F59E0B; }
    .markdown-body.preprova-content blockquote {
      border-left-color: #F59E0B;
      background: rgba(245,158,11,0.07);
    }

    /* Profile Screen */
    .profile-avatar {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary), var(--purple));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: 700;
      font-family: 'Outfit', sans-serif;
      color: #fff;
      margin: 0 auto 8px;
      box-shadow: 0 4px 16px rgba(0, 180, 216, 0.3);
    }

    .profile-name {
      font-size: 18px;
      font-weight: 700;
      color: var(--text-primary);
      text-align: center;
      margin-bottom: 4px;
      font-family: 'Outfit', sans-serif;
    }

    .profile-meta {
      font-size: 13px;
      color: var(--text-secondary);
      text-align: center;
      margin-bottom: 24px;
    }

    .profile-section {
      background: var(--surface-2);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: var(--shadow-sm);
    }

    .profile-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 11px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .profile-item:last-child {
      border-bottom: none;
    }

    .profile-label {
      font-size: 12px;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 600;
    }

    .profile-value {
      font-size: 14px;
      color: var(--text-primary);
      font-weight: 600;
      word-break: break-all;
      text-align: right;
    }

    .profile-value-small {
      font-size: 11px;
      font-family: 'Courier New', monospace;
      color: var(--text-secondary);
    }

    .profile-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 16px;
    }

    .profile-stat {
      background: var(--surface-2);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      padding: 14px 12px;
      text-align: center;
      box-shadow: var(--shadow-sm);
    }

    .profile-stat-icon {
      font-size: 18px;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .profile-stat-value {
      font-size: 22px;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 4px;
      font-family: 'Outfit', sans-serif;
    }

    .profile-stat-label {
      font-size: 10px;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 600;
    }

    /* Bottom Navigation */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      max-width: 430px;
      margin: 0 auto;
      background: rgba(10, 22, 40, 0.94);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid var(--border-subtle);
      box-shadow: 0 -4px 24px rgba(0, 0, 0, 0.3);
      display: flex;
      justify-content: space-around;
      padding: 8px 4px 20px;
      z-index: 100;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      cursor: pointer;
      padding: 6px 12px;
      border-radius: 12px;
      transition: background var(--duration-fast) ease, color var(--duration-fast) ease;
      position: relative;
      min-width: 56px;
    }

    .nav-item.active {
      color: var(--primary);
      background: rgba(0, 180, 216, 0.12);
    }

    .nav-item.active::after {
      content: '';
      position: absolute;
      top: -8px;
      left: 50%;
      transform: translateX(-50%);
      width: 20px;
      height: 2px;
      background: var(--primary);
      border-radius: 0 0 2px 2px;
    }

    .nav-item:not(.active) {
      color: var(--text-secondary);
    }

    .nav-item:not(.active):active {
      background: var(--surface-2);
    }

    .nav-icon {
      width: 22px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .nav-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.01em;
    }

    /* Loading */
    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--border-card);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Semester Selector */
    .semester-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 24px;
    }

    .semester-btn {
      padding: 14px 8px;
      border: 2px solid var(--border-card);
      border-radius: 12px;
      background: var(--bg-card);
      color: var(--text-secondary);
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
      min-height: auto;
      text-transform: none;
      letter-spacing: 0;
    }

    .semester-btn:hover {
      border-color: var(--primary);
      color: var(--primary);
      background: rgba(0, 180, 216, 0.08);
      transform: none;
      box-shadow: none;
    }

    .semester-btn.selected {
      border-color: var(--primary);
      background: rgba(0, 180, 216, 0.15);
      color: var(--primary);
    }

    /* Semester group headers in subject lists */
    .semester-group-header {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 1px;
      padding: 16px 0 8px;
      border-bottom: 1px solid var(--border-card);
      margin-bottom: 12px;
    }

    .semester-group-header:first-child {
      padding-top: 0;
    }

    /* Subject selection list (cleaner version) */
    .subject-select-list {
      display: flex;
      flex-direction: column;

  <!-- Service Worker: registro + limpeza de SWs antigos de deploys anteriores -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {

        // Limpar SWs de versões anteriores registrados em paths diferentes
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          registrations.forEach(function(reg) {
            var url = reg.active ? reg.active.scriptURL : (reg.installing ? reg.installing.scriptURL : '');
            if (!url.endsWith('/sw.js')) reg.unregister();
          });
        });

        // Registrar SW atual
        navigator.serviceWorker.register('/sw.js').then(function(registration) {
          if (registration.waiting) {
            registration.waiting.postMessage({ type: 'SKIP_WAITING' });
          }
          registration.addEventListener('updatefound', function() {
            var newWorker = registration.installing;
            if (!newWorker) return;
            newWorker.addEventListener('statechange', function() {
              if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                newWorker.postMessage({ type: 'SKIP_WAITING' });
              }
            });
          });
        }).catch(function(err) {
          console.warn('MedUni9: SW registration failed:', err);
        });

        // Recarregar quando novo SW assumir o controle
        var refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', function() {
          if (refreshing) return;
          refreshing = true;
          window.location.reload();
        });

      });
    }
  </script>

    const { useState, useEffect, useRef, useCallback, useMemo } = React;

    const FEEDBACK_TYPES = [

    const FEEDBACK_RATE_KEY = 'meduni9_fb_day';
    const FEEDBACK_MAX_DAY  = 3;

    function getFeedbackToday() {
      try {
        const raw = JSON.parse(localStorage.getItem(FEEDBACK_RATE_KEY) || '{}');
        const today = new Date().toISOString().slice(0, 10);
        return raw.date === today ? (raw.count || 0) : 0;
      } catch { return 0; }
    }

    function incrementFeedbackCount() {
      const today = new Date().toISOString().slice(0, 10);
      const count = getFeedbackToday() + 1;
      localStorage.setItem(FEEDBACK_RATE_KEY, JSON.stringify({ date: today, count }));

      const remaining = maxLen - mensagem.length;

      const todayCount = getFeedbackToday();
      const limitReached = todayCount >= FEEDBACK_MAX_DAY;

      const handleSend = async () => {
        if (!mensagem.trim()) { setErroMsg('Escreva sua mensagem antes de enviar.'); return; }
        if (!window.__fbAddFeedback) { setErroMsg('Feedback indisponível no momento.'); return; }
        setSending(true); setErroMsg('');
        try {
          const payload = {
            tipo,
            mensagem: mensagem.trim().slice(0, maxLen),
            criadoEm: new Date().toISOString(),
          };
          if (currentMateria) payload.disciplina = String(currentMateria).slice(0, 20);
          await window.__fbAddFeedback(payload);
          incrementFeedbackCount();
          setSent(true);

      const userAgent = navigator.userAgent;

      const timezone = Intl.DateTimeFormat().resolvedOptions().timeZone;

      let canvas_hash = '';
      try {

        const ctx = canvas.getContext('2d');
        ctx.fillText('MedUni9', 10, 10);
        canvas_hash = canvas.toDataURL().substring(0, 50);

      return `${userAgent.substring(0, 30)}_${screen_res}_${timezone}_${canvas_hash}`.substring(0, 128);
    };

    // SM-2 Algorithm
    const SM2 = {
      calculateNextReview: (quality, reps, ef, interval) => {
        let newReps = reps + 1;
        let newEf = ef + 0.1 - (5 - quality) * (0.08 + (5 - quality) * 0.02);
        if (newEf < 1.3) newEf = 1.3;

        let newInterval;
        if (newReps === 1) newInterval = 1;
        else if (newReps === 2) newInterval = 3;
        else newInterval = Math.round(interval * newEf);

        const nextReview = Date.now() + (newInterval * 24 * 60 * 60 * 1000);
        return { newReps, newEf, newInterval, nextReview };
      },

      getDueCards: (cards, srData) => {
        const now = Date.now();
        return cards.filter(card => {
          const data = srData[card.id] || { nextReview: 0 };
          return data.nextReview <= now;
        }).sort((a, b) => {
          const aData = srData[a.id] || { nextReview: 0 };
          const bData = srData[b.id] || { nextReview: 0 };
          return aData.nextReview - bData.nextReview;

      }

    // ===================== Security Utilities =====================
    const CODE_SALT = 'meduni9_2026_';
    const MAX_ATTEMPTS = 5;
    const LOCKOUT_BASE_MS = 60000; // 1 minute base lockout

    async function hashCode(code) {
      const encoder = new TextEncoder();
      const data = encoder.encode(CODE_SALT + code);
      const hashBuffer = await crypto.subtle.digest('SHA-256', data);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    function getRateLimitState() {
      try {
        const raw = localStorage.getItem('meduni9_rl');
        if (!raw) return { attempts: 0, lockedUntil: 0, history: [] };
        return JSON.parse(raw);
      } catch { return { attempts: 0, lockedUntil: 0, history: [] }; }
    }

    function setRateLimitState(state) {
      localStorage.setItem('meduni9_rl', JSON.stringify(state));
    }

    function checkRateLimit() {
      const state = getRateLimitState();
      const now = Date.now();
      if (state.lockedUntil > now) {
        const remainSec = Math.ceil((state.lockedUntil - now) / 1000);
        const mins = Math.floor(remainSec / 60);
        const secs = remainSec % 60;
        return { allowed: false, message: `Muitas tentativas. Tente novamente em ${mins}m${secs}s.` };
      }
      // Clear old attempts (older than 10 minutes)
      state.history = (state.history || []).filter(t => now - t < 600000);
      if (state.history.length >= MAX_ATTEMPTS) {
        // Exponential backoff: 1min, 2min, 4min, 8min, 16min, max 30min
        const lockoutMs = Math.min(LOCKOUT_BASE_MS * Math.pow(2, state.attempts - MAX_ATTEMPTS), 1800000);
        state.lockedUntil = now + lockoutMs;
        state.attempts++;
        setRateLimitState(state);
        return { allowed: false, message: `Muitas tentativas. Bloqueado por ${Math.ceil(lockoutMs/60000)} minutos.` };
      }
      return { allowed: true };
    }

    function recordFailedAttempt() {
      const state = getRateLimitState();
      state.history = [...(state.history || []), Date.now()];
      state.attempts = (state.attempts || 0) + 1;
      setRateLimitState(state);
    }

    function resetRateLimit() {
      localStorage.removeItem('meduni9_rl');
    }

    // Auth Screen
    const AuthScreen = ({ onAuthSuccess }) => {
      const [step, setStep] = useState(1);
      const [code, setCode] = useState('');
      const [email, setEmail] = useState('');
      const [semester, setSemester] = useState(null);
      const [fingerprint, setFingerprint] = useState('');
      const [error, setError] = useState('');
      const [loading, setLoading] = useState(false);
      const [validatedCode, setValidatedCode] = useState(null);

      useEffect(() => {
        generateDeviceFingerprint().then(fp => setFingerprint(fp));
      }, []);

      const handleCodeChange = (e) => {
        let value = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
        if (value.length > 12) value = value.slice(0, 12);

        if (value.length > 8) {
          value = value.slice(0, 4) + '-' + value.slice(4, 8) + '-' + value.slice(8);
        } else if (value.length > 4) {
          value = value.slice(0, 4) + '-' + value.slice(4);
        }
        setCode(value);
      };

      const handleCodeSubmit = async () => {
        setError('');
        if (!code || code.length < 14) {
          setError('Código inválido. Use o formato XXXX-XXXX-XXXX');
          return;
        }

        // Rate limit check
        const rl = checkRateLimit();
        if (!rl.allowed) {
          setError(rl.message);
          return;
        }

        setLoading(true);
        try {
          // Hash the code
          const codeHash = await hashCode(code);

          // Fetch codes database
          const response = await fetch('data/codigos.json?_=' + Date.now());
          if (!response.ok) throw new Error('Erro ao verificar código');
          const data = await response.json();

          const codeEntry = data.codigos[codeHash];

          // Validate code exists
          if (!codeEntry) {
            recordFailedAttempt();
            setLoading(false);
            setError('Código de acesso inválido.');
            return;
          }

          // Validate code is active
          if (!codeEntry.ativo) {
            recordFailedAttempt();
            setLoading(false);
            setError('Este código foi desativado.');
            return;
          }

          // Validate expiration
          if (codeEntry.expira) {
            const expirationDate = new Date(codeEntry.expira);
            if (new Date() > expirationDate) {
              recordFailedAttempt();
              setLoading(false);
              setError('Este código expirou em ' + expirationDate.toLocaleDateString('pt-BR') + '.');
              return;
            }
          }

          // Validate device limit
          const registeredDevices = codeEntry.dispositivos || [];
          if (!registeredDevices.includes(fingerprint) && registeredDevices.length >= codeEntry.maxDispositivos) {
            recordFailedAttempt();
            setLoading(false);
            setError('Limite de dispositivos atingido para este código.');
            return;
          }

          // Code is valid!
          resetRateLimit();
          setValidatedCode({ hash: codeHash, ...codeEntry });
          setLoading(false);
          setStep(2);

        } catch (err) {
          setLoading(false);
          setError('Erro ao verificar código. Verifique sua conexão.');
        }
      };

      const handleEmailSubmit = async () => {
        setError('');
        if (!email) {
          setError('Email é obrigatório');
          return;
        }
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
          setError('Email inválido');
          return;
        }

        // Validate email against code's associated email
        if (validatedCode && validatedCode.email && validatedCode.email !== email) {
          setError('Este código está associado a outro email.');
          return;
        }

        setLoading(true);
        setTimeout(() => {
          setLoading(false);
          setStep(3);
        }, 500);
      };

      const handleSemesterSubmit = () => {
        if (!semester) {
          setError('Selecione seu módulo');
          return;
        }

        // Generate session integrity token
        const sessionToken = btoa(JSON.stringify({
          ts: Date.now(),
          fp: fingerprint,
          ch: validatedCode?.hash?.substring(0, 8) || ''
        }));

        const userData = {
          email,
          codeHash: validatedCode?.hash?.substring(0, 8) || '',
          plano: validatedCode?.plano || 'basico',
          semestre: semester,
          modulo: semester,
          deviceId: fingerprint,
          loginDate: new Date().toISOString(),
          sessionToken
        };
        localStorage.setItem('meduni9_user', JSON.stringify(userData));
        onAuthSuccess(userData);
      };

      return (
        <div className="app-container">
          <div className="screen-content" style={{ display: 'flex', flexDirection: 'column', justifyContent: 'center', height: '100%', paddingBottom: '40px' }}>
            <div className="auth-header">
              <div className="auth-logo">🩺</div>
              <h1 className="auth-title">MedUni9</h1>
              <p className="auth-subtitle">Plataforma de estudos para medicina</p>
            </div>

            <div style={{ maxWidth: '400px', width: '100%', margin: '0 auto' }}>
              {/* Step 1: Code */}
              <div className={`auth-step ${step === 1 ? 'active' : ''}`}>
                <h2 style={{ fontSize: '18px', marginBottom: '8px', color: 'var(--text-primary)' }}>
                  Etapa 1: Código de Acesso
                </h2>
                <p style={{ fontSize: '13px', color: 'var(--text-secondary)', marginBottom: '24px' }}>
                  Digite seu código de ativação no formato XXXX-XXXX-XXXX
                </p>
                {error && step === 1 && <div className="error-message" style={{ marginBottom: '16px' }}>{error}</div>}
                <input
                  className="form-input"
                  type="text"
                  placeholder="XXXX-XXXX-XXXX"
                  value={code}
                  onChange={handleCodeChange}
                  maxLength={14}
                  style={{ textAlign: 'center', fontSize: '20px', letterSpacing: '2px', marginBottom: '16px' }}
                />
                <button
                  className="btn btn-primary"
                  onClick={handleCodeSubmit}
                  disabled={loading}
                >
                  {loading ? 'Verificando...' : 'Continuar'}
                </button>
              </div>

              {/* Step 2: Email */}
              <div className={`auth-step ${step === 2 ? 'active' : ''}`}>
                <h2 style={{ fontSize: '18px', marginBottom: '8px', color: 'var(--text-primary)' }}>
                  Etapa 2: Seu Email
                </h2>
                <p style={{ fontSize: '13px', color: 'var(--text-secondary)', marginBottom: '24px' }}>
                  Informe seu email institucional ou pessoal
                </p>
                {error && step === 2 && <div className="error-message">{error}</div>}
                <input
                  className="form-input"
                  type="email"
                  placeholder="seu@email.com"
                  value={email}
                  onChange={e => setEmail(e.target.value)}
                  style={{ marginBottom: '16px' }}
                />
                <button className="btn btn-primary" onClick={handleEmailSubmit} disabled={loading}>
                  {loading ? 'Verificando...' : 'Continuar'}
                </button>
                <button className="btn btn-secondary mt-2" onClick={() => { setStep(1); setError(''); }}>
                  Voltar
                </button>
              </div>

              {/* Step 3: Module */}
              <div className={`auth-step ${step === 3 ? 'active' : ''}`}>
                <h2 style={{ fontSize: '18px', marginBottom: '8px', color: 'var(--text-primary)' }}>
                  Etapa 3: Seu Módulo
                </h2>
                <p style={{ fontSize: '13px', color: 'var(--text-secondary)', marginBottom: '24px' }}>
                  Em qual módulo da Uninove você está?
                </p>
                {error && step === 3 && <div className="error-message" style={{ marginBottom: '16px' }}>{error}</div>}
                <div className="semester-grid">
                  {[1,2,3,4,5,6].map(s => (
                    <button
                      key={s}
                      className={`semester-btn ${semester === s ? 'selected' : ''}`}
                      onClick={() => { setSemester(s); setError(''); }}
                    >
                      Módulo {s}
                    </button>
                  ))}
                </div>
                <button className="btn btn-primary" onClick={handleSemesterSubmit}>
                  Entrar
                </button>
                <button className="btn btn-secondary mt-2" onClick={() => { setStep(2); setError(''); }}>
                  Voltar
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    };

    // Dashboard Screen
    const DashboardScreen = ({ user, materias, flashcards, onSelectMateria }) => {
      const [stats, setStats] = useState({ cardsToday: 0, questionsToday: 0, accuracy: 0 });
      const [viewAll, setViewAll] = useState(false);
      const userSemester = user.semestre || user.modulo || 1;

      useEffect(() => {
        const srData = JSON.parse(localStorage.getItem('meduni9_sr_data') || '{}');
        const quizHistory = JSON.parse(localStorage.getItem('meduni9_quiz_history') || '[]');

        const today = new Date().toDateString();
        const todayQuizzes = quizHistory.filter(q => new Date(q.date).toDateString() === today);
        const correctCount = todayQuizzes.filter(q => q.score === q.total).length;

        setStats({
          cardsToday: Object.keys(srData).length,
          questionsToday: todayQuizzes.length,
          accuracy: todayQuizzes.length > 0 ? Math.round((correctCount / todayQuizzes.length) * 100) : 0
        });
      }, []);

      const dueCards = SM2.getDueCards(flashcards, JSON.parse(localStorage.getItem('meduni9_sr_data') || '{}'));

      const displayMaterias = viewAll
        ? materias.filter(m => m.ativo !== false)
        : materias.filter(m => m.modulo === userSemester && m.ativo !== false);

      // Group by semester when viewing all
      const groupedMaterias = useMemo(() => {
        if (!viewAll) return { [userSemester]: displayMaterias };
        const groups = {};
        displayMaterias.forEach(m => {
          const sem = m.modulo || 0;
          if (!groups[sem]) groups[sem] = [];
          groups[sem].push(m);
        });
        return groups;
      }, [displayMaterias, viewAll, userSemester]);

      return (
        <>
          <div className="screen-content">
            <div className="dashboard-header">
              <h1 className="dashboard-welcome">Olá, {user.email.split('@')[0]}!</h1>
              <p className="dashboard-date">{new Date().toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long' })} — Módulo {userSemester}</p>
            </div>

            <div className="stats-grid">
              <div className="stat-card">
                <div className="stat-icon"><IconLayers /></div>
                <div className="stat-value">{stats.cardsToday}</div>
                <div className="stat-label">Cards</div>
              </div>
              <div className="stat-card">
                <div className="stat-icon"><IconClipboardList /></div>
                <div className="stat-value">{stats.questionsToday}</div>
                <div className="stat-label">Questões</div>
              </div>
              <div className="stat-card">
                <div className="stat-icon"><IconTarget /></div>
                <div className="stat-value">{stats.accuracy}%</div>
                <div className="stat-label">Acurácia</div>
              </div>
            </div>

            {dueCards.length > 0 && (
              <div className="daily-suggestion">
                <div className="suggestion-label">Sugestão do Dia</div>
                <div className="suggestion-title">{dueCards.length} cards para revisar</div>
                <div className="suggestion-progress">
                  <div className="suggestion-progress-bar" style={{ width: `${Math.min(100, Math.round((dueCards.length / Math.max(flashcards.length, 1)) * 100))}%` }}></div>
                </div>
                <div className="suggestion-meta">
                  {Math.round((dueCards.length / Math.max(flashcards.length, 1)) * 100)}% do seu deck
                </div>
                <button className="suggestion-cta" onClick={() => onSelectMateria(null)}>
                  <IconPlay /> Estudar agora
                </button>
              </div>
            )}

            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
              <div className="section-title" style={{ margin: 0 }}>Disciplinas</div>
              <button
                className="semester-tab"
                style={{ marginTop: '24px', fontSize: '12px', padding: '6px 12px' }}
                onClick={() => setViewAll(!viewAll)}
              >
                {viewAll ? 'Meu módulo' : 'Ver todos'}
              </button>
            </div>

            <div className="subject-select-list" style={{ marginTop: '16px' }}>
              {Object.entries(groupedMaterias).sort(([a],[b]) => Number(a) - Number(b)).map(([sem, mats]) => (
                <React.Fragment key={sem}>
                  {viewAll && (
                    <div className="semester-group-header">Módulo {sem}</div>
                  )}
                  {mats.map((materia) => {
                    const materiaCards = flashcards.filter(f => f.materia === materia.id && f.tipo !== 'quiz');
                    const srData = JSON.parse(localStorage.getItem('meduni9_sr_data') || '{}');
                    const reviewedCount = materiaCards.filter(f => srData[f.id]).length;
                    const pct = materiaCards.length > 0 ? Math.round((reviewedCount / materiaCards.length) * 100) : 0;
                    const subjectColor = SUBJECT_ICON_MAP[materia.id]?.color || materia.cor || 'var(--primary)';
                    return (
                      <div
                        key={materia.id}
                        className="subject-select-card"
                        onClick={() => onSelectMateria(materia.id)}
                      >
                        <SubjectIcon materiaId={materia.id} icon={materia.icon} cor={materia.cor} />
                        <div className="subject-select-info">
                          <div className="subject-select-name">{materia.sigla || materia.nome}</div>
                          <div className="subject-select-meta">
                            {materia.nome}{materiaCards.length > 0 ? ` — ${materiaCards.length} cards` : ''}
                          </div>
                          {materiaCards.length > 0 && (
                            <div className="subject-progress-bar">
                              <div className="subject-progress-fill" style={{ width: `${pct}%`, background: subjectColor }} />
                            </div>
                          )}
                        </div>
                        <div style={{ color: 'var(--text-secondary)' }}>
                          <IconChevronRight />
                        </div>
                      </div>
                    );
                  })}
                </React.Fragment>
              ))}

              {displayMaterias.length === 0 && (
                <div style={{ textAlign: 'center', padding: '40px 0', color: 'var(--text-secondary)' }}>
                  <p>Nenhuma disciplina para o Módulo {userSemester} ainda.</p>
                  <button className="btn btn-secondary mt-2" onClick={() => setViewAll(true)}>
                    Ver todas as disciplinas
                  </button>
                </div>
              )}
            </div>
          </div>
        </>
      );
    };

    // Flashcards Screen
    const FlashcardsScreen = ({ flashcards, materias, selectedMateria, onSelectMateria, userSemester }) => {
      const [currentIndex, setCurrentIndex] = useState(0);
      const [isFlipped, setIsFlipped] = useState(false);
      const [sessionComplete, setSessionComplete] = useState(false);
      const [sessionStats, setSessionStats] = useState({ correct: 0, total: 0 });
      const [semesterFilter, setSemesterFilter] = useState(userSemester || null);
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedTemas, setSelectedTemas] = useState([]);
      const [studying, setStudying] = useState(false);
      const srData = JSON.parse(localStorage.getItem('meduni9_sr_data') || '{}');

      useEffect(() => {
        setCurrentIndex(0);
        setIsFlipped(false);
        setSessionComplete(false);
        setSessionStats({ correct: 0, total: 0 });
        setStudying(false);
        setSelectedTemas([]);
      }, [selectedMateria]);

      // Keyboard shortcuts
      useEffect(() => {
        if (!studying || sessionComplete) return;
        const handleKey = (e) => {
          if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
          if (!isFlipped) {
            if (e.code === 'Space' || e.key === ' ') { e.preventDefault(); setIsFlipped(true); }
          } else {
            if (e.key === '1') handleRate(1);
            else if (e.key === '2') handleRate(3);
            else if (e.key === '3') handleRate(5);
            else if (e.code === 'Space' || e.key === ' ') { e.preventDefault(); setIsFlipped(false); }
          }
        };
        window.addEventListener('keydown', handleKey);
        return () => window.removeEventListener('keydown', handleKey);
      }, [studying, sessionComplete, isFlipped, currentIndex]);

      const pureFlashcards = flashcards.filter(f => f.tipo !== 'quiz');

      const filteredByMateria = pureFlashcards.filter(
        f => !selectedMateria || f.materia === selectedMateria
      );

      const filtered = selectedTemas.length === 0
        ? filteredByMateria
        : filteredByMateria.filter(f => selectedTemas.includes(f.tema));

      // Always SM2 — get due cards, fallback to all shuffled if none due
      const deck = useMemo(() => {
        if (!selectedMateria || !studying) return [];
        const due = SM2.getDueCards(filtered, srData);
        if (due.length > 0) return due;
        return [...filtered].sort(() => Math.random() - 0.5);
      }, [selectedMateria, studying, filtered.length, selectedTemas.length]);

      const currentCard = deck[currentIndex];

      const handleRate = (quality) => {
        const card = currentCard;
        if (!card) return;
        const currentData = srData[card.id] || { reps: 0, ef: 2.5, interval: 0, nextReview: Date.now() };
        const result = SM2.calculateNextReview(quality, currentData.reps, currentData.ef, currentData.interval);
        srData[card.id] = { ...result };
        localStorage.setItem('meduni9_sr_data', JSON.stringify(srData));

        const isGood = quality >= 3;
        const newStats = { ...sessionStats, total: sessionStats.total + 1, correct: sessionStats.correct + (isGood ? 1 : 0) };

        if (currentIndex < deck.length - 1) {
          setCurrentIndex(currentIndex + 1);
          setIsFlipped(false);
          setSessionStats(newStats);
        } else {
          setSessionStats(newStats);
          setSessionComplete(true);
        }
      };

      const resetSession = () => {
        setCurrentIndex(0);
        setIsFlipped(false);
        setSessionComplete(false);
        setSessionStats({ correct: 0, total: 0 });
        setStudying(false);
        setSelectedTemas([]);
      };

      const toggleTema = (temaId) => {
        setSelectedTemas(prev =>
          prev.includes(temaId) ? prev.filter(t => t !== temaId) : [...prev, temaId]
        );
      };

      // Materia selection screen
      if (!selectedMateria) {
        const allMaterias = materias.filter(m => m.ativo !== false);
        const semFiltered = semesterFilter ? allMaterias.filter(m => m.modulo === semesterFilter) : allMaterias;
        const filteredMaterias = semFiltered.filter(m => fuzzyMatch(searchQuery, m.nome) || fuzzyMatch(searchQuery, m.sigla || ''));
        const semesters = [...new Set(allMaterias.map(m => m.modulo))].sort((a,b) => a-b);

        return (
          <>
            <div className="screen-content">
              <h2 className="section-title">Flashcards</h2>
              {semesters.length > 1 && (
                <div className="semester-tabs">
                  <button className={`semester-tab ${!semesterFilter ? 'active' : ''}`} onClick={() => setSemesterFilter(null)}>Todos</button>
                  {semesters.map(s => (
                    <button key={s} className={`semester-tab ${semesterFilter === s ? 'active' : ''}`} onClick={() => setSemesterFilter(s)}>Módulo {s}</button>
                  ))}
                </div>
              )}
              <div className="subject-search-wrap">
                <span className="subject-search-icon"><IconSearch /></span>
                <input type="search" className="subject-search" placeholder="Buscar matéria..." value={searchQuery} onChange={e => setSearchQuery(e.target.value)} />
              </div>
              <div className="subject-select-list">
                {filteredMaterias.length === 0 && (
                  <div style={{ textAlign: 'center', padding: '40px 0', color: 'var(--text-secondary)' }}><p>Nenhum resultado encontrado.</p></div>
                )}
                {filteredMaterias.map(m => {
                  const count = pureFlashcards.filter(f => f.materia === m.id).length;
                  const dueCount = SM2.getDueCards(pureFlashcards.filter(f => f.materia === m.id), srData).length;
                  const reviewedCount = count - dueCount;
                  const pct = count > 0 ? Math.round((reviewedCount / count) * 100) : 0;
                  const subjectColor = SUBJECT_ICON_MAP[m.id]?.color || m.cor || 'var(--primary)';
                  return (
                    <div key={m.id} className={`subject-select-card${count === 0 ? ' subject-card-empty' : ''}`} onClick={() => { onSelectMateria(m.id); setStudying(false); }}>
                      <SubjectIcon materiaId={m.id} icon={m.icon} cor={m.cor} />
                      <div className="subject-select-info">
                        <div className="subject-select-name">{m.sigla || m.nome}</div>
                        <div className="subject-select-meta">
                          {count > 0 ? `${count} cards${dueCount > 0 ? ` — ${dueCount} para revisar` : ' — em dia ✓'}` : 'Em breve'}
                        </div>
                        {count > 0 && (
                          <div className="subject-progress-bar">
                            <div className="subject-progress-fill" style={{ width: `${pct}%`, background: subjectColor }} />
                          </div>
                        )}
                      </div>
                      <div style={{ color: 'var(--text-secondary)' }}><IconChevronRight /></div>
                    </div>
                  );
                })}
              </div>
            </div>
          </>
        );
      }

      const selectedMateriaObj = materias.find(m => m.id === selectedMateria);
      const backLabel = selectedMateriaObj ? (selectedMateriaObj.sigla || selectedMateriaObj.nome) : 'Flashcards';

      // Tema selector
      if (!studying) {
        const totalCards = filteredByMateria.length;
        const dueTotal = SM2.getDueCards(filteredByMateria, srData).length;
        const materiaObj = materias.find(m => m.id === selectedMateria);
        const temasFromCards = [...new Set(filteredByMateria.map(f => f.tema).filter(Boolean))];

        // Use aulas from materias.json for organized display
        const aulas = materiaObj?.aulas || [];
        const hasAulas = aulas.length > 0;

        return (
          <>
            <div className="screen-content">
              <button className="back-btn" onClick={() => onSelectMateria(null)}>← Flashcards</button>
              <h2 className="section-title">{backLabel}</h2>
              <p style={{ color: 'var(--text-secondary)', fontSize: '14px', marginBottom: '16px' }}>
                {totalCards > 0 ? (dueTotal > 0 ? `${dueTotal} cards para revisar hoje` : 'Todos os cards em dia!') : 'Nenhum flashcard ainda'} — {totalCards} total
              </p>
              <div className="subject-select-list" style={{ paddingBottom: selectedTemas.length > 0 ? '72px' : '0' }}>
                <div className="subject-select-card" onClick={() => { setSelectedTemas([]); setStudying(true); }}
                  style={{ borderColor: 'var(--primary)', background: 'rgba(0,180,216,0.06)', marginBottom: '8px' }}>
                  <div className="subject-select-icon" style={{ background: 'rgba(0,180,216,0.15)', color: 'var(--primary)' }}><IconBookOpen /></div>
                  <div className="subject-select-info">
                    <div className="subject-select-name">Todos os assuntos</div>
                    <div className="subject-select-meta">{totalCards} cards{dueTotal > 0 ? ` — ${dueTotal} para revisar` : ''}</div>
                  </div>
                  <div style={{ color: 'var(--primary)' }}><IconChevronRight /></div>
                </div>

                {hasAulas ? (
                  aulas.map(aula => {
                    const cards = filteredByMateria.filter(f => f.tema === aula.id);
                    const dueCount = SM2.getDueCards(cards, srData).length;
                    const isChecked = selectedTemas.includes(aula.id);
                    const hasCards = cards.length > 0;
                    return (
                      <div key={aula.id} className={`subject-select-card${isChecked ? ' tema-selected' : ''}${!hasCards ? ' subject-card-empty' : ''}`} onClick={() => hasCards && toggleTema(aula.id)}>
                        <div className={`tema-checkbox${isChecked ? ' tema-checkbox-checked' : ''}`}>{isChecked ? '✓' : ''}</div>
                        <div className="subject-select-info">
                          <div className="subject-select-name">{aula.tema}</div>
                          <div className="subject-select-meta">{hasCards ? `${cards.length} cards${dueCount > 0 ? ` — ${dueCount} para revisar` : ' — em dia'}` : 'Em breve'}</div>
                        </div>
                      </div>
                    );
                  })
                ) : (
                  temasFromCards.sort().map(tema => {
                    const count = filteredByMateria.filter(f => f.tema === tema).length;
                    const dueCount = SM2.getDueCards(filteredByMateria.filter(f => f.tema === tema), srData).length;
                    const isChecked = selectedTemas.includes(tema);
                    return (
                      <div key={tema} className={`subject-select-card${isChecked ? ' tema-selected' : ''}`} onClick={() => toggleTema(tema)}>
                        <div className={`tema-checkbox${isChecked ? ' tema-checkbox-checked' : ''}`}>{isChecked ? '✓' : ''}</div>
                        <div className="subject-select-info">
                          <div className="subject-select-name">{tema}</div>
                          <div className="subject-select-meta">{count} cards{dueCount > 0 ? ` — ${dueCount} para revisar` : ' — em dia'}</div>
                        </div>
                      </div>
                    );
                  })
                )}
              </div>

              {selectedTemas.length > 0 && (
                <div className="tema-start-bar">
                  <span style={{ color: 'var(--text-secondary)', fontSize: '13px' }}>
                    {selectedTemas.length} assunto{selectedTemas.length > 1 ? 's' : ''} selecionado{selectedTemas.length > 1 ? 's' : ''}
                  </span>
                  <button className="btn btn-primary" style={{ padding: '8px 20px', fontSize: '14px' }} onClick={() => setStudying(true)}>
                    Iniciar estudo →
                  </button>
                </div>
              )}
            </div>
          </>
        );
      }

      // Session complete
      if (sessionComplete) {
        return (
          <>
            <div className="screen-content">
              <div className="session-complete">
                <div className="session-icon">🎉</div>
                <h2 className="session-title">Sessão Concluída!</h2>
                <div className="session-stats">
                  <div className="session-stat">
                    <span className="session-stat-label">Cards Revisados</span>
                    <span className="session-stat-value">{sessionStats.total}</span>
                  </div>
                  <div className="session-stat">
                    <span className="session-stat-label">Acertos</span>
                    <span className="session-stat-value">{sessionStats.correct}</span>
                  </div>
                  <div className="session-stat">
                    <span className="session-stat-label">Taxa de Acerto</span>
                    <span className="session-stat-value">
                      {Math.round((sessionStats.correct / Math.max(sessionStats.total, 1)) * 100)}%
                    </span>
                  </div>
                </div>
                <button className="btn btn-primary" onClick={resetSession}>Nova Sessão</button>
                <button className="btn btn-secondary mt-2" onClick={() => { setStudying(false); setSelectedTemas([]); }}>Escolher outro assunto</button>
              </div>
            </div>
          </>
        );
      }

      // No cards
      if (deck.length === 0) {
        const hasAnyCards = filteredByMateria.length > 0;
        return (
          <>
            <div className="screen-content">
              <button className="back-btn" onClick={() => setStudying(false)}>← {backLabel}</button>
              <div style={{ textAlign: 'center', marginTop: '60px' }}>
                <div style={{ fontSize: '60px', marginBottom: '20px' }}>{hasAnyCards ? '✨' : '🚧'}</div>
