      }, [figurasCatalog, selectedMaterial?.temaId]);

      /** Figuras com URL que não têm slot inline no texto (sem **Figura-ID:** no .md antes do Pré-Prova). */
      const figurasRodapeAula = useMemo(() => {
        if (!materialContent || !figurasDestaAulaComLink.length) return [];
        const preRe = /^## Pr[eé][- ]?Prova/im;
        const pre = preRe.exec(materialContent);
        const main = pre ? materialContent.slice(0, pre.index) : materialContent;
        const inlineIds = new Set();
        const idRe = /\*\*Figura-ID:\*\*\s*`?([A-Z0-9-]+)`?/gi;
        let mm;
        while ((mm = idRe.exec(main))) inlineIds.add(mm[1]);
        return figurasDestaAulaComLink.filter((f) => !inlineIds.has(f.id));
      }, [materialContent, figurasDestaAulaComLink]);

      // Split markdown at "## Pré-Prova" section
      const splitAtPreProva = (content) => {
        // regex: matches "## Pré-Prova" or "## Pre-Prova" (any case, hyphen optional) at start of line
        const re = /^## Pr[eé][- ]?Prova/im;
        const match = re.exec(content);
        if (match) {
          return { main: content.slice(0, match.index).trim(), preProva: content.slice(match.index).trim() };
        }
        return { main: content, preProva: null };
      };

      // Post-process markdown header: breadcrumb + meta pills
      useEffect(() => {
        if (!markdownRef.current || !materialContent) return;
        const root = markdownRef.current;

        // --- Breadcrumb: only direct <p> children at the top (not inside lists/quotes) ---
        const directTopPs = Array.from(root.children).filter(el => el.tagName === 'P').slice(0, 3);
        const bcP = directTopPs.find(p => p.textContent.includes('→'));
        if (bcP && !bcP.classList.contains('md-breadcrumb')) {
          const parts = bcP.textContent.split('→').map(s => s.trim()).filter(Boolean);
          bcP.className = 'md-breadcrumb';
          bcP.innerHTML = parts.map((part, i) =>
            `<span class="bc-item${i === parts.length - 1 ? ' current' : ''}">${part}</span>${i < parts.length - 1 ? '<span class="bc-sep">›</span>' : ''}`
          ).join('');
        }

        // --- Meta pills: only direct <p> children at the top ---
        const metaP = directTopPs.find(p => p.textContent.includes('⏱') || p.textContent.includes('min ·'));
        if (metaP && !metaP.classList.contains('md-meta')) {
          const parts = metaP.textContent.split('·').map(s => s.trim()).filter(Boolean);
          metaP.className = 'md-meta';
          metaP.innerHTML = parts.map(p =>
            `<span class="md-meta-pill">${p}</span>`
          ).join('');
        }
      }, [materialContent, selectedMaterial]);

      // Hidratar slots .material-fig-slot com imagens do catálogo (inline no texto)
      useEffect(() => {
        if (!markdownRef.current || !figurasCatalog?.entries) return;
        const root = markdownRef.current;
        const slots = root.querySelectorAll('.material-fig-slot[data-fig-id]');
        slots.forEach((slot) => {
          const id = slot.getAttribute('data-fig-id');
          if (!id) return;
          const fig = figurasCatalog.entries.find((e) => e.id === id);
          if (!fig) {
            slot.innerHTML = MATERIAL_FIG_PENDING_HTML;
            return;
          }
          if (String(fig.urlImagem || '').trim()) {
            slot.innerHTML = buildMaterialFigureHtml(fig);
            slot.classList.add('material-fig-slot--filled');
          } else {
            slot.innerHTML = MATERIAL_FIG_PENDING_HTML;
          }
        });
      }, [materialContent, figurasCatalog, selectedMaterial?.path, selectedMaterial?.temaId]);

      // Enable interactive checkboxes with localStorage persistence
      useEffect(() => {
        if (!markdownRef.current || !selectedMaterial) return;
        const key = `checklist_${selectedMaterial.path}`;
        const saved = JSON.parse(localStorage.getItem(key) || '{}');
        const boxes = markdownRef.current.querySelectorAll('input[type="checkbox"]');
        boxes.forEach((cb, i) => {
          cb.removeAttribute('disabled');
          cb.checked = !!saved[i];
          cb.style.cursor = 'pointer';
          cb.style.accentColor = '#00C896';
          cb.style.width = '15px';
          cb.style.height = '15px';
          cb.style.marginRight = '6px';
          cb.style.verticalAlign = 'middle';
          cb.addEventListener('change', () => {
            saved[i] = cb.checked;
            localStorage.setItem(key, JSON.stringify(saved));
          });
        });
      }, [materialContent, selectedMaterial]);

      // Highlight (Grifar) logic - Temporary session only
      useEffect(() => {
        if (!markdownRef.current || !materialContent) return;
        return setupHighlighter(markdownRef.current);
      }, [materialContent, selectedMaterial]);

      const toggleMateria = (id) => {
        setExpandedMaterias(prev => ({ ...prev, [id]: !prev[id] }));
      };

      const handleReportMaterial = () => {
        if (!selectedMaterial) return;
        const reason = prompt('Descreva o erro no material (opcional):', '');
        if (reason === null) return;

        submitContentFeedback({
          origem: 'materiais',
          mensagem: reason?.trim() || 'Erro reportado em material',
          itemId: `${selectedMaterial.materiaId || ''}:${selectedMaterial.temaId || ''}`,
          materia: selectedMaterial.materiaId || '',
          tema: selectedMaterial.temaId || '',
          contexto: {
            materiaNome: selectedMaterial.materiaNome,
            temaNome: selectedMaterial.temaNome,
            path: selectedMaterial.path
          }
        })
          .then(() => alert('Reporte enviado para o admin. Obrigado!'))
          .catch(() => alert('Nao foi possivel enviar agora. Tente novamente em instantes.'));
      };

      const resolveTemaId = (materia, tema) => {
        if (tema?.id) return tema.id;
        const aulas = Array.isArray(materia?.aulas) ? materia.aulas : [];
        if (!aulas.length) return null;

        const byNome = aulas.find(a => normalizeText(a.tema) === normalizeText(tema?.nome || ''));
        if (byNome?.id) return byNome.id;

        const byDesc = aulas.find(a => normalizeText(a.descricao) === normalizeText(tema?.descricao || ''));
        if (byDesc?.id) return byDesc.id;

        return null;
      };

      const openMaterial = async (materia, tema, options = {}) => {
        const { updateHash = true } = options;
        const modulo = materia.modulo || materia.semestre;
        const temaId = resolveTemaId(materia, tema);

        if (!temaId) {
          setSelectedMaterial({
            materiaNome: materia.nome,
            temaNome: tema.nome,
            path: 'sem-id',
            materiaId: materia.id,
            temaId: null,
          });
          setMaterialContent('');
          setMaterialError('Nao foi possivel identificar o ID da aula para abrir o material.');
          setMaterialLoading(false);
          return;
        }

        const primaryPath = `materiais/modulo${modulo}/${materia.id}/${temaId}.md`;
        const fallbackPaths = [
          primaryPath,
          `/materiais/modulo${modulo}/${materia.id}/${temaId}.md`,
          `materiais/modulo1/${materia.id}/${temaId}.md`,
          `materiais/modulo2/${materia.id}/${temaId}.md`,
          `materiais/modulo3/${materia.id}/${temaId}.md`,
          `materiais/modulo4/${materia.id}/${temaId}.md`,
          `materiais/modulo5/${materia.id}/${temaId}.md`,
          `materiais/modulo6/${materia.id}/${temaId}.md`,
          `materiais/modulo7/${materia.id}/${temaId}.md`,
          `materiais/modulo8/${materia.id}/${temaId}.md`,
          `materiais/modulo9/${materia.id}/${temaId}.md`,
          `materiais/modulo10/${materia.id}/${temaId}.md`,
          `materiais/modulo11/${materia.id}/${temaId}.md`,
          `materiais/modulo12/${materia.id}/${temaId}.md`,
        ];

        setSelectedMaterial({
          materiaNome: materia.nome,
          temaNome: tema.nome,
          path: primaryPath,
          materiaId: materia.id,
          temaId,
        });
        setMaterialContent('');
        setMaterialError('');
        setMaterialLoading(true);
        setPreProvaVisible(false);

        if (updateHash && onRouteChange) {
          onRouteChange('materials', { materiaId: materia.id, aulaId: temaId });
        }

        setMaterialAdminEditMode(false);
        setMaterialAdminDraft('');
        setMaterialAdminMsg('');
        setMaterialHasFirestoreOverride(false);

        try {
          let loaded = false;
          let baseText = '';
          let resolvedPath = primaryPath;
          for (const p of fallbackPaths) {
            const res = await fetch(p);
            if (!res.ok) continue;
            baseText = await res.text();
            resolvedPath = p;
            setSelectedMaterial(prev => ({ ...prev, path: p }));
            loaded = true;
            break;
          }

          if (!loaded) {
            throw new Error(`Material ainda nao disponivel para esta aula. Caminho tentado: ${primaryPath}`);
          }

          materialBaseMdRef.current = baseText;
          let shown = baseText;
          let hasOv = false;

          if (window.__fbAuth?.currentUser && window.__fbDb && window.__fbFirestore) {
            try {
              const { doc, getDoc } = window.__fbFirestore;
              const ovKey = `${materia.id}__${temaId}`;
              const snap = await getDoc(doc(window.__fbDb, 'material_overrides', ovKey));
              if (snap.exists()) {
                const d = snap.data();
                const md = d && d.markdown != null ? String(d.markdown) : '';
                if (md.trim().length) {
                  shown = md;
                  hasOv = true;
                }
              }
            } catch (e) {
              console.warn('[material_overrides] leitura ignorada:', e?.message || e);
            }
          }

          setMaterialContent(shown);
          setMaterialHasFirestoreOverride(hasOv);
        } catch (err) {
          setMaterialError(err?.message || 'Erro ao carregar material.');
          materialBaseMdRef.current = '';
        } finally {
          setMaterialLoading(false);
        }
      };

      const getMaterialOverrideDocKey = () => {
        if (!selectedMaterial?.materiaId || !selectedMaterial?.temaId) return null;
        return `${selectedMaterial.materiaId}__${selectedMaterial.temaId}`;
      };

      const materialAdminInsertBold = () => {
        const ta = materialAdminTextareaRef.current;
        const v = materialAdminDraft;
        const wrap = (start, end, inner) => `${v.slice(0, start)}**${inner}**${v.slice(end)}`;
        if (!ta) {
          setMaterialAdminDraft(wrap(0, v.length, (v && v.trim()) ? v : 'negrito'));
          return;
        }
        const start = ta.selectionStart ?? 0;
        const end = ta.selectionEnd ?? 0;
        const sel = v.slice(start, end) || 'negrito';
        setMaterialAdminDraft(wrap(start, end, sel));
        setTimeout(() => {
          try {
            ta.focus();
            const pos = start + 2 + sel.length + 2;
            ta.setSelectionRange(pos, pos);
          } catch (e) {}
        }, 0);
      };

      const materialAdminInsertLink = () => {
        const url = window.prompt('URL (https://… ou caminho /data/… /materiais/…):', 'https://');
        if (url == null || !String(url).trim()) return;
        const label = window.prompt('Texto do link:', 'link');
        if (label == null) return;
        const piece = `[${String(label).trim() || 'link'}](${String(url).trim()})`;
        const ta = materialAdminTextareaRef.current;
        const v = materialAdminDraft;
        if (!ta) {
          setMaterialAdminDraft((prev) => `${prev}${piece}`);
          return;
        }
        const start = ta.selectionStart ?? 0;
        const end = ta.selectionEnd ?? 0;
        setMaterialAdminDraft(`${v.slice(0, start)}${piece}${v.slice(end)}`);
        setTimeout(() => {
          try {
            ta.focus();
            const pos = start + piece.length;
            ta.setSelectionRange(pos, pos);
          } catch (e) {}
        }, 0);
      };

      const materialAdminSaveOverride = async () => {
        const key = getMaterialOverrideDocKey();
        if (!key || !isMaterialAdminSession()) return;
        const cu = window.__fbAuth?.currentUser;
        if (!cu?.email) {
          setMaterialAdminMsg('É necessário sessão Firebase (mesmo email verificado).');
          return;
        }
        const md = materialAdminDraft;
        if (!String(md).trim().length) {
          setMaterialAdminMsg('Markdown vazio.');
          return;
        }
        if (String(md).length > 900000) {
          setMaterialAdminMsg('Texto demasiado longo (limite ~900k caracteres).');
          return;
        }
        setMaterialAdminBusy(true);
        setMaterialAdminMsg('');
        try {
          const { doc, setDoc } = window.__fbFirestore;
          await setDoc(
            doc(window.__fbDb, 'material_overrides', key),
            {
              markdown: md,
              updatedAt: new Date().toISOString(),
              updatedBy: cu.email,
              materiaId: selectedMaterial.materiaId,
              temaId: selectedMaterial.temaId,
              basePath: selectedMaterial.path || '',
            },
            { merge: true }
          );
          setMaterialContent(md);
          setMaterialHasFirestoreOverride(true);
          setMaterialAdminEditMode(false);
          setMaterialAdminMsg('Guardado no Firestore (substitui o .md para utilizadores com login).');
        } catch (e) {
          setMaterialAdminMsg(e?.message || String(e) || 'Erro ao guardar (regras / rede / email verificado).');
        } finally {
          setMaterialAdminBusy(false);
        }
      };

      const materialAdminCancelEdit = () => {
        setMaterialAdminDraft(materialContent);
        setMaterialAdminEditMode(false);
        setMaterialAdminMsg('');
      };

      const materialAdminRevertToRepoFile = async () => {
        const key = getMaterialOverrideDocKey();
        if (!key || !isMaterialAdminSession()) return;
        if (!window.confirm('Apagar a sobreposição no Firestore e voltar ao texto do ficheiro .md do site?')) return;
        setMaterialAdminBusy(true);
        setMaterialAdminMsg('');
        try {
          const { doc, deleteDoc } = window.__fbFirestore;
          await deleteDoc(doc(window.__fbDb, 'material_overrides', key));
        } catch (e) {
          if ((e && e.code) !== 'not-found') {
            setMaterialAdminMsg(e?.message || String(e) || 'Erro ao apagar.');
            setMaterialAdminBusy(false);
            return;
          }
        }
        const base = materialBaseMdRef.current || '';
        setMaterialContent(base);
        setMaterialHasFirestoreOverride(false);
        setMaterialAdminEditMode(false);
        setMaterialAdminDraft('');
        setMaterialAdminMsg('Reposto: versão do repositório (ficheiro estático).');
        setMaterialAdminBusy(false);
      };

      const getMateriaModulos = (materia) => {
        const config = getModulos(materia.id);
        if (config) return config;
        if (materia.modulos) return materia.modulos;
        if (materia.aulas && materia.aulas.length > 0) {
          return [{ nome: materia.nome, temas: materia.aulas.map(a => ({ id: a.id, nome: a.tema, descricao: a.descricao })) }];
        }
        return null;
      };

      const totalTemas = (materia) => {
        const mods = getMateriaModulos(materia);
        if (!mods) return 0;
        return mods.reduce((acc, mod) => acc + (mod.temas?.length || 0), 0);
      };

      /** Próxima aula da mesma disciplina, na ordem dos módulos/temas do catálogo. */
      const nextSequentialMaterial = useMemo(() => {
        if (!selectedMaterial?.materiaId || !selectedMaterial?.temaId) return null;
        const materia = materias.find((m) => m.id === selectedMaterial.materiaId);
        if (!materia) return null;
        const modulos = getMateriaModulos(materia) || [];
        const flatTemas = [];
        for (const mod of modulos) {
          for (const tema of mod.temas || []) {
            if (tema && tema.id) flatTemas.push(tema);
          }
        }
        const i = flatTemas.findIndex((t) => t.id === selectedMaterial.temaId);
        if (i < 0 || i >= flatTemas.length - 1) return null;
        return { materia, tema: flatTemas[i + 1] };
      }, [selectedMaterial, materias]);

      const catalog = Array.isArray(materiasCatalog) ? materiasCatalog : [];

      const moduloInRange = (m, min, max) => {
        const mod = parseInt(m?.modulo ?? m?.semestre, 10);
        return Number.isFinite(mod) && mod >= min && mod <= max;
      };

      const catalogHasDisciplinasInRange = (min, max) =>
        catalog.some((m) => m.ativo !== false && moduloInRange(m, min, max));

      const userHasAccessToCycle = (min, max) => {
        for (let n = min; n <= max; n++) {
          if (hasModuleAccess(user || {}, n)) return true;
        }
        return false;
      };

      useEffect(() => {
        if (!initialMateriaId || !initialTemaId || !materias.length) return;
        const routeKey = `${initialMateriaId}:${initialTemaId}`;
        if (restoredRouteRef.current === routeKey) return;
        if (selectedMaterial?.materiaId === initialMateriaId && selectedMaterial?.temaId === initialTemaId) {
          restoredRouteRef.current = routeKey;
          return;
        }

        const materia = materias.find(m => m.id === initialMateriaId);
        if (!materia) return;

        const modulos = getMateriaModulos(materia) || [];
        let tema = null;
        modulos.some(mod => {
          tema = (mod.temas || []).find(item => (item?.id || null) === initialTemaId) || null;
          return !!tema;
        });
        if (!tema) return;

        restoredRouteRef.current = routeKey;
        openMaterial(materia, tema, { updateHash: false });
      }, [initialMateriaId, initialTemaId, materias, selectedMaterial]);

      const filteredMaterias = materias.filter((m) =>
        fuzzyMatch(searchQuery, m.nome) || fuzzyMatch(searchQuery, m.sigla || '')
      );

      const showToEstudosEntry =
        catalog.some((m) => m.id === TO_ESTUDOS_MATERIA_ID && m.ativo !== false) &&
        hasModuleAccess(user || {}, 6);

      const loadToInstrumentaisIfNeeded = () => {
        const cached = toInstrumentaisCacheRef.current;
        if (cached && Array.isArray(cached.items)) {
          setToInstItems(cached.items);
          if (cached.titulo) setToInstTitulo(cached.titulo);
          setToInstError('');
          setToInstLoading(false);
          return;
        }
        setToInstLoading(true);
        setToInstError('');
        fetch('/data/to_instrumentais.json')
          .then((r) => {
            if (!r.ok) throw new Error('fetch');
            return r.json();
          })
          .then((j) => {
            const items = Array.isArray(j.instrumentos) ? j.instrumentos : [];
            const titulo = j.titulo ? String(j.titulo) : '';
            toInstrumentaisCacheRef.current = { items, titulo };
            setToInstItems(items);
            if (titulo) setToInstTitulo(titulo);
          })
          .catch(() => {
            setToInstError('Não foi possível carregar o guia de instrumentais. Verifique a conexão e tente novamente.');
            setToInstItems(null);
          })
          .finally(() => setToInstLoading(false));
      };

      const retryLoadToInstrumentais = () => {
        toInstrumentaisCacheRef.current = null;
        loadToInstrumentaisIfNeeded();
      };

      const openToEstudos = (mode) => {
        setToGuideSearch('');
        setToQuizInlineWarn('');
        toInstrumentaisCacheRef.current = null;
        setToEstudosMode(mode);
        setToQuiz(null);
        loadToInstrumentaisIfNeeded();
      };

      const closeToEstudos = () => {
        setToEstudosMode(null);
        setToQuiz(null);
        setToGuideSearch('');
        setToQuizInlineWarn('');
      };

      useEffect(() => {
        if (toEstudosMode !== 'quiz' || !toInstItems?.length) return;
        setToQuiz((prev) => {
          if (prev && prev.phase === 'summary') return prev;
          if (prev && prev.order?.length) return prev;
          return {
            order: shuffleInstrumentIds(toInstItems.map((i) => i.id)),
            idx: 0,
            input: '',
            phase: 'play',
            submittedForIdx: null,
            log: [],
          };
        });
      }, [toEstudosMode, toInstItems]);

      const toGuideFiltered = useMemo(() => {
        if (!toInstItems?.length) return [];
        const q = String(toGuideSearch || '').trim();
        if (!q) return toInstItems;
        return toInstItems.filter(
          (it) =>
            fuzzyMatch(q, it.nome || '') ||
            fuzzyMatch(q, it.categoria || '') ||
            fuzzyMatch(q, it.funcao || '') ||
            fuzzyMatch(q, String(it.id || ''))
        );
      }, [toInstItems, toGuideSearch]);

      const getToInstrumentById = (id) => (toInstItems || []).find((i) => i.id === id);

      const submitToQuizAnswer = () => {
        if (!toQuiz || toQuiz.phase !== 'play') return;
        const curId = toQuiz.order[toQuiz.idx];
        const curInst = getToInstrumentById(curId);
        if (!curInst) return;
        if (toQuiz.submittedForIdx === toQuiz.idx) return;
        const diff = buildInstrumentAnswerDiff(toQuiz.input, curInst.nome);
        if (diff.isEmpty) {
          setToQuizInlineWarn('Digite o nome do instrumental para conferir.');
          return;
        }
        setToQuizInlineWarn('');
        const entry = {
          idx: toQuiz.idx,
          id: curInst.id,
          userRaw: toQuiz.input,
          isCorrect: diff.isCorrect,
          userSpans: diff.userSpans,
          gabarito: curInst.nome,
        };
        setToQuiz({
          ...toQuiz,
          submittedForIdx: toQuiz.idx,
          log: [...toQuiz.log, entry],
        });
      };

      const goToNextToQuizQ = () => {
        if (!toQuiz || toQuiz.phase !== 'play') return;
        if (toQuiz.idx >= toQuiz.order.length - 1) {
          setToQuiz({ ...toQuiz, phase: 'summary' });
          return;
        }
        setToQuiz({
          ...toQuiz,
          idx: toQuiz.idx + 1,
          input: '',
          submittedForIdx: null,
        });
        setToQuizInlineWarn('');
      };

      const restartToQuiz = () => {
        if (!toInstItems?.length) return;
        setToQuizInlineWarn('');
        setToQuiz({
          order: shuffleInstrumentIds(toInstItems.map((i) => i.id)),
          idx: 0,
          input: '',
          phase: 'play',
          submittedForIdx: null,
          log: [],
        });
      };

      const renderMateriaCard = (materia) => {
        const total = totalTemas(materia);
        const isExpanded = expandedMaterias[materia.id];
        const modulosList = getMateriaModulos(materia) || [];
        return (
          <div key={materia.id} className="material-subject">
            <div className="material-subject-name" style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
              <span style={{ display: 'flex', alignItems: 'center', gap: '8px' }}>
                <SubjectIcon materiaId={materia.id} icon={materia.icon} cor={materia.cor} />
                {materia.sigla || materia.nome}
              </span>
              {total > 0 && (
                <button
                  type="button"
                  onClick={() => toggleMateria(materia.id)}
                  style={{
                    background: 'rgba(255,255,255,0.06)',
                    border: '1px solid rgba(255,255,255,0.12)',
                    borderRadius: '8px',
                    color: 'var(--text-secondary)',
                    fontSize: '0.78rem',
                    padding: '4px 10px',
                    cursor: 'pointer',
                    display: 'flex',
                    alignItems: 'center',
                    gap: '5px'
                  }}
                >
                  {isExpanded ? '▲' : '▼'} {total} aulas
                </button>
              )}
            </div>

            {total > 0 && isExpanded && (
              <div style={{ marginTop: '10px', marginBottom: '4px' }}>
                {modulosList.map((mod, mi) => (
                  <div key={mi} style={{ marginBottom: '10px' }}>
                    <div style={{
                      fontSize: '0.72rem',
                      fontWeight: 700,
                      textTransform: 'uppercase',
                      letterSpacing: '0.06em',
                      color: 'var(--text-secondary)',
                      marginBottom: '6px',
                      paddingLeft: '2px'
                    }}>{mod.nome}</div>
                    {(mod.temas || []).map((tema, ti) => (
                      <div
                        key={ti}
                        role="button"
                        tabIndex={0}
                        onClick={() => openMaterial(materia, tema)}
                        onKeyDown={(e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openMaterial(materia, tema); } }}
                        title="Abrir material da aula"
                        style={{
                          display: 'flex',
                          alignItems: 'flex-start',
                          gap: '8px',
                          padding: '7px 10px',
                          borderRadius: '8px',
                          background: 'rgba(255,255,255,0.03)',
                          border: '1px solid rgba(255,255,255,0.06)',
                          marginBottom: '4px',
                          cursor: 'pointer'
                        }}
                      >
                        <span style={{ color: materia.cor || 'var(--primary)', fontSize: '0.85rem', marginTop: '1px' }}>•</span>
                        <div>
                          <div style={{ fontSize: '0.88rem', color: 'var(--text-primary)', fontWeight: 500 }}>{tema.nome}</div>
                          {tema.descricao && (
                            <div style={{ fontSize: '0.75rem', color: 'var(--text-secondary)', marginTop: '2px' }}>{tema.descricao}</div>
                          )}
                        </div>
                      </div>
                    ))}
                  </div>
                ))}
              </div>
            )}

            <div className="material-slots" style={{ marginTop: total > 0 ? '8px' : undefined }}>
              <div className="material-slot">
                <span className="material-slot-name">
                  <span style={{ color: 'var(--text-secondary)', display: 'flex' }}><IconFileText /></span>
                  Resumo Didático
                </span>
                <span className="material-badge">Em breve</span>
              </div>
              <div className="material-slot">
                <span className="material-slot-name">
                  <span style={{ color: 'var(--text-secondary)', display: 'flex' }}><IconPieChart /></span>
                  Análise de Provas
                </span>
                <span className="material-badge">Em breve</span>
              </div>
            </div>

            {materia.id === TO_ESTUDOS_MATERIA_ID && showToEstudosEntry && (
              <div
                style={{
                  marginTop: '12px',
                  paddingTop: '12px',
                  borderTop: '1px solid rgba(255,255,255,0.08)',
                  display: 'flex',
                  flexWrap: 'wrap',
                  gap: '8px',
                }}
              >
                <div style={{ width: '100%', display: 'flex', alignItems: 'center', flexWrap: 'wrap', gap: '8px', marginBottom: '2px' }}>
                  <span style={{ fontSize: '0.72rem', fontWeight: 800, textTransform: 'uppercase', letterSpacing: '0.06em', color: '#6ee7b7' }}>TO Estudos</span>
                  <span className="to-estudos-beta-pill">Beta</span>
                </div>
                <button
                  type="button"
                  onClick={() => openToEstudos('guide')}
                  style={{
                    flex: 1,
                    minWidth: '120px',
                    padding: '9px 12px',
                    borderRadius: '10px',
                    border: '1px solid rgba(0,200,150,0.35)',
                    background: 'rgba(0,200,150,0.12)',
                    color: '#6ee7b7',
                    fontSize: '0.8rem',
                    fontWeight: 700,
                    cursor: 'pointer',
                    fontFamily: 'DM Sans, sans-serif',
                  }}
                >Guia de instrumentais</button>
                <button
                  type="button"
                  onClick={() => openToEstudos('quiz')}
                  style={{
                    flex: 1,
                    minWidth: '120px',
                    padding: '9px 12px',
                    borderRadius: '10px',
                    border: '1px solid rgba(124,58,237,0.4)',
                    background: 'rgba(124,58,237,0.14)',
                    color: '#c4b5fd',
                    fontSize: '0.8rem',
                    fontWeight: 700,
                    cursor: 'pointer',
                    fontFamily: 'DM Sans, sans-serif',
                  }}
                >Quiz de instrumentais</button>
              </div>
            )}
          </div>
        );
      };

      const userHasDisciplinaInCatalogForAccess = (min, max) =>
        catalog.some(
          (m) =>
            m.ativo !== false &&
            moduloInRange(m, min, max) &&
            hasModuleAccess(user || {}, m.modulo ?? m.semestre)
        );

      const getMateriaModuloNum = (m) => {
        const n = parseInt(m?.modulo ?? m?.semestre, 10);
        return Number.isFinite(n) ? n : null;
      };

      const renderCycleSection = (cycle) => {
        const { min, max, label, sub, anchor, id: cycleId } = cycle;
        const hasAccess = userHasAccessToCycle(min, max);
        const hasCatalog = catalogHasDisciplinasInRange(min, max);
        const hasDisciplinaForUser = userHasDisciplinaInCatalogForAccess(min, max);
        const sectionMaterias = filteredMaterias.filter((m) => moduloInRange(m, min, max));
        const q = String(searchQuery || '').trim();

        const moduleNums = [...new Set(sectionMaterias.map(getMateriaModuloNum).filter((n) => n != null))].sort((a, b) => a - b);
        const rawFilter = moduleFilterByCycle[cycleId];
        const moduleFilter = rawFilter != null && moduleNums.includes(rawFilter) ? rawFilter : null;
        const modulesToShow = moduleFilter == null ? moduleNums : moduleNums.filter((n) => n === moduleFilter);

        const renderModuleChips = () => {
          if (moduleNums.length <= 1) return null;
          return (
            <div className="materials-mod-chips">
              <span className="materials-mod-chips-label">Módulo</span>
              <button
                type="button"
                className={`semester-tab${moduleFilter == null ? ' active' : ''}`}
                onClick={() => setModuleFilterByCycle((prev) => ({ ...prev, [cycleId]: null }))}
              >Todos</button>
              {moduleNums.map((n) => (
                <button
                  key={n}
                  type="button"
                  className={`semester-tab${moduleFilter === n ? ' active' : ''}`}
                  onClick={() => setModuleFilterByCycle((prev) => ({ ...prev, [cycleId]: n }))}
                >{n}</button>
              ))}
            </div>
          );
        };

        const renderGroupedList = () => (
          <>
            {renderModuleChips()}
            {modulesToShow.length === 0 ? (
              <div className="materials-cycle-empty">
                {moduleFilter != null
                  ? 'Nenhuma matéria neste módulo com os filtros atuais.'
                  : 'Nenhuma disciplina disponível aqui no momento.'}
              </div>
            ) : (
              modulesToShow.map((modNum) => {
                const group = sectionMaterias.filter((m) => getMateriaModuloNum(m) === modNum);
                return (
                  <div key={modNum} id={`${anchor}-mod-${modNum}`} className="materials-mod-subgroup" style={{ scrollMarginTop: '88px' }}>
                    <h4 className="materials-mod-title">Módulo {modNum}</h4>
                    <div className="materials-list">{group.map((m) => renderMateriaCard(m))}</div>
                  </div>
                );
              })
            )}
          </>
        );

        let body = null;
        if (!hasAccess) {
          body = (
            <div className="materials-cycle-empty">
              Este ciclo não está incluído no seu plano. Atualize o plano ou o convite para acessar estes módulos.
            </div>
          );
        } else if (!hasCatalog) {
          body = (
            <div className="materials-cycle-empty" style={{ display: 'flex', alignItems: 'center', gap: '12px', flexWrap: 'wrap' }}>
              <span className="material-badge" style={{ flexShrink: 0 }}>Em breve</span>
              <span>Conteúdo ainda por vir neste ciclo. Volte em breve para novos materiais.</span>
            </div>
          );
        } else if (!hasDisciplinaForUser) {
          body = (
            <div className="materials-cycle-empty" style={{ display: 'flex', alignItems: 'center', gap: '12px', flexWrap: 'wrap' }}>
              <span className="material-badge" style={{ flexShrink: 0 }}>Em breve</span>
              <span>Materiais para os módulos do seu plano neste ciclo ainda por vir.</span>
            </div>
          );
        } else if (sectionMaterias.length === 0 && q) {
          body = (
            <div className="materials-cycle-empty">
              Nenhuma matéria encontrada com esse termo neste ciclo.
            </div>
          );
        } else if (sectionMaterias.length === 0) {
          body = (
            <div className="materials-cycle-empty">
              Nenhuma disciplina disponível aqui no momento.
            </div>
          );
        } else {
          body = renderGroupedList();
        }

        return (
          <section key={cycle.id} id={anchor} className="materials-cycle-section">
            <h3 className="materials-cycle-header">{label}</h3>
            <p className="materials-cycle-sub">{sub}</p>
            {body}
          </section>
        );
      };

      // --- TO ESTUDOS (instrumentais) — tela dedicada dentro de Materiais ---
      if (toEstudosMode) {
        const headerTitulo = toInstTitulo || 'TO Estudos — Instrumentais';
        const curQuizId = toQuiz?.order?.[toQuiz.idx];
        const curQuizInst = curQuizId ? getToInstrumentById(curQuizId) : null;
        const curQuizAttempt = toQuiz?.log?.find((l) => l.idx === toQuiz?.idx);
        const quizCorrectCount = toQuiz?.log?.filter((l) => l.isCorrect).length ?? 0;
        const quizTotal = toQuiz?.order?.length ?? 0;
        const quizWrong = (toQuiz?.log || []).filter((l) => !l.isCorrect);

        return (
          <div className="screen-content screen-content--material-detail">
            <div style={{
              display: 'flex',
              alignItems: 'center',
              gap: '10px',
              marginBottom: '18px',
            }}>
              <button
                type="button"
                onClick={() => {
                  closeToEstudos();
                  if (onRouteChange) onRouteChange('materials', {});
                }}
                style={{
                  background: 'rgba(0,200,150,0.08)',
                  border: '1px solid rgba(0,200,150,0.25)',
                  borderRadius: '8px',
                  color: '#00C896',
                  fontSize: '0.82rem',
                  fontWeight: 500,
                  padding: '7px 13px',
                  cursor: 'pointer',
                  display: 'flex',
                  alignItems: 'center',
                  gap: '5px',
                  flexShrink: 0,
                  fontFamily: 'DM Sans, sans-serif',
                }}
              >← Voltar</button>
              <div style={{ minWidth: 0, flex: 1 }}>
                <div style={{
                  fontSize: '0.7rem',
                  color: '#64748B',
                  fontWeight: 500,
                  textTransform: 'uppercase',
                  letterSpacing: '0.07em',
                  marginBottom: '2px',
                  fontFamily: 'DM Sans, sans-serif',
                }}>Técnica Operatória</div>
                <div style={{
                  fontSize: '1rem',
                  fontWeight: 700,
                  color: '#F1F5F9',
                  fontFamily: 'Outfit, sans-serif',
                  lineHeight: 1.25,
                }}>{headerTitulo}</div>
              </div>
            </div>

            <div className="to-estudos-beta-banner" role="status">
              <span className="to-estudos-beta-pill">Beta</span>
              <span style={{ flex: 1, minWidth: 0 }}>
                Área em evolução: instrumentais, textos e regras do quiz podem ser atualizados. Se algo parecer estranho, use o feedback do app.
              </span>
            </div>

            <div className="to-estudos-seg" role="tablist">
              <button
                type="button"
                role="tab"
                className={toEstudosMode === 'guide' ? 'active' : ''}
                onClick={() => { setToEstudosMode('guide'); setToQuizInlineWarn(''); }}
                aria-selected={toEstudosMode === 'guide'}
              >Guia</button>
              <button
                type="button"
                role="tab"
                className={toEstudosMode === 'quiz' ? 'active' : ''}
                onClick={() => { setToEstudosMode('quiz'); setToQuizInlineWarn(''); }}
                aria-selected={toEstudosMode === 'quiz'}
              >Quiz</button>
            </div>

            {toInstLoading && (
              <div style={{
                display: 'flex',
                flexDirection: 'column',
                alignItems: 'center',
                gap: '12px',
                padding: '40px 0',
                color: '#64748B',
                fontSize: '0.85rem',
                fontFamily: 'DM Sans, sans-serif',
              }}>
                <div style={{
                  width: '32px',
                  height: '32px',
                  border: '3px solid rgba(0,200,150,0.15)',
                  borderTop: '3px solid #00C896',
                  borderRadius: '50%',
                  animation: 'spin 0.8s linear infinite',
                }} />
                Carregando instrumentais...
              </div>
            )}

            {!toInstLoading && toInstError && (
              <div style={{
                background: 'rgba(239,68,68,0.08)',
                border: '1px solid rgba(239,68,68,0.22)',
                borderRadius: '12px',
                padding: '14px 16px',
                color: '#FCA5A5',
                fontSize: '0.85rem',
                marginBottom: '16px',
              }}>
                <div style={{ marginBottom: '10px' }}>{toInstError}</div>
                <button
                  type="button"
                  className="btn btn-secondary"
                  onClick={retryLoadToInstrumentais}
                  style={{ fontSize: '0.82rem' }}
                >Tentar novamente</button>
              </div>
            )}

            {!toInstLoading && !toInstError && Array.isArray(toInstItems) && toInstItems.length === 0 && (
              <div className="materials-cycle-empty">Nenhum instrumental cadastrado no momento.</div>
            )}

            {!toInstLoading && !toInstError && toInstItems?.length > 0 && toEstudosMode === 'guide' && (
              <>
                <input
                  type="search"
                  className="subject-search to-estudos-guide-search"
                  placeholder="Buscar por nome, categoria ou função..."
                  value={toGuideSearch}
                  onChange={(e) => setToGuideSearch(e.target.value)}
                />
                {toGuideFiltered.length === 0 ? (
                  <div className="materials-cycle-empty">Nenhum resultado para essa busca.</div>
                ) : (
                  toGuideFiltered.map((inst) => (
                    <div key={inst.id} className="to-estudos-card">
                      <div className="to-estudos-card-img-wrap">
                        {(!inst.imagem || !String(inst.imagem).trim() || toImgBroken[inst.id]) ? (
                          <div className="to-estudos-ph">
                            {(inst.imagem && String(inst.imagem).trim() && toImgBroken[inst.id])
                              ? 'Não foi possível carregar a imagem.'
                              : 'Imagem não disponível — use o texto e as dicas para fixar o instrumental.'}
                            <br />
                            <span style={{ color: '#94a3b8', fontWeight: 600 }}>{inst.nome}</span>
                          </div>
                        ) : (
                          <ToEstudosInstrumentFigure
                            src={encodeLocalAssetPath(inst.imagem)}
                            alt={inst.nome}
                            onError={() => setToImgBroken((p) => ({ ...p, [inst.id]: true }))}
                          />
                        )}
                      </div>
                      {inst.categoria ? <span className="to-estudos-pill">{inst.categoria}</span> : null}
                      <div style={{ fontFamily: 'Outfit, sans-serif', fontWeight: 800, fontSize: '1.02rem', color: '#f1f5f9', marginBottom: '8px' }}>
                        {inst.nome}
                      </div>
                      <dl className="to-estudos-dl">
                        <dt>Função</dt>
                        <dd>{renderInlineBoldMarkdown(inst.funcao)}</dd>
                        <dt>Características e diferenciação</dt>
                        <dd>{renderInlineBoldMarkdown(inst.caracteristicas)}</dd>
                        <dt>Posição sugerida na mesa</dt>
                        <dd>{renderInlineBoldMarkdown(inst.mesaPosicao)}</dd>
                        <dt>Mnemônico</dt>
                        <dd>{renderInlineBoldMarkdown(inst.mnemonico)}</dd>
                      </dl>
                      {inst.confundeCom && inst.confundeCom.nome ? (
                        <div className="to-estudos-confunde">
                          <strong style={{ color: '#FDE68A' }}>Não confunda com:</strong>{' '}
                          {inst.confundeCom.nome}
                        </div>
                      ) : null}
                    </div>
                  ))
                )}
              </>
            )}

            {!toInstLoading && !toInstError && toInstItems?.length > 0 && toEstudosMode === 'quiz' && (
              <>
                {!toQuiz ? (
                  <div className="materials-cycle-empty">Preparando o quiz...</div>
                ) : toQuiz.phase === 'summary' ? (
                  <div className="to-estudos-card">
                    <div style={{ fontFamily: 'Outfit, sans-serif', fontWeight: 800, fontSize: '1.15rem', color: '#e5e7eb', marginBottom: '8px' }}>
                      Resultado do quiz
                    </div>
                    <div style={{ fontSize: '0.9rem', color: '#a7f3d0', marginBottom: '6px' }}>
                      Você acertou <strong>{quizCorrectCount}</strong> de <strong>{quizTotal}</strong>.
                    </div>
                    <div style={{ fontSize: '0.8rem', color: 'var(--text-secondary)', marginBottom: '16px', lineHeight: 1.55 }}>
                      A correção ignora maiúsculas/minúsculas e acentuação. Revise os erros abaixo e repita o quiz quando quiser.
                    </div>
                    <button
                      type="button"
                      className="btn btn-primary"
                      onClick={restartToQuiz}
                      style={{ marginBottom: quizWrong.length ? '18px' : 0 }}
                    >Novo quiz</button>

                    {quizWrong.length > 0 ? (
                      <div className="to-quiz-review-block">
                        <div style={{ fontSize: '0.78rem', fontWeight: 800, textTransform: 'uppercase', letterSpacing: '0.06em', color: '#fca5a5', marginBottom: '10px' }}>
                          Revisão dos erros
                        </div>
                        {quizWrong.map((att) => {
                          const inst = getToInstrumentById(att.id);
                          return (
                            <div key={`${att.idx}-${att.id}`} className="to-quiz-review-item">
                              <div style={{ fontWeight: 800, color: '#fecaca', marginBottom: '6px' }}>{inst?.nome || att.gabarito}</div>
                              <div style={{ marginBottom: '6px' }}>
                                <span style={{ color: '#94a3b8', fontSize: '0.72rem', fontWeight: 700, textTransform: 'uppercase' }}>Sua resposta (comparação)</span>
                                <div style={{ fontFamily: 'ui-monospace, monospace', marginTop: '4px' }}>
                                  {(att.userSpans || []).map((s, si) => (
                                    <span key={si} className={s.ok ? 'to-quiz-char-ok' : 'to-quiz-char-bad'}>{s.ch}</span>
                                  ))}
                                  {!att.userSpans?.length ? <span className="to-quiz-char-bad">(vazio)</span> : null}
                                </div>
                              </div>
                              <div className="to-quiz-gabarito" style={{ marginTop: '8px' }}>
                                <strong>Gabarito:</strong> {att.gabarito}
                              </div>
                            </div>
                          );
                        })}
                      </div>
                    ) : null}
                  </div>
                ) : curQuizInst ? (
                  <div className="to-estudos-card">
                    <div className="to-quiz-progress">
                      Questão {toQuiz.idx + 1} de {toQuiz.order.length}
                      {toQuiz.submittedForIdx === toQuiz.idx ? (
                        <span style={{ marginLeft: '8px', color: curQuizAttempt?.isCorrect ? '#4ade80' : '#f87171' }}>
                          {curQuizAttempt?.isCorrect ? ' — correto' : ' — incorreto ou incompleto'}
                        </span>
                      ) : null}
                    </div>

                    <div className="to-estudos-card-img-wrap">
                      {(!curQuizInst.imagem || !String(curQuizInst.imagem).trim() || toImgBroken[curQuizInst.id]) ? (
                        <div className="to-estudos-ph">
                          {(curQuizInst.imagem && String(curQuizInst.imagem).trim() && toImgBroken[curQuizInst.id])
                            ? 'Imagem indisponível.'
                            : 'Sem imagem.'}
                        </div>
                      ) : (
                        <ToEstudosInstrumentFigure
                          src={encodeLocalAssetPath(curQuizInst.imagem)}
                          alt="Instrumental em quiz"
                          onError={() => setToImgBroken((p) => ({ ...p, [curQuizInst.id]: true }))}
                        />
                      )}
                    </div>

                    <label htmlFor="to-quiz-nome-input" style={{ display: 'block', fontSize: '0.72rem', fontWeight: 800, color: '#94a3b8', textTransform: 'uppercase', letterSpacing: '0.05em', marginBottom: '6px' }}>
                      Nome do instrumental
                    </label>
                    <input
                      id="to-quiz-nome-input"
                      type="text"
                      autoComplete="off"
                      disabled={toQuiz.submittedForIdx === toQuiz.idx}
                      value={toQuiz.input}
                      onChange={(e) => {
                        setToQuiz({ ...toQuiz, input: e.target.value });
                        if (toQuizInlineWarn) setToQuizInlineWarn('');
                      }}
                      placeholder=""
                      className="subject-search"
                      style={{ marginBottom: '10px', width: '100%', boxSizing: 'border-box' }}
                      onKeyDown={(e) => {
                        if (e.key === 'Enter') {
                          e.preventDefault();
                          if (toQuiz.submittedForIdx === toQuiz.idx) goToNextToQuizQ();
                          else submitToQuizAnswer();
                        }
                      }}
                    />

                    {toQuizInlineWarn ? (
                      <div style={{ fontSize: '0.78rem', color: '#fca5a5', marginBottom: '10px' }}>{toQuizInlineWarn}</div>
                    ) : null}

                    {toQuiz.submittedForIdx === toQuiz.idx && curQuizAttempt ? (
                      <>
                        <div style={{ fontSize: '0.72rem', fontWeight: 700, color: '#94a3b8', textTransform: 'uppercase', letterSpacing: '0.05em', marginBottom: '6px' }}>
                          Sua resposta (caractere a caractere)
                        </div>
                        <div style={{ fontFamily: 'ui-monospace, monospace', fontSize: '1.05rem', lineHeight: 1.65, marginBottom: '10px' }}>
                          {curQuizAttempt.userSpans.map((s, si) => (
                            <span key={si} className={s.ok ? 'to-quiz-char-ok' : 'to-quiz-char-bad'}>{s.ch}</span>
                          ))}
                        </div>
                        <div className="to-quiz-gabarito">
                          <strong>Gabarito:</strong> {curQuizInst.nome}
                        </div>
                        <button type="button" className="btn btn-primary" style={{ marginTop: '14px', width: '100%' }} onClick={goToNextToQuizQ}>
                          {toQuiz.idx >= toQuiz.order.length - 1 ? 'Ver resultado' : 'Próxima'}
                        </button>
                      </>
                    ) : (
                      <button type="button" className="btn btn-primary" style={{ width: '100%' }} onClick={submitToQuizAnswer}>
                        Conferir resposta
                      </button>
                    )}
                  </div>
                ) : (
                  <div className="materials-cycle-empty">Preparando o quiz...</div>
                )}
              </>
            )}
          </div>
        );
      }

      // --- DETAIL VIEW: when a material is selected, replace entire screen ---
      if (selectedMaterial) {
        const preProvaMd = !materialLoading && materialContent ? splitAtPreProva(materialContent).preProva : null;
        return (
          <div className="screen-content screen-content--material-detail">

            {/* Header bar */}
            <div style={{
              display: 'flex',
              alignItems: 'center',
              flexWrap: 'wrap',
              gap: '10px',
              marginBottom: '20px',
            }}>
              <button
                onClick={() => {
                  setSelectedMaterial(null);
                  setMaterialContent('');
                  setMaterialError('');
                  setMaterialAdminEditMode(false);
                  setMaterialAdminDraft('');
                  setMaterialAdminMsg('');
                  setMaterialHasFirestoreOverride(false);
                  materialBaseMdRef.current = '';
                  if (onRouteChange) onRouteChange('materials', {});
                }}
                style={{
                  background: 'rgba(0,200,150,0.08)',
                  border: '1px solid rgba(0,200,150,0.25)',
                  borderRadius: '8px',
                  color: '#00C896',
                  fontSize: '0.82rem',
                  fontWeight: 500,
                  padding: '7px 13px',
                  cursor: 'pointer',
                  display: 'flex',
                  alignItems: 'center',
                  gap: '5px',
                  flexShrink: 0,
                  transition: 'background 0.2s',
                  fontFamily: 'DM Sans, sans-serif',
                }}
              >← Voltar</button>

              <div style={{ minWidth: 0, flex: 1 }}>
                <div style={{
                  fontSize: '0.7rem',
                  color: '#64748B',
                  fontWeight: 500,
                  textTransform: 'uppercase',
                  letterSpacing: '0.07em',
                  marginBottom: '2px',
                  fontFamily: 'DM Sans, sans-serif',
                }}>{selectedMaterial.materiaNome}</div>
                <div style={{
                  fontSize: '1rem',
                  fontWeight: 700,
                  color: '#F1F5F9',
                  fontFamily: 'Outfit, sans-serif',
                  lineHeight: 1.25,
                  whiteSpace: 'nowrap',
                  overflow: 'hidden',
                  textOverflow: 'ellipsis',
                }}>{selectedMaterial.temaNome}</div>
              </div>
              {nextSequentialMaterial && (
                <button
                  type="button"
                  disabled={materialLoading}
                  title={`Abrir a próxima aula: ${nextSequentialMaterial.tema.nome || ''}`}
                  onClick={() => {
                    openMaterial(nextSequentialMaterial.materia, nextSequentialMaterial.tema);
                    window.scrollTo(0, 0);
                  }}
                  style={{

    // Profile Screen
    const ProfileScreen = ({ user, onLogout, onChangeSemester, onProfileUpdated }) => {
      const [showPicker, setShowPicker] = useState(false);
      const [showInstitutionRequest, setShowInstitutionRequest] = useState(false);
      const [requestFacultyId, setRequestFacultyId] = useState(user.faculdadeId || DEFAULT_FACULTY_ID);
      const [requestCampusId, setRequestCampusId] = useState(user.campusId || DEFAULT_CAMPUS_ID);
      const [requestLoading, setRequestLoading] = useState(false);
      const [requestError, setRequestError] = useState('');
      const [requestInfo, setRequestInfo] = useState('');
      const [changeRequests, setChangeRequests] = useState([]);
      const [stats, setStats] = useState({
        cardsReviewed: 0,
        questionsAnswered: 0,
        streak: 0,
        studyHours: 0
      });

      useEffect(() => {
        const srData = JSON.parse(localStorage.getItem('meduni9_sr_data') || '{}');
        const quizHistory = JSON.parse(localStorage.getItem('meduni9_quiz_history') || '[]');

        setStats({
          cardsReviewed: Object.keys(srData).length,
          questionsAnswered: quizHistory.length,
          streak: 5,
          studyHours: Math.floor(quizHistory.length * 0.5)
        });
      }, []);

      const loadChangeRequests = async () => {
        const currentUser = window.__fbAuth?.currentUser;
        if (!currentUser || !window.__fbFirestore) return;
        try {
          const { collection, getDocs, query, where } = window.__fbFirestore;
          const snap = await getDocs(query(collection(window.__fbDb, 'profile_change_requests'), where('userId', '==', currentUser.uid)));
          const docs = snap.docs.map(docSnap => ({ id: docSnap.id, ...docSnap.data() }));
          docs.sort((a, b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0));
          setChangeRequests(docs);
        } catch {
          setChangeRequests([]);
        }
      };

      useEffect(() => {
        loadChangeRequests();
      }, []);

      const pendingRequest = changeRequests.find(item => item.status === 'pending');

      const submitInstitutionRequest = async () => {
        const currentUser = window.__fbAuth?.currentUser;
        const faculty = getFacultyById(requestFacultyId);
        const campus = getCampusById(requestFacultyId, requestCampusId);

        setRequestError('');
        setRequestInfo('');

        if (!currentUser) { setRequestError('Faça login novamente para enviar a solicitação.'); return; }
        if (!faculty?.active || !campus?.active) { setRequestError('Escolha uma faculdade e campus disponíveis.'); return; }
        if (pendingRequest) { setRequestError('Já existe uma solicitação pendente para sua conta.'); return; }
        if (user.faculdadeId === faculty.id && user.campusId === campus.id) { setRequestError('Você já está nesse campus.'); return; }

        setRequestLoading(true);
        try {
          const { collection, addDoc } = window.__fbFirestore;
          await addDoc(collection(window.__fbDb, 'profile_change_requests'), {
            userId: currentUser.uid,
            userEmail: currentUser.email || user.email || '',
            currentFacultyId: user.faculdadeId,
            currentFacultyName: user.faculdadeNome,
            currentCampusId: user.campusId,
            currentCampusName: user.campusNome,
            requestedFacultyId: faculty.id,
            requestedFacultyName: faculty.name,
            requestedCampusId: campus.id,
            requestedCampusName: campus.name,
            semestre: user.semestre || user.modulo || 1,
            status: 'pending',
            createdAt: new Date().toISOString(),
          });
          setRequestLoading(false);
          setShowInstitutionRequest(false);
          setRequestInfo('Solicitação enviada. A alteração só aparece após aprovação pela equipe de desenvolvimento.');
          await loadChangeRequests();
        } catch (err) {
          setRequestLoading(false);
          setRequestError('Não foi possível enviar a solicitação.');
        }
      };

      const username = user.email ? user.email.split('@')[0] : 'Usuário';
      const avatarLetter = username.charAt(0).toUpperCase();
      const allowedProfileModules = getAllowedModules(user);
      const isAmbassadorProfile = !!(user?.ambassadorId || user?.ambassadorVitalicio || user?.couponCode);
      const lastCheckDate = user?.lastQualificationCheck ? new Date(user.lastQualificationCheck) : null;
      const daysSinceLastCheck = lastCheckDate ? Math.floor((Date.now() - lastCheckDate.getTime()) / (1000 * 60 * 60 * 24)) : 0;
      const daysUntilCheck = Math.max(0, 30 - daysSinceLastCheck);

      return (
        <>
          <div className="screen-content">
            <div className="profile-avatar">{avatarLetter}</div>
            <div className="profile-name">{username}</div>
            <div className="profile-meta">{getUserInstitutionLabel(user)} · Módulo {user.modulo || 1}</div>

            <div className="profile-stats">
              <div className="profile-stat">
                <div className="profile-stat-icon" style={{ color: 'var(--primary)' }}><IconLayers /></div>
                <div className="profile-stat-value">{stats.cardsReviewed}</div>
                <div className="profile-stat-label">Cards</div>
              </div>
              <div className="profile-stat">
                <div className="profile-stat-icon" style={{ color: 'var(--success)' }}><IconClipboardList /></div>
                <div className="profile-stat-value">{stats.questionsAnswered}</div>
                <div className="profile-stat-label">Questões</div>
              </div>
              <div className="profile-stat">
                <div className="profile-stat-icon" style={{ color: 'var(--warning)' }}><IconFlame /></div>
                <div className="profile-stat-value">{stats.streak}</div>
                <div className="profile-stat-label">Sequência</div>
              </div>
              <div className="profile-stat">
                <div className="profile-stat-icon" style={{ color: 'var(--purple)' }}><IconClock /></div>
                <div className="profile-stat-value">{stats.studyHours}h</div>
                <div className="profile-stat-label">Estudo</div>
              </div>
            </div>

            <div style={{ width: '100%', maxWidth: '420px', margin: '0 auto 16px' }}>
              <div style={{ padding: '14px 16px', borderRadius: '14px', background: 'linear-gradient(145deg, rgba(0,200,150,0.14), rgba(0,180,216,0.08))', border: '1px solid rgba(0,180,216,0.28)' }}>
                <div style={{ fontSize: '13px', fontWeight: 700, marginBottom: '6px', color: 'var(--text-primary)' }}>Planos e acesso</div>
                <div style={{ fontSize: '12px', color: 'var(--text-secondary)', lineHeight: 1.55, marginBottom: '12px' }}>
                  Quando mudar o semestre ou quiser ampliar o conteúdo, compre outro módulo, outro ciclo ou a assinatura mensal. Use o mesmo email da sua conta no checkout.
                </div>

    // ===================== Main App =====================
    function setupHighlighter(root) {
      if (!root) return () => {};
      
      const handleMouseUp = (e) => {
        const selection = window.getSelection();
        if (!selection || selection.isCollapsed || selection.rangeCount === 0) return;

        const range = selection.getRangeAt(0);
        if (!root.contains(range.commonAncestorContainer)) return;

        // Evita grifar se clicar em elementos interativos ou se ja estiver grifado
        if (e.target.closest('button, a, input, .flow-box, .mg-highlight')) return;

        const group = 'hl-' + Date.now();
        let textNodes = [];
        
        const walker = document.createTreeWalker(
          range.commonAncestorContainer.nodeType === Node.TEXT_NODE ? range.commonAncestorContainer.parentNode : range.commonAncestorContainer,
          NodeFilter.SHOW_TEXT,
          null,
          false
        );

        let node = walker.nextNode();
        while (node) {
          if (range.intersectsNode(node) && node.textContent.trim().length > 0) {
            textNodes.push(node);
          }
          node = walker.nextNode();
        }

        if (textNodes.length === 0 && range.commonAncestorContainer.nodeType === Node.TEXT_NODE && range.commonAncestorContainer.textContent.trim().length > 0) {
          textNodes.push(range.commonAncestorContainer);
        }

        textNodes.forEach((tNode, index) => {
          const isFirst = (index === 0);
          const isLast = (index === textNodes.length - 1);

          const isStart = (tNode === range.startContainer);
          const isEnd = (tNode === range.endContainer);
          
          let start = isStart ? range.startOffset : 0;
          let end = isEnd ? range.endOffset : tNode.textContent.length;
          
          if (start === end) return;

          let targetNode = tNode;
          if (isEnd) targetNode.splitText(end);
          if (isStart || !isEnd) {
            const mid = targetNode.splitText(start);
            targetNode = mid;
          }

          const span = document.createElement('span');
          span.className = 'mg-highlight';
          if (isFirst) span.classList.add('mg-hl-start');
          if (isLast) span.classList.add('mg-hl-end');
          span.setAttribute('data-hl-group', group);
          
          targetNode.parentNode.replaceChild(span, targetNode);
          span.appendChild(targetNode);
        });
        
        selection.removeAllRanges();
      };

      const handleClick = (e) => {
        const target = e.target.closest('.mg-highlight');
        if (target) {
          const group = target.getAttribute('data-hl-group');
          const toRemove = group 
            ? root.querySelectorAll(`[data-hl-group="${group}"]`)
            : [target];
          
          toRemove.forEach(el => {
            const parent = el.parentNode;
            if (!parent) return;
            while (el.firstChild) {
              parent.insertBefore(el.firstChild, el);
            }
            parent.removeChild(el);
          });
        }
      };

      root.addEventListener('mouseup', handleMouseUp);
      root.addEventListener('click', handleClick);
      
      return () => {
        root.removeEventListener('mouseup', handleMouseUp);
        root.removeEventListener('click', handleClick);
      };
    }

    function normalizeText(str) {
      return (str || '').toLowerCase()
        .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
        .replace(/\s+/g, '').replace(/[^a-z0-9]/g, '');
    }
    function fuzzyMatch(query, target) {
      const q = normalizeText(query);
      const t = normalizeText(target);
      if (!q) return true;
      if (t.includes(q)) return true;
      let qi = 0;
      for (let ti = 0; ti < t.length && qi < q.length; ti++) {
        if (t[ti] === q[qi]) qi++;
      }
      return qi === q.length;
    }

    /* ── Revisão escrita (dados em data/anatomia_revisao.json) ── */
    function normalizeRevisaoBlocks(sub) {
      if (!sub) return [];
      if (sub.blocks && sub.blocks.length) return sub.blocks;
      if (sub.items && sub.items.length) return [{ type: 'cards', items: sub.items }];
      return [];
    }
    function revisaoBlockSearchText(block) {
      if (block.type === 'cards') {
        return (block.items || []).map(it => (it.q || '') + ' ' + (it.a || '')).join(' ');
      }
      if (block.type === 'sequence') {
        return (block.title || '') + ' ' + (block.steps || []).map(s => (s.label || '') + ' ' + (s.detail || '')).join(' ');
      }
      if (block.type === 'hub') {
        return (block.title || '') + ' ' + (block.center || '') + ' ' + (block.branches || []).map(b => (b.label || '') + ' ' + (b.hint || '')).join(' ');
      }
      return '';
    }
    function subsectionMatchesRevisaoQuery(sub, ql) {
      if (!ql) return true;
      if ((sub.title || '').toLowerCase().includes(ql)) return true;
      return normalizeRevisaoBlocks(sub).some(b => revisaoBlockSearchText(b).toLowerCase().includes(ql));
    }
    function countRevisaoSubItems(sub) {
      return normalizeRevisaoBlocks(sub).reduce((n, b) => {
        if (b.type === 'cards') return n + (b.items ? b.items.length : 0);
        if (b.type === 'sequence') return n + (b.steps ? b.steps.length : 0);
        if (b.type === 'hub') return n + 1 + (b.branches ? b.branches.length : 0);
        return n;
      }, 0);
    }
    function filterSubsectionsByRegion(subs, region) {
      if (!subs || !subs.length) return [];
      if (region === 'todas') return subs.slice();
      if (region === 'primeiros_passos') {
        return subs.filter((sub) => {
          const x = sub.regiao || '';
          return x === 'tecido_basico' || x === 'primeiros_passos';
        });
      }
      return subs.filter(sub => (sub.regiao || '') === region);
    }
    /** Primeira letra em maiúscula (inclui letras acentuadas em português). */
    function revisaoSentenceCase(s) {
      if (s == null || s === '') return s;
      const t = String(s);
      return t.replace(/^\p{L}/u, (ch) => ch.toUpperCase());
    }
    function applyRevisaoQueryToSub(sub, ql) {
      if (!ql) return sub;
      const titleMatches = (sub.title || '').toLowerCase().includes(ql);
      const blocks = normalizeRevisaoBlocks(sub).map(b => {
        if (b.type !== 'cards') return b;
        if (titleMatches) return b;
        const items = (b.items || []).filter(it =>
          (it.q || '').toLowerCase().includes(ql) || (it.a || '').toLowerCase().includes(ql)
        );
        return { ...b, items };
      }).filter(b => {
        if (b.type === 'cards') return (b.items || []).length > 0;
        return true;
      });
      return { ...sub, blocks };
    }

    const AtlasIconBone = () => (<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="M18.3 5.7a2.8 2.8 0 0 0-3.5-.4L12 7.5 9.2 5.3a2.8 2.8 0 0 0-3.5.4 2.8 2.8 0 0 0 .4 3.5L8.5 12l-2.4 2.8a2.8 2.8 0 0 0-.4 3.5 2.8 2.8 0 0 0 3.5.4L12 16.5l2.8 2.2a2.8 2.8 0 0 0 3.5-.4 2.8 2.8 0 0 0-.4-3.5L15.5 12l2.4-2.8a2.8 2.8 0 0 0 .4-3.5z"/></svg>);

    const AtlasIconMuscle = () => (<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="M6 18.5c2-1.5 3-5 3-6.5s1.5-4 3-5c1.5 1 3 3.5 3 5s1 5 3 6.5"/><path d="M6 18.5C4.5 17 3.5 14 4 11s2-6 4.5-7.5"/><path d="M18 18.5c1.5-1.5 2.5-4.5 2-7.5s-2-6-4.5-7.5"/></svg>);
    const AtlasIconHeart = () => (<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>);
    const AtlasIconLungs = () => (<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round"><line x1="12" y1="3" x2="12" y2="9"/><path d="M12 9Q7 9 5 13Q3 17 5 20Q7 22 9 20Q11 18 12 16"/><path d="M12 9Q17 9 19 13Q21 17 19 20Q17 22 15 20Q13 18 12 16"/></svg>);
