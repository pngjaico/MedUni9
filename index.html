    // ===================== Main App =====================
    function setupHighlighter(root) {
      if (!root) return () => {};
      
      const handleMouseUp = (e) => {
        const selection = window.getSelection();
        if (!selection || selection.isCollapsed || selection.rangeCount === 0) return;

        const range = selection.getRangeAt(0);
        if (!root.contains(range.commonAncestorContainer)) return;

        // Evita grifar se clicar em elementos interativos ou se ja estiver grifado
        if (e.target.closest('button, a, input, .flow-box, .mg-highlight')) return;

        const group = 'hl-' + Date.now();
        let textNodes = [];
        
        const walker = document.createTreeWalker(
          range.commonAncestorContainer.nodeType === Node.TEXT_NODE ? range.commonAncestorContainer.parentNode : range.commonAncestorContainer,
          NodeFilter.SHOW_TEXT,
          null,
          false
        );

        let node = walker.nextNode();
        while (node) {
          if (range.intersectsNode(node) && node.textContent.trim().length > 0) {
            textNodes.push(node);
          }
          node = walker.nextNode();
        }

        if (textNodes.length === 0 && range.commonAncestorContainer.nodeType === Node.TEXT_NODE && range.commonAncestorContainer.textContent.trim().length > 0) {
          textNodes.push(range.commonAncestorContainer);
        }

        textNodes.forEach((tNode, index) => {
          const isFirst = (index === 0);
          const isLast = (index === textNodes.length - 1);

          const isStart = (tNode === range.startContainer);
          const isEnd = (tNode === range.endContainer);
          
          let start = isStart ? range.startOffset : 0;
          let end = isEnd ? range.endOffset : tNode.textContent.length;
          
          if (start === end) return;

          let targetNode = tNode;
          if (isEnd) targetNode.splitText(end);
          if (isStart || !isEnd) {
            const mid = targetNode.splitText(start);
            targetNode = mid;
          }

          const span = document.createElement('span');
          span.className = 'mg-highlight';
          if (isFirst) span.classList.add('mg-hl-start');
          if (isLast) span.classList.add('mg-hl-end');
          span.setAttribute('data-hl-group', group);
          
          targetNode.parentNode.replaceChild(span, targetNode);
          span.appendChild(targetNode);
        });
        
        selection.removeAllRanges();
      };

      const handleClick = (e) => {
        const target = e.target.closest('.mg-highlight');
        if (target) {
          const group = target.getAttribute('data-hl-group');
          const toRemove = group 
            ? root.querySelectorAll(`[data-hl-group="${group}"]`)
            : [target];
          
          toRemove.forEach(el => {
            const parent = el.parentNode;
            if (!parent) return;
            while (el.firstChild) {
              parent.insertBefore(el.firstChild, el);
            }
            parent.removeChild(el);
          });
        }
      };

      root.addEventListener('mouseup', handleMouseUp);
      root.addEventListener('click', handleClick);
      
      return () => {
        root.removeEventListener('mouseup', handleMouseUp);
        root.removeEventListener('click', handleClick);
      };
    }

    function normalizeText(str) {
      return (str || '').toLowerCase()
        .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
        .replace(/\s+/g, '').replace(/[^a-z0-9]/g, '');
    }
    
    function renderMarkdown(text) {
      if (!text || typeof text !== 'object' && typeof text !== 'string') return '';
      let str = String(text);
      // Bold: **text**
      str = str.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
      // Italic: _text_
      str = str.replace(/_(.*?)_/g, '<em>$1</em>');
      return str;
    }
    function fuzzyMatch(query, target) {
      const q = normalizeText(query);
      const t = normalizeText(target);
      if (!q) return true;
      if (t.includes(q)) return true;
      let qi = 0;
      for (let ti = 0; ti < t.length && qi < q.length; ti++) {
        if (t[ti] === q[qi]) qi++;
      }
      return qi === q.length;
    }

    /* ── Revisão escrita (dados em data/anatomia_revisao.json) ── */
    function normalizeRevisaoBlocks(sub) {
      if (!sub) return [];
      if (sub.blocks && sub.blocks.length) return sub.blocks;
      if (sub.items && sub.items.length) return [{ type: 'cards', items: sub.items }];
      return [];
    }
    function revisaoBlockSearchText(block) {
      if (block.type === 'cards') {
        return (block.items || []).map(it => (it.q || '') + ' ' + (it.a || '')).join(' ');
      }
      if (block.type === 'sequence') {
        return (block.title || '') + ' ' + (block.steps || []).map(s => (s.label || '') + ' ' + (s.detail || '')).join(' ');
      }
      if (block.type === 'hub') {
        return (block.title || '') + ' ' + (block.center || '') + ' ' + (block.branches || []).map(b => (b.label || '') + ' ' + (b.hint || '')).join(' ');
      }
      return '';
    }
    function subsectionMatchesRevisaoQuery(sub, ql) {
      if (!ql) return true;
      if ((sub.title || '').toLowerCase().includes(ql)) return true;
      return normalizeRevisaoBlocks(sub).some(b => revisaoBlockSearchText(b).toLowerCase().includes(ql));
    }
    function countRevisaoSubItems(sub) {
      return normalizeRevisaoBlocks(sub).reduce((n, b) => {
        if (b.type === 'cards') return n + (b.items ? b.items.length : 0);
        if (b.type === 'sequence') return n + (b.steps ? b.steps.length : 0);
        if (b.type === 'hub') return n + 1 + (b.branches ? b.branches.length : 0);
        return n;
      }, 0);
    }
    function filterSubsectionsByRegion(subs, region) {
      if (!subs || !subs.length) return [];
      if (region === 'todas') return subs.slice();
      if (region === 'primeiros_passos') {
        return subs.filter((sub) => {
          const x = sub.regiao || '';
          return x === 'tecido_basico' || x === 'primeiros_passos';
        });
      }
      return subs.filter(sub => (sub.regiao || '') === region);
    }
    /** Primeira letra em maiúscula (inclui letras acentuadas em português). */
    function revisaoSentenceCase(s) {
      if (s == null || s === '') return s;
      const t = String(s);
      return t.replace(/^\p{L}/u, (ch) => ch.toUpperCase());
    }
    function applyRevisaoQueryToSub(sub, ql) {
      if (!ql) return sub;
      const titleMatches = (sub.title || '').toLowerCase().includes(ql);
      const blocks = normalizeRevisaoBlocks(sub).map(b => {

          (it.q || '').toLowerCase().includes(ql) || (it.a || '').toLowerCase().includes(ql)
        );
        return { ...b, items };
      }).filter(b => {
        if (b.type === 'cards') return (b.items || []).length > 0;
        return true;
      });
      return { ...sub, blocks };
    }

        const isMostlyUpper = /[A-ZÁÀÂÃÉÈÊÍÌÎÓÒÔÕÚÙÛÇ]/.test(text) && text === text.toUpperCase();
        if (!isMostlyUpper) return text;
        let pretty = text.toLowerCase();
        pretty = pretty.charAt(0).toUpperCase() + pretty.slice(1);
        keep.forEach((token) => {
          const re = new RegExp(`\\b${token.toLowerCase().replace('.', '\\.')}\\b`, 'g');
          pretty = pretty.replace(re, token);
        });
        return pretty;

        if (!Array.isArray(lines) || lines.length === 0) return [];

          let current = String(lines[i] || '').trim();
          if (!current) continue;

          // OCR Cleanup
          current = current.replace(/OUE/g, 'QUE').replace(/CILiN/g, 'CILIN');

          if (buffer) {
            const lastChar = buffer.slice(-1);
            
            // Heurística de união
            const endsWithPunctuation = /[.!?:;)]$/.test(buffer);
            // Se a linha anterior não terminou em pontuação, ou termina em hífen, junta
            const isContinuation = !endsWithPunctuation || lastChar === '-';

            if (lastChar === '-') {
              buffer = buffer.slice(0, -1) + current;
            } else if (isContinuation) {
              buffer += " " + current;
            } else {
              healed.push(buffer);
              buffer = current;
            }
          } else {
            buffer = current;
          }

      const visibleLicense = lamina.licenca && !isInternalLicenseText(lamina.licenca) ? lamina.licenca : '';

        if (Array.isArray(value)) return value.map(item => String(item || '').trim()).filter(Boolean);
        const text = String(value || '').trim();
        return text ? [text] : [];
      };
      const hasFichaPremium = ['tituloCurado', 'oQueVer', 'comoReconhecer', 'pegadinhas', 'perguntaAtiva', 'respostaAtiva']
        .some(key => {
          const value = lamina[key];
          return Array.isArray(value) ? value.length > 0 : String(value || '').trim().length > 0;
        });
      const statusCuradoria = lamina.statusCuradoria || (hasFichaPremium ? 'amarelo' : 'vermelho');
      const statusCuradoriaMap = {
        vermelho: { label: 'OCR bruto', color: '#F87171' },
        amarelo: { label: 'Legenda limpa', color: '#FBBF24' },
        verde: { label: 'Ficha revisada', color: '#34D399' },
        azul: { label: 'Modo ativo', color: '#60A5FA' },
      };
      const statusInfo = statusCuradoriaMap[statusCuradoria] || { label: statusCuradoria, color: accentColor };

      const legendaBox = (opts) => {
        const compact = opts && opts.compact;
        const curatedLines = Array.isArray(lamina.legendaCurada) ? lamina.legendaCurada : [];
        const rawLines = curatedLines.length ? curatedLines : (Array.isArray(lamina.legendaTranscrita) ? lamina.legendaTranscrita : []);
        const lines = healLegends(rawLines);
        
        if (lines.length === 0) return null;
        
        return (
          <div style={{
            marginTop: compact ? '0' : '14px', 
            padding: compact ? '12px' : '14px 16px', 
            borderRadius: '14px',
            border: '1px solid rgba(255,255,255,0.14)',
            background: 'linear-gradient(180deg, rgba(18,28,46,0.92) 0%, rgba(12,22,38,0.96) 100%)',
            boxShadow: '0 8px 28px rgba(0,0,0,0.24)',
            height: compact ? '100%' : 'auto',
            overflowY: compact ? 'auto' : 'visible'
          }}>
            <div style={{
              fontFamily: 'Outfit', fontSize: compact ? '14px' : '16px', fontWeight: 700, color: '#EAF2FF',
              marginBottom: '10px', letterSpacing: '0.01em', display: 'flex', alignItems: 'center', gap: '8px'
            }}>
               <span style={{ opacity: 0.6 }}>📋</span> Legenda
            </div>
            <div style={{ display: 'grid', gap: '10px' }}>
              {lines.map((item, i) => (
                <div key={(opts && opts.prefix ? opts.prefix : 'p') + '-' + lamina.id + '-leg_h-' + i} style={{
                  display: 'flex', alignItems: 'flex-start', gap: '10px',
                  fontSize: compact ? '13px' : '14px', color: '#DCE8FF', lineHeight: 1.55, fontWeight: 500,
                }}>
                  <span style={{ color: accentColor, marginTop: '4px', fontSize: '10px', flexShrink: 0 }}>●</span>
                  <span>{formatLegendLine(item)}</span>
                </div>
              ))}
            </div>
            {lamina.notaTranscricao && (
              <div style={{ marginTop: '12px', paddingTop: '10px', borderTop: '1px solid rgba(255,255,255,0.08)', fontSize: '11px', color: 'rgba(255,255,255,0.4)', fontStyle: 'italic' }}>
                {lamina.notaTranscricao}
              </div>
            )}
          </div>
        );
      };

      const fichaPremiumBox = () => {
        if (!hasFichaPremium) return null;
        const oQueVer = asList(lamina.oQueVer);
        const comoReconhecer = asList(lamina.comoReconhecer);
        const pegadinhas = asList(lamina.pegadinhas);
        const confundeCom = asList(lamina.confundeCom);
        const pergunta = String(lamina.perguntaAtiva || '').trim();
        const resposta = String(lamina.respostaAtiva || '').trim();
        const showAnswer = atlasStudyMode === 'reveal';

        const section = (title, items) => {
          if (!items.length) return null;
          return (
            <div style={{ display: 'grid', gap: '7px' }}>
              <div style={{ fontSize: '11px', fontWeight: 800, color: 'rgba(255,255,255,0.62)', textTransform: 'uppercase', letterSpacing: '0.06em' }}>{title}</div>
              {items.map((item, i) => (
                <div key={title + '-' + i} style={{ display: 'flex', gap: '9px', alignItems: 'flex-start', fontSize: '13px', color: '#DCE8FF', lineHeight: 1.55 }}>
                  <span style={{ width: '6px', height: '6px', borderRadius: '50%', background: accentColor, marginTop: '8px', flexShrink: 0 }} />
                  <span>{item}</span>
                </div>
              ))}
            </div>
          );
        };

        if (atlasStudyMode === 'practice') {
          return (
            <div style={{
              marginTop: '14px', padding: '16px', borderRadius: '14px',
              border: '1px solid rgba(96,165,250,0.26)', background: 'rgba(15,23,42,0.78)',
              boxShadow: '0 8px 28px rgba(0,0,0,0.22)',
            }}>
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: '10px', marginBottom: '10px' }}>
                <div style={{ fontFamily: 'Outfit', fontSize: '15px', fontWeight: 800, color: '#EAF2FF' }}>Prova prática</div>
                <span style={{ fontSize: '11px', fontWeight: 800, color: statusInfo.color }}>{statusInfo.label}</span>
              </div>
              <div style={{ fontSize: '13px', color: 'rgba(255,255,255,0.62)', marginBottom: '8px' }}>Identifique a estrutura antes de revelar.</div>
              <div style={{ fontSize: '15px', color: '#F8FAFC', fontWeight: 750, lineHeight: 1.5 }}>
                {pergunta || 'Qual estrutura principal aparece nesta lâmina?'}
              </div>
              <button
                type="button"
                onClick={() => setAtlasStudyMode('reveal')}
                style={{
                  marginTop: '14px', width: '100%', padding: '11px 14px', borderRadius: '12px',
                  border: '1px solid rgba(96,165,250,0.34)', background: 'rgba(96,165,250,0.16)',
                  color: '#DBEAFE', fontWeight: 800, fontSize: '13px', fontFamily: 'inherit', cursor: 'pointer',
                }}
              >
                Revelar resposta
              </button>
            </div>
          );
        }

        return (
          <div style={{
            marginTop: '14px', padding: '16px', borderRadius: '14px',
            border: '1px solid rgba(255,255,255,0.12)', background: 'rgba(15,23,42,0.82)',
            boxShadow: '0 8px 28px rgba(0,0,0,0.22)',
          }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', gap: '10px', marginBottom: '14px' }}>
              <div>
                <div style={{ fontFamily: 'Outfit', fontSize: '16px', fontWeight: 850, color: '#F8FAFC', lineHeight: 1.3 }}>
                  {lamina.tituloCurado || lamina.titulo}
                </div>
                {(lamina.orgao || lamina.tecido || lamina.corante) && (
                  <div style={{ marginTop: '5px', fontSize: '12px', color: 'rgba(255,255,255,0.58)', lineHeight: 1.45 }}>
                    {[lamina.orgao, lamina.tecido, lamina.corante].filter(Boolean).join(' · ')}
                  </div>
                )}
              </div>
              <span style={{
                flexShrink: 0, padding: '5px 8px', borderRadius: '999px',
                border: '1px solid rgba(255,255,255,0.12)', background: 'rgba(255,255,255,0.04)',
                color: statusInfo.color, fontSize: '10px', fontWeight: 850, textTransform: 'uppercase', letterSpacing: '0.06em',
              }}>
                {statusCuradoria}
              </span>
            </div>
            <div style={{ display: 'grid', gap: '16px' }}>
              {section('O que ver', oQueVer)}
              {section('Como reconhecer', comoReconhecer)}
              {section('Pegadinhas', pegadinhas)}
              {section('Confunde com', confundeCom)}
              {lamina.correlacaoClinica && section('Correlação clínica', [lamina.correlacaoClinica])}
              {pergunta && (
                <div style={{
                  padding: '12px', borderRadius: '12px', border: '1px solid rgba(96,165,250,0.2)',
                  background: 'rgba(96,165,250,0.08)',
                }}>
                  <div style={{ fontSize: '11px', fontWeight: 850, color: '#93C5FD', textTransform: 'uppercase', letterSpacing: '0.06em', marginBottom: '6px' }}>Pergunta ativa</div>
                  <div style={{ fontSize: '13px', color: '#EAF2FF', lineHeight: 1.5, fontWeight: 700 }}>{pergunta}</div>
                  {showAnswer && resposta && (
                    <div style={{ marginTop: '10px', paddingTop: '10px', borderTop: '1px solid rgba(255,255,255,0.1)', color: '#D1FAE5', fontSize: '13px', lineHeight: 1.55 }}>
                      {resposta}
                    </div>
                  )}
                </div>
              )}
            </div>
          </div>
        );
      };

      React.useEffect(() => {
        setImgError(false); setImgLoaded(false); setOpenPin(null); setLightboxOpen(false); setAtlasStudyMode('study');
      }, [lamina.id]);

      React.useEffect(() => {
        if (!lightboxOpen) return;
        const onKey = (e) => { if (e.key === 'Escape') setLightboxOpen(false); };
        document.addEventListener('keydown', onKey);
        return () => document.removeEventListener('keydown', onKey);
      }, [lightboxOpen]);

      React.useEffect(() => {
        const el = wrapRef.current;
        if (!el) return;
        const onDoc = (e) => { if (!el.contains(e.target)) setOpenPin(null); };
        document.addEventListener('touchstart', onDoc, { passive: true });
        document.addEventListener('click', onDoc);
        return () => { document.removeEventListener('touchstart', onDoc); document.removeEventListener('click', onDoc); };
      }, []);

      const backBtn = {
        display: 'inline-flex', alignItems: 'center', gap: '6px', marginBottom: '16px',
        padding: '8px 14px', borderRadius: '10px', border: '1px solid rgba(255,255,255,0.1)',
        background: 'rgba(255,255,255,0.04)', color: 'var(--text-secondary)', fontSize: '13px', fontWeight: 600,
        cursor: 'pointer', fontFamily: 'inherit', transition: 'background 0.15s ease',
      };

      return (
        <div style={{ animation: reduceMotion ? 'none' : 'aboutFadeUp 0.3s ease both' }}>
          <button type="button" onClick={onBack} style={backBtn} onMouseEnter={e => e.currentTarget.style.background='rgba(255,255,255,0.08)'} onMouseLeave={e => e.currentTarget.style.background='rgba(255,255,255,0.04)'}>
            <AtlasIconBack /> Voltar
          </button>
          <div style={{ marginBottom: '12px' }}>
            <div style={{ fontSize: '11px', fontWeight: 700, color: accentColor, textTransform: 'uppercase', letterSpacing: '0.08em', marginBottom: '4px' }}>{sistemaTitulo}</div>
            <h3 className="atlas-plate-title">{lamina.titulo}</h3>
            <div style={{ fontSize: '12px', color: 'var(--text-secondary)', marginTop: '4px' }}>{divisaoTitulo}</div>
          </div>

          {hasFichaPremium && (
            <div className="atlas-study-mode-bar">
              {[
                ['study', 'Estudar'],
                ['practice', 'Prova prática'],
                ['reveal', 'Revelar'],
              ].map(([mode, label]) => (
                <button
                  key={mode}
                  type="button"
                  className={'atlas-study-mode-tab' + (atlasStudyMode === mode ? ' is-active' : '')}
                  aria-pressed={atlasStudyMode === mode}
                  onClick={() => setAtlasStudyMode(mode)}
                >
                  {label}
                </button>
              ))}
            </div>
          )}

          <div className="atlas-plate-layout">
            <div className="atlas-plate-media">
              {hasImage && !imgError ? (
                <div ref={wrapRef} className="atlas-plate-image-frame" style={{
                  minHeight: imgLoaded ? undefined : '220px',
                }}>
                  {!imgLoaded && (
                    <div style={{ position: 'absolute', inset: 0, display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 1 }}>
                      <div style={{ width: '28px', height: '28px', border: '3px solid rgba(255,255,255,0.1)', borderTopColor: accentColor, borderRadius: '50%', animation: 'spin 0.8s linear infinite' }} />
                    </div>
                  )}
                  <button
                    type="button"
                    onClick={() => { if (podeAmpliar) setLightboxOpen(true); }}
                    disabled={!podeAmpliar}
                    aria-label={podeAmpliar ? 'Ampliar fotografia da lâmina com legenda' : undefined}
                    style={{
                      display: 'block', width: '100%', padding: 0, margin: 0, border: 'none', background: 'transparent',
                      cursor: podeAmpliar ? 'zoom-in' : 'default',
                    }}
                  >
                    <img
                      className="atlas-plate-img"
                      src={lamina.urlImagem}
                      alt={lamina.alt || lamina.titulo}
                      loading="lazy"
                      decoding="async"
                      onLoad={() => setImgLoaded(true)}
                      onError={() => setImgError(true)}
                      style={{ 
                        opacity: imgLoaded ? 1 : 0, 
                        transition: reduceMotion ? 'none' : 'opacity 0.25s ease', 
                        pointerEvents: 'none'
                      }}
                    />
                  </button>
                  {imgLoaded && podeAmpliar && (
                    <div style={{ position: 'absolute', bottom: '10px', right: '10px', zIndex: 3, pointerEvents: 'none' }}>
                      <span style={{
                        fontSize: '11px', fontWeight: 700, padding: '6px 10px', borderRadius: '10px',
                        background: 'rgba(10,10,15,0.88)', color: '#E8EEFF', border: '1px solid rgba(255,255,255,0.12)',
                        boxShadow: '0 4px 14px rgba(0,0,0,0.35)',
                      }}>Toque para ampliar</span>
                    </div>
                  )}
                  {imgLoaded && pinos.map((p, i) => (
                    <button key={i} type="button" className="atlas-pin-hitbox" aria-label={p.rotulo} aria-pressed={showTip(i)}
                      onClick={(e) => { e.stopPropagation(); setOpenPin(prev => prev === i ? null : i); }}
                      onMouseEnter={() => setHoverPin(i)} onMouseLeave={() => setHoverPin(null)}
                      style={{
                        position: 'absolute', left: p.x + '%', top: p.y + '%', transform: 'translate(-50%, -50%)',
                        width: '32px', height: '32px', padding: 0, margin: 0, border: 'none', background: 'transparent',
                        cursor: 'pointer', zIndex: showTip(i) ? 4 : 2,
                      }}
                    />
                  ))}
                  {imgLoaded && pinos.map((p, i) => showTip(i) && (
                    <div key={'tip-' + i} role="status" style={{
                      position: 'absolute', left: p.x + '%', top: p.y + '%',
                      transform: p.y < 20 ? 'translate(-50%, 12px)' : 'translate(-50%, calc(-100% - 12px))',
                      maxWidth: 'min(200px, 65vw)', padding: '7px 12px', borderRadius: '8px',
                      background: 'rgba(10,10,15,0.94)', backdropFilter: 'blur(8px)',
                      border: '1px solid rgba(255,255,255,0.12)', color: '#F5F3FF',
                      fontSize: '12px', fontWeight: 700, lineHeight: 1.3, pointerEvents: 'none', zIndex: 5,
                      boxShadow: '0 6px 20px rgba(0,0,0,0.5)',
                    }}>
                      {p.rotulo}
                    </div>
                  ))}
                </div>
              ) : (
                <div style={{
                  borderRadius: '16px', overflow: 'hidden', border: '1px dashed rgba(255,255,255,0.12)',
                  background: 'linear-gradient(135deg, rgba(255,255,255,0.02) 0%, rgba(139,92,246,0.04) 100%)',
                  padding: '40px 24px', textAlign: 'center',
                }}>
                  <div style={{ display: 'flex', justifyContent: 'center', marginBottom: '14px', color: 'rgba(255,255,255,0.2)' }}>
                    <AtlasIconImage />
                  </div>
                  <div style={{ fontFamily: 'Outfit', fontWeight: 700, fontSize: '14px', color: 'var(--text-secondary)', marginBottom: '8px' }}>
                    {imgError ? 'Imagem indisponível' : 'Imagem pendente'}
                  </div>
                  <p style={{ fontSize: '12px', color: 'rgba(255,255,255,0.35)', lineHeight: 1.6, margin: 0, maxWidth: '320px', marginLeft: 'auto', marginRight: 'auto' }}>
                    {lamina.descricaoNecessaria || lamina.alt || 'Esta lâmina ainda precisa de uma imagem. Volte em breve.'}
                  </p>
                </div>
              )}
            </div>

            <div className="atlas-plate-legend">
              {atlasStudyMode === 'practice' ? fichaPremiumBox() : (
                <>
                  {legendaBox()}
                  {fichaPremiumBox()}
                </>
              )}
            </div>
          </div>

          {lightboxOpen && podeAmpliar && (
            <div
              role="dialog"
              aria-modal="true"
              aria-labelledby={'atlas-lb-title-' + lamina.id}
              style={{
                position: 'fixed', inset: 0, zIndex: 10050, display: 'flex', flexDirection: 'column',
                alignItems: 'center', justifyContent: 'flex-start', padding: '16px 14px 24px',
                background: 'rgba(5,8,14,0.92)', backdropFilter: 'blur(10px)', overflowY: 'auto',
              }}
              onClick={(e) => { if (e.target === e.currentTarget) setLightboxOpen(false); }}
            >
              <div style={{ width: '100%', maxWidth: '900px', flexShrink: 0, display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '12px' }}>
                <div id={'atlas-lb-title-' + lamina.id} style={{ fontFamily: 'Outfit', fontWeight: 800, fontSize: '16px', color: '#F8FAFC', paddingRight: '12px', lineHeight: 1.35 }}>
                  {lamina.titulo}
                </div>
                <button
                  type="button"
                  onClick={() => setLightboxOpen(false)}
                  style={{
                    flexShrink: 0, padding: '10px 16px', borderRadius: '12px', border: '1px solid rgba(255,255,255,0.18)',
                    background: 'rgba(255,255,255,0.08)', color: '#F8FAFC', fontWeight: 700, fontSize: '13px', cursor: 'pointer', fontFamily: 'inherit',
                  }}
                >Fechar</button>
              </div>
              <div
                style={{
                  width: '100%', maxWidth: '900px', borderRadius: '14px', overflow: 'hidden',
                  border: '1px solid rgba(255,255,255,0.12)', background: '#0D1117', boxShadow: '0 12px 48px rgba(0,0,0,0.45)',
                }}
                onClick={(e) => e.stopPropagation()}
              >
                <img
                  src={urlAmpliada}
                  alt={(lamina.alt || lamina.titulo) + ' — vista completa'}
                  style={{ width: '100%', height: 'auto', display: 'block', verticalAlign: 'top' }}
                />
              </div>
              <div style={{ width: '100%', maxWidth: '900px' }} onClick={(e) => e.stopPropagation()}>
                {legendaBox({ compact: true, prefix: 'lb' })}
              </div>
            </div>
          )}

          {ATLAS_SHOW_SOURCE_ATTRIBUTION && (
            <div style={{
              marginTop: '14px', padding: '12px 14px', borderRadius: '12px',
              background: 'rgba(255,255,255,0.03)', border: '1px solid rgba(255,255,255,0.06)',
              fontSize: '11px', color: 'var(--text-secondary)', lineHeight: 1.6,
            }}>
              <div>
                <div style={{ fontWeight: 700, color: 'var(--text-primary)', marginBottom: '4px', fontSize: '12px' }}>Fonte</div>
                <div>{sourceName}</div>
                {visibleLicense && <div style={{ marginTop: '2px', opacity: 0.8 }}>{visibleLicense}</div>}
                {sourceUrl && (
                  <a href={sourceUrl} target="_blank" rel="noopener noreferrer" style={{ color: '#A78BFA', fontWeight: 600, display: 'inline-block', marginTop: '4px' }}>
                    {sourceLabel}
                  </a>
                )}
              </div>
            </div>
          )}
        </div>
      );
    };

    const ANATOMIA_INTRO_STORAGE_KEY = 'medgrad_anatomia_intro_dismissed';

    const AnatomiaScreen = ({ user }) => {
      const [viewMode, setViewMode] = React.useState('atlas');
      const [openSystem, setOpenSystem] = React.useState(null);
      const [openSub, setOpenSub] = React.useState({});
      const [search, setSearch] = React.useState('');
      const [atlasData, setAtlasData] = React.useState(null);
      const [atlasErr, setAtlasErr] = React.useState(null);
      const [atlasNav, setAtlasNav] = React.useState({ step: 'systems', sistemaId: null, divisaoId: null, laminaAtual: null });
      const [revisaoData, setRevisaoData] = React.useState(null);
      const [revisaoErr, setRevisaoErr] = React.useState(null);
      const [atlasDemoNotice, setAtlasDemoNotice] = React.useState(null);
      const [anatomiaIntroOpen, setAnatomiaIntroOpen] = React.useState(() => {
        try { return localStorage.getItem(ANATOMIA_INTRO_STORAGE_KEY) !== '1'; } catch (e) { return true; }
      });

      const atlasGuestLock = user?.isGuest === true;

      React.useEffect(() => {
        fetch('data/anatomia_atlas.json?_=' + Date.now())
          .then(r => { if (!r.ok) throw new Error('Falha ao carregar atlas'); return r.json(); })
          .then(setAtlasData)
          .catch(e => setAtlasErr(e.message || String(e)));
      }, []);

      React.useEffect(() => {
        fetch('data/anatomia_revisao.json?_=' + Date.now())
          .then(r => { if (!r.ok) throw new Error('Falha ao carregar revisão'); return r.json(); })
          .then(setRevisaoData)
          .catch(e => setRevisaoErr(e.message || String(e)));
      }, []);

      const q = search.toLowerCase().trim();
      const sistemasBase = revisaoData && Array.isArray(revisaoData.sistemas) ? revisaoData.sistemas : [];

      const filtered = React.useMemo(() => {
        if (!sistemasBase.length) return [];
        return sistemasBase.map(sys => {
          const regionFiltered = sys.subsections || [];
          if (!q) {
            return { ...sys, subsections: regionFiltered };
          }
          const nameMatch = (sys.name || '').toLowerCase().includes(q);
          const matchingSubs = regionFiltered.filter(sub => subsectionMatchesRevisaoQuery(sub, q));
          let finalSubs;
          if (matchingSubs.length) {
            finalSubs = matchingSubs.map(sub => applyRevisaoQueryToSub(sub, q));
          } else if (nameMatch) {
            finalSubs = regionFiltered.map(sub => applyRevisaoQueryToSub(sub, q));
          } else {
            return null;
          }
          return { ...sys, subsections: finalSubs };
        }).filter(sys => sys && (sys.subsections || []).length > 0);
      }, [sistemasBase, q]);

      const toggleSystem = (id) => { setOpenSystem(prev => prev === id ? null : id); setOpenSub({}); };
      const toggleSub = (key) => setOpenSub(prev => ({ ...prev, [key]: !prev[key] }));

      React.useEffect(() => {
        if (q && filtered.length === 1) setOpenSystem(filtered[0].id);
      }, [q, filtered]);

      const atlasSistema = atlasData && atlasNav.sistemaId ? atlasData.sistemas.find(s => s.id === atlasNav.sistemaId) : null;
      const atlasDivisao = atlasSistema && atlasNav.divisaoId ? atlasSistema.divisoes.find(d => d.id === atlasNav.divisaoId) : null;

      const atlasGoBack = () => {
        if (atlasNav.step === 'plate') setAtlasNav({ step: 'laminas', sistemaId: atlasNav.sistemaId, divisaoId: atlasNav.divisaoId, laminaAtual: null });
        else if (atlasNav.step === 'laminas') setAtlasNav({ step: 'divisions', sistemaId: atlasNav.sistemaId, divisaoId: null, laminaAtual: null });
        else if (atlasNav.step === 'divisions') setAtlasNav({ step: 'systems', sistemaId: null, divisaoId: null, laminaAtual: null });
      };

      const segBtnStyle = (active) => ({
        flex: 1, padding: '10px 0', borderRadius: '10px', border: 'none',
        fontSize: '13px', fontWeight: 700, fontFamily: 'Outfit, sans-serif', cursor: 'pointer',
        transition: 'all 0.2s ease',
        background: active ? 'linear-gradient(135deg, rgba(139,92,246,0.3), rgba(99,102,241,0.2))' : 'transparent',
        color: active ? '#EDE9FE' : 'var(--text-secondary)',
        boxShadow: active ? '0 2px 12px rgba(139,92,246,0.15)' : 'none',
      });

      const backBtn = {
        display: 'inline-flex', alignItems: 'center', gap: '6px', marginBottom: '16px',
        padding: '8px 14px', borderRadius: '10px', border: '1px solid rgba(255,255,255,0.1)',

      const q = search.toLowerCase().trim();

      const atlasResults = React.useMemo(() => {
        if (!atlasData || !q || viewMode !== 'atlas') return [];
        const results = [];
        atlasData.categorias.forEach(cat => {
          cat.sistemas.forEach(sys => {
            sys.orgaos.forEach(org => {
              org.laminas.forEach(lam => {
                const combined = ((lam.titulo || '') + ' ' + (org.titulo || '') + ' ' + (sys.titulo || '') + ' ' + (cat.titulo || '')).toLowerCase();
                if (combined.includes(q)) {
                  results.push({ ...lam, category: cat, system: sys, organ: org });

              });
            });
          });
        });
        return results;
      }, [atlasData, q, viewMode]);

      const sistemasBase = revisaoData && Array.isArray(revisaoData.sistemas) ? revisaoData.sistemas : [];

        if (!sistemasBase.length) return [];
        return sistemasBase.map(sys => {
          const regionFiltered = sys.subsections || [];
          if (!q) return { ...sys, subsections: regionFiltered };
          const nameMatch = (sys.name || '').toLowerCase().includes(q);
          const matchingSubs = regionFiltered.filter(sub => subsectionMatchesRevisaoQuery(sub, q));
          let finalSubs;
          if (matchingSubs.length) finalSubs = matchingSubs.map(sub => applyRevisaoQueryToSub(sub, q));
          else if (nameMatch) finalSubs = regionFiltered.map(sub => applyRevisaoQueryToSub(sub, q));
          else return null;
          return { ...sys, subsections: finalSubs };
