      min-height: 4px;
    }
    .markdown-body .material-fig-inline {
      margin: 0;
    }

    /* Light mode: doc gets a paper feel */
    html[data-theme="light"] .markdown-body {
      background: rgba(255,255,255,0.92) !important;
      border-color: rgba(0,200,150,0.15) !important;
      border-top-color: #00C896 !important;
      color: #1E293B !important;
      box-shadow: 0 4px 32px rgba(0,0,0,0.08), 0 1px 4px rgba(0,0,0,0.05) !important;
    }
    html[data-theme="light"] .markdown-body h1 {
      background: linear-gradient(135deg, #0F172A 0%, #0284C7 55%, #00C896 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      border-bottom-color: rgba(0,200,150,0.2) !important;
    }
    html[data-theme="light"] .markdown-body h2 { color: #1E293B !important; }
    html[data-theme="light"] .markdown-body h3 { color: #0284C7 !important; }
    html[data-theme="light"] .markdown-body h4 { color: #0369A1 !important; }
    html[data-theme="light"] .markdown-body p { color: #334155; }
    html[data-theme="light"] .markdown-body strong { color: #0F172A !important; }
    html[data-theme="light"] .markdown-body em { color: #475569 !important; }
    html[data-theme="light"] .markdown-body ul li::marker { color: var(--mint) !important; }
    html[data-theme="light"] .markdown-body ol li::marker { color: var(--mint) !important; }
    html[data-theme="light"] .markdown-body blockquote {
      border-left-color: var(--mint) !important;
      background: rgba(0,200,150,0.06) !important;
      color: #475569 !important;
    }
    html[data-theme="light"] .markdown-body code {
      background: rgba(0,200,150,0.08) !important;
      color: #0369A1 !important;
    }
    html[data-theme="light"] .markdown-body pre {
      background: #F8FAFC !important;
      border-color: rgba(0,0,0,0.08) !important;
    }
    html[data-theme="light"] .flow-box {
      background: linear-gradient(140deg, rgba(0,200,150,0.05) 0%, rgba(56,189,248,0.05) 100%) !important;
      border-color: rgba(0,200,150,0.35) !important;
    }
    html[data-theme="light"] .flow-step { color: #1E293B !important; }
    html[data-theme="light"] .flow-vc { color: #059669 !important; }
    html[data-theme="light"] .flow-ha { color: #059669 !important; }
    html[data-theme="light"] .flow-vc-note { color: #64748B !important; }
    html[data-theme="light"] .flow-label { color: #64748B !important; }
    html[data-theme="light"] .flow-branch-note { color: #64748B !important; }
    html[data-theme="light"] .flow-raw { color: #1E293B !important; }
    html[data-theme="light"] .markdown-body hr { border-top-color: rgba(0,0,0,0.1) !important; }
    html[data-theme="light"] .markdown-body td { color: #334155 !important; }
    html[data-theme="light"] .markdown-body .table-wrap {
      background: rgba(240,249,255,0.8) !important;
      border-color: rgba(0,200,150,0.2) !important;
    }
    html[data-theme="light"] .markdown-body thead tr {
      background: rgba(0,200,150,0.1) !important;
    }
    html[data-theme="light"] .markdown-body tbody tr:nth-child(even) {
      background: rgba(0,0,0,0.02) !important;
    }
    html[data-theme="light"] .md-breadcrumb .bc-item { color: #64748B !important; }
    html[data-theme="light"] .md-breadcrumb .bc-sep { color: #94A3B8 !important; }
    html[data-theme="light"] .md-meta-pill { color: #0369A1 !important; }

    /* ── Markdown Reader ───────────────────────────────────────── */
    .markdown-body {
      font-family: 'Lexend', 'DM Sans', sans-serif;
      font-size: 1.0625rem;
      line-height: 1.75;
      color: #D1D9E6;
      user-select: text;
      -webkit-user-select: text;
    }

    /* Headings */
    .markdown-body h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 1.55rem;
      font-weight: 800;
      text-align: center;
      background: linear-gradient(135deg, #F1F5F9 0%, #38BDF8 55%, #00C896 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin: 6px 0 4px;
      padding-bottom: 14px;
      border-bottom: 2px solid rgba(0,200,150,0.25);
      line-height: 1.3;
      letter-spacing: -0.02em;
    }

    /* Breadcrumb linha gerada via JS */
    .md-breadcrumb {
      text-align: center;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.72rem;
      color: #475569;
      margin: 0 0 2px;
      letter-spacing: 0.02em;
    }
    .md-breadcrumb .bc-item { color: #475569; font-weight: 500; }
    .md-breadcrumb .bc-item.current { color: #00C896; font-weight: 600; }
    .md-breadcrumb .bc-sep { color: #334155; margin: 0 5px; }

    /* Metadata pills geradas via JS */
    .md-meta {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 6px;
      margin: 8px 0 20px;
    }
    .md-meta-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: rgba(0,200,150,0.1);
      border: 1px solid rgba(0,200,150,0.2);
      border-radius: 20px;
      padding: 4px 12px;
      font-size: 0.84rem;
      color: #7DD3FC;
      font-family: 'DM Sans', sans-serif;
      font-weight: 500;
    }
    .markdown-body h2 {
      font-family: 'Outfit', sans-serif;
      font-size: 1.35rem;
      font-weight: 700;
      color: #E2E8F0;
      margin: 1.7rem 0 0.65rem;
      padding-left: 12px;
      border-left: 3px solid var(--mint, #00C896);
      line-height: 1.32;
    }
    .markdown-body h3 {
      font-family: 'Outfit', sans-serif;
      font-size: 1.14rem;
      font-weight: 600;
      color: #38BDF8;
      margin: 1.2rem 0 0.5rem;
      line-height: 1.38;
    }
    .markdown-body h4 {
      font-size: 1.02rem;
      font-weight: 600;
      color: #7DD3FC;
      margin: 1rem 0 0.35rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    /* Paragraphs & text */
    .markdown-body p { margin: 0 0 0.85em; }
    .markdown-body strong {
      font-weight: 600;
      color: #F1F5F9;
    }
    .markdown-body em { color: #94A3B8; font-style: italic; }

    /* Lists */
    .markdown-body ul, .markdown-body ol {
      padding-left: 1.3em;
      margin: 0.5em 0 0.9em;
    }
    .markdown-body li { margin: 0.35em 0; }
    .markdown-body ul li::marker { color: var(--mint, #00C896); }
    .markdown-body ol li::marker { color: var(--mint, #00C896); font-weight: 600; }
    .markdown-body li > ul, .markdown-body li > ol { margin: 0.2em 0 0.3em; }

    /* Blockquote — destaque / nota importante */
    .markdown-body blockquote {
      border-left: 3px solid #00C896;
      margin: 1em 0;
      padding: 10px 14px;
      background: rgba(0, 200, 150, 0.07);
      border-radius: 0 8px 8px 0;
      color: #94A3B8;
      font-style: italic;
    }
    .markdown-body blockquote p { margin: 0; }

    /* Inline code */
    .markdown-body code {
      background: rgba(0, 200, 150, 0.12);
      border: 1px solid rgba(0, 200, 150, 0.2);
      border-radius: 4px;
      padding: 1px 6px;
      font-size: 0.82em;
      font-family: 'Courier New', monospace;
      color: #67E8F9;
    }

    /* Code block */
    .markdown-body pre {
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px;
      padding: 14px 16px;
      overflow-x: auto;
      margin: 1em 0;
    }
    .markdown-body pre code {
      background: none;
      border: none;
      padding: 0;
      font-size: 0.83rem;
      color: #A5F3FC;
    }

    /* ── Flow Diagram Visual Components ─────────────────────── */
    .flow-box {
      position: relative;
      background: linear-gradient(140deg, rgba(0,200,150,0.07) 0%, rgba(56,189,248,0.07) 100%);
      border: 1px solid rgba(0,200,150,0.3);
      border-radius: 14px;
      padding: 38px 18px 20px;
      margin: 1.4em 0;
      overflow-x: auto;
    }
    .flow-box::before {
      content: "FLUXO";
      position: absolute;
      top: 10px; left: 14px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.58rem; font-weight: 700;
      letter-spacing: 0.14em;
      color: #00C896;
      background: rgba(0,200,150,0.12);
      border: 1px solid rgba(0,200,150,0.3);
      border-radius: 20px;
      padding: 2px 9px;
    }
    /* Shared step box */
    .flow-step {
      display: inline-flex; align-items: center; justify-content: center;
      padding: 7px 15px;
      border: 1.5px solid; border-radius: 9px;
      font-family: 'DM Sans', sans-serif; font-size: 0.82rem; font-weight: 600;
      text-align: center; line-height: 1.35; flex-shrink: 0;
    }
    .flow-step-dim { opacity: 0.72; border-style: dashed !important; }
    /* Vertical flow */
    .flow-v {
      display: flex; flex-direction: column;
      align-items: center; gap: 3px; padding: 4px 0;
    }
    .flow-v .flow-step { min-width: 200px; max-width: 90%; white-space: normal; }
    .flow-vc {
      color: #00C896; font-size: 1.35rem; line-height: 1.5;
      text-align: center; user-select: none;
    }
    .flow-vc-note {
      font-family: 'DM Sans', sans-serif; font-size: 0.74rem;
      color: #475569; text-align: center; line-height: 1.8;
    }
    .flow-vc-note span { color: #7DD3FC; }
    /* Horizontal flow */
    .flow-h {
      display: flex; flex-wrap: wrap;
      align-items: center; justify-content: center;
      gap: 5px; padding: 4px 0;
    }
    .flow-ha {
      color: #00C896; font-size: 1.05rem; font-weight: 700;
      flex-shrink: 0; padding: 0 1px; user-select: none;
    }
    /* Gene structure */
    .flow-gene .flow-step { font-size: 0.76rem; padding: 5px 11px; }
    .flow-gene .flow-ha { color: #475569; font-weight: 400; font-size: 0.85rem; }
    .flow-label {
      font-family: 'DM Sans', sans-serif; font-size: 0.8rem;
      color: #94A3B8; padding: 0 3px;
    }
    /* Branch annotation */
    .flow-branch {
      margin-top: 12px; padding-top: 10px;
      border-top: 1px dashed rgba(148,163,184,0.2);
      display: flex; flex-direction: column; align-items: center; gap: 5px;
    }
    .flow-branch-arr { color: #00C896; font-size: 1.2rem; line-height: 1.4; }
    .flow-branch-note {
      font-family: 'DM Sans', sans-serif; font-size: 0.77rem;
      color: #94A3B8; text-align: center;
    }
    .flow-branch-note .fba { color: #00C896; font-weight: 700; }
    .flow-step-branch { font-size: 0.79rem; }
    /* Raw fallback */
    .flow-raw {
      font-family: 'Lexend', 'DM Sans', sans-serif; font-size: 0.84rem;
      color: #E2E8F0; text-align: center; line-height: 1.9; white-space: pre-wrap;
    }

    /* Horizontal rule */
    .markdown-body hr {
      border: none;
      border-top: 1px solid rgba(255,255,255,0.1);
      margin: 1.5em 0;
    }

    /* Tables */
    .markdown-body .table-wrap {
      overflow-x: auto;
      border-radius: 10px;
      border: 1px solid rgba(0, 200, 150, 0.25);
      margin: 1.2em 0;
      background: rgba(255,255,255,0.04);
      box-shadow: 0 2px 12px rgba(0,0,0,0.2), inset 0 1px 0 rgba(0,200,150,0.08);
    }
    .markdown-body table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.98rem;
      min-width: 360px;
    }
    .markdown-body thead tr {
      background: rgba(0, 200, 150, 0.18);
      border-bottom: 2px solid rgba(0, 200, 150, 0.35);
    }
    .markdown-body th {
      padding: 10px 14px;
      font-weight: 600;
      color: #E2E8F0;
      text-align: left;
      white-space: nowrap;
      font-size: 0.92rem;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }
    .markdown-body td {
      padding: 9px 14px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      color: #CBD5E1;
      line-height: 1.5;
    }
    .markdown-body tbody tr:nth-child(even) { background: rgba(255,255,255,0.03); }
    .markdown-body tbody tr:last-child td { border-bottom: none; }
    .markdown-body tbody tr:hover { background: rgba(0, 200, 150, 0.07); transition: background 0.15s; }

    /* Checklist interativo */
    .markdown-body input[type="checkbox"] {
      accent-color: #00C896;
      cursor: pointer;
      width: 15px;
      height: 15px;
      vertical-align: middle;
      margin-right: 6px;
      flex-shrink: 0;
    }
    .markdown-body li:has(input[type="checkbox"]) {
      list-style: none;
      margin-left: -1.3em;
      display: flex;
      align-items: flex-start;
      gap: 2px;
      padding: 3px 0;
      border-radius: 6px;
      transition: background 0.15s;
    }
    .markdown-body li:has(input[type="checkbox"]:checked) {
      color: #475569;
      text-decoration: line-through;
      text-decoration-color: #334155;
    }

    /* Pré-Prova amber headings override */
    .markdown-body.preprova-content h2 {
      color: #FCD34D;
      border-left-color: #F59E0B;
    }
    .markdown-body.preprova-content h3 { color: #FBBF24; }
    .markdown-body.preprova-content ul li::marker { color: #F59E0B; }
    .markdown-body.preprova-content blockquote {
      border-left-color: #F59E0B;
      background: rgba(245,158,11,0.07);
    }

    /* Profile Screen */
    .profile-avatar {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary), var(--purple));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: 700;
      font-family: 'Outfit', sans-serif;
      color: #fff;
      margin: 0 auto 8px;
      box-shadow: 0 4px 16px rgba(0, 200, 150, 0.3);
    }

    .profile-name {
      font-size: 18px;
      font-weight: 700;
      color: var(--text-primary);
      text-align: center;
      margin-bottom: 4px;
      font-family: 'Outfit', sans-serif;
    }

    .profile-meta {
      font-size: 13px;
      color: var(--text-secondary);
      text-align: center;
      margin-bottom: 24px;
    }

    .profile-section {
      background: var(--surface-2);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: var(--shadow-sm);
    }

    .profile-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 11px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .profile-item:last-child {
      border-bottom: none;
    }

    .profile-label {
      font-size: 12px;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 600;
    }

    .profile-value {
      font-size: 14px;
      color: var(--text-primary);
      font-weight: 600;
      word-break: break-all;
      text-align: right;
    }

    .profile-value-small {
      font-size: 11px;
      font-family: 'Courier New', monospace;
      color: var(--text-secondary);
    }

    .profile-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 16px;
    }

    .profile-stat {
      background: var(--surface-2);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      padding: 14px 12px;
      text-align: center;
      box-shadow: var(--shadow-sm);
    }

    .profile-stat-icon {
      font-size: 18px;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .profile-stat-value {
      font-size: 22px;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 4px;
      font-family: 'Outfit', sans-serif;
    }

    .profile-stat-label {
      font-size: 10px;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 600;
    }

    /* Bottom Navigation */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      max-width: 430px;
      margin: 0 auto;
      background: rgba(24, 28, 39, 0.96);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid var(--border-subtle);
      box-shadow: 0 -4px 24px rgba(0, 0, 0, 0.3);
      display: flex;
      justify-content: space-around;
      gap: 2px;
      padding: 8px 4px 18px;
      z-index: 100;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      cursor: pointer;
      flex: 1;
      padding: 6px 6px;
      border-radius: 12px;
      transition: background var(--duration-fast) ease, color var(--duration-fast) ease;
      position: relative;
      min-width: 0;
    }

    .nav-item.active {
      color: var(--primary);
      background: rgba(0, 200, 150, 0.12);
    }

    .nav-item.active::after {
      content: '';
      position: absolute;
      top: -8px;
      left: 50%;
      transform: translateX(-50%);
      width: 20px;
      height: 2px;
      background: var(--primary);
      border-radius: 0 0 2px 2px;
    }

    .nav-item:not(.active) {
      color: var(--text-secondary);
    }

    .nav-item:not(.active):active {
      background: var(--surface-2);
    }

    .nav-icon {
      width: 22px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .nav-label {
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.01em;
      line-height: 1.1;
      text-align: center;
    }

    /* Loading */
    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--border-card);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Semester Selector */
    .semester-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 24px;
    }

    .semester-btn {
      padding: 14px 8px;
      border: 2px solid var(--border-card);
      border-radius: 12px;
      background: var(--bg-card);
      color: var(--text-secondary);
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
      min-height: auto;
      text-transform: none;
      letter-spacing: 0;
    }

    .semester-btn:hover {
      border-color: var(--primary);
      color: var(--primary);
      background: rgba(0, 200, 150, 0.08);
      transform: none;
      box-shadow: none;
    }

    .semester-btn.selected {
      border-color: var(--primary);
      background: rgba(0, 200, 150, 0.15);
      color: var(--primary);
    }

    .institution-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 16px;
    }

    .institution-card {
      border: 1px solid var(--border-card);
      border-radius: 14px;
      padding: 14px;
      background: var(--bg-card);
      cursor: pointer;
      transition: all 0.2s ease;
      min-height: 92px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 8px;
    }

    .institution-card:hover {
      border-color: var(--primary);
      background: rgba(0, 200, 150, 0.08);
    }

    .institution-card.selected {
      border-color: var(--primary);
      background: rgba(0, 200, 150, 0.12);
      box-shadow: 0 0 0 1px rgba(0, 200, 150, 0.15) inset;
    }

    .institution-card.disabled {
      opacity: 0.5;
      cursor: not-allowed;
      filter: grayscale(0.15);
    }

    .institution-name {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1.3;
    }

    .institution-meta {
      font-size: 11px;
      color: var(--text-secondary);
      line-height: 1.4;
    }

    .institution-badge {
      display: inline-flex;
      align-items: center;
      width: fit-content;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      border-radius: 999px;
      padding: 4px 8px;
      background: rgba(0, 200, 150, 0.15);
      color: var(--primary);
    }

    .institution-badge.soon {
      background: rgba(255,255,255,0.08);
      color: var(--text-secondary);
    }

    .institution-helper {
      font-size: 12px;
      color: var(--text-secondary);
      margin-bottom: 12px;
      line-height: 1.5;
    }

    /* Semester group headers in subject lists */
    .semester-group-header {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 1px;
      padding: 16px 0 8px;
      border-bottom: 1px solid var(--border-card);
      margin-bottom: 12px;
    }

    .semester-group-header:first-child {
      padding-top: 0;
    }

    /* Subject selection list (cleaner version) */
    .subject-select-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .subject-select-card {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px;
      background: var(--surface-2);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      cursor: pointer;
      transition: background var(--duration-fast) ease, border-color var(--duration-fast) ease, transform var(--duration-fast) var(--ease-spring), box-shadow var(--duration-fast) ease;
      box-shadow: var(--shadow-sm);
      min-height: 56px;
    }

    .subject-select-card:active {
      border-color: var(--primary);
      background: rgba(0, 200, 150, 0.08);
      transform: scale(0.98);
      box-shadow: none;
    }

    @media (hover: hover) {
      .subject-select-card:hover {
        border-color: var(--border-strong);
        background: var(--surface-3);
      }
    }

    /* Multi-select tema states */
    .subject-select-card.tema-selected {
      background: rgba(0, 200, 150, 0.10);
      border-color: var(--primary);
    }
    .tema-checkbox {
      width: 22px;
      height: 22px;
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 700;
      color: #fff;
      flex-shrink: 0;
      transition: background var(--duration-fast) ease, border-color var(--duration-fast) ease;
    }
    .tema-checkbox-checked {
      background: var(--primary);
      border-color: var(--primary);
    }

    /* Sticky bar de início */
    .tema-start-bar {
      position: sticky;
      bottom: 0;
      background: rgba(10, 22, 40, 0.96);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-top: 1px solid var(--border-subtle);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 0 -16px;
      gap: 12px;
      animation: screenFadeIn 0.2s var(--ease-spring);
    }

    .subject-select-icon {
      width: 42px;
      height: 42px;
      border-radius: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }

    .subject-select-icon svg {
      width: 20px;
      height: 20px;
      stroke-width: 2;
    }

    .subject-select-info { flex: 1; min-width: 0; }

    .subject-select-name {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .subject-select-meta {
      font-size: 12px;
      color: var(--text-secondary);
    }

    /* Progress bar within subject card */
    .subject-progress-bar {
      height: 3px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 2px;
      margin-top: 6px;
      overflow: hidden;
    }

    .subject-progress-fill {
      height: 100%;
      border-radius: 2px;
      transition: width 600ms var(--ease-spring);
    }

    /* Search icon SVG */
    .subject-search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-secondary);
      pointer-events: none;
      display: flex;
      align-items: center;
      line-height: 0;
    }

    /* Semester tab filter */
    .semester-tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 20px;
      overflow-x: auto;
      padding-bottom: 4px;
      -webkit-overflow-scrolling: touch;
    }

    .semester-tabs::-webkit-scrollbar { display: none; }

    .semester-tab {
      padding: 8px 14px;
      border-radius: 20px;
      border: 1px solid var(--border-card);
      background: transparent;
      color: var(--text-secondary);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
      min-height: auto;
      text-transform: none;
      letter-spacing: 0;
    }

    .semester-tab:hover {
      transform: none;
      box-shadow: none;
    }

    .semester-tab.active {
      background: var(--primary);
      color: #000;
      border-color: var(--primary);
    }

    /* Back button */
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: none;
      border: none;
      color: var(--primary);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      padding: 8px 0;
      margin-bottom: 16px;
      text-transform: none;
      letter-spacing: 0;
      min-height: auto;
    }

    .back-btn:hover {
      background: none;
      transform: none;
      box-shadow: none;
      opacity: 0.8;
    }

    /* Utilities */
    .hidden {
      display: none !important;
    }

    .mt-2 { margin-top: 16px; }
    .mt-4 { margin-top: 24px; }
    .mb-2 { margin-bottom: 16px; }
    .mb-4 { margin-bottom: 24px; }

    .text-center { text-align: center; }

    /* Responsive */
    @media (max-height: 600px) {
      .screen-content {
        padding: 16px 12px 100px 12px;
      }

      .stat-card {
        padding: 12px;
      }

      .stat-value {
        font-size: 18px;
      }
    }

    /* Atlas: áreas invisíveis sobre alfinetes da foto — só foco visível para teclado */
    .atlas-pin-hitbox {
      outline: none;
    }
    .atlas-pin-hitbox:focus-visible {
      outline: 2px solid var(--primary, #00C896);
      outline-offset: 2px;
      border-radius: 4px;
    }

    /* Anatomia + Histologia: toolbar não pode usar .screen-content (flex:1), senão divide a altura com o ecrã abaixo */
    .anatomy-hist-toolbar {
      flex-shrink: 0;
      padding: 8px 16px 0;
    }
    @media (min-width: 1024px) {
      .desktop-layout .anatomy-hist-toolbar {
        padding: 8px 40px 0;
      }
    }

    /* Screen content transition */
    .screen-content {
      animation: screenFadeIn 200ms var(--ease-spring);
    }

    @keyframes screenFadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Sidebar improvements */
    .sidebar-footer {
      padding: 12px 16px;
      border-top: 1px solid var(--border-subtle);
    }

    .sidebar-user-block {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 12px;
      background: var(--surface-1);
      border: 1px solid var(--border-subtle);
    }

    .sidebar-user-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary), var(--purple));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 700;
      color: #fff;
      flex-shrink: 0;
      font-family: 'Outfit', sans-serif;
    }

    .sidebar-user-info {
      flex: 1;
      min-width: 0;
    }

    .sidebar-user-name {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .sidebar-user-meta {
      font-size: 11px;
      color: var(--text-secondary);
    }

    /* Responsive: reduced motion */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }

    /* Print */
    @media print {
      body {
        background: white;
        color: black;
      }
    }

    /* ===================== Feedback FAB ===================== */
    .feedback-panel {
      background: var(--bg-dark, #181C27);
      border: 1px solid rgba(0,200,150,0.25);
      border-radius: 18px;
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
      padding: 24px 20px 24px;
    }

    .feedback-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 400;
      display: flex; align-items: flex-end; justify-content: center;
      padding: 0 0 env(safe-area-inset-bottom, 0) 0;
      animation: fadeIn 0.2s ease;
    }
    @media (min-width: 600px) {
      .feedback-overlay { align-items: center; }
    }
    .feedback-modal {
      background: var(--bg-dark, #181C27);
      border: 1px solid rgba(0,200,150,0.25);
      border-radius: 18px 18px 0 0;
      width: 100%;
      max-width: 520px;
      padding: 24px 20px 32px;
      animation: slideUp 0.25s ease;
    }
    @media (min-width: 600px) {
      .feedback-modal { border-radius: 18px; }
    }
    @keyframes slideUp {
      from { transform: translateY(40px); opacity: 0; }
      to   { transform: translateY(0);   opacity: 1; }
    }

    /* ── About/Sobre screen animations ───────────────── */
    @keyframes aboutFadeUp {
      from { opacity: 0; transform: translate3d(0, 20px, 0); }
      to   { opacity: 1; transform: translate3d(0, 0, 0); }
    }
    @keyframes aboutScaleIn {
      from { opacity: 0; transform: scale(0.92); }
      to   { opacity: 1; transform: scale(1); }
    }
    @keyframes aboutPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    @keyframes aboutGlow {
      0%, 100% { box-shadow: 0 0 20px rgba(0,200,150,0.15); }
      50% { box-shadow: 0 0 40px rgba(0,200,150,0.35), 0 0 80px rgba(0,200,150,0.1); }
    }
    @keyframes aboutFloat {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes aboutShimmer {
      0% { background-position: -200% center; }
      100% { background-position: 200% center; }
    }
    @keyframes aboutCountUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes aboutGradientMove {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .about-hero-badge {
      display: inline-flex; align-items: center; gap: 6px;
      background: rgba(0,200,150,0.12); border: 1px solid rgba(0,200,150,0.25);
      border-radius: 20px; padding: 6px 14px; font-size: 11px; font-weight: 700;
      color: #00C896; letter-spacing: 0.5px; text-transform: uppercase;
    }
    .about-card {
      background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px; padding: 24px 20px; transition: all 0.3s var(--ease-spring);
      position: relative; overflow: hidden;
    }
    .about-card:hover {
      background: rgba(255,255,255,0.07); border-color: rgba(0,200,150,0.2);
      transform: translateY(-2px); box-shadow: 0 8px 32px rgba(0,200,150,0.1);
    }
    .about-card::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
      background: linear-gradient(90deg, transparent, var(--primary), transparent);
      opacity: 0; transition: opacity 0.3s;
    }
    .about-card:hover::before { opacity: 1; }
    .about-stat-card {
      text-align: center; padding: 20px 12px;
      background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
      border-radius: 14px; animation: aboutCountUp 0.6s ease both;
    }
    .about-feature-icon {
      width: 48px; height: 48px; border-radius: 14px; display: flex;
      align-items: center; justify-content: center; font-size: 12px;
      font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase;
      flex-shrink: 0;
    }
    .about-roadmap-item {
      display: flex; gap: 14px; align-items: flex-start; padding: 16px 0;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .about-roadmap-item:last-child { border-bottom: none; }
    .about-roadmap-dot {
      width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; margin-top: 4px;
      box-shadow: 0 0 8px currentColor;
    }
    .about-section-title {
      font-family: Outfit, sans-serif; font-size: 18px; font-weight: 800;
      color: var(--text-primary); margin-bottom: 16px;
      display: flex; align-items: center; gap: 10px;
    }
    .about-cta-btn {
      display: inline-flex; align-items: center; gap: 8px;
      background: linear-gradient(135deg, #00C896, #00A87A); color: #fff;
      font-family: Outfit, sans-serif; font-weight: 700; font-size: 15px;
      padding: 14px 32px; border-radius: 14px; border: none; cursor: pointer;
      box-shadow: 0 4px 20px rgba(0,200,150,0.3); transition: all 0.3s var(--ease-spring);
    }
    .about-cta-btn:hover {
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 8px 32px rgba(0,200,150,0.4);
    }

    html[data-theme="light"] .about-card {
      background: rgba(0,0,0,0.03); border-color: rgba(0,0,0,0.08);
    }
    html[data-theme="light"] .about-card:hover {
      background: rgba(0,0,0,0.05); box-shadow: 0 8px 32px rgba(0,200,150,0.08);
    }
    html[data-theme="light"] .about-stat-card {
      background: rgba(0,0,0,0.03); border-color: rgba(0,0,0,0.08);
    }

    .feedback-modal h3 {
      font-size: 17px; font-weight: 700;
      color: var(--text-primary); margin-bottom: 4px;
    }
    .feedback-modal p { font-size: 13px; color: var(--text-secondary); margin-bottom: 18px; }
    .feedback-label { font-size: 12px; font-weight: 600; color: var(--text-secondary); margin-bottom: 6px; display: block; }
    .feedback-select, .feedback-textarea {
      width: 100%; background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.12); border-radius: 10px;
      color: var(--text-primary); font-family: inherit; font-size: 14px;
      padding: 10px 12px; margin-bottom: 14px;
      -webkit-user-select: auto; user-select: auto;
    }
    .feedback-select option { background: var(--bg-dark, #181C27); }
    .feedback-textarea { resize: none; height: 110px; }
    .feedback-char-counter { font-size: 11px; color: var(--text-secondary); text-align: right; margin-top: -10px; margin-bottom: 14px; }
    .feedback-actions { display: flex; gap: 10px; margin-top: 4px; }
    .feedback-btn {
      flex: 1; padding: 12px; border-radius: 10px; border: none;
      font-size: 14px; font-weight: 600; cursor: pointer; transition: opacity 0.2s;
    }
    .feedback-btn:active { opacity: 0.75; }
    .feedback-btn-primary { background: linear-gradient(135deg,#00C896,#0077B6); color: #fff; }
    .feedback-btn-secondary { background: rgba(255,255,255,0.08); color: var(--text-primary); }
    .feedback-success {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; padding: 32px 0; gap: 12px;
      color: var(--text-primary); font-size: 15px; text-align: center;
    }
    .feedback-success-icon { font-size: 40px; }
  </style>

  <div id="root"></div>

  <!-- Service Worker: registro + limpeza de SWs antigos de deploys anteriores -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {

        // Limpar SWs de versões anteriores registrados em paths diferentes
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          registrations.forEach(function(reg) {
            var url = reg.active ? reg.active.scriptURL : (reg.installing ? reg.installing.scriptURL : '');
            if (!url.endsWith('/sw.js')) reg.unregister();
          });
        });

        // Registrar SW atual
        navigator.serviceWorker.register('/sw.js').then(function(registration) {
          if (registration.waiting) {
            registration.waiting.postMessage({ type: 'SKIP_WAITING' });
          }
          registration.addEventListener('updatefound', function() {
            var newWorker = registration.installing;
            if (!newWorker) return;

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback, useMemo } = React;

    // ===================== Flow diagram parser =====================
    function buildFlowHTML(raw) {
      const COLORS = ['#00C896','#38BDF8','#A78BFA','#34D399','#FB923C','#F472B6'];
      function rgb(hex) {
        return [parseInt(hex.slice(1,3),16), parseInt(hex.slice(3,5),16), parseInt(hex.slice(5,7),16)];
      }
      function stepStyle(i, overrideColor) {
        const c = overrideColor || COLORS[i % COLORS.length];
        const [r,g,b] = rgb(c);
        return `border-color:${c};background:rgba(${r},${g},${b},0.13);color:${c}`;
      }
      function mkStep(text, idx, extra) {
        const plus = text.startsWith('+');
        const label = plus ? text.slice(1).trim() : text;
        const cls = 'flow-step' + (plus ? ' flow-step-dim' : '') + (extra || '');
        return `<div class="${cls}" style="${stepStyle(idx)}">${label}</div>`;
      }

      const lines = raw.split('\n').filter(l => l.trim());
      const trimmed = lines.map(l => l.trim());

      // ── Vertical flow (has standalone ↓ lines) ─────────────────
      if (trimmed.some(l => l === '↓')) {
        let html = '<div class="flow-v">'; let si = 0;
        for (const line of trimmed) {
          if (line === '↓') {
            html += '<div class="flow-vc">↓</div>';
          } else if (/^↓\s+(.+)$/.test(line)) {
            const note = line.match(/^↓\s+(.+)$/)[1];
            html += `<div class="flow-vc-note">↓ <span>${note}</span></div>`;
          } else {
            html += mkStep(line, si++);
          }
        }
        return html + '</div>';
      }

      // ── Gene structure ([Token] separated by ——) ──────────────
      const geneLine = trimmed.find(l => /\[.+\]/.test(l) && !l.includes('→'));
      if (geneLine) {
        const parts = geneLine.split('——').map(p => p.trim()).filter(Boolean);
        let html = '<div class="flow-h flow-gene">';
        parts.forEach((p, i) => {
          if (p.startsWith('[') && p.endsWith(']')) {
            const label = p.slice(1,-1);
            let c;
            if (/exon/i.test(label))        c = '#00C896';
            else if (/[íi]nton/i.test(label)) c = '#64748B';
            else if (/utr/i.test(label))    c = '#38BDF8';
            else if (/poly/i.test(label))   c = '#A78BFA';
            else                             c = '#FB923C';
            const [r,g,b] = rgb(c);
            html += `<div class="flow-step" style="border-color:${c};background:rgba(${r},${g},${b},0.13);color:${c}">${label}</div>`;
          } else {
            html += `<div class="flow-label">${p}</div>`;
          }
          if (i < parts.length - 1) html += '<div class="flow-ha">——</div>';
        });
        html += '</div>';
        const others = trimmed.filter(l => l !== geneLine);
        if (others.length) html += '<div class="flow-branch">' + others.map(l => `<div class="flow-branch-note">${l}</div>`).join('') + '</div>';
        return html;
      }

      // ── Horizontal flow (→ separators) ────────────────────────
      const mainLine = trimmed.find(l => l.includes('→'));
      if (!mainLine) {
        return '<div class="flow-raw">' + trimmed.join('<br>') + '</div>';
      }
      const branchLines = trimmed.filter(l => l !== mainLine);
      const steps = mainLine.split('→').map(s => s.trim()).filter(Boolean);
      let html = '<div class="flow-h">';
      steps.forEach((step, i) => {
        html += `<div class="flow-step" style="${stepStyle(i)}">${step}</div>`;
        if (i < steps.length - 1) html += '<div class="flow-ha">→</div>';
      });
      html += '</div>';

      if (branchLines.length) {
        html += '<div class="flow-branch">';
        let pendingArr = null;
        for (const bl of branchLines) {
          const arrMatch = bl.match(/^([↑↓]{1,2})\s*(.*)$/);
          if (arrMatch) {
            const [, arr, note] = arrMatch;
            if (note.trim()) {
              html += `<div class="flow-branch-note"><span class="fba">${arr}</span> ${note}</div>`;
            } else {
              pendingArr = arr;
            }
          } else if (bl.trim()) {
            if (pendingArr) { html += `<div class="flow-branch-arr">${pendingArr}</div>`; pendingArr = null; }
            const c = COLORS[steps.length % COLORS.length]; const [r,g,b] = rgb(c);
            html += `<div class="flow-step flow-step-branch" style="border-color:${c};background:rgba(${r},${g},${b},0.13);color:${c}">${bl}</div>`;
          }
        }
        if (pendingArr) html += `<div class="flow-branch-arr">${pendingArr}</div>`;
        html += '</div>';
      }
      return html;
    }

    function escapeFiguraIdAttr(id) {
      return String(id || '').replace(/[^A-Z0-9-]/gi, '');
    }

    /** HTML de figura inline (Wikimedia / catálogo); textos escapados para atributos. */
    function buildMaterialFigureHtml(fig) {
      const esc = (t) => String(t ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
      const src = esc(fig.urlImagem || '');
      const leg = esc(fig.legenda || fig.id);
      const cred = fig.credito ? ` — ${esc(fig.credito)}` : '';
      const lic = fig.licenca
        ? `<span style="display:block;margin-top:4px;font-size:0.75rem;opacity:0.85">${esc(fig.licenca)}</span>`
        : '';
      const link = fig.urlPaginaCommons
        ? `<a href="${esc(fig.urlPaginaCommons)}" target="_blank" rel="noopener noreferrer" style="display:inline-block;margin-top:8px;font-size:0.78rem;color:#00C896">Ver no Wikimedia Commons</a>`
        : '';
      return (
        `<figure class="material-fig-inline" style="margin:12px 0 16px;background:rgba(15,23,42,0.6);border:1px solid rgba(0,200,150,0.2);border-radius:12px;overflow:hidden">` +
        `<img src="${src}" alt="${leg}" loading="lazy" style="width:100%;max-height:min(420px,55vh);object-fit:contain;display:block;background:#020617" />` +
        `<figcaption style="padding:12px 14px;font-size:0.82rem;color:var(--text-secondary);line-height:1.5;border-top:1px solid rgba(0,200,150,0.12)">` +
        `<span style="color:#e5e7eb;font-weight:600">${leg}</span>${cred}${lic}${link}</figcaption></figure>`
      );
    }

    const MATERIAL_FIG_PENDING_HTML =
      '<div class="material-fig-placeholder material-fig-placeholder--pending" role="note"><span class="material-fig-placeholder-emoji" aria-hidden="true">🖼️</span><span class="material-fig-placeholder-text">Em breve: imagem neste ponto.</span></div>';

    /**
     * Remove briefing de ### Figura sugerida.
     * Se existir **Figura-ID:** igual ao id no JSON → slot inline (imagem no ponto do texto).
     * Senão → só aviso “em breve”.
     */
    function stripFiguraSugeridaBlocksForCliente(md) {
      if (!md || typeof md !== 'string') return md;
      return md.replace(
        /(^|\n)### Figura sugerida[^\n]*\n([\s\S]*?)(?=\n---\s*\n|\n## |$)/g,
        (match, lead, body) => {
          const idMatch = body.match(/\*\*Figura-ID:\*\*\s*`?([A-Z0-9-]+)`?/i);
          if (idMatch) {
            const id = escapeFiguraIdAttr(idMatch[1]);
            if (!id) return match;
            return `${lead}\n\n<div class="material-fig-slot" data-fig-id="${id}"></div>\n\n`;
          }
          return `${lead}\n\n${MATERIAL_FIG_PENDING_HTML}\n\n`;
        }
      );
    }

    // ===================== Markdown renderer =====================
    function renderMd(text) {
      const cleaned = stripFiguraSugeridaBlocksForCliente(
        text
          .replace(/\r\n/g, '\n')
          .replace(/(\|[^\n]*)\n\n+(?=\|)/g, '$1\n')
      );
      let html = marked.parse(cleaned)
        .replace(/<table>/g, '<div class="table-wrap"><table>')
        .replace(/<\/table>/g, '</table></div>');
      html = html.replace(
        /<pre><code class="language-flow">([\s\S]*?)<\/code><\/pre>/g,
        (_, content) => {
          const raw = content
            .replace(/&amp;/g, '&').replace(/&lt;/g, '<')
            .replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&#39;/g, "'");
          return '<div class="flow-box">' + buildFlowHTML(raw) + '</div>';
        }
      );
      return html;
    }

    // ===================== Feedback FAB =====================

    function incrementFeedbackCount() {

    // Device Fingerprint
    const generateDeviceFingerprint = async () => {
      const userAgent = navigator.userAgent;
      const screen_res = `${screen.width}x${screen.height}`;
      const timezone = Intl.DateTimeFormat().resolvedOptions().timeZone;

      let canvas_hash = '';
      try {
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        ctx.fillText('MedGradPlus', 10, 10);
        canvas_hash = canvas.toDataURL().substring(0, 50);
      } catch (e) {}

      return `${userAgent.substring(0, 30)}_${screen_res}_${timezone}_${canvas_hash}`.substring(0, 128);
    };

    // SM-2 Algorithm
    const SM2 = {
      calculateNextReview: (quality, reps, ef, interval) => {
        let newReps = reps + 1;
        let newEf = ef + 0.1 - (5 - quality) * (0.08 + (5 - quality) * 0.02);
        if (newEf < 1.3) newEf = 1.3;

        let newInterval;
        if (newReps === 1) newInterval = 1;
        else if (newReps === 2) newInterval = 3;
        else newInterval = Math.round(interval * newEf);

        const nextReview = Date.now() + (newInterval * 24 * 60 * 60 * 1000);
        return { newReps, newEf, newInterval, nextReview };
      },

      getDueCards: (cards, srData) => {
        const now = Date.now();
        return cards.filter(card => {
          const data = srData[card.id] || { nextReview: 0 };
          return data.nextReview <= now;
        }).sort((a, b) => {
          const aData = srData[a.id] || { nextReview: 0 };
          const bData = srData[b.id] || { nextReview: 0 };
          return aData.nextReview - bData.nextReview;
        });
      },

      // Only returns cards already seen at least once (reps > 0) that are due
      getReviewDueCards: (cards, srData) => {
        const now = Date.now();
        return cards.filter(card => {
          const data = srData[card.id];
          return data !== undefined && !data.buried && data.nextReview <= now;
        }).sort((a, b) => srData[a.id].nextReview - srData[b.id].nextReview);
      }
    };

    // Format time
    const formatTime = (ms) => {
      const seconds = Math.floor(ms / 1000);
      const minutes = Math.floor(seconds / 60);
      const hours = Math.floor(minutes / 60);

      if (hours > 0) return `${hours}h ${minutes % 60}m`;
      if (minutes > 0) return `${minutes}m ${seconds % 60}s`;
      return `${seconds}s`;
    };

    // ===================== Security Utilities =====================
    const CODE_SALT = 'meduni9_2026_';
    const MAX_ATTEMPTS = 5;
    const LOCKOUT_BASE_MS = 60000; // 1 minute base lockout

    async function hashCode(code) {
      const encoder = new TextEncoder();
      const data = encoder.encode(CODE_SALT + code);
      const hashBuffer = await crypto.subtle.digest('SHA-256', data);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    function getRateLimitState() {
      try {
        const raw = localStorage.getItem('meduni9_rl');
        if (!raw) return { attempts: 0, lockedUntil: 0, history: [] };
        return JSON.parse(raw);
      } catch { return { attempts: 0, lockedUntil: 0, history: [] }; }
    }

    function setRateLimitState(state) {
      localStorage.setItem('meduni9_rl', JSON.stringify(state));
    }

    function checkRateLimit() {
      const state = getRateLimitState();
      const now = Date.now();
      if (state.lockedUntil > now) {
        const remainSec = Math.ceil((state.lockedUntil - now) / 1000);
        const mins = Math.floor(remainSec / 60);
        const secs = remainSec % 60;
        return { allowed: false, message: `Muitas tentativas. Tente novamente em ${mins}m${secs}s.` };
      }
      // Clear old attempts (older than 10 minutes)
      state.history = (state.history || []).filter(t => now - t < 600000);
      if (state.history.length >= MAX_ATTEMPTS) {
        // Exponential backoff: 1min, 2min, 4min, 8min, 16min, max 30min
        const lockoutMs = Math.min(LOCKOUT_BASE_MS * Math.pow(2, state.attempts - MAX_ATTEMPTS), 1800000);
        state.lockedUntil = now + lockoutMs;
        state.attempts++;
        setRateLimitState(state);
        return { allowed: false, message: `Muitas tentativas. Bloqueado por ${Math.ceil(lockoutMs/60000)} minutos.` };
      }
      return { allowed: true };
    }

    function recordFailedAttempt() {
      const state = getRateLimitState();
      state.history = [...(state.history || []), Date.now()];
      state.attempts = (state.attempts || 0) + 1;
      setRateLimitState(state);
    }

    function resetRateLimit() {
      localStorage.removeItem('meduni9_rl');

    function normalizeModulesAccess(value) {
      if (value === null || value === undefined || value === '' || value === 'all') return null;

      const source = Array.isArray(value)
        ? value
        : String(value)
            .split(',')
            .map(s => s.trim())
            .filter(Boolean);

      const modules = [...new Set(source.map(n => parseInt(n, 10)).filter(n => Number.isFinite(n) && n >= 1 && n <= 12))]
        .sort((a, b) => a - b);

      return modules.length ? modules : null;
    }

    function resolveModulesFromCodeEntry(codeEntry = {}) {
      const explicit = normalizeModulesAccess(
        codeEntry.modulosAcesso ?? codeEntry.modulos_acesso ?? codeEntry.modulos ?? codeEntry.modules
      );
      if (explicit) return explicit;

      const plan = String(codeEntry.plano || '').toLowerCase();
      if (plan === 'ciclo_basico' || plan === 'ciclo') return [1, 2, 3, 4];
      if (plan === 'ciclo_clinico') return [5, 6, 7, 8];
      if (plan === 'ciclo_internato') return [9, 10, 11, 12];

      if (plan === 'modulo') {
        const inferredModule = parseInt(
          codeEntry.moduloLiberado ?? codeEntry.moduloAcesso ?? codeEntry.moduloNum ?? codeEntry.modulo ?? codeEntry.semestre,
          10
        );
        if (Number.isFinite(inferredModule) && inferredModule >= 1 && inferredModule <= 12) {
          return [inferredModule];
        }
      }

      return null;
    }

    function getAmbassadorModules() {
      return Array.from({ length: 12 }, (_, idx) => idx + 1);

      const normalized = normalizeModulesAccess(profile?.modulosAcesso);

      const modulo = parseInt(moduloNum, 10);
      if (!Number.isFinite(modulo) || modulo < 1) return false;

      if (!normalized) return true;
      return normalized.includes(modulo);

    function normalizeUserProfile(profile = {}) {
      const faculty = getFacultyById(profile.faculdadeId || profile.facultyId || DEFAULT_FACULTY_ID);
      const campus = getCampusById(faculty.id, profile.campusId || DEFAULT_CAMPUS_ID) || getFirstActiveCampus(faculty);
      let modules = normalizeModulesAccess(profile.modulosAcesso);
      const profilePlan = String(profile.plano || '').toLowerCase();
      if (!modules && profilePlan === 'modulo') {
        const inferredModule = parseInt(
          profile.moduloLiberado ?? profile.moduloAcesso ?? profile.moduloNum ?? profile.modulo ?? profile.semestre,
          10
        );
        if (Number.isFinite(inferredModule) && inferredModule >= 1 && inferredModule <= 12) {
          modules = [inferredModule];
        }
      }
      const semestreRaw = Number(profile.semestre || profile.modulo || 1);
      const defaultSemester = Number.isFinite(semestreRaw) && semestreRaw > 0 ? semestreRaw : 1;
      const semestre = modules && !modules.includes(defaultSemester)
        ? modules[0]
        : defaultSemester;

      return {
        ...profile,
        plano: profile.plano || 'basico',
        modulosAcesso: modules,
        semestre: semestre,
        modulo: semestre,
        faculdadeId: faculty.id,
        faculdadeNome: faculty.name,
        campusId: campus?.id || DEFAULT_CAMPUS_ID,
        campusNome: campus?.name || 'Vergueiro',

    function encodeProfileMarker(profile) {
      const normalized = normalizeUserProfile(profile);
      return [
        'mgp',
        normalized.plano || 'basico',
        String(normalized.semestre || normalized.modulo || 1),
        normalized.codeHash || '',
        normalized.faculdadeId || DEFAULT_FACULTY_ID,
        normalized.campusId || DEFAULT_CAMPUS_ID,
        normalized.modulosAcesso ? normalized.modulosAcesso.join(',') : 'all',
      ].join('|');
    }

    function decodeProfileMarker(fbUser) {
      const raw = fbUser?.displayName || '';
      if (!raw.startsWith('mgp|')) return null;
      const parts = raw.split('|');
      const [, plano, semestreRaw, codeHash, faculdadeId, campusId, modulosRaw] = parts;
      return normalizeUserProfile({
        uid: fbUser.uid,
        email: fbUser.email || '',
        plano: plano || 'basico',
        semestre: Number(semestreRaw || 1),
        modulo: Number(semestreRaw || 1),
        codeHash: codeHash || '',
        faculdadeId: faculdadeId || DEFAULT_FACULTY_ID,
        campusId: campusId || DEFAULT_CAMPUS_ID,
        modulosAcesso: normalizeModulesAccess(modulosRaw),
        loginDate: new Date().toISOString(),
      });
