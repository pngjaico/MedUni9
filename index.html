                    {referenciaAsclepio.nome}
                  </a>
                </div>
              )}
            </div>
          )}
        </div>
      );
    };

    const AnatomiaScreen = ({ user }) => {
      const [viewMode, setViewMode] = React.useState('atlas');
      const [openSystem, setOpenSystem] = React.useState(null);
      const [openSub, setOpenSub] = React.useState({});
      const [search, setSearch] = React.useState('');
      const [selectedRegion, setSelectedRegion] = React.useState('todas');
      const [atlasData, setAtlasData] = React.useState(null);
      const [atlasErr, setAtlasErr] = React.useState(null);
      const [atlasNav, setAtlasNav] = React.useState({ step: 'systems', sistemaId: null, divisaoId: null, laminaAtual: null });
      const [revisaoData, setRevisaoData] = React.useState(null);
      const [revisaoErr, setRevisaoErr] = React.useState(null);
      const [atlasDemoNotice, setAtlasDemoNotice] = React.useState(null);

      const atlasFreeLock = isFreeTierUser(user);

      React.useEffect(() => {
        fetch('data/anatomia_atlas.json?_=' + Date.now())
          .then(r => { if (!r.ok) throw new Error('Falha ao carregar atlas'); return r.json(); })
          .then(setAtlasData)
          .catch(e => setAtlasErr(e.message || String(e)));
      }, []);

      React.useEffect(() => {
        fetch('data/anatomia_revisao.json?_=' + Date.now())
          .then(r => { if (!r.ok) throw new Error('Falha ao carregar revisão'); return r.json(); })
          .then(setRevisaoData)
          .catch(e => setRevisaoErr(e.message || String(e)));
      }, []);

      const q = search.toLowerCase().trim();
      const sistemasBase = revisaoData && Array.isArray(revisaoData.sistemas) ? revisaoData.sistemas : [];

      const regionKeys = React.useMemo(() => {
        const set = new Set();
        sistemasBase.forEach(sys => {
          (sys.subsections || []).forEach(sub => {
            if (sub.regiao) set.add(sub.regiao);
          });
        });
        return ['todas', ...Array.from(set).sort()];
      }, [sistemasBase]);

      const filtered = React.useMemo(() => {
        if (!sistemasBase.length) return [];
        return sistemasBase.map(sys => {
          const regionFiltered = filterSubsectionsByRegion(sys.subsections, selectedRegion);
          if (!q) {
            return { ...sys, subsections: regionFiltered };
          }
          const nameMatch = (sys.name || '').toLowerCase().includes(q);
          const matchingSubs = regionFiltered.filter(sub => subsectionMatchesRevisaoQuery(sub, q));
          let finalSubs;
          if (matchingSubs.length) {
            finalSubs = matchingSubs.map(sub => applyRevisaoQueryToSub(sub, q));
          } else if (nameMatch) {
            finalSubs = regionFiltered.map(sub => applyRevisaoQueryToSub(sub, q));
          } else {
            return null;
          }
          return { ...sys, subsections: finalSubs };
        }).filter(sys => sys && (sys.subsections || []).length > 0);
      }, [sistemasBase, q, selectedRegion]);

      const toggleSystem = (id) => { setOpenSystem(prev => prev === id ? null : id); setOpenSub({}); };
      const toggleSub = (key) => setOpenSub(prev => ({ ...prev, [key]: !prev[key] }));

      React.useEffect(() => {
        if (q && filtered.length === 1) setOpenSystem(filtered[0].id);
      }, [q, filtered]);

      const atlasSistema = atlasData && atlasNav.sistemaId ? atlasData.sistemas.find(s => s.id === atlasNav.sistemaId) : null;
      const atlasDivisao = atlasSistema && atlasNav.divisaoId ? atlasSistema.divisoes.find(d => d.id === atlasNav.divisaoId) : null;

      const atlasGoBack = () => {
        if (atlasNav.step === 'plate') setAtlasNav({ step: 'laminas', sistemaId: atlasNav.sistemaId, divisaoId: atlasNav.divisaoId, laminaAtual: null });
        else if (atlasNav.step === 'laminas') setAtlasNav({ step: 'divisions', sistemaId: atlasNav.sistemaId, divisaoId: null, laminaAtual: null });
        else if (atlasNav.step === 'divisions') setAtlasNav({ step: 'systems', sistemaId: null, divisaoId: null, laminaAtual: null });
      };

      const segBtnStyle = (active) => ({
        flex: 1, padding: '10px 0', borderRadius: '10px', border: 'none',
        fontSize: '13px', fontWeight: 700, fontFamily: 'Outfit, sans-serif', cursor: 'pointer',
        transition: 'all 0.2s ease',
        background: active ? 'linear-gradient(135deg, rgba(139,92,246,0.3), rgba(99,102,241,0.2))' : 'transparent',
        color: active ? '#EDE9FE' : 'var(--text-secondary)',
        boxShadow: active ? '0 2px 12px rgba(139,92,246,0.15)' : 'none',
      });

      const backBtn = {
        display: 'inline-flex', alignItems: 'center', gap: '6px', marginBottom: '16px',
        padding: '8px 14px', borderRadius: '10px', border: '1px solid rgba(255,255,255,0.1)',
        background: 'rgba(255,255,255,0.04)', color: 'var(--text-secondary)', fontSize: '13px', fontWeight: 600,
        cursor: 'pointer', fontFamily: 'inherit', transition: 'background 0.15s ease',
      };

      const totalLaminas = atlasSistema ? atlasSistema.divisoes.reduce((t, d) => t + (d.laminas ? d.laminas.length : 0), 0) : 0;

      return (
        <div className="screen-content">
          <div style={{ maxWidth: '720px', margin: '0 auto' }}>
            <h2 style={{ fontFamily: 'Outfit', fontSize: '24px', fontWeight: 800, color: 'var(--text-primary)', marginBottom: '2px', letterSpacing: '-0.02em' }}>Anatomia</h2>
            <p style={{ fontSize: '13px', color: 'var(--text-secondary)', marginBottom: '18px', lineHeight: 1.5 }}>
              {viewMode === 'revisao'
                ? 'Ordem, trajetos e relações — use a busca, o filtro por região ou abra cada sistema.'
                : 'Atlas visual por sistema ou revisão rápida em texto para pré-prova.'}
            </p>

            <div style={{
              display: 'flex', gap: '4px', padding: '4px',
              background: 'rgba(255,255,255,0.03)', borderRadius: '12px',
              border: '1px solid rgba(255,255,255,0.06)', marginBottom: '20px',
            }}>
              <button type="button" style={segBtnStyle(viewMode === 'atlas')} onClick={() => setViewMode('atlas')}>Atlas visual</button>
              <button type="button" style={segBtnStyle(viewMode === 'revisao')} onClick={() => setViewMode('revisao')}>Revisão rápida</button>
            </div>

            {viewMode === 'atlas' && (
              <div>
                {atlasErr && (
                  <div style={{ padding: '16px', borderRadius: '14px', background: 'rgba(239,68,68,0.08)', border: '1px solid rgba(239,68,68,0.2)', color: '#FCA5A5', fontSize: '13px', lineHeight: 1.6 }}>
                    Erro ao carregar o atlas. Verifique sua conexão e recarregue a página.
                  </div>
                )}
                {!atlasData && !atlasErr && (
                  <div style={{ padding: '48px 24px', textAlign: 'center' }}>
                    <div style={{ width: '28px', height: '28px', margin: '0 auto 12px', border: '3px solid rgba(255,255,255,0.1)', borderTopColor: '#8B5CF6', borderRadius: '50%', animation: 'spin 0.8s linear infinite' }} />
                    <div style={{ fontSize: '13px', color: 'var(--text-secondary)' }}>Carregando atlas...</div>
                  </div>
                )}

                {atlasFreeLock && atlasDemoNotice && (
                  <div style={{
                    marginBottom: '14px', padding: '12px 14px', borderRadius: '12px',
                    background: 'rgba(0,200,150,0.08)', border: '1px solid rgba(0,200,150,0.22)',
                    fontSize: '13px', lineHeight: 1.55, color: 'var(--text-primary)',
                  }}>
                    <div style={{ marginBottom: '10px' }}>{atlasDemoNotice}</div>
                    <div style={{ display: 'flex', flexWrap: 'wrap', gap: '8px', alignItems: 'center' }}>
                      <a href="comprar.html" className="btn btn-primary" style={{ width: 'auto', padding: '8px 14px', fontSize: '12px', textDecoration: 'none', display: 'inline-flex', alignItems: 'center' }}>Ver planos</a>
                      <button type="button" className="btn btn-secondary" style={{ width: 'auto', padding: '8px 14px', fontSize: '12px' }} onClick={() => setAtlasDemoNotice(null)}>Fechar</button>
                    </div>
                  </div>
                )}

                {atlasData && atlasNav.step === 'systems' && (
                  <div style={{ display: 'grid', gridTemplateColumns: 'repeat(2, 1fr)', gap: '10px' }}>
                    {atlasData.sistemas.map((sys, idx) => {
                      const Icon = ATLAS_ICON_MAP[sys.icone] || AtlasIconBone;
                      const nLam = sys.divisoes.reduce((t, d) => t + (d.laminas ? d.laminas.length : 0), 0);
                      const sysLocked = atlasFreeLock && sys.id !== ATLAS_GRATUITO_SISTEMA_ID;
                      const openSys = () => setAtlasNav({ step: 'divisions', sistemaId: sys.id, divisaoId: null, laminaAtual: null });
                      return (
                        <button key={sys.id} type="button"
                          onClick={() => {
                            if (sysLocked) {
                              setAtlasDemoNotice('No modo demonstração, só o atlas «Sistema esquelético › Cabeça» está liberado. O atlas completo abre com código de acesso.');
                              return;
                            }
                            openSys();
                          }}
                          style={{
                            display: 'flex', flexDirection: 'column', alignItems: 'flex-start', gap: '10px',
                            padding: '16px 14px', borderRadius: '14px', textAlign: 'left',
                            border: '1px solid rgba(255,255,255,0.06)',
                            background: 'rgba(255,255,255,0.025)',
                            cursor: sysLocked ? 'not-allowed' : 'pointer', fontFamily: 'inherit',
                            transition: 'background 0.15s ease, border-color 0.15s ease, opacity 0.15s ease',
                            animation: `aboutFadeUp 0.3s ease ${idx * 0.04}s both`,
                            opacity: sysLocked ? 0.48 : 1,
                            position: 'relative',
                          }}
                          onMouseEnter={e => {
                            if (sysLocked) return;
                            e.currentTarget.style.background = 'rgba(255,255,255,0.06)';
                            e.currentTarget.style.borderColor = 'rgba(255,255,255,0.12)';
                          }}
                          onMouseLeave={e => {
                            if (sysLocked) return;
                            e.currentTarget.style.background = 'rgba(255,255,255,0.025)';
                            e.currentTarget.style.borderColor = 'rgba(255,255,255,0.06)';
                          }}
                        >
                          {sysLocked && (
                            <span style={{
                              position: 'absolute', top: '10px', right: '10px', fontSize: '9px', fontWeight: 800,
                              textTransform: 'uppercase', letterSpacing: '0.06em', color: 'var(--text-secondary)', opacity: 0.85,
                            }}>Bloqueado</span>
                          )}
                          <div style={{
                            width: '36px', height: '36px', borderRadius: '10px', display: 'flex', alignItems: 'center', justifyContent: 'center',
                            background: sys.cor + '18', color: sys.cor,
                          }}>
                            <Icon />
                          </div>
                          <div>
                            <div style={{ fontWeight: 700, fontSize: '13px', color: 'var(--text-primary)', lineHeight: 1.3, marginBottom: '3px' }}>{sys.titulo}</div>
                            <div style={{ fontSize: '11px', color: 'var(--text-secondary)' }}>
                              {sys.divisoes.length} div. {nLam > 0 ? ` · ${nLam} lam.` : ''}
                            </div>
                          </div>
                        </button>
                      );
                    })}
                  </div>
                )}

                {atlasData && atlasNav.step === 'divisions' && atlasSistema && (() => {
                  const Icon = ATLAS_ICON_MAP[atlasSistema.icone] || AtlasIconBone;
                  return (
                    <div>
                      <button type="button" onClick={atlasGoBack} style={backBtn}
                        onMouseEnter={e => e.currentTarget.style.background='rgba(255,255,255,0.08)'}
                        onMouseLeave={e => e.currentTarget.style.background='rgba(255,255,255,0.04)'}>
                        <AtlasIconBack /> Todos os sistemas
                      </button>
                      <div style={{ display: 'flex', alignItems: 'center', gap: '12px', marginBottom: '16px' }}>
                        <div style={{
                          width: '40px', height: '40px', borderRadius: '12px', display: 'flex', alignItems: 'center', justifyContent: 'center',
                          background: atlasSistema.cor + '1A', color: atlasSistema.cor,
                        }}>
                          <Icon />
                        </div>
                        <div>
                          <h3 style={{ fontFamily: 'Outfit', fontWeight: 800, fontSize: '18px', color: 'var(--text-primary)', margin: 0 }}>{atlasSistema.titulo}</h3>
                          <div style={{ fontSize: '12px', color: 'var(--text-secondary)', marginTop: '2px' }}>
                            {atlasSistema.divisoes.length} divisões · {totalLaminas} lâminas
                          </div>
                        </div>
                      </div>
                      <div style={{ display: 'flex', flexDirection: 'column', gap: '8px' }}>
                        {atlasSistema.divisoes.map((div, di) => {
                          const n = div.laminas ? div.laminas.length : 0;
                          const hasImgs = div.laminas && div.laminas.some(l => l.urlImagem);
                          const divLocked = atlasFreeLock && (atlasSistema.id !== ATLAS_GRATUITO_SISTEMA_ID || div.id !== ATLAS_GRATUITO_DIVISAO_ID);
                          return (
                            <button key={div.id} type="button"
                              onClick={() => {
                                if (divLocked) {
                                  setAtlasDemoNotice('No modo demonstração, só a divisão «Cabeça» do esquelético está liberada. O atlas completo abre com código de acesso.');
                                  return;
                                }
                                setAtlasNav({ step: 'laminas', sistemaId: atlasSistema.id, divisaoId: div.id, laminaAtual: null });
                              }}
                              style={{
                                display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: '12px',
                                padding: '14px 16px', borderRadius: '12px', textAlign: 'left',
                                border: '1px solid rgba(255,255,255,0.06)',
                                background: 'rgba(255,255,255,0.025)',
                                cursor: divLocked ? 'not-allowed' : 'pointer', fontFamily: 'inherit',
                                transition: 'background 0.15s ease, opacity 0.15s ease',
                                animation: `aboutFadeUp 0.25s ease ${di * 0.04}s both`,
                                opacity: divLocked ? 0.48 : 1,
                                position: 'relative',
                              }}
                              onMouseEnter={e => { if (!divLocked) e.currentTarget.style.background = 'rgba(255,255,255,0.06)'; }}
                              onMouseLeave={e => { if (!divLocked) e.currentTarget.style.background = 'rgba(255,255,255,0.025)'; }}
                            >
                              {divLocked && (
                                <span style={{
                                  position: 'absolute', top: '10px', right: '36px', fontSize: '9px', fontWeight: 800,
                                  textTransform: 'uppercase', letterSpacing: '0.06em', color: 'var(--text-secondary)', opacity: 0.85,
                                }}>Bloqueado</span>
                              )}
                              <div style={{ flex: 1 }}>
                                <div style={{ fontWeight: 600, fontSize: '14px', color: 'var(--text-primary)' }}>{div.titulo}</div>
                                <div style={{ fontSize: '11px', color: 'var(--text-secondary)', marginTop: '3px', display: 'flex', alignItems: 'center', gap: '6px' }}>
                                  {n} lâmina{n !== 1 ? 's' : ''}
                                  {hasImgs && <span style={{ display: 'inline-flex', color: atlasSistema.cor, opacity: 0.7 }}><AtlasIconPin /></span>}
                                  {!hasImgs && n > 0 && <span style={{ fontSize: '10px', padding: '1px 6px', borderRadius: '4px', background: 'rgba(255,255,255,0.06)', color: 'var(--text-secondary)' }}>aguardando imagens</span>}
                                </div>
                              </div>
                              <span style={{ color: 'var(--text-secondary)', opacity: 0.5 }}><AtlasIconChevron /></span>
                            </button>
                          );
                        })}
                      </div>
                    </div>
                  );
                })()}

                {atlasData && atlasNav.step === 'laminas' && atlasSistema && atlasDivisao && (
                  <div>
                    <button type="button" onClick={atlasGoBack} style={backBtn}
                      onMouseEnter={e => e.currentTarget.style.background='rgba(255,255,255,0.08)'}
                      onMouseLeave={e => e.currentTarget.style.background='rgba(255,255,255,0.04)'}>
                      <AtlasIconBack /> {atlasSistema.titulo}
                    </button>
                    <div style={{ marginBottom: '14px' }}>
                      <div style={{ fontSize: '11px', fontWeight: 700, color: atlasSistema.cor, textTransform: 'uppercase', letterSpacing: '0.08em', marginBottom: '4px' }}>{atlasSistema.titulo}</div>
                      <h3 style={{ fontFamily: 'Outfit', fontWeight: 800, fontSize: '18px', color: 'var(--text-primary)', margin: 0 }}>{atlasDivisao.titulo}</h3>
                    </div>
                    <div style={{ display: 'flex', flexDirection: 'column', gap: '8px' }}>
                      {atlasDivisao.laminas.map((lam, li) => {
                        const hasImg = lam.urlImagem && lam.urlImagem.length > 0;
                        const hasPins = lam.pinos && lam.pinos.length > 0;
                        return (
                          <button key={lam.id} type="button"
                            onClick={() => setAtlasNav({ step: 'plate', sistemaId: atlasSistema.id, divisaoId: atlasDivisao.id, laminaAtual: lam })}
                            style={{
                              display: 'flex', alignItems: 'center', gap: '14px',
                              padding: '14px 16px', borderRadius: '12px', textAlign: 'left',
                              border: '1px solid rgba(255,255,255,0.06)',
                              background: hasImg ? 'linear-gradient(135deg, rgba(139,92,246,0.06), rgba(99,102,241,0.03))' : 'rgba(255,255,255,0.02)',
                              cursor: 'pointer', fontFamily: 'inherit', transition: 'background 0.15s ease',
                              animation: `aboutFadeUp 0.25s ease ${li * 0.04}s both`,
                            }}
                            onMouseEnter={e => e.currentTarget.style.background = hasImg ? 'rgba(139,92,246,0.12)' : 'rgba(255,255,255,0.05)'}
                            onMouseLeave={e => e.currentTarget.style.background = hasImg ? 'linear-gradient(135deg, rgba(139,92,246,0.06), rgba(99,102,241,0.03))' : 'rgba(255,255,255,0.02)'}
                          >
                            <div style={{
                              width: '38px', height: '38px', borderRadius: '10px', flexShrink: 0, display: 'flex', alignItems: 'center', justifyContent: 'center',
                              background: hasImg ? atlasSistema.cor + '18' : 'rgba(255,255,255,0.04)',
                              color: hasImg ? atlasSistema.cor : 'rgba(255,255,255,0.2)',
                            }}>
                              <AtlasIconImage />
                            </div>
                            <div style={{ flex: 1 }}>
                              <div style={{ fontWeight: 700, fontSize: '13px', color: 'var(--text-primary)', lineHeight: 1.3 }}>{lam.titulo}</div>
                              <div style={{ fontSize: '11px', color: 'var(--text-secondary)', marginTop: '3px', display: 'flex', alignItems: 'center', gap: '8px' }}>
                                {ATLAS_SHOW_SOURCE_ATTRIBUTION && (
                                  <span>{lam.fonte === 'commons' ? 'Wikimedia Commons' : 'Asclépio UFU'}</span>
                                )}
                                {hasPins && <span style={{ display: 'flex', alignItems: 'center', gap: '3px', color: atlasSistema.cor }}><AtlasIconPin /> {lam.pinos.length}</span>}
                                {!hasImg && <span style={{ fontSize: '10px', padding: '1px 6px', borderRadius: '4px', background: 'rgba(255,255,255,0.06)' }}>pendente</span>}
                              </div>
                            </div>
                            <span style={{ color: 'var(--text-secondary)', opacity: 0.5 }}><AtlasIconChevron /></span>
                          </button>
                        );
                      })}
                    </div>
                  </div>
                )}

                {atlasData && atlasNav.step === 'plate' && atlasNav.laminaAtual && atlasSistema && atlasDivisao && (
                  <AnatomiaAtlasPlate
                    lamina={atlasNav.laminaAtual}
                    accentColor={atlasSistema.cor}
                    sistemaTitulo={atlasSistema.titulo}
                    divisaoTitulo={atlasDivisao.titulo}
                    referenciaAsclepio={atlasData.referenciaAsclepio}
                    onBack={atlasGoBack}
                  />
                )}
              </div>
            )}

            {viewMode === 'revisao' && (
              <>
                {revisaoErr && (
                  <div style={{ padding: '16px', borderRadius: '14px', background: 'rgba(239,68,68,0.08)', border: '1px solid rgba(239,68,68,0.2)', color: '#FCA5A5', fontSize: '13px', lineHeight: 1.6, marginBottom: '16px' }}>
                    Erro ao carregar a revisão escrita. Verifique sua conexão e recarregue a página.
                  </div>
                )}
                {!revisaoData && !revisaoErr && (
                  <div style={{ padding: '48px 24px', textAlign: 'center', marginBottom: '8px' }}>
                    <div style={{ width: '28px', height: '28px', margin: '0 auto 12px', border: '3px solid rgba(255,255,255,0.1)', borderTopColor: '#8B5CF6', borderRadius: '50%', animation: 'spin 0.8s linear infinite' }} />
                    <div style={{ fontSize: '13px', color: 'var(--text-secondary)' }}>Carregando revisão...</div>
                  </div>
                )}

                {revisaoData && (
                  <>
                    <div style={{ display: 'flex', flexWrap: 'wrap', gap: '8px', marginBottom: '14px' }}>
                      {regionKeys.map(rk => (
                        <button
                          key={rk}
                          type="button"
                          onClick={() => setSelectedRegion(rk)}
                          style={{
                            padding: '6px 12px', borderRadius: '999px', border: '1px solid ' + (selectedRegion === rk ? 'rgba(139,92,246,0.45)' : 'rgba(255,255,255,0.1)'),
                            background: selectedRegion === rk ? 'linear-gradient(135deg, rgba(139,92,246,0.22), rgba(99,102,241,0.12))' : 'rgba(255,255,255,0.04)',
                            color: selectedRegion === rk ? '#EDE9FE' : 'var(--text-secondary)', fontSize: '12px', fontWeight: 700, fontFamily: 'Outfit, sans-serif', cursor: 'pointer',
                          }}
                        >
                          {REVISAO_REGION_LABELS[rk] || rk}
                        </button>
                      ))}
                    </div>

                    <div style={{ position: 'relative', marginBottom: '18px' }}>
                      <input type="text" placeholder="Buscar estrutura, nervo, músculo, sequência..."
                        value={search} onChange={e => setSearch(e.target.value)}
                        style={{
                          width: '100%', padding: '10px 14px 10px 38px',
                          background: 'rgba(255,255,255,0.04)', border: '1px solid rgba(255,255,255,0.08)',
                          borderRadius: '10px', color: 'var(--text-primary)', fontSize: '14px', outline: 'none',
                          transition: 'border-color 0.15s ease',
                        }}
                        onFocus={e => e.target.style.borderColor = 'rgba(139,92,246,0.4)'}
                        onBlur={e => e.target.style.borderColor = 'rgba(255,255,255,0.08)'}
                      />
                      <span style={{ position: 'absolute', left: '12px', top: '50%', transform: 'translateY(-50%)', color: 'var(--text-secondary)', pointerEvents: 'none', display: 'flex' }}>
                        <AtlasIconSearch />
                      </span>
                    </div>

                    {filtered.length === 0 && (
                      <div style={{ textAlign: 'center', color: 'var(--text-secondary)', padding: '40px 0', fontSize: '14px' }}>
                        Nenhum resultado para "{search}"
                      </div>
                    )}

                    {filtered.map(sys => {
                      const SysIcon = REVISAO_ICON_MAP[sys.icone] || IconSysLocomotor;
                      const nItems = (sys.subsections || []).reduce((t, s) => t + countRevisaoSubItems(s), 0);
                      return (
                        <div key={sys.id} style={{ marginBottom: '8px', borderRadius: '14px', overflow: 'hidden', border: '1px solid rgba(255,255,255,0.06)', background: 'rgba(255,255,255,0.02)' }}>
                          <div onClick={() => toggleSystem(sys.id)} style={{
                            display: 'flex', alignItems: 'center', gap: '12px', padding: '13px 16px',
                            cursor: 'pointer', userSelect: 'none',
                            borderBottom: openSystem === sys.id ? '1px solid rgba(255,255,255,0.06)' : 'none',

            <div style={{

            }}>
              <div className="about-card">
                <div style={{ fontSize: '12px', fontWeight: 800, letterSpacing: '0.08em', textTransform: 'uppercase', color: '#6EE7B7', marginBottom: '8px' }}>Hoje</div>
                <div style={{ fontFamily: 'Outfit, sans-serif', fontSize: '18px', fontWeight: 800, color: 'var(--text-primary)', marginBottom: '8px' }}>Base prática e navegável</div>
                <div style={{ fontSize: '13px', color: 'var(--text-secondary)', lineHeight: 1.7 }}>Materiais, questões, flashcards, anatomia beta e feedback num fluxo só.</div>
              </div>
              <div className="about-card">
                <div style={{ fontSize: '12px', fontWeight: 800, letterSpacing: '0.08em', textTransform: 'uppercase', color: '#93C5FD', marginBottom: '8px' }}>A seguir</div>
                <div style={{ fontFamily: 'Outfit, sans-serif', fontSize: '18px', fontWeight: 800, color: 'var(--text-primary)', marginBottom: '8px' }}>Camada visual forte</div>
                <div style={{ fontSize: '13px', color: 'var(--text-secondary)', lineHeight: 1.7 }}>Imagens, diagramas, reforço de anatomia e explicações detalhadas com foco em prova.</div>
              </div>
              <div className="about-card">
                <div style={{ fontSize: '12px', fontWeight: 800, letterSpacing: '0.08em', textTransform: 'uppercase', color: '#FCD34D', marginBottom: '8px' }}>Objetivo final</div>
                <div style={{ fontFamily: 'Outfit, sans-serif', fontSize: '18px', fontWeight: 800, color: 'var(--text-primary)', marginBottom: '8px' }}>Do ciclo básico ao ENAMED</div>
                <div style={{ fontSize: '13px', color: 'var(--text-secondary)', lineHeight: 1.7 }}>Acompanhar o aluno por toda a graduação com treino, revisão e segurança no internato.</div>
              </div>
            </div>
            </div>
          </div>
        </div>
      );
    };

    const MedGradPlusApp = () => {
      const VALID_TABS = ['home', 'cards', 'quiz', 'materials', 'feedback', 'about', 'profile', 'anatomy_hist', 'ambassador'];
      const parseRouteFromHash = () => {
        const raw = window.location.hash.replace(/^#/, '').trim();
        if (raw === 'about-public') {
          return {
            tab: 'about',
            materiaId: null,
            aulaId: null,
            publicOnly: true,
          };
        }
        const [tabRaw, materiaRaw, aulaRaw] = raw.split(':');
        let resolvedTab = tabRaw;
        if (tabRaw === 'anatomy') resolvedTab = 'anatomy_hist';
        if (tabRaw === 'histology') resolvedTab = 'anatomy_hist';
        const tab = VALID_TABS.includes(resolvedTab) ? resolvedTab : 'home';
        let materiaId = materiaRaw ? decodeURIComponent(materiaRaw) : null;
        if (tabRaw === 'anatomy' && !materiaId) materiaId = 'anatomy';
        if (tabRaw === 'histology' && !materiaId) materiaId = 'histology';
        if (tab === 'anatomy_hist' && !materiaId) materiaId = 'anatomy';
        return {
          tab,
          materiaId,
          aulaId: aulaRaw ? decodeURIComponent(aulaRaw) : null,
          publicOnly: false,
        };
      };
      const buildHash = ({ tab, materiaId, aulaId }) => {
        const parts = [tab || 'home'];
        if (tab === 'anatomy_hist') {
          if (materiaId && materiaId !== 'anatomy') parts.push(encodeURIComponent(materiaId));
          if (aulaId) parts.push(encodeURIComponent(aulaId));
          return `#${parts.join(':')}`;
        }
        if (materiaId) parts.push(encodeURIComponent(materiaId));
        if (aulaId) parts.push(encodeURIComponent(aulaId));
        return `#${parts.join(':')}`;
      };
      const initialRoute = parseRouteFromHash();

      const [stage, setStage] = useState('splash'); // splash, auth, app
      const [user, setUser] = useState(null);
      const [routeState, setRouteState] = useState(initialRoute);
      const [currentTab, setCurrentTab] = useState(initialRoute.tab);
      const isAmbassadorUser = !!(user?.ambassadorId || user?.ambassadorVitalicio || user?.couponCode);
      const [darkMode, setDarkMode] = useState(() => {
        const saved = localStorage.getItem('meduni9_theme');
        return saved ? saved !== 'light' : true;
      });

      useEffect(() => {
        document.documentElement.setAttribute('data-theme', darkMode ? 'dark' : 'light');
        localStorage.setItem('meduni9_theme', darkMode ? 'dark' : 'light');
      }, [darkMode]);

      const renderThemeToggle = () => (
        <button
          className="theme-toggle-btn"
          onClick={() => setDarkMode(d => !d)}
          title={darkMode ? 'Modo claro' : 'Modo escuro'}
          aria-label={darkMode ? 'Ativar modo claro' : 'Ativar modo escuro'}
        >
          {darkMode ? (
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
          ) : (
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          )}
        </button>
      );

      const navigateTo = (tab, options = {}) => {
        const resolvedTab = VALID_TABS.includes(tab) ? tab : 'home';
        const materiaIdForAnatomyHist = options.materiaId !== undefined ? options.materiaId : 'anatomy';
        const nextRoute = {
          tab: resolvedTab,
          materiaId: resolvedTab === 'anatomy_hist' ? materiaIdForAnatomyHist : (options.materiaId || null),
          aulaId: options.aulaId || null,
          publicOnly: !!options.publicOnly,
        };
        setRouteState(nextRoute);
        setCurrentTab(nextRoute.tab);
        const nextHash = nextRoute.publicOnly ? '#about-public' : buildHash(nextRoute);
        if (window.location.hash !== nextHash) {
          window.location.hash = nextHash;
        }
      };
      const [materias, setMaterias] = useState([]);
      const [flashcards, setFlashcards] = useState([]);
      const [selectedMateria, setSelectedMateria] = useState(null);
      const [loading, setLoading] = useState(true);
      const [sidebarOpen, setSidebarOpen] = useState(true);

      // Auth state refs (stable across renders, safe in closures)
      const splashDoneRef = useRef(false);
      const authStateRef  = useRef(undefined); // undefined = resolving | null = no user | object = profile

      useEffect(() => {
        const handleHashChange = () => {
          const nextRoute = parseRouteFromHash();
          setRouteState(nextRoute);
          setCurrentTab(nextRoute.tab);
        };
        window.addEventListener('hashchange', handleHashChange);
        return () => window.removeEventListener('hashchange', handleHashChange);
      }, []);

      useEffect(() => {
        if (routeState.tab === 'cards' || routeState.tab === 'quiz' || routeState.tab === 'feedback') {
          setSelectedMateria(routeState.materiaId || null);
        }
      }, [routeState.tab, routeState.materiaId]);

      useEffect(() => {
        if (currentTab === 'ambassador' && !isAmbassadorUser) {
          navigateTo('home');
        }
      }, [currentTab, isAmbassadorUser]);

      const applyResolvedAuth = (profile) => {
        if (profile) { setUser(normalizeUserProfile(profile)); setStage('app'); }
        else          { setStage('auth'); }
      };

      // Firebase Auth listener: resolves well before splash ends (~2400ms)
      useEffect(() => {
        if (!window.__fbAuth || !window.__fbAuthFns || !window.__fbFirestore) {
          // Fallback: Firebase SDK unavailable — use localStorage cache
          const cached = localStorage.getItem('meduni9_user');
          authStateRef.current = cached ? JSON.parse(cached) : null;
          if (splashDoneRef.current) applyResolvedAuth(authStateRef.current);
          return;
        }
        const { onAuthStateChanged, signOut: fbSignOut } = window.__fbAuthFns;
        const unsubscribe = onAuthStateChanged(window.__fbAuth, async (firebaseUser) => {
          if (firebaseUser) {
            let cachedProfile = null;
            try {
              const cached = localStorage.getItem('meduni9_user');
              if (cached) {
                const p = JSON.parse(cached);
                if (p.uid === firebaseUser.uid) cachedProfile = normalizeUserProfile(p);
              }
            } catch {}
            try {
              const p = await loadUserProfile(firebaseUser);
              if (p) {
                const synced = await syncProfileAccessFromCodeEntry(firebaseUser, p);
                const syncedEmail = await syncProfileAccessFromEmailGrant(firebaseUser, synced);
                const qualified = await checkAmbassadorQualification(syncedEmail);
                const normalized = persistLocalUser(qualified);
                authStateRef.current = normalized;
                if (splashDoneRef.current) applyResolvedAuth(qualified);
              } else {
                let grantPending = null;
                try {
                  grantPending = await loadEmailAccessGrant(firebaseUser.email);
                } catch {}
                if (grantPending && isEmailGrantValid(grantPending)) {
                  authStateRef.current = null;
                  if (splashDoneRef.current) applyResolvedAuth(null);
                } else if (cachedProfile) {
                  authStateRef.current = cachedProfile;
                  if (splashDoneRef.current) applyResolvedAuth(cachedProfile);
                } else {
                  try { await fbSignOut(window.__fbAuth); } catch {}
                  authStateRef.current = null;
                  if (splashDoneRef.current) applyResolvedAuth(null);
                }
              }
            } catch {
              authStateRef.current = cachedProfile;
              if (splashDoneRef.current) applyResolvedAuth(cachedProfile);
            }
          } else {
            localStorage.removeItem('meduni9_user');
            authStateRef.current = null;
            if (splashDoneRef.current) applyResolvedAuth(null);
          }
        });
        return () => unsubscribe();
      }, []); // eslint-disable-line

      useEffect(() => {
        // Load data when app starts
        if (stage === 'app' && loading) {
          loadAppData();
        }
      }, [stage, loading]);

      const loadAppData = async () => {
        try {
          // Load data from external JSON files
          const [materiasRes, flashcardsRes, questoesRes] = await Promise.all([
            fetch('data/materias.json').catch(() => null),
            fetch('data/flashcards.json').catch(() => null),
            fetch('data/questoes.json').catch(() => null)
          ]);

          let materiasData = [];
          let flashcardsData = [];

          if (materiasRes && materiasRes.ok) {
            const raw = await materiasRes.json();
            // Convert object format to array with id
            materiasData = Object.entries(raw)
              .filter(([k]) => !k.startsWith('_'))
              .map(([id, val]) => ({ id, ...val, pergunta: val.frente, resposta: val.verso }));
          }

          if (flashcardsRes && flashcardsRes.ok) {
            const raw = await flashcardsRes.json();
            const cards = raw.flashcards || raw;
            flashcardsData = (Array.isArray(cards) ? cards : []).map(c => ({
              ...c,
              pergunta: c.frente || c.pergunta,
              resposta: c.verso || c.resposta
            }));
          }

          let questoesArray = [];
          
          if (questoesRes && questoesRes.ok) {
            const raw = await questoesRes.json();
            const questoes = raw.questoes || raw;
            questoesArray = questoesArray.concat(Array.isArray(questoes) ? questoes : []);
          }

          // Merge questoes as flashcards with quiz format
          if (questoesArray.length > 0) {
            questoesArray.forEach(q => {
              flashcardsData.push({
                id: 'q_' + q.id,
                materia: q.materia,
                pergunta: q.enunciado,
                resposta: q.opcoes && q.correta !== null && q.opcoes[q.correta] ? q.opcoes[q.correta].replace(/^[A-D]\)\s*/, '') : '',
                explicacao: q.explicacao,
                opcoes: q.opcoes || [],
                correta: q.correta,
                tipo: 'quiz',
                tema: q.tema,
                dificuldade: q.dificuldade
              });
            });
          }

          // Fallback if no JSON files loaded
          if (materiasData.length === 0) {
            materiasData = [
              { id: 'sus', nome: 'Princípios e Organização do SUS', sigla: 'SUS', semestre: 1, cor: '#6366F1' },
              { id: 'semiologia1', nome: 'Semiologia Médica 1 — Sistema Locomotor', sigla: 'SEMIO1', semestre: 1, cor: '#C0392B' },
              { id: 'bmf1', nome: 'Bases Morfofuncionais 1 — Sistema Locomotor', sigla: 'BMF1', semestre: 1, cor: '#E85D75' },
              { id: 'pmh', nome: 'Práticas nas Humanidades Médicas', sigla: 'PMH', semestre: 1, cor: '#8B5CF6' },
              { id: 'bmf2', nome: 'Bases Morfofuncionais 2 — Sistema Cardiopulmonar', sigla: 'BMF2', semestre: 2, cor: '#EF4444' },
              { id: 'mad1', nome: 'Mecanismos de Agressão e Defesa 1 — Imunologia', sigla: 'MAD1', semestre: 2, cor: '#F59E0B' },
              { id: 'indicadores', nome: 'Indicadores de Saúde e Epidemiologia', sigla: 'IND', semestre: 2, cor: '#10B981' },
              { id: 'bcm1', nome: 'Bases Moleculares e Celulares', sigla: 'BCM1', semestre: 2, cor: '#4A90E2' },
              { id: 'semiologia2', nome: 'Semiologia Médica 2 — Sistema Cardiopulmonar', sigla: 'SEMIO2', semestre: 2, cor: '#C0392B' },
              { id: 'mad2', nome: 'Mecanismos de Agressão e Defesa 2 — Patologia Geral', sigla: 'MAD2', semestre: 3, cor: '#EF4444' },
            ];
          }

          if (flashcardsData.length === 0) {
            flashcardsData = [
              { id: 'fc1', materia: 'bcm1', frente: 'Como interpretar gasometria com pH=7.28, pCO2=32, HCO3=15?', verso: 'Acidose metabólica com compensação respiratória. pH baixo indica acidemia, HCO3 baixo confirma origem metabólica, pCO2 reduzido mostra hiperventilação compensatória.', tema: 'bcm1_acido_base', dificuldade: 2 },
              { id: 'fc2', materia: 'bcm1', frente: 'Qual molécula regula a fluidez da membrana plasmática?', verso: 'O colesterol. Ele se intercala entre os fosfolipídeos, reduzindo a fluidez em altas temperaturas e impedindo a solidificação em baixas temperaturas.', tema: 'bcm1_membrana', dificuldade: 1 },
              { id: 'fc3', materia: 'bmf1', frente: 'Qual célula é responsável pela síntese de matriz óssea?', verso: 'O osteoblasto. Sintetiza e secreta os componentes orgânicos da matriz óssea (colágeno tipo I e proteoglicanos), participando da mineralização.', tema: 'bmf1_tec_osseo', dificuldade: 1 },
              { id: 'fc4', materia: 'sus', frente: 'Quais são os três princípios doutrinários do SUS?', verso: 'Universalidade (acesso a toda população), equidade (tratamento diferenciado conforme necessidade) e integralidade (atendimento completo de saúde individual e coletiva).', tema: 'SUS Princípios', dificuldade: 1 },
            ];
          }

          setMaterias(materiasData);
          setFlashcards(flashcardsData);
          setLoading(false);
        } catch (error) {
          console.error('Erro ao carregar dados:', error);
          setLoading(false);
        }
      };

      const handleAuthSuccess = (userData) => {
        const normalized = persistLocalUser(userData);
        authStateRef.current = normalized;
        setUser(normalized);
        setStage('app');
      };

      const handleLogout = async () => {
        if (window.__fbAuth && window.__fbAuthFns) {
          try { await window.__fbAuthFns.signOut(window.__fbAuth); } catch {}
        }
        localStorage.removeItem('meduni9_user');
        localStorage.removeItem('meduni9_sr_data');
        localStorage.removeItem('meduni9_quiz_history');
        localStorage.removeItem('meduni9_stats');
        authStateRef.current = null;
        setUser(null);
        setStage('auth');
        setCurrentTab('home');
        window.location.hash = '';
      };

      if (stage === 'splash') {
        return <SplashScreen onComplete={() => {
          splashDoneRef.current = true;
          if (authStateRef.current !== undefined) {
            applyResolvedAuth(authStateRef.current);
          }
          // If still undefined: onAuthStateChanged hasn't fired yet → it will call applyResolvedAuth
        }} />;
      }

      if (stage === 'auth') {
        if (routeState.publicOnly && routeState.tab === 'about') {
          return (
            <div className="about-public-shell">
              <div id="about-public" className="screen-content" style={{
                paddingTop: '24px',
                paddingBottom: '40px',
                paddingLeft: 'max(20px, env(safe-area-inset-left, 0px))',
                paddingRight: 'max(20px, env(safe-area-inset-right, 0px))',
                width: '100%',
                maxWidth: 'none',
                margin: 0,
                boxSizing: 'border-box',
              }}>
                <div style={{ maxWidth: '1080px', margin: '0 auto 18px', width: '100%', display: 'flex', gap: '12px', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap' }}>
                  <div style={{ fontFamily: 'Outfit, sans-serif', fontWeight: 800, color: 'var(--text-primary)', fontSize: '18px' }}>MedGradPlus</div>
                  <div style={{ display: 'flex', gap: '10px', flexWrap: 'wrap' }}>
                    <button className="btn btn-secondary" style={{ width: 'auto', padding: '10px 16px' }} onClick={() => { window.location.hash = ''; const next = { tab: 'home', materiaId: null, aulaId: null, publicOnly: false }; setRouteState(next); setCurrentTab(next.tab); }}>
                      ← Voltar ao login
                    </button>
                    <a href="comprar.html" className="btn btn-primary" style={{ width: 'auto', padding: '10px 16px', textDecoration: 'none', display: 'inline-flex', alignItems: 'center' }}>
                      🎓 Ver planos e preços
                    </a>
                  </div>
                </div>
                <SobreScreen user={{ isGuest: true, plano: 'gratuito' }} onNavigate={() => { window.location.hash = ''; const next = { tab: 'home', materiaId: null, aulaId: null, publicOnly: false }; setRouteState(next); setCurrentTab(next.tab); }} />
              </div>
            </div>
          );
        }
        return <AuthScreen onAuthSuccess={handleAuthSuccess} />;
      }

      if (loading) {
        return (
          <div className="app-container">
            <div className="loading">
              <div className="spinner"></div>
            </div>
          </div>
        );
      }

      const handleChangeSemester = async (newSem) => {
        const parsed = typeof newSem === 'number' ? newSem : parseInt(newSem);
        if (parsed >= 1 && parsed <= 12 && hasModuleAccess(user, parsed)) {
          const updated = normalizeUserProfile({ ...user, semestre: parsed, modulo: parsed });
          setUser(updated);
          persistLocalUser(updated);
          authStateRef.current = updated;
          const currentUser = window.__fbAuth?.currentUser;
          if (currentUser) {
            try { await saveUserProfile(currentUser, updated); } catch {}
          }
        }
      };

      const accessFilteredMaterias = (() => {
        if (isFreeTierUser(user)) {
          const full = materias.find((m) => m.id === FREE_TIER_DEMO.materiaId && m.ativo !== false);
          const sliced = sliceMateriaToFreeDemo(full);
          return sliced ? [sliced] : [];
        }
        return materias.filter((m) => m.ativo !== false && hasModuleAccess(user, m.modulo || m.semestre));
      })();

      const allowedMateriaIds = new Set(accessFilteredMaterias.map((m) => m.id));
      const accessFilteredFlashcards = (() => {
        if (isFreeTierUser(user)) {
          return flashcards.filter(
            (card) =>
              card?.materia === FREE_TIER_DEMO.materiaId &&
              card?.tema === FREE_TIER_DEMO.aulaId
          );
        }
        return flashcards.filter((card) => {
          if (!card?.materia) return false;
          if (allowedMateriaIds.has(card.materia)) return true;
          const fallbackMateria = materias.find((m) => m.id === card.materia);
          return fallbackMateria ? hasModuleAccess(user, fallbackMateria.modulo || fallbackMateria.semestre) : false;
        });
      })();

      const navItems = [
        { id: 'home', label: 'Início', icon: <IconHome /> },
        { id: 'materials', label: 'Materiais', icon: <IconBookOpen /> },
        { id: 'quiz', label: 'Questões', icon: <IconTarget /> },
        { id: 'cards', label: 'Flashcards', icon: <IconLayers /> },
        { id: 'anatomy_hist', label: 'Anat. + Hist.', navTitle: 'Anatomia e histologia', icon: <IconAnatomy /> },
        { id: 'feedback', label: 'Feedback', icon: <IconMessageSquare /> },
        { id: 'about', label: 'Sobre', icon: <IconRocket /> },
        { id: 'profile', label: 'Perfil', icon: <IconUser /> },
      ];
      if (isAmbassadorUser) {
        navItems.splice(7, 0, { id: 'ambassador', label: 'Embaixador', icon: <IconCoupon /> });
      }

      // App UI with desktop sidebar
      return (
        <div className="desktop-layout">
          {/* Desktop Sidebar */}
          <div className={`desktop-sidebar${sidebarOpen ? '' : ' collapsed'}`}>
            <div className="sidebar-logo">
              <span className="sidebar-logo-icon" style={{ display: 'flex', alignItems: 'center' }}><LogoIcon size={30} /></span>
              <span className="sidebar-logo-text">MedGrad<span style={{color:'#00C896',fontWeight:800}}>Plus</span><span style={{fontSize:'0.65em',color:'#00C896',fontWeight:800,verticalAlign:'super',lineHeight:0,marginLeft:'2px'}}>+</span></span>
              <button
                className="sidebar-toggle-btn"
                onClick={() => setSidebarOpen(false)}
                title="Fechar menu"
                style={{ marginLeft: 'auto' }}
              ><IconMenu /></button>
            </div>
            <div className="sidebar-nav">
              {navItems.map(item => (
                <div
                  key={item.id}
                  className={`sidebar-item ${currentTab === item.id ? 'active' : ''}`}
                  title={item.navTitle || undefined}
                  onClick={() => navigateTo(item.id)}
                >
                  {item.icon}
                  <span>{item.label}</span>
                </div>
              ))}
            </div>
            <div className="sidebar-footer">
              <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: '10px' }}>
                <div className="sidebar-user-block" style={{ flex: 1, minWidth: 0 }}>
                  <div className="sidebar-user-avatar">
                    {user.email ? user.email.charAt(0).toUpperCase() : 'U'}
                  </div>
                  <div className="sidebar-user-info">
                    <div className="sidebar-user-name">{user.email ? user.email.split('@')[0] : 'Usuário'}</div>
                    <div className="sidebar-user-meta">{user.campusNome || 'Vergueiro'} · Módulo {user.semestre || user.modulo || 1}</div>
                  </div>
                </div>
                {renderThemeToggle()}
              </div>
            </div>
          </div>

          {/* Main Content */}
          <div className="app-container">
            {!sidebarOpen && (
              <div className="sidebar-open-bar">
                <button
                  className="sidebar-toggle-btn"
                  onClick={() => setSidebarOpen(true)}
                  title="Abrir menu"
                ><IconMenu /></button>
                {renderThemeToggle()}
              </div>
            )}
            {currentTab === 'home' && (
              <DashboardScreen
                user={user}
                materias={accessFilteredMaterias}
                flashcards={accessFilteredFlashcards}
                onSelectMateria={(id) => {
                  setSelectedMateria(id);
                  navigateTo('cards', { materiaId: id });
                }}
              />
            )}

            {currentTab === 'cards' && (
              accessFilteredMaterias.length === 0 ? (
                <div className="screen-content" style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', minHeight: '60vh', textAlign: 'center', padding: '40px 24px' }}>
                  <div style={{ fontSize: '48px', marginBottom: '16px' }}>{isFreeTierUser(user) ? '📭' : '⛔'}</div>
                  <h2 style={{ fontFamily: 'Outfit', fontSize: '22px', color: 'var(--text-primary)', marginBottom: '10px' }}>
                    {isFreeTierUser(user) ? 'Demonstração indisponível' : 'Sem acesso para este conteúdo'}
                  </h2>
                  <p style={{ fontSize: '14px', color: 'var(--text-secondary)', maxWidth: '360px', marginBottom: '24px', lineHeight: 1.6 }}>
                    {isFreeTierUser(user)
                      ? 'Não foi possível carregar a aula de amostra e os flashcards. Verifique sua conexão e atualize a página.'
                      : 'Sua chave atual não libera os módulos com flashcards disponíveis no app. Solicite a atualização da sua chave para o módulo/ciclo desejado.'}
                  </p>
                  <button className="btn btn-secondary" style={{ maxWidth: '280px' }} onClick={() => { window.location.hash = '#home'; navigateTo('home'); }}>
                    Voltar ao início
                  </button>
                </div>
              ) : (
                <FlashcardsScreen
                  flashcards={accessFilteredFlashcards}
                  materias={accessFilteredMaterias}
                  selectedMateria={selectedMateria}
                  onSelectMateria={(materiaId) => {
                    setSelectedMateria(materiaId);
                    navigateTo('cards', { materiaId });
                  }}
                  userSemester={user.semestre}
                  user={user}
                />
              )
            )}

            {currentTab === 'quiz' && (
              accessFilteredMaterias.length === 0 ? (
                <div className="screen-content" style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', minHeight: '60vh', textAlign: 'center', padding: '40px 24px' }}>
                  <div style={{ fontSize: '48px', marginBottom: '16px' }}>{isFreeTierUser(user) ? '📭' : '⛔'}</div>
                  <h2 style={{ fontFamily: 'Outfit', fontSize: '22px', color: 'var(--text-primary)', marginBottom: '10px' }}>
                    {isFreeTierUser(user) ? 'Demonstração indisponível' : 'Sem acesso para este conteúdo'}
                  </h2>
                  <p style={{ fontSize: '14px', color: 'var(--text-secondary)', maxWidth: '360px', marginBottom: '24px', lineHeight: 1.6 }}>
                    {isFreeTierUser(user)
                      ? 'Não foi possível carregar a aula de amostra e o simulado de questões. Verifique sua conexão e atualize a página.'
                      : 'Sua chave atual não libera os módulos com questões disponíveis no app. Solicite a atualização da sua chave para o módulo/ciclo desejado.'}
                  </p>
                  <button className="btn btn-secondary" style={{ maxWidth: '280px' }} onClick={() => { window.location.hash = '#home'; navigateTo('home'); }}>
                    Voltar ao início
                  </button>
                </div>
              ) : (
                <QuizScreen
                  flashcards={accessFilteredFlashcards}
                  materias={accessFilteredMaterias}
                  selectedMateria={selectedMateria}
                  onSelectMateria={(materiaId) => {
                    setSelectedMateria(materiaId);
                    navigateTo('quiz', { materiaId });
                  }}
                  userSemester={user.semestre}
                  user={user}
                />
              )
            )}

            {currentTab === 'materials' && (
              accessFilteredMaterias.length === 0 ? (
                <div className="screen-content" style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', minHeight: '60vh', textAlign: 'center', padding: '40px 24px' }}>
                  <div style={{ fontSize: '48px', marginBottom: '16px' }}>{isFreeTierUser(user) ? '📭' : '⛔'}</div>
                  <h2 style={{ fontFamily: 'Outfit', fontSize: '22px', color: 'var(--text-primary)', marginBottom: '10px' }}>
                    {isFreeTierUser(user) ? 'Demonstração indisponível' : 'Sem acesso para este conteúdo'}
                  </h2>
                  <p style={{ fontSize: '14px', color: 'var(--text-secondary)', maxWidth: '360px', marginBottom: '24px', lineHeight: 1.6 }}>
                    {isFreeTierUser(user)
                      ? 'Não foi possível carregar o material de amostra. Verifique sua conexão e atualize a página.'
                      : 'Sua chave atual não libera os módulos com materiais disponíveis no app. Solicite a atualização da sua chave para o módulo/ciclo desejado.'}
                  </p>
                  <button className="btn btn-secondary" style={{ maxWidth: '280px' }} onClick={() => { window.location.hash = '#home'; navigateTo('home'); }}>
                    Voltar ao início
                  </button>
                </div>
              ) : (
                <MaterialsScreen
                  materias={accessFilteredMaterias}
                  materiasCatalog={materias.filter((m) => m.ativo !== false)}
                  userSemester={user.semestre}
                  initialMateriaId={routeState.materiaId}
                  initialTemaId={routeState.aulaId}
                  onRouteChange={navigateTo}
                  user={user}
                  onNavigateTo={(tab, materiaId) => {
                    if (materiaId) setSelectedMateria(materiaId);
                    navigateTo(tab, { materiaId });
                  }}
                />
              )
            )}

            {currentTab === 'feedback' && (
              <FeedbackScreen currentMateria={selectedMateria} />
            )}

            {currentTab === 'about' && (
              <SobreScreen user={user} onNavigate={(tab, opts) => navigateTo(tab, opts || {})} />
            )}

            {currentTab === 'profile' && (
              <ProfileScreen user={user} onLogout={handleLogout} onChangeSemester={handleChangeSemester} onProfileUpdated={(profile) => {
                const normalized = persistLocalUser(profile);
                authStateRef.current = normalized;
                setUser(normalized);
              }} />
            )}

            {currentTab === 'ambassador' && isAmbassadorUser && (
              <AmbassadorScreen user={user} />
            )}

            {currentTab === 'anatomy_hist' && (
              <AnatomiaHistologiaScreen
                user={user}
                mode={routeState.materiaId === 'histology' ? 'histology' : 'anatomy'}
                onModeChange={(m) => navigateTo('anatomy_hist', { materiaId: m })}
              />
            )}

            {/* Bottom Navigation (mobile only) */}
            <div className="bottom-nav">
              {navItems.map(item => (
                <div
                  key={item.id}
                  className={`nav-item ${currentTab === item.id ? 'active' : ''}`}
                  title={item.navTitle || undefined}
                  onClick={() => navigateTo(item.id)}
                >
                  <div className="nav-icon">{item.icon}</div>
                  <div className="nav-label">{item.label}</div>
                </div>
              ))}
            </div>

          </div>
        </div>
      );
    };

    // Render App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<MedGradPlusApp />);
  </script>
</body>
</html>
