    }
    html[data-theme="light"] .markdown-body pre {
      background: #F8FAFC !important;
      border-color: rgba(0,0,0,0.08) !important;
    }
    html[data-theme="light"] .flow-box {
      background: linear-gradient(140deg, rgba(0,200,150,0.05) 0%, rgba(56,189,248,0.05) 100%) !important;
      border-color: rgba(0,200,150,0.35) !important;
    }
    html[data-theme="light"] .flow-step { color: #1E293B !important; }
    html[data-theme="light"] .flow-vc { color: #059669 !important; }
    html[data-theme="light"] .flow-ha { color: #059669 !important; }
    html[data-theme="light"] .flow-vc-note { color: #64748B !important; }
    html[data-theme="light"] .flow-label { color: #64748B !important; }
    html[data-theme="light"] .flow-branch-note { color: #64748B !important; }
    html[data-theme="light"] .flow-raw { color: #1E293B !important; }
    html[data-theme="light"] .markdown-body hr { border-top-color: rgba(0,0,0,0.1) !important; }
    html[data-theme="light"] .markdown-body td { color: #334155 !important; }
    html[data-theme="light"] .markdown-body .table-wrap {
      background: rgba(240,249,255,0.8) !important;
      border-color: rgba(0,200,150,0.2) !important;
    }
    html[data-theme="light"] .markdown-body thead tr {
      background: rgba(0,200,150,0.1) !important;
    }
    html[data-theme="light"] .markdown-body tbody tr:nth-child(even) {
      background: rgba(0,0,0,0.02) !important;
    }
    html[data-theme="light"] .md-breadcrumb .bc-item { color: #64748B !important; }
    html[data-theme="light"] .md-breadcrumb .bc-sep { color: #94A3B8 !important; }
    html[data-theme="light"] .md-meta-pill { color: #0369A1 !important; }

    /* ── Markdown Reader ───────────────────────────────────────── */
    .markdown-body {
      font-family: 'Lexend', 'DM Sans', sans-serif;
      font-weight: 300;
      font-size: 1.0625rem;
      line-height: 1.75;
      color: #D1D9E6;
      user-select: text;
      -webkit-user-select: text;
    }

    /* Headings */
    .markdown-body h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 1.55rem;
      font-weight: 800;
      text-align: center;
      background: linear-gradient(135deg, #F1F5F9 0%, #38BDF8 55%, #00C896 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin: 6px 0 4px;
      padding-bottom: 14px;
      border-bottom: 2px solid rgba(0,200,150,0.25);
      line-height: 1.3;
      letter-spacing: -0.02em;
    }

    /* Breadcrumb linha gerada via JS */
    .md-breadcrumb {
      text-align: center;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.72rem;
      color: #475569;
      margin: 0 0 2px;
      letter-spacing: 0.02em;
    }
    .md-breadcrumb .bc-item { color: #475569; font-weight: 500; }
    .md-breadcrumb .bc-item.current { color: #00C896; font-weight: 600; }
    .md-breadcrumb .bc-sep { color: #334155; margin: 0 5px; }

    /* Metadata pills geradas via JS */
    .md-meta {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 6px;
      margin: 8px 0 20px;
    }
    .md-meta-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: rgba(0,200,150,0.1);
      border: 1px solid rgba(0,200,150,0.2);
      border-radius: 20px;
      padding: 4px 12px;
      font-size: 0.84rem;
      color: #7DD3FC;
      font-family: 'DM Sans', sans-serif;
      font-weight: 500;
    }
    .markdown-body h2 {
      font-family: 'Outfit', sans-serif;
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--mint, #00C896);
      margin: 1.7rem 0 0.65rem;
      padding-left: 12px;
      border-left: 3px solid var(--mint, #00C896);
      line-height: 1.32;
    }
    .markdown-body h3 {
      font-family: 'Outfit', sans-serif;
      font-size: 1.14rem;
      font-weight: 600;
      color: #38BDF8;
      margin: 1.2rem 0 0.5rem;
      line-height: 1.38;
    }
    .markdown-body h4 {
      font-size: 1.02rem;
      font-weight: 600;
      color: #7DD3FC;
      margin: 1rem 0 0.35rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    /* Paragraphs & text */
    .markdown-body p { margin: 0 0 0.85em; }
    .markdown-body strong {
      font-family: 'DM Sans', sans-serif;
      font-weight: 700;
      color: #FFFFFF;
    }
    .markdown-body em { color: #94A3B8; font-style: italic; }

    /* Lists */
    .markdown-body ul, .markdown-body ol {
      padding-left: 1.3em;
      margin: 0.5em 0 0.9em;
    }
    .markdown-body li { margin: 0.35em 0; }
    .markdown-body ul li::marker { color: var(--mint, #00C896); }
    .markdown-body ol li::marker { color: var(--mint, #00C896); font-weight: 600; }
    .markdown-body li > ul, .markdown-body li > ol { margin: 0.2em 0 0.3em; }

    /* Blockquote — destaque / nota importante */
    .markdown-body blockquote {
      border-left: 3px solid #00C896;
      margin: 1em 0;
      padding: 10px 14px;
      background: rgba(0, 200, 150, 0.07);
      border-radius: 0 8px 8px 0;
      color: #94A3B8;
      font-style: italic;
    }
    .markdown-body blockquote p { margin: 0; }

    /* Inline code */
    .markdown-body code {
      background: rgba(0, 200, 150, 0.12);
      border: 1px solid rgba(0, 200, 150, 0.2);
      border-radius: 4px;
      padding: 1px 6px;
      font-size: 0.82em;
      font-family: 'Courier New', monospace;
      color: #67E8F9;
    }

    /* Code block */
    .markdown-body pre {
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px;
      padding: 14px 16px;
      overflow-x: auto;
      margin: 1em 0;
    }
    .markdown-body pre code {
      background: none;
      border: none;
      padding: 0;
      font-size: 0.83rem;
      color: #A5F3FC;
    }

    /* ── Flow Diagram Visual Components ─────────────────────── */
    .flow-box {
      position: relative;
      background: linear-gradient(140deg, rgba(0,200,150,0.07) 0%, rgba(56,189,248,0.07) 100%);
      border: 1px solid rgba(0,200,150,0.3);
      border-radius: 14px;
      padding: 38px 18px 20px;
      margin: 1.4em 0;
      overflow-x: auto;
    }
    .flow-box::before {
      content: "FLUXO";
      position: absolute;
      top: 10px; left: 14px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.58rem; font-weight: 700;
      letter-spacing: 0.14em;
      color: #00C896;
      background: rgba(0,200,150,0.12);
      border: 1px solid rgba(0,200,150,0.3);
      border-radius: 20px;
      padding: 2px 9px;
    }
    /* Shared step box */
    .flow-step {
      display: inline-flex; align-items: center; justify-content: center;
      padding: 7px 15px;
      border: 1.5px solid; border-radius: 9px;
      font-family: 'DM Sans', sans-serif; font-size: 0.82rem; font-weight: 600;
      text-align: center; line-height: 1.35; flex-shrink: 0;
    }
    .flow-step-dim { opacity: 0.72; border-style: dashed !important; }
    /* Vertical flow */
    .flow-v {
      display: flex; flex-direction: column;
      align-items: center; gap: 3px; padding: 4px 0;
    }
    .flow-v .flow-step { min-width: 200px; max-width: 90%; white-space: normal; }
    .flow-vc {
      color: #00C896; font-size: 1.35rem; line-height: 1.5;
      text-align: center; user-select: none;
    }
    .flow-vc-note {
      font-family: 'DM Sans', sans-serif; font-size: 0.74rem;
      color: #475569; text-align: center; line-height: 1.8;
    }
    .flow-vc-note span { color: #7DD3FC; }
    /* Horizontal flow */
    .flow-h {
      display: flex; flex-wrap: wrap;
      align-items: center; justify-content: center;
      gap: 5px; padding: 4px 0;
    }
    .flow-ha {
      color: #00C896; font-size: 1.05rem; font-weight: 700;
      flex-shrink: 0; padding: 0 1px; user-select: none;
    }
    /* Gene structure */
    .flow-gene .flow-step { font-size: 0.76rem; padding: 5px 11px; }
    .flow-gene .flow-ha { color: #475569; font-weight: 400; font-size: 0.85rem; }
    .flow-label {
      font-family: 'DM Sans', sans-serif; font-size: 0.8rem;
      color: #94A3B8; padding: 0 3px;
    }
    /* Branch annotation */
    .flow-branch {
      margin-top: 12px; padding-top: 10px;
      border-top: 1px dashed rgba(148,163,184,0.2);
      display: flex; flex-direction: column; align-items: center; gap: 5px;
    }
    .flow-branch-arr { color: #00C896; font-size: 1.2rem; line-height: 1.4; }
    .flow-branch-note {
      font-family: 'DM Sans', sans-serif; font-size: 0.77rem;
      color: #94A3B8; text-align: center;
    }
    .flow-branch-note .fba { color: #00C896; font-weight: 700; }
    .flow-step-branch { font-size: 0.79rem; }
    /* Raw fallback */
    .flow-raw {
      font-family: 'Lexend', 'DM Sans', sans-serif; font-size: 0.84rem;
      color: #E2E8F0; text-align: center; line-height: 1.9; white-space: pre-wrap;
    }

    /* Horizontal rule */
    .markdown-body hr {
      border: none;
      border-top: 1px solid rgba(255,255,255,0.1);
      margin: 1.5em 0;
    }

    /* Tables */
    .markdown-body .table-wrap {
      overflow-x: auto;
      border-radius: 10px;
      border: 1px solid rgba(0, 200, 150, 0.25);
      margin: 1.2em 0;
      background: rgba(255,255,255,0.04);
      box-shadow: 0 2px 12px rgba(0,0,0,0.2), inset 0 1px 0 rgba(0,200,150,0.08);
    }
    .markdown-body table {
      width: max-content;
      min-width: 100%;
      max-width: none;
      table-layout: auto;
      border-collapse: collapse;
      font-size: 0.98rem;
    }
    .markdown-body thead tr {
      background: rgba(0, 200, 150, 0.18);
      border-bottom: 2px solid rgba(0, 200, 150, 0.35);
    }
    .markdown-body th {
      padding: 10px 14px;
      font-weight: 600;
      color: #E2E8F0;
      text-align: left;
      white-space: nowrap;
      font-size: 0.92rem;
      letter-spacing: 0.02em;
      text-transform: none;
      word-break: normal;
      overflow-wrap: normal;
      hyphens: none;
    }
    .markdown-body td {
      padding: 9px 14px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      color: #CBD5E1;
      line-height: 1.5;
      white-space: normal;
      word-break: normal;
      overflow-wrap: normal;
      hyphens: none;
    }
    .markdown-body tbody tr:nth-child(even) { background: rgba(255,255,255,0.03); }
    .markdown-body tbody tr:last-child td { border-bottom: none; }
    .markdown-body tbody tr:hover { background: rgba(0, 200, 150, 0.07); transition: background 0.15s; }

    /* Checklist interativo */
    .markdown-body input[type="checkbox"] {
      accent-color: #00C896;
      cursor: pointer;
      width: 15px;
      height: 15px;
      vertical-align: middle;
      margin-right: 6px;
      flex-shrink: 0;
    }
    .markdown-body li:has(input[type="checkbox"]) {
      list-style: none;
      margin-left: -1.3em;
      display: flex;
      align-items: flex-start;
      gap: 2px;
      padding: 3px 0;
      border-radius: 6px;
      transition: background 0.15s;
    }
    .markdown-body li:has(input[type="checkbox"]:checked) {
      color: #475569;
      text-decoration: line-through;
      text-decoration-color: #334155;
    }

    /* Pré-Prova amber headings override */
    .markdown-body.preprova-content h2 {
      color: #FCD34D;
      border-left-color: #F59E0B;
    }
    html[data-theme="light"] .markdown-body.preprova-content h2 {
      color: #FCD34D !important;
      border-left-color: #F59E0B !important;
    }
    .markdown-body.preprova-content h3 { color: #FBBF24; }
    .markdown-body.preprova-content ul li::marker { color: #F59E0B; }
    .markdown-body.preprova-content blockquote {
      border-left-color: #F59E0B;
      background: rgba(245,158,11,0.07);
    }

    /* Profile Screen */
    .profile-avatar {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary), var(--purple));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: 700;
      font-family: 'Outfit', sans-serif;
      color: #fff;
      margin: 0 auto 8px;
      box-shadow: 0 4px 16px rgba(0, 200, 150, 0.3);
    }

    .profile-name {
      font-size: 18px;
      font-weight: 700;
      color: var(--text-primary);
      text-align: center;
      margin-bottom: 4px;
      font-family: 'Outfit', sans-serif;
    }

    .profile-meta {
      font-size: 13px;
      color: var(--text-secondary);
      text-align: center;
      margin-bottom: 24px;
    }

    .profile-section {
      background: var(--surface-2);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: var(--shadow-sm);
    }

    .profile-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 11px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .profile-item:last-child {
      border-bottom: none;
    }

    .profile-label {
      font-size: 12px;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 600;
    }

    .profile-value {
      font-size: 14px;
      color: var(--text-primary);
      font-weight: 600;
      word-break: break-all;
      text-align: right;
    }

    .profile-value-small {
      font-size: 11px;
      font-family: 'Courier New', monospace;
      color: var(--text-secondary);
    }

    .profile-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 16px;
    }

    .profile-stat {
      background: var(--surface-2);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      padding: 14px 12px;
      text-align: center;
      box-shadow: var(--shadow-sm);
    }

    .profile-stat-icon {
      font-size: 18px;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .profile-stat-value {
      font-size: 22px;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 4px;
      font-family: 'Outfit', sans-serif;
    }

    .profile-stat-label {
      font-size: 10px;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 600;
    }

    /* Dica instalar PWA (iOS Safari / Android Chrome) — só monta no JS em mobile */
    .app-install-hint {
      display: flex;
      flex-direction: column;
      gap: 10px;
      position: fixed;
      left: 12px;
      right: 12px;
      bottom: calc(16px + env(safe-area-inset-bottom, 0px));
      max-width: 420px;
      margin: 0 auto;
      z-index: 110;
      padding: 12px 12px 10px;
      border-radius: 14px;
      width: auto;
      background: rgba(15, 23, 42, 0.97);
      border: 1px solid rgba(0, 200, 150, 0.38);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
      font-size: 11px;
      line-height: 1.5;
      color: var(--text-primary, #E8EBF0);
    }

    html[data-theme="light"] .app-install-hint {
      background: rgba(255, 255, 255, 0.97);
      border-color: rgba(0, 200, 150, 0.28);
      box-shadow: 0 10px 36px rgba(0, 0, 0, 0.12);
    }

    .app-install-hint__row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }

    .app-install-hint__text {
      flex: 1;
      min-width: 0;
    }

    .app-install-hint__text strong {
      color: var(--primary, #00C896);
      font-weight: 700;
    }

    .app-install-hint__close {
      flex-shrink: 0;
      width: 30px;
      height: 30px;
      border: none;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-secondary);
      font-size: 15px;
      line-height: 1;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .app-install-hint__close:hover {
      background: rgba(255, 255, 255, 0.12);
    }

    html[data-theme="light"] .app-install-hint__close {
      background: rgba(0, 0, 0, 0.06);
    }

    .app-install-hint__never {
      width: 100%;
      padding: 9px 12px;
      border-radius: 10px;
      border: 1px solid rgba(148, 163, 184, 0.35);
      background: rgba(255, 255, 255, 0.04);
      color: var(--text-secondary);
      font-size: 11px;
      font-weight: 600;
      font-family: 'DM Sans', sans-serif;
      cursor: pointer;
      transition: border-color 0.15s ease, color 0.15s ease, background 0.15s ease;
    }

    .app-install-hint__never:hover {
      border-color: rgba(0, 200, 150, 0.45);
      color: var(--primary, #00C896);
      background: rgba(0, 200, 150, 0.08);
    }

    html[data-theme="light"] .app-install-hint__never {
      background: rgba(248, 250, 252, 0.9);
      border-color: rgba(0, 0, 0, 0.1);
    }

    /* Loading */
    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--border-card);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Semester Selector */
    .semester-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 24px;
    }

    .semester-btn {
      padding: 14px 8px;
      border: 2px solid var(--border-card);
      border-radius: 12px;
      background: var(--bg-card);
      color: var(--text-secondary);
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
      min-height: auto;
      text-transform: none;
      letter-spacing: 0;
    }

    .semester-btn:hover {
      border-color: var(--primary);
      color: var(--primary);
      background: rgba(0, 200, 150, 0.08);
      transform: none;
      box-shadow: none;
    }

    .semester-btn.selected {
      border-color: var(--primary);
      background: rgba(0, 200, 150, 0.15);
      color: var(--primary);
    }

    .institution-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 16px;
    }

    .institution-card {
      border: 1px solid var(--border-card);
      border-radius: 14px;
      padding: 14px;
      background: var(--bg-card);
      cursor: pointer;
      transition: all 0.2s ease;
      min-height: 92px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 8px;
    }

    .institution-card:hover {
      border-color: var(--primary);
      background: rgba(0, 200, 150, 0.08);
    }

    .institution-card.selected {
      border-color: var(--primary);
      background: rgba(0, 200, 150, 0.12);
      box-shadow: 0 0 0 1px rgba(0, 200, 150, 0.15) inset;
    }

    .institution-card.disabled {
      opacity: 0.5;
      cursor: not-allowed;
      filter: grayscale(0.15);
    }

    .institution-name {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1.3;
    }

    .institution-meta {
      font-size: 11px;
      color: var(--text-secondary);
      line-height: 1.4;
    }

    .institution-badge {
      display: inline-flex;
      align-items: center;
      width: fit-content;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      border-radius: 999px;
      padding: 4px 8px;
      background: rgba(0, 200, 150, 0.15);
      color: var(--primary);
    }

    .institution-badge.soon {
      background: rgba(255,255,255,0.08);
      color: var(--text-secondary);
    }

    .institution-helper {
      font-size: 12px;
      color: var(--text-secondary);
      margin-bottom: 12px;
      line-height: 1.5;
    }

    /* Auth cadastro passo 3: grids mais compactos para caber na viewport */
    .auth-institution-step .institution-grid {
      gap: 8px;
      margin-bottom: 10px;
    }
    .auth-institution-step .institution-card {
      min-height: 72px;
      padding: 10px 11px;
      border-radius: 12px;
      gap: 6px;
    }
    .auth-institution-step .institution-name {
      font-size: 13px;
    }
    .auth-institution-step .institution-meta {
      font-size: 10px;
      line-height: 1.35;
    }
    .auth-institution-step .institution-badge {
      font-size: 9px;
      padding: 3px 7px;
    }
    .auth-institution-step .institution-helper {
      margin-bottom: 8px;
    }

    /* Semester group headers in subject lists */
    .semester-group-header {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 1px;
      padding: 16px 0 8px;
      border-bottom: 1px solid var(--border-card);
      margin-bottom: 12px;
    }

    .semester-group-header:first-child {
      padding-top: 0;
    }

    /* Subject selection list (cleaner version) */
    .subject-select-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .subject-select-card {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px;
      background: var(--surface-2);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      cursor: pointer;
      transition: background var(--duration-fast) ease, border-color var(--duration-fast) ease, transform var(--duration-fast) var(--ease-spring), box-shadow var(--duration-fast) ease;
      box-shadow: var(--shadow-sm);
      min-height: 56px;
    }

    .subject-select-card:active {
      border-color: var(--primary);
      background: rgba(0, 200, 150, 0.08);
      transform: scale(0.98);
      box-shadow: none;
    }

    @media (hover: hover) {
      .subject-select-card:hover {
        border-color: var(--border-strong);
        background: var(--surface-3);
      }
    }

    /* Multi-select tema states */
    .subject-select-card.tema-selected {
      background: rgba(0, 200, 150, 0.10);
      border-color: var(--primary);
    }
    .tema-checkbox {
      width: 22px;
      height: 22px;
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 700;
      color: #fff;
      flex-shrink: 0;
      transition: background var(--duration-fast) ease, border-color var(--duration-fast) ease;
    }
    .tema-checkbox-checked {
      background: var(--primary);
      border-color: var(--primary);
    }

    /* Sticky bar de início */
    .tema-start-bar {
      position: sticky;
      bottom: 0;
      background: rgba(10, 22, 40, 0.94);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 10px;
      gap: 12px;
      animation: screenFadeIn 0.2s var(--ease-spring);
      box-shadow: 0 -8px 22px rgba(0, 0, 0, 0.22);
    }

    .subject-select-icon {
      width: 42px;
      height: 42px;
      border-radius: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }

    .subject-select-icon svg {
      width: 20px;
      height: 20px;
      stroke-width: 2;
    }

    .subject-select-info { flex: 1; min-width: 0; }

    .subject-select-name {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .subject-select-meta {
      font-size: 12px;
      color: var(--text-secondary);
    }

    /* Progress bar within subject card */
    .subject-progress-bar {
      height: 3px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 2px;
      margin-top: 6px;
      overflow: hidden;
    }

    .subject-progress-fill {
      height: 100%;
      border-radius: 2px;
      transition: width 600ms var(--ease-spring);
    }

    /* Search icon SVG */
    .subject-search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-secondary);
      pointer-events: none;
      display: flex;
      align-items: center;
      line-height: 0;
    }

    /* Semester tab filter */
    .semester-tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 20px;
      overflow-x: auto;
      padding-bottom: 4px;
      -webkit-overflow-scrolling: touch;
    }

    .semester-tabs::-webkit-scrollbar { display: none; }

    .semester-tab {
      padding: 8px 14px;
      border-radius: 20px;
      border: 1px solid var(--border-card);
      background: transparent;
      color: var(--text-secondary);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
      min-height: auto;
      text-transform: none;
      letter-spacing: 0;
    }

    .semester-tab:hover {
      transform: none;
      box-shadow: none;
    }

    .semester-tab.active {
      background: var(--primary);
      color: #000;
      border-color: var(--primary);
    }

    /* Back button */
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: none;
      border: none;
      color: var(--primary);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      padding: 8px 0;
      margin-bottom: 16px;
      text-transform: none;
      letter-spacing: 0;
      min-height: auto;
    }

    .back-btn:hover {
      background: none;
      transform: none;
      box-shadow: none;
      opacity: 0.8;
    }

    /* Utilities */
    .hidden {
      display: none !important;
    }

    .mt-2 { margin-top: 16px; }
    .mt-4 { margin-top: 24px; }
    .mb-2 { margin-bottom: 16px; }
    .mb-4 { margin-bottom: 24px; }

    .text-center { text-align: center; }

    /* Responsive */
    @media (max-height: 600px) {
      .screen-content {
        padding: 16px 12px calc(24px + env(safe-area-inset-bottom, 0px)) 12px;
      }

      .stat-card {
        padding: 12px;
      }

      .stat-value {
        font-size: 18px;
      }
    }

    /* Atlas: áreas invisíveis sobre alfinetes da foto — só foco visível para teclado */
    .atlas-pin-hitbox {
      outline: none;
    }
    .atlas-pin-hitbox:focus-visible {
      outline: 2px solid var(--primary, #00C896);
      outline-offset: 2px;
      border-radius: 4px;
    }

    /* Anatomia + Histologia: toolbar não pode usar .screen-content (flex:1), senão divide a altura com o ecrã abaixo */
    .anatomy-hist-toolbar {
      flex-shrink: 0;
      padding: 8px 16px 0;
    }
    @media (min-width: 1024px) {
      .desktop-layout .anatomy-hist-toolbar {
        padding: 8px 40px 0;
      }
    }

    /* Screen content transition */
    .screen-content {
      animation: screenFadeIn 200ms var(--ease-spring);
    }

    @keyframes screenFadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Sidebar improvements */
    .sidebar-footer {
      padding: 12px 16px;
      border-top: 1px solid var(--border-subtle);
    }

    .sidebar-user-block {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 12px;
      background: var(--surface-1);
      border: 1px solid var(--border-subtle);
    }

    .sidebar-user-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary), var(--purple));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 700;
      color: #fff;
      flex-shrink: 0;
      font-family: 'Outfit', sans-serif;
    }

    .sidebar-user-info {
      flex: 1;
      min-width: 0;
    }

    .sidebar-user-name {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .sidebar-user-meta {
      font-size: 11px;
      color: var(--text-secondary);
    }

    /* Responsive: reduced motion */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }

    /* Print */
    @media print {
      body {
        background: white;
        color: black;
      }
    }

    /* ===================== Feedback FAB ===================== */
    .feedback-panel {
      background: var(--bg-dark, #1E2433);
      border: 1px solid rgba(0,200,150,0.25);
      border-radius: 18px;
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
      padding: 24px 20px 24px;
    }

    .feedback-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 400;
      display: flex; align-items: flex-end; justify-content: center;
      padding: 0 0 env(safe-area-inset-bottom, 0) 0;
      animation: fadeIn 0.2s ease;
    }
    @media (min-width: 600px) {
      .feedback-overlay { align-items: center; }
    }
    .feedback-modal {
      background: var(--bg-dark, #1E2433);
      border: 1px solid rgba(0,200,150,0.25);
      border-radius: 18px 18px 0 0;
      width: 100%;
      max-width: 520px;
      padding: 24px 20px 32px;
      animation: slideUp 0.25s ease;
    }
    @media (min-width: 600px) {
      .feedback-modal { border-radius: 18px; }
    }
    @keyframes slideUp {
      from { transform: translateY(40px); opacity: 0; }
      to   { transform: translateY(0);   opacity: 1; }
    }

    /* ── About/Sobre screen animations ───────────────── */
    @keyframes aboutFadeUp {
      from { opacity: 0; transform: translate3d(0, 20px, 0); }
      to   { opacity: 1; transform: translate3d(0, 0, 0); }
    }
    @keyframes aboutScaleIn {
      from { opacity: 0; transform: scale(0.92); }
      to   { opacity: 1; transform: scale(1); }
    }
    @keyframes aboutPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    @keyframes aboutGlow {
      0%, 100% { box-shadow: 0 0 20px rgba(0,200,150,0.15); }
      50% { box-shadow: 0 0 40px rgba(0,200,150,0.35), 0 0 80px rgba(0,200,150,0.1); }
    }
    @keyframes aboutFloat {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes aboutShimmer {
      0% { background-position: -200% center; }
      100% { background-position: 200% center; }
    }
    @keyframes aboutCountUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes aboutGradientMove {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .about-hero-badge {
      display: inline-flex; align-items: center; gap: 6px;
      background: rgba(0,200,150,0.12); border: 1px solid rgba(0,200,150,0.25);
      border-radius: 20px; padding: 6px 14px; font-size: 11px; font-weight: 700;
      color: #00C896; letter-spacing: 0.5px; text-transform: uppercase;
    }
    .about-card {
      background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px; padding: 24px 20px; transition: all 0.3s var(--ease-spring);
      position: relative; overflow: hidden;
    }
    .about-card:hover {
      background: rgba(255,255,255,0.07); border-color: rgba(0,200,150,0.2);
      transform: translateY(-2px); box-shadow: 0 8px 32px rgba(0,200,150,0.1);
    }
    .about-card::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
      background: linear-gradient(90deg, transparent, var(--primary), transparent);
      opacity: 0; transition: opacity 0.3s;
    }
    .about-card:hover::before { opacity: 1; }
    .about-stat-card {
      text-align: center; padding: 20px 12px;
      background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
      border-radius: 14px; animation: aboutCountUp 0.6s ease both;
    }
    .about-feature-icon {
      width: 48px; height: 48px; border-radius: 14px; display: flex;
      align-items: center; justify-content: center; font-size: 12px;
      font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase;
      flex-shrink: 0;
    }
    .about-roadmap-item {
      display: flex; gap: 14px; align-items: flex-start; padding: 16px 0;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .about-roadmap-item:last-child { border-bottom: none; }
    .about-roadmap-dot {
      width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; margin-top: 4px;
      box-shadow: 0 0 8px currentColor;
    }
    .about-section-title {
      font-family: Outfit, sans-serif; font-size: 18px; font-weight: 800;
      color: var(--text-primary); margin-bottom: 16px;
      display: flex; align-items: center; gap: 10px;
    }
    .about-cta-btn {
      display: inline-flex; align-items: center; gap: 8px;
      background: linear-gradient(135deg, #00C896, #00A87A); color: #fff;
      font-family: Outfit, sans-serif; font-weight: 700; font-size: 15px;
      padding: 14px 32px; border-radius: 14px; border: none; cursor: pointer;
      box-shadow: 0 4px 20px rgba(0,200,150,0.3); transition: all 0.3s var(--ease-spring);
    }
    .about-cta-btn:hover {
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 8px 32px rgba(0,200,150,0.4);
    }

    html[data-theme="light"] .about-card {
      background: rgba(0,0,0,0.03); border-color: rgba(0,0,0,0.08);
    }
    html[data-theme="light"] .about-card:hover {
      background: rgba(0,0,0,0.05); box-shadow: 0 8px 32px rgba(0,200,150,0.08);
    }
    html[data-theme="light"] .about-stat-card {
      background: rgba(0,0,0,0.03); border-color: rgba(0,0,0,0.08);
    }

    .feedback-modal h3 {
      font-size: 17px; font-weight: 700;
      color: var(--text-primary); margin-bottom: 4px;
    }
    .feedback-modal p { font-size: 13px; color: var(--text-secondary); margin-bottom: 18px; }
    .feedback-label { font-size: 12px; font-weight: 600; color: var(--text-secondary); margin-bottom: 6px; display: block; }
    .feedback-select, .feedback-textarea {
      width: 100%; background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.12); border-radius: 10px;
      color: var(--text-primary); font-family: inherit; font-size: 14px;
      padding: 10px 12px; margin-bottom: 14px;
      -webkit-user-select: auto; user-select: auto;
    }
    .feedback-select option { background: var(--bg-dark, #1E2433); }
    .feedback-textarea { resize: none; height: 110px; }
    .feedback-char-counter { font-size: 11px; color: var(--text-secondary); text-align: right; margin-top: -10px; margin-bottom: 14px; }
    .feedback-actions { display: flex; gap: 10px; margin-top: 4px; }
    .feedback-btn {
      flex: 1; padding: 12px; border-radius: 10px; border: none;
      font-size: 14px; font-weight: 600; cursor: pointer; transition: opacity 0.2s;
    }
    .feedback-btn:active { opacity: 0.75; }
    .feedback-btn-primary { background: linear-gradient(135deg,#00C896,#0077B6); color: #fff; }
    .feedback-btn-secondary { background: rgba(255,255,255,0.08); color: var(--text-primary); }

<body>
  <div id="root"></div>
  <div id="updateBanner" class="update-banner" role="status" aria-live="polite">
    <span>Atualização disponível.</span>
    <button id="updateBannerBtn" type="button">Atualizar</button>
  </div>

  <!-- Service Worker: registro + limpeza de SWs antigos de deploys anteriores -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        var refreshing = false;

        function showUpdateBanner(registration) {
          var banner = document.getElementById('updateBanner');
          var btn = document.getElementById('updateBannerBtn');
          if (!banner || !btn || !registration || !registration.waiting) return;
          banner.style.display = 'flex';
          btn.onclick = function() {
            try {
              registration.waiting.postMessage({ type: 'SKIP_WAITING' });
            } catch (e) {
              window.location.reload();
            }
          };
        }

        // Limpar SWs de versões anteriores registrados em paths diferentes
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          registrations.forEach(function(reg) {
            var url = reg.active ? reg.active.scriptURL : (reg.installing ? reg.installing.scriptURL : '');
            if (!url.endsWith('/sw.js')) reg.unregister();
          });
        });

        // Registrar SW atual
        navigator.serviceWorker.register('/sw.js').then(function(registration) {
          if (registration.waiting) {
            showUpdateBanner(registration);
          }
          registration.addEventListener('updatefound', function() {
            var newWorker = registration.installing;
            if (!newWorker) return;
            newWorker.addEventListener('statechange', function() {
              if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                showUpdateBanner(registration);
              }
            });
          });
        }).catch(function(err) {
          console.warn('MedGrad+: SW registration failed:', err);
        });

        // Recarregar apenas depois de o usuário clicar em "Atualizar"
        navigator.serviceWorker.addEventListener('controllerchange', function() {
          if (refreshing) return;
          refreshing = true;
          window.location.reload();
        });

      });
    }
  </script>

  <!-- Firebase client config (um ficheiro só — ver MIGRACAO_FIREBASE.md) -->
  <script src="firebase-config.js"></script>
  <!-- Firebase SDK (Auth + Firestore + Analytics) -->
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
    import { getFirestore, collection, addDoc, doc, getDoc, setDoc, getDocs, query, where, updateDoc, deleteDoc } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut, sendPasswordResetEmail, updateProfile } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
    import { getAnalytics, isSupported } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-analytics.js';

    const _fbConfig = window.__FIREBASE_CLIENT_CONFIG__;
    if (!_fbConfig || !_fbConfig.apiKey) {
      console.error('[Firebase] Falta firebase-config.js ou apiKey.');
    }
    const _fbApp  = initializeApp(_fbConfig);
    const _db     = getFirestore(_fbApp);
    const _auth   = getAuth(_fbApp);
    const _gprov  = new GoogleAuthProvider();

    isSupported()
      .then((yes) => {
        if (yes && _fbConfig.measurementId) {
          window.__fbAnalytics = getAnalytics(_fbApp);
        }
      })
      .catch(() => {});

    // Expor para o React (type=text/babel não é module, usa window)
    window.__fbAddFeedback = async (payload) => {
      return addDoc(collection(_db, 'feedback'), payload);
    };
    window.__fbAuth            = _auth;
    window.__fbDb              = _db;
    window.__fbGoogleProvider  = _gprov;
    window.__fbFirestore       = { doc, getDoc, setDoc, collection, addDoc, getDocs, query, where, updateDoc, deleteDoc };
    window.__fbAuthFns         = {
      createUserWithEmailAndPassword,
      signInWithEmailAndPassword,
      signInWithPopup,
      onAuthStateChanged,
      signOut,
      sendPasswordResetEmail,
      updateProfile,
    };
  </script>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@4.3.0/marked.min.js"></script>
  <script>
    window.onerror = function(msg, src, line, col, err) {
      document.getElementById('root').innerHTML =
        '<div style="color:#FCA5A5;padding:24px;font-family:monospace;font-size:13px;background:#1a0a0a;position:fixed;top:0;left:0;right:0;z-index:9999;white-space:pre-wrap;max-height:50vh;overflow:auto">' +
        '<b>ERRO JS:</b>\n' + msg + '\n\nArquivo: ' + src + '\nLinha: ' + line + ':' + col +
        (err ? '\n\n' + err.stack : '') + '</div>';
    };
  </script>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback, useMemo } = React;

    // ===================== Flow diagram parser =====================
    function buildFlowHTML(raw) {
      const COLORS = ['#00C896','#38BDF8','#A78BFA','#34D399','#FB923C','#F472B6'];
      function rgb(hex) {
        return [parseInt(hex.slice(1,3),16), parseInt(hex.slice(3,5),16), parseInt(hex.slice(5,7),16)];
      }
      function stepStyle(i, overrideColor) {
        const c = overrideColor || COLORS[i % COLORS.length];
        const [r,g,b] = rgb(c);
        return `border-color:${c};background:rgba(${r},${g},${b},0.13);color:${c}`;
      }
      function mkStep(text, idx, extra) {
        const plus = text.startsWith('+');
        const label = plus ? text.slice(1).trim() : text;
        const cls = 'flow-step' + (plus ? ' flow-step-dim' : '') + (extra || '');
        return `<div class="${cls}" style="${stepStyle(idx)}">${label}</div>`;
      }

      const lines = raw.split('\n').filter(l => l.trim());
      const trimmed = lines.map(l => l.trim());

      // ── Vertical flow (has standalone ↓ lines) ─────────────────
      if (trimmed.some(l => l === '↓')) {
        let html = '<div class="flow-v">'; let si = 0;
        for (const line of trimmed) {
          if (line === '↓') {
            html += '<div class="flow-vc">↓</div>';
          } else if (/^↓\s+(.+)$/.test(line)) {
            const note = line.match(/^↓\s+(.+)$/)[1];
            html += `<div class="flow-vc-note">↓ <span>${note}</span></div>`;
          } else {
            html += mkStep(line, si++);
          }
        }
        return html + '</div>';
      }

      // ── Gene structure ([Token] separated by ——) ──────────────
      const geneLine = trimmed.find(l => /\[.+\]/.test(l) && !l.includes('→'));
      if (geneLine) {
        const parts = geneLine.split('——').map(p => p.trim()).filter(Boolean);
        let html = '<div class="flow-h flow-gene">';
        parts.forEach((p, i) => {
          if (p.startsWith('[') && p.endsWith(']')) {
            const label = p.slice(1,-1);
            let c;
            if (/exon/i.test(label))        c = '#00C896';
            else if (/[íi]nton/i.test(label)) c = '#64748B';
            else if (/utr/i.test(label))    c = '#38BDF8';
            else if (/poly/i.test(label))   c = '#A78BFA';
            else                             c = '#FB923C';
            const [r,g,b] = rgb(c);
            html += `<div class="flow-step" style="border-color:${c};background:rgba(${r},${g},${b},0.13);color:${c}">${label}</div>`;
          } else {
            html += `<div class="flow-label">${p}</div>`;
          }
          if (i < parts.length - 1) html += '<div class="flow-ha">——</div>';
        });
        html += '</div>';
        const others = trimmed.filter(l => l !== geneLine);
        if (others.length) html += '<div class="flow-branch">' + others.map(l => `<div class="flow-branch-note">${l}</div>`).join('') + '</div>';
        return html;
      }

      // ── Horizontal flow (→ separators) ────────────────────────
      const mainLine = trimmed.find(l => l.includes('→'));
      if (!mainLine) {
        return '<div class="flow-raw">' + trimmed.join('<br>') + '</div>';
      }
      const branchLines = trimmed.filter(l => l !== mainLine);
      const steps = mainLine.split('→').map(s => s.trim()).filter(Boolean);
      let html = '<div class="flow-h">';
      steps.forEach((step, i) => {
        html += `<div class="flow-step" style="${stepStyle(i)}">${step}</div>`;
        if (i < steps.length - 1) html += '<div class="flow-ha">→</div>';
      });
      html += '</div>';

      if (branchLines.length) {
        html += '<div class="flow-branch">';
        let pendingArr = null;
        for (const bl of branchLines) {
          const arrMatch = bl.match(/^([↑↓]{1,2})\s*(.*)$/);
          if (arrMatch) {
            const [, arr, note] = arrMatch;
            if (note.trim()) {
              html += `<div class="flow-branch-note"><span class="fba">${arr}</span> ${note}</div>`;
            } else {
              pendingArr = arr;
            }
          } else if (bl.trim()) {
            if (pendingArr) { html += `<div class="flow-branch-arr">${pendingArr}</div>`; pendingArr = null; }
            const c = COLORS[steps.length % COLORS.length]; const [r,g,b] = rgb(c);
            html += `<div class="flow-step flow-step-branch" style="border-color:${c};background:rgba(${r},${g},${b},0.13);color:${c}">${bl}</div>`;
          }
        }
        if (pendingArr) html += `<div class="flow-branch-arr">${pendingArr}</div>`;
        html += '</div>';
      }
      return html;
    }

    function escapeFiguraIdAttr(id) {
      return String(id || '').replace(/[^A-Z0-9-]/gi, '');
    }

    /** HTML de figura inline (Wikimedia / catálogo); textos escapados para atributos. */
    function buildMaterialFigureHtml(fig) {
      const esc = (t) => String(t ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
      const src = esc(fig.urlImagem || '');
      const leg = esc(fig.legenda || fig.id);
      const cred = fig.credito ? ` — ${esc(fig.credito)}` : '';
      const lic = fig.licenca
        ? `<span style="display:block;margin-top:4px;font-size:0.75rem;opacity:0.85">${esc(fig.licenca)}</span>`
        : '';
      const link = fig.urlPaginaCommons
        ? `<a href="${esc(fig.urlPaginaCommons)}" target="_blank" rel="noopener noreferrer" style="display:inline-block;margin-top:8px;font-size:0.78rem;color:#00C896">Ver no Wikimedia Commons</a>`
        : '';
      return (
        `<figure class="material-fig-inline" style="margin:12px 0 16px;background:rgba(15,23,42,0.6);border:1px solid rgba(0,200,150,0.2);border-radius:12px;overflow:hidden">` +
        `<img src="${src}" alt="${leg}" loading="lazy" style="width:100%;max-height:min(420px,55vh);object-fit:contain;display:block;background:#020617" />` +
        `<figcaption style="padding:12px 14px;font-size:0.82rem;color:var(--text-secondary);line-height:1.5;border-top:1px solid rgba(0,200,150,0.12)">` +
        `<span style="color:#e5e7eb;font-weight:600">${leg}</span>${cred}${lic}${link}</figcaption></figure>`
      );
    }

    const MATERIAL_FIG_PENDING_HTML =
      '<div class="material-fig-placeholder material-fig-placeholder--pending" role="note"><span class="material-fig-placeholder-emoji" aria-hidden="true">🖼️</span><span class="material-fig-placeholder-text">Em breve: imagem neste ponto.</span></div>';

    /**
     * Remove briefing de ### Figura sugerida.
     * Se existir **Figura-ID:** igual ao id no JSON → slot inline (imagem no ponto do texto).
     * Senão → só aviso “em breve”.
     */
    function stripFiguraSugeridaBlocksForCliente(md) {
      if (!md || typeof md !== 'string') return md;
      return md.replace(
        /(^|\n)### Figura sugerida[^\n]*\n([\s\S]*?)(?=\n---\s*\n|\n## |$)/g,
        (match, lead, body) => {
          const idMatch = body.match(/\*\*Figura-ID:\*\*\s*`?([A-Z0-9-]+)`?/i);
          if (idMatch) {
            const id = escapeFiguraIdAttr(idMatch[1]);
            if (!id) return match;
            return `${lead}\n\n<div class="material-fig-slot" data-fig-id="${id}"></div>\n\n`;
          }
          return `${lead}\n\n${MATERIAL_FIG_PENDING_HTML}\n\n`;
        }
      );
    }

    // ===================== Markdown renderer =====================
    function capitalizeFirstLetterForTableCell(text) {
      const s = String(text || '');
      const m = s.match(/^(\s*)([a-zà-öø-ÿ])/i);
      if (!m) return s;
      const i = m[1].length;
      return s.slice(0, i) + s.charAt(i).toLocaleUpperCase('pt-BR') + s.slice(i + 1);
    }

    function normalizeTableCellCasing(html) {
      const host = document.createElement('div');
      host.innerHTML = html;
      host.querySelectorAll('table th, table td').forEach((cell) => {
        // Só aplica em célula texto puro para não mexer em links/código interno.
        if (cell.children.length > 0) return;
        const current = cell.textContent || '';
        const next = capitalizeFirstLetterForTableCell(current);
        if (next !== current) cell.textContent = next;
      });
      return host.innerHTML;
    }

    function renderMd(text) {
      const cleaned = stripFiguraSugeridaBlocksForCliente(
        text
          .replace(/\r\n/g, '\n')
          .replace(/(\|[^\n]*)\n\n+(?=\|)/g, '$1\n')
      );
      let html = marked.parse(cleaned)
        .replace(/<table>/g, '<div class="table-wrap"><table>')
        .replace(/<\/table>/g, '</table></div>');
      html = normalizeTableCellCasing(html);
      html = html.replace(
        /<pre><code class="language-flow">([\s\S]*?)<\/code><\/pre>/g,
        (_, content) => {
          const raw = content
            .replace(/&amp;/g, '&').replace(/&lt;/g, '<')
            .replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&#39;/g, "'");
          return '<div class="flow-box">' + buildFlowHTML(raw) + '</div>';
        }
      );
      return html;
    }

    // ===================== Feedback FAB =====================

    const FEEDBACK_TYPES = [
      { value: 'bug',       label: '🐛 Bug / Erro no app' },
      { value: 'sugestao',  label: '💡 Sugestão de melhoria' },
      { value: 'conteudo',  label: '📚 Conteúdo / Material' },
      { value: 'interface', label: '🎨 Interface / Visual' },
    ];

    const FEEDBACK_RATE_KEY = 'meduni9_fb_day';
    const FEEDBACK_MAX_DAY  = 3;

    function getFeedbackToday() {
      try {
        const raw = JSON.parse(localStorage.getItem(FEEDBACK_RATE_KEY) || '{}');
        const today = new Date().toISOString().slice(0, 10);
        return raw.date === today ? (raw.count || 0) : 0;
      } catch { return 0; }
    }

    function incrementFeedbackCount() {
      const today = new Date().toISOString().slice(0, 10);
      const count = getFeedbackToday() + 1;
      localStorage.setItem(FEEDBACK_RATE_KEY, JSON.stringify({ date: today, count }));
    }

    const FeedbackScreen = ({ currentMateria }) => {
      const [tipo, setTipo]         = useState('sugestao');
      const [mensagem, setMensagem] = useState('');
      const [sending, setSending]   = useState(false);
      const [sent, setSent]         = useState(false);
      const [erroMsg, setErroMsg]   = useState('');

      const maxLen = 500;
      const remaining = maxLen - mensagem.length;

      const todayCount = getFeedbackToday();
      const limitReached = todayCount >= FEEDBACK_MAX_DAY;

      const handleSend = async () => {
        if (!mensagem.trim()) { setErroMsg('Escreva sua mensagem antes de enviar.'); return; }
        if (!window.__fbAddFeedback) { setErroMsg('Feedback indisponível no momento.'); return; }
        setSending(true); setErroMsg('');
        try {
          const payload = {
            tipo,
            mensagem: mensagem.trim().slice(0, maxLen),
            criadoEm: new Date().toISOString(),
          };
          if (currentMateria) payload.disciplina = String(currentMateria).slice(0, 20);
          await window.__fbAddFeedback(payload);
          incrementFeedbackCount();
          setSent(true);
          setMensagem('');
        } catch(e) {
          setErroMsg('Erro ao enviar. Tente novamente.');
        } finally {
          setSending(false);
        }
      };

      return (
        <div className="screen-content">
          <h2 className="section-title">Feedback</h2>
          <div className="feedback-panel">
            <h3>Enviar Feedback</h3>
            <p>Sugestões, bugs ou problemas no conteúdo — tudo ajuda!</p>

            <div style={{marginBottom:'12px',fontSize:'12px',color:'var(--text-secondary)'}}>
              Enviados hoje: {todayCount}/{FEEDBACK_MAX_DAY}
            </div>

            {sent && (
              <div className="feedback-success" style={{padding:'8px 0 18px'}}>
                <span className="feedback-success-icon">✅</span>
                <strong>Obrigado pelo feedback!</strong>
                <span style={{fontSize:'13px',color:'var(--text-secondary)'}}>Sua sugestão será analisada em breve.</span>
              </div>
            )}

            <label className="feedback-label">Tipo</label>
            <select
              className="feedback-select"
              value={tipo}
              onChange={(e) => setTipo(e.target.value)}
            >
              {FEEDBACK_TYPES.map(t => (
                <option key={t.value} value={t.value}>{t.label}</option>
              ))}
            </select>

            <label className="feedback-label">Mensagem</label>
            <textarea
              className="feedback-textarea"
              placeholder="Descreva detalhadamente..."
              value={mensagem}
              maxLength={maxLen}
              onChange={(e) => { setMensagem(e.target.value); setErroMsg(''); if (sent) setSent(false); }}
            />
            <div className="feedback-char-counter" style={{color: remaining < 50 ? 'var(--error)' : undefined}}>
              {remaining} caracteres restantes
            </div>

            {erroMsg && <p style={{color:'var(--error)',fontSize:'13px',marginBottom:'10px'}}>{erroMsg}</p>}

            <div className="feedback-actions">
              <button className="feedback-btn feedback-btn-primary" onClick={handleSend} disabled={limitReached || sending || !mensagem.trim()}>
                {limitReached ? 'Limite diário atingido' : (sending ? 'Enviando...' : 'Enviar 🚀')}
              </button>
            </div>
          </div>
        </div>
      );
    };

    // ===================== Utilities =====================

    // Device Fingerprint
    const generateDeviceFingerprint = async () => {
      const userAgent = navigator.userAgent;
      const screen_res = `${screen.width}x${screen.height}`;
      const timezone = Intl.DateTimeFormat().resolvedOptions().timeZone;

      let canvas_hash = '';
      try {
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        ctx.fillText('MedGradPlus', 10, 10);
        canvas_hash = canvas.toDataURL().substring(0, 50);
      } catch (e) {}

      return `${userAgent.substring(0, 30)}_${screen_res}_${timezone}_${canvas_hash}`.substring(0, 128);
    };

    /** Migra entradas antigas (newReps/newEf/newInterval) e garante reps/ef/interval/nextReview. */
    function normalizeSrEntry(raw) {
      if (raw == null || typeof raw !== 'object') return null;
      const reps = raw.reps != null ? raw.reps : raw.newReps;
      const ef = raw.ef != null ? raw.ef : raw.newEf;
      const interval = raw.interval != null ? raw.interval : raw.newInterval;
      const nextReview = raw.nextReview != null ? Number(raw.nextReview) : 0;
      return {
        ...raw,
        reps: reps != null ? reps : 0,
        ef: ef != null ? ef : 2.5,
        interval: interval != null ? interval : 0,
        nextReview,
      };
    }

    // SM-2 Algorithm
    const SM2 = {
      calculateNextReview: (quality, reps, ef, interval) => {
        const newReps = reps + 1;
        let newEf = ef + 0.1 - (5 - quality) * (0.08 + (5 - quality) * 0.02);
        if (newEf < 1.3) newEf = 1.3;

        let newInterval;
        if (newReps === 1) newInterval = 1;
        else if (newReps === 2) newInterval = 3;
        else newInterval = Math.round(interval * newEf);

        const nextReview = Date.now() + newInterval * 24 * 60 * 60 * 1000;
        return { reps: newReps, ef: newEf, interval: newInterval, nextReview };
      },

      /** Cards novos (sem sr) ou com nextReview <= agora; ignora buried. */
      getDueCards: (cards, srData) => {
        const now = Date.now();
        return cards
          .filter((card) => {
            const raw = srData[card.id];
            if (raw?.buried) return false;
            const data = normalizeSrEntry(raw);
            if (!data) return true;
            return data.nextReview <= now;
          })
          .sort((a, b) => {
            const aData = normalizeSrEntry(srData[a.id]) || { nextReview: 0 };
            const bData = normalizeSrEntry(srData[b.id]) || { nextReview: 0 };
            return aData.nextReview - bData.nextReview;
          });
      },

      /**
       * Só revisões agendadas: já respondidos pelo menos uma vez (reps >= 1),
       * com nextReview vencido; ignora enterrados e cards nunca estudados.
       */
      getDueReviewCards: (cards, srData) => {
        const now = Date.now();
        return cards
          .filter((card) => {
            const raw = srData[card.id];
            if (!raw || raw.buried) return false;
            const data = normalizeSrEntry(raw);
            if (!data || data.reps < 1) return false;
            return data.nextReview <= now;
          })
          .sort((a, b) => {
            const aData = normalizeSrEntry(srData[a.id]) || { nextReview: 0 };
            const bData = normalizeSrEntry(srData[b.id]) || { nextReview: 0 };
            return aData.nextReview - bData.nextReview;
          });
      },
    };

      const seconds = Math.floor(ms / 1000);
      const minutes = Math.floor(seconds / 60);
      const hours = Math.floor(minutes / 60);

      if (hours > 0) return `${hours}h ${minutes % 60}m`;
      if (minutes > 0) return `${minutes}m ${seconds % 60}s`;
      return `${seconds}s`;
    };

    async function submitContentFeedback(payload) {
      const currentUser = window.__fbAuth?.currentUser || null;
      const localUser = JSON.parse(localStorage.getItem('meduni9_user') || '{}');
      const body = {
        tipo: 'bug',
        origem: payload.origem || 'geral',
        mensagem: payload.mensagem || 'Erro reportado pelo usuário',
        itemId: payload.itemId || '',
        materia: payload.materia || '',
        disciplina: payload.materia || '',
        tema: payload.tema || '',
        contexto: payload.contexto || null,
        userEmail: currentUser?.email || localUser?.email || '',
        userId: currentUser?.uid || localUser?.uid || '',
      };

      const endpoints = [
        '/api/feedback/raw/create',
        'http://127.0.0.1:3001/api/feedback/raw/create',
        'http://localhost:3001/api/feedback/raw/create',
      ];

      for (const endpoint of endpoints) {
        try {
          const res = await fetch(endpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body),
          });
          if (!res.ok) continue;
          const contentType = res.headers.get('content-type') || '';
          if (!contentType.includes('application/json')) continue;
          const data = await res.json();
          if (data.ok) return data;
        } catch {}
      }

      throw new Error('Falha ao enviar feedback');

    // ===================== Security Utilities =====================
    const CODE_SALT = 'meduni9_2026_';
    const MAX_ATTEMPTS = 5;
    const LOCKOUT_BASE_MS = 60000; // 1 minute base lockout

    async function hashCode(code) {
      const encoder = new TextEncoder();
      const data = encoder.encode(CODE_SALT + code);
      const hashBuffer = await crypto.subtle.digest('SHA-256', data);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    function getRateLimitState() {
      try {
        const raw = localStorage.getItem('meduni9_rl');
        if (!raw) return { attempts: 0, lockedUntil: 0, history: [] };
        return JSON.parse(raw);
      } catch { return { attempts: 0, lockedUntil: 0, history: [] }; }
    }

    function setRateLimitState(state) {
      localStorage.setItem('meduni9_rl', JSON.stringify(state));
    }

    function checkRateLimit() {
      const state = getRateLimitState();
      const now = Date.now();
      if (state.lockedUntil > now) {
        const remainSec = Math.ceil((state.lockedUntil - now) / 1000);
        const mins = Math.floor(remainSec / 60);
        const secs = remainSec % 60;
        return { allowed: false, message: `Muitas tentativas. Tente novamente em ${mins}m${secs}s.` };
      }
      // Clear old attempts (older than 10 minutes)
      state.history = (state.history || []).filter(t => now - t < 600000);
      if (state.history.length >= MAX_ATTEMPTS) {
        // Exponential backoff: 1min, 2min, 4min, 8min, 16min, max 30min
        const lockoutMs = Math.min(LOCKOUT_BASE_MS * Math.pow(2, state.attempts - MAX_ATTEMPTS), 1800000);
        state.lockedUntil = now + lockoutMs;
        state.attempts++;
        setRateLimitState(state);
        return { allowed: false, message: `Muitas tentativas. Bloqueado por ${Math.ceil(lockoutMs/60000)} minutos.` };
      }
      return { allowed: true };
    }

    function recordFailedAttempt() {
      const state = getRateLimitState();
      state.history = [...(state.history || []), Date.now()];
      state.attempts = (state.attempts || 0) + 1;
      setRateLimitState(state);
    }

    function getCampusById(facultyId, campusId) {
      const faculty = getFacultyById(facultyId);
      return faculty?.campi?.find(c => c.id === campusId) || null;
    }

    function getFirstActiveCampus(faculty) {
      return (faculty?.campi || []).find(c => c.active) || faculty?.campi?.[0] || null;

    function normalizeModulesAccess(value) {
      if (value === null || value === undefined || value === '' || value === 'all') return null;

      const source = Array.isArray(value)
        ? value
        : String(value)
            .split(',')
            .map(s => s.trim())
            .filter(Boolean);

      const modules = [...new Set(source.map(n => parseInt(n, 10)).filter(n => Number.isFinite(n) && n >= 1 && n <= 12))]
        .sort((a, b) => a - b);

      return modules.length ? modules : null;
    }

    function resolveModulesFromCodeEntry(codeEntry = {}) {
      const explicit = normalizeModulesAccess(
        codeEntry.modulosAcesso ?? codeEntry.modulos_acesso ?? codeEntry.modulos ?? codeEntry.modules
      );
      if (explicit) return explicit;

      const plan = String(codeEntry.plano || '').toLowerCase();
      if (plan === 'ciclo_basico' || plan === 'ciclo') return [1, 2, 3, 4];
      if (plan === 'ciclo_clinico') return [5, 6, 7, 8];
      if (plan === 'ciclo_internato') return [9, 10, 11, 12];
      if (plan === 'mensal') return [1, 2, 3, 4];

      if (plan === 'modulo') {
        const inferredModule = parseInt(
          codeEntry.moduloLiberado ?? codeEntry.moduloAcesso ?? codeEntry.moduloNum ?? codeEntry.modulo ?? codeEntry.semestre,
          10
        );
        if (Number.isFinite(inferredModule) && inferredModule >= 1 && inferredModule <= 12) {
          return [inferredModule];
        }
      }

      return null;
    }

    function getAmbassadorModules() {
      return Array.from({ length: 12 }, (_, idx) => idx + 1);
    }

    function getAllowedModules(profile) {
      const normalized = normalizeModulesAccess(profile?.modulosAcesso);
      if (normalized) return normalized;
      if (String(profile?.plano || '').toLowerCase() === 'gratuito') return [1];
      return getAmbassadorModules();
    }

    function hasModuleAccess(profile, moduloNum) {
      const modulo = parseInt(moduloNum, 10);
      if (!Number.isFinite(modulo) || modulo < 1) return false;
      const normalized = normalizeModulesAccess(profile?.modulosAcesso);
      if (!normalized) {
        if (String(profile?.plano || '').toLowerCase() === 'gratuito') return modulo === 1;
        return true;
      }
      return normalized.includes(modulo);

    function normalizeUserProfile(profile = {}) {
      const faculty = getFacultyById(profile.faculdadeId || profile.facultyId || DEFAULT_FACULTY_ID);
      const campus = getCampusById(faculty.id, profile.campusId || DEFAULT_CAMPUS_ID) || getFirstActiveCampus(faculty);
      let modules = normalizeModulesAccess(profile.modulosAcesso);
      const profilePlan = String(profile.plano || '').toLowerCase();
      if (!modules && profilePlan === 'modulo') {
        const inferredModule = parseInt(
          profile.moduloLiberado ?? profile.moduloAcesso ?? profile.moduloNum ?? profile.modulo ?? profile.semestre,
          10
        );
        if (Number.isFinite(inferredModule) && inferredModule >= 1 && inferredModule <= 12) {
          modules = [inferredModule];
        }
      }
      const semestreRaw = Number(profile.semestre || profile.modulo || 1);
      const defaultSemester = Number.isFinite(semestreRaw) && semestreRaw > 0 ? semestreRaw : 1;
      const semestre = modules && !modules.includes(defaultSemester)
        ? modules[0]
        : defaultSemester;

      return {
        ...profile,
        plano: profile.plano || 'basico',
        modulosAcesso: modules,
        semestre: semestre,
        modulo: semestre,
        faculdadeId: faculty.id,

        normalized.faculdadeId || DEFAULT_FACULTY_ID,
        normalized.campusId || DEFAULT_CAMPUS_ID,
        normalized.modulosAcesso ? normalized.modulosAcesso.join(',') : 'all',
      ].join('|');
    }

    function decodeProfileMarker(fbUser) {
      const raw = fbUser?.displayName || '';
      if (!raw.startsWith('mgp|')) return null;
      const parts = raw.split('|');
      const [, plano, semestreRaw, codeHash, faculdadeId, campusId, modulosRaw] = parts;
      return normalizeUserProfile({
        uid: fbUser.uid,
        email: fbUser.email || '',
        plano: plano || 'basico',
        semestre: Number(semestreRaw || 1),
        modulo: Number(semestreRaw || 1),
        codeHash: codeHash || '',
        faculdadeId: faculdadeId || DEFAULT_FACULTY_ID,
        campusId: campusId || DEFAULT_CAMPUS_ID,
        modulosAcesso: normalizeModulesAccess(modulosRaw),
        loginDate: new Date().toISOString(),
      });
    }

    function buildSessionTrackedProfile(profile = {}, fingerprint = '') {
      const normalized = normalizeUserProfile(profile);
      const currentDevice = (fingerprint || normalized.deviceId || '').trim();
      const previous = Array.isArray(normalized.deviceIds) ? normalized.deviceIds.filter(Boolean) : [];
      const nextDevices = currentDevice
        ? [...previous.filter(id => id !== currentDevice), currentDevice].slice(-5)
        : previous.slice(-5);
      const nowIso = new Date().toISOString();

      return {
        ...normalized,
        deviceId: currentDevice || normalized.deviceId || '',
        deviceIds: nextDevices,
        loginDate: nowIso,
        lastSeenAt: nowIso,
        lastSeenUa: (navigator.userAgent || '').slice(0, 160),
      };
    }

          deviceId: normalized.deviceId || '',
          deviceIds: Array.isArray(normalized.deviceIds) ? normalized.deviceIds.filter(Boolean).slice(-5) : [],
          maxDispositivos: Number(normalized.maxDispositivos || 2),
          accessSource: normalized.accessSource || '',
          emailGrantId: normalized.emailGrantId || '',
          criadoEm: normalized.criadoEm || new Date().toISOString(),

        if (options.merge) {

        const snap = await getDoc(doc(window.__fbDb, 'users', fbUser.uid));
        if (snap.exists()) {

      return decodeProfileMarker(fbUser);

    const EMAIL_ACCESS_COLLECTION = 'email_access';

    function normalizeAuthEmail(email) {
      return String(email || '').trim().toLowerCase();
    }

    function isEmailGrantValid(grant) {
      if (!grant || grant.ativo === false) return false;
      if (grant.expira) {
        const exp = new Date(grant.expira);
        if (Number.isNaN(+exp)) return false;
        const end = new Date(exp.getFullYear(), exp.getMonth(), exp.getDate(), 23, 59, 59, 999);
        if (new Date() > end) return false;
      }
      return true;
    }

    async function loadEmailAccessGrant(email) {
      const norm = normalizeAuthEmail(email);
      if (!norm || !window.__fbFirestore || !window.__fbDb) return null;
      try {
        const { doc, getDoc } = window.__fbFirestore;
        const snap = await getDoc(doc(window.__fbDb, EMAIL_ACCESS_COLLECTION, norm));
        if (!snap.exists()) return null;
        return { id: norm, ...snap.data() };
      } catch {
        return null;
      }
    }

    async function syncProfileAccessFromEmailGrant(fbUser, profile) {
      if (!profile || !fbUser?.email) return profile;
      try {
        const profileSource = String(profile.accessSource || '').toLowerCase();
        const legacySourceSet = new Set([
          'legacy_key', 'legacy_code', 'codigo', 'code', 'key', 'cupom', 'coupon', 'manual_key'
        ]);
        const hasLegacyCode = !!String(profile.codeHash || '').trim();
        const isLegacyKeyOnlyProfile =
          hasLegacyCode ||
          legacySourceSet.has(profileSource) ||
          (
            profileSource &&
            profileSource !== 'stripe' &&
            profileSource !== 'stripe_refund' &&
            profileSource !== 'email_invite' &&
            profileSource !== 'demo_account' &&
            profileSource !== 'ambassador'
          );

        const grant = await loadEmailAccessGrant(fbUser.email);
        if (!grant) {
          if (profileSource === 'stripe' || profileSource === 'stripe_refund' || isLegacyKeyOnlyProfile) {
            const downgradedNoGrant = normalizeUserProfile({
              ...profile,
              plano: 'gratuito',
              modulosAcesso: [1],
              maxDispositivos: 2,
              accessSource: isLegacyKeyOnlyProfile ? 'email_required' : 'stripe_refund',
              emailGrantId: normalizeAuthEmail(fbUser.email),
              codeHash: '',
            });
            try {
              await saveUserProfile(fbUser, buildSessionTrackedProfile(downgradedNoGrant), { merge: true });
            } catch {}
            return downgradedNoGrant;
          }
          return profile;
        }
        if (!isEmailGrantValid(grant)) {
          const profileSource = String(profile.accessSource || '').toLowerCase();
          const grantSource = String(grant.accessSource || '').toLowerCase();
          const shouldDowngradeFromGrant =
            profileSource === 'stripe' ||
            profileSource === 'stripe_refund' ||
            grantSource === 'stripe' ||
            grant.ativo === false;
          if (!shouldDowngradeFromGrant) return profile;

          const downgraded = normalizeUserProfile({
            ...profile,
            plano: 'gratuito',
            modulosAcesso: [1],
            maxDispositivos: 2,
            accessSource: 'stripe_refund',
            emailGrantId: grant.id || normalizeAuthEmail(fbUser.email),
          });
          try {
            await saveUserProfile(fbUser, buildSessionTrackedProfile(downgraded), { merge: true });
          } catch {}
          return downgraded;
        }

        const incomingModules = resolveModulesFromCodeEntry(grant);
        const currentModules = normalizeModulesAccess(profile.modulosAcesso);
        const incomingPlan = grant.plano || profile.plano || 'basico';
        const incomingMax = Number(grant.maxDispositivos || profile.maxDispositivos || 2);
        const normalizedPlan = String(incomingPlan || '').toLowerCase();
        const safeIncomingModules = (normalizedPlan === 'modulo' && !incomingModules)
          ? (currentModules || null)
          : incomingModules;
        const grantSource = grant.accessSource === 'stripe' ? 'stripe' : 'email_invite';

        const merged = normalizeUserProfile({
          ...profile,
          plano: incomingPlan,
          modulosAcesso: safeIncomingModules,
          maxDispositivos: incomingMax,
          accessSource: grantSource,
          emailGrantId: grant.id || normalizeAuthEmail(fbUser.email),
          codeHash: '',
        });

        const modulesChanged = JSON.stringify(merged.modulosAcesso || null) !== JSON.stringify(currentModules || null);
        const planChanged = incomingPlan !== (profile.plano || 'basico');
        const maxChanged = incomingMax !== Number(profile.maxDispositivos || 2);
        const sourceChanged = (profile.accessSource || '') !== grantSource;

        if (!modulesChanged && !planChanged && !maxChanged && !sourceChanged) return profile;

        try {
          await saveUserProfile(fbUser, buildSessionTrackedProfile(merged), { merge: true });
        } catch {}

        return merged;
      } catch {
        return profile;
      }
    }

    async function checkAmbassadorQualification(profile) {
      if (!profile || !profile.ambassadorVitalicio) return profile;

      try {
        const fullModules = getAmbassadorModules();
        const lastCheck = profile.lastQualificationCheck ? new Date(profile.lastQualificationCheck) : null;
        const now = new Date();
        const daysSinceCheck = lastCheck ? (now - lastCheck) / (1000 * 60 * 60 * 24) : 999;

        // First month grace period: starts approved and keeps full access for 30 days.
        if (!lastCheck) {
          const firstMonthApproved = {
            ...profile,
            qualificationStatus: 'approved',
            lastQualificationCheck: now.toISOString(),
            modulosAcesso: fullModules
          };
          if (window.__fbAuth?.currentUser) {
            try {
              await saveUserProfile(window.__fbAuth.currentUser, buildSessionTrackedProfile(firstMonthApproved), { merge: true });
            } catch {}
          }
          return firstMonthApproved;
        }

        // Only check every 30 days
        if (lastCheck && daysSinceCheck < 30) {
          if (profile.qualificationStatus === 'suspended') return profile;
          return { ...profile, modulosAcesso: fullModules };
        }

        // Fetch sales data for current month
        const currentMonth = now.toISOString().slice(0, 7);
        const response = await fetch('data/vendas_mensais.json?_=' + Date.now());
        if (!response.ok) {
          // Fallback: keep current status if fetch fails
          return profile;
        }

        const salesData = await response.json();
        const monthSales = salesData[currentMonth] || {};
  const ambassadorRef = profile.ambassadorId || profile.uid;
  const ambassadorSales = monthSales[ambassadorRef];

        const hasMinSale = ambassadorSales && ambassadorSales.count >= 1;
        const newStatus = hasMinSale ? 'approved' : 'suspended';

        const updated = {
          ...profile,
          qualificationStatus: newStatus,
          lastQualificationCheck: now.toISOString(),
          modulosAcesso: newStatus === 'suspended' ? null : fullModules
        };

        // Save updated status
        if (window.__fbAuth?.currentUser) {
          try {
            await saveUserProfile(window.__fbAuth.currentUser, buildSessionTrackedProfile(updated), { merge: true });
          } catch {}
        }

        return updated;
      } catch (err) {
        // Fallback: keep existing profile on any error
        console.warn('Ambassador qualification check failed:', err);
        return profile;
      }
    }

                            key={faculty.id}

                              if (!faculty.active) return;

      const [viewAll, setViewAll] = useState(false);
      const userSemester = user.semestre || user.modulo || 1;

      useEffect(() => {
        const srData = JSON.parse(localStorage.getItem('meduni9_sr_data') || '{}');
        const quizHistory = JSON.parse(localStorage.getItem('meduni9_quiz_history') || '[]');

        const today = new Date().toDateString();
        const todayQuizzes = quizHistory.filter(q => new Date(q.date).toDateString() === today);
        const correctCount = todayQuizzes.filter(q => q.score === q.total).length;

        setStats({
          cardsToday: Object.keys(srData).length,
          questionsToday: todayQuizzes.length,
          accuracy: todayQuizzes.length > 0 ? Math.round((correctCount / todayQuizzes.length) * 100) : 0
        });
      }, []);

      const srDataForHome = JSON.parse(localStorage.getItem('meduni9_sr_data') || '{}');
      const studiedDeckCount = flashcards.filter((f) => {
        const raw = srDataForHome[f.id];
        if (!raw || raw.buried) return false;
        const d = normalizeSrEntry(raw);
        return d && d.reps >= 1;
      }).length;
      const dueReviewCards = SM2.getDueReviewCards(flashcards, srDataForHome);

        ? materias.filter(m => m.ativo !== false)
        : materias.filter(m => m.modulo === userSemester && m.ativo !== false);

      const groupedMaterias = useMemo(() => {
        if (!viewAll) return { [userSemester]: displayMaterias };
        const groups = {};
        displayMaterias.forEach(m => {
          const sem = m.modulo || 0;
          if (!groups[sem]) groups[sem] = [];
          groups[sem].push(m);

        return groups;

                    : 'landing.html';

            </div>

            <div className="stats-grid">
              <div className="stat-card">
                <div className="stat-icon"><IconLayers /></div>
                <div className="stat-value">{stats.cardsToday}</div>
                <div className="stat-label">Cards</div>
              </div>
              <div className="stat-card">
                <div className="stat-icon"><IconClipboardList /></div>
                <div className="stat-value">{stats.questionsToday}</div>
                <div className="stat-label">Questões</div>
              </div>

                <div className="stat-icon"><IconTarget /></div>
                <div className="stat-value">{stats.accuracy}%</div>
                <div className="stat-label">Acurácia</div>
              </div>
            </div>

                  {dueReviewCards.length > 0 ? `${dueReviewCards.length} cards para revisar` : 'Tudo em dia! ✨'}
                </div>

                  <div
                    className="suggestion-progress-bar"
                    style={{
                      width:
                        dueReviewCards.length > 0
                          ? `${Math.min(100, Math.round((dueReviewCards.length / Math.max(studiedDeckCount, 1)) * 100))}%`
                          : '100%',
                      background: dueReviewCards.length > 0 ? undefined : 'var(--primary)',
                    }}
                  ></div>
                </div>
                <div className="suggestion-meta">
                  {dueReviewCards.length > 0
                    ? `${Math.round((dueReviewCards.length / Math.max(studiedDeckCount, 1)) * 100)}% do seu deck de revisão`

                  <button className="suggestion-cta" onClick={() => onSelectMateria(null)}>
                    <IconPlay /> Estudar agora
                  </button>

                className="semester-tab"
                style={{ marginTop: '24px', fontSize: '12px', padding: '6px 12px' }}
                onClick={() => setViewAll(!viewAll)}
              >
                {viewAll ? 'Meu módulo' : 'Ver todos'}
              </button>
            </div>

              {Object.entries(groupedMaterias).sort(([a],[b]) => Number(a) - Number(b)).map(([sem, mats]) => (
