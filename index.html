    .section-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 16px;
      margin-top: 24px;
    }

    .subjects-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .subject-card {
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: 12px;
      padding: 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .subject-card:active {
      background: rgba(0, 200, 150, 0.1);
      border-color: var(--primary);
    }

    .subject-icon {
      width: 48px;
      height: 48px;
      border-radius: 10px;
      background: rgba(0, 200, 150, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      flex-shrink: 0;
    }

    .subject-info {
      flex: 1;
    }

    .subject-name {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 4px;
    }

    .subject-meta {
      font-size: 12px;
      color: var(--text-secondary);
    }

    .subject-arrow {
      color: var(--text-secondary);
    }

    /* Flashcards Screen */
    .flashcards-header {
      margin-bottom: 24px;
    }

    .filter-bar {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      margin-bottom: 24px;
      padding-bottom: 8px;
      -webkit-overflow-scrolling: touch;
    }

    .filter-bar::-webkit-scrollbar {
      display: none;
    }

    .filter-btn {
      padding: 8px 16px;
      border-radius: 20px;
      border: 1px solid var(--border-card);
      background: transparent;
      color: var(--text-secondary);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
    }

    .filter-btn.active {
      background: var(--primary);
      color: #000;
      border-color: var(--primary);
    }

    .flashcard-container {
      margin-bottom: 24px;
    }

    .flashcard {
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: 16px;
      min-height: 320px;
      height: 320px;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      perspective: 1000px;
      transition: all 0.2s ease;
      position: relative;
      overflow: hidden;
    }

    .flashcard::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(135deg, rgba(0, 200, 150, 0.1), transparent);
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }

    .flashcard:active::before {
      opacity: 1;
    }

    .flashcard-inner {
      width: 100%;
      height: 100%;
      transition: transform 0.6s;
      transform-style: preserve-3d;
      position: relative;
    }

    .flashcard-inner.flipped {
      transform: rotateY(180deg);
    }

    .flashcard-front, .flashcard-back {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      backface-visibility: hidden;
      text-align: center;
      padding: 24px;
      overflow-y: auto;
    }

    .flashcard-back {
      transform: rotateY(180deg);
    }

    .flashcard-label {
      font-size: 11px;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 600;
    }

    .flashcard-text {
      font-size: 18px;
      line-height: 1.5;
      color: var(--text-primary);
      word-wrap: break-word;
    }

    .flashcard-progress {
      width: 100%;
      padding: 0 16px;
      margin-bottom: 20px;
    }

    /* Cloze Deletion (Lacunas) Styling */
    .cloze-gap {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 200, 150, 0.15);
      border: 1px dashed var(--primary);
      color: var(--primary);
      padding: 2px 8px;
      border-radius: 6px;
      font-weight: 700;
      font-family: 'Outfit', sans-serif;
      margin: 0 2px;
      min-width: 40px;
      box-shadow: 0 0 10px rgba(0, 200, 150, 0.1);
      vertical-align: middle;
    }

    .cloze-answer {
      color: var(--primary);
      font-weight: 800;
      text-decoration: underline;
      text-underline-offset: 4px;
      text-decoration-thickness: 2px;
    }

    html[data-theme="light"] .cloze-gap {
      background: rgba(0, 200, 150, 0.1);
      border-style: solid;
      color: #058661;
    }

    html[data-theme="light"] .cloze-answer {
      color: #058661;
    }

    .progress-dots {
      display: flex;
      gap: 6px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .progress-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
    }

    .progress-dot.current {
      background: var(--primary);
      width: 8px;
      height: 8px;
    }

    .progress-dot.completed {
      background: var(--success);
    }

    .flashcard-actions {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      width: 100%;
      margin-top: 24px;
    }

    .rate-btn {
      padding: 10px;
      border: 1px solid var(--border-card);
      border-radius: 8px;
      background: var(--bg-card);
      color: var(--text-primary);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .rate-btn.error {
      border-color: var(--error);
      color: var(--error);
    }

    .rate-btn.error:active {
      background: rgba(239, 68, 68, 0.1);
    }

    .rate-btn.warning {
      border-color: var(--warning);
      color: var(--warning);
    }

    .rate-btn.warning:active {
      background: rgba(245, 158, 11, 0.1);
    }

    .rate-btn.success {
      border-color: var(--success);
      color: var(--success);
    }

    .rate-btn.success:active {
      background: rgba(16, 185, 129, 0.1);
    }

    /* Anki-style flashcard enhancements */
    .flashcard-hint {
      fontSize: 12px;
      color: var(--text-secondary);
      margin-top: 8px;
      opacity: 0.6;
      font-size: 12px;
    }

    .flashcard-answer {
      font-size: 16px;
      line-height: 1.6;
    }

    .flashcard-explanation {
      font-size: 12px;
      line-height: 1.45;
      color: var(--text-secondary);
      opacity: 0.38;
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      text-align: center;
      width: 100%;
      font-weight: 400;
    }

    html[data-theme="light"] .flashcard-explanation {
      opacity: 0.42;
      border-top-color: rgba(0, 0, 0, 0.06);
    }

    .flashcards-category-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
      align-items: center;
    }

    .flashcards-category-chips-label {
      font-size: 12px;
      color: var(--text-secondary);
      width: 100%;
      margin-bottom: 2px;
    }

    .fc-cat-chip {
      border: 1px solid rgba(0, 200, 150, 0.28);
      background: rgba(0, 200, 150, 0.06);
      color: var(--text-secondary);
      font-size: 12px;
      font-family: 'DM Sans', sans-serif;
      padding: 6px 12px;
      border-radius: 999px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
    }

    .fc-cat-chip:hover {
      border-color: rgba(0, 200, 150, 0.45);
      color: var(--text-primary);
    }

    .fc-cat-chip.active {
      background: rgba(0, 200, 150, 0.2);
      border-color: var(--mint, #00C896);
      color: #E2E8F0;
      font-weight: 600;
    }

    html[data-theme="light"] .fc-cat-chip.active {
      color: #0f172a;
    }

    .anki-actions {
      margin-top: 16px;
    }

    .anki-actions .rate-btn {
      font-size: 14px;
      font-weight: 700;
      padding: 14px 10px;
      flex-direction: row;
      justify-content: center;
      gap: 8px;
    }

    .rate-shortcut {
      font-size: 10px;
      opacity: 0.5;
      background: rgba(255, 255, 255, 0.08);
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 500;
    }

    /* Quiz keyboard hints */
    .kbd-hint {
      font-size: 10px;
      opacity: 0.5;
      background: rgba(255, 255, 255, 0.08);
      padding: 2px 6px;
      border-radius: 4px;
      margin-left: 8px;
      font-weight: 500;
    }

    .quiz-option-number {
      font-size: 11px;
      font-weight: 700;
      opacity: 0.8;
      min-width: 22px;
      height: 22px;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.12);
      margin-right: 12px;
      flex-shrink: 0;
      letter-spacing: 0;
      font-family: 'Outfit', sans-serif;
    }

    .quiz-action-bar {
      margin-top: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .quiz-action-bar .btn-primary {
      margin-left: 0;
      flex: 1;
    }

    .quiz-report-btn {
      width: auto;
      min-width: 120px;
      min-height: 44px;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.28);
      color: #FCA5A5;
      flex-shrink: 0;
    }

    .quiz-result-actions {
      margin-top: 24px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    .quiz-result-secondary {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      color: var(--text-primary);
    }

    .subject-card-empty {
      opacity: 0.45;
    }

    .subject-card-empty .subject-select-meta {
      font-style: italic;
    }

    .session-complete {
      text-align: center;
      padding: 40px 0;
    }

    .session-icon {
      font-size: 80px;
      margin-bottom: 24px;
      animation: bounce 0.6s ease;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .session-title {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 16px;
    }

    .session-stats {
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 24px;
    }

    .session-stat {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid var(--border-card);
    }

    .session-stat:last-child {
      border-bottom: none;
    }

    .session-stat-label {
      color: var(--text-secondary);
      font-size: 13px;
    }

    .session-stat-value {
      font-size: 18px;
      font-weight: 700;
      color: var(--primary);
    }

    /* Quiz Screen */
    .quiz-header {
      margin-bottom: 24px;
    }

    .quiz-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .quiz-item {
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: 12px;
      padding: 16px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .quiz-item:active {
      background: rgba(0, 200, 150, 0.1);
      border-color: var(--primary);
    }

    .quiz-subject {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 4px;
    }

    .quiz-count {
      font-size: 12px;
      color: var(--text-secondary);
    }

    .quiz-screen {
      max-width: 800px;
      margin: 0 auto;
      width: 100%;
    }

    .quiz-progress-section {
      margin-bottom: 14px;
    }

    .quiz-progress-bar {
      width: 100%;
      height: 3px;
      background: rgba(255,255,255,0.07);
      border-radius: 2px;
      overflow: hidden;
      margin-bottom: 8px;
    }

    .quiz-progress-fill {
      height: 100%;
      background: var(--primary);
      transition: width 0.35s ease;
    }

    .quiz-counter {
      font-size: 11.5px;
      color: var(--text-secondary);
      font-weight: 400;
    }

    .quiz-question {
      font-size: 15px;
      font-weight: 400;
      color: rgba(255,255,255,0.95);
      margin-bottom: 0;
      line-height: 1.5;
      letter-spacing: 0.01em;
    }

    .quiz-options {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 14px;
    }

    .quiz-option {
      padding: 10px 14px;
      background: rgba(255,255,255,0.025);
      border: 1.2px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      color: rgba(255,255,255,0.9);
      cursor: pointer;
      transition: all 0.12s ease;
      font-size: 14px;
      text-align: left;
      line-height: 1.45;
      font-weight: 400;
      position: relative;
      padding-right: 36px;
    }

    .quiz-option:hover:not(.crossed-out):not(.correct):not(.incorrect):not(.incorrect-selected) {
      background: rgba(255,255,255,0.06);
      border-color: rgba(255,255,255,0.18);
    }

    .quiz-option:active {
      border-color: var(--primary);
    }

    .quiz-option.selected {
      border-color: rgba(0,200,150,0.65);
      background: rgba(0,200,150,0.08);
    }

    .quiz-option.correct {
      border-color: rgba(16,185,129,0.65);
      background: rgba(16,185,129,0.1);
      color: rgba(255,255,255,0.95);
    }

    .quiz-option.incorrect {
      border-color: rgba(239,68,68,0.35);
      background: rgba(239,68,68,0.07);
      color: rgba(255,255,255,0.55);
    }

    .quiz-option.incorrect-selected {
      border-color: rgba(239,68,68,0.75);
      background: rgba(239,68,68,0.14);
      color: rgba(255,255,255,0.9);
    }

    .quiz-option.crossed-out {
      text-decoration: line-through;
      opacity: 0.25;
      pointer-events: none;
      border-color: rgba(255,255,255,0.05);
      background: transparent;
    }

    .cross-btn {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 1px solid var(--border-card);
      background: transparent;
      color: var(--text-secondary);
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      padding: 0;
      min-height: auto;
      text-transform: none;
      letter-spacing: 0;
    }

    .cross-btn:hover {
      border-color: var(--error);
      color: var(--error);
      background: rgba(239, 68, 68, 0.1);
      transform: translateY(-50%);
      box-shadow: none;
    }

    .quiz-feedback {
      background: rgba(255,255,255,0.02);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 16px;
      font-size: 13px;
      line-height: 1.55;
    }

    .quiz-feedback strong {
      font-weight: 700;
      color: rgba(255,255,255,0.95);
    }

    .quiz-feedback-title {
      font-weight: 700;
      margin-bottom: 6px;
      color: var(--text-primary);
      font-size: 13.5px;
    }

    .quiz-result-screen {
      text-align: center;
      padding: 40px 0;
    }

    .quiz-score {
      font-size: 72px;
      font-weight: 800;
      color: var(--primary);
      margin-bottom: 16px;
    }

    .quiz-time {
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 32px;
    }

    /* Materials Screen */
    .materials-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .materials-cycle-section {
      margin-bottom: 28px;
      scroll-margin-top: 88px;

    .materials-cycle-header {
      font-family: Outfit, sans-serif;
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text-primary);
      margin: 0 0 6px;
      letter-spacing: 0;
    }

    .materials-cycle-sub {
      font-size: 0.78rem;
      color: var(--text-secondary);
      margin: 0 0 14px;
      line-height: 1.5;
    }

    .materials-cycle-empty {
      font-size: 0.85rem;
      color: var(--text-secondary);
      line-height: 1.55;
      padding: 14px 16px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-subtle);
    }

    .materials-cycle-nav {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 18px;
    }

    .materials-cycle-nav a {
      text-decoration: none;
    }

    .materials-mod-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin-bottom: 14px;
    }

    .materials-mod-chips-label {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-secondary);

    .materials-mod-subgroup {
      margin-bottom: 18px;
    }

    .materials-mod-subgroup:last-child {
      margin-bottom: 0;
    }

    .materials-mod-title {
      font-family: 'DM Sans', sans-serif;
      font-size: 0.82rem;

      color: #00C896;

      justify-content: center;
      flex: 0 0 auto;
      width: 210mm;
      min-height: 297mm;

    .resumo-a4-page-shell .resumo-a4-page {

      transform-origin: top center;
    }

    .resumo-a4-page {
      position: relative;
      width: 210mm;
      height: 297mm;
      min-height: 297mm;
      overflow: hidden;
      box-sizing: border-box;
      padding: 12mm 12mm 10mm;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.98), rgba(249, 254, 252, 0.99)),
        repeating-linear-gradient(0deg, transparent 0, transparent 20px, rgba(15, 23, 42, 0.035) 21px),
        radial-gradient(circle at 20% 8%, rgba(0, 200, 150, 0.09), transparent 26%),
        radial-gradient(circle at 88% 18%, rgba(236, 72, 153, 0.075), transparent 22%);
      color: #0F172A;
      border-radius: 5px;
      box-shadow: 0 16px 42px rgba(0, 0, 0, 0.28);
      font-family: 'DM Sans', sans-serif;
      break-after: page;
      page-break-after: always;
      print-color-adjust: exact;
      -webkit-print-color-adjust: exact;

    .resumo-a4-page::before {
      content: '';
      position: absolute;
      inset: 7mm;
      border: 1.5px solid rgba(8, 47, 73, 0.25);
      border-radius: 13px 9px 15px 10px;
      pointer-events: none;
    }

    .resumo-a4-page::after {
      content: '';
      position: absolute;
      inset: 10mm;
      border-radius: 10px;
      background-image:
        linear-gradient(90deg, rgba(0, 200, 150, 0.1) 1px, transparent 1px),
        linear-gradient(0deg, rgba(15, 23, 42, 0.045) 1px, transparent 1px);
      background-size: var(--a4-grid, 32px) var(--a4-grid, 32px);
      opacity: 0.28;
      pointer-events: none;

    .resumo-a4-page--v1 { --a4-grid: 29px; --a4-tilt: -0.6deg; }
    .resumo-a4-page--v2 { --a4-grid: 34px; --a4-tilt: 0.45deg; }
    .resumo-a4-page--v3 { --a4-grid: 37px; --a4-tilt: -0.25deg; }

    .resumo-a4-content {

      z-index: 2;

      flex-direction: column;

    .resumo-a4-logo {

    .resumo-a4-logo-mark {

      height: 24px;

    .resumo-a4-student {

    .resumo-a4-title {

    }

    .resumo-a4-title h1 {

    .resumo-a4-title h1 span {

    .resumo-a4-title::after {
      content: '';

      background: linear-gradient(90deg, transparent, rgba(0, 200, 150, 0.72), rgba(236, 72, 153, 0.32), transparent);

    .resumo-a4-subtitle {

    .resumo-a4-page-label {

    .resumo-a4-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4.5mm;
      align-items: stretch;
      flex: 1;
      min-height: 0;
    }

    .resumo-a4-grid--balanced-grid {
      grid-template-areas:
        "top-left top-right"
        "bottom-left bottom-right";
      grid-template-rows: minmax(0, 1fr) minmax(0, 1fr);
    }

    .resumo-a4-grid--feature-right {
      grid-template-areas:
        "main figure"
        "main side"
        "wide wide";
      grid-template-rows: minmax(0, 1.05fr) minmax(0, 0.85fr) minmax(0, 1.05fr);
    }

    .resumo-a4-grid--wide-bottom {
      grid-template-areas:
        "main side"
        "main side2"
        "wide wide";
      grid-template-rows: minmax(0, 1.04fr) minmax(0, 0.92fr) minmax(0, 0.82fr);
    }

    .resumo-a4-grid--flow-wide {
      grid-template-areas:
        "main side"
        "main points"
        "flow flow";
      grid-template-rows: minmax(0, 1.02fr) minmax(0, 0.92fr) minmax(0, 0.62fr);
    }

    .resumo-a4-grid--notebook-diagnosis {
      grid-template-columns: 1.15fr 0.86fr 0.82fr;
      grid-template-areas:
        "main main figure"
        "diagnosis classification figure"
        "wide wide wide"
        "callout callout callout";
      grid-template-rows: minmax(0, 0.78fr) minmax(0, 0.86fr) minmax(0, 0.66fr) minmax(0, 0.48fr);
      gap: 3.2mm 4mm;
    }

    .resumo-a4-grid--notebook-treatment {
      grid-template-columns: 1.1fr 0.92fr 0.86fr;
      grid-template-areas:
        "main main side"
        "main main side2"
        "wide wide wide"
        "callout callout callout";
      grid-template-rows: minmax(0, 1fr) minmax(0, 0.78fr) minmax(0, 0.62fr) minmax(0, 0.44fr);
      gap: 3.2mm 4mm;
    }

    .resumo-a4-grid--notebook-crisis {
      grid-template-columns: 1fr 0.94fr 0.94fr;
      grid-template-areas:
        "main side side"
        "main points points"
        "flow flow flow"
        "wide wide wide";
      grid-template-rows: minmax(0, 0.95fr) minmax(0, 0.72fr) minmax(0, 0.55fr) minmax(0, 0.52fr);
      gap: 3.2mm 4mm;
    }

    .resumo-a4-slot--top-left { grid-area: top-left; }
    .resumo-a4-slot--top-right { grid-area: top-right; }
    .resumo-a4-slot--bottom-left { grid-area: bottom-left; }
    .resumo-a4-slot--bottom-right { grid-area: bottom-right; }
    .resumo-a4-slot--main { grid-area: main; }
    .resumo-a4-slot--side { grid-area: side; }
    .resumo-a4-slot--side2 { grid-area: side2; }
    .resumo-a4-slot--wide { grid-area: wide; }
    .resumo-a4-slot--figure { grid-area: figure; }
    .resumo-a4-slot--points { grid-area: points; }

    /* ── Markdown Reader ───────────────────────────────────────── */
    .markdown-body {
      font-family: 'Lexend', 'DM Sans', sans-serif;
      font-weight: 300;
      font-size: 1.0625rem;
      line-height: 1.75;
      color: #D1D9E6;
      user-select: text;
      -webkit-user-select: text;
    }

    /* Headings */
    .markdown-body h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 1.55rem;
      font-weight: 800;
      text-align: center;
      background: linear-gradient(135deg, #F1F5F9 0%, #38BDF8 55%, #00C896 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin: 6px 0 4px;
      padding-bottom: 14px;
      border-bottom: 2px solid rgba(0,200,150,0.25);
      line-height: 1.3;
      letter-spacing: 0;
    }

    /* Breadcrumb linha gerada via JS */
    .md-breadcrumb {
      text-align: center;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.72rem;
      color: #475569;
      margin: 0 0 2px;
      letter-spacing: 0.02em;
    }
    .md-breadcrumb .bc-item { color: #475569; font-weight: 500; }
    .md-breadcrumb .bc-item.current { color: #00C896; font-weight: 600; }
    .md-breadcrumb .bc-sep { color: #334155; margin: 0 5px; }

    /* Metadata pills geradas via JS */
    .md-meta {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 6px;
      margin: 8px 0 20px;
    }
    .md-meta-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: rgba(0,200,150,0.1);
      border: 1px solid rgba(0,200,150,0.2);
      border-radius: 20px;
      padding: 4px 12px;
      font-size: 0.84rem;
      color: #7DD3FC;
      font-family: 'DM Sans', sans-serif;
      font-weight: 500;
    }
    .markdown-body h2 {
      font-family: 'Outfit', sans-serif;
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--mint, #00C896);
      margin: 1.7rem 0 0.65rem;
      padding-left: 12px;
      border-left: 3px solid var(--mint, #00C896);
      line-height: 1.32;
    }
    .markdown-body h3 {
      font-family: 'Outfit', sans-serif;
      font-size: 1.14rem;
      font-weight: 600;
      color: #38BDF8;
      margin: 1.2rem 0 0.5rem;
      line-height: 1.38;
    }
    .markdown-body h4 {
      font-size: 1.02rem;
      font-weight: 600;
      color: #7DD3FC;
      margin: 1rem 0 0.35rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    /* Paragraphs & text */
    .markdown-body p { margin: 0 0 0.85em; }
    .markdown-body strong {
      font-family: 'DM Sans', sans-serif;
      font-weight: 700;
      color: #FFFFFF;
    }
    .markdown-body em { color: #94A3B8; font-style: italic; }

    /* Lists */
    .markdown-body ul, .markdown-body ol {
      padding-left: 1.3em;
      margin: 0.5em 0 0.9em;
    }
    .markdown-body li { margin: 0.35em 0; }
    .markdown-body ul li::marker { color: var(--mint, #00C896); }
    .markdown-body ol li::marker { color: var(--mint, #00C896); font-weight: 600; }
    .markdown-body li > ul, .markdown-body li > ol { margin: 0.2em 0 0.3em; }

    /* Blockquote — destaque / nota importante */
    .markdown-body blockquote {
      border-left: 3px solid #00C896;
      margin: 1em 0;
      padding: 10px 14px;
      background: rgba(0, 200, 150, 0.07);
      border-radius: 0 8px 8px 0;
      color: #94A3B8;
      font-style: italic;
    }
    .markdown-body blockquote p { margin: 0; }

    /* Inline code */
    .markdown-body code {
      background: rgba(0, 200, 150, 0.12);
      border: 1px solid rgba(0, 200, 150, 0.2);
      border-radius: 4px;
      padding: 1px 6px;
      font-size: 0.82em;
      font-family: 'Courier New', monospace;
      color: #67E8F9;
    }

    /* Code block */
    .markdown-body pre {
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px;
      padding: 14px 16px;
      overflow-x: auto;
      margin: 1em 0;
    }
    .markdown-body pre code {
      background: none;
      border: none;
      padding: 0;
      font-size: 0.83rem;
      color: #A5F3FC;
    }

    /* ── Flow Diagram Visual Components ─────────────────────── */
    .flow-box {
      position: relative;
      background: linear-gradient(140deg, rgba(0,200,150,0.07) 0%, rgba(56,189,248,0.07) 100%);
      border: 1px solid rgba(0,200,150,0.3);
      border-radius: 14px;
      padding: 38px 18px 20px;
      margin: 1.4em 0;
      overflow-x: auto;
    }
    .flow-box::before {
      content: "FLUXO";
      position: absolute;
      top: 10px; left: 14px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.58rem; font-weight: 700;
      letter-spacing: 0.14em;
      color: #00C896;
      background: rgba(0,200,150,0.12);
      border: 1px solid rgba(0,200,150,0.3);
      border-radius: 20px;
      padding: 2px 9px;
    }
    /* Shared step box */
    .flow-step {
      display: inline-flex; align-items: center; justify-content: center;
      padding: 7px 15px;
      border: 1.5px solid; border-radius: 9px;
      font-family: 'DM Sans', sans-serif; font-size: 0.82rem; font-weight: 600;
      text-align: center; line-height: 1.35; flex-shrink: 0;
    }
    .flow-step-dim { opacity: 0.72; border-style: dashed !important; }
    /* Vertical flow */
    .flow-v {
      display: flex; flex-direction: column;
      align-items: center; gap: 3px; padding: 4px 0;
    }
    .flow-v .flow-step { min-width: 200px; max-width: 90%; white-space: normal; }
    .flow-vc {
      color: #00C896; font-size: 1.35rem; line-height: 1.5;
      text-align: center; user-select: none;
    }
    .flow-vc-note {
      font-family: 'DM Sans', sans-serif; font-size: 0.74rem;
      color: #475569; text-align: center; line-height: 1.8;
    }
    .flow-vc-note span { color: #7DD3FC; }
    /* Horizontal flow */
    .flow-h {
      display: flex; flex-wrap: wrap;
      align-items: center; justify-content: center;
      gap: 5px; padding: 4px 0;
    }
    .flow-ha {
      color: #00C896; font-size: 1.05rem; font-weight: 700;
      flex-shrink: 0; padding: 0 1px; user-select: none;
    }
    /* Gene structure */
    .flow-gene .flow-step { font-size: 0.76rem; padding: 5px 11px; }
    .flow-gene .flow-ha { color: #475569; font-weight: 400; font-size: 0.85rem; }
    .flow-label {
      font-family: 'DM Sans', sans-serif; font-size: 0.8rem;
      color: #94A3B8; padding: 0 3px;
    }
    /* Branch annotation */
    .flow-branch {
      margin-top: 12px; padding-top: 10px;
      border-top: 1px dashed rgba(148,163,184,0.2);
      display: flex; flex-direction: column; align-items: center; gap: 5px;
    }
    .flow-branch-arr { color: #00C896; font-size: 1.2rem; line-height: 1.4; }
    .flow-branch-note {
      font-family: 'DM Sans', sans-serif; font-size: 0.77rem;
      color: #94A3B8; text-align: center;
    }
    .flow-branch-note .fba { color: #00C896; font-weight: 700; }
    .flow-step-branch { font-size: 0.79rem; }
    /* Raw fallback */
    .flow-raw {
      font-family: 'Lexend', 'DM Sans', sans-serif; font-size: 0.84rem;
      color: #E2E8F0; text-align: center; line-height: 1.9; white-space: pre-wrap;
    }

    /* Horizontal rule */
    .markdown-body hr {
      border: none;
      border-top: 1px solid rgba(255,255,255,0.1);
      margin: 1.5em 0;
    }

    /* Tables */
    .markdown-body .table-wrap {
      overflow-x: auto;
      border-radius: 10px;
      border: 1px solid rgba(0, 200, 150, 0.25);
      margin: 1.2em 0;
      background: rgba(255,255,255,0.04);
      box-shadow: 0 2px 12px rgba(0,0,0,0.2), inset 0 1px 0 rgba(0,200,150,0.08);
    }
    .markdown-body table {
      width: max-content;
      min-width: 100%;
      max-width: none;
      table-layout: auto;
      border-collapse: collapse;
      font-size: 0.98rem;
    }
    .markdown-body thead tr {
      background: rgba(0, 200, 150, 0.18);
      border-bottom: 2px solid rgba(0, 200, 150, 0.35);
    }
    .markdown-body th {
      padding: 10px 14px;
      font-weight: 600;
      color: #E2E8F0;
      text-align: left;
      white-space: nowrap;
      font-size: 0.92rem;
      letter-spacing: 0.02em;
      text-transform: none;
      word-break: normal;
      overflow-wrap: normal;
      hyphens: none;
    }
    .markdown-body td {
      padding: 9px 14px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      color: #CBD5E1;
      line-height: 1.5;
      white-space: normal;
      word-break: normal;
      overflow-wrap: normal;
      hyphens: none;
    }
    .markdown-body tbody tr:nth-child(even) { background: rgba(255,255,255,0.03); }
    .markdown-body tbody tr:last-child td { border-bottom: none; }
    .markdown-body tbody tr:hover { background: rgba(0, 200, 150, 0.07); transition: background 0.15s; }

    /* Checklist interativo */
    .markdown-body input[type="checkbox"] {
      accent-color: #00C896;
      cursor: pointer;
      width: 15px;
      height: 15px;
      vertical-align: middle;
      margin-right: 6px;
      flex-shrink: 0;
    }
    .markdown-body li:has(input[type="checkbox"]) {
      list-style: none;
      margin-left: -1.3em;
      display: flex;
      align-items: flex-start;
      gap: 2px;
      padding: 3px 0;
      border-radius: 6px;
      transition: background 0.15s;
    }
    .markdown-body li:has(input[type="checkbox"]:checked) {
      color: #475569;
      text-decoration: line-through;
      text-decoration-color: #334155;
    }

    /* Pré-Prova amber headings override */
    .markdown-body.preprova-content h2 {
      color: #FCD34D;
      border-left-color: #F59E0B;
    }
    html[data-theme="light"] .markdown-body.preprova-content h2 {
      color: #FCD34D !important;
      border-left-color: #F59E0B !important;
    }
    .markdown-body.preprova-content h3 { color: #FBBF24; }
    .markdown-body.preprova-content ul li::marker { color: #F59E0B; }
    .markdown-body.preprova-content blockquote {
      border-left-color: #F59E0B;
      background: rgba(245,158,11,0.07);
    }

    /* Profile Screen */
    .profile-avatar {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary), var(--purple));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: 700;
      font-family: 'Outfit', sans-serif;
      color: #fff;
      margin: 0 auto 8px;
      box-shadow: 0 4px 16px rgba(0, 200, 150, 0.3);
    }

    .profile-name {
      font-size: 18px;
      font-weight: 700;
      color: var(--text-primary);
      text-align: center;
      margin-bottom: 4px;
      font-family: 'Outfit', sans-serif;
    }

    .profile-meta {
      font-size: 13px;
      color: var(--text-secondary);
      text-align: center;
      margin-bottom: 24px;
    }

    .profile-section {
      background: var(--surface-2);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: var(--shadow-sm);
    }

    .profile-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 11px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .profile-item:last-child {
      border-bottom: none;
    }

    .profile-label {
      font-size: 12px;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 600;
    }

    .profile-value {
      font-size: 14px;
      color: var(--text-primary);
      font-weight: 600;
      word-break: break-all;
      text-align: right;
    }

    .profile-value-small {
      font-size: 11px;
      font-family: 'Courier New', monospace;
      color: var(--text-secondary);
    }

    .profile-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 16px;
    }

    .profile-stat {
      background: var(--surface-2);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      padding: 14px 12px;
      text-align: center;
      box-shadow: var(--shadow-sm);
    }

    .profile-stat-icon {
      font-size: 18px;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .profile-stat-value {
      font-size: 22px;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 4px;
      font-family: 'Outfit', sans-serif;
    }

    .profile-stat-label {
      font-size: 10px;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 600;
    }

    /* Dica instalar PWA (iOS Safari / Android Chrome) — só monta no JS em mobile */
    .app-install-hint {
      display: flex;
      flex-direction: column;
      gap: 10px;
      position: fixed;
      left: 12px;
      right: 12px;
      bottom: calc(16px + env(safe-area-inset-bottom, 0px));
      max-width: 420px;
      margin: 0 auto;
      z-index: 110;
      padding: 12px 12px 10px;
      border-radius: 14px;
      width: auto;
      background: rgba(15, 23, 42, 0.97);
      border: 1px solid rgba(0, 200, 150, 0.38);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
      font-size: 11px;
      line-height: 1.5;
      color: var(--text-primary, #E8EBF0);
    }

    html[data-theme="light"] .app-install-hint {
      background: rgba(255, 255, 255, 0.97);
      border-color: rgba(0, 200, 150, 0.28);
      box-shadow: 0 10px 36px rgba(0, 0, 0, 0.12);
    }

    .app-install-hint__row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }

    .app-install-hint__text {
      flex: 1;
      min-width: 0;
    }

    .app-install-hint__text strong {
      color: var(--primary, #00C896);
      font-weight: 700;
    }

    .app-install-hint__close {
      flex-shrink: 0;
      width: 30px;
      height: 30px;
      border: none;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-secondary);
      font-size: 15px;
      line-height: 1;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .app-install-hint__close:hover {
      background: rgba(255, 255, 255, 0.12);
    }

    html[data-theme="light"] .app-install-hint__close {
      background: rgba(0, 0, 0, 0.06);
    }

    .app-install-hint__never {
      width: 100%;
      padding: 9px 12px;
      border-radius: 10px;
      border: 1px solid rgba(148, 163, 184, 0.35);
      background: rgba(255, 255, 255, 0.04);
      color: var(--text-secondary);
      font-size: 11px;
      font-weight: 600;
      font-family: 'DM Sans', sans-serif;
      cursor: pointer;
      transition: border-color 0.15s ease, color 0.15s ease, background 0.15s ease;
    }

    .app-install-hint__never:hover {
      border-color: rgba(0, 200, 150, 0.45);
      color: var(--primary, #00C896);
      background: rgba(0, 200, 150, 0.08);
    }

    html[data-theme="light"] .app-install-hint__never {
      background: rgba(248, 250, 252, 0.9);
      border-color: rgba(0, 0, 0, 0.1);
    }

    /* Loading */
    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--border-card);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Semester Selector */
    .semester-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 24px;
    }

    .semester-btn {
      padding: 14px 8px;
      border: 2px solid var(--border-card);
      border-radius: 12px;
      background: var(--bg-card);
      color: var(--text-secondary);
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
      min-height: auto;
      text-transform: none;
      letter-spacing: 0;
    }

    .semester-btn:hover {
      border-color: var(--primary);
      color: var(--primary);
      background: rgba(0, 200, 150, 0.08);
      transform: none;
      box-shadow: none;
    }

    .semester-btn.selected {
      border-color: var(--primary);
      background: rgba(0, 200, 150, 0.15);
      color: var(--primary);
    }

    .institution-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 16px;
    }

    .institution-card {
      border: 1px solid var(--border-card);
      border-radius: 14px;
      padding: 14px;
      background: var(--bg-card);
      cursor: pointer;
      transition: all 0.2s ease;
      min-height: 92px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 8px;
    }

    .institution-card:hover {
      border-color: var(--primary);
      background: rgba(0, 200, 150, 0.08);
    }

    .institution-card.selected {
      border-color: var(--primary);
      background: rgba(0, 200, 150, 0.12);
      box-shadow: 0 0 0 1px rgba(0, 200, 150, 0.15) inset;
    }

    .institution-card.disabled {
      opacity: 0.5;
      cursor: not-allowed;
      filter: grayscale(0.15);
    }

    .institution-name {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1.3;
    }

    .institution-meta {
      font-size: 11px;
      color: var(--text-secondary);
      line-height: 1.4;
    }

    .institution-badge {
      display: inline-flex;
      align-items: center;
      width: fit-content;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      border-radius: 999px;
      padding: 4px 8px;
      background: rgba(0, 200, 150, 0.15);
      color: var(--primary);
    }

    .institution-badge.soon {
      background: rgba(255,255,255,0.08);
      color: var(--text-secondary);
    }

    .institution-helper {
      font-size: 12px;
      color: var(--text-secondary);
      margin-bottom: 12px;
      line-height: 1.5;
    }

    /* Auth cadastro passo 3: grids mais compactos para caber na viewport */
    .auth-institution-step .institution-grid {
      gap: 8px;
      margin-bottom: 10px;
    }
    .auth-institution-step .institution-card {
      min-height: 72px;
      padding: 10px 11px;
      border-radius: 12px;
      gap: 6px;
    }
    .auth-institution-step .institution-name {
      font-size: 13px;
    }
    .auth-institution-step .institution-meta {
      font-size: 10px;
      line-height: 1.35;
    }
    .auth-institution-step .institution-badge {
      font-size: 9px;
      padding: 3px 7px;
    }
    .auth-institution-step .institution-helper {
      margin-bottom: 8px;
    }

    /* Semester group headers in subject lists */
    .semester-group-header {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 1px;
      padding: 16px 0 8px;
      border-bottom: 1px solid var(--border-card);
      margin-bottom: 12px;
    }

    .semester-group-header:first-child {
      padding-top: 0;
    }

    /* Subject selection list (cleaner version) */
    .subject-select-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .subject-select-card {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px;
      background: var(--surface-2);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      cursor: pointer;
      transition: background var(--duration-fast) ease, border-color var(--duration-fast) ease, transform var(--duration-fast) var(--ease-spring), box-shadow var(--duration-fast) ease;
      box-shadow: var(--shadow-sm);
      min-height: 56px;
    }

    .subject-select-card:active {
      border-color: var(--primary);
      background: rgba(0, 200, 150, 0.08);
      transform: scale(0.98);
      box-shadow: none;
    }

    @media (hover: hover) {
      .subject-select-card:hover {
        border-color: var(--border-strong);
        background: var(--surface-3);
      }
    }

    /* Multi-select tema states */
    .subject-select-card.tema-selected {
      background: rgba(0, 200, 150, 0.10);
      border-color: var(--primary);
    }
    .tema-checkbox {
      width: 22px;
      height: 22px;
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 700;
      color: #fff;
      flex-shrink: 0;
      transition: background var(--duration-fast) ease, border-color var(--duration-fast) ease;
    }
    .tema-checkbox-checked {
      background: var(--primary);
      border-color: var(--primary);
    }

    /* Sticky bar de início */
    .tema-start-bar {
      position: sticky;
      bottom: 0;
      background: rgba(10, 22, 40, 0.94);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 10px;
      gap: 12px;
      animation: screenFadeIn 0.2s var(--ease-spring);
      box-shadow: 0 -8px 22px rgba(0, 0, 0, 0.22);
    }

    .subject-select-icon {
      width: 42px;
      height: 42px;
      border-radius: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }

    .subject-select-icon svg {
      width: 20px;
      height: 20px;
      stroke-width: 2;
    }

    .subject-select-info { flex: 1; min-width: 0; }

    .subject-select-name {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .subject-select-meta {
      font-size: 12px;
      color: var(--text-secondary);
    }

    /* Progress bar within subject card */
    .subject-progress-bar {
      height: 3px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 2px;
      margin-top: 6px;
      overflow: hidden;
    }

    .subject-progress-fill {
      height: 100%;
      border-radius: 2px;
      transition: width 600ms var(--ease-spring);
    }

    /* Search icon SVG */
    .subject-search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-secondary);
      pointer-events: none;
      display: flex;
      align-items: center;
      line-height: 0;
    }

    /* Semester tab filter */
    .semester-tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 20px;
      overflow-x: auto;
      padding-bottom: 4px;
      -webkit-overflow-scrolling: touch;
    }

    .semester-tabs::-webkit-scrollbar { display: none; }

    .semester-tab {
      padding: 8px 14px;
      border-radius: 20px;
      border: 1px solid var(--border-card);
      background: transparent;
      color: var(--text-secondary);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
      min-height: auto;
      text-transform: none;
      letter-spacing: 0;
    }

    .semester-tab:hover {
      transform: none;
      box-shadow: none;
    }

    .semester-tab.active {
      background: var(--primary);
      color: #000;
      border-color: var(--primary);
    }

    /* Back button */
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: none;
      border: none;
      color: var(--primary);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      padding: 8px 0;
      margin-bottom: 16px;
      text-transform: none;
      letter-spacing: 0;
      min-height: auto;
    }

    .back-btn:hover {
      background: none;
      transform: none;
      box-shadow: none;
      opacity: 0.8;
    }

    /* Utilities */
    .hidden {
      display: none !important;
    }

    .mt-2 { margin-top: 16px; }
    .mt-4 { margin-top: 24px; }
    .mb-2 { margin-bottom: 16px; }
    .mb-4 { margin-bottom: 24px; }

    .text-center { text-align: center; }

    /* Responsive */
    @media (max-height: 600px) {
      .screen-content {
        padding: 16px 12px calc(24px + env(safe-area-inset-bottom, 0px)) 12px;
      }

      .stat-card {
        padding: 12px;
      }

      .stat-value {
        font-size: 18px;
      }
    }

    /* Atlas: áreas invisíveis sobre alfinetes da foto — só foco visível para teclado */
    .atlas-pin-hitbox {
      outline: none;
    }
    .atlas-pin-hitbox:focus-visible {
      outline: 2px solid var(--primary, #00C896);
      outline-offset: 2px;
      border-radius: 4px;
    }

    /* Anatomia + Histologia: toolbar não pode usar .screen-content (flex:1), senão divide a altura com o ecrã abaixo */
    .anatomy-hist-toolbar {
      flex-shrink: 0;
      padding: 8px 16px 0;
    }

    .atlas-plate-title {
      font-family: Outfit, sans-serif;
      font-size: 20px;
      font-weight: 800;
      color: var(--text-primary);
      margin: 0;
      line-height: 1.28;
      letter-spacing: 0;
      overflow-wrap: anywhere;
    }

    .atlas-study-mode-bar {
      position: sticky;
      top: 0;
      z-index: 8;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 6px;
      margin-bottom: 14px;
      padding: 5px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.09);
      background: rgba(13,18,32,0.9);
      backdrop-filter: blur(12px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.18);
    }

    .atlas-study-mode-tab {
      min-width: 0;
      min-height: 40px;
      border-radius: 10px;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      font-family: Outfit, sans-serif;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      letter-spacing: 0;
      white-space: normal;
    }

    .atlas-study-mode-tab.is-active {
      background: rgba(96,165,250,0.18);
      color: #DBEAFE;
      box-shadow: inset 0 0 0 1px rgba(96,165,250,0.28);
    }

    .atlas-plate-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 16px;
      align-items: start;
    }

    .atlas-plate-media,
    .atlas-plate-legend {
      min-width: 0;
    }

    .atlas-plate-media {
      order: 1;
      width: 100%;
    }

    .atlas-plate-legend {
      order: 2;
    }

  <!-- Service Worker: registro + limpeza de SWs antigos de deploys anteriores -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        var refreshing = false;

        function showUpdateBanner(registration) {
          var banner = document.getElementById('updateBanner');
          var btn = document.getElementById('updateBannerBtn');
          if (!banner || !btn || !registration || !registration.waiting) return;
          banner.style.display = 'flex';
          btn.onclick = function() {
            btn.disabled = true;
            btn.innerText = 'Atualizando...';
            if (registration.waiting) {
              registration.waiting.postMessage({ type: 'SKIP_WAITING' });
            }
            // Fallback: se o controllerchange não disparar em 1.5s, força o reload
            setTimeout(function() { window.location.reload(true); }, 1500);
          };
        }

        // Limpar SWs de versões anteriores registrados em paths diferentes
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          registrations.forEach(function(reg) {
            var url = reg.active ? reg.active.scriptURL : (reg.installing ? reg.installing.scriptURL : '');
            if (!url.endsWith('/sw.js')) reg.unregister();
          });
        });

        // Registrar SW atual
        navigator.serviceWorker.register('/sw.js').then(function(registration) {
          if (registration.waiting) {
            showUpdateBanner(registration);
          }
          registration.addEventListener('updatefound', function() {
            var newWorker = registration.installing;
            if (!newWorker) return;
            newWorker.addEventListener('statechange', function() {
              if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                showUpdateBanner(registration);
              }
            });
          });
        }).catch(function(err) {
          console.warn('MedGrad+: SW registration failed:', err);
        });

        // Recarregar apenas depois de o usuário clicar em "Atualizar"
        navigator.serviceWorker.addEventListener('controllerchange', function() {
          if (refreshing) return;
          refreshing = true;
          window.location.reload();
        });

      });
    }
  </script>

        const el = document.createElement('div');
        el.className = 'toast toast-error';
        el.innerText = msg;
        document.body.appendChild(el);
        setTimeout(() => {
          el.classList.add('fade-out');
          setTimeout(() => el.remove(), 500);
        }, 3000);
      }
    };

    // ===================== Flow diagram parser =====================
    function buildFlowHTML(raw) {
      const COLORS = ['#00C896','#38BDF8','#A78BFA','#34D399','#FB923C','#F472B6'];
      function rgb(hex) {
        return [parseInt(hex.slice(1,3),16), parseInt(hex.slice(3,5),16), parseInt(hex.slice(5,7),16)];
      }
      function stepStyle(i, overrideColor) {
        const c = overrideColor || COLORS[i % COLORS.length];
        const [r,g,b] = rgb(c);
        return `border-color:${c};background:rgba(${r},${g},${b},0.13);color:${c}`;
      }
      function mkStep(text, idx, extra) {
        const plus = text.startsWith('+');
        const label = plus ? text.slice(1).trim() : text;
        const cls = 'flow-step' + (plus ? ' flow-step-dim' : '') + (extra || '');
        return `<div class="${cls}" style="${stepStyle(idx)}">${label}</div>`;
      }

      const lines = raw.split('\n').filter(l => l.trim());
      const trimmed = lines.map(l => l.trim());

      // ── Vertical flow (has standalone ↓ lines) ─────────────────
      if (trimmed.some(l => l === '↓')) {
        let html = '<div class="flow-v">'; let si = 0;
        for (const line of trimmed) {
          if (line === '↓') {
            html += '<div class="flow-vc">↓</div>';
          } else if (/^↓\s+(.+)$/.test(line)) {
            const note = line.match(/^↓\s+(.+)$/)[1];
            html += `<div class="flow-vc-note">↓ <span>${note}</span></div>`;
          } else {
            html += mkStep(line, si++);
          }
        }
        return html + '</div>';
      }

      // ── Gene structure ([Token] separated by ——) ──────────────
      const geneLine = trimmed.find(l => /\[.+\]/.test(l) && !l.includes('→'));
      if (geneLine) {
        const parts = geneLine.split('——').map(p => p.trim()).filter(Boolean);
        let html = '<div class="flow-h flow-gene">';
        parts.forEach((p, i) => {
          if (p.startsWith('[') && p.endsWith(']')) {
            const label = p.slice(1,-1);
            let c;
            if (/exon/i.test(label))        c = '#00C896';
            else if (/[íi]nton/i.test(label)) c = '#64748B';
            else if (/utr/i.test(label))    c = '#38BDF8';
            else if (/poly/i.test(label))   c = '#A78BFA';
            else                             c = '#FB923C';
            const [r,g,b] = rgb(c);
            html += `<div class="flow-step" style="border-color:${c};background:rgba(${r},${g},${b},0.13);color:${c}">${label}</div>`;
          } else {
            html += `<div class="flow-label">${p}</div>`;
          }
          if (i < parts.length - 1) html += '<div class="flow-ha">——</div>';
        });
        html += '</div>';
        const others = trimmed.filter(l => l !== geneLine);
        if (others.length) html += '<div class="flow-branch">' + others.map(l => `<div class="flow-branch-note">${l}</div>`).join('') + '</div>';
        return html;
      }

      // ── Horizontal flow (→ separators) ────────────────────────
      const mainLine = trimmed.find(l => l.includes('→'));
      if (!mainLine) {
        return '<div class="flow-raw">' + trimmed.join('<br>') + '</div>';
      }
      const branchLines = trimmed.filter(l => l !== mainLine);
      const steps = mainLine.split('→').map(s => s.trim()).filter(Boolean);
      let html = '<div class="flow-h">';
      steps.forEach((step, i) => {
        html += `<div class="flow-step" style="${stepStyle(i)}">${step}</div>`;
        if (i < steps.length - 1) html += '<div class="flow-ha">→</div>';
      });
      html += '</div>';

      if (branchLines.length) {
        html += '<div class="flow-branch">';
        let pendingArr = null;
        for (const bl of branchLines) {
          const arrMatch = bl.match(/^([↑↓]{1,2})\s*(.*)$/);
          if (arrMatch) {
            const [, arr, note] = arrMatch;
            if (note.trim()) {
              html += `<div class="flow-branch-note"><span class="fba">${arr}</span> ${note}</div>`;
            } else {
              pendingArr = arr;
            }
          } else if (bl.trim()) {
            if (pendingArr) { html += `<div class="flow-branch-arr">${pendingArr}</div>`; pendingArr = null; }
            const c = COLORS[steps.length % COLORS.length]; const [r,g,b] = rgb(c);
            html += `<div class="flow-step flow-step-branch" style="border-color:${c};background:rgba(${r},${g},${b},0.13);color:${c}">${bl}</div>`;
          }
        }
        if (pendingArr) html += `<div class="flow-branch-arr">${pendingArr}</div>`;
        html += '</div>';
      }
      return html;
    }

    function escapeFiguraIdAttr(id) {
      return String(id || '').replace(/[^A-Z0-9-]/gi, '');
    }

    function materialFigureNeedsWhiteBg(fig) {
      const bg = String((fig && (fig.fundoImagem || fig.fundo || fig.background)) || '').toLowerCase();
      return bg === 'branco' || bg === 'white';
    }

    /** HTML de figura inline (Wikimedia / catálogo); textos escapados para atributos. */
    function buildMaterialFigureHtml(fig) {
      const esc = (t) => String(t ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

        : '';
      return (

        `<span style="color:#e5e7eb;font-weight:600">${leg}</span>${cred}${lic}${link}</figcaption></figure>`
      );
    }

    const MATERIAL_FIG_PENDING_HTML = '';

    /**
     * Remove briefing visivel de Figura sugerida.
     * Figura-ID e IMG_SLOT viram slots inline; sem URL aprovada, nada aparece para o aluno.
     */
    function stripFiguraSugeridaBlocksForCliente(md) {
      if (!md || typeof md !== 'string') return md;
      const withCommentSlots = md.replace(
        /<!--\s*IMG_SLOT\b([\s\S]*?)-->/gi,
        (match, body) => {
          const attrId = body.match(/\bid\s*=\s*["']?([A-Z0-9-]+)["']?/i);
          const tokenId = body.match(/^\s*([A-Z0-9-]{4,})\b/i);
          const rawId = attrId?.[1] || tokenId?.[1] || '';
          const id = escapeFiguraIdAttr(rawId);
          return id ? `\n\n<div class="material-fig-slot" data-fig-id="${id}"></div>\n\n` : '';
        }
      );
      return withCommentSlots.replace(
        /(^|\n)### Figura sugerida[^\n]*\n([\s\S]*?)(?=\n---\s*\n|\n## |$)/g,
        (match, lead, body) => {
          const idMatch = body.match(/\*\*Figura-ID:\*\*\s*`?([A-Z0-9-]+)`?/i);
          if (idMatch) {
            const id = escapeFiguraIdAttr(idMatch[1]);
            if (!id) return match;
            return `${lead}\n\n<div class="material-fig-slot" data-fig-id="${id}"></div>\n\n`;
          }
          return `${lead}\n\n${MATERIAL_FIG_PENDING_HTML}\n\n`;
        }
      );
    }

    // ===================== Markdown renderer =====================
    function capitalizeFirstLetterForTableCell(text) {
      const s = String(text || '');
      const m = s.match(/^(\s*)([a-zà-öø-ÿ])/i);
      if (!m) return s;
      const i = m[1].length;
      return s.slice(0, i) + s.charAt(i).toLocaleUpperCase('pt-BR') + s.slice(i + 1);
    }

    function normalizeTableCellCasing(html) {
      const host = document.createElement('div');
      host.innerHTML = html;
      host.querySelectorAll('table th, table td').forEach((cell) => {
        // Só aplica em célula texto puro para não mexer em links/código interno.
        if (cell.children.length > 0) return;
        const current = cell.textContent || '';
        const next = capitalizeFirstLetterForTableCell(current);
        if (next !== current) cell.textContent = next;
      });
      return host.innerHTML;
    }

    function stripMdFrontmatter(md) {
      if (!md || typeof md !== 'string') return md;
      const normalized = String(md).replace(/^\uFEFF/, '').replace(/\r\n/g, '\n').replace(/\r/g, '\n');
      const start = normalized.trimStart();

      if (start.startsWith('---')) {
        const afterOpen = start.slice(3);
        const close = /\n---\s*(?:\n|$)/.exec(afterOpen);
        if (close) return afterOpen.slice(close.index + close[0].length);

        // Fallback for malformed YAML headers that lost the closing delimiter.
        const lines = start.split('\n');
        const titleIndex = lines.findIndex((line, idx) => idx > 0 && /^#\s+/.test(line));
        const headerLines = lines.slice(1, titleIndex > 0 ? titleIndex : Math.min(lines.length, 20));
        const yamlLike = headerLines.filter((line) => /^\s*[\w.-]+:\s*/.test(line)).length;
        if (titleIndex > 0 && yamlLike >= 2) return lines.slice(titleIndex).join('\n');
      }

      const lines = start.split('\n');
      const titleIndex = lines.findIndex((line, idx) => idx < 20 && /^#\s+/.test(line));
      if (titleIndex > 0) {
        const yamlKeys = /^(aula_id|materia|modulo|tema|versao_v3|status|gerado_em|revisado_em|checksum_lint|tags)\s*:/;
        const yamlLike = lines.slice(0, titleIndex).filter((line) => yamlKeys.test(line.trim())).length;
        if (yamlLike >= 2) return lines.slice(titleIndex).join('\n');
      }

      return normalized;
    }

    function renderMd(text) {
      const cleaned = stripFiguraSugeridaBlocksForCliente(
        String(stripMdFrontmatter(text) || '')
          .replace(/\r\n/g, '\n')
          .replace(/(\|[^\n]*)\n\n+(?=\|)/g, '$1\n')
      );
      let html = marked.parse(cleaned)
        .replace(/<table>/g, '<div class="table-wrap"><table>')
        .replace(/<\/table>/g, '</table></div>');
      html = normalizeTableCellCasing(html);
      html = html.replace(
        /<pre><code class="language-flow">([\s\S]*?)<\/code><\/pre>/g,
        (_, content) => {
          const raw = content
            .replace(/&amp;/g, '&').replace(/&lt;/g, '<')
            .replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&#39;/g, "'");
          return '<div class="flow-box">' + buildFlowHTML(raw) + '</div>';
        }
      );
      return html;
    }

      } catch { return 0; }

    function incrementFeedbackCount() {

    const FeedbackScreen = ({ currentMateria }) => {

    // ===================== Utilities =====================

    // Device Fingerprint
    const generateDeviceFingerprint = async () => {
      const userAgent = navigator.userAgent;
      const screen_res = `${screen.width}x${screen.height}`;
      const timezone = Intl.DateTimeFormat().resolvedOptions().timeZone;

      let canvas_hash = '';
      try {
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        ctx.fillText('MedGradPlus', 10, 10);
        canvas_hash = canvas.toDataURL().substring(0, 50);
      } catch (e) {}

      return `${userAgent.substring(0, 30)}_${screen_res}_${timezone}_${canvas_hash}`.substring(0, 128);
    };

    function isTermsCurrent(profile) {
      const email = normalizeAuthEmail(profile?.email || '');
      if (TERMS_EMERGENCY_ALLOWLIST.has(email)) return true;
      return String(profile?.termsVersionAccepted || '') === ACCOUNT_TERMS_VERSION;
    }

    function isAccountBlocked(profile) {
      return BLOCKED_ACCOUNT_STATUSES.has(String(profile?.accountStatus || 'active').toLowerCase());
    }

    function getSecuritySessionId() {
      try {
        const key = '_mgp_security_session_id';
        let value = sessionStorage.getItem(key);
        if (!value) {
          value = `sess_${Math.random().toString(36).slice(2)}_${Date.now().toString(36)}`;
          sessionStorage.setItem(key, value);
        }
        return value;
      } catch {
        return window.__mgpSessionToken || `sess_${Date.now()}`;
      }
    }

    async function callFirebaseSecurityFunction(url, body = {}, fbUser = null) {
      const currentUser = fbUser || window.__fbAuth?.currentUser || null;
      if (!currentUser?.getIdToken) throw new Error('Faça login novamente.');
      const token = await currentUser.getIdToken(true);
      const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
        body: JSON.stringify(body),
      });
      let payload = null;
      try { payload = await res.json(); } catch {}
      if (!res.ok) {
        const err = new Error(payload?.error || 'Falha de segurança da conta.');
        err.code = payload?.code || '';
        err.payload = payload;
        throw err;
      }
      return payload || {};
    }

    async function acceptTermsForFirebaseUser(fbUser) {
      const payload = await callFirebaseSecurityFunction(ACCEPT_TERMS_FUNCTION_URL, {
        termsVersion: ACCOUNT_TERMS_VERSION,
      }, fbUser);
      return {
        termsVersionAccepted: payload.termsVersion || ACCOUNT_TERMS_VERSION,
        termsAcceptedAt: payload.patch?.termsAcceptedAt || new Date().toISOString(),
        privacyAcceptedAt: payload.patch?.privacyAcceptedAt || new Date().toISOString(),
        accountStatus: payload.patch?.accountStatus || 'active',
      };
    }

    async function syncUserProfileAccessOnServer(fbUser, profile = {}) {

    async function recordSecurityHeartbeatForUser(profile = {}) {
      const currentUser = window.__fbAuth?.currentUser || null;
      if (!currentUser || profile?.isGuest) return null;
      const fingerprint = profile.deviceId || await generateDeviceFingerprint();
      return callFirebaseSecurityFunction(RECORD_SESSION_HEARTBEAT_FUNCTION_URL, {
        sessionId: getSecuritySessionId(),

      }, currentUser);

    /** Migra entradas antigas (newReps/newEf/newInterval) e garante reps/ef/interval/nextReview. */
    function normalizeSrEntry(raw) {
      if (raw == null || typeof raw !== 'object') return null;
      const reps = raw.reps != null ? raw.reps : raw.newReps;
      const ef = raw.ef != null ? raw.ef : raw.newEf;
      const interval = raw.interval != null ? raw.interval : raw.newInterval;
      const nextReview = raw.nextReview != null ? Number(raw.nextReview) : 0;
      return {
        ...raw,
        reps: reps != null ? reps : 0,
        ef: ef != null ? ef : 2.5,
        interval: interval != null ? interval : 0,
        nextReview,
      };
    }

    // SM-2 Algorithm
    const SM2 = {
      calculateNextReview: (quality, reps, ef, interval) => {
        const newReps = reps + 1;
        let newEf = ef + 0.1 - (5 - quality) * (0.08 + (5 - quality) * 0.02);
        if (newEf < 1.3) newEf = 1.3;

        let newInterval;
        if (newReps === 1) newInterval = 1;
        else if (newReps === 2) newInterval = 3;
        else newInterval = Math.round(interval * newEf);

        const nextReview = Date.now() + newInterval * 24 * 60 * 60 * 1000;
        return { reps: newReps, ef: newEf, interval: newInterval, nextReview };
      },

      /** Cards novos (sem sr) ou com nextReview <= agora; ignora buried. */
      getDueCards: (cards, srData) => {
        const now = Date.now();
        return cards
          .filter((card) => {
            const raw = srData[card.id];
            if (raw?.buried) return false;
            const data = normalizeSrEntry(raw);
            if (!data) return true;
            return data.nextReview <= now;
          })
          .sort((a, b) => {
            const aData = normalizeSrEntry(srData[a.id]) || { nextReview: 0 };
            const bData = normalizeSrEntry(srData[b.id]) || { nextReview: 0 };
            return aData.nextReview - bData.nextReview;
          });
      },

      /**
       * Só revisões agendadas: já respondidos pelo menos uma vez (reps >= 1),
       * com nextReview vencido; ignora enterrados e cards nunca estudados.
       */
      getDueReviewCards: (cards, srData) => {
        const now = Date.now();
        return cards
          .filter((card) => {
            const raw = srData[card.id];
            if (!raw || raw.buried) return false;
            const data = normalizeSrEntry(raw);
            if (!data || data.reps < 1) return false;
            return data.nextReview <= now;
          })
          .sort((a, b) => {
            const aData = normalizeSrEntry(srData[a.id]) || { nextReview: 0 };
            const bData = normalizeSrEntry(srData[b.id]) || { nextReview: 0 };
            return aData.nextReview - bData.nextReview;
          });
      },
    };

    // Format time
    const formatTime = (ms) => {
      const seconds = Math.floor(ms / 1000);
      const minutes = Math.floor(seconds / 60);
      const hours = Math.floor(minutes / 60);

      if (hours > 0) return `${hours}h ${minutes % 60}m`;
      if (minutes > 0) return `${minutes}m ${seconds % 60}s`;
      return `${seconds}s`;
    };

    const parseLocalJson = (key, fallback) => {
      try {
        const raw = localStorage.getItem(key);
        if (!raw) return fallback;
        return JSON.parse(raw);
      } catch (e) {
        return fallback;
      }
    };

    const readQuizHistory = () => {
      const raw = parseLocalJson('meduni9_quiz_history', []);
      return Array.isArray(raw) ? raw : [];
    };

    const summarizeQuizHistory = (history, options = {}) => {
      const todayOnly = options.todayOnly === true;
      const today = new Date().toDateString();
      let sessions = 0;
      let answered = 0;
      let correct = 0;

      (Array.isArray(history) ? history : []).forEach((entry) => {
        if (!entry || typeof entry !== 'object') return;
        const date = entry.date ? new Date(entry.date) : null;
        if (todayOnly && (!date || Number.isNaN(date.getTime()) || date.toDateString() !== today)) return;

        const total = Number(entry.total);
        const score = Number(entry.score);
        const safeTotal = Number.isFinite(total) && total > 0 ? total : 0;
        const safeScore = Number.isFinite(score) && score >= 0 ? Math.min(score, safeTotal || score) : 0;

        sessions += 1;
        answered += safeTotal;
        correct += safeScore;
      });

      return {
        sessions,
        answered,
        correct,
        accuracy: answered > 0 ? Math.round((correct / answered) * 100) : 0
      };
    };

    const normalizeScheduleDateKey = (value) => {
      const raw = String(value || '').trim();
      if (!raw) return '';
      const iso = raw.match(/^(\d{4})-(\d{2})-(\d{2})/);
      if (iso) return `${iso[1]}-${iso[2]}-${iso[3]}`;
      const br = raw.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})$/);
      if (br) return `${br[3]}-${br[2].padStart(2, '0')}-${br[1].padStart(2, '0')}`;
      const parsed = new Date(raw);
      return Number.isNaN(parsed.getTime()) ? '' : parsed.toISOString().slice(0, 10);
    };

    const scheduleDateToUtc = (dateKey) => {
      const key = normalizeScheduleDateKey(dateKey);
      return key ? new Date(`${key}T12:00:00.000Z`) : null;
    };

    const scheduleAddDays = (dateKey, days) => {
      const date = scheduleDateToUtc(dateKey);
      if (!date) return '';
      date.setUTCDate(date.getUTCDate() + days);
      return date.toISOString().slice(0, 10);
    };

    const compareScheduleDateKeys = (a, b) => {
      const aa = normalizeScheduleDateKey(a);
      const bb = normalizeScheduleDateKey(b);
      if (!aa && !bb) return 0;
      if (!aa) return -1;
      if (!bb) return 1;
      return aa.localeCompare(bb);
    };

    const isScheduleWeekday = (dateKey) => {
      const date = scheduleDateToUtc(dateKey);
      if (!date) return false;
      const day = date.getUTCDay();
      return day >= 1 && day <= 5;
    };

    const getScheduleDateInBrasilia = (date = new Date()) => {
      const parts = new Intl.DateTimeFormat('en-CA', {
        timeZone: STUDY_SCHEDULE_TZ,
        year: 'numeric',
        month: '2-digit',
        day: '2-digit',
      }).formatToParts(date);
      const map = Object.fromEntries(parts.map((part) => [part.type, part.value]));
      return `${map.year}-${map.month}-${map.day}`;
    };

    const scheduleWeekdaysBetween = (startKey, endExclusiveKey) => {
      let cur = normalizeScheduleDateKey(startKey);
      const end = normalizeScheduleDateKey(endExclusiveKey);
      const out = [];
      if (!cur || !end || compareScheduleDateKeys(cur, end) >= 0) return out;
      while (compareScheduleDateKeys(cur, end) < 0) {
        if (isScheduleWeekday(cur)) out.push(cur);
        cur = scheduleAddDays(cur, 1);
      }
      return out;
    };

    const formatScheduleDate = (dateKey, options = {}) => {
      const date = scheduleDateToUtc(dateKey);
      if (!date) return '';
      return new Intl.DateTimeFormat('pt-BR', {

        weekday: options.weekday ? 'short' : undefined,
        day: '2-digit',
        month: '2-digit',
      }).format(date).replace('.', '');

      return `${STUDY_SCHEDULE_LOCAL_PREFIX}${String(id).replace(/[^a-z0-9_.-]/gi, '_')}`;
    };

    const normalizeScheduleIdPart = (value) => String(value || '')
      .normalize('NFD')
      .replace(/[\u0300-\u036f]/g, '')
      .toLowerCase()
      .replace(/[^a-z0-9]+/g, '_')
      .replace(/^_+|_+$/g, '') || 'na';

    const buildStudyTemplateId = (user, schedule) => [

      normalizeScheduleIdPart(user?.campusId || 'vergueiro'),

    const getMateriaLessonIds = (materia) => (Array.isArray(materia?.aulas) ? materia.aulas : [])

    const findMateriaLesson = (materias, aulaId) => {
      const id = String(aulaId || '');
      for (const materia of materias || []) {
        const aula = (materia.aulas || []).find((a) => a.id === id);
        if (aula) return { materia, aula };
      }
      return null;
    };

    const cleanLessonsByMateria = (materias, rawMap) => {
      const result = {};
      const byId = new Map((materias || []).map((m) => [m.id, m]));
      Object.entries(rawMap && typeof rawMap === 'object' ? rawMap : {}).forEach(([materiaId, list]) => {
        const materia = byId.get(materiaId);
        if (!materia) return;
        const valid = new Set(getMateriaLessonIds(materia));
        result[materia.id] = [...new Set((Array.isArray(list) ? list : []).filter((id) => valid.has(id)))];
      });
      return result;
    };

    const buildDefaultP2LessonsForSchedule = (materias, p1LessonsByMateria) => {
      const cleanP1 = cleanLessonsByMateria(materias, p1LessonsByMateria);
      const result = {};
      (materias || []).forEach((materia) => {
        const p1 = new Set(cleanP1[materia.id] || []);
        result[materia.id] = getMateriaLessonIds(materia).filter((id) => !p1.has(id));

    const normalizeStudySchedule = (schedule, user, materias) => {
      const safe = schedule && typeof schedule === 'object' ? schedule : {};
      const room = String(safe.room || '').trim().toUpperCase();
      const moduleNum = Number(safe.module || user?.modulo || user?.semestre || 1) || 1;
      const p1Lessons = cleanLessonsByMateria(materias, safe.p1LessonsByMateria);
      const p2Lessons = cleanLessonsByMateria(
        materias,
        Object.keys(safe.p2LessonsByMateria || {}).length ? safe.p2LessonsByMateria : buildDefaultP2LessonsForSchedule(materias, p1Lessons)

      return {
        timezone: STUDY_SCHEDULE_TZ,
        module: moduleNum,
        room: STUDY_ROOMS.includes(room) ? room : 'A',
        dailyTarget: Math.max(1, Math.min(12, Number(safe.dailyTarget) || 2)),
        examDates: {
          p1: normalizeScheduleDateKey(safe.examDates?.p1),
          p2: normalizeScheduleDateKey(safe.examDates?.p2),
          av2: normalizeScheduleDateKey(safe.examDates?.av2),

        manualItems: (Array.isArray(safe.manualItems) ? safe.manualItems : []).slice(0, 120).map((item, idx) => {
          const found = findMateriaLesson(materias, item?.aulaId);

            id: String(item?.id || `manual:${Date.now()}:${idx}`),
            date: normalizeScheduleDateKey(item?.date) || getScheduleDateInBrasilia(),
            materiaId: String(item?.materiaId || found?.materia?.id || ''),
            aulaId: item?.aulaId ? String(item.aulaId) : '',
            title: String(item?.title || found?.aula?.tema || 'Tema manual').slice(0, 140),
          };
        }).filter((item) => item.materiaId),
        completedItems: [...new Set((Array.isArray(safe.completedItems) ? safe.completedItems : []).map(String))].slice(0, 1000),
        source: ['manual', 'ai_draft', 'template'].includes(safe.source) ? safe.source : 'manual',
        generatedAt: safe.generatedAt || '',

    };

    const buildLessonStudyItems = ({ phase, lessonMap, materias, days, dailyTarget }) => {
      const out = [];
      const target = Math.max(1, Math.min(12, Number(dailyTarget) || 2));
      if (!days.length) return out;
      const byId = new Map((materias || []).map((m) => [m.id, m]));
      const queue = [];
      Object.entries(lessonMap || {}).forEach(([materiaId, lessonIds]) => {
        const materia = byId.get(materiaId);
        if (!materia) return;
        const aulasById = new Map((materia.aulas || []).map((aula) => [aula.id, aula]));
        (lessonIds || []).forEach((lessonId) => {
          const aula = aulasById.get(lessonId);
          if (aula) queue.push({ materia, aula });
        });
      });
      let dayIdx = 0;
      let countOnDay = 0;
      queue.forEach(({ materia, aula }) => {
        if (countOnDay >= target && dayIdx < days.length - 1) {
          dayIdx += 1;
          countOnDay = 0;
        }
        out.push({
          id: `lesson:${phase}:${materia.id}:${aula.id}`,
          date: days[dayIdx],
          phase,
          materiaId: materia.id,
          aulaId: aula.id,
          title: `${materia.sigla || materia.nome}: ${aula.tema || aula.id}`,
          manual: false,
        });
        countOnDay += 1;
      });
      return out;
    };

    const generateStudyScheduleItems = (schedule, materias, options = {}) => {
      if (!schedule) return [];
      const today = normalizeScheduleDateKey(options.todayKey) || getScheduleDateInBrasilia();
      const p1 = normalizeScheduleDateKey(schedule.examDates?.p1);

      const p1Lessons = cleanLessonsByMateria(materias, schedule.p1LessonsByMateria);

      const p1Items = p1 ? buildLessonStudyItems({

        materias,
        days: scheduleWeekdaysBetween(today, p1),
        dailyTarget: schedule.dailyTarget,
      }) : [];

      const av2Start = p2 && compareScheduleDateKeys(scheduleAddDays(p2, 1), today) > 0 ? scheduleAddDays(p2, 1) : today;

      const av2ReviewItems = av2Days.length ? [

      const av2Items = av2 ? buildLessonStudyItems({

      const body = {
        tipo: 'bug',

        '/api/feedback/raw/create',
        'http://127.0.0.1:3001/api/feedback/raw/create',
        'http://localhost:3001/api/feedback/raw/create',
      ];

      for (const endpoint of endpoints) {
        try {
          const res = await fetch(endpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body),
          });
          if (!res.ok) continue;
          const contentType = res.headers.get('content-type') || '';
          if (!contentType.includes('application/json')) continue;
          const data = await res.json();
          if (data.ok) return data;
        } catch {}
