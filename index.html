    const AiChat = ({ user, navigateTo, routeState, currentTab }) => {
      const [isOpen, setIsOpen] = React.useState(false);
      const [messages, setMessages] = React.useState([]);
      const [input, setInput] = React.useState('');
      const [loading, setLoading] = React.useState(false);
      const messagesEndRef = React.useRef(null);

      // Trava de segurança: Apenas usuários Prime/Assinantes (exclui gratuito e trial)
      const isPremium = user && ( (user.plano && user.plano !== 'gratuito' && user.plano !== 'trial') || !!user.ambassadorId || user.email === 'pngjaico@gmail.com' );
      if (!isPremium) return null;

      const scrollToBottom = () => {
        messagesEndRef.current?.scrollIntoView({ behavior: "smooth" });
      };

      React.useEffect(() => {
        scrollToBottom();
      }, [messages, loading]);

      const renderMessageContent = (text) => {
        if (!text) return null;
        const parts = text.split(/(\[[^\]]+\]\(#[^\)]+\)|\*\*[^*]+\*\*)/g);
        return parts.map((part, i) => {
          const linkMatch = part.match(/\[([^\]]+)\]\((#[^\)]+)\)/);
          if (linkMatch) {
            return React.createElement('a', { 
              key: i, 
              href: linkMatch[2],
              onClick: () => {
                if (window.innerWidth < 600) setIsOpen(false);
              }
            }, linkMatch[1]);
          }
          const boldMatch = part.match(/\*\*([^*]+)\*\*/);
          if (boldMatch) {
            return React.createElement('strong', { key: i }, boldMatch[1]);
          }
          return part;
        });
      };

      const handleAction = (action) => {
        if (!action || !action.tab || typeof navigateTo !== 'function') return;
        const opts = {
          materiaId: action.materiaId || null,
          aulaId: action.aulaId || null,
        };
        navigateTo(action.tab, opts);
        try {
          if (window.innerWidth < 600) setIsOpen(false);
        } catch (_) {}
      };

      const renderActions = (actions) => {
        const list = Array.isArray(actions) ? actions.filter(a => a && a.tab && a.label).slice(0, 3) : [];
        if (!list.length) return null;
        return React.createElement('div', { className: 'ai-chat-actions' },
          list.map((action, idx) => React.createElement('button', {
            key: `${action.tab || 'go'}-${action.materiaId || ''}-${action.aulaId || ''}-${idx}`,
            type: 'button',
            className: 'ai-chat-action-btn',
            onClick: () => handleAction(action),
            title: action.label,
          }, React.createElement('span', { 'aria-hidden': true }, '→'), action.label))
        );
      };

      const handleSend = async () => {
        if (!input.trim() || loading) return;
        setMessages(prev => [...prev, { role: 'user', text: input }]);
        const currentInput = input;
        setInput('');
        setLoading(true);

        try {
          const currentFirebaseUser = window.__fbAuth?.currentUser || null;
          const idToken = currentFirebaseUser?.getIdToken ? await currentFirebaseUser.getIdToken() : '';
          if (!idToken) throw new Error('Faça login novamente para usar a IA com segurança.');
          const res = await fetch('https://southamerica-east1-medgradplus.cloudfunctions.net/geminiSupport', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${idToken}`
            },
            body: JSON.stringify({
              prompt: currentInput,
              history: messages.slice(-6).map(m => ({ role: m.role, text: m.text })),
              route: {
                tab: currentTab || routeState?.tab || 'home',
                materiaId: routeState?.materiaId || null,
                aulaId: routeState?.aulaId || null
              }
            })
          });
          const data = await res.json();
          if (data.error) throw new Error(data.error);
          setMessages(prev => [...prev, { role: 'ai', text: data.response, actions: Array.isArray(data.actions) ? data.actions : [] }]);
        } catch (e) {
          const msg = e?.message || 'Estamos com uma instabilidade momentânea nos serviços de IA. Por favor, tente novamente em alguns instantes.';
          setMessages(prev => [...prev, { role: 'ai', text: msg, actions: [] }]);
        } finally {
          setLoading(false);
        }
      };

      return (
        React.createElement(React.Fragment, null,
          !isOpen && React.createElement('button', { 
            className: 'ai-chat-fab', 
            onClick: () => setIsOpen(true),
            title: 'Chat de Suporte IA'
          }, '💬'),
          isOpen && React.createElement('div', { className: 'ai-chat-window' },
            React.createElement('div', { className: 'ai-chat-header' },
              React.createElement('div', { className: 'ai-chat-header-info' },
                React.createElement('div', { className: 'ai-chat-header-status' }),
                React.createElement('span', { style: { fontWeight: 700, fontSize: '15.5px', color: '#FFF' } }, 'Monitor de Elite')
              ),
              React.createElement('button', { 
                className: 'ai-chat-close', 
                onClick: () => setIsOpen(false) 
              }, '✕')
            ),
            React.createElement('div', { className: 'ai-chat-messages' },
              messages.length === 0 && React.createElement('div', { className: 'ai-chat-bubble ai-chat-bubble--ai' }, 
                'Olá! Sou o Monitor de Elite. Como posso ajudar na sua jornada hoje?'
              ),
              messages.map((m, i) => 
                React.createElement('div', { 
                  key: i, 
                  className: `ai-chat-bubble ai-chat-bubble--${m.role}` 
                },
                  renderMessageContent(m.text),
                  m.role === 'ai' ? renderActions(m.actions) : null
                )
              ),
              loading && React.createElement('div', { className: 'ai-chat-bubble ai-chat-bubble--ai' }, 'Digitando...'),
              React.createElement('div', { ref: messagesEndRef })
            ),
            React.createElement('div', { className: 'ai-chat-input-area' },
              React.createElement('input', {
                className: 'ai-chat-input',
                value: input,
                onChange: e => setInput(e.target.value),
                onKeyPress: e => e.key === 'Enter' && handleSend(),
                placeholder: 'Tire sua dúvida acadêmica...'
              }),
              React.createElement('button', { 
                className: 'ai-chat-send', 
                onClick: handleSend, 
                disabled: loading 
              }, '➤')
            )
          )
        )
      );
    };

    const PERSISTENT_SIDEBAR_MEDIA = '(min-width: 1200px), (min-width: 700px) and (min-height: 560px) and (orientation: landscape)';

    function isPersistentSidebarViewport() {
      return typeof window !== 'undefined' &&
        window.matchMedia &&
        window.matchMedia(PERSISTENT_SIDEBAR_MEDIA).matches;
    }

    const MedGradPlusApp = () => {
      const VALID_TABS = ['home', 'cards', 'quiz', 'materials', 'feedback', 'about', 'profile', 'anatomy_hist', 'ambassador', 'gradbook'];
      const parseRouteFromHash = () => {
        const raw = window.location.hash.replace(/^#/, '').trim();
        if (raw === 'about-public') {
          return {
            tab: 'about',
            materiaId: null,
            aulaId: null,
            publicOnly: true,
          };
        }
        const [tabRaw, materiaRaw, aulaRaw] = raw.split(':');
        let resolvedTab = tabRaw;
        if (tabRaw === 'anatomy') resolvedTab = 'anatomy_hist';
        if (tabRaw === 'histology') resolvedTab = 'anatomy_hist';
        const tab = VALID_TABS.includes(resolvedTab) ? resolvedTab : 'home';
        let materiaId = materiaRaw ? decodeURIComponent(materiaRaw) : null;
        if (tabRaw === 'anatomy' && !materiaId) materiaId = 'anatomy';
        if (tabRaw === 'histology' && !materiaId) materiaId = 'histology';
        if (tab === 'anatomy_hist' && !materiaId) materiaId = 'anatomy';
        return {
          tab,
          materiaId,
          aulaId: aulaRaw ? decodeURIComponent(aulaRaw) : null,
          publicOnly: false,
        };
      };
      const buildHash = ({ tab, materiaId, aulaId }) => {
        const parts = [tab || 'home'];
        if (tab === 'anatomy_hist') {
          if (materiaId && materiaId !== 'anatomy') parts.push(encodeURIComponent(materiaId));
          if (aulaId) parts.push(encodeURIComponent(aulaId));
          return `#${parts.join(':')}`;
        }
        if (materiaId) parts.push(encodeURIComponent(materiaId));
        if (aulaId) parts.push(encodeURIComponent(aulaId));
        return `#${parts.join(':')}`;
      };
      const initialRoute = parseRouteFromHash();

      const [stage, setStage] = useState('splash'); // splash, auth, app
      const [user, setUser] = useState(null);
      const [routeState, setRouteState] = useState(initialRoute);
      const [currentTab, setCurrentTab] = useState(initialRoute.tab);

      // Monitor de conflito de sessão (Multi-dispositivos)
      useEffect(() => {
        if (!user || !user.uid || stage !== 'app' || user.isGuest) return;
        if (!window.__fbFirestore || !window.__fbDb) return;

        const { doc, onSnapshot } = window.__fbFirestore;
        const unsubscribe = onSnapshot(doc(window.__fbDb, 'users', user.uid), (snap) => {
          if (!snap.exists()) return;
          const data = snap.data();
          if (isAccountBlocked(data)) {
            alert('Conta suspensa ou banida. Entre em contato com o suporte.');
            handleLogout();
            return;
          }
          // Dois aparelhos sao uso normal. A troca de sessao agora so gera telemetria/fila.
          if (data.sessionToken && data.sessionToken !== window.__mgpSessionToken) {
            console.info('[security] outra sessao detectada; mantendo acesso e deixando a Cloud Function avaliar risco.');
          }
        });
        return () => unsubscribe();
      }, [user?.uid, stage]);
      const [quizMode, setQuizMode] = useState('todas');
      const isAmbassadorUser = !!(user?.ambassadorId || user?.ambassadorVitalicio || user?.couponCode);
      const [darkMode, setDarkMode] = useState(() => {
        const saved = localStorage.getItem('meduni9_theme');
        return saved ? saved !== 'light' : true;
      });

      useEffect(() => {
        document.documentElement.setAttribute('data-theme', darkMode ? 'dark' : 'light');
        localStorage.setItem('meduni9_theme', darkMode ? 'dark' : 'light');
      }, [darkMode]);

      const renderThemeToggle = () => (
        <button
          className="theme-toggle-btn"
          onClick={() => setDarkMode(d => !d)}
          title={darkMode ? 'Modo claro' : 'Modo escuro'}
          aria-label={darkMode ? 'Ativar modo claro' : 'Ativar modo escuro'}
        >
          {darkMode ? (
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
          ) : (
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          )}
        </button>
      );

      const [sidebarOpen, setSidebarOpen] = useState(() => isPersistentSidebarViewport());

      useEffect(() => {
        if (typeof window === 'undefined' || !window.matchMedia) return undefined;
        const media = window.matchMedia(PERSISTENT_SIDEBAR_MEDIA);
        const syncSidebarForViewport = () => setSidebarOpen(media.matches);
        syncSidebarForViewport();
        if (media.addEventListener) {
          media.addEventListener('change', syncSidebarForViewport);
          return () => media.removeEventListener('change', syncSidebarForViewport);
        }
        if (media.addListener) {
          media.addListener(syncSidebarForViewport);
          return () => media.removeListener(syncSidebarForViewport);
        }
        return undefined;
      }, []);

      const navigateTo = (tab, options = {}) => {
        if (tab === 'about') {
          const em = user?.email;
          window.location.href = (em && !user?.isGuest && /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em))
            ? `landing.html?email=${encodeURIComponent(em)}`
            : 'landing.html';
          return;
        }
        const resolvedTab = VALID_TABS.includes(tab) ? tab : 'home';
        if (resolvedTab === 'quiz') {
          setQuizMode('essenciais');
        }
        const materiaIdForAnatomyHist = options.materiaId !== undefined ? options.materiaId : 'anatomy';
        const nextRoute = {
          tab: resolvedTab,
          materiaId: resolvedTab === 'anatomy_hist' ? materiaIdForAnatomyHist : (options.materiaId || null),
          aulaId: options.aulaId || null,
          publicOnly: !!options.publicOnly,
        };
        setRouteState(nextRoute);
        setCurrentTab(nextRoute.tab);
        const nextHash = nextRoute.publicOnly ? '#about-public' : buildHash(nextRoute);
        if (window.location.hash !== nextHash) {
          window.location.hash = nextHash;
        }
        try {
          if (!isPersistentSidebarViewport()) setSidebarOpen(false);
        } catch (_) {}
      };
      const [materias, setMaterias] = useState([]);
      const [flashcards, setFlashcards] = useState([]);
      const [questoesAntigas, setQuestoesAntigas] = useState([]);
      const [allowedLessonIds, setAllowedLessonIds] = useState(null);
      const [selectedMateria, setSelectedMateria] = useState(null);
      const [homeMateriaPicker, setHomeMateriaPicker] = useState({ open: false, materiaId: null, materiaNome: '' });
      const [loading, setLoading] = useState(true);
      const [showInstallTip, setShowInstallTip] = useState(false);
      const [installTipPlatform, setInstallTipPlatform] = useState('ios');

      const goHome = () => {
        setSelectedMateria(null);
        setHomeMateriaPicker({ open: false, materiaId: null, materiaNome: '' });
        navigateTo('home');
      };

      // Dica “adicionar à tela inicial” (iOS Safari / Android Chrome). Mostra a cada visita até “Não mostrar novamente”.
      useEffect(() => {
        try {
          if (localStorage.getItem('meduni9_install_tip_never_again') === '1') return;
          if (localStorage.getItem('meduni9_dismiss_ios_install_tip')) return;
          const isStandalone =
            window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
          if (isStandalone) return;
          const ua = navigator.userAgent || '';
          const isIos =
            /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
          const isAndroid = /Android/i.test(ua);
          if (isIos) {
            setInstallTipPlatform('ios');
            setShowInstallTip(true);
          } else if (isAndroid) {
            setInstallTipPlatform('android');
            setShowInstallTip(true);
          }
        } catch (_) {}
      }, []);

      // Auth state refs (stable across renders, safe in closures)
      const splashDoneRef = useRef(false);
      const authStateRef  = useRef(undefined); // undefined = resolving | null = no user | object = profile

      useEffect(() => {
        const handleHashChange = () => {
          const nextRoute = parseRouteFromHash();
          if (nextRoute.tab === 'quiz') {
            setQuizMode('essenciais');
          }
          setRouteState(nextRoute);
          setCurrentTab(nextRoute.tab);
        };
        window.addEventListener('hashchange', handleHashChange);
        return () => window.removeEventListener('hashchange', handleHashChange);
      }, []);

      useEffect(() => {
        if (routeState.tab === 'cards' || routeState.tab === 'quiz' || routeState.tab === 'feedback') {
          setSelectedMateria(routeState.materiaId || null);
        }
      }, [routeState.tab, routeState.materiaId]);

      useEffect(() => {
        if (routeState.tab === 'quiz') {
          setQuizMode('essenciais');
        }
      }, [routeState.tab]);

      useEffect(() => {
        if (currentTab === 'ambassador' && !isAmbassadorUser) {
          navigateTo('home');
        }
      }, [currentTab, isAmbassadorUser]);

      const applyResolvedAuth = (profile) => {
        if (profile) { setUser(normalizeUserProfile(profile)); setStage('app'); }
        else          { setStage('auth'); }
      };

      // Firebase Auth listener: splash is short; unresolved auth keeps this screen until the listener returns.
      useEffect(() => {
        if (!window.__fbAuth || !window.__fbAuthFns || !window.__fbFirestore) {
          // Fallback: Firebase SDK unavailable — use localStorage cache
          const cached = localStorage.getItem('_mgp_sess_v8');
          authStateRef.current = cached ? JSON.parse(cached) : null;
          if (splashDoneRef.current) applyResolvedAuth(authStateRef.current);
          return;
        }
        const { onAuthStateChanged, signOut: fbSignOut } = window.__fbAuthFns;
        const unsubscribe = onAuthStateChanged(window.__fbAuth, async (firebaseUser) => {
          const APP_VERSION = 'v700-BMF-PURGED-STABLE'; // Timestamp/versão para cache-busting do JSON data
          if (firebaseUser) {
            let cachedProfile = null;
            try {
              const cached = localStorage.getItem('_mgp_sess_v8');
              if (cached) {
                const p = JSON.parse(cached);
                if (p.uid === firebaseUser.uid) cachedProfile = normalizeUserProfile(p);
              }
            } catch {}
            try {
              const p = await loadUserProfile(firebaseUser);
              if (p) {
                const synced = await syncProfileAccessFromCodeEntry(firebaseUser, p);
                const syncedEmail = await syncProfileAccessFromEmailGrant(firebaseUser, synced);
                const qualified = await checkAmbassadorQualification(syncedEmail);
                if (isAccountBlocked(qualified)) {
                  try { await fbSignOut(window.__fbAuth); } catch {}
                  authStateRef.current = null;
                  if (splashDoneRef.current) applyResolvedAuth(null);
                  return;
                }
                if (!isTermsCurrent(qualified)) {
                  authStateRef.current = null;
                  if (splashDoneRef.current) applyResolvedAuth(null);
                  return;
                }
                // TAKE OVER SESSION: Garantir que o Firestore tenha o token desta aba/dispositivo
                const withSession = buildSessionTrackedProfile(qualified);
                await saveUserProfile(firebaseUser, withSession, { merge: true });
                const normalized = persistLocalUser(withSession);
                authStateRef.current = normalized;
                if (splashDoneRef.current) applyResolvedAuth(withSession);
              } else {
                let grantPending = null;
                try {
                  grantPending = await loadEmailAccessGrant(firebaseUser.email);
                } catch {}
                if (grantPending && isEmailGrantValid(grantPending)) {
                  authStateRef.current = null;
                  if (splashDoneRef.current) applyResolvedAuth(null);
                } else if (cachedProfile) {
                  authStateRef.current = cachedProfile;
                  if (splashDoneRef.current) applyResolvedAuth(cachedProfile);
                } else {
                  authStateRef.current = null;
                  if (splashDoneRef.current) applyResolvedAuth(null);
                }
              }
            } catch {
              authStateRef.current = cachedProfile;
              if (splashDoneRef.current) applyResolvedAuth(cachedProfile);
            }
          } else {
            localStorage.removeItem('_mgp_sess_v8');
            authStateRef.current = null;
            if (splashDoneRef.current) applyResolvedAuth(null);
          }
        });
        return () => unsubscribe();
      }, []); // eslint-disable-line

      useEffect(() => {
        // Load data when app starts
        if (stage === 'app' && loading) {
          loadAppData();
        }
      }, [stage, loading]);

      const loadAppData = async () => {
        try {
          const APP_VERSION = 'v1.0.' + Date.now();
          // Load data from external JSON files with cache-busting
          const [materiasRes, flashcardsRes] = await Promise.all([
            fetch(`data/materias.json?v=${APP_VERSION}`).catch(() => null),
            fetch(`data/flashcards.json?v=${APP_VERSION}`).catch(() => null)
          ]);

          let materiasData = [];
          let flashcardsData = [];
          let legacyMateriasRaw = {};

          if (materiasRes && materiasRes.ok) {
            const raw = await materiasRes.json();
            legacyMateriasRaw = raw || {};
            materiasData = Object.entries(raw)
              .filter(([k]) => !k.startsWith('_'))
              .map(([id, val]) => ({ id, ...val, pergunta: val.frente, resposta: val.verso }));
          }

          if (flashcardsRes && flashcardsRes.ok) {
            const raw = await flashcardsRes.json();
            const cards = raw.flashcards || raw;
            flashcardsData = (Array.isArray(cards) ? cards : []).map(c => ({
              ...c,
              pergunta: c.frente || c.pergunta,
              resposta:
                c.verso ||
                c.resposta ||
                ((typeof (c.frente || c.pergunta) === 'string' && (c.frente || c.pergunta).match(CLOZE_REGEX_SINGLE))
                  ? ((c.frente || c.pergunta).match(CLOZE_REGEX_SINGLE)[1] || '').trim()
                  : '')
            }));
          }

          const resolvedCurriculum = await resolveRuntimeCurriculum({
            appVersion: APP_VERSION,
            legacyMateriasRaw,
            profile: user,
          });
          if (resolvedCurriculum?.materiasData?.length) {
            materiasData = resolvedCurriculum.materiasData;
            setAllowedLessonIds(resolvedCurriculum.allowedLessonIds);
          } else {
            setAllowedLessonIds(null);
          }

          // Asynchronous loading for Heavy questions (Lazy Load)
          Promise.all([
            fetch(`data/questoes.json?v=${APP_VERSION}`).catch(() => null),
            fetch(`data/questoes_antigas.json?v=${APP_VERSION}`).catch(() => null)
          ]).then(async ([qRes, qaRes]) => {
            let qArray = [];
            if (qRes && qRes.ok) {
              const raw = await qRes.json();
              const questoes = raw.questoes || raw;
              qArray = qArray.concat((Array.isArray(questoes) ? questoes : []).map(q => ({ ...q, isLegacy: true })));
            }
            let qaArray = [];
            if (qaRes && qaRes.ok) {
              const raw = await qaRes.json();
              const antigas = raw.questoes || raw;
              const antigasParsed = Array.isArray(antigas) ? antigas : [];
              antigasParsed.forEach(q => {
                qaArray.push({
                  id: 'qa_' + q.id, materia: q.materia, pergunta: q.enunciado,
                  resposta: q.opcoes && q.correta !== null && q.opcoes[q.correta] ? q.opcoes[q.correta].replace(/^[A-D]\)\s*/, '') : '',
                  explicacao: q.explicacao, explicacao_geral: q.explicacao_geral || '',
                  explicacoes_opcoes: q.explicacoes_opcoes || null, opcoes: q.opcoes || [],
                  correta: q.correta, caso_clinico: q.caso_clinico === true,
                  isLegacy: true, tipo: 'quiz', tema: q.tema, dificuldade: q.dificuldade
                });
              });
            }
            setQuestoesAntigas(qaArray);
            if (qArray.length > 0) {
              setFlashcards(prev => {
                const updated = Array.isArray(prev) ? [...prev] : [];
                qArray.forEach(q => {
                  updated.push({
                    id: 'q_' + q.id, materia: q.materia, pergunta: q.enunciado,
                    resposta: q.opcoes && q.correta !== null && q.opcoes[q.correta] ? q.opcoes[q.correta].replace(/^[A-D]\)\s*/, '') : '',
                    explicacao: q.explicacao, explicacao_geral: q.explicacao_geral || '',
                    explicacoes_opcoes: q.explicacoes_opcoes || null, opcoes: q.opcoes || [],
                    correta: q.correta, caso_clinico: q.caso_clinico === true,
                    isLegacy: q.isLegacy === true, tipo: 'quiz', tema: q.tema, dificuldade: q.dificuldade,
                    essencial: q.essencial === true, aula_id: q.aula_id || q.tema
                  });
                });
                return updated;
              });
            }
          }).catch(console.error);

          // Fallback if no JSON files loaded
          if (materiasData.length === 0) {
            materiasData = [
              { id: 'sus', nome: 'Princípios e Organização do SUS', sigla: 'SUS', semestre: 1, cor: '#6366F1' },
              { id: 'semiologia1', nome: 'Semiologia Médica 1 — Sistema Locomotor', sigla: 'SEMIO1', semestre: 1, cor: '#C0392B' },
              { id: 'bmf1', nome: 'Bases Morfofuncionais 1 — Sistema Locomotor', sigla: 'BMF1', semestre: 1, cor: '#E85D75' },
              { id: 'pmh', nome: 'Práticas nas Humanidades Médicas', sigla: 'PMH', semestre: 1, cor: '#8B5CF6' },
              { id: 'bmf2', nome: 'Bases Morfofuncionais 2 — Sistema Cardiopulmonar', sigla: 'BMF2', semestre: 2, cor: '#EF4444' },
              { id: 'mad1', nome: 'Mecanismos de Agressão e Defesa 1 — Imunologia', sigla: 'MAD1', semestre: 2, cor: '#F59E0B' },
              { id: 'indicadores', nome: 'Indicadores de Saúde e Epidemiologia', sigla: 'IND', semestre: 2, cor: '#10B981' },
              { id: 'bcm1', nome: 'Bases Moleculares e Celulares', sigla: 'BCM1', semestre: 2, cor: '#4A90E2' },
              { id: 'semiologia2', nome: 'Semiologia Médica 2 — Sistema Cardiopulmonar', sigla: 'SEMIO2', semestre: 2, cor: '#C0392B' },
              { id: 'mad2', nome: 'Mecanismos de Agressão e Defesa 2 — Patologia Geral', sigla: 'MAD2', semestre: 3, cor: '#EF4444' },
            ];
          }

          if (flashcardsData.length === 0) {
            flashcardsData = [
              { id: 'fc1', materia: 'bcm1', frente: 'Como interpretar gasometria com pH=7.28, pCO2=32, HCO3=15?', verso: 'Acidose metabólica com compensação respiratória. pH baixo indica acidemia, HCO3 baixo confirma origem metabólica, pCO2 reduzido mostra hiperventilação compensatória.', tema: 'bcm1_acido_base', dificuldade: 2 },
              { id: 'fc2', materia: 'bcm1', frente: 'Qual molécula regula a fluidez da membrana plasmática?', verso: 'O colesterol. Ele se intercala entre os fosfolipídeos, reduzindo a fluidez em altas temperaturas e impedindo a solidificação em baixas temperaturas.', tema: 'bcm1_membrana', dificuldade: 1 },
              { id: 'fc3', materia: 'bmf1', frente: 'Qual célula é responsável pela síntese de matriz óssea?', verso: 'O osteoblasto. Sintetiza e secreta os componentes orgânicos da matriz óssea (colágeno tipo I e proteoglicanos), participando da mineralização.', tema: 'bmf1_tec_osseo', dificuldade: 1 },
              { id: 'fc4', materia: 'sus', frente: 'Quais são os três princípios doutrinários do SUS?', verso: 'Universalidade (acesso a toda população), equidade (tratamento diferenciado conforme necessidade) e integralidade (atendimento completo de saúde individual e coletiva).', tema: 'SUS Princípios', dificuldade: 1 },
            ];
          }

          setMaterias(materiasData);
          setFlashcards(flashcardsData);
          setLoading(false);
        } catch (error) {
          console.error('Erro ao carregar dados:', error);
          setLoading(false);
        }
      };

      const openHomeMateriaPicker = (materiaId, materiaNome) => {
        if (!materiaId) {
          setSelectedMateria(null);
          navigateTo('cards', { materiaId: null });
          return;
        }
        setHomeMateriaPicker({ open: true, materiaId, materiaNome: materiaNome || 'Disciplina' });
      };

      const closeHomeMateriaPicker = () => {
        setHomeMateriaPicker({ open: false, materiaId: null, materiaNome: '' });
      };

      const goFromHomeTo = (tab) => {
        const materiaId = homeMateriaPicker.materiaId;
        if (!materiaId) return;
        setSelectedMateria(materiaId);
        closeHomeMateriaPicker();
        navigateTo(tab, { materiaId });
      };

      const handleAuthSuccess = (userData) => {
        if (!userData?.isGuest && isAccountBlocked(userData)) {
          alert('Conta suspensa ou banida. Entre em contato com o suporte.');
          handleLogout();
          return;
        }
        if (!userData?.isGuest && !isTermsCurrent(userData)) {
          localStorage.removeItem('_mgp_sess_v8');
          authStateRef.current = null;
          setUser(null);
          setStage('auth');
          return;
        }
        const normalized = persistLocalUser(userData);
        authStateRef.current = normalized;
        setUser(normalized);
        setStage('app');
      };

      const handleLogout = async () => {
        if (window.__fbAuth && window.__fbAuthFns) {
          try { await window.__fbAuthFns.signOut(window.__fbAuth); } catch {}
        }
        localStorage.removeItem('_mgp_sess_v8');
        localStorage.removeItem('meduni9_sr_data');
        localStorage.removeItem('meduni9_quiz_history');
        localStorage.removeItem('meduni9_stats');
        authStateRef.current = null;
        setUser(null);
        setStage('auth');
        setCurrentTab('home');
        window.location.hash = '';
      };

      useEffect(() => {
        if (!user || !user.uid || stage !== 'app' || user.isGuest) return;
        let cancelled = false;

        const runSecurityHeartbeat = async () => {
          try {
            const result = await recordSecurityHeartbeatForUser(user);
            if (cancelled || !result) return;
            if (result.accountStatus && BLOCKED_ACCOUNT_STATUSES.has(String(result.accountStatus).toLowerCase())) {
              alert('Conta suspensa ou banida. Entre em contato com o suporte.');
              await handleLogout();
              return;
            }
            if (result.termsRequired && !TERMS_EMERGENCY_ALLOWLIST.has(normalizeAuthEmail(user?.email))) {
              alert('Para continuar, aceite os Termos de Uso atualizados.');
              await handleLogout();
              return;
            }
            if (result.riskLevel && result.riskLevel !== 'none') {
              console.warn('[security] sessao sinalizada para revisao', result.riskLevel, result.events || []);
            }
          } catch (err) {
            if ((err?.code || '') === 'account_blocked') {
              alert('Conta suspensa ou banida. Entre em contato com o suporte.');
              await handleLogout();
            } else if ((err?.code || '') === 'terms_required' && !TERMS_EMERGENCY_ALLOWLIST.has(normalizeAuthEmail(user?.email))) {
              alert('Para continuar, aceite os Termos de Uso atualizados.');
              await handleLogout();
            } else {
              console.warn('[security] heartbeat nao registrado', err?.message || err);
            }
          }
        };

        runSecurityHeartbeat();
        const timer = setInterval(runSecurityHeartbeat, 5 * 60 * 1000);
        return () => {
          cancelled = true;
          clearInterval(timer);
        };
      }, [user?.uid, user?.deviceId, stage]);

      if (stage === 'splash') {
        return <SplashScreen onComplete={() => {
          splashDoneRef.current = true;
          if (authStateRef.current !== undefined) {
            applyResolvedAuth(authStateRef.current);
          }
          // If still undefined: onAuthStateChanged hasn't fired yet → it will call applyResolvedAuth
        }} />;
      }

      if (stage === 'auth') {
        if (routeState.publicOnly && routeState.tab === 'about') {
          return (
            <div className="about-public-shell">
              <div id="about-public" className="screen-content" style={{
                paddingTop: '24px',
                paddingBottom: '40px',
                paddingLeft: 'max(20px, env(safe-area-inset-left, 0px))',
                paddingRight: 'max(20px, env(safe-area-inset-right, 0px))',
                width: '100%',
                maxWidth: 'none',
                margin: 0,
                boxSizing: 'border-box',
              }}>
                <div style={{ maxWidth: '1080px', margin: '0 auto 18px', width: '100%', display: 'flex', gap: '12px', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap' }}>
                  <div style={{ fontFamily: 'Outfit, sans-serif', fontWeight: 800, color: 'var(--text-primary)', fontSize: '18px' }}>MedGradPlus</div>
                  <div style={{ display: 'flex', gap: '10px', flexWrap: 'wrap' }}>
                    <button className="btn btn-secondary" style={{ width: 'auto', padding: '10px 16px' }} onClick={() => { window.location.hash = ''; const next = { tab: 'home', materiaId: null, aulaId: null, publicOnly: false }; setRouteState(next); setCurrentTab(next.tab); }}>
                      ← Voltar ao login
                    </button>
                    <a href="landing.html" className="btn btn-primary" style={{ width: 'auto', padding: '10px 16px', textDecoration: 'none', display: 'inline-flex', alignItems: 'center' }}>
                      🎓 Ver planos e preços
                    </a>
                  </div>
                </div>
                <SobreScreen user={{ isGuest: true, plano: 'gratuito' }} onNavigate={() => { window.location.hash = ''; const next = { tab: 'home', materiaId: null, aulaId: null, publicOnly: false }; setRouteState(next); setCurrentTab(next.tab); }} />
              </div>
            </div>
          );
        }
        return <AuthScreen onAuthSuccess={handleAuthSuccess} />;
      }

      if (loading) {
        return (
          <div className="app-container">
            <div className="loading">
              <div className="spinner"></div>
            </div>
          </div>
        );
      }

      const handleChangeSemester = async (newSem) => {
        const parsed = typeof newSem === 'number' ? newSem : parseInt(newSem);
        if (parsed >= 1 && parsed <= 12 && hasModuleAccess(user, parsed)) {
          const updated = normalizeUserProfile({ ...user, semestre: parsed, modulo: parsed });
          setUser(updated);
          persistLocalUser(updated);
          authStateRef.current = updated;
          const currentUser = window.__fbAuth?.currentUser;
          if (currentUser) {
            try { await saveUserProfile(currentUser, updated); } catch {}
          }
        }
      };

      const accessFilteredMaterias = (() => {
        if (isMaterialAdminSession()) {
          return materias.filter((m) => m.ativo !== false);
        }
        if (isFreeTierUser(user)) {
          return materias
            .map((m) => filterMateriaForFreeTier(m))
            .filter(Boolean);
        }
        return materias.filter((m) => m.ativo !== false && hasModuleAccess(user, m.modulo || m.semestre));
      })();

      const allowedMateriaIds = new Set(accessFilteredMaterias.map((m) => m.id));
      const isStudyItemAllowedByCurriculum = (card) => {
        if (!allowedLessonIds) return true;
        const lessonId = String(card?.aula_id || card?.tema || '').trim();
        return lessonId ? allowedLessonIds.has(lessonId) : false;
      };
      const accessFilteredFlashcards = (() => {
        if (isFreeTierUser(user)) {
          return flashcards.filter((card) => {
            const lessonId = getStudyItemLessonId(card);
            if (!lessonId || !FREE_TRIAL_LESSONS[lessonId]) return false;
            return isFreeTrialQuestionItem(card) || isFreeTrialFlashcardItem(card);
          });
        }
        return flashcards.filter((card) => {
          if (!isStudyItemAllowedByCurriculum(card)) return false;
          if (!card?.materia) return false;
          if (allowedMateriaIds.has(card.materia)) return true;
          const fallbackMateria = materias.find((m) => m.id === card.materia);
          return fallbackMateria ? hasModuleAccess(user, fallbackMateria.modulo || fallbackMateria.semestre) : false;
        });
      })();

      const navItems = [
        { id: 'home', label: 'Início', icon: <IconHome /> },
        { id: 'materials', label: 'Materiais', icon: <IconBookOpen /> },
        { id: 'quiz', label: 'Questões', icon: <IconTarget /> },
        { id: 'cards', label: 'Flashcards', icon: <IconLayers /> },
        { id: 'anatomy_hist', label: 'Anat. + Hist.', navTitle: 'Anatomia e histologia', icon: <IconAnatomy /> },
        { id: 'feedback', label: 'Feedback', icon: <IconMessageSquare /> },
        { id: 'profile', label: 'Perfil', icon: <IconUser /> },
      ];
      if (isAmbassadorUser) {
        navItems.splice(6, 0, { id: 'ambassador', label: 'Embaixador', icon: <IconCoupon /> });
      }

      // App UI with desktop sidebar
      return (
        <>
          {showInstallTip && (
            <div className="app-install-hint" role="dialog" aria-labelledby="app-install-hint-title">
              <div className="app-install-hint__row">
                <span className="app-install-hint__text" id="app-install-hint-title">
                  {installTipPlatform === 'ios' ? (
                    <>
                      <strong>App na tela inicial (iPhone/iPad):</strong> no Safari, toque em <strong>Compartilhar</strong> →{' '}
                      <strong>Adicionar à Tela de Início</strong> e abra pelo ícone. Assim o MedGrad+ abre em tela cheia, sem barra de URL.
                    </>
                  ) : (
                    <>
                      <strong>App na tela inicial (Android):</strong> no Chrome, toque no menu <strong>⋮</strong> (três pontos) e escolha{' '}
                      <strong>Instalar app</strong> ou <strong>Adicionar à tela inicial</strong>. Abra pelo atalho para experiência em tela cheia.
                    </>
                  )}
                </span>
                <button
                  type="button"
                  className="app-install-hint__close"
                  aria-label="Fechar por agora"
                  title="Fechar (a dica volta na próxima visita)"
                  onClick={() => setShowInstallTip(false)}
                >✕</button>
              </div>
              <button
                type="button"
                className="app-install-hint__never"
                onClick={() => {
                  try {
                    localStorage.setItem('meduni9_install_tip_never_again', '1');
                  } catch (_) {}
                  setShowInstallTip(false);
                }}
              >
                Não mostrar isso novamente
              </button>
            </div>
          )}
        <div className="desktop-layout">
          {/* Desktop Sidebar */}
          <div className={`desktop-sidebar${sidebarOpen ? '' : ' collapsed'}`}>
            <div className="sidebar-logo">
              <span className="sidebar-logo-icon" style={{ display: 'flex', alignItems: 'center' }}><BrandMark size={30} /></span>
              <span className="sidebar-logo-text"><BrandWordmark /></span>
              <button
                className="sidebar-toggle-btn"
                onClick={() => setSidebarOpen(false)}
                title="Fechar menu"
                style={{ marginLeft: 'auto' }}
              ><IconMenu /></button>
            </div>
            <div className="sidebar-nav">
              {navItems.map(item => (
                <div
                  key={item.id}
                  className={`sidebar-item ${currentTab === item.id ? 'active' : ''}`}
                  title={item.navTitle || undefined}
                  onClick={() => navigateTo(item.id)}
                >
                  {item.icon}
                  <span>{item.label}</span>
                </div>
              ))}
              <div
                className={`sidebar-gradbook-teaser sidebar-gradbook-teaser--clickable${currentTab === 'gradbook' ? ' active' : ''}`}
                role="button"
                title="GradBook+ — internato e plantão"
                onClick={() => navigateTo('gradbook')}
              >
                <span className="sidebar-gradbook-teaser__label">GradBook — Internato / Plantão</span>
                <span className="material-badge">Em breve</span>
              </div>
            </div>
            <div className="sidebar-footer">
              <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: '10px' }}>
                <div className="sidebar-user-block" style={{ flex: 1, minWidth: 0 }}>
                  <div className="sidebar-user-avatar">
                    {user.email ? user.email.charAt(0).toUpperCase() : 'U'}
                  </div>
                  <div className="sidebar-user-info">
                    <div className="sidebar-user-name">{user.email ? user.email.split('@')[0] : 'Usuário'}</div>
                    <div className="sidebar-user-meta">{user.campusNome || 'Vergueiro'} · Módulo {user.semestre || user.modulo || 1}</div>
                  </div>
                </div>
                {renderThemeToggle()}
              </div>
            </div>
          </div>

          {/* Main Content */}
          <div className="app-container">
            <div className="mobile-app-top-bar">
              <button
                type="button"
                className="sidebar-toggle-btn mobile-app-top-bar__menu"
                onClick={() => setSidebarOpen((o) => !o)}
                title={sidebarOpen ? 'Fechar menu' : 'Abrir menu'}
                aria-expanded={sidebarOpen}
                aria-label={sidebarOpen ? 'Fechar menu' : 'Abrir menu'}
              ><IconMenu /></button>
              <span className="mobile-app-top-bar__title">
                {navItems.find((i) => i.id === currentTab)?.label || (currentTab === 'about' ? 'Sobre' : currentTab === 'gradbook' ? 'GradBook+' : 'MedGrad+')}
              </span>
              {renderThemeToggle()}
            </div>
            {sidebarOpen && (
              <div
                className="sidebar-backdrop"
                onClick={() => setSidebarOpen(false)}
                aria-hidden="true"
              />
            )}
            {!sidebarOpen && (
              <div className="sidebar-open-bar">
                <button
                  className="sidebar-toggle-btn"
                  onClick={() => setSidebarOpen(true)}
                  title="Abrir menu"
                ><IconMenu /></button>
                {renderThemeToggle()}
              </div>
            )}
            {currentTab === 'home' && (
              <DashboardScreen
                user={user}
                materias={accessFilteredMaterias}
                flashcards={accessFilteredFlashcards}
                onNavigateTo={(tab, materiaId, aulaId) => {
                  if (tab === 'quiz') setQuizMode('essenciais');
                  setSelectedMateria(materiaId || null);
                  navigateTo(tab, { materiaId: materiaId || null, aulaId: aulaId || null });
                }}
                onSelectMateria={(id) => {
                  if (!id) {
                    setSelectedMateria(null);
                    navigateTo('cards', { materiaId: null });
                    return;
                  }
                  const materia = accessFilteredMaterias.find((m) => m.id === id);
                  openHomeMateriaPicker(id, materia?.nome || materia?.sigla || '');
                }}
              />
            )}

            {currentTab === 'cards' && (
              accessFilteredMaterias.length === 0 ? (
                <div className="screen-content" style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', minHeight: '60vh', textAlign: 'center', padding: '40px 24px' }}>
                  <div style={{ fontSize: '48px', marginBottom: '16px' }}>{isFreeTierUser(user) ? '📭' : '⛔'}</div>
                  <h2 style={{ fontFamily: 'Outfit', fontSize: '22px', color: 'var(--text-primary)', marginBottom: '10px' }}>
                    {isFreeTierUser(user) ? 'Demonstração indisponível' : 'Sem acesso para este conteúdo'}
                  </h2>
                  <p style={{ fontSize: '14px', color: 'var(--text-secondary)', maxWidth: '360px', marginBottom: '24px', lineHeight: 1.6 }}>
                    {isFreeTierUser(user)
                      ? 'Não foi possível carregar a aula de amostra e os flashcards. Verifique sua conexão e atualize a página.'
                      : 'Seu plano atual não libera os módulos com flashcards disponíveis no app. Solicite atualização do convite ou do plano para o módulo/ciclo desejado.'}
                  </p>
                  <button className="btn btn-secondary" style={{ maxWidth: '280px' }} onClick={goHome}>
                    Voltar ao início
                  </button>
                </div>
              ) : (
                <FlashcardsScreen
                  flashcards={accessFilteredFlashcards}
                  materias={accessFilteredMaterias}
                  selectedMateria={selectedMateria}
                  onSelectMateria={(materiaId) => {
                    setSelectedMateria(materiaId);
                    navigateTo('cards', { materiaId });
                  }}
                  userSemester={user.semestre}
                  user={user}
                  initialAulaId={routeState.aulaId}
                  onGoHome={goHome}
                />
              )
            )}

            {currentTab === 'quiz' && (
              accessFilteredMaterias.length === 0 ? (
                <div className="screen-content" style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', minHeight: '60vh', textAlign: 'center', padding: '40px 24px' }}>
                  <div style={{ fontSize: '48px', marginBottom: '16px' }}>{isFreeTierUser(user) ? '📭' : '⛔'}</div>
                  <h2 style={{ fontFamily: 'Outfit', fontSize: '22px', color: 'var(--text-primary)', marginBottom: '10px' }}>
                    {isFreeTierUser(user) ? 'Demonstração indisponível' : 'Sem acesso para este conteúdo'}
                  </h2>
                  <p style={{ fontSize: '14px', color: 'var(--text-secondary)', maxWidth: '360px', marginBottom: '24px', lineHeight: 1.6 }}>
                    {isFreeTierUser(user)
                      ? 'Não foi possível carregar a aula de amostra e o simulado de questões. Verifique sua conexão e atualize a página.'
                      : 'Seu plano atual não libera os módulos com questões disponíveis no app. Solicite atualização do convite ou do plano para o módulo/ciclo desejado.'}
                  </p>
                  <button className="btn btn-secondary" style={{ maxWidth: '280px' }} onClick={goHome}>
                    Voltar ao início
                  </button>
                </div>
              ) : (
                <React.Fragment>
                  <div className="mg-segmented-control" style={{ margin: '14px 16px' }}>
                    <div 
                      className="mg-segmented-indicator" 
                      style={{ transform: quizMode === 'todas' ? 'translateX(100%)' : 'translateX(0)' }}
                    ></div>
                    <button
                      className={'mg-segmented-tab' + (quizMode === 'essenciais' ? ' active' : '')}
                      onClick={() => setQuizMode('essenciais')}
                    >
                      <span style={{ fontSize: '16px' }}>⭐</span>
                      <span>Essenciais</span>
                    </button>
                    <button
                      className={'mg-segmented-tab' + (quizMode === 'todas' ? ' active' : '')}
                      onClick={() => setQuizMode('todas')}
                    >
                      <span style={{ fontSize: '16px' }}>📚</span>
                      <span>Todas</span>
                    </button>
                  </div>
                  <QuizScreen
                    key={quizMode}
                    flashcards={
                      quizMode === 'essenciais'
                        ? accessFilteredFlashcards.filter(c => c.essencial === true)
                        : [...questoesAntigas, ...accessFilteredFlashcards].filter(card => {
                            if (isFreeTierUser(user)) return false;
                            if (!isStudyItemAllowedByCurriculum(card)) return false;
                            if (!card?.materia) return false;
                            if (allowedMateriaIds.has(card.materia)) return true;
                            const fm = materias.find((m) => m.id === card.materia);
                            return fm ? hasModuleAccess(user, fm.modulo || fm.semestre) : false;
                          })
                    }
                    title={quizMode === 'essenciais' ? 'Essenciais' : 'Todas as Questões'}
                    materias={
                      quizMode === 'todas'
                        ? [{id: 'todas', nome: 'Todas', icone: '📚', cor: '#00C896'}, ...accessFilteredMaterias]
                        : accessFilteredMaterias
                    }
                    selectedMateria={selectedMateria}
                    onSelectMateria={(materiaId) => {
                      setSelectedMateria(materiaId);
                      navigateTo('quiz', { materiaId });
                    }}
                    userSemester={user.semestre}
                    user={user}
                    initialAulaId={routeState.aulaId}
                    onGoHome={goHome}
                  />
                </React.Fragment>
              )
            )}

            {currentTab === 'materials' && (
              accessFilteredMaterias.length === 0 ? (
                <div className="screen-content" style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', minHeight: '60vh', textAlign: 'center', padding: '40px 24px' }}>
                  <div style={{ fontSize: '48px', marginBottom: '16px' }}>{isFreeTierUser(user) ? '📭' : '⛔'}</div>
                  <h2 style={{ fontFamily: 'Outfit', fontSize: '22px', color: 'var(--text-primary)', marginBottom: '10px' }}>
                    {isFreeTierUser(user) ? 'Demonstração indisponível' : 'Sem acesso para este conteúdo'}
                  </h2>
                  <p style={{ fontSize: '14px', color: 'var(--text-secondary)', maxWidth: '360px', marginBottom: '24px', lineHeight: 1.6 }}>
                    {isFreeTierUser(user)
                      ? 'Não foi possível carregar o material de amostra. Verifique sua conexão e atualize a página.'
                      : 'Seu plano atual não libera os módulos com materiais disponíveis no app. Solicite atualização do convite ou do plano para o módulo/ciclo desejado.'}
                  </p>
                  <button className="btn btn-secondary" style={{ maxWidth: '280px' }} onClick={goHome}>
                    Voltar ao início
                  </button>
                </div>
              ) : (
                <MaterialsScreen
                  materias={accessFilteredMaterias}
                  materiasCatalog={materias.filter((m) => m.ativo !== false)}
                  userSemester={user.semestre}
                  initialMateriaId={routeState.materiaId}
                  initialTemaId={routeState.aulaId}
                  onRouteChange={navigateTo}
                  user={user}
                  onNavigateTo={(tab, materiaId, aulaId) => {
                    if (tab === 'quiz') setQuizMode('essenciais');
                    setSelectedMateria(materiaId || null);
                    navigateTo(tab, { materiaId: materiaId || null, aulaId: aulaId || null });
                  }}
                />
              )
            )}

            {currentTab === 'feedback' && (
              <FeedbackScreen currentMateria={selectedMateria} />
            )}

            {currentTab === 'about' && (
              <SobreScreen user={user} onNavigate={(tab, opts) => navigateTo(tab, opts || {})} />
            )}

            {currentTab === 'gradbook' && (
              <GradBookScreen user={user} onNavigate={(tab, opts) => navigateTo(tab, opts || {})} />
            )}

            {currentTab === 'profile' && (
              <ProfileScreen user={user} onLogout={handleLogout} onChangeSemester={handleChangeSemester} onProfileUpdated={(profile) => {
                const normalized = persistLocalUser(profile);
                authStateRef.current = normalized;
                setUser(normalized);
              }} />
            )}

            {currentTab === 'ambassador' && isAmbassadorUser && (
              <AmbassadorScreen user={user} />
            )}

            {currentTab === 'anatomy_hist' && (
              <AnatomiaHistologiaScreen
                user={user}
                mode={routeState.materiaId === 'histology' ? 'histology' : 'anatomy'}
                onModeChange={(m) => navigateTo('anatomy_hist', { materiaId: m })}
              />
            )}

            {homeMateriaPicker.open && (
              <div className="feedback-overlay" onClick={closeHomeMateriaPicker}>
                <div className="feedback-modal" onClick={(e) => e.stopPropagation()}>
                  <h3>Escolher destino</h3>
                  <p>{homeMateriaPicker.materiaNome}</p>
                  <div className="home-destination-actions">
                    <button className="feedback-btn home-destination-option" onClick={() => goFromHomeTo('materials')}>
                      <IconBookOpen /> Materiais
                    </button>
                    <button className="feedback-btn home-destination-option" onClick={() => goFromHomeTo('quiz')}>
                      <IconClipboardList /> Questões
                    </button>
                    <button className="feedback-btn home-destination-option" onClick={() => goFromHomeTo('cards')}>
                      <IconLayers /> Flashcards
                    </button>
                    <button className="feedback-btn home-destination-cancel" onClick={closeHomeMateriaPicker}>
                      <IconX /> Cancelar
                    </button>
                  </div>
                </div>
              </div>
            )}

          </div>
        </div>
        {React.createElement(AiChat, { user, navigateTo, routeState, currentTab })}
        </>
      );
    };

    // Render App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<MedGradPlusApp />);
  </script>
</body>
</html>
