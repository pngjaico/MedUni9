          setQuizStats({ correct: 0, total: 0 });
          setStartTime(Date.now());
          setQuizComplete(false);
        } else {
          handleQuizStart(activeQuiz, activeTemas);
        }
      };

      // Start caderno de erros quiz
      const startCadernoErros = () => {
        onSelectMateria(null);
        setShowCadernoErros(true);
        setActiveQuiz('__erros__');
        setCurrentQuestion(0);
        setSelectedOption(null);
        setCrossedOut(new Set());
        setAnswered(false);
        setQuizStats({ correct: 0, total: 0 });
        setStartTime(Date.now());
        setQuizComplete(false);
      };

      if (quizComplete) {
        const activeCards = getActiveCards();
        const percentage = Math.round((quizStats.correct / Math.max(activeCards.length, 1)) * 100);

        return (
          <>
            <div className="screen-content">
              <div className="quiz-result-screen">
                <div style={{ fontSize: '60px', marginBottom: '20px' }}>
                  {percentage >= 70 ? '🎉' : percentage >= 50 ? '👍' : '💪'}
                </div>
                <div className="quiz-score">{percentage}%</div>
                <p style={{ color: 'var(--text-secondary)', marginBottom: '8px' }}>
                  {quizStats.correct} de {activeCards.length} questões
                  {activeTemas.length === 1 && <span> — {activeTemas[0]}</span>}
                  {activeTemas.length > 1 && <span> — {activeTemas.length} assuntos</span>}
                </p>
                <div className="quiz-time">{formatTime(Date.now() - startTime)}</div>
                <div style={{ marginTop: '32px', display: 'flex', flexDirection: 'column', gap: '12px' }}>
                  <button className="btn btn-primary" onClick={handleRestartQuiz}>Tentar Novamente</button>
                  <button className="btn btn-secondary" onClick={() => { setActiveQuiz(null); setActiveTemas([]); setQuizComplete(false); setShowCadernoErros(false); onSelectMateria(null); }}>Voltar</button>
                </div>
              </div>
            </div>
          </>
        );
      }

      // Tema selector screen for quiz (multi-select) — uses aulas from materias.json
      if (showTemaSelector && pendingQuiz) {
        const quiz = quizzes[pendingQuiz];
        const materiaObj = materias.find(m => m.id === pendingQuiz);
        const aulas = materiaObj?.aulas || [];
        const hasAulas = aulas.length > 0;
        const temasFromCardsQ = [...new Set(quiz.cards.map(c => c.tema).filter(Boolean))];

        return (
          <>
            <div className="screen-content">
              <button className="back-btn" onClick={() => { setShowTemaSelector(false); setPendingQuiz(null); setPendingTemas([]); onSelectMateria(null); }}>← Questões</button>
              <h2 className="section-title">{quiz.sigla || quiz.name}</h2>
              <p style={{ color: 'var(--text-secondary)', fontSize: '14px', marginBottom: '16px' }}>
                Selecione um ou mais assuntos:
              </p>
              <div className="subject-select-list" style={{ paddingBottom: pendingTemas.length > 0 ? '72px' : '0' }}>
                <div className="subject-select-card" onClick={() => handleQuizStart(pendingQuiz, [])}
                  style={{ borderColor: 'var(--primary)', background: 'rgba(0,200,150,0.06)', marginBottom: '8px' }}>
                  <div className="subject-select-icon" style={{ background: 'rgba(0,200,150,0.15)', color: 'var(--primary)' }}><IconClipboardList /></div>
                  <div className="subject-select-info">
                    <div className="subject-select-name">Todas as questões</div>
                    <div className="subject-select-meta">{quiz.cards.length} questões</div>
                  </div>
                  <div style={{ color: 'var(--primary)' }}><IconChevronRight /></div>
                </div>
                {hasAulas ? (
                  aulas.map(aula => {
                    const count = quiz.cards.filter(c => c.tema === aula.id).length;
                    const isChecked = pendingTemas.includes(aula.id);
                    const hasQs = count > 0;
                    return (
                      <div key={aula.id} className={`subject-select-card${isChecked ? ' tema-selected' : ''}${!hasQs ? ' subject-card-empty' : ''}`} onClick={() => hasQs && togglePendingTema(aula.id)}>
                        <div className={`tema-checkbox${isChecked ? ' tema-checkbox-checked' : ''}`}>{isChecked ? '✓' : ''}</div>
                        <div className="subject-select-info">
                          <div className="subject-select-name">{aula.tema}</div>
                          <div className="subject-select-meta">{hasQs ? `${count} questões` : 'Em breve'}</div>
                        </div>
                      </div>
                    );
                  })
                ) : (
                  temasFromCardsQ.sort().map(tema => {
                    const count = quiz.cards.filter(c => c.tema === tema).length;
                    const isChecked = pendingTemas.includes(tema);
                    return (
                      <div key={tema} className={`subject-select-card${isChecked ? ' tema-selected' : ''}`} onClick={() => togglePendingTema(tema)}>
                        <div className={`tema-checkbox${isChecked ? ' tema-checkbox-checked' : ''}`}>{isChecked ? '✓' : ''}</div>
                        <div className="subject-select-info">
                          <div className="subject-select-name">{tema}</div>
                          <div className="subject-select-meta">{count} questões</div>
                        </div>
                      </div>
                    );
                  })
                )}
              </div>

              {pendingTemas.length > 0 && (
                <div className="tema-start-bar">
                  <span style={{ color: 'var(--text-secondary)', fontSize: '13px' }}>
                    {pendingTemas.length} assunto{pendingTemas.length > 1 ? 's' : ''} selecionado{pendingTemas.length > 1 ? 's' : ''}
                  </span>
                  <button className="btn btn-primary" style={{ padding: '8px 20px', fontSize: '14px' }} onClick={() => handleQuizStart(pendingQuiz, pendingTemas)}>
                    Iniciar questões →
                  </button>
                </div>
              )}
            </div>
          </>
        );
      }

      if (activeQuiz) {
        const activeCards = getActiveCards();

        if (activeCards.length === 0) {
          const emptyMsg = showCadernoErros
            ? 'Nenhuma questão no caderno de erros!'
            : 'Questões em breve para esta matéria.';
          return (
            <>
              <div className="screen-content">
                <button className="back-btn" onClick={() => { setActiveQuiz(null); setActiveTemas([]); setShowCadernoErros(false); onSelectMateria(null); }}>← Questões</button>
                <div style={{ textAlign: 'center', marginTop: '60px' }}>
                  <div style={{ fontSize: '60px', marginBottom: '20px' }}>{showCadernoErros ? '✨' : '🚧'}</div>
                  <p style={{ color: 'var(--text-secondary)', marginBottom: '20px' }}>{emptyMsg}</p>
                  <button className="btn btn-secondary" onClick={() => { setActiveQuiz(null); setActiveTemas([]); setShowCadernoErros(false); onSelectMateria(null); }}>Voltar</button>
                </div>
              </div>
            </>
          );
        }

        const card = activeCards[currentQuestion];
        const progress = ((currentQuestion + 1) / activeCards.length) * 100;
        const quizLabel = showCadernoErros ? 'Caderno de Erros' : (quizzes[activeQuiz]?.sigla || quizzes[activeQuiz]?.name || 'Questões');

        return (
          <>
            <div className="screen-content">
              <button className="back-btn" onClick={() => { setActiveQuiz(null); setActiveTemas([]); setShowCadernoErros(false); onSelectMateria(null); }}>
                ← {activeTemas.length === 1 ? activeTemas[0] : quizLabel}
              </button>
              <div className="quiz-screen">
                <div className="quiz-progress-section">
                  <div className="quiz-progress-bar">
                    <div className="quiz-progress-fill" style={{ width: `${progress}%` }}></div>
                  </div>
                  <div className="quiz-counter">
                    {currentQuestion + 1} de {activeCards.length}
                    {card.tema && activeTemas.length !== 1 && <span style={{ marginLeft: '8px', color: 'var(--primary)', fontSize: '11px' }}>{card.tema}</span>}
                  </div>
                </div>

                <div className="quiz-question-card">
                  <div className="quiz-question">{card.pergunta}</div>
                </div>

                <div className="quiz-options">
                  {card.opcoes.map((option, idx) => (
                    <div
                      key={idx}
                      className={`quiz-option ${
                        crossedOut.has(idx) ? 'crossed-out' : ''
                      } ${
                        selectedOption === idx && !answered ? 'selected' : ''
                      } ${
                        answered && idx === card.correta ? 'correct' : ''
                      } ${
                        answered && selectedOption === idx && idx !== card.correta ? 'incorrect' : ''
                      }`}
                      onClick={() => {
                        if (!answered && !crossedOut.has(idx)) setSelectedOption(idx);
                      }}
                    >
                      <span className="quiz-option-number">{idx + 1}</span>
                      <span>{option}</span>
                      {!answered && !crossedOut.has(idx) && (
                        <button
                          className="cross-btn"
                          onClick={(e) => { e.stopPropagation(); toggleCross(idx); }}
                          title="Riscar alternativa"
                        >✕</button>
                      )}
                    </div>
                  ))}
                </div>

                {answered && card.explicacao && (
                  <div className="quiz-feedback">
                    <div className="quiz-feedback-title">
                      {selectedOption === card.correta ? '✓ Correto!' : '✗ Incorreto'}
                    </div>
                    <p style={{ color: 'var(--text-secondary)', lineHeight: '1.6' }}>{card.explicacao}</p>
                  </div>
                )}

                <div className="quiz-action-bar">
                  <button
                    className="btn"
                    onClick={handleReportQuestion}
                    style={{
                      background: 'rgba(239,68,68,0.12)',
                      border: '1px solid rgba(239,68,68,0.4)',
                      color: '#EF4444',
                      marginRight: '8px'
                    }}
                  >
                    ⚑ Reportar
                  </button>
                  {!answered ? (
                    <button
                      className="btn btn-primary"
                      onClick={handleAnswer}
                      disabled={selectedOption === null}
                    >
                      Confirmar Resposta <span className="kbd-hint">Enter</span>
                    </button>
                  ) : (
                    <button className="btn btn-primary" onClick={handleNextQuestion}>
                      {currentQuestion === activeCards.length - 1 ? 'Finalizar' : 'Próxima Questão'} <span className="kbd-hint">Enter</span>
                    </button>
                  )}
                </div>
              </div>
            </div>
          </>
        );
      }

      // Quiz list with caderno de erros, semester filter, search
      const semesters = [...new Set(Object.values(quizzes).filter(q => q.ativo !== false).map(q => q.semestre))].sort((a,b) => a-b);
      const errosCount = getErros().length;

      return (
        <>
          <div className="screen-content">
            <h2 className="section-title">Questões</h2>

            {semesters.length > 1 && (
              <div className="semester-tabs">
                <button
                  className={`semester-tab ${!semesterFilter ? 'active' : ''}`}
                  onClick={() => setSemesterFilter(null)}
                >Todos</button>
                {semesters.map(s => (
                  <button
                    key={s}
                    className={`semester-tab ${semesterFilter === s ? 'active' : ''}`}
                    onClick={() => setSemesterFilter(s)}
                  >Módulo {s}</button>
                ))}
              </div>
            )}

            <div className="subject-search-wrap">
              <span className="subject-search-icon">🔍</span>
              <input
                type="search"
                className="subject-search"
                placeholder="Buscar matéria..."
                value={searchQuery}
                onChange={e => setSearchQuery(e.target.value)}
              />
            </div>

            {/* Caderno de Erros */}
            {errosCount > 0 && (
              <div className="subject-select-card caderno-erros-card" onClick={startCadernoErros}
                style={{ borderColor: 'var(--error)', background: 'rgba(239,68,68,0.06)', marginBottom: '12px' }}>
                <div className="subject-select-icon" style={{ background: 'rgba(239,68,68,0.15)', color: 'var(--error)', width: '40px', height: '40px', borderRadius: '10px', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '18px' }}>📕</div>
                <div className="subject-select-info">
                  <div className="subject-select-name" style={{ color: 'var(--error)' }}>Caderno de Erros</div>
                  <div className="subject-select-meta">{errosCount} questões para revisar</div>
                </div>
                <div style={{ color: 'var(--error)' }}><IconChevronRight /></div>
              </div>
            )}

            <div className="subject-select-list">
              {Object.entries(filteredQuizzes).length === 0 && (
                <div style={{ textAlign: 'center', padding: '40px 0', color: 'var(--text-secondary)' }}>
                  <p>Nenhuma questão encontrada.</p>
                </div>
              )}
              {Object.entries(filteredQuizzes).map(([id, quiz]) => (
                <div key={id} className={`subject-select-card${quiz.cards.length === 0 ? ' subject-card-empty' : ''}`} onClick={() => handleMateriaClick(id)}>
                  <SubjectIcon materiaId={id} icon={quiz.icon} cor={quiz.cor} />
                  <div className="subject-select-info">
                    <div className="subject-select-name">{quiz.sigla || quiz.name}</div>
                    <div className="subject-select-meta">
                      {quiz.cards.length > 0 ? `${quiz.cards.length} questões — Módulo ${quiz.semestre}` : 'Em breve'}
                    </div>
                  </div>
                  <div style={{ color: 'var(--text-secondary)' }}>
                    <IconChevronRight />
                  </div>
                </div>
              ))}
            </div>
          </div>
        </>
      );
    };

    // Materials Screen — ciclos alinhados a resolveModulesFromCodeEntry (1–4 / 5–8 / 9–12)
    const MATERIALS_CYCLES = [
      { id: 'basico', label: 'Ciclo Básico', sub: 'Módulos 1 a 4', min: 1, max: 4, anchor: 'materials-cycle-basico' },
      { id: 'clinico', label: 'Ciclo Clínico', sub: 'Módulos 5 a 8', min: 5, max: 8, anchor: 'materials-cycle-clinico' },
      { id: 'internato', label: 'Internato', sub: 'Módulos 9 a 12', min: 9, max: 12, anchor: 'materials-cycle-internato' },
    ];

    const MaterialsScreen = ({ materias, materiasCatalog, user, userSemester, onNavigateTo, initialMateriaId, initialTemaId, onRouteChange }) => {
      const [expandedMaterias, setExpandedMaterias] = useState({});
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedMaterial, setSelectedMaterial] = useState(null);
      const [materialContent, setMaterialContent] = useState('');
      const [materialLoading, setMaterialLoading] = useState(false);
      const [materialError, setMaterialError] = useState('');
      const [preProvaVisible, setPreProvaVisible] = useState(false);
      const [figurasCatalog, setFigurasCatalog] = useState(null);
      const [moduleFilterByCycle, setModuleFilterByCycle] = useState({ basico: null, clinico: null, internato: null });
      const markdownRef = useRef(null);
      const restoredRouteRef = useRef('');

      useEffect(() => {
        let cancelled = false;
        fetch('/data/materiais_figuras.json')
          .then((r) => (r.ok ? r.json() : null))
          .then((j) => {
            if (cancelled) return;
            if (j && Array.isArray(j.entries)) setFigurasCatalog(j);
            else setFigurasCatalog({ version: 1, entries: [] });
          })
          .catch(() => {
            if (!cancelled) setFigurasCatalog({ version: 1, entries: [] });
          });
        return () => { cancelled = true; };
      }, []);

      const figurasDestaAulaComLink = useMemo(() => {
        if (!figurasCatalog?.entries || !selectedMaterial?.temaId) return [];
        return figurasCatalog.entries.filter(
          (e) => e.aula === selectedMaterial.temaId && String(e.urlImagem || '').trim()
        );
      }, [figurasCatalog, selectedMaterial?.temaId]);

      const figurasPlanejadasCount = useMemo(() => {
        if (!figurasCatalog?.entries || !selectedMaterial?.temaId) return 0;
        return figurasCatalog.entries.filter((e) => e.aula === selectedMaterial.temaId).length;
      }, [figurasCatalog, selectedMaterial?.temaId]);

      /** Figuras com URL que não têm slot inline no texto (sem **Figura-ID:** no .md antes do Pré-Prova). */
      const figurasRodapeAula = useMemo(() => {
        if (!materialContent || !figurasDestaAulaComLink.length) return [];
        const preRe = /^## Pr[eé][- ]?Prova/im;
        const pre = preRe.exec(materialContent);
        const main = pre ? materialContent.slice(0, pre.index) : materialContent;
        const inlineIds = new Set();
        const idRe = /\*\*Figura-ID:\*\*\s*`?([A-Z0-9-]+)`?/gi;
        let mm;
        while ((mm = idRe.exec(main))) inlineIds.add(mm[1]);
        return figurasDestaAulaComLink.filter((f) => !inlineIds.has(f.id));
      }, [materialContent, figurasDestaAulaComLink]);

      // Split markdown at "## Pré-Prova" section
      const splitAtPreProva = (content) => {
        // regex: matches "## Pré-Prova" or "## Pre-Prova" (any case, hyphen optional) at start of line
        const re = /^## Pr[eé][- ]?Prova/im;
        const match = re.exec(content);
        if (match) {
          return { main: content.slice(0, match.index).trim(), preProva: content.slice(match.index).trim() };
        }
        return { main: content, preProva: null };
      };

      // Post-process markdown header: breadcrumb + meta pills
      useEffect(() => {
        if (!markdownRef.current || !materialContent) return;
        const root = markdownRef.current;

        // --- Breadcrumb: only direct <p> children at the top (not inside lists/quotes) ---
        const directTopPs = Array.from(root.children).filter(el => el.tagName === 'P').slice(0, 3);
        const bcP = directTopPs.find(p => p.textContent.includes('→'));
        if (bcP && !bcP.classList.contains('md-breadcrumb')) {
          const parts = bcP.textContent.split('→').map(s => s.trim()).filter(Boolean);
          bcP.className = 'md-breadcrumb';
          bcP.innerHTML = parts.map((part, i) =>
            `<span class="bc-item${i === parts.length - 1 ? ' current' : ''}">${part}</span>${i < parts.length - 1 ? '<span class="bc-sep">›</span>' : ''}`
          ).join('');
        }

        // --- Meta pills: only direct <p> children at the top ---
        const metaP = directTopPs.find(p => p.textContent.includes('⏱') || p.textContent.includes('min ·'));
        if (metaP && !metaP.classList.contains('md-meta')) {
          const parts = metaP.textContent.split('·').map(s => s.trim()).filter(Boolean);
          metaP.className = 'md-meta';
          metaP.innerHTML = parts.map(p =>
            `<span class="md-meta-pill">${p}</span>`
          ).join('');
        }
      }, [materialContent, selectedMaterial]);

      // Hidratar slots .material-fig-slot com imagens do catálogo (inline no texto)
      useEffect(() => {
        if (!markdownRef.current || !figurasCatalog?.entries) return;
        const root = markdownRef.current;
        const slots = root.querySelectorAll('.material-fig-slot[data-fig-id]');
        slots.forEach((slot) => {
          const id = slot.getAttribute('data-fig-id');
          if (!id) return;
          const fig = figurasCatalog.entries.find((e) => e.id === id);
          if (!fig) {
            slot.innerHTML = MATERIAL_FIG_PENDING_HTML;
            return;
          }
          if (String(fig.urlImagem || '').trim()) {
            slot.innerHTML = buildMaterialFigureHtml(fig);
            slot.classList.add('material-fig-slot--filled');
          } else {
            slot.innerHTML = MATERIAL_FIG_PENDING_HTML;
          }
        });
      }, [materialContent, figurasCatalog, selectedMaterial?.path, selectedMaterial?.temaId]);

      // Enable interactive checkboxes with localStorage persistence
      useEffect(() => {
        if (!markdownRef.current || !selectedMaterial) return;
        const key = `checklist_${selectedMaterial.path}`;
        const saved = JSON.parse(localStorage.getItem(key) || '{}');
        const boxes = markdownRef.current.querySelectorAll('input[type="checkbox"]');
        boxes.forEach((cb, i) => {
          cb.removeAttribute('disabled');
          cb.checked = !!saved[i];
          cb.style.cursor = 'pointer';
          cb.style.accentColor = '#00C896';
          cb.style.width = '15px';
          cb.style.height = '15px';
          cb.style.marginRight = '6px';
          cb.style.verticalAlign = 'middle';
          cb.addEventListener('change', () => {
            saved[i] = cb.checked;
            localStorage.setItem(key, JSON.stringify(saved));
          });
        });
      }, [materialContent, selectedMaterial]);

      const toggleMateria = (id) => {
        setExpandedMaterias(prev => ({ ...prev, [id]: !prev[id] }));
      };

      const handleReportMaterial = () => {
        if (!selectedMaterial) return;
        const reason = prompt('Descreva o erro no material (opcional):', '');
        if (reason === null) return;

        submitContentFeedback({
          origem: 'materiais',
          mensagem: reason?.trim() || 'Erro reportado em material',
          itemId: `${selectedMaterial.materiaId || ''}:${selectedMaterial.temaId || ''}`,
          materia: selectedMaterial.materiaId || '',
          tema: selectedMaterial.temaId || '',
          contexto: {
            materiaNome: selectedMaterial.materiaNome,
            temaNome: selectedMaterial.temaNome,
            path: selectedMaterial.path
          }
        })
          .then(() => alert('Reporte enviado para o admin. Obrigado!'))
          .catch(() => alert('Nao foi possivel enviar agora. Tente novamente em instantes.'));
      };

      const resolveTemaId = (materia, tema) => {
        if (tema?.id) return tema.id;
        const aulas = Array.isArray(materia?.aulas) ? materia.aulas : [];
        if (!aulas.length) return null;

        const byNome = aulas.find(a => normalizeText(a.tema) === normalizeText(tema?.nome || ''));
        if (byNome?.id) return byNome.id;

        const byDesc = aulas.find(a => normalizeText(a.descricao) === normalizeText(tema?.descricao || ''));
        if (byDesc?.id) return byDesc.id;

        return null;
      };

      const openMaterial = async (materia, tema, options = {}) => {
        const { updateHash = true } = options;
        const modulo = materia.modulo || materia.semestre;
        const temaId = resolveTemaId(materia, tema);

        if (!temaId) {
          setSelectedMaterial({
            materiaNome: materia.nome,
            temaNome: tema.nome,
            path: 'sem-id',
            materiaId: materia.id,
            temaId: null,
          });
          setMaterialContent('');
          setMaterialError('Nao foi possivel identificar o ID da aula para abrir o material.');
          setMaterialLoading(false);
          return;
        }

        const primaryPath = `materiais/modulo${modulo}/${materia.id}/${temaId}.md`;
        const fallbackPaths = [
          primaryPath,
          `/materiais/modulo${modulo}/${materia.id}/${temaId}.md`,
          `materiais/modulo1/${materia.id}/${temaId}.md`,
          `materiais/modulo2/${materia.id}/${temaId}.md`,
          `materiais/modulo3/${materia.id}/${temaId}.md`,
          `materiais/modulo4/${materia.id}/${temaId}.md`,
          `materiais/modulo5/${materia.id}/${temaId}.md`,
          `materiais/modulo6/${materia.id}/${temaId}.md`,
          `materiais/modulo7/${materia.id}/${temaId}.md`,
          `materiais/modulo8/${materia.id}/${temaId}.md`,
          `materiais/modulo9/${materia.id}/${temaId}.md`,
          `materiais/modulo10/${materia.id}/${temaId}.md`,
          `materiais/modulo11/${materia.id}/${temaId}.md`,
          `materiais/modulo12/${materia.id}/${temaId}.md`,
        ];

        setSelectedMaterial({
          materiaNome: materia.nome,
          temaNome: tema.nome,
          path: primaryPath,
          materiaId: materia.id,
          temaId,
        });
        setMaterialContent('');
        setMaterialError('');
        setMaterialLoading(true);
        setPreProvaVisible(false);

        if (updateHash && onRouteChange) {
          onRouteChange('materials', { materiaId: materia.id, aulaId: temaId });
        }

        try {
          let loaded = false;
          for (const p of fallbackPaths) {
            const res = await fetch(p);
            if (!res.ok) continue;
            const text = await res.text();
            setMaterialContent(text);
            setSelectedMaterial(prev => ({ ...prev, path: p }));
            loaded = true;
            break;
          }

          if (!loaded) {
            throw new Error(`Material ainda nao disponivel para esta aula. Caminho tentado: ${primaryPath}`);
          }
        } catch (err) {
          setMaterialError(err?.message || 'Erro ao carregar material.');
        } finally {
          setMaterialLoading(false);
        }
      };

      const getMateriaModulos = (materia) => {
        const config = getModulos(materia.id);
        if (config) return config;
        if (materia.modulos) return materia.modulos;
        if (materia.aulas && materia.aulas.length > 0) {
          return [{ nome: materia.nome, temas: materia.aulas.map(a => ({ id: a.id, nome: a.tema, descricao: a.descricao })) }];
        }
        return null;
      };

      const totalTemas = (materia) => {
        const mods = getMateriaModulos(materia);
        if (!mods) return 0;
        return mods.reduce((acc, mod) => acc + (mod.temas?.length || 0), 0);
      };

      const catalog = Array.isArray(materiasCatalog) ? materiasCatalog : [];

      const moduloInRange = (m, min, max) => {
        const mod = parseInt(m?.modulo ?? m?.semestre, 10);
        return Number.isFinite(mod) && mod >= min && mod <= max;
      };

      const catalogHasDisciplinasInRange = (min, max) =>
        catalog.some((m) => m.ativo !== false && moduloInRange(m, min, max));

      const userHasAccessToCycle = (min, max) => {
        for (let n = min; n <= max; n++) {
          if (hasModuleAccess(user || {}, n)) return true;
        }
        return false;
      };

      useEffect(() => {
        if (!initialMateriaId || !initialTemaId || !materias.length) return;
        const routeKey = `${initialMateriaId}:${initialTemaId}`;
        if (restoredRouteRef.current === routeKey) return;
        if (selectedMaterial?.materiaId === initialMateriaId && selectedMaterial?.temaId === initialTemaId) {
          restoredRouteRef.current = routeKey;
          return;
        }

        const materia = materias.find(m => m.id === initialMateriaId);
        if (!materia) return;

        const modulos = getMateriaModulos(materia) || [];
        let tema = null;
        modulos.some(mod => {
          tema = (mod.temas || []).find(item => (item?.id || null) === initialTemaId) || null;
          return !!tema;
        });
        if (!tema) return;

        restoredRouteRef.current = routeKey;
        openMaterial(materia, tema, { updateHash: false });
      }, [initialMateriaId, initialTemaId, materias, selectedMaterial]);

      const filteredMaterias = materias.filter((m) =>
        fuzzyMatch(searchQuery, m.nome) || fuzzyMatch(searchQuery, m.sigla || '')
      );

      const renderMateriaCard = (materia) => {
        const total = totalTemas(materia);
        const isExpanded = expandedMaterias[materia.id];
        const modulosList = getMateriaModulos(materia) || [];
        return (
          <div key={materia.id} className="material-subject">
            <div className="material-subject-name" style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
              <span style={{ display: 'flex', alignItems: 'center', gap: '8px' }}>
                <SubjectIcon materiaId={materia.id} icon={materia.icon} cor={materia.cor} />
                {materia.sigla || materia.nome}
              </span>
              {total > 0 && (
                <button
                  type="button"
                  onClick={() => toggleMateria(materia.id)}
                  style={{
                    background: 'rgba(255,255,255,0.06)',
                    border: '1px solid rgba(255,255,255,0.12)',
                    borderRadius: '8px',
                    color: 'var(--text-secondary)',
                    fontSize: '0.78rem',
                    padding: '4px 10px',
                    cursor: 'pointer',
                    display: 'flex',
                    alignItems: 'center',
                    gap: '5px'
                  }}
                >
                  {isExpanded ? '▲' : '▼'} {total} aulas
                </button>
              )}
            </div>

            {total > 0 && isExpanded && (
              <div style={{ marginTop: '10px', marginBottom: '4px' }}>
                {modulosList.map((mod, mi) => (
                  <div key={mi} style={{ marginBottom: '10px' }}>
                    <div style={{
                      fontSize: '0.72rem',
                      fontWeight: 700,
                      textTransform: 'uppercase',
                      letterSpacing: '0.06em',
                      color: 'var(--text-secondary)',
                      marginBottom: '6px',
                      paddingLeft: '2px'
                    }}>{mod.nome}</div>
                    {(mod.temas || []).map((tema, ti) => (
                      <div
                        key={ti}
                        role="button"
                        tabIndex={0}
                        onClick={() => openMaterial(materia, tema)}
                        onKeyDown={(e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openMaterial(materia, tema); } }}
                        title="Abrir material da aula"
                        style={{
                          display: 'flex',
                          alignItems: 'flex-start',
                          gap: '8px',
                          padding: '7px 10px',
                          borderRadius: '8px',
                          background: 'rgba(255,255,255,0.03)',
                          border: '1px solid rgba(255,255,255,0.06)',
                          marginBottom: '4px',
                          cursor: 'pointer'
                        }}
                      >
                        <span style={{ color: materia.cor || 'var(--primary)', fontSize: '0.85rem', marginTop: '1px' }}>•</span>
                        <div>
                          <div style={{ fontSize: '0.88rem', color: 'var(--text-primary)', fontWeight: 500 }}>{tema.nome}</div>
                          {tema.descricao && (
                            <div style={{ fontSize: '0.75rem', color: 'var(--text-secondary)', marginTop: '2px' }}>{tema.descricao}</div>
                          )}
                        </div>
                      </div>
                    ))}
                  </div>
                ))}
              </div>
            )}

            <div className="material-slots" style={{ marginTop: total > 0 ? '8px' : undefined }}>
              <div className="material-slot">
                <span className="material-slot-name">
                  <span style={{ color: 'var(--text-secondary)', display: 'flex' }}><IconFileText /></span>
                  Resumo Didático
                </span>
                <span className="material-badge">Em breve</span>
              </div>
              <div className="material-slot">
                <span className="material-slot-name">
                  <span style={{ color: 'var(--text-secondary)', display: 'flex' }}><IconPieChart /></span>
                  Análise de Provas
                </span>
                <span className="material-badge">Em breve</span>
              </div>
            </div>
          </div>
        );
      };

      const userHasDisciplinaInCatalogForAccess = (min, max) =>
        catalog.some(
          (m) =>
            m.ativo !== false &&
            moduloInRange(m, min, max) &&
            hasModuleAccess(user || {}, m.modulo ?? m.semestre)
        );

      const getMateriaModuloNum = (m) => {
        const n = parseInt(m?.modulo ?? m?.semestre, 10);
        return Number.isFinite(n) ? n : null;
      };

      const renderCycleSection = (cycle) => {
        const { min, max, label, sub, anchor, id: cycleId } = cycle;
        const hasAccess = userHasAccessToCycle(min, max);
        const hasCatalog = catalogHasDisciplinasInRange(min, max);
        const hasDisciplinaForUser = userHasDisciplinaInCatalogForAccess(min, max);
        const sectionMaterias = filteredMaterias.filter((m) => moduloInRange(m, min, max));
        const q = String(searchQuery || '').trim();

        const moduleNums = [...new Set(sectionMaterias.map(getMateriaModuloNum).filter((n) => n != null))].sort((a, b) => a - b);
        const rawFilter = moduleFilterByCycle[cycleId];
        const moduleFilter = rawFilter != null && moduleNums.includes(rawFilter) ? rawFilter : null;
        const modulesToShow = moduleFilter == null ? moduleNums : moduleNums.filter((n) => n === moduleFilter);

        const renderModuleChips = () => {
          if (moduleNums.length <= 1) return null;
          return (
            <div className="materials-mod-chips">
              <span className="materials-mod-chips-label">Módulo</span>
              <button
                type="button"
                className={`semester-tab${moduleFilter == null ? ' active' : ''}`}
                onClick={() => setModuleFilterByCycle((prev) => ({ ...prev, [cycleId]: null }))}
              >Todos</button>
              {moduleNums.map((n) => (
                <button
                  key={n}
                  type="button"
                  className={`semester-tab${moduleFilter === n ? ' active' : ''}`}
                  onClick={() => setModuleFilterByCycle((prev) => ({ ...prev, [cycleId]: n }))}
                >{n}</button>
              ))}
            </div>
          );
        };

        const renderGroupedList = () => (
          <>
            {renderModuleChips()}
            {modulesToShow.length === 0 ? (
              <div className="materials-cycle-empty">
                {moduleFilter != null
                  ? 'Nenhuma matéria neste módulo com os filtros atuais.'
                  : 'Nenhuma disciplina disponível aqui no momento.'}
              </div>
            ) : (
              modulesToShow.map((modNum) => {
                const group = sectionMaterias.filter((m) => getMateriaModuloNum(m) === modNum);
                return (
                  <div key={modNum} id={`${anchor}-mod-${modNum}`} className="materials-mod-subgroup" style={{ scrollMarginTop: '88px' }}>
                    <h4 className="materials-mod-title">Módulo {modNum}</h4>
                    <div className="materials-list">{group.map((m) => renderMateriaCard(m))}</div>
                  </div>
                );
              })
            )}
          </>
        );

        let body = null;
        if (!hasAccess) {
          body = (
            <div className="materials-cycle-empty">
              Este ciclo não está incluído na sua chave. Atualize seu plano ou chave para acessar estes módulos.
            </div>
          );
        } else if (!hasCatalog) {
          body = (
            <div className="materials-cycle-empty" style={{ display: 'flex', alignItems: 'center', gap: '12px', flexWrap: 'wrap' }}>
              <span className="material-badge" style={{ flexShrink: 0 }}>Em breve</span>
              <span>Conteúdo ainda por vir neste ciclo. Volte em breve para novos materiais.</span>
            </div>
          );
        } else if (!hasDisciplinaForUser) {
          body = (
            <div className="materials-cycle-empty" style={{ display: 'flex', alignItems: 'center', gap: '12px', flexWrap: 'wrap' }}>
              <span className="material-badge" style={{ flexShrink: 0 }}>Em breve</span>
              <span>Materiais para os módulos da sua chave neste ciclo ainda por vir.</span>
            </div>
          );
        } else if (sectionMaterias.length === 0 && q) {
          body = (
            <div className="materials-cycle-empty">
              Nenhuma matéria encontrada com esse termo neste ciclo.
            </div>
          );
        } else if (sectionMaterias.length === 0) {
          body = (
            <div className="materials-cycle-empty">
              Nenhuma disciplina disponível aqui no momento.
            </div>
          );
        } else {
          body = renderGroupedList();
        }

        return (
          <section key={cycle.id} id={anchor} className="materials-cycle-section">
            <h3 className="materials-cycle-header">{label}</h3>
            <p className="materials-cycle-sub">{sub}</p>
            {body}
          </section>
        );
      };

      // --- DETAIL VIEW: when a material is selected, replace entire screen ---
      if (selectedMaterial) {
        return (
          <div className="screen-content" style={{ paddingBottom: '32px' }}>

            {/* Header bar */}
            <div style={{
              display: 'flex',
              alignItems: 'center',
              gap: '10px',
              marginBottom: '20px',
            }}>
              <button
                onClick={() => {
                  setSelectedMaterial(null);
                  setMaterialContent('');
                  setMaterialError('');
                  if (onRouteChange) onRouteChange('materials', {});
                }}
                style={{
                  background: 'rgba(0,200,150,0.08)',
                  border: '1px solid rgba(0,200,150,0.25)',
                  borderRadius: '8px',
                  color: '#00C896',
                  fontSize: '0.82rem',
                  fontWeight: 500,
                  padding: '7px 13px',
                  cursor: 'pointer',
                  display: 'flex',
                  alignItems: 'center',
                  gap: '5px',
                  flexShrink: 0,
                  transition: 'background 0.2s',
                  fontFamily: 'DM Sans, sans-serif',
                }}
              >← Voltar</button>

              <div style={{ minWidth: 0, flex: 1 }}>
                <div style={{
                  fontSize: '0.7rem',
                  color: '#64748B',
                  fontWeight: 500,
                  textTransform: 'uppercase',
                  letterSpacing: '0.07em',
                  marginBottom: '2px',
                  fontFamily: 'DM Sans, sans-serif',
                }}>{selectedMaterial.materiaNome}</div>
                <div style={{
                  fontSize: '1rem',
                  fontWeight: 700,
                  color: '#F1F5F9',
                  fontFamily: 'Outfit, sans-serif',
                  lineHeight: 1.25,
                  whiteSpace: 'nowrap',
                  overflow: 'hidden',
                  textOverflow: 'ellipsis',
                }}>{selectedMaterial.temaNome}</div>
              </div>
            </div>

            {/* Botões de ação — Flashcards e Questões */}
            {onNavigateTo && selectedMaterial.materiaId && (
              <div style={{
                display: 'flex',
                gap: '8px',
                marginBottom: '16px',
              }}>
                <button
                  onClick={() => onNavigateTo('cards', selectedMaterial.materiaId)}
                  style={{
                    flex: 1,
                    display: 'flex',
                    alignItems: 'center',
                    justifyContent: 'center',
                    gap: '7px',
                    background: 'rgba(124,58,237,0.12)',
                    border: '1px solid rgba(124,58,237,0.3)',
                    borderRadius: '10px',
                    padding: '10px 14px',
                    cursor: 'pointer',
                    color: '#C4B5FD',
                    fontSize: '0.82rem',
                    fontWeight: 600,
                    fontFamily: 'DM Sans, sans-serif',
                    transition: 'background 0.2s',
                  }}
                >
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>
                  Flashcards
                </button>
                <button
                  onClick={() => onNavigateTo('quiz', selectedMaterial.materiaId)}
                  style={{
                    flex: 1,
                    display: 'flex',
                    alignItems: 'center',
                    justifyContent: 'center',
                    gap: '7px',
                    background: 'rgba(16,185,129,0.1)',
                    border: '1px solid rgba(16,185,129,0.3)',
                    borderRadius: '10px',
                    padding: '10px 14px',
                    cursor: 'pointer',
                    color: '#6EE7B7',
                    fontSize: '0.82rem',
                    fontWeight: 600,
                    fontFamily: 'DM Sans, sans-serif',
                    transition: 'background 0.2s',
                  }}
                >
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
                  Questões
                </button>
                <button
                  onClick={handleReportMaterial}
                  style={{
                    display: 'flex',
                    alignItems: 'center',
                    justifyContent: 'center',
                    gap: '7px',
                    background: 'rgba(239,68,68,0.1)',
                    border: '1px solid rgba(239,68,68,0.35)',
                    borderRadius: '10px',
                    padding: '10px 12px',
                    cursor: 'pointer',
                    color: '#EF4444',
                    fontSize: '0.8rem',
                    fontWeight: 700,
                    fontFamily: 'DM Sans, sans-serif',
                    transition: 'background 0.2s',
                  }}
                  title="Reportar erro neste material"
                >
                  ⚑ Reportar
                </button>
              </div>
            )}

            {/* Loading */}
            {materialLoading && (
              <div style={{
                display: 'flex',
                flexDirection: 'column',
                alignItems: 'center',
                gap: '12px',
                padding: '48px 0',
                color: '#64748B',
                fontSize: '0.85rem',
                fontFamily: 'DM Sans, sans-serif',
              }}>
                <div style={{
                  width: '32px', height: '32px',
                  border: '3px solid rgba(0,200,150,0.15)',
                  borderTop: '3px solid #00C896',
                  borderRadius: '50%',
                  animation: 'spin 0.8s linear infinite',
                }} />
                Carregando material...
              </div>
            )}

            {/* Error */}
            {!materialLoading && materialError && (
              <div style={{
                background: 'rgba(239,68,68,0.08)',
                border: '1px solid rgba(239,68,68,0.2)',
                borderRadius: '10px',
                padding: '14px 16px',
                color: '#FCA5A5',
                fontSize: '0.85rem',
                fontFamily: 'DM Sans, sans-serif',
              }}>{materialError}</div>
            )}

            {/* Content */}
            {!materialLoading && !materialError && materialContent && (() => {
              const { main, preProva } = splitAtPreProva(materialContent);
              return (
                <div className="material-doc-outer">
                  <div className="material-doc-inner">
                  <div

                      background: 'linear-gradient(180deg, rgba(0,200,150,0.05) 0%, rgba(15,23,42,0.7) 120px)',

                  {figurasCatalog === null ? (
                    <div style={{
                      display: 'flex', gap: '12px', alignItems: 'center',
                      background: 'rgba(59,130,246,0.08)', border: '1px solid rgba(59,130,246,0.2)',
                      borderRadius: '12px', padding: '12px 16px', marginTop: '12px',
                      fontSize: '12px', color: 'var(--text-secondary)', lineHeight: 1.6,

                        flexShrink: 0,
                        padding: '6px 8px',
                        borderRadius: '999px',
                        background: 'rgba(59,130,246,0.14)',
                        color: '#93C5FD',
                        fontSize: '10px',
                        fontWeight: 800,
                        letterSpacing: '0.08em',
                        textTransform: 'uppercase'
                      }}>Aviso</span>
                      <span>Carregando catálogo de figuras…</span>

                    <div style={{ marginTop: '14px' }}>
                      <div style={{
                        fontSize: '0.72rem', fontWeight: 700, letterSpacing: '0.08em', textTransform: 'uppercase',
                        color: '#6ee7b7', marginBottom: '10px', fontFamily: 'Outfit, sans-serif',
                      }}>Figuras desta aula</div>
                      <div style={{ display: 'flex', flexDirection: 'column', gap: '16px' }}>
                        {figurasRodapeAula.map((fig) => (
                          <figure

                            style={{
                              margin: 0,
                              background: 'rgba(15,23,42,0.6)',
                              border: '1px solid rgba(0,200,150,0.2)',
                              borderRadius: '12px',
                              overflow: 'hidden',

                          >
                            <img
                              src={fig.urlImagem}
                              alt={fig.legenda || fig.id}
                              style={{ width: '100%', maxHeight: 'min(420px, 55vh)', objectFit: 'contain', display: 'block', background: '#020617' }}

                            />
                            <figcaption style={{
                              padding: '12px 14px',
                              fontSize: '0.82rem',
                              color: 'var(--text-secondary)',
                              lineHeight: 1.5,
                              borderTop: '1px solid rgba(0,200,150,0.12)',
                            }}>
                              <span style={{ color: '#e5e7eb', fontWeight: 600 }}>{fig.legenda || fig.id}</span>
                              {fig.credito ? (
                                <span> — {fig.credito}</span>
                              ) : null}
                              {fig.licenca ? (
                                <span style={{ display: 'block', marginTop: '4px', fontSize: '0.75rem', opacity: 0.85 }}>{fig.licenca}</span>
                              ) : null}
                              {fig.urlPaginaCommons ? (
                                <a
                                  href={fig.urlPaginaCommons}
                                  target="_blank"
                                  rel="noopener noreferrer"
                                  style={{ display: 'inline-block', marginTop: '8px', fontSize: '0.78rem', color: '#00C896' }}
                                >Ver no Wikimedia Commons</a>
                              ) : null}
                            </figcaption>
                          </figure>
                        ))}
                      </div>
                    </div>
                  ) : (
                    <div style={{
                      display: 'flex', gap: '12px', alignItems: 'center',
                      background: 'rgba(59,130,246,0.08)', border: '1px solid rgba(59,130,246,0.2)',
                      borderRadius: '12px', padding: '12px 16px', marginTop: '12px',
                      fontSize: '12px', color: 'var(--text-secondary)', lineHeight: 1.6,
                    }}>
                      <span style={{
                        flexShrink: 0,
                        padding: '6px 8px',
                        borderRadius: '999px',
                        background: 'rgba(59,130,246,0.14)',
                        color: '#93C5FD',
                        fontSize: '10px',
                        fontWeight: 800,
                        letterSpacing: '0.08em',
                        textTransform: 'uppercase'
                      }}>Aviso</span>
                      <span>
                        {figurasDestaAulaComLink.length > 0 && figurasRodapeAula.length === 0
                          ? <>O material pode ganhar <strong style={{ color: '#93C5FD' }}>mais ilustrações e diagramas</strong> ao longo do tempo. O texto desta aula já está completo para estudo.</>
                          : figurasPlanejadasCount > 0
                            ? <>Estamos <strong style={{ color: '#93C5FD' }}>publicando imagens aos poucos</strong>. Parte do conteúdo visual ainda virá em atualizações futuras — use o texto e as tabelas como base principal.</>
                            : <>Em breve este material pode incluir <strong style={{ color: '#93C5FD' }}>ilustrações e imagens</strong> para complementar o que você lê aqui.</>}
                      </span>
                    </div>
                  )}

                  {/* Pré-Prova collapsible */}
                  {preProva && (
                    <div style={{ marginTop: '16px' }}>
                      <button
                        onClick={() => setPreProvaVisible(v => !v)}
                        style={{
                          width: '100%',
                          display: 'flex',
                          alignItems: 'center',
                          justifyContent: 'space-between',
                          background: preProvaVisible
                            ? 'rgba(245,158,11,0.15)'
                            : 'rgba(245,158,11,0.08)',
                          border: '1px solid rgba(245,158,11,0.3)',
                          borderRadius: preProvaVisible ? '12px 12px 0 0' : '12px',
                          padding: '13px 18px',
                          cursor: 'pointer',
                          transition: 'background 0.2s',
                          fontFamily: 'Outfit, sans-serif',
                        }}
                      >
                        <div style={{ display: 'flex', alignItems: 'center', gap: '10px' }}>
                          <span style={{ fontSize: '1.1rem' }}>⚡</span>
                          <div style={{ textAlign: 'left' }}>
                            <div style={{ fontSize: '0.78rem', color: '#D97706', fontWeight: 600, textTransform: 'uppercase', letterSpacing: '0.07em' }}>
                              Resumo
                            </div>
                            <div style={{ fontSize: '0.95rem', fontWeight: 700, color: '#FCD34D' }}>
                              Pré-Prova
                            </div>
                          </div>
                        </div>
                        <span style={{
                          color: '#FCD34D',
                          fontSize: '1rem',
                          transform: preProvaVisible ? 'rotate(180deg)' : 'rotate(0)',
                          transition: 'transform 0.25s',
                          display: 'inline-block',
                        }}>▼</span>
                      </button>

                      {preProvaVisible && (
                        <div
                          className="markdown-body preprova-content"
                          style={{
                            background: 'rgba(245,158,11,0.05)',
                            border: '1px solid rgba(245,158,11,0.2)',
                            borderTop: 'none',
                            borderRadius: '0 0 12px 12px',
                            padding: '18px 20px',
                            wordBreak: 'break-word',
                          }}
                          dangerouslySetInnerHTML={{ __html: renderMd(preProva) }}
                        />
                      )}
                    </div>
                  )}
                  </div>
                </div>
              );
            })()}
          </div>
        );
      }

      // --- LIST VIEW: normal materials list ---
      return (
        <>
          <div className="screen-content">
            <h2 className="section-title">Materiais de Apoio</h2>

            <div style={{
              display: 'flex',
              alignItems: 'flex-start',
              gap: '12px',
              marginBottom: '18px',
              padding: '14px 16px',
              borderRadius: '14px',
              background: 'linear-gradient(135deg, rgba(59,130,246,0.10), rgba(0,200,150,0.08))',
              border: '1px solid rgba(59,130,246,0.20)',
              boxShadow: '0 10px 30px rgba(0,0,0,0.12)',
            }}>
              <span style={{ fontSize: '22px', lineHeight: 1, flexShrink: 0 }}>🖼️</span>
              <div>
                <div style={{ fontFamily: 'Outfit, sans-serif', fontSize: '14px', fontWeight: 800, color: '#93C5FD', marginBottom: '4px' }}>
                  Imagens e esquemas visuais vêm na próxima fase
                </div>
                <div style={{ fontSize: '12px', color: 'var(--text-secondary)', lineHeight: 1.65 }}>
                  Por enquanto os materiais estão focados no texto essencial para estudo rápido. Em breve esta área vai ganhar imagens, diagramas, anatomia visual e explicações ainda mais detalhadas com foco em prova.
                </div>
              </div>
            </div>

            <div className="materials-cycle-nav">
              {MATERIALS_CYCLES.map((c) => (
                <button
                  key={c.id}
                  type="button"
                  className="semester-tab"
                  onClick={() => document.getElementById(c.anchor)?.scrollIntoView({ behavior: 'smooth', block: 'start' })}
                >{c.label}</button>
              ))}
            </div>

            <input
              type="search"
              className="subject-search"
              placeholder="Buscar matéria em todos os ciclos..."
              value={searchQuery}
              onChange={e => setSearchQuery(e.target.value)}
              style={{ marginBottom: '16px' }}
            />
            {MATERIALS_CYCLES.map((c) => renderCycleSection(c))}
          </div>
        </>
      );
    };

    // Profile Screen
    const ProfileScreen = ({ user, onLogout, onChangeSemester, onProfileUpdated }) => {
      const [showPicker, setShowPicker] = useState(false);
      const [showInstitutionRequest, setShowInstitutionRequest] = useState(false);
      const [requestFacultyId, setRequestFacultyId] = useState(user.faculdadeId || DEFAULT_FACULTY_ID);
      const [requestCampusId, setRequestCampusId] = useState(user.campusId || DEFAULT_CAMPUS_ID);
      const [requestLoading, setRequestLoading] = useState(false);
      const [requestError, setRequestError] = useState('');
      const [requestInfo, setRequestInfo] = useState('');
      const [changeRequests, setChangeRequests] = useState([]);
      const [stats, setStats] = useState({
        cardsReviewed: 0,
        questionsAnswered: 0,
        streak: 0,
        studyHours: 0
      });

      useEffect(() => {
        const srData = JSON.parse(localStorage.getItem('meduni9_sr_data') || '{}');
        const quizHistory = JSON.parse(localStorage.getItem('meduni9_quiz_history') || '[]');

        setStats({
          cardsReviewed: Object.keys(srData).length,
          questionsAnswered: quizHistory.length,
          streak: 5,
          studyHours: Math.floor(quizHistory.length * 0.5)
        });
      }, []);

      const loadChangeRequests = async () => {
        const currentUser = window.__fbAuth?.currentUser;
        if (!currentUser || !window.__fbFirestore) return;
        try {
          const { collection, getDocs, query, where } = window.__fbFirestore;
          const snap = await getDocs(query(collection(window.__fbDb, 'profile_change_requests'), where('userId', '==', currentUser.uid)));
          const docs = snap.docs.map(docSnap => ({ id: docSnap.id, ...docSnap.data() }));
          docs.sort((a, b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0));
          setChangeRequests(docs);
        } catch {
          setChangeRequests([]);
        }
      };

      useEffect(() => {
        loadChangeRequests();
      }, []);

      const pendingRequest = changeRequests.find(item => item.status === 'pending');

      const submitInstitutionRequest = async () => {
        const currentUser = window.__fbAuth?.currentUser;
        const faculty = getFacultyById(requestFacultyId);
        const campus = getCampusById(requestFacultyId, requestCampusId);

        setRequestError('');
        setRequestInfo('');

        if (!currentUser) { setRequestError('Faça login novamente para enviar a solicitação.'); return; }
        if (!faculty?.active || !campus?.active) { setRequestError('Escolha uma faculdade e campus disponíveis.'); return; }
        if (pendingRequest) { setRequestError('Já existe uma solicitação pendente para sua conta.'); return; }
        if (user.faculdadeId === faculty.id && user.campusId === campus.id) { setRequestError('Você já está nesse campus.'); return; }

        setRequestLoading(true);
        try {
          const { collection, addDoc } = window.__fbFirestore;
          await addDoc(collection(window.__fbDb, 'profile_change_requests'), {
            userId: currentUser.uid,
            userEmail: currentUser.email || user.email || '',
            currentFacultyId: user.faculdadeId,
            currentFacultyName: user.faculdadeNome,
            currentCampusId: user.campusId,
            currentCampusName: user.campusNome,
            requestedFacultyId: faculty.id,
            requestedFacultyName: faculty.name,
            requestedCampusId: campus.id,
            requestedCampusName: campus.name,
            semestre: user.semestre || user.modulo || 1,
            status: 'pending',
            createdAt: new Date().toISOString(),
          });
          setRequestLoading(false);
          setShowInstitutionRequest(false);
          setRequestInfo('Solicitação enviada. A alteração só aparece após aprovação pela equipe de desenvolvimento.');
          await loadChangeRequests();
        } catch (err) {
          setRequestLoading(false);
          setRequestError('Não foi possível enviar a solicitação.');
        }
      };

      const username = user.email ? user.email.split('@')[0] : 'Usuário';
      const avatarLetter = username.charAt(0).toUpperCase();
      const allowedProfileModules = getAllowedModules(user);
      const isAmbassadorProfile = !!(user?.ambassadorId || user?.ambassadorVitalicio || user?.couponCode);
      const lastCheckDate = user?.lastQualificationCheck ? new Date(user.lastQualificationCheck) : null;
      const daysSinceLastCheck = lastCheckDate ? Math.floor((Date.now() - lastCheckDate.getTime()) / (1000 * 60 * 60 * 24)) : 0;
      const daysUntilCheck = Math.max(0, 30 - daysSinceLastCheck);

      return (
        <>
          <div className="screen-content">
            <div className="profile-avatar">{avatarLetter}</div>
            <div className="profile-name">{username}</div>
            <div className="profile-meta">{getUserInstitutionLabel(user)} · Módulo {user.modulo || 1}</div>

            <div className="profile-stats">
              <div className="profile-stat">
                <div className="profile-stat-icon" style={{ color: 'var(--primary)' }}><IconLayers /></div>
                <div className="profile-stat-value">{stats.cardsReviewed}</div>
                <div className="profile-stat-label">Cards</div>
              </div>
              <div className="profile-stat">
                <div className="profile-stat-icon" style={{ color: 'var(--success)' }}><IconClipboardList /></div>
                <div className="profile-stat-value">{stats.questionsAnswered}</div>
                <div className="profile-stat-label">Questões</div>
              </div>
              <div className="profile-stat">
                <div className="profile-stat-icon" style={{ color: 'var(--warning)' }}><IconFlame /></div>
                <div className="profile-stat-value">{stats.streak}</div>
                <div className="profile-stat-label">Sequência</div>
              </div>
              <div className="profile-stat">
                <div className="profile-stat-icon" style={{ color: 'var(--purple)' }}><IconClock /></div>
                <div className="profile-stat-value">{stats.studyHours}h</div>
                <div className="profile-stat-label">Estudo</div>
              </div>
            </div>

            <div className="profile-section">
              {isAmbassadorProfile && (
                <div style={{ marginBottom: '12px', padding: '12px', borderRadius: '12px', background: 'rgba(245,158,11,0.12)', border: '1px solid rgba(245,158,11,0.35)' }}>
                  <div style={{ fontSize: '12px', fontWeight: 800, color: '#F59E0B', letterSpacing: '0.08em', textTransform: 'uppercase', marginBottom: '6px' }}>Conta de Embaixador</div>
                  <div style={{ fontSize: '13px', color: 'var(--text-primary)', lineHeight: 1.6 }}>
                    Status: <strong>{user?.qualificationStatus === 'suspended' ? 'Suspenso' : 'Aprovado'}</strong><br />
                    Próxima verificação em: <strong>{daysUntilCheck} dia(s)</strong>
                  </div>
                </div>
              )}
              <div className="profile-item">
                <span className="profile-label">Email</span>
                <span className="profile-value" style={{ fontSize: '13px' }}>{user.email}</span>
              </div>
              <div className="profile-item">
                <span className="profile-label">Faculdade</span>
                <span className="profile-value" style={{ fontSize: '13px' }}>{user.faculdadeNome}</span>
              </div>
              <div className="profile-item">
                <span className="profile-label">Campus</span>
                <span className="profile-value" style={{ fontSize: '13px' }}>{user.campusNome}</span>
              </div>
              <div className="profile-item">
                <span className="profile-label">Módulo</span>
                <span className="profile-value" style={{ display: 'flex', alignItems: 'center', gap: '8px' }}>
                  Módulo {user.semestre || user.modulo || 1}
                  <button
                    className="semester-tab"
                    style={{ fontSize: '11px', padding: '4px 10px' }}
                    onClick={() => setShowPicker(!showPicker)}
                  >Trocar</button>
                </span>
              </div>
              {showPicker && (
                <div className="semester-grid" style={{ marginTop: '8px', marginBottom: '8px' }}>
                  {allowedProfileModules.map(s => (
                    <button
                      key={s}
                      className={`semester-btn ${(user.semestre || user.modulo || 1) === s ? 'selected' : ''}`}
                      onClick={() => { onChangeSemester(s); setShowPicker(false); }}
                    >
                      Módulo {s}
                    </button>
                  ))}
                </div>
              )}
              <div className="profile-item">
                <span className="profile-label">Código</span>
                <span className="profile-value" style={{ fontSize: '12px', fontFamily: 'monospace' }}>{user.code}</span>
              </div>

              <div style={{ marginTop: '12px', padding: '12px', borderRadius: '12px', background: 'rgba(255,255,255,0.04)', border: '1px solid rgba(255,255,255,0.06)' }}>
                <div style={{ fontSize: '12px', color: 'var(--text-secondary)', marginBottom: '8px' }}>Troca de faculdade/campus</div>
                <div style={{ fontSize: '13px', color: 'var(--text-primary)', lineHeight: 1.5, marginBottom: '10px' }}>
                  Para evitar curadoria indevida, mudanças de faculdade e campus precisam de aprovação pela equipe de desenvolvimento.
                </div>
                {pendingRequest && (
                  <div style={{ fontSize: '12px', color: 'var(--warning)', marginBottom: '10px' }}>
                    Solicitação pendente: {pendingRequest.requestedFacultyName} · {pendingRequest.requestedCampusName}
                  </div>
                )}
                {requestInfo && <div style={{ fontSize: '12px', color: 'var(--success)', marginBottom: '10px' }}>{requestInfo}</div>}
                {requestError && <div style={{ fontSize: '12px', color: 'var(--error)', marginBottom: '10px' }}>{requestError}</div>}
                <button className="btn btn-secondary" onClick={() => setShowInstitutionRequest(v => !v)} disabled={!!pendingRequest}>
                  {pendingRequest ? 'Aguardando aprovação' : showInstitutionRequest ? 'Cancelar' : 'Solicitar alteração'}
                </button>
              </div>

              {showInstitutionRequest && !pendingRequest && (
                <div style={{ marginTop: '14px' }}>
                  <div className="institution-grid" style={{ marginBottom: '12px' }}>
                    {FACULTY_CATALOG.map(faculty => (
                      <button
                        key={faculty.id}
                        type="button"
                        className={`institution-card ${requestFacultyId === faculty.id ? 'selected' : ''} ${faculty.active ? '' : 'disabled'}`}
                        onClick={() => {
                          if (!faculty.active) return;
                          setRequestFacultyId(faculty.id);
                          setRequestCampusId(getFirstActiveCampus(faculty)?.id || '');
                          setRequestError('');
                        }}
                      >
                        <div>
                          <div className="institution-name">{faculty.shortName}</div>
                          <div className="institution-meta">{faculty.name}</div>
                        </div>
                        <span className={`institution-badge ${faculty.active ? '' : 'soon'}`}>{faculty.active ? 'Disponível' : 'Em breve'}</span>
                      </button>
                    ))}
                  </div>
                  <div className="institution-grid" style={{ marginBottom: '12px' }}>
                    {(getFacultyById(requestFacultyId)?.campi || []).map(campus => (
                      <button
                        key={campus.id}
                        type="button"
                        className={`institution-card ${requestCampusId === campus.id ? 'selected' : ''} ${campus.active ? '' : 'disabled'}`}
                        onClick={() => {
                          if (!campus.active) return;
                          setRequestCampusId(campus.id);
                          setRequestError('');
                        }}
                        style={{ minHeight: '76px' }}
                      >
                        <div>
                          <div className="institution-name">{campus.name}</div>
                          <div className="institution-meta">{getFacultyById(requestFacultyId)?.shortName}</div>
                        </div>
                        <span className={`institution-badge ${campus.active ? '' : 'soon'}`}>{campus.active ? '' : 'Em breve'}</span>
                      </button>
                    ))}
                  </div>
                  <button className="btn btn-primary" onClick={submitInstitutionRequest} disabled={requestLoading}>
                    {requestLoading ? 'Enviando...' : 'Enviar solicitação'}
                  </button>
                </div>
              )}
            </div>

            <button className="btn btn-error" onClick={onLogout} style={{ marginTop: '8px' }}>
              <IconLogOut />
              Fazer Logout
            </button>

            <div style={{ textAlign: 'center', marginTop: '24px', paddingBottom: '20px' }}>
              <p style={{ color: 'var(--text-secondary)', fontSize: '11px' }}>MedGradPlus v1.0.0</p>
            </div>
          </div>
        </>
      );
    };

    const AmbassadorScreen = ({ user }) => {
      const [loading, setLoading] = useState(true);
      const [dashboard, setDashboard] = useState({
        status: user?.qualificationStatus || 'pending',
        daysUntilCheck: 30,
        salesCurrentMonth: 0,
        couponCode: user?.couponCode || '—',
        ambassadorId: user?.ambassadorId || '—',
      });

      useEffect(() => {
        let isMounted = true;
        const loadAmbassadorData = async () => {
          try {
            const [ambRes, salesRes] = await Promise.all([
              fetch('data/embaixadores.json?_=' + Date.now()).then(r => r.ok ? r.json() : {}),
              fetch('data/vendas_mensais.json?_=' + Date.now()).then(r => r.ok ? r.json() : {})
            ]);

            const ambassadors = ambRes || {};
            const salesMonthly = salesRes || {};

            const ambassadorId = user?.ambassadorId || Object.keys(ambassadors).find(id => ambassadors[id]?.email === user?.email) || null;
            const ambassador = ambassadorId ? ambassadors[ambassadorId] : null;

            const monthKey = new Date().toISOString().slice(0, 7);
            const sales = ambassadorId ? (salesMonthly[monthKey]?.[ambassadorId]?.count || 0) : 0;

            const lastCheck = user?.lastQualificationCheck ? new Date(user.lastQualificationCheck) : null;
            const daysSince = lastCheck ? Math.floor((Date.now() - lastCheck.getTime()) / (1000 * 60 * 60 * 24)) : 0;
            const daysUntilCheck = Math.max(0, 30 - daysSince);

            if (!isMounted) return;
            setDashboard({
              status: user?.qualificationStatus || ambassador?.qualificacao_status || 'pending',
              daysUntilCheck,
              salesCurrentMonth: sales,
              couponCode: user?.couponCode || ambassador?.cupomCode || '—',
              ambassadorId: ambassadorId || '—',
            });
          } catch {
            // keep fallback dashboard data on failure
          } finally {
            if (isMounted) setLoading(false);
          }
        };

        loadAmbassadorData();
        return () => { isMounted = false; };
      }, [user?.email, user?.ambassadorId, user?.couponCode, user?.qualificationStatus, user?.lastQualificationCheck, user?.codeHash]);

      return (
        <div className="screen-content">
          <div className="page-header" style={{ marginBottom: '18px' }}>
            <h1 style={{ fontSize: '26px' }}>Área do Embaixador</h1>
            <p style={{ color: 'var(--text-secondary)' }}>Acompanhe sua elegibilidade, vendas e dados de identificação.</p>
          </div>

          {loading && (
            <div className="panel" style={{ marginBottom: '16px' }}>
              <p style={{ color: 'var(--text-secondary)' }}>Carregando dados do embaixador...</p>
            </div>
          )}

          <div className="profile-stats" style={{ marginBottom: '18px' }}>
            <div className="profile-stat">
              <div className="profile-stat-icon" style={{ color: dashboard.status === 'suspended' ? 'var(--error)' : 'var(--success)' }}><IconTarget /></div>

    // ===================== Main App =====================
    function normalizeText(str) {
      return (str || '').toLowerCase()
        .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
        .replace(/\s+/g, '').replace(/[^a-z0-9]/g, '');
    }
    function fuzzyMatch(query, target) {
      const q = normalizeText(query);
      const t = normalizeText(target);
      if (!q) return true;
      if (t.includes(q)) return true;
      let qi = 0;
      for (let ti = 0; ti < t.length && qi < q.length; ti++) {
        if (t[ti] === q[qi]) qi++;
      }
      return qi === q.length;
    }

    /* ── Revisão escrita (dados em data/anatomia_revisao.json) ── */
    function normalizeRevisaoBlocks(sub) {
      if (!sub) return [];
      if (sub.blocks && sub.blocks.length) return sub.blocks;
      if (sub.items && sub.items.length) return [{ type: 'cards', items: sub.items }];
      return [];
    }
    function revisaoBlockSearchText(block) {
      if (block.type === 'cards') {
        return (block.items || []).map(it => (it.q || '') + ' ' + (it.a || '')).join(' ');
      }
      if (block.type === 'sequence') {
        return (block.title || '') + ' ' + (block.steps || []).map(s => (s.label || '') + ' ' + (s.detail || '')).join(' ');
      }
      if (block.type === 'hub') {
        return (block.title || '') + ' ' + (block.center || '') + ' ' + (block.branches || []).map(b => (b.label || '') + ' ' + (b.hint || '')).join(' ');
      }
      return '';
    }
    function subsectionMatchesRevisaoQuery(sub, ql) {
      if (!ql) return true;
      if ((sub.title || '').toLowerCase().includes(ql)) return true;
      return normalizeRevisaoBlocks(sub).some(b => revisaoBlockSearchText(b).toLowerCase().includes(ql));
    }
    function countRevisaoSubItems(sub) {
      return normalizeRevisaoBlocks(sub).reduce((n, b) => {
        if (b.type === 'cards') return n + (b.items ? b.items.length : 0);
        if (b.type === 'sequence') return n + (b.steps ? b.steps.length : 0);
        if (b.type === 'hub') return n + 1 + (b.branches ? b.branches.length : 0);
        return n;
      }, 0);
    }
    function filterSubsectionsByRegion(subs, region) {
      if (!subs || !subs.length) return [];
      if (region === 'todas') return subs.slice();
      return subs.filter(sub => (sub.regiao || '') === region);
    }
    function applyRevisaoQueryToSub(sub, ql) {
      if (!ql) return sub;
      const titleMatches = (sub.title || '').toLowerCase().includes(ql);
      const blocks = normalizeRevisaoBlocks(sub).map(b => {
        if (b.type !== 'cards') return b;
        if (titleMatches) return b;
        const items = (b.items || []).filter(it =>
          (it.q || '').toLowerCase().includes(ql) || (it.a || '').toLowerCase().includes(ql)
        );
        return { ...b, items };
      }).filter(b => {
        if (b.type === 'cards') return (b.items || []).length > 0;
        return true;
      });
      return { ...sub, blocks };
    }
    const REVISAO_REGION_LABELS = {
