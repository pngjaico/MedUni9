    // ===================== Security Utilities =====================
    const CODE_SALT = 'meduni9_2026_';
    const MAX_ATTEMPTS = 5;
    const LOCKOUT_BASE_MS = 60000; // 1 minute base lockout

    async function hashCode(code) {
      const encoder = new TextEncoder();
      const data = encoder.encode(CODE_SALT + code);
      const hashBuffer = await crypto.subtle.digest('SHA-256', data);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    function getRateLimitState() {
      try {
        const raw = localStorage.getItem('meduni9_rl');
        if (!raw) return { attempts: 0, lockedUntil: 0, history: [] };
        return JSON.parse(raw);
      } catch { return { attempts: 0, lockedUntil: 0, history: [] }; }
    }

    function setRateLimitState(state) {
      localStorage.setItem('meduni9_rl', JSON.stringify(state));
    }

    function checkRateLimit() {
      const state = getRateLimitState();
      const now = Date.now();
      if (state.lockedUntil > now) {
        const remainSec = Math.ceil((state.lockedUntil - now) / 1000);
        const mins = Math.floor(remainSec / 60);
        const secs = remainSec % 60;
        return { allowed: false, message: `Muitas tentativas. Tente novamente em ${mins}m${secs}s.` };
      }
      // Clear old attempts (older than 10 minutes)
      state.history = (state.history || []).filter(t => now - t < 600000);
      if (state.history.length >= MAX_ATTEMPTS) {
        // Exponential backoff: 1min, 2min, 4min, 8min, 16min, max 30min
        const lockoutMs = Math.min(LOCKOUT_BASE_MS * Math.pow(2, state.attempts - MAX_ATTEMPTS), 1800000);
        state.lockedUntil = now + lockoutMs;
        state.attempts++;
        setRateLimitState(state);
        return { allowed: false, message: `Muitas tentativas. Bloqueado por ${Math.ceil(lockoutMs/60000)} minutos.` };
      }
      return { allowed: true };
    }

    function recordFailedAttempt() {
      const state = getRateLimitState();
      state.history = [...(state.history || []), Date.now()];
      state.attempts = (state.attempts || 0) + 1;
      setRateLimitState(state);
    }

    async function resolveRuntimeCurriculum({ appVersion, legacyMateriasRaw, profile }) {
      const catalog = await fetchJsonOrNull(`data/curriculum/catalog.json?v=${appVersion}`);
      const lessonsData = await fetchJsonOrNull(`data/curriculum/lessons.json?v=${appVersion}`);
      if (!catalog || !lessonsData) return null;

      const requestedFacultyId = profile?.faculdadeId || profile?.facultyId || DEFAULT_FACULTY_ID;
      const requestedCampusId = profile?.campusId || DEFAULT_CAMPUS_ID;
      const requestedTermId = getProfileTermId(profile);
      const curricula = Array.isArray(catalog.curricula) ? catalog.curricula : [];
      const candidates = [
        curricula.find((entry) =>
          entry.facultyId === requestedFacultyId &&
          entry.campusId === requestedCampusId &&
          entry.termId === requestedTermId &&
          entry.status === 'published'
        ),
        curricula.find((entry) => entry.curriculumId === (catalog.defaultCurriculumId || DEFAULT_CURRICULUM_ID) && entry.status === 'published'),
        ...curricula.filter((entry) => entry.status === 'published'),
      ].filter(Boolean);

      let curriculumMap = null;
      let resolutionReason = 'fallback-default';
      const seenCandidateIds = new Set();
      for (const candidate of candidates) {
        if (!candidate?.path || seenCandidateIds.has(candidate.curriculumId)) continue;
        seenCandidateIds.add(candidate.curriculumId);
        const candidateMap = await fetchJsonOrNull(`data/curriculum/${candidate.path}?v=${appVersion}`);
        if (candidateMap?.status === 'published') {
          curriculumMap = candidateMap;
          resolutionReason =
            candidate.facultyId === requestedFacultyId && candidate.campusId === requestedCampusId && candidate.termId === requestedTermId
              ? 'exact'
              : 'fallback-default';
          break;
        }
      }
      if (!curriculumMap) return null;

      return {
        curriculumId: curriculumMap.curriculumId,
        resolutionReason,
        materiasData: mapCurriculumToMaterias(curriculumMap, lessonsData, legacyMateriasRaw),
        allowedLessonIds: collectCurriculumAllowedLessonIds(curriculumMap),
      };
    }

      if (value === null || value === undefined || value === '' || value === 'all') return null;

      const source = Array.isArray(value)

            .map(s => s.trim())

      const modules = [...new Set(source.map(n => parseInt(n, 10)).filter(n => Number.isFinite(n) && n >= 1 && n <= 12))]

      return modules.length ? modules : null;

      const plan = String(codeEntry.plano || '').toLowerCase();

      if (plan === 'ciclo_clinico') return [5, 6, 7, 8];
      if (plan === 'ciclo_internato') return [9, 10, 11, 12];
      if (plan === 'mensal') return [1, 2, 3, 4];

        const inferredModule = parseInt(
          codeEntry.moduloLiberado ?? codeEntry.moduloAcesso ?? codeEntry.moduloNum ?? codeEntry.modulo ?? codeEntry.semestre,
          10
        );
        if (Number.isFinite(inferredModule) && inferredModule >= 1 && inferredModule <= 12) {

        }
      }

      return null;
    }

      const normalized = normalizeUserProfile(profile);
      return [
        'mgp',
        normalized.plano || 'basico',
        String(normalized.semestre || normalized.modulo || 1),
        normalized.codeHash || '',
        normalized.faculdadeId || DEFAULT_FACULTY_ID,
        normalized.campusId || DEFAULT_CAMPUS_ID,
        normalized.modulosAcesso ? normalized.modulosAcesso.join(',') : 'all',
      ].join('|');
    }

    function decodeProfileMarker(fbUser) {
      const raw = fbUser?.displayName || '';
      if (!raw.startsWith('mgp|')) return null;
      const parts = raw.split('|');
      const [, plano, semestreRaw, codeHash, faculdadeId, campusId, modulosRaw] = parts;
      return normalizeUserProfile({
        uid: fbUser.uid,
        email: fbUser.email || '',
        plano: plano || 'basico',
        semestre: Number(semestreRaw || 1),
        modulo: Number(semestreRaw || 1),
        codeHash: codeHash || '',
        faculdadeId: faculdadeId || DEFAULT_FACULTY_ID,
        campusId: campusId || DEFAULT_CAMPUS_ID,
        modulosAcesso: normalizeModulesAccess(modulosRaw),
        loginDate: new Date().toISOString(),
      });
    }

    // Global session identifier for multi-device block
    window.__mgpSessionToken = Math.random().toString(36).substring(2) + Date.now();

    function buildSessionTrackedProfile(profile = {}, fingerprint = '', sessionToken = '') {
      const normalized = normalizeUserProfile(profile);
      const currentDevice = (fingerprint || normalized.deviceId || '').trim();
      const previous = Array.isArray(normalized.deviceIds) ? normalized.deviceIds.filter(Boolean) : [];
      const nextDevices = currentDevice
        ? [...previous.filter(id => id !== currentDevice), currentDevice].slice(-5)
        : previous.slice(-5);
      const nowIso = new Date().toISOString();

      return {
        ...normalized,
        deviceId: currentDevice || normalized.deviceId || '',
        deviceIds: nextDevices,
        sessionToken: sessionToken || window.__mgpSessionToken || '',
        loginDate: nowIso,
        lastSeenAt: nowIso,
        lastSeenUa: (navigator.userAgent || '').slice(0, 160),
      };
    }

    async function saveUserProfile(fbUser, profile, options = {}) {
      const normalized = normalizeUserProfile(profile);
      const { updateProfile } = window.__fbAuthFns;
      try {
        await updateProfile(fbUser, { displayName: encodeProfileMarker(normalized) });
      } catch (err) {
        // Do not block login/session if displayName sync fails.
      }

      try {
        const { doc, setDoc } = window.__fbFirestore;
        const payload = {
          email: normalized.email || '',
          plano: normalized.plano || 'basico',
          semestre: normalized.semestre || 1,
          modulo: normalized.modulo || normalized.semestre || 1,
          faculdadeId: normalized.faculdadeId,
          faculdadeNome: normalized.faculdadeNome,
          campusId: normalized.campusId,
          campusNome: normalized.campusNome,
          codeHash: normalized.codeHash || '',
          modulosAcesso: normalized.modulosAcesso || null,
          deviceId: normalized.deviceId || '',
          deviceIds: Array.isArray(normalized.deviceIds) ? normalized.deviceIds.filter(Boolean).slice(-5) : [],
          sessionToken: normalized.sessionToken || '',
          maxDispositivos: Number(normalized.maxDispositivos || 2),
          accessSource: normalized.accessSource || '',
          emailGrantId: normalized.emailGrantId || '',
          criadoEm: normalized.criadoEm || new Date().toISOString(),
          loginDate: normalized.loginDate || new Date().toISOString(),
          lastSeenAt: normalized.lastSeenAt || normalized.loginDate || new Date().toISOString(),
          lastSeenUa: normalized.lastSeenUa || '',
        };
        if (normalized.termsVersionAccepted) payload.termsVersionAccepted = normalized.termsVersionAccepted;
        if (normalized.termsAcceptedAt) payload.termsAcceptedAt = normalized.termsAcceptedAt;
        if (normalized.privacyAcceptedAt) payload.privacyAcceptedAt = normalized.privacyAcceptedAt;
        try {
          await setDoc(doc(window.__fbDb, 'users', fbUser.uid), payload, { merge: true });
        } catch (writeErr) {
          if ((writeErr?.code || '') !== 'permission-denied') throw writeErr;
          try {
            await syncUserProfileAccessOnServer(fbUser, payload);
          } catch (syncErr) {
            console.warn('[security] perfil nao sincronizado pelo servidor', syncErr?.message || syncErr);
          }
        }
      } catch (err) {
        if ((err?.code || '') !== 'permission-denied') throw err;
      }
    }

    async function loadUserProfile(fbUser) {
      try {
        const { doc, getDoc } = window.__fbFirestore;
        const snap = await getDoc(doc(window.__fbDb, 'users', fbUser.uid));
        if (snap.exists()) {
          return normalizeUserProfile({ uid: fbUser.uid, email: fbUser.email || '', ...snap.data() });
        }
      } catch {}

      return decodeProfileMarker(fbUser);
    }

    const EMAIL_ACCESS_COLLECTION = 'email_access';

    function normalizeAuthEmail(email) {
      return String(email || '').trim().toLowerCase();
    }

    function isEmailGrantValid(grant) {
      if (!grant || grant.ativo === false) return false;
      if (grant.expira) {
        const exp = new Date(grant.expira);
        if (Number.isNaN(+exp)) return false;
        const end = new Date(exp.getFullYear(), exp.getMonth(), exp.getDate(), 23, 59, 59, 999);
        if (new Date() > end) return false;
      }
      return true;
    }

    async function loadEmailAccessGrant(email) {
      const norm = normalizeAuthEmail(email);
      if (!norm || !window.__fbFirestore || !window.__fbDb) return null;
      try {
        const { doc, getDoc } = window.__fbFirestore;
        const snap = await getDoc(doc(window.__fbDb, EMAIL_ACCESS_COLLECTION, norm));
        if (!snap.exists()) return null;
        return { id: norm, ...snap.data() };
      } catch {
        return null;
      }
    }

    async function syncProfileAccessFromEmailGrant(fbUser, profile) {
      if (!profile || !fbUser?.email) return profile;
      try {
        const profileSource = String(profile.accessSource || '').toLowerCase();
        const legacySourceSet = new Set([
          'legacy_key', 'legacy_code', 'codigo', 'code', 'key', 'cupom', 'coupon', 'manual_key'
        ]);
        const hasLegacyCode = !!String(profile.codeHash || '').trim();
        const isLegacyKeyOnlyProfile =
          hasLegacyCode ||
          legacySourceSet.has(profileSource) ||
          (
            profileSource &&
            profileSource !== 'stripe' &&
            profileSource !== 'stripe_refund' &&
            profileSource !== 'email_invite' &&
            profileSource !== 'demo_account' &&
            profileSource !== 'ambassador'
          );

        const grant = await loadEmailAccessGrant(fbUser.email);
        if (!grant) {
          if (profileSource === 'stripe' || profileSource === 'stripe_refund' || isLegacyKeyOnlyProfile) {
            const downgradedNoGrant = normalizeUserProfile({
              ...profile,
              plano: 'gratuito',
              modulosAcesso: [1],
              maxDispositivos: 2,
              accessSource: isLegacyKeyOnlyProfile ? 'email_required' : 'stripe_refund',
              emailGrantId: normalizeAuthEmail(fbUser.email),
              codeHash: '',
            });
            try {
              await saveUserProfile(fbUser, buildSessionTrackedProfile(downgradedNoGrant), { merge: true });
            } catch {}
            return downgradedNoGrant;
          }
          return profile;
        }
        if (!isEmailGrantValid(grant)) {
          const profileSource = String(profile.accessSource || '').toLowerCase();
          const grantSource = String(grant.accessSource || '').toLowerCase();
          const shouldDowngradeFromGrant =
            profileSource === 'stripe' ||
            profileSource === 'stripe_refund' ||
            grantSource === 'stripe' ||
            grant.ativo === false;
          if (!shouldDowngradeFromGrant) return profile;

          const downgraded = normalizeUserProfile({
            ...profile,
            plano: 'gratuito',
            modulosAcesso: [1],
            maxDispositivos: 2,
            accessSource: 'stripe_refund',
            emailGrantId: grant.id || normalizeAuthEmail(fbUser.email),
          });
          try {
            await saveUserProfile(fbUser, buildSessionTrackedProfile(downgraded), { merge: true });
          } catch {}
          return downgraded;
        }

        const incomingModules = resolveModulesFromCodeEntry(grant);
        const currentModules = normalizeModulesAccess(profile.modulosAcesso);
        const incomingPlan = grant.plano || profile.plano || 'basico';
        const incomingMax = Number(grant.maxDispositivos || profile.maxDispositivos || 2);
        const normalizedPlan = String(incomingPlan || '').toLowerCase();
        const safeIncomingModules = (normalizedPlan === 'modulo' && !incomingModules)
          ? (currentModules || null)
          : incomingModules;
        const grantSource = grant.accessSource === 'stripe' ? 'stripe' : 'email_invite';

        const merged = normalizeUserProfile({
          ...profile,
          plano: incomingPlan,
          modulosAcesso: safeIncomingModules,
          maxDispositivos: incomingMax,
          accessSource: grantSource,
          emailGrantId: grant.id || normalizeAuthEmail(fbUser.email),
          codeHash: '',
        });

        const modulesChanged = JSON.stringify(merged.modulosAcesso || null) !== JSON.stringify(currentModules || null);
        const planChanged = incomingPlan !== (profile.plano || 'basico');
        const maxChanged = incomingMax !== Number(profile.maxDispositivos || 2);
        const sourceChanged = (profile.accessSource || '') !== grantSource;

        if (!modulesChanged && !planChanged && !maxChanged && !sourceChanged) return profile;

        try {
          await saveUserProfile(fbUser, buildSessionTrackedProfile(merged), { merge: true });
        } catch {}

        return merged;
      } catch {
        return profile;
      }
    }

    /** Chaves estáticas removidas; perfis legados com codeHash não sincronizam mais por JSON. */
    async function syncProfileAccessFromCodeEntry(fbUser, profile) {

    }

    async function checkAmbassadorQualification(profile) {
      if (!profile || !profile.ambassadorVitalicio) return profile;

      try {
        const fullModules = getAmbassadorModules();
        const lastCheck = profile.lastQualificationCheck ? new Date(profile.lastQualificationCheck) : null;
        const now = new Date();
        const daysSinceCheck = lastCheck ? (now - lastCheck) / (1000 * 60 * 60 * 24) : 999;

        // First month grace period: starts approved and keeps full access for 30 days.
        if (!lastCheck) {
          const firstMonthApproved = {
            ...profile,
            qualificationStatus: 'approved',
            lastQualificationCheck: now.toISOString(),
            modulosAcesso: fullModules
          };
          if (window.__fbAuth?.currentUser) {
            try {
              await saveUserProfile(window.__fbAuth.currentUser, buildSessionTrackedProfile(firstMonthApproved), { merge: true });
            } catch {}
          }
          return firstMonthApproved;
        }

        // Only check every 30 days
        if (lastCheck && daysSinceCheck < 30) {
          if (profile.qualificationStatus === 'suspended') return profile;
          return { ...profile, modulosAcesso: fullModules };
        }

        // Fetch sales data for current month
        const currentMonth = now.toISOString().slice(0, 7);
        const response = await fetch('data/vendas_mensais.json?_=' + Date.now());
        if (!response.ok) {
          // Fallback: keep current status if fetch fails
          return profile;
        }

        const salesData = await response.json();
        const monthSales = salesData[currentMonth] || {};
  const ambassadorRef = profile.ambassadorId || profile.uid;
  const ambassadorSales = monthSales[ambassadorRef];

        const hasMinSale = ambassadorSales && ambassadorSales.count >= 1;
        const newStatus = hasMinSale ? 'approved' : 'suspended';

        const updated = {
          ...profile,
          qualificationStatus: newStatus,
          lastQualificationCheck: now.toISOString(),
          modulosAcesso: newStatus === 'suspended' ? null : fullModules
        };

        // Save updated status
        if (window.__fbAuth?.currentUser) {
          try {
            await saveUserProfile(window.__fbAuth.currentUser, buildSessionTrackedProfile(updated), { merge: true });
          } catch {}
        }

        return updated;
      } catch (err) {
        // Fallback: keep existing profile on any error
        console.warn('Ambassador qualification check failed:', err);
        return profile;
      }
    }

    // Auth Screen — cadastro: 1=conta 2=instituição 3=módulo (sem chave estática)
    const AuthScreen = ({ onAuthSuccess }) => {

      const resolvedEmailModules = emailInviteGrant ? resolveModulesFromCodeEntry(emailInviteGrant) : null;
      const allowedSemesters = resolvedEmailModules?.length ? resolvedEmailModules : getAmbassadorModules();

      useEffect(() => {
        generateDeviceFingerprint().then(fp => setFingerprint(fp));
      }, []);

      useEffect(() => {
        let cancelled = false;
        (async () => {
          const u = window.__fbAuth?.currentUser;
          if (!u?.email) return;
          const p = await loadUserProfile(u);
          if (p) {
            if (!isAccountBlocked(p) && !isTermsCurrent(p)) {
              setPendingTermsFirebaseUser(u);
              setPendingTermsProfile(p);
              setMode('login');
              setError('');
            }

          }
          const grant = await loadEmailAccessGrant(u.email);

          setRegFirebaseUser(u);
          setEmail(u.email || '');
          setEmailInviteGrant(grant && isEmailGrantValid(grant) ? grant : null);
          setMode('register');
          setStep(2);
          setError('');
        })();
        return () => { cancelled = true; };
      }, []);

      useEffect(() => {
        if (step !== 3) return;

      const applyProfile = (profile) => {

          return;
        }
        if (!isTermsCurrent(profile) && !profile?.isGuest) {
          setPendingTermsFirebaseUser(window.__fbAuth?.currentUser || regFirebaseUser || null);
          setPendingTermsProfile(profile);

      const beginIncompleteRegistration = (fbUser, message) => {

      const beginEmailInviteCompletion = (fbUser, grant) => {

      const handleCreateWithEmail = async () => {

        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { setError('Email inválido'); return; }
        if (!password || password.length < 6) { setError('Senha deve ter no mínimo 6 caracteres'); return; }
        if (password !== confirmPassword) { setError('As senhas não coincidem'); return; }
        if (!termsAccepted) { setError('Leia e aceite os Termos de Uso para criar a conta.'); return; }
        setLoading(true);
        try {

            setError('Conta suspensa ou banida. Entre em contato com o suporte.');

            return;
          }
          if (!isTermsCurrent(profile)) {
            setPendingTermsFirebaseUser(cred.user);
            setPendingTermsProfile(profile);
            return;
          }
          const trackedProfile = buildSessionTrackedProfile(profile, fingerprint);
          try { await saveUserProfile(cred.user, trackedProfile, { merge: true }); } catch {}
          applyProfile(trackedProfile);
        } catch (err) {
          setLoading(false);
          if (err.code !== 'auth/popup-closed-by-user') setError('Erro ao entrar com Google.');
        }
      };

      // ── forgot password ───────────────────────────────────────────────────
      const handleForgotPassword = async () => {
        setError('');
        if (!forgotEmail) { setError('Digite seu email'); return; }
        setLoading(true);
        try {
          const { sendPasswordResetEmail } = window.__fbAuthFns;
          await sendPasswordResetEmail(window.__fbAuth, forgotEmail);
          setForgotSent(true);
          setLoading(false);
        } catch {
          setLoading(false);
          setError('Erro ao enviar email. Verifique o endereço.');
        }
      };

      // ── free access (no code) ─────────────────────────────────────────────
      const handleAcceptPendingTerms = async () => {
        const fbUser = pendingTermsFirebaseUser || window.__fbAuth?.currentUser;
        if (!fbUser || !pendingTermsProfile) {
          setError('Sessão expirada. Entre novamente.');
          return;
        }
        setTermsAccepting(true);
        setError('');
        try {
          const termsPatch = await acceptTermsForFirebaseUser(fbUser);
          const merged = buildSessionTrackedProfile({ ...pendingTermsProfile, ...termsPatch }, fingerprint);
          try { await saveUserProfile(fbUser, merged, { merge: true }); } catch {}
          setPendingTermsProfile(null);
          setPendingTermsFirebaseUser(null);
          applyProfile(merged);
        } catch (err) {
          setError(err?.message || 'Não foi possível registrar o aceite dos termos.');
        } finally {
          setTermsAccepting(false);
        }
      };

      const handleFreeAccess = () => {
        const freeProfile = {
          uid: 'guest_' + Date.now(),
          email: 'visitante@medgradplus.app',
          plano: 'gratuito',
          semestre: 1,
          modulo: 1,
          modulosAcesso: [1, 2, 3, 4, 5, 6],
          faculdadeId: 'uninove',
          campusId: 'vergueiro',
          codeHash: '',
          deviceId: fingerprint || 'guest',
          loginDate: new Date().toISOString(),
          isGuest: true,
          freeTrialVersion: 2,
        };
        applyProfile(freeProfile);

          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
        </svg>

                    {loading ? 'Entrando...' : 'Entrar'}

                  <Divider />
                  <button className="btn btn-secondary" onClick={handleGoogleLogin} disabled={loading}
                    style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', gap: '8px' }}>
                    <GoogleIcon /> Entrar com Google
                  </button>
                  <div style={{ marginTop: '16px', padding: '12px 14px', borderRadius: '12px', background: 'rgba(0,200,150,0.06)', border: '1px solid rgba(0,200,150,0.22)', textAlign: 'center' }}>
                    <p style={{ fontSize: '12px', color: 'var(--text-secondary)', margin: '0 0 10px', lineHeight: 1.45 }}>
                      Teste grátis premium: <strong style={{ color: 'rgba(255,255,255,0.86)' }}>6 aulas escolhidas</strong>, atlas liberado, prévia de cronograma, 5 questões e 5 flashcards por aula.
                    </p>
                    <div className="auth-free-actions">
                      <button type="button" className="auth-free-compact-btn" onClick={handleFreeAccess} disabled={loading} aria-label="Experimentar gratuitamente sem cadastro">
                        Entrar no teste grátis
                      </button>
                      <a href={getCheckoutHref(email)} className="auth-plan-link">
                        Comprar acesso completo
                      </a>
                    </div>
                  </div>
                  <p style={{ textAlign: 'center', marginTop: '12px', fontSize: '13px', color: 'var(--text-secondary)' }}>
                    Primeira vez?{' '}
                    <button type="button" onClick={() => { setMode('register'); setStep(1); setError(''); }}
                      style={{ background: 'none', border: 'none', color: 'var(--accent-color, #00C896)', cursor: 'pointer', fontSize: '13px', padding: 0 }}>
                      Criar conta
                    </button>
                  </p>
                </div>
              )}

              {!showForgot && !pendingTermsProfile && mode === 'register' && (
                <div>
                  {/* Step indicator: conta → faculdade → módulo */}
                  <div style={{ display: 'flex', alignItems: 'center', gap: '6px', marginBottom: '20px' }}>

                        <div style={{ width: '24px', height: '24px', borderRadius: '50%', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '11px', fontWeight: 'bold',
                          background: step >= s ? 'var(--accent-color, #00C896)' : 'var(--border-color, #333)',
                          color: step >= s ? '#000' : 'var(--text-secondary)' }}>{s}</div>
                        {s < 3 && <div style={{ flex: 1, height: '2px', background: step > s ? 'var(--accent-color, #00C896)' : 'var(--border-color, #333)' }}></div>}
                      </React.Fragment>
                    ))}
                  </div>

                  {/* Step 1: Create account */}
                  {step === 1 && (
                    <div>
                      <h2 style={{ fontSize: '18px', marginBottom: '6px', color: 'var(--text-primary)', fontFamily: 'Outfit' }}>Criar sua conta</h2>
                      <p style={{ fontSize: '13px', color: 'var(--text-secondary)', marginBottom: '20px' }}>
                        Use o mesmo email em que recebeu o convite (se houver). Depois você escolhe faculdade e módulo. Sem convite, sua conta fica em modo demonstração, como o visitante.
                      </p>
                      {error && <div className="error-message" style={{ marginBottom: '12px' }}>{error}</div>}
                      <input className="form-input" type="email" placeholder="Email" value={email}
                        onChange={e => { setEmail(e.target.value); setError(''); }} style={{ marginBottom: '10px' }} />
                      <div style={{ position: 'relative', marginBottom: '10px' }}>
                        <input className="form-input" type={showPass ? 'text' : 'password'} placeholder="Senha (mín. 6 caracteres)"
                          value={password} onChange={e => { setPassword(e.target.value); setError(''); }}
                          style={{ paddingRight: '52px' }} />
                        <button type="button" onClick={() => setShowPass(s => !s)}
                          style={{ position: 'absolute', right: '12px', top: '50%', transform: 'translateY(-50%)', background: 'none', border: 'none', cursor: 'pointer', color: 'var(--text-secondary)', fontSize: '12px' }}>
                          {showPass ? 'ocultar' : 'ver'}
                        </button>
                      </div>
                      <input className="form-input" type={showPass ? 'text' : 'password'} placeholder="Confirmar senha"
                        value={confirmPassword} onChange={e => { setConfirmPassword(e.target.value); setError(''); }} style={{ marginBottom: '12px' }} />
                      <label style={{ display: 'flex', alignItems: 'flex-start', gap: '10px', padding: '12px', border: '1px solid rgba(255,255,255,0.14)', borderRadius: '10px', background: 'rgba(255,255,255,0.04)', marginBottom: '12px', cursor: 'pointer' }}>

                          type="checkbox"

                          <span style={{ fontSize: '12px', color: 'var(--text-secondary)', lineHeight: 1.45 }}>

                </div>

            </div>
          </div>
        </div>
      );
    };

    const StudyScheduleWidget = ({ user, materias, flashcards, onNavigateTo, onConfigStateChange }) => {
      const userSemester = user.semestre || user.modulo || 1;
      const moduleMaterias = useMemo(
        () => (materias || []).filter((m) => (m.modulo || m.semestre) === userSemester && m.ativo !== false),
        [materias, userSemester]
      );
      const [schedule, setSchedule] = useState(null);
      const [form, setForm] = useState(null);
      const [editing, setEditing] = useState(false);
      const [lessonPicker, setLessonPicker] = useState(null);
      const [activeTaskId, setActiveTaskId] = useState('');
      const [loading, setLoading] = useState(true);
      const [saving, setSaving] = useState(false);
      const [message, setMessage] = useState('');
      const [aiBusy, setAiBusy] = useState(false);
      const [templateBusy, setTemplateBusy] = useState(false);
      const [aiText, setAiText] = useState('');
      const [aiFile, setAiFile] = useState(null);
      const [manualDraft, setManualDraft] = useState({ date: getScheduleDateInBrasilia(), materiaId: '', aulaId: '' });
      const todayKey = getScheduleDateInBrasilia();
      const weekDays = useMemo(() => {
        const today = scheduleDateToUtc(todayKey);
        const start = scheduleAddDays(todayKey, today ? -today.getUTCDay() : 0);
        const days = [];
        let cur = start;
        while (days.length < 7) {
          days.push(cur);
          cur = scheduleAddDays(cur, 1);
        }
        return days;
      }, [todayKey]);

      useEffect(() => {
        if (onConfigStateChange) onConfigStateChange(editing);
        return () => {
          if (onConfigStateChange) onConfigStateChange(false);
        };
      }, [editing, onConfigStateChange]);

      const buildEmptySchedule = useCallback(() => normalizeStudySchedule({
        module: userSemester,
        room: user?.room || 'A',
        dailyTarget: 2,
        examDates: { p1: '', p2: '', av2: '' },
        p1LessonsByMateria: {},
        p2LessonsByMateria: {},
        manualItems: [],
        completedItems: [],
        source: 'manual',
      }, user, moduleMaterias), [user, userSemester, moduleMaterias]);

      useEffect(() => {
        let cancelled = false;
        const load = async () => {
          setLoading(true);
          setMessage('');
          const localKey = getStudyScheduleStorageKey(user);
          let loaded = parseLocalJson(localKey, null);
          const currentUser = window.__fbAuth?.currentUser || null;
          if (currentUser && window.__fbFirestore && window.__fbDb) {
            try {
              const { doc, getDoc } = window.__fbFirestore;
              const snap = await getDoc(doc(window.__fbDb, 'users', currentUser.uid, 'study_schedule', 'main'));
              if (snap.exists()) loaded = snap.data();
            } catch (e) {
              setMessage('Não consegui sincronizar o cronograma agora. Usando dados locais.');
            }
          }
          if (cancelled) return;
          const normalized = loaded ? normalizeStudySchedule(loaded, user, moduleMaterias) : null;
          setSchedule(normalized);
          setForm(normalized || buildEmptySchedule());
          setEditing(false);
          setManualDraft((prev) => ({ ...prev, materiaId: moduleMaterias[0]?.id || '' }));
          setLoading(false);
        };
        load();
        return () => { cancelled = true; };
      }, [user?.uid, user?.email, userSemester, moduleMaterias, buildEmptySchedule]);

      const persistSchedule = async (nextSchedule, options = {}) => {
        const normalized = normalizeStudySchedule(nextSchedule, user, moduleMaterias);
        setSaving(true);
        setMessage('');
        try {
          localStorage.setItem(getStudyScheduleStorageKey(user), JSON.stringify(normalized));
          const currentUser = window.__fbAuth?.currentUser || null;
          if (currentUser && window.__fbFirestore && window.__fbDb) {
            const { doc, setDoc } = window.__fbFirestore;
            await setDoc(doc(window.__fbDb, 'users', currentUser.uid, 'study_schedule', 'main'), normalized, { merge: true });
            if (options.confirmTemplate !== false && normalized.room && normalized.examDates.p1) {
              try {
                const token = await currentUser.getIdToken();
                fetch(STUDY_TEMPLATE_FUNCTION_URL, {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
                  body: JSON.stringify({ schedule: normalized }),
                }).catch(() => {});
              } catch (_) {}
            }
          } else {
            setMessage('Cronograma salvo neste aparelho. Entre na conta para sincronizar.');
          }
          setSchedule(normalized);
          setForm(normalized);
          setEditing(false);
        } catch (e) {
          setMessage('Não foi possível salvar agora. Tente novamente ou use o modo local.');
        } finally {
          setSaving(false);
        }
      };

      const errorQuestionCount = useMemo(() => {
        const raw = parseLocalJson('meduni9_caderno_erros', []);
        return [...new Set((Array.isArray(raw) ? raw : []).map(String).filter(Boolean))].length;
      }, [todayKey]);
      const dueFlashcardsCount = useMemo(() => {
        const moduleIds = new Set(moduleMaterias.map((m) => m.id));
        const srData = parseLocalJson('meduni9_sr_data', {});
        const cards = (flashcards || []).filter((card) => moduleIds.has(card?.materia));
        return SM2.getDueReviewCards(cards, srData).length;
      }, [flashcards, moduleMaterias, todayKey]);
      const generatedItems = useMemo(
        () => generateStudyScheduleItems(schedule, moduleMaterias, { todayKey, errorQuestionCount, dueFlashcardsCount }),
        [schedule, moduleMaterias, todayKey, errorQuestionCount, dueFlashcardsCount]
      );
      const todayItems = generatedItems.filter((item) => item.date === todayKey).slice(0, 5);
      const nextExam = getNextScheduleExam(schedule, todayKey);
      const daysUntilExam = nextExam ? Math.max(0, Math.ceil((scheduleDateToUtc(nextExam.date) - scheduleDateToUtc(todayKey)) / 86400000)) : null;
      const weekItemsByDay = useMemo(() => {
        const map = new Map(weekDays.map((day) => [day, []]));
        generatedItems.forEach((item) => {
          if (map.has(item.date)) map.get(item.date).push(item);
        });
        return map;
      }, [generatedItems, weekDays]);
      const selectedP1Count = useMemo(() => Object.values(form?.p1LessonsByMateria || {}).reduce((sum, ids) => sum + (Array.isArray(ids) ? ids.length : 0), 0), [form]);
      const selectedP2Count = useMemo(() => Object.values(form?.p2LessonsByMateria || {}).reduce((sum, ids) => sum + (Array.isArray(ids) ? ids.length : 0), 0), [form]);
      const totalModuleLessons = useMemo(() => moduleMaterias.reduce((sum, materia) => sum + ((materia.aulas || []).length), 0), [moduleMaterias]);
      const materiaAccentMap = useMemo(() => {
        const map = new Map();
        moduleMaterias.forEach((materia, index) => {
          map.set(materia.id, materia.cor || materia.color || materia.accent || STUDY_SCHEDULE_MATERIA_COLORS[index % STUDY_SCHEDULE_MATERIA_COLORS.length]);
        });
        return map;
      }, [moduleMaterias]);
      const pickerMateria = lessonPicker?.materiaId ? moduleMaterias.find((m) => m.id === lessonPicker.materiaId) : null;
      const pickerLessons = useMemo(() => {
        if (!pickerMateria) return [];
        const query = String(lessonPicker?.query || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
        return (pickerMateria.aulas || []).filter((aula, idx) => {
          if (!query) return true;
          const haystack = `${idx + 1} ${aula.id || ''} ${aula.tema || ''} ${aula.descricao || ''}`
            .toLowerCase()
            .normalize('NFD')
            .replace(/[\u0300-\u036f]/g, '');
          return haystack.includes(query);
        });
      }, [pickerMateria, lessonPicker]);
      const phaseLabel = { p1: 'P1', p2: 'P2', av2: 'AV2', manual: 'Manual' };
      const getMateriaAccent = (materiaId) => materiaAccentMap.get(materiaId) || STUDY_SCHEDULE_PHASE_COLORS.study;
      const getTaskPhase = (item) => item.manual ? 'manual' : (item.phase || (item.reviewType ? 'av2' : 'study'));
      const scheduleHasContent = !!(schedule && (
        schedule.examDates?.p1 ||
        schedule.examDates?.p2 ||
        schedule.examDates?.av2 ||
        generatedItems.length > 0

      const updateForm = (patch) => setForm((prev) => normalizeStudySchedule({ ...(prev || buildEmptySchedule()), ...patch }, user, moduleMaterias));

      const updateP1Lessons = (materiaId, lessonIds) => {
        const nextP1 = { ...(form?.p1LessonsByMateria || {}), [materiaId]: lessonIds };

      const sortLessonIdsForMateria = (materia, lessonIds) => {
        const selected = new Set(Array.isArray(lessonIds) ? lessonIds : []);
        return getMateriaLessonIds(materia).filter((id) => selected.has(id));
      };
      const openLessonPicker = (materia) => {
        setLessonPicker({
          materiaId: materia.id,
          query: '',

        setLessonPicker((prev) => {
          if (!prev) return prev;

          if (current.has(lessonId)) current.delete(lessonId); else current.add(lessonId);
          return { ...prev, draftIds: [...current] };
        });
      };
      const applyLessonPicker = () => {
        if (!pickerMateria || !lessonPicker) return;
        updateP1Lessons(pickerMateria.id, sortLessonIdsForMateria(pickerMateria, lessonPicker.draftIds || []));
        closeLessonPicker();
      };
      const addManualItem = () => {
        const found = findMateriaLesson(moduleMaterias, manualDraft.aulaId);
        const materiaId = manualDraft.materiaId || found?.materia?.id || moduleMaterias[0]?.id || '';

        const nextItem = {
          id: `manual:${Date.now()}`,

        };
        updateForm({ manualItems: [...(form?.manualItems || []), nextItem] });

      const removeManualItem = (itemId) => updateForm({ manualItems: (form?.manualItems || []).filter((item) => item.id !== itemId) });

      const toggleCompleted = async (itemId) => {
        if (!schedule) return;
        const current = new Set(schedule.completedItems || []);
        if (current.has(itemId)) current.delete(itemId); else current.add(itemId);
        await persistSchedule({ ...schedule, completedItems: [...current] }, { confirmTemplate: false });
      };

      const readFileAsBase64 = (file) => new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(String(reader.result || '').split(',')[1] || '');
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });

      const readFileAsText = (file) => new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(String(reader.result || '').slice(0, 12000));
        reader.onerror = reject;
        reader.readAsText(file);
      });

      const mimeForFile = (file) => {
        if (file?.type) return file.type;
        const name = String(file?.name || '').toLowerCase();
        if (name.endsWith('.pdf')) return 'application/pdf';
        if (name.endsWith('.csv') || name.endsWith('.txt')) return 'text/plain';
        return 'text/plain';
      };

      const isScheduleTextUpload = (file) => {
        const mime = mimeForFile(file);
        const name = String(file?.name || '').toLowerCase();
        return mime === 'text/plain' || mime === 'text/csv' || name.endsWith('.csv') || name.endsWith('.txt');
      };

      const isUnsupportedSpreadsheetUpload = (file) => {
        const name = String(file?.name || '').toLowerCase();
        return name.endsWith('.xlsx') || name.endsWith('.xls');
      };

      const fillWithAi = async () => {
        const currentUser = window.__fbAuth?.currentUser || null;
        if (!currentUser) {
          setMessage('Entre na conta para usar IA. O modo manual funciona sem isso.');
          return;
        }
        if (!aiFile && !aiText.trim()) {
          setMessage('Envie um arquivo ou cole o texto do cronograma.');
          return;
        }
        if (aiFile && isUnsupportedSpreadsheetUpload(aiFile)) {
          setMessage('Excel (.xls/.xlsx) ainda não é confiável na API. Salve como CSV ou cole o conteúdo da planilha.');
          return;
        }
        setAiBusy(true);
        setMessage('');
        try {
          const token = await currentUser.getIdToken();
          const textUpload = aiFile && isScheduleTextUpload(aiFile);
          const fileText = textUpload ? await readFileAsText(aiFile) : '';
          const base64 = aiFile && !textUpload ? await readFileAsBase64(aiFile) : '';
          const promptText = [
            aiText.trim(),
            fileText ? `Conteúdo do arquivo ${aiFile.name}:\n${fileText}` : '',
          ].filter(Boolean).join('\n\n');
          const res = await fetch(STUDY_SCHEDULE_FUNCTION_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
            body: JSON.stringify({
              fileName: aiFile?.name || '',
              mimeType: aiFile && !textUpload ? mimeForFile(aiFile) : '',
              base64,
              text: promptText,
              module: userSemester,
              room: form?.room || '',
              materias: moduleMaterias.map((m) => ({
                id: m.id,
                nome: m.nome,
                sigla: m.sigla,
                modulo: m.modulo || m.semestre,
                aulas: (m.aulas || []).map((a) => ({ id: a.id, tema: a.tema })),
              })),
            }),
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok) throw new Error(data.error || 'Falha ao analisar cronograma.');
          const draft = data.draft || {};
          const merged = normalizeStudySchedule({
            ...(form || buildEmptySchedule()),
            room: draft.room || form?.room,
            examDates: { ...(form?.examDates || {}), ...(draft.examDates || {}) },
            p1LessonsByMateria: { ...(form?.p1LessonsByMateria || {}), ...(draft.p1LessonsByMateria || {}) },
            p2LessonsByMateria: draft.p2LessonsByMateria || form?.p2LessonsByMateria || {},
            source: 'ai_draft',
          }, user, moduleMaterias);
          setForm(merged);
          setEditing(true);
          setMessage((draft.confidence === 'low' ? 'IA com baixa confiança. ' : '') + 'Rascunho preenchido. Revise antes de salvar.');
        } catch (e) {
          setMessage(e.message || 'A IA falhou. Use o modo manual.');
        } finally {
          setAiBusy(false);
        }
      };

      const applyTemplateSuggestion = async () => {
        const currentUser = window.__fbAuth?.currentUser || null;
        if (!currentUser || !window.__fbFirestore || !window.__fbDb) {
          setMessage('Entre na conta para buscar sugestão da turma. O modo manual continua disponível.');
          return;
        }
        if (!form?.room || !form?.examDates?.p1) {
          setMessage('Informe sala e data da P1 para buscar sugestão da turma.');
          return;
        }
        setTemplateBusy(true);
        setMessage('');
        try {
          const { doc, getDoc } = window.__fbFirestore;
          const templateId = buildStudyTemplateId(user, form);
          const snap = await getDoc(doc(window.__fbDb, 'schedule_templates', templateId));
          if (!snap.exists()) {
            setMessage('Ainda não há sugestão confirmada para essa sala e P1.');
            return;
          }
          const template = snap.data() || {};
          const merged = normalizeStudySchedule({
            ...(form || buildEmptySchedule()),
            room: template.room || form?.room,
            examDates: { ...(form?.examDates || {}), ...(template.examDates || {}) },
            p1LessonsByMateria: template.p1LessonsByMateria || form?.p1LessonsByMateria || {},
            p2LessonsByMateria: template.p2LessonsByMateria || form?.p2LessonsByMateria || {},
            source: 'template',
          }, user, moduleMaterias);
          setForm(merged);
          setEditing(true);
          setMessage('Encontramos um cronograma provável para sua turma. Revise antes de salvar.');
        } catch (e) {
          setMessage('Não consegui buscar sugestão da turma agora. Continue pelo modo manual.');
        } finally {
          setTemplateBusy(false);
        }
      };

      const saveForm = () => {
        const draft = form || buildEmptySchedule();
        const p1 = normalizeScheduleDateKey(draft.examDates?.p1);
        const p2 = normalizeScheduleDateKey(draft.examDates?.p2);
        const av2 = normalizeScheduleDateKey(draft.examDates?.av2);
        if (!p1 || !p2 || !av2) {
          setMessage('Informe as datas de P1, P2 e AV2 para montar o cronograma.');
          return;
        }
        if (compareScheduleDateKeys(p1, p2) >= 0 || compareScheduleDateKeys(p2, av2) >= 0) {
          setMessage('As datas precisam seguir a ordem P1, depois P2, depois AV2.');
          return;
        }
        persistSchedule({ ...draft, examDates: { ...draft.examDates, p1, p2, av2 }, source: draft.source || 'manual' });
      };
      const regenerateWeek = () => schedule && persistSchedule({ ...schedule, generatedAt: new Date().toISOString() }, { confirmTemplate: false });
      const openForm = () => {
        setForm(schedule || form || buildEmptySchedule());
        setEditing(true);
        setActiveTaskId('');
      };
      const closeWidget = () => {
        setForm(schedule || form || buildEmptySchedule());
        setEditing(false);
        setLessonPicker(null);
      };

      const renderTaskActions = (item) => {

            <div className="study-task-actions">
              <button type="button" onClick={() => onNavigateTo('quiz', null, null)}>Caderno</button>
            </div>
          );
        }
        if (item.reviewType === 'due_flashcards') {
          return (
            <div className="study-task-actions">
              <button type="button" onClick={() => onNavigateTo('cards', null, null)}>Flashcards</button>
            </div>
          );
        }
        if (item.reviewType === 'essentials') {
          return (
            <div className="study-task-actions">
              <button type="button" onClick={() => onNavigateTo('quiz', null, null)}>Questões</button>
              <button type="button" onClick={() => onNavigateTo('cards', null, null)}>Flashcards</button>
            </div>

        }
        return (
          <div className="study-task-actions">
            <button type="button" onClick={() => onNavigateTo('materials', item.materiaId, item.aulaId || null)}>Material</button>
            <button type="button" onClick={() => onNavigateTo('quiz', item.materiaId, item.aulaId || null)}>Questões</button>
            <button type="button" onClick={() => onNavigateTo('cards', item.materiaId, item.aulaId || null)}>Flashcards</button>
          </div>
        );
      };

      const renderWeekTask = (item) => {
        const isOpen = activeTaskId === item.id;
        const taskPhase = getTaskPhase(item);
        const taskAccent = STUDY_SCHEDULE_PHASE_COLORS[taskPhase] || getMateriaAccent(item.materiaId);
        return (
          <div key={item.id} className={'study-week-task phase-' + taskPhase + (item.completed ? ' done' : '')} style={{ '--task-accent': taskAccent }}>

              <button type="button" className="study-week-task-main" onClick={() => setActiveTaskId(isOpen ? '' : item.id)} aria-expanded={isOpen}>
                <span className="study-task-title">{item.title}</span>
                <span className="study-task-meta">{phaseLabel[taskPhase] || taskPhase || 'Estudo'}</span>
              </button>
            </div>
            {isOpen && renderTaskActions(item)}
          </div>

      };

      if (loading) {
        return (
          <div className="study-schedule-card">
            <div className="study-schedule-head">
              <div>
                <div className="study-schedule-kicker">Cronograma</div>
                <div className="study-schedule-title">Carregando...</div>
                <div className="study-schedule-sub">Buscando seu plano de estudos.</div>
              </div>
            </div>
          </div>
        );
      }

      if (editing) {
        return (
          <div className="study-config-page">
            <div className="study-config-topbar">
              <button type="button" className="study-schedule-btn" onClick={closeWidget}>Voltar</button>
              <div>
                <div className="study-schedule-kicker">Cronograma</div>
                <div className="study-schedule-title">Configurar provas</div>
                <div className="study-schedule-sub">Selecione as aulas que caem na P1. P2 e AV2 serão montadas automaticamente.</div>
              </div>
              <button type="button" className="study-schedule-btn primary" onClick={saveForm} disabled={saving}>{saving ? 'Salvando...' : 'Salvar'}</button>
            </div>

            {message && <div className="study-alert">{message}</div>}

            <div className="study-config-summary">
              <div className="study-config-pill phase-p1"><span>P1</span><strong>{selectedP1Count}</strong><small>aulas escolhidas</small></div>
              <div className="study-config-pill phase-p2"><span>P2</span><strong>{selectedP2Count}</strong><small>aulas restantes</small></div>
              <div className="study-config-pill phase-av2"><span>AV2</span><strong>{totalModuleLessons}</strong><small>revisão geral</small></div>
            </div>

            <section className="study-config-section">
              <div className="study-config-section-head">
                <div>
                  <div className="study-config-section-title">Dados da turma</div>
                  <div className="study-schedule-sub">Datas obrigatórias para gerar a semana sem chute.</div>
                </div>
              </div>
              <div className="study-form-grid">
                <div className="study-field">
                  <label>Sala</label>
                  <select className="study-select" value={form?.room || 'A'} onChange={(e) => updateForm({ room: e.target.value })}>
                    {STUDY_ROOMS.map((room) => <option key={room} value={room}>{room}</option>)}
                  </select>
                </div>
                <div className="study-field">
                  <label>Temas por dia</label>
                  <input className="study-input" type="number" min="1" max="12" value={form?.dailyTarget || 2} onChange={(e) => updateForm({ dailyTarget: Number(e.target.value) || 1 })} />
                </div>
                {['p1', 'p2', 'av2'].map((exam) => (
                  <div className="study-field" key={exam}>
                    <label>{exam.toUpperCase()}</label>
                    <input className="study-input" type="date" value={form?.examDates?.[exam] || ''} onChange={(e) => updateExamDate(exam, e.target.value)} />
                  </div>

              </div>
            </section>

            <section className="study-config-section">
              <div className="study-config-section-head">
                <div>
                  <div className="study-config-section-title">Aulas que caem na P1</div>
                  <div className="study-schedule-sub">Marque somente as aulas da P1. P2 e AV2 ficam automáticas.</div>
                </div>
              </div>
              <div className="study-materia-grid">
                {moduleMaterias.map((materia) => {
                  const selected = form?.p1LessonsByMateria?.[materia.id] || [];
                  const p2Ids = form?.p2LessonsByMateria?.[materia.id] || [];
                  const selectedTitles = (materia.aulas || [])
                    .filter((aula) => selected.includes(aula.id))
                    .slice(0, 2)
                    .map((aula) => aula.tema || aula.id);
                  return (
                    <div className="study-materia-row study-materia-row--selector" key={materia.id} style={{ '--materia-accent': getMateriaAccent(materia.id) }}>

                  <div className="location-ad-title">Grupo de Elite MedUni9</div>

            <div className="dashboard-header">
