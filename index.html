        setQuizStats({ correct: 0, total: 0 });
        setStartTime(Date.now());
        setQuizComplete(false);
      };

      if (quizComplete) {
        const activeCards = getActiveCards();
        const percentage = Math.round((quizStats.correct / Math.max(activeCards.length, 1)) * 100);

        return (
          <>
            <div className="screen-content">
              <div className="quiz-result-screen">
                <div style={{ fontSize: '60px', marginBottom: '20px' }}>
                  {percentage >= 70 ? '🎉' : percentage >= 50 ? '👍' : '💪'}
                </div>
                <div className="quiz-score">{percentage}%</div>
                <p style={{ color: 'var(--text-secondary)', marginBottom: '8px' }}>
                  {quizStats.correct} de {activeCards.length} questões
                  {activeTemas.length === 1 && <span> — {activeTemas[0]}</span>}
                  {activeTemas.length > 1 && <span> — {activeTemas.length} assuntos</span>}
                </p>
                <div className="quiz-time">{formatTime(Date.now() - startTime)}</div>
                <div style={{ marginTop: '32px', display: 'flex', flexDirection: 'column', gap: '12px' }}>
                  <button className="btn btn-primary" onClick={handleRestartQuiz}>Tentar Novamente</button>
                  <button className="btn btn-secondary" onClick={() => { setActiveQuiz(null); setActiveTemas([]); setQuizComplete(false); setShowCadernoErros(false); onSelectMateria(null); }}>Voltar</button>
                </div>
              </div>
            </div>
          </>
        );
      }

      // Tema selector screen for quiz (multi-select) — uses aulas from materias.json
      if (showTemaSelector && pendingQuiz) {
        const quiz = quizzes[pendingQuiz];
        const materiaObj = materias.find(m => m.id === pendingQuiz);
        const aulas = materiaObj?.aulas || [];
        const hasAulas = aulas.length > 0;
        const temasFromCardsQ = [...new Set(quiz.cards.map(c => c.tema).filter(Boolean))];

        return (
          <>
            <div className="screen-content">
              <button className="back-btn" onClick={() => { setShowTemaSelector(false); setPendingQuiz(null); setPendingTemas([]); onSelectMateria(null); }}>← Questões</button>
              <h2 className="section-title">{quiz.sigla || quiz.name}</h2>
              <p style={{ color: 'var(--text-secondary)', fontSize: '14px', marginBottom: '16px' }}>
                Selecione um ou mais assuntos:
              </p>
              <div className="subject-select-list" style={{ paddingBottom: pendingTemas.length > 0 ? '72px' : '0' }}>
                <div className="subject-select-card" onClick={() => handleQuizStart(pendingQuiz, [])}
                  style={{ borderColor: 'var(--primary)', background: 'rgba(0,200,150,0.06)', marginBottom: '8px' }}>
                  <div className="subject-select-icon" style={{ background: 'rgba(0,200,150,0.15)', color: 'var(--primary)' }}><IconClipboardList /></div>
                  <div className="subject-select-info">
                    <div className="subject-select-name">Todas as questões</div>
                    <div className="subject-select-meta">{quiz.cards.length} questões</div>
                  </div>
                  <div style={{ color: 'var(--primary)' }}><IconChevronRight /></div>
                </div>
                {hasAulas ? (
                  aulas.map(aula => {
                    const count = quiz.cards.filter(c => c.tema === aula.id).length;
                    const isChecked = pendingTemas.includes(aula.id);
                    const hasQs = count > 0;
                    return (
                      <div key={aula.id} className={`subject-select-card${isChecked ? ' tema-selected' : ''}${!hasQs ? ' subject-card-empty' : ''}`} onClick={() => hasQs && togglePendingTema(aula.id)}>
                        <div className={`tema-checkbox${isChecked ? ' tema-checkbox-checked' : ''}`}>{isChecked ? '✓' : ''}</div>
                        <div className="subject-select-info">
                          <div className="subject-select-name">{aula.tema}</div>
                          <div className="subject-select-meta">{hasQs ? `${count} questões` : 'Em breve'}</div>
                        </div>
                      </div>
                    );
                  })
                ) : (
                  temasFromCardsQ.sort().map(tema => {
                    const count = quiz.cards.filter(c => c.tema === tema).length;
                    const isChecked = pendingTemas.includes(tema);
                    return (
                      <div key={tema} className={`subject-select-card${isChecked ? ' tema-selected' : ''}`} onClick={() => togglePendingTema(tema)}>
                        <div className={`tema-checkbox${isChecked ? ' tema-checkbox-checked' : ''}`}>{isChecked ? '✓' : ''}</div>
                        <div className="subject-select-info">
                          <div className="subject-select-name">{tema}</div>
                          <div className="subject-select-meta">{count} questões</div>
                        </div>
                      </div>
                    );
                  })
                )}
              </div>

              {pendingTemas.length > 0 && (
                <div className="tema-start-bar">
                  <span style={{ color: 'var(--text-secondary)', fontSize: '13px' }}>
                    {pendingTemas.length} assunto{pendingTemas.length > 1 ? 's' : ''} selecionado{pendingTemas.length > 1 ? 's' : ''}
                  </span>
                  <button className="btn btn-primary" style={{ padding: '8px 20px', fontSize: '14px' }} onClick={() => handleQuizStart(pendingQuiz, pendingTemas)}>
                    Iniciar questões →
                  </button>
                </div>
              )}
            </div>
          </>
        );
      }

      if (activeQuiz) {
        const activeCards = getActiveCards();

        if (activeCards.length === 0) {
          const emptyMsg = showCadernoErros
            ? 'Nenhuma questão no caderno de erros!'
            : 'Questões em breve para esta matéria.';
          return (
            <>
              <div className="screen-content">
                <button className="back-btn" onClick={() => { setActiveQuiz(null); setActiveTemas([]); setShowCadernoErros(false); onSelectMateria(null); }}>← Questões</button>
                <div style={{ textAlign: 'center', marginTop: '60px' }}>
                  <div style={{ fontSize: '60px', marginBottom: '20px' }}>{showCadernoErros ? '✨' : '🚧'}</div>
                  <p style={{ color: 'var(--text-secondary)', marginBottom: '20px' }}>{emptyMsg}</p>
                  <button className="btn btn-secondary" onClick={() => { setActiveQuiz(null); setActiveTemas([]); setShowCadernoErros(false); onSelectMateria(null); }}>Voltar</button>
                </div>
              </div>
            </>
          );
        }

        const card = activeCards[currentQuestion];
        const progress = ((currentQuestion + 1) / activeCards.length) * 100;
        const quizLabel = showCadernoErros ? 'Caderno de Erros' : (quizzes[activeQuiz]?.sigla || quizzes[activeQuiz]?.name || 'Questões');

        return (
          <>
            <div className="screen-content">
              <button className="back-btn" onClick={() => { setActiveQuiz(null); setActiveTemas([]); setShowCadernoErros(false); onSelectMateria(null); }}>
                ← {activeTemas.length === 1 ? activeTemas[0] : quizLabel}
              </button>
              <div className="quiz-screen">
                <div className="quiz-progress-section">
                  <div className="quiz-progress-bar">
                    <div className="quiz-progress-fill" style={{ width: `${progress}%` }}></div>
                  </div>
                  <div className="quiz-counter">
                    {currentQuestion + 1} de {activeCards.length}
                    {card.tema && activeTemas.length !== 1 && <span style={{ marginLeft: '8px', color: 'var(--primary)', fontSize: '11px' }}>{card.tema}</span>}
                  </div>
                </div>

                <div className="quiz-question-card">
                  <div className="quiz-question">{card.pergunta}</div>
                </div>

                <div className="quiz-options">
                  {card.opcoes.map((option, idx) => (
                    <div
                      key={idx}
                      className={`quiz-option ${
                        crossedOut.has(idx) ? 'crossed-out' : ''
                      } ${
                        selectedOption === idx && !answered ? 'selected' : ''
                      } ${
                        answered && idx === card.correta ? 'correct' : ''
                      } ${
                        answered && selectedOption === idx && idx !== card.correta ? 'incorrect' : ''
                      }`}
                      onClick={() => {
                        if (!answered && !crossedOut.has(idx)) setSelectedOption(idx);
                      }}
                    >
                      <span className="quiz-option-number">{idx + 1}</span>
                      <span>{option}</span>
                      {!answered && !crossedOut.has(idx) && (
                        <button
                          className="cross-btn"
                          onClick={(e) => { e.stopPropagation(); toggleCross(idx); }}
                          title="Riscar alternativa"
                        >✕</button>
                      )}
                    </div>
                  ))}
                </div>

                {answered && card.explicacao && (
                  <div className="quiz-feedback">
                    <div className="quiz-feedback-title">
                      {selectedOption === card.correta ? '✓ Correto!' : '✗ Incorreto'}
                    </div>
                    <p style={{ color: 'var(--text-secondary)', lineHeight: '1.6' }}>{card.explicacao}</p>
                  </div>
                )}

                <div className="quiz-action-bar">
                  <button
                    className="btn"
                    onClick={handleReportQuestion}
                    style={{
                      background: 'rgba(239,68,68,0.12)',
                      border: '1px solid rgba(239,68,68,0.4)',
                      color: '#EF4444',
                      marginRight: '8px'
                    }}
                  >
                    ⚑ Reportar
                  </button>
                  {!answered ? (
                    <button
                      className="btn btn-primary"
                      onClick={handleAnswer}
                      disabled={selectedOption === null}
                    >
                      Confirmar Resposta <span className="kbd-hint">Enter</span>
                    </button>
                  ) : (
                    <button className="btn btn-primary" onClick={handleNextQuestion}>
                      {currentQuestion === activeCards.length - 1 ? 'Finalizar' : 'Próxima Questão'} <span className="kbd-hint">Enter</span>
                    </button>
                  )}
                </div>
              </div>
            </div>
          </>
        );
      }

      // Quiz list with caderno de erros, semester filter, search
      const semesters = [...new Set(Object.values(quizzes).filter(q => q.ativo !== false).map(q => q.semestre))].sort((a,b) => a-b);
      const errosCount = getErros().length;

      return (
        <>
          <div className="screen-content">
            <h2 className="section-title">Questões</h2>

            {semesters.length > 1 && (
              <div className="semester-tabs">
                <button
                  className={`semester-tab ${!semesterFilter ? 'active' : ''}`}
                  onClick={() => setSemesterFilter(null)}
                >Todos</button>
                {semesters.map(s => (
                  <button
                    key={s}
                    className={`semester-tab ${semesterFilter === s ? 'active' : ''}`}
                    onClick={() => setSemesterFilter(s)}
                  >Módulo {s}</button>
                ))}
              </div>
            )}

            <div className="subject-search-wrap">
              <span className="subject-search-icon">🔍</span>
              <input
                type="search"
                className="subject-search"
                placeholder="Buscar matéria..."
                value={searchQuery}
                onChange={e => setSearchQuery(e.target.value)}
              />
            </div>

            {/* Caderno de Erros */}
            {errosCount > 0 && (
              <div className="subject-select-card caderno-erros-card" onClick={startCadernoErros}
                style={{ borderColor: 'var(--error)', background: 'rgba(239,68,68,0.06)', marginBottom: '12px' }}>
                <div className="subject-select-icon" style={{ background: 'rgba(239,68,68,0.15)', color: 'var(--error)', width: '40px', height: '40px', borderRadius: '10px', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '18px' }}>📕</div>
                <div className="subject-select-info">
                  <div className="subject-select-name" style={{ color: 'var(--error)' }}>Caderno de Erros</div>
                  <div className="subject-select-meta">{errosCount} questões para revisar</div>
                </div>
                <div style={{ color: 'var(--error)' }}><IconChevronRight /></div>
              </div>
            )}

            <div className="subject-select-list">
              {Object.entries(filteredQuizzes).length === 0 && (
                <div style={{ textAlign: 'center', padding: '40px 0', color: 'var(--text-secondary)' }}>
                  <p>Nenhuma questão encontrada.</p>
                </div>
              )}
              {Object.entries(filteredQuizzes).map(([id, quiz]) => (
                <div key={id} className={`subject-select-card${quiz.cards.length === 0 ? ' subject-card-empty' : ''}`} onClick={() => handleMateriaClick(id)}>
                  <SubjectIcon materiaId={id} icon={quiz.icon} cor={quiz.cor} />
                  <div className="subject-select-info">
                    <div className="subject-select-name">{quiz.sigla || quiz.name}</div>
                    <div className="subject-select-meta">
                      {quiz.cards.length > 0 ? `${quiz.cards.length} questões — Módulo ${quiz.semestre}` : 'Em breve'}
                    </div>
                  </div>
                  <div style={{ color: 'var(--text-secondary)' }}>
                    <IconChevronRight />
                  </div>
                </div>
              ))}
            </div>
          </div>
        </>
      );
    };

    // Materials Screen
    const MaterialsScreen = ({ materias, userSemester, onNavigateTo, initialMateriaId, initialTemaId, onRouteChange }) => {
      const [expandedMaterias, setExpandedMaterias] = useState({});
      const [searchQuery, setSearchQuery] = useState('');
      const [semesterFilter, setSemesterFilter] = useState(userSemester || null);
      const [selectedMaterial, setSelectedMaterial] = useState(null);
      const [materialContent, setMaterialContent] = useState('');
      const [materialLoading, setMaterialLoading] = useState(false);
      const [materialError, setMaterialError] = useState('');
      const [preProvaVisible, setPreProvaVisible] = useState(false);
      const markdownRef = useRef(null);
      const restoredRouteRef = useRef('');

      // Split markdown at "## Pré-Prova" section
      const splitAtPreProva = (content) => {
        // regex: matches "## Pré-Prova" or "## Pre-Prova" (any case, hyphen optional) at start of line
        const re = /^## Pr[eé][- ]?Prova/im;
        const match = re.exec(content);
        if (match) {
          return { main: content.slice(0, match.index).trim(), preProva: content.slice(match.index).trim() };
        }
        return { main: content, preProva: null };
      };

      // Post-process markdown header: breadcrumb + meta pills
      useEffect(() => {
        if (!markdownRef.current || !materialContent) return;
        const root = markdownRef.current;

        // --- Breadcrumb: only direct <p> children at the top (not inside lists/quotes) ---
        const directTopPs = Array.from(root.children).filter(el => el.tagName === 'P').slice(0, 3);
        const bcP = directTopPs.find(p => p.textContent.includes('→'));
        if (bcP && !bcP.classList.contains('md-breadcrumb')) {
          const parts = bcP.textContent.split('→').map(s => s.trim()).filter(Boolean);
          bcP.className = 'md-breadcrumb';
          bcP.innerHTML = parts.map((part, i) =>
            `<span class="bc-item${i === parts.length - 1 ? ' current' : ''}">${part}</span>${i < parts.length - 1 ? '<span class="bc-sep">›</span>' : ''}`
          ).join('');
        }

        // --- Meta pills: only direct <p> children at the top ---
        const metaP = directTopPs.find(p => p.textContent.includes('⏱') || p.textContent.includes('min ·'));
        if (metaP && !metaP.classList.contains('md-meta')) {
          const parts = metaP.textContent.split('·').map(s => s.trim()).filter(Boolean);
          metaP.className = 'md-meta';
          metaP.innerHTML = parts.map(p =>
            `<span class="md-meta-pill">${p}</span>`
          ).join('');
        }
      }, [materialContent, selectedMaterial]);

      // Enable interactive checkboxes with localStorage persistence
      useEffect(() => {
        if (!markdownRef.current || !selectedMaterial) return;
        const key = `checklist_${selectedMaterial.path}`;
        const saved = JSON.parse(localStorage.getItem(key) || '{}');
        const boxes = markdownRef.current.querySelectorAll('input[type="checkbox"]');
        boxes.forEach((cb, i) => {
          cb.removeAttribute('disabled');
          cb.checked = !!saved[i];
          cb.style.cursor = 'pointer';
          cb.style.accentColor = '#00C896';
          cb.style.width = '15px';
          cb.style.height = '15px';
          cb.style.marginRight = '6px';
          cb.style.verticalAlign = 'middle';
          cb.addEventListener('change', () => {
            saved[i] = cb.checked;
            localStorage.setItem(key, JSON.stringify(saved));
          });
        });
      }, [materialContent, selectedMaterial]);

      const toggleMateria = (id) => {
        setExpandedMaterias(prev => ({ ...prev, [id]: !prev[id] }));
      };

      const handleReportMaterial = () => {
        if (!selectedMaterial) return;
        const reason = prompt('Descreva o erro no material (opcional):', '');
        if (reason === null) return;

        submitContentFeedback({
          origem: 'materiais',
          mensagem: reason?.trim() || 'Erro reportado em material',
          itemId: `${selectedMaterial.materiaId || ''}:${selectedMaterial.temaId || ''}`,
          materia: selectedMaterial.materiaId || '',
          tema: selectedMaterial.temaId || '',
          contexto: {
            materiaNome: selectedMaterial.materiaNome,
            temaNome: selectedMaterial.temaNome,
            path: selectedMaterial.path
          }
        })
          .then(() => alert('Reporte enviado para o admin. Obrigado!'))
          .catch(() => alert('Nao foi possivel enviar agora. Tente novamente em instantes.'));
      };

      const resolveTemaId = (materia, tema) => {
        if (tema?.id) return tema.id;
        const aulas = Array.isArray(materia?.aulas) ? materia.aulas : [];
        if (!aulas.length) return null;

        const byNome = aulas.find(a => normalizeText(a.tema) === normalizeText(tema?.nome || ''));
        if (byNome?.id) return byNome.id;

        const byDesc = aulas.find(a => normalizeText(a.descricao) === normalizeText(tema?.descricao || ''));
        if (byDesc?.id) return byDesc.id;

        return null;
      };

      const openMaterial = async (materia, tema, options = {}) => {
        const { updateHash = true } = options;
        const modulo = materia.modulo || materia.semestre;
        const temaId = resolveTemaId(materia, tema);

        if (!temaId) {
          setSelectedMaterial({
            materiaNome: materia.nome,
            temaNome: tema.nome,
            path: 'sem-id',
            materiaId: materia.id,
            temaId: null,
          });
          setMaterialContent('');
          setMaterialError('Nao foi possivel identificar o ID da aula para abrir o material.');
          setMaterialLoading(false);
          return;
        }

        const primaryPath = `materiais/modulo${modulo}/${materia.id}/${temaId}.md`;
        const fallbackPaths = [
          primaryPath,
          `/materiais/modulo${modulo}/${materia.id}/${temaId}.md`,
          `materiais/modulo1/${materia.id}/${temaId}.md`,
          `materiais/modulo2/${materia.id}/${temaId}.md`,
          `materiais/modulo3/${materia.id}/${temaId}.md`,
          `materiais/modulo4/${materia.id}/${temaId}.md`,
          `materiais/modulo5/${materia.id}/${temaId}.md`,
          `materiais/modulo6/${materia.id}/${temaId}.md`,
        ];

        setSelectedMaterial({
          materiaNome: materia.nome,
          temaNome: tema.nome,
          path: primaryPath,
          materiaId: materia.id,
          temaId,
        });
        setMaterialContent('');
        setMaterialError('');
        setMaterialLoading(true);
        setPreProvaVisible(false);

        if (updateHash && onRouteChange) {
          onRouteChange('materials', { materiaId: materia.id, aulaId: temaId });
        }

        try {
          let loaded = false;
          for (const p of fallbackPaths) {
            const res = await fetch(p);
            if (!res.ok) continue;
            const text = await res.text();
            setMaterialContent(text);
            setSelectedMaterial(prev => ({ ...prev, path: p }));
            loaded = true;
            break;
          }

          if (!loaded) {
            throw new Error(`Material ainda nao disponivel para esta aula. Caminho tentado: ${primaryPath}`);
          }
        } catch (err) {
          setMaterialError(err?.message || 'Erro ao carregar material.');
        } finally {
          setMaterialLoading(false);
        }
      };

      const getMateriaModulos = (materia) => {
        const config = getModulos(materia.id);
        if (config) return config;
        if (materia.modulos) return materia.modulos;
        if (materia.aulas && materia.aulas.length > 0) {
          return [{ nome: materia.nome, temas: materia.aulas.map(a => ({ id: a.id, nome: a.tema, descricao: a.descricao })) }];
        }
        return null;
      };

      const totalTemas = (materia) => {
        const mods = getMateriaModulos(materia);
        if (!mods) return 0;
        return mods.reduce((acc, mod) => acc + (mod.temas?.length || 0), 0);
      };

      const semesters = [...new Set(materias.filter(m => m.ativo !== false).map(m => m.modulo))].sort((a,b) => a-b);

      useEffect(() => {
        if (!initialMateriaId || !initialTemaId || !materias.length) return;
        const routeKey = `${initialMateriaId}:${initialTemaId}`;
        if (restoredRouteRef.current === routeKey) return;
        if (selectedMaterial?.materiaId === initialMateriaId && selectedMaterial?.temaId === initialTemaId) {
          restoredRouteRef.current = routeKey;
          return;
        }

        const materia = materias.find(m => m.id === initialMateriaId);
        if (!materia) return;

        const modulos = getMateriaModulos(materia) || [];
        let tema = null;
        modulos.some(mod => {
          tema = (mod.temas || []).find(item => (item?.id || null) === initialTemaId) || null;
          return !!tema;
        });
        if (!tema) return;

        restoredRouteRef.current = routeKey;
        openMaterial(materia, tema, { updateHash: false });
      }, [initialMateriaId, initialTemaId, materias, selectedMaterial]);

      const filteredMaterias = materias.filter(m => {
        if (semesterFilter && m.modulo !== semesterFilter) return false;
        return fuzzyMatch(searchQuery, m.nome) || fuzzyMatch(searchQuery, m.sigla || '');
      });

      // --- DETAIL VIEW: when a material is selected, replace entire screen ---
      if (selectedMaterial) {
        return (
          <div className="screen-content" style={{ paddingBottom: '32px' }}>

            {/* Header bar */}
            <div style={{
              display: 'flex',
              alignItems: 'center',
              gap: '10px',
              marginBottom: '20px',
            }}>
              <button
                onClick={() => {
                  setSelectedMaterial(null);
                  setMaterialContent('');
                  setMaterialError('');
                  if (onRouteChange) onRouteChange('materials', {});
                }}
                style={{
                  background: 'rgba(0,200,150,0.08)',
                  border: '1px solid rgba(0,200,150,0.25)',
                  borderRadius: '8px',
                  color: '#00C896',
                  fontSize: '0.82rem',
                  fontWeight: 500,
                  padding: '7px 13px',
                  cursor: 'pointer',
                  display: 'flex',
                  alignItems: 'center',
                  gap: '5px',
                  flexShrink: 0,
                  transition: 'background 0.2s',
                  fontFamily: 'DM Sans, sans-serif',
                }}
              >← Voltar</button>

              <div style={{ minWidth: 0, flex: 1 }}>
                <div style={{
                  fontSize: '0.7rem',
                  color: '#64748B',
                  fontWeight: 500,
                  textTransform: 'uppercase',
                  letterSpacing: '0.07em',
                  marginBottom: '2px',
                  fontFamily: 'DM Sans, sans-serif',
                }}>{selectedMaterial.materiaNome}</div>
                <div style={{
                  fontSize: '1rem',
                  fontWeight: 700,
                  color: '#F1F5F9',
                  fontFamily: 'Outfit, sans-serif',
                  lineHeight: 1.25,
                  whiteSpace: 'nowrap',
                  overflow: 'hidden',
                  textOverflow: 'ellipsis',
                }}>{selectedMaterial.temaNome}</div>
              </div>
            </div>

            {/* Botões de ação — Flashcards e Questões */}
            {onNavigateTo && selectedMaterial.materiaId && (
              <div style={{
                display: 'flex',
                gap: '8px',
                marginBottom: '16px',
              }}>
                <button
                  onClick={() => onNavigateTo('cards', selectedMaterial.materiaId)}
                  style={{
                    flex: 1,
                    display: 'flex',
                    alignItems: 'center',
                    justifyContent: 'center',
                    gap: '7px',
                    background: 'rgba(124,58,237,0.12)',
                    border: '1px solid rgba(124,58,237,0.3)',
                    borderRadius: '10px',
                    padding: '10px 14px',
                    cursor: 'pointer',
                    color: '#C4B5FD',
                    fontSize: '0.82rem',
                    fontWeight: 600,
                    fontFamily: 'DM Sans, sans-serif',
                    transition: 'background 0.2s',
                  }}
                >
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>
                  Flashcards
                </button>
                <button
                  onClick={() => onNavigateTo('quiz', selectedMaterial.materiaId)}
                  style={{
                    flex: 1,
                    display: 'flex',
                    alignItems: 'center',
                    justifyContent: 'center',
                    gap: '7px',
                    background: 'rgba(16,185,129,0.1)',
                    border: '1px solid rgba(16,185,129,0.3)',
                    borderRadius: '10px',
                    padding: '10px 14px',
                    cursor: 'pointer',
                    color: '#6EE7B7',
                    fontSize: '0.82rem',
                    fontWeight: 600,
                    fontFamily: 'DM Sans, sans-serif',
                    transition: 'background 0.2s',
                  }}
                >
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
                  Questões
                </button>
                <button
                  onClick={handleReportMaterial}
                  style={{
                    display: 'flex',
                    alignItems: 'center',
                    justifyContent: 'center',
                    gap: '7px',
                    background: 'rgba(239,68,68,0.1)',
                    border: '1px solid rgba(239,68,68,0.35)',
                    borderRadius: '10px',
                    padding: '10px 12px',
                    cursor: 'pointer',
                    color: '#EF4444',
                    fontSize: '0.8rem',
                    fontWeight: 700,
                    fontFamily: 'DM Sans, sans-serif',
                    transition: 'background 0.2s',
                  }}
                  title="Reportar erro neste material"
                >
                  ⚑ Reportar
                </button>
              </div>
            )}

            {/* Loading */}
            {materialLoading && (
              <div style={{
                display: 'flex',
                flexDirection: 'column',
                alignItems: 'center',
                gap: '12px',
                padding: '48px 0',
                color: '#64748B',
                fontSize: '0.85rem',
                fontFamily: 'DM Sans, sans-serif',
              }}>
                <div style={{
                  width: '32px', height: '32px',
                  border: '3px solid rgba(0,200,150,0.15)',
                  borderTop: '3px solid #00C896',
                  borderRadius: '50%',
                  animation: 'spin 0.8s linear infinite',
                }} />
                Carregando material...
              </div>
            )}

            {/* Error */}
            {!materialLoading && materialError && (
              <div style={{
                background: 'rgba(239,68,68,0.08)',
                border: '1px solid rgba(239,68,68,0.2)',
                borderRadius: '10px',
                padding: '14px 16px',
                color: '#FCA5A5',
                fontSize: '0.85rem',
                fontFamily: 'DM Sans, sans-serif',
              }}>{materialError}</div>
            )}

            {/* Content */}
            {!materialLoading && !materialError && materialContent && (() => {
              const { main, preProva } = splitAtPreProva(materialContent);
              return (
                <div className="material-doc-outer">
                  <div className="material-doc-inner">
                  <div
                    ref={markdownRef}
                    className="markdown-body"
                    style={{
                      background: 'linear-gradient(180deg, rgba(0,200,150,0.05) 0%, rgba(15,23,42,0.7) 120px)',
                      border: '1px solid rgba(0,200,150,0.15)',
                      borderTop: '3px solid #00C896',
                      borderRadius: '14px',
                      padding: '28px 28px 32px',
                      wordBreak: 'break-word',
                      boxShadow: '0 4px 32px rgba(0,200,150,0.08), 0 2px 12px rgba(0,0,0,0.3)',
                    }}
                    dangerouslySetInnerHTML={{ __html: renderMd(main) }}
                  />

                  {/* Pré-Prova collapsible */}
                  {preProva && (
                    <div style={{ marginTop: '16px' }}>
                      <button
                        onClick={() => setPreProvaVisible(v => !v)}
                        style={{
                          width: '100%',
                          display: 'flex',
                          alignItems: 'center',
                          justifyContent: 'space-between',
                          background: preProvaVisible
                            ? 'rgba(245,158,11,0.15)'
                            : 'rgba(245,158,11,0.08)',
                          border: '1px solid rgba(245,158,11,0.3)',
                          borderRadius: preProvaVisible ? '12px 12px 0 0' : '12px',
                          padding: '13px 18px',
                          cursor: 'pointer',
                          transition: 'background 0.2s',
                          fontFamily: 'Outfit, sans-serif',
                        }}
                      >
                        <div style={{ display: 'flex', alignItems: 'center', gap: '10px' }}>
                          <span style={{ fontSize: '1.1rem' }}>⚡</span>
                          <div style={{ textAlign: 'left' }}>
                            <div style={{ fontSize: '0.78rem', color: '#D97706', fontWeight: 600, textTransform: 'uppercase', letterSpacing: '0.07em' }}>
                              Resumo
                            </div>

    function normalizeText(str) {
      return (str || '').toLowerCase()
        .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
        .replace(/\s+/g, '').replace(/[^a-z0-9]/g, '');
    }
    function fuzzyMatch(query, target) {
      const q = normalizeText(query);
      const t = normalizeText(target);
      if (!q) return true;
      if (t.includes(q)) return true;
      let qi = 0;
      for (let ti = 0; ti < t.length && qi < q.length; ti++) {
        if (t[ti] === q[qi]) qi++;
      }
      return qi === q.length;
    }

    const AnatomiaScreen = () => {

    const MedGradPlusApp = () => {
      const VALID_TABS = ['home', 'cards', 'quiz', 'materials', 'feedback', 'profile', 'anatomy'];
      const parseRouteFromHash = () => {
        const raw = window.location.hash.replace(/^#/, '').trim();
        const [tabRaw, materiaRaw, aulaRaw] = raw.split(':');
        const tab = VALID_TABS.includes(tabRaw) ? tabRaw : 'home';
        return {
          tab,
          materiaId: materiaRaw ? decodeURIComponent(materiaRaw) : null,
          aulaId: aulaRaw ? decodeURIComponent(aulaRaw) : null,
        };
      };
      const buildHash = ({ tab, materiaId, aulaId }) => {
        const parts = [tab || 'home'];
        if (materiaId) parts.push(encodeURIComponent(materiaId));
        if (aulaId) parts.push(encodeURIComponent(aulaId));
        return `#${parts.join(':')}`;
      };
      const initialRoute = parseRouteFromHash();

      const [stage, setStage] = useState('splash'); // splash, auth, app
      const [user, setUser] = useState(null);
      const [routeState, setRouteState] = useState(initialRoute);

      const [darkMode, setDarkMode] = useState(() => {

      });

      useEffect(() => {
        document.documentElement.setAttribute('data-theme', darkMode ? 'dark' : 'light');

            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>

        const nextRoute = {
          tab: VALID_TABS.includes(tab) ? tab : 'home',

          aulaId: options.aulaId || null,
        };
        setRouteState(nextRoute);
        setCurrentTab(nextRoute.tab);
        const nextHash = buildHash(nextRoute);
        if (window.location.hash !== nextHash) {
          window.location.hash = nextHash;

      };
      const [materias, setMaterias] = useState([]);
      const [flashcards, setFlashcards] = useState([]);
      const [selectedMateria, setSelectedMateria] = useState(null);
      const [loading, setLoading] = useState(true);
      const [sidebarOpen, setSidebarOpen] = useState(true);

      // Auth state refs (stable across renders, safe in closures)
      const splashDoneRef = useRef(false);
      const authStateRef  = useRef(undefined); // undefined = resolving | null = no user | object = profile

      useEffect(() => {
        const handleHashChange = () => {
          const nextRoute = parseRouteFromHash();

        };

        return () => window.removeEventListener('hashchange', handleHashChange);

          setSelectedMateria(routeState.materiaId || null);
        }
      }, [routeState.tab, routeState.materiaId]);

      const applyResolvedAuth = (profile) => {
        if (profile) { setUser(normalizeUserProfile(profile)); setStage('app'); }
        else          { setStage('auth'); }
      };

      // Firebase Auth listener: resolves well before splash ends (~2400ms)
      useEffect(() => {
        if (!window.__fbAuth || !window.__fbAuthFns || !window.__fbFirestore) {
          // Fallback: Firebase SDK unavailable — use localStorage cache
          const cached = localStorage.getItem('meduni9_user');
          authStateRef.current = cached ? JSON.parse(cached) : null;
          if (splashDoneRef.current) applyResolvedAuth(authStateRef.current);
          return;
        }
        const { onAuthStateChanged, signOut: fbSignOut } = window.__fbAuthFns;
        const unsubscribe = onAuthStateChanged(window.__fbAuth, async (firebaseUser) => {
          if (firebaseUser) {
            let cachedProfile = null;
            try {
              const cached = localStorage.getItem('meduni9_user');
              if (cached) {
                const p = JSON.parse(cached);
                if (p.uid === firebaseUser.uid) cachedProfile = normalizeUserProfile(p);
              }
            } catch {}
            try {
              const p = await loadUserProfile(firebaseUser);
              if (p) {
                const normalized = persistLocalUser(p);
                authStateRef.current = normalized;
                if (splashDoneRef.current) applyResolvedAuth(p);
              } else {
                if (cachedProfile) {
                  authStateRef.current = cachedProfile;
                  if (splashDoneRef.current) applyResolvedAuth(cachedProfile);
                } else {
                  try { await fbSignOut(window.__fbAuth); } catch {}
                  authStateRef.current = null;
                  if (splashDoneRef.current) applyResolvedAuth(null);
                }
              }
            } catch {
              authStateRef.current = cachedProfile;
              if (splashDoneRef.current) applyResolvedAuth(cachedProfile);
            }
          } else {
            localStorage.removeItem('meduni9_user');
            authStateRef.current = null;
            if (splashDoneRef.current) applyResolvedAuth(null);

        return () => unsubscribe();

              { id: 'fc2', materia: 'bcm1', frente: 'Qual molécula regula a fluidez da membrana plasmática?', verso: 'O colesterol. Ele se intercala entre os fosfolipídeos, reduzindo a fluidez em altas temperaturas e impedindo a solidificação em baixas temperaturas.', tema: 'bcm1_membrana', dificuldade: 1 },
              { id: 'fc3', materia: 'bmf1', frente: 'Qual célula é responsável pela síntese de matriz óssea?', verso: 'O osteoblasto. Sintetiza e secreta os componentes orgânicos da matriz óssea (colágeno tipo I e proteoglicanos), participando da mineralização.', tema: 'bmf1_tec_osseo', dificuldade: 1 },
              { id: 'fc4', materia: 'sus', frente: 'Quais são os três princípios doutrinários do SUS?', verso: 'Universalidade (acesso a toda população), equidade (tratamento diferenciado conforme necessidade) e integralidade (atendimento completo de saúde individual e coletiva).', tema: 'SUS Princípios', dificuldade: 1 },
            ];
          }

          setMaterias(materiasData);
          setFlashcards(flashcardsData);
          setLoading(false);
        } catch (error) {
          console.error('Erro ao carregar dados:', error);
          setLoading(false);
        }
      };

      const handleAuthSuccess = (userData) => {
        const normalized = persistLocalUser(userData);
        authStateRef.current = normalized;
        setUser(normalized);
        setStage('app');
      };

      const handleLogout = async () => {
        if (window.__fbAuth && window.__fbAuthFns) {
          try { await window.__fbAuthFns.signOut(window.__fbAuth); } catch {}
        }
        localStorage.removeItem('meduni9_user');
        localStorage.removeItem('meduni9_sr_data');
        localStorage.removeItem('meduni9_quiz_history');
        localStorage.removeItem('meduni9_stats');
        authStateRef.current = null;
        setUser(null);
        setStage('auth');
        setCurrentTab('home');
        window.location.hash = '';
      };

      if (stage === 'splash') {
        return <SplashScreen onComplete={() => {
          splashDoneRef.current = true;
          if (authStateRef.current !== undefined) {
            applyResolvedAuth(authStateRef.current);
          }
          // If still undefined: onAuthStateChanged hasn't fired yet → it will call applyResolvedAuth
        }} />;
      }

      if (stage === 'auth') {
        return <AuthScreen onAuthSuccess={handleAuthSuccess} />;
      }

      if (loading) {
        return (
          <div className="app-container">
            <div className="loading">
              <div className="spinner"></div>
            </div>
          </div>
        );
      }

      const handleChangeSemester = async (newSem) => {
        const parsed = typeof newSem === 'number' ? newSem : parseInt(newSem);
        if (parsed >= 1 && parsed <= 6) {
          const updated = normalizeUserProfile({ ...user, semestre: parsed, modulo: parsed });
          setUser(updated);
          persistLocalUser(updated);
          authStateRef.current = updated;
          const currentUser = window.__fbAuth?.currentUser;
          if (currentUser) {
            try { await saveUserProfile(currentUser, updated); } catch {}
          }
        }
      };

      const navItems = [
        { id: 'home', label: 'Início', icon: <IconHome /> },
        { id: 'materials', label: 'Materiais', icon: <IconBookOpen /> },
        { id: 'quiz', label: 'Questões', icon: <IconTarget /> },
        { id: 'cards', label: 'Flashcards', icon: <IconLayers /> },
        { id: 'anatomy', label: 'Anatomia', icon: <IconAnatomy /> },
        { id: 'feedback', label: 'Feedback', icon: <IconMessageSquare /> },
        { id: 'profile', label: 'Perfil', icon: <IconUser /> },
      ];

      // App UI with desktop sidebar
      return (
        <div className="desktop-layout">
          {/* Desktop Sidebar */}
          <div className={`desktop-sidebar${sidebarOpen ? '' : ' collapsed'}`}>
            <div className="sidebar-logo">
              <span className="sidebar-logo-icon" style={{ display: 'flex', alignItems: 'center' }}><LogoIcon size={30} /></span>
              <span className="sidebar-logo-text">MedGrad<span style={{color:'#00C896',fontWeight:800}}>Plus</span><span style={{fontSize:'0.65em',color:'#00C896',fontWeight:800,verticalAlign:'super',lineHeight:0,marginLeft:'2px'}}>+</span></span>
              <button
                className="sidebar-toggle-btn"
                onClick={() => setSidebarOpen(false)}
                title="Fechar menu"
                style={{ marginLeft: 'auto' }}
              ><IconMenu /></button>
            </div>
            <div className="sidebar-nav">
              {navItems.map(item => (
                <div
                  key={item.id}
                  className={`sidebar-item ${currentTab === item.id ? 'active' : ''}`}
                  onClick={() => navigateTo(item.id)}
                >
                  {item.icon}
                  <span>{item.label}</span>
                </div>
              ))}
            </div>
            <div className="sidebar-footer">
              <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: '10px' }}>
                <div className="sidebar-user-block" style={{ flex: 1, minWidth: 0 }}>
                  <div className="sidebar-user-avatar">
                    {user.email ? user.email.charAt(0).toUpperCase() : 'U'}
                  </div>
                  <div className="sidebar-user-info">
                    <div className="sidebar-user-name">{user.email ? user.email.split('@')[0] : 'Usuário'}</div>
                    <div className="sidebar-user-meta">{user.campusNome || 'Vergueiro'} · Módulo {user.semestre || user.modulo || 1}</div>
                  </div>
                </div>
                {renderThemeToggle()}
              </div>
            </div>
          </div>

          {/* Main Content */}
          <div className="app-container">
            {!sidebarOpen && (
              <div className="sidebar-open-bar">
                <button
                  className="sidebar-toggle-btn"
                  onClick={() => setSidebarOpen(true)}
                  title="Abrir menu"
                ><IconMenu /></button>
                {renderThemeToggle()}
              </div>
            )}
            {currentTab === 'home' && (
              <DashboardScreen
                user={user}
                materias={materias}
                flashcards={flashcards}
                onSelectMateria={(id) => {
                  setSelectedMateria(id);
                  navigateTo('cards', { materiaId: id });
                }}
              />
            )}

            {currentTab === 'cards' && (
              user.plano === 'gratuito' || user.isGuest ? (
                <div className="screen-content" style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', minHeight: '60vh', textAlign: 'center', padding: '40px 24px' }}>
                  <div style={{ fontSize: '48px', marginBottom: '16px' }}>🔒</div>
                  <h2 style={{ fontFamily: 'Outfit', fontSize: '22px', color: 'var(--text-primary)', marginBottom: '10px' }}>Flashcards bloqueados</h2>
                  <p style={{ fontSize: '14px', color: 'var(--text-secondary)', maxWidth: '320px', marginBottom: '24px', lineHeight: 1.6 }}>
                    No plano gratuito você não tem acesso aos flashcards com revisão espaçada. Ative um código para desbloquear todos os módulos.
                  </p>
                  <button className="btn btn-primary" style={{ maxWidth: '280px' }} onClick={() => window.location.href = 'comprar.html'}>
                    Ver planos e preços
                  </button>
                  <button className="btn btn-secondary mt-2" style={{ maxWidth: '280px' }} onClick={() => { window.location.hash = '#home'; navigateTo('home'); }}>
                    Voltar ao início
                  </button>
                </div>
              ) : (
                <FlashcardsScreen
                  flashcards={flashcards}
                  materias={materias}
                  selectedMateria={selectedMateria}
                  onSelectMateria={(materiaId) => {
                    setSelectedMateria(materiaId);
                    navigateTo('cards', { materiaId });
                  }}
                  userSemester={user.semestre}
                />
              )
            )}

            {currentTab === 'quiz' && (
              user.plano === 'gratuito' || user.isGuest ? (
                <div className="screen-content" style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', minHeight: '60vh', textAlign: 'center', padding: '40px 24px' }}>
                  <div style={{ fontSize: '48px', marginBottom: '16px' }}>🔒</div>
                  <h2 style={{ fontFamily: 'Outfit', fontSize: '22px', color: 'var(--text-primary)', marginBottom: '10px' }}>Questões bloqueadas</h2>
                  <p style={{ fontSize: '14px', color: 'var(--text-secondary)', maxWidth: '320px', marginBottom: '24px', lineHeight: 1.6 }}>
                    O banco de questões está disponível apenas para usuários com código ativo. Não perca as questões do seu módulo.
                  </p>
                  <button className="btn btn-primary" style={{ maxWidth: '280px' }} onClick={() => window.location.href = 'comprar.html'}>
                    Ver planos e preços
                  </button>
                  <button className="btn btn-secondary mt-2" style={{ maxWidth: '280px' }} onClick={() => { window.location.hash = '#home'; navigateTo('home'); }}>
                    Voltar ao início
                  </button>
                </div>
              ) : (
                <QuizScreen
                  flashcards={flashcards}
                  materias={materias}
                  selectedMateria={selectedMateria}
                  onSelectMateria={(materiaId) => {
                    setSelectedMateria(materiaId);
                    navigateTo('quiz', { materiaId });
                  }}
                  userSemester={user.semestre}
                />
              )
            )}

            {currentTab === 'materials' && (
              user.plano === 'gratuito' || user.isGuest ? (
                <div className="screen-content" style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', minHeight: '60vh', textAlign: 'center', padding: '40px 24px' }}>
                  <div style={{ fontSize: '48px', marginBottom: '16px' }}>📚</div>
                  <h2 style={{ fontFamily: 'Outfit', fontSize: '22px', color: 'var(--text-primary)', marginBottom: '10px' }}>Materiais bloqueados</h2>
                  <p style={{ fontSize: '14px', color: 'var(--text-secondary)', maxWidth: '320px', marginBottom: '24px', lineHeight: 1.6 }}>
                    Os resumos e materiais de apoio são personalizados para cada faculdade e estão disponíveis apenas com código ativo.
                  </p>
                  <button className="btn btn-primary" style={{ maxWidth: '280px' }} onClick={() => window.location.href = 'comprar.html'}>
                    Ver planos e preços
                  </button>
                  <button className="btn btn-secondary mt-2" style={{ maxWidth: '280px' }} onClick={() => { window.location.hash = '#home'; navigateTo('home'); }}>
                    Voltar ao início
                  </button>
                </div>
              ) : (
                <MaterialsScreen
                  materias={materias}
                  userSemester={user.semestre}
                  initialMateriaId={routeState.materiaId}
                  initialTemaId={routeState.aulaId}
                  onRouteChange={navigateTo}
                  onNavigateTo={(tab, materiaId) => {
                    if (materiaId) setSelectedMateria(materiaId);
                    navigateTo(tab, { materiaId });
                  }}
                />
              )
            )}

            {currentTab === 'feedback' && (
              <FeedbackScreen currentMateria={selectedMateria} />
            )}

            {currentTab === 'profile' && (
              <ProfileScreen user={user} onLogout={handleLogout} onChangeSemester={handleChangeSemester} onProfileUpdated={(profile) => {
                const normalized = persistLocalUser(profile);
                authStateRef.current = normalized;
                setUser(normalized);
              }} />
            )}

            {currentTab === 'anatomy' && (
              <AnatomiaScreen />
            )}

            {/* Bottom Navigation (mobile only) */}
            <div className="bottom-nav">
              {navItems.map(item => (
                <div
                  key={item.id}
                  className={`nav-item ${currentTab === item.id ? 'active' : ''}`}
                  onClick={() => navigateTo(item.id)}
                >
                  <div className="nav-icon">{item.icon}</div>
                  <div className="nav-label">{item.label}</div>
                </div>
              ))}
            </div>

          </div>
        </div>
      );
    };

    // Render App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<MedGradPlusApp />);
  </script>
</body>
</html>
