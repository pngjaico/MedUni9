    function buildSessionTrackedProfile(profile = {}, fingerprint = '') {
      const normalized = normalizeUserProfile(profile);
      const currentDevice = (fingerprint || normalized.deviceId || '').trim();
      const previous = Array.isArray(normalized.deviceIds) ? normalized.deviceIds.filter(Boolean) : [];
      const nextDevices = currentDevice
        ? [...previous.filter(id => id !== currentDevice), currentDevice].slice(-5)
        : previous.slice(-5);
      const nowIso = new Date().toISOString();

      return {
        ...normalized,
        deviceId: currentDevice || normalized.deviceId || '',
        deviceIds: nextDevices,
        loginDate: nowIso,
        lastSeenAt: nowIso,
        lastSeenUa: (navigator.userAgent || '').slice(0, 160),
      };
    }

    async function saveUserProfile(fbUser, profile, options = {}) {
      const normalized = normalizeUserProfile(profile);
      const { updateProfile } = window.__fbAuthFns;
      try {
        await updateProfile(fbUser, { displayName: encodeProfileMarker(normalized) });
      } catch (err) {
        // Do not block login/session if displayName sync fails.
      }

      try {
        const { doc, setDoc } = window.__fbFirestore;
        const payload = {
          email: normalized.email || '',
          plano: normalized.plano || 'basico',
          semestre: normalized.semestre || 1,
          modulo: normalized.modulo || normalized.semestre || 1,
          faculdadeId: normalized.faculdadeId,
          faculdadeNome: normalized.faculdadeNome,
          campusId: normalized.campusId,
          campusNome: normalized.campusNome,
          codeHash: normalized.codeHash || '',
          modulosAcesso: normalized.modulosAcesso || null,
          deviceId: normalized.deviceId || '',
          deviceIds: Array.isArray(normalized.deviceIds) ? normalized.deviceIds.filter(Boolean).slice(-5) : [],
          maxDispositivos: Number(normalized.maxDispositivos || 2),
          accessSource: normalized.accessSource || '',
          emailGrantId: normalized.emailGrantId || '',
          criadoEm: normalized.criadoEm || new Date().toISOString(),
          loginDate: normalized.loginDate || new Date().toISOString(),
          lastSeenAt: normalized.lastSeenAt || normalized.loginDate || new Date().toISOString(),
          lastSeenUa: normalized.lastSeenUa || '',
        };
        if (options.merge) {
          await setDoc(doc(window.__fbDb, 'users', fbUser.uid), payload, { merge: true });
        } else {
          await setDoc(doc(window.__fbDb, 'users', fbUser.uid), payload);
        }
      } catch (err) {
        if ((err?.code || '') !== 'permission-denied') throw err;
      }
    }

    async function loadUserProfile(fbUser) {
      try {
        const { doc, getDoc } = window.__fbFirestore;
        const snap = await getDoc(doc(window.__fbDb, 'users', fbUser.uid));
        if (snap.exists()) {
          return normalizeUserProfile({ uid: fbUser.uid, email: fbUser.email || '', ...snap.data() });
        }
      } catch {}

      return decodeProfileMarker(fbUser);
    }

    const EMAIL_ACCESS_COLLECTION = 'email_access';

    function normalizeAuthEmail(email) {
      return String(email || '').trim().toLowerCase();
    }

    function isEmailGrantValid(grant) {
      if (!grant || grant.ativo === false) return false;
      if (grant.expira) {
        const exp = new Date(grant.expira);
        if (Number.isNaN(+exp)) return false;
        const end = new Date(exp.getFullYear(), exp.getMonth(), exp.getDate(), 23, 59, 59, 999);
        if (new Date() > end) return false;
      }
      return true;
    }

    async function loadEmailAccessGrant(email) {
      const norm = normalizeAuthEmail(email);
      if (!norm || !window.__fbFirestore || !window.__fbDb) return null;
      try {
        const { doc, getDoc } = window.__fbFirestore;
        const snap = await getDoc(doc(window.__fbDb, EMAIL_ACCESS_COLLECTION, norm));
        if (!snap.exists()) return null;
        return { id: norm, ...snap.data() };
      } catch {
        return null;
      }
    }

    async function syncProfileAccessFromEmailGrant(fbUser, profile) {
      if (!profile || !fbUser?.email) return profile;
      try {
        const grant = await loadEmailAccessGrant(fbUser.email);
        if (!grant || !isEmailGrantValid(grant)) return profile;

        const incomingModules = resolveModulesFromCodeEntry(grant);
        const currentModules = normalizeModulesAccess(profile.modulosAcesso);
        const incomingPlan = grant.plano || profile.plano || 'basico';
        const incomingMax = Number(grant.maxDispositivos || profile.maxDispositivos || 2);
        const normalizedPlan = String(incomingPlan || '').toLowerCase();
        const safeIncomingModules = (normalizedPlan === 'modulo' && !incomingModules)
          ? (currentModules || null)
          : incomingModules;

        const merged = normalizeUserProfile({
          ...profile,
          plano: incomingPlan,
          modulosAcesso: safeIncomingModules,
          maxDispositivos: incomingMax,
          accessSource: 'email_invite',
          emailGrantId: grant.id || normalizeAuthEmail(fbUser.email),
        });

        const modulesChanged = JSON.stringify(merged.modulosAcesso || null) !== JSON.stringify(currentModules || null);
        const planChanged = incomingPlan !== (profile.plano || 'basico');
        const maxChanged = incomingMax !== Number(profile.maxDispositivos || 2);
        const sourceChanged = (profile.accessSource || '') !== 'email_invite';

        if (!modulesChanged && !planChanged && !maxChanged && !sourceChanged) return profile;

        try {
          await saveUserProfile(fbUser, buildSessionTrackedProfile(merged), { merge: true });
        } catch {}

        return merged;
      } catch {
        return profile;
      }
    }

    async function syncProfileAccessFromCodeEntry(fbUser, profile) {
      if (!profile || !profile.codeHash) return profile;

      try {
        const response = await fetch('data/codigos.json?_=' + Date.now());
        if (!response.ok) return profile;

        const data = await response.json();
        const allCodes = data?.codigos || {};
        const rawHash = String(profile.codeHash || '').trim();
        let resolvedHash = rawHash;
        let codeEntry = allCodes[resolvedHash] || null;

        // Backward compatibility: older profiles stored only first 8 chars.
        if (!codeEntry && rawHash && rawHash.length < 64) {
          const match = Object.keys(allCodes).find(fullHash => fullHash.startsWith(rawHash));
          if (match) {
            resolvedHash = match;
            codeEntry = allCodes[match];
          }
        }

        if (!codeEntry) return profile;

        const incomingModules = resolveModulesFromCodeEntry(codeEntry);
        const currentModules = normalizeModulesAccess(profile.modulosAcesso);
        const incomingPlan = codeEntry.plano || profile.plano || 'basico';
        const incomingMax = Number(codeEntry.maxDispositivos || profile.maxDispositivos || 2);
        const normalizedPlan = String(incomingPlan || '').toLowerCase();
        const safeIncomingModules = (normalizedPlan === 'modulo' && !incomingModules)
          ? (currentModules || null)
          : incomingModules;

        const modulesChanged = JSON.stringify(safeIncomingModules || null) !== JSON.stringify(currentModules || null);
        const planChanged = incomingPlan !== (profile.plano || 'basico');
        const maxChanged = incomingMax !== Number(profile.maxDispositivos || 2);

        if (!modulesChanged && !planChanged && !maxChanged) return profile;

        const merged = normalizeUserProfile({
          ...profile,
          plano: incomingPlan,
          modulosAcesso: safeIncomingModules,
          maxDispositivos: incomingMax,
          codeHash: resolvedHash || profile.codeHash,
        });

        try {
          await saveUserProfile(fbUser, buildSessionTrackedProfile(merged), { merge: true });
        } catch {}

        return merged;
      } catch {
        return profile;
      }
    }

    async function checkAmbassadorQualification(profile) {
      if (!profile || !profile.ambassadorVitalicio) return profile;

      try {
        const fullModules = getAmbassadorModules();
        const lastCheck = profile.lastQualificationCheck ? new Date(profile.lastQualificationCheck) : null;
        const now = new Date();
        const daysSinceCheck = lastCheck ? (now - lastCheck) / (1000 * 60 * 60 * 24) : 999;

        // First month grace period: starts approved and keeps full access for 30 days.
        if (!lastCheck) {
          const firstMonthApproved = {
            ...profile,
            qualificationStatus: 'approved',
            lastQualificationCheck: now.toISOString(),
            modulosAcesso: fullModules
          };
          if (window.__fbAuth?.currentUser) {
            try {
              await saveUserProfile(window.__fbAuth.currentUser, buildSessionTrackedProfile(firstMonthApproved), { merge: true });
            } catch {}
          }
          return firstMonthApproved;
        }

        // Only check every 30 days
        if (lastCheck && daysSinceCheck < 30) {
          if (profile.qualificationStatus === 'suspended') return profile;
          return { ...profile, modulosAcesso: fullModules };
        }

        // Fetch sales data for current month
        const currentMonth = now.toISOString().slice(0, 7);
        const response = await fetch('data/vendas_mensais.json?_=' + Date.now());
        if (!response.ok) {
          // Fallback: keep current status if fetch fails
          return profile;
        }

        const salesData = await response.json();
        const monthSales = salesData[currentMonth] || {};
  const ambassadorRef = profile.ambassadorId || profile.uid;
  const ambassadorSales = monthSales[ambassadorRef];

        const hasMinSale = ambassadorSales && ambassadorSales.count >= 1;
        const newStatus = hasMinSale ? 'approved' : 'suspended';

        const updated = {
          ...profile,
          qualificationStatus: newStatus,
          lastQualificationCheck: now.toISOString(),
          modulosAcesso: newStatus === 'suspended' ? null : fullModules
        };

        // Save updated status
        if (window.__fbAuth?.currentUser) {
          try {
            await saveUserProfile(window.__fbAuth.currentUser, buildSessionTrackedProfile(updated), { merge: true });
          } catch {}
        }

        return updated;
      } catch (err) {
        // Fallback: keep existing profile on any error
        console.warn('Ambassador qualification check failed:', err);
        return profile;
      }
    }

    function persistLocalUser(profile) {
      const normalized = normalizeUserProfile(profile);
      localStorage.setItem('meduni9_user', JSON.stringify(normalized));
      return normalized;
    }

    function getUserInstitutionLabel(user) {
      const normalized = normalizeUserProfile(user);
      const faculty = getFacultyById(normalized.faculdadeId);
      return `${faculty.shortName} ${normalized.campusNome}`;
    }

    // Auth Screen
    const AuthScreen = ({ onAuthSuccess }) => {
      const [mode, setMode] = useState('login');       // 'login' | 'register'
      const [step, setStep] = useState(1);             // register steps: 1=code 2=account 3=instituicao 4=modulo
      const [code, setCode] = useState('');
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [confirmPassword, setConfirmPassword] = useState('');
      const [showPass, setShowPass] = useState(false);
      const [facultyId, setFacultyId] = useState(DEFAULT_FACULTY_ID);
      const [campusId, setCampusId] = useState(DEFAULT_CAMPUS_ID);
      const [semester, setSemester] = useState(null);
      const [fingerprint, setFingerprint] = useState('');
      const [error, setError] = useState('');
      const [loading, setLoading] = useState(false);
      const [validatedCode, setValidatedCode] = useState(null);
      const [regFirebaseUser, setRegFirebaseUser] = useState(null); // Firebase user after Google register
      const [couponCode, setCouponCode] = useState('');
      const [couponValid, setCouponValid] = useState(null); // null | true | false
      const [validatedCouponEntry, setValidatedCouponEntry] = useState(null);
      const [showForgot, setShowForgot] = useState(false);
      const [forgotEmail, setForgotEmail] = useState('');
      const [forgotSent, setForgotSent] = useState(false);
      const [registerPath, setRegisterPath] = useState('code'); // 'code' | 'email'
      const [emailInviteGrant, setEmailInviteGrant] = useState(null);
      const ambassadorKeyDetected = String(validatedCode?.tipo || '').toLowerCase() === 'embaixador';
      const resolvedEmailModules = emailInviteGrant ? resolveModulesFromCodeEntry(emailInviteGrant) : null;
      const keyModulesFromCode = validatedCode?.modulosAcesso?.length ? validatedCode.modulosAcesso : null;
      const allowedSemesters = ambassadorKeyDetected
        ? getAmbassadorModules()
        : (keyModulesFromCode || resolvedEmailModules || getAmbassadorModules());

      useEffect(() => {
        generateDeviceFingerprint().then(fp => setFingerprint(fp));
      }, []);

      useEffect(() => {
        let cancelled = false;
        (async () => {
          const u = window.__fbAuth?.currentUser;
          if (!u?.email) return;
          const p = await loadUserProfile(u);
          if (p) return;
          const grant = await loadEmailAccessGrant(u.email);
          if (cancelled || !grant || !isEmailGrantValid(grant)) return;
          setRegFirebaseUser(u);
          setEmailInviteGrant(grant);
          setRegisterPath('email');
          setEmail(u.email || '');
          setMode('register');
          setStep(3);
        })();
        return () => { cancelled = true; };
      }, []);

      useEffect(() => {
        if (step !== 4) return;
        if (allowedSemesters.length === 1) {
          setSemester(allowedSemesters[0]);
        } else if (semester && !allowedSemesters.includes(semester)) {
          setSemester(null);
        }
      }, [step, validatedCode]);

      const applyProfile = (profile) => {
        onAuthSuccess(persistLocalUser(profile));
      };

      const beginCodeActivation = (fbUser, message) => {
        setRegFirebaseUser(fbUser || null);
        setEmail(fbUser?.email || '');
        setRegisterPath('code');
        setEmailInviteGrant(null);
        setMode('register');
        setStep(1);
        setError(message || 'Ative seu código para concluir o acesso.');
      };

      const beginEmailInviteCompletion = (fbUser, grant) => {
        setRegFirebaseUser(fbUser || null);
        setEmailInviteGrant(grant || null);
        setRegisterPath('email');
        setEmail(fbUser?.email || '');
        setMode('register');
        setStep(3);
        setError('');
      };

      // ── code change handler ────────────────────────────────────────────────
      const handleCodeChange = (e) => {
        let value = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
        if (value.length > 12) value = value.slice(0, 12);
        if (value.length > 8)      value = value.slice(0, 4) + '-' + value.slice(4, 8) + '-' + value.slice(8);
        else if (value.length > 4) value = value.slice(0, 4) + '-' + value.slice(4);
        setCode(value);
      };

      // ── validate coupon code ──────────────────────────────────────────────
      const validateCoupon = async (coupon) => {
        try {
          const response = await fetch('data/cupons.json?_=' + Date.now());
          if (!response.ok) {
            setValidatedCouponEntry(null);
            setCouponValid(false);
            return false;
          }
          const allCoupons = await response.json();
          const couponUpper = (coupon || '').toUpperCase();
          const couponEntry = allCoupons[couponUpper];
          if (couponEntry && couponEntry.ativo && new Date() <= new Date(couponEntry.validade_ate)) {
            setValidatedCouponEntry(couponEntry);
            setCouponValid(true);
            return true;
          }
          setValidatedCouponEntry(null);
          setCouponValid(false);
          return false;
        } catch (err) {
          setValidatedCouponEntry(null);
          setCouponValid(false);
          return false;
        }
      };

      // ── register step 1: validate code ────────────────────────────────────
      const handleCodeSubmit = async () => {
        setError('');
        if (!code || code.length < 14) { setError('Código inválido. Use o formato XXXX-XXXX-XXXX'); return; }
        const rl = checkRateLimit();
        if (!rl.allowed) { setError(rl.message); return; }
        setLoading(true);
        try {
          const codeHash = await hashCode(code);
          const response = await fetch('data/codigos.json?_=' + Date.now());
          if (!response.ok) throw new Error('Erro ao verificar código');
          const data = await response.json();
          const codeEntry = data.codigos[codeHash];
          if (!codeEntry) { recordFailedAttempt(); setLoading(false); setError('Código de acesso inválido.'); return; }
          if (!codeEntry.ativo) { recordFailedAttempt(); setLoading(false); setError('Este código foi desativado.'); return; }
          if (codeEntry.expira) {
            const expirationDate = new Date(codeEntry.expira);
            if (new Date() > expirationDate) { recordFailedAttempt(); setLoading(false); setError('Este código expirou em ' + expirationDate.toLocaleDateString('pt-BR') + '.'); return; }
          }
          const registeredDevices = codeEntry.dispositivos || [];
          if (!registeredDevices.includes(fingerprint) && registeredDevices.length >= codeEntry.maxDispositivos) {
            recordFailedAttempt(); setLoading(false); setError('Limite de dispositivos atingido para este código.'); return;
          }
          resetRateLimit();
          const currentFbUser = regFirebaseUser || window.__fbAuth?.currentUser || null;
          const currentEmail = (currentFbUser?.email || '').toLowerCase();
          const codeEmail = (codeEntry.email || '').toLowerCase();
          if (currentEmail && codeEmail && currentEmail !== codeEmail) {
            setLoading(false);
            setError('Este código está associado a outro email.');
            return;
          }

          const keyModules = resolveModulesFromCodeEntry(codeEntry);
          if (String(codeEntry.plano || '').toLowerCase() === 'modulo' && !keyModules) {
            setLoading(false);
            setError('Esta chave de módulo está sem configuração de acesso. Contate o suporte.');
            return;
          }
          setValidatedCouponEntry(null);
          setCouponCode('');
          setCouponValid(null);
          setValidatedCode({ hash: codeHash, ...codeEntry, modulosAcesso: keyModules });
          setRegisterPath('code');
          if (currentFbUser) {
            setRegFirebaseUser(currentFbUser);
            if (currentFbUser.email) setEmail(currentFbUser.email);
          }
          setLoading(false);
          setStep(currentFbUser ? 3 : 2);
        } catch (err) {
          setLoading(false);
          setError('Erro ao verificar código. Verifique sua conexão.');
        }
      };

      // ── register step 2: create with email/senha ──────────────────────────
      const handleCreateWithEmail = async () => {
        setError('');
        if (!email) { setError('Email é obrigatório'); return; }
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { setError('Email inválido'); return; }
        if (validatedCode?.email && validatedCode.email !== email) { setError('Este código está associado a outro email.'); return; }
        if (!password || password.length < 6) { setError('Senha deve ter no mínimo 6 caracteres'); return; }
        if (password !== confirmPassword) { setError('As senhas não coincidem'); return; }
        setLoading(true);
        try {
          const { createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut: fbSignOut } = window.__fbAuthFns;
          const cred = await createUserWithEmailAndPassword(window.__fbAuth, email, password);
          setRegFirebaseUser(cred.user);
          if (registerPath === 'email') {
            const grant = await loadEmailAccessGrant(cred.user.email);
            if (!grant || !isEmailGrantValid(grant)) {
              setLoading(false);
              setError('Este email ainda não foi liberado. Confirme com a equipe MedGrad+ ou use uma chave de acesso.');
              try { await fbSignOut(window.__fbAuth); } catch {}
              return;
            }
            setEmailInviteGrant(grant);
            setLoading(false);
            setStep(3);
            return;
          }
          setLoading(false);
          setStep(3);
        } catch (err) {
          if (err.code === 'auth/email-already-in-use') {
            try {
              const cred = await signInWithEmailAndPassword(window.__fbAuth, email, password);
              setRegFirebaseUser(cred.user);
              if (registerPath === 'email') {
                const grant = await loadEmailAccessGrant(cred.user.email);
                if (!grant || !isEmailGrantValid(grant)) {
                  setLoading(false);
                  setError('Este email ainda não foi liberado. Confirme com a equipe MedGrad+ ou use uma chave de acesso.');
                  try { await window.__fbAuthFns.signOut(window.__fbAuth); } catch {}
                  return;
                }
                setEmailInviteGrant(grant);
              }
              setLoading(false);
              setStep(3);
              return;
            } catch (signInErr) {
              setLoading(false);
              if ((signInErr.code || '') === 'auth/invalid-credential') {
                setError('Este email já possui conta. Entre com a senha correta para vincular o código.');
              } else {
                setError('Conta existente encontrada, mas não foi possível entrar: ' + (signInErr.message || ''));
              }
              return;
            }
          }
          setLoading(false);
          if (err.code === 'auth/weak-password') setError('Senha muito fraca.');
          else setError('Erro ao criar conta: ' + (err.message || ''));
        }
      };

      // ── register step 2: create with Google ───────────────────────────────
      const handleGoogleRegister = async () => {
        setError('');
        setLoading(true);
        try {
          const { signInWithPopup, signOut: fbSignOut } = window.__fbAuthFns;
          const cred = await signInWithPopup(window.__fbAuth, window.__fbGoogleProvider);
          const existing = await loadUserProfile(cred.user);
          if (existing) { setLoading(false); applyProfile(existing); return; }
          if (registerPath === 'email') {
            const grant = await loadEmailAccessGrant(cred.user.email);
            if (!grant || !isEmailGrantValid(grant)) {
              setLoading(false);
              setError('Este email ainda não foi liberado. Confirme com a equipe MedGrad+ ou use uma chave de acesso.');
              try { await fbSignOut(window.__fbAuth); } catch {}
              return;
            }
            setEmailInviteGrant(grant);
          }
          setRegFirebaseUser(cred.user);
          setEmail(cred.user.email || '');
          setLoading(false);
          setStep(3);
        } catch (err) {
          setLoading(false);
          if (err.code !== 'auth/popup-closed-by-user') setError('Erro ao entrar com Google.');
        }
      };

      const handleInstitutionSubmit = () => {
        setError('');
        const faculty = getFacultyById(facultyId);
        const campus = getCampusById(facultyId, campusId);
        if (!faculty?.active) { setError('Essa faculdade ainda está em breve.'); return; }
        if (!campus?.active) { setError('Esse campus ainda está em breve.'); return; }
        setStep(4);
      };

      // ── register step 4: save profile ─────────────────────────────────────
      const handleSemesterSubmit = async () => {
        setError('');
        if (!semester) { setError('Selecione seu módulo'); return; }
        const ambassadorIdFromKey = validatedCode?.embaixadorId || null;
        const ambassadorIdFromCoupon = validatedCouponEntry?.linkedToAmbassador || null;
        const isAmbassadorKey = String(validatedCode?.tipo || '').toLowerCase() === 'embaixador';

        if (isAmbassadorKey && !couponCode) {
          setError('Para chave de embaixador, o cupom é obrigatório.');
          return;
        }

        if (isAmbassadorKey && (!couponValid || !validatedCouponEntry)) {
          setError('Cupom de embaixador inválido.');
          return;
        }

        if (isAmbassadorKey && ambassadorIdFromKey && ambassadorIdFromCoupon && ambassadorIdFromKey !== ambassadorIdFromCoupon) {
          setError('Este cupom não pertence ao embaixador desta chave.');
          return;
        }

        const isAmbassador = isAmbassadorKey && couponValid === true;
        const ambassadorModules = getAmbassadorModules();
        const keyModules = isAmbassador
          ? ambassadorModules
          : (validatedCode?.modulosAcesso?.length
              ? validatedCode.modulosAcesso
              : (emailInviteGrant ? resolveModulesFromCodeEntry(emailInviteGrant) : null));
        const fromEmailInvite = !!(emailInviteGrant && !validatedCode?.hash);
        if (fromEmailInvite) {
          const kmCheck = resolveModulesFromCodeEntry(emailInviteGrant);
          if (String(emailInviteGrant.plano || '').toLowerCase() === 'modulo' && !kmCheck) {
            setError('Configuração do convite incompleta. Contate o suporte.');
            return;
          }
        }

        if (!isAmbassador && keyModules && !keyModules.includes(semester)) {
          setError('Este código ou convite não libera o módulo selecionado.');
          return;
        }
        setLoading(true);
        try {
          const fbUser = regFirebaseUser || window.__fbAuth?.currentUser;
          if (!fbUser) { setError('Sessão expirada. Reinicie o cadastro.'); setLoading(false); return; }
          const planFromInvite = emailInviteGrant?.plano || 'basico';
          const maxFromInvite = emailInviteGrant?.maxDispositivos || 2;
          const profile = {
            uid:       fbUser.uid,
            email:     fbUser.email || email,
            plano:     validatedCode?.plano || planFromInvite || 'basico',
            semestre:  semester,
            modulo:    semester,
            modulosAcesso: isAmbassador ? ambassadorModules : keyModules,
            faculdadeId: facultyId,
            campusId: campusId,
            codeHash:  validatedCode?.hash || '',
            accessSource: fromEmailInvite ? 'email_invite' : '',
            emailGrantId: fromEmailInvite ? (emailInviteGrant?.id || normalizeAuthEmail(fbUser.email)) : '',
            deviceId:  fingerprint,
            deviceIds: fingerprint ? [fingerprint] : [],
            maxDispositivos: validatedCode?.maxDispositivos || maxFromInvite || 2,
            couponCode: couponCode || null,
            couponLinkedAt: couponCode ? new Date().toISOString() : null,
            ambassadorVitalicio: isAmbassador,
            ambassadorId: isAmbassador ? (ambassadorIdFromKey || ambassadorIdFromCoupon || null) : null,
            ambassadorEmail: isAmbassador ? (fbUser.email || email || null) : null,
            lastQualificationCheck: isAmbassador ? new Date().toISOString() : null,
            qualificationStatus: isAmbassador ? 'approved' : 'pending',
            loginDate: new Date().toISOString(),
          };
          const trackedProfile = buildSessionTrackedProfile(profile, fingerprint);
          try {
            await saveUserProfile(fbUser, trackedProfile);
          } catch (persistErr) {
            // Keep user inside app even if backend/profile sync fails temporarily.
          }
          setLoading(false);
          applyProfile(trackedProfile);
        } catch (err) {
          setLoading(false);
          const details = err?.code || err?.message || '';
          setError(`Erro ao salvar perfil. ${details || 'Tente novamente.'}`);
        }
      };

      // ── login with email/senha ────────────────────────────────────────────
      const handleLoginWithEmail = async () => {
        setError('');
        if (!email || !password) { setError('Preencha email e senha'); return; }
        setLoading(true);
        try {
          const { signInWithEmailAndPassword } = window.__fbAuthFns;
          const cred = await signInWithEmailAndPassword(window.__fbAuth, email, password);
          const profile = await loadUserProfile(cred.user);
          setLoading(false);
          if (!profile) {
            const grant = await loadEmailAccessGrant(cred.user.email);
            if (grant && isEmailGrantValid(grant)) {
              beginEmailInviteCompletion(cred.user, grant);
              return;
            }
            beginCodeActivation(cred.user, 'Conta encontrada, mas perfil incompleto. Ative seu código para concluir o acesso.');
            return;
          }
          const trackedProfile = buildSessionTrackedProfile(profile, fingerprint);
          try { await saveUserProfile(cred.user, trackedProfile, { merge: true }); } catch {}
          applyProfile(trackedProfile);
        } catch (err) {
          setLoading(false);
          const code = err.code || '';
          if (code === 'auth/invalid-credential' || code === 'auth/user-not-found' || code === 'auth/wrong-password') {
            setError('Email ou senha incorretos.');
          } else {
            setError('Erro ao entrar: ' + (err.message || ''));
          }
        }
      };

      // ── login with Google ─────────────────────────────────────────────────
      const handleGoogleLogin = async () => {
        setError('');
        setLoading(true);
        try {
          const { signInWithPopup } = window.__fbAuthFns;
          const cred = await signInWithPopup(window.__fbAuth, window.__fbGoogleProvider);
          const profile = await loadUserProfile(cred.user);
          setLoading(false);
          if (!profile) {
            const grant = await loadEmailAccessGrant(cred.user.email);
            if (grant && isEmailGrantValid(grant)) {
              beginEmailInviteCompletion(cred.user, grant);
              return;
            }
            beginCodeActivation(cred.user, 'Conta Google encontrada, mas sem cadastro. Ative seu código para continuar.');
            return;
          }
          const trackedProfile = buildSessionTrackedProfile(profile, fingerprint);
          try { await saveUserProfile(cred.user, trackedProfile, { merge: true }); } catch {}
          applyProfile(trackedProfile);
        } catch (err) {
          setLoading(false);
          if (err.code !== 'auth/popup-closed-by-user') setError('Erro ao entrar com Google.');
        }
      };

      // ── forgot password ───────────────────────────────────────────────────
      const handleForgotPassword = async () => {
        setError('');
        if (!forgotEmail) { setError('Digite seu email'); return; }
        setLoading(true);
        try {
          const { sendPasswordResetEmail } = window.__fbAuthFns;
          await sendPasswordResetEmail(window.__fbAuth, forgotEmail);
          setForgotSent(true);
          setLoading(false);
        } catch {
          setLoading(false);
          setError('Erro ao enviar email. Verifique o endereço.');
        }
      };

      // ── free access (no code) ─────────────────────────────────────────────
      const handleFreeAccess = () => {
        const freeProfile = {
          uid: 'guest_' + Date.now(),
          email: 'visitante@medgradplus.app',
          plano: 'gratuito',
          semestre: 1,
          modulo: 1,
          modulosAcesso: [1],
          faculdadeId: 'uninove',
          campusId: 'vergueiro',
          codeHash: '',
          deviceId: fingerprint || 'guest',
          loginDate: new Date().toISOString(),
          isGuest: true,
        };
        applyProfile(freeProfile);
      };

      // ── sub-components ────────────────────────────────────────────────────
      const GoogleIcon = () => (
        <svg width="18" height="18" viewBox="0 0 24 24" style={{ flexShrink: 0 }}>
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
        </svg>
      );

      const Divider = () => (
        <div style={{ display: 'flex', alignItems: 'center', gap: '12px', margin: '16px 0' }}>
          <div style={{ flex: 1, height: '1px', background: 'var(--border-color, #333)' }}></div>
          <span style={{ color: 'var(--text-secondary)', fontSize: '12px' }}>ou</span>
          <div style={{ flex: 1, height: '1px', background: 'var(--border-color, #333)' }}></div>
        </div>
      );

      return (
        <div className="auth-page">

          {/* ── LEFT BRAND PANEL (desktop only) ─────────────────────────── */}
          <div className="auth-brand-panel">
            <div className="auth-brand-mascot-wrap">
              <div className="auth-brand-top">
                {/* Logo */}
                <div className="auth-brand-logo">
                  <LogoIcon size={36} />
                  <div className="auth-brand-logo-text">MedGradPlus<sup>+</sup></div>
                </div>

                {/* Headline */}
                <h1 className="auth-brand-headline">
                  Estude de forma<br /><span>personalizada</span><br />para a sua faculdade.
                </h1>
                <p className="auth-brand-sub">
                  O único app de medicina construído especificamente para o currículo e o jeito de cobrar de cada instituição. Conteúdo na medida certa, sem enrolação.
                </p>

                {/* Features */}
                <div className="auth-brand-features">
                  <div className="auth-brand-feature">
                    <div className="auth-brand-feature-icon">🎯</div>
                    <div className="auth-brand-feature-text">
                      <strong>Conteúdo do seu módulo</strong>
                      <span>Material alinhado com o que cai nas provas da sua faculdade</span>
                    </div>
                  </div>
                  <div className="auth-brand-feature">
                    <div className="auth-brand-feature-icon">🃏</div>
                    <div className="auth-brand-feature-text">

                        <button type="button" onClick={() => setShowPass(s => !s)}
                          style={{ position: 'absolute', right: '12px', top: '50%', transform: 'translateY(-50%)', background: 'none', border: 'none', cursor: 'pointer', color: 'var(--text-secondary)', fontSize: '12px' }}>

                        </button>
                      </div>
                      <input className="form-input" type={showPass ? 'text' : 'password'} placeholder="Confirmar senha"
                        value={confirmPassword} onChange={e => { setConfirmPassword(e.target.value); setError(''); }} style={{ marginBottom: '16px' }} />

                      <div style={{ marginBottom: '16px' }}>
                        <label style={{ fontSize: '12px', color: 'var(--text-secondary)', display: 'block', marginBottom: '6px' }}>

                        </label>
                        <input 
                          className="form-input" 
                          type="text" 
                          placeholder="Código do cupom" 
                          value={couponCode}
                          onChange={async (e) => {
                            const val = e.target.value.toUpperCase();
                            setCouponCode(val);
                            if (val.length > 3) await validateCoupon(val);
                            else setCouponValid(null);
                          }}
                          style={{ marginBottom: '6px' }}
                        />
                        {couponValid === true && <p style={{ fontSize: '12px', color: 'var(--success, #10B981)' }}>✓ Cupom válido</p>}

                      </div>

                      </button>
                      <button className="btn btn-secondary mt-2" onClick={() => { setStep(1); setRegisterPath('code'); setError(''); }}>Voltar</button>
                    </div>
                  )}

                  {/* Step 3: Institution */}
                  {step === 3 && (
                    <div>

                        Escolha sua faculdade e campus. As instituições sem conteúdo liberado ficam visíveis, mas em breve.
                      </p>
                      {error && <div className="error-message" style={{ marginBottom: '12px' }}>{error}</div>}

                        {FACULTY_CATALOG.map(faculty => (
                          <button
                            key={faculty.id}

                            className={`institution-card ${facultyId === faculty.id ? 'selected' : ''} ${faculty.active ? '' : 'disabled'}`}

                              if (!faculty.active) return;
                              setFacultyId(faculty.id);
                              setCampusId(getFirstActiveCampus(faculty)?.id || '');
                              setError('');

                            <div>
                              <div className="institution-name">{faculty.shortName}</div>

                          </button>

                            className={`institution-card ${campusId === campus.id ? 'selected' : ''} ${campus.active ? '' : 'disabled'}`}

                              if (!campus.active) return;
                              setCampusId(campus.id);

                      <button className="btn btn-secondary mt-2" onClick={() => { setStep(2); setError(''); }}>Voltar</button>

                        <p style={{ fontSize: '12px', color: 'var(--warning)', marginBottom: '10px' }}>

    };

    // Dashboard Screen
    const DashboardScreen = ({ user, materias, flashcards, onSelectMateria }) => {
      const [stats, setStats] = useState({ cardsToday: 0, questionsToday: 0, accuracy: 0 });
      const [viewAll, setViewAll] = useState(false);
      const userSemester = user.semestre || user.modulo || 1;

      useEffect(() => {
        const srData = JSON.parse(localStorage.getItem('meduni9_sr_data') || '{}');
        const quizHistory = JSON.parse(localStorage.getItem('meduni9_quiz_history') || '[]');

        const today = new Date().toDateString();
        const todayQuizzes = quizHistory.filter(q => new Date(q.date).toDateString() === today);
        const correctCount = todayQuizzes.filter(q => q.score === q.total).length;

        setStats({
          cardsToday: Object.keys(srData).length,
          questionsToday: todayQuizzes.length,
          accuracy: todayQuizzes.length > 0 ? Math.round((correctCount / todayQuizzes.length) * 100) : 0
        });
      }, []);

      const srDataForHome = JSON.parse(localStorage.getItem('meduni9_sr_data') || '{}');
      const dueCards = SM2.getReviewDueCards(flashcards, srDataForHome);
      const reviewedCards = flashcards.filter(f => srDataForHome[f.id] && !srDataForHome[f.id].buried);

      const displayMaterias = viewAll
        ? materias.filter(m => m.ativo !== false)
        : materias.filter(m => m.modulo === userSemester && m.ativo !== false);

      // Group by semester when viewing all
      const groupedMaterias = useMemo(() => {
        if (!viewAll) return { [userSemester]: displayMaterias };
        const groups = {};
        displayMaterias.forEach(m => {
          const sem = m.modulo || 0;
          if (!groups[sem]) groups[sem] = [];
          groups[sem].push(m);
        });
        return groups;
      }, [displayMaterias, viewAll, userSemester]);

            {/* Upsell banner for free/guest users */}

                <div className="upsell-banner-text">
                  <strong>Modo demonstração — conheça a plataforma</strong>
                  <span>
                    Você tem <strong style={{ color: 'rgba(255,255,255,0.85)' }}>1 aula completa</strong> com material de leitura, flashcards e questões da mesma aula. O restante do conteúdo abre com código.
                  </span>
                </div>
                <button type="button" className="upsell-banner-btn" onClick={() => { window.location.href = 'comprar.html'; }}>
                  Ver planos
                </button>
              </div>
            )}

              <h1 className="dashboard-welcome">Olá, {user.isGuest ? 'Visitante' : user.email.split('@')[0]}!</h1>
              <p className="dashboard-date">{new Date().toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long' })} — Módulo {userSemester}</p>
            </div>

            <div className="stats-grid">
              <div className="stat-card">
                <div className="stat-icon"><IconLayers /></div>
                <div className="stat-value">{stats.cardsToday}</div>
                <div className="stat-label">Cards</div>
              </div>
              <div className="stat-card">
                <div className="stat-icon"><IconClipboardList /></div>
                <div className="stat-value">{stats.questionsToday}</div>
                <div className="stat-label">Questões</div>
              </div>
              <div className="stat-card">
                <div className="stat-icon"><IconTarget /></div>
                <div className="stat-value">{stats.accuracy}%</div>
                <div className="stat-label">Acurácia</div>
              </div>
            </div>

            {reviewedCards.length > 0 && (
              <div className="daily-suggestion">
                <div className="suggestion-label">Sugestão do Dia</div>
                <div className="suggestion-title">
                  {dueCards.length > 0 ? `${dueCards.length} cards para revisar` : 'Tudo em dia! ✨'}
                </div>
                <div className="suggestion-progress">
                  <div className="suggestion-progress-bar" style={{ width: dueCards.length > 0 ? `${Math.min(100, Math.round((dueCards.length / Math.max(reviewedCards.length, 1)) * 100))}%` : '100%', background: dueCards.length > 0 ? undefined : 'var(--primary)' }}></div>
                </div>
                <div className="suggestion-meta">
                  {dueCards.length > 0
                    ? `${Math.round((dueCards.length / Math.max(reviewedCards.length, 1)) * 100)}% do seu deck`
                    : `${reviewedCards.length} cards no seu deck`}
                </div>
                {dueCards.length > 0 && (
                  <button className="suggestion-cta" onClick={() => onSelectMateria(null)}>
                    <IconPlay /> Estudar agora
                  </button>
                )}
              </div>
            )}

            <div style={{ flex: 1, overflowY: 'auto', paddingBottom: '90px' }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
              <div className="section-title" style={{ margin: 0 }}>Disciplinas</div>
              <button
                className="semester-tab"
                style={{ marginTop: '24px', fontSize: '12px', padding: '6px 12px' }}
                onClick={() => setViewAll(!viewAll)}
              >
                {viewAll ? 'Meu módulo' : 'Ver todos'}
              </button>
            </div>

            <div className="subject-select-list" style={{ marginTop: '16px' }}>
              {Object.entries(groupedMaterias).sort(([a],[b]) => Number(a) - Number(b)).map(([sem, mats]) => (
                <React.Fragment key={sem}>
                  {viewAll && (
                    <div className="semester-group-header">Módulo {sem}</div>
                  )}
                  {mats.map((materia) => {
                    const materiaCards = flashcards.filter(f => f.materia === materia.id && f.tipo !== 'quiz');
                    const srData = JSON.parse(localStorage.getItem('meduni9_sr_data') || '{}');
                    const reviewedCount = materiaCards.filter(f => srData[f.id]).length;
                    const pct = materiaCards.length > 0 ? Math.round((reviewedCount / materiaCards.length) * 100) : 0;
                    const subjectColor = SUBJECT_ICON_MAP[materia.id]?.color || materia.cor || 'var(--primary)';

                      <div
                        key={materia.id}
                        className="subject-select-card"
                        onClick={() => onSelectMateria(materia.id)}
                      >
                        <SubjectIcon materiaId={materia.id} icon={materia.icon} cor={materia.cor} />
                        <div className="subject-select-info">
                          <div className="subject-select-name">{materia.sigla || materia.nome}</div>
                          <div className="subject-select-meta">
                            {materia.nome}{materiaCards.length > 0 ? ` — ${materiaCards.length} cards` : ''}
                          </div>
                          {materiaCards.length > 0 && (
                            <div className="subject-progress-bar">
                              <div className="subject-progress-fill" style={{ width: `${pct}%`, background: subjectColor }} />
                            </div>
                          )}
                        </div>
                        <div style={{ color: 'var(--text-secondary)' }}>
                          <IconChevronRight />
                        </div>
                      </div>
                    );
                  })}
                </React.Fragment>
              ))}

              {displayMaterias.length === 0 && (
                <div style={{ textAlign: 'center', padding: '40px 0', color: 'var(--text-secondary)' }}>
                  <p>Nenhuma disciplina para o Módulo {userSemester} ainda.</p>
                  <button className="btn btn-secondary mt-2" onClick={() => setViewAll(true)}>
                    Ver todas as disciplinas
                  </button>
                </div>
              )}
            </div>
            </div>
          </div>
        </>
      );
    };

    // Flashcards Screen
    const FlashcardsScreen = ({ flashcards, materias, selectedMateria, onSelectMateria, userSemester }) => {
      const [currentIndex, setCurrentIndex] = useState(0);
      const [isFlipped, setIsFlipped] = useState(false);
      const [sessionComplete, setSessionComplete] = useState(false);
      const [sessionStats, setSessionStats] = useState({ correct: 0, total: 0 });
      const [semesterFilter, setSemesterFilter] = useState(userSemester || null);
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedTemas, setSelectedTemas] = useState([]);
      const [studying, setStudying] = useState(false);
      const [sessionDeck, setSessionDeck] = useState([]);
      const srData = JSON.parse(localStorage.getItem('meduni9_sr_data') || '{}');

      useEffect(() => {
        setCurrentIndex(0);
        setIsFlipped(false);
        setSessionComplete(false);
        setSessionStats({ correct: 0, total: 0 });
        setStudying(false);
        setSelectedTemas([]);
        setSessionDeck([]);
      }, [selectedMateria]);

      // Keyboard shortcuts
      useEffect(() => {
        if (!studying || sessionComplete) return;
        const handleKey = (e) => {
          if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
          if (!isFlipped) {
            if (e.code === 'Space' || e.key === ' ') { e.preventDefault(); setIsFlipped(true); }
          } else {
            if (e.key === '1') handleDeNovo();
            else if (e.key === '2') handleRate(5);
            else if (e.key === '3') handleRate(3);
            else if (e.key === '4') handleRate(2);
            else if (e.code === 'Space' || e.key === ' ') { e.preventDefault(); setIsFlipped(false); }
          }
        };
        window.addEventListener('keydown', handleKey);
        return () => window.removeEventListener('keydown', handleKey);
      }, [studying, sessionComplete, isFlipped, currentIndex]);

      const pureFlashcards = flashcards.filter(f => f.tipo !== 'quiz');

      const filteredByMateria = pureFlashcards.filter(
        f => !selectedMateria || f.materia === selectedMateria
      );

      const filtered = selectedTemas.length === 0
        ? filteredByMateria.filter(f => !srData[f.id]?.buried)
        : filteredByMateria.filter(f => selectedTemas.includes(f.tema) && !srData[f.id]?.buried);

      // Build deck helper (used at session start)
      const buildDeck = (cards) => {
        const due = SM2.getDueCards(cards, srData);
        if (due.length > 0) return due;
        return [...cards].sort(() => Math.random() - 0.5);
      };

      // Always SM2 — get due cards, fallback to all shuffled if none due
      const deck = useMemo(() => {
        if (!selectedMateria) return [];
        return buildDeck(filtered);
      }, [selectedMateria, filtered.length, selectedTemas.length]);

      const currentCard = sessionDeck[currentIndex];

      const handleRate = (quality) => {
        const card = currentCard;
        if (!card) return;
        const currentData = srData[card.id] || { reps: 0, ef: 2.5, interval: 0, nextReview: Date.now() };
        const result = SM2.calculateNextReview(quality, currentData.reps, currentData.ef, currentData.interval);
        srData[card.id] = { ...result };
        localStorage.setItem('meduni9_sr_data', JSON.stringify(srData));

        const isGood = quality >= 3;
        const newStats = { ...sessionStats, total: sessionStats.total + 1, correct: sessionStats.correct + (isGood ? 1 : 0) };

        if (currentIndex < sessionDeck.length - 1) {
          setCurrentIndex(currentIndex + 1);
          setIsFlipped(false);
          setSessionStats(newStats);
        } else {
          setSessionStats(newStats);
          setSessionComplete(true);
        }
      };

      const handleDeNovo = () => {
        const card = currentCard;
        if (!card) return;
        const remaining = sessionDeck.length - currentIndex - 1;
        if (remaining > 0) {
          // Move card to end — re-show later this session, no SM-2 update
          const newDeck = [
            ...sessionDeck.slice(0, currentIndex),
            ...sessionDeck.slice(currentIndex + 1),
            card,
          ];
          setSessionDeck(newDeck);
          setIsFlipped(false);
        } else {
          // Only card left — schedule and finish
          handleRate(1);
        }
      };

      const handleBury = () => {
        const card = currentCard;
        if (!card) return;
        const currentData = srData[card.id] || { reps: 0, ef: 2.5, interval: 0, nextReview: Date.now() };
        srData[card.id] = { ...currentData, buried: true };
        localStorage.setItem('meduni9_sr_data', JSON.stringify(srData));
        if (currentIndex < sessionDeck.length - 1) {
          setCurrentIndex(currentIndex + 1);
          setIsFlipped(false);
        } else {
          setSessionComplete(true);
        }
      };

      const handleReport = () => {
        const card = currentCard;
        if (!card) return;
        const reason = prompt('Descreva o erro do flashcard (opcional):', '');
        if (reason === null) return;

        submitContentFeedback({
          origem: 'flashcards',
          mensagem: reason?.trim() || 'Erro reportado em flashcard',
          itemId: card.id,
          materia: card.materia,
          tema: card.tema,
          contexto: {
            pergunta: card.pergunta,
            resposta: card.resposta,
            explicacao: card.explicacao || ''
          }
        })
          .then(() => alert('Reporte enviado para o admin. Obrigado!'))
          .catch(() => alert('Nao foi possivel enviar agora. Tente novamente em instantes.'));
      };

      const resetSession = () => {
        setCurrentIndex(0);
        setIsFlipped(false);
        setSessionComplete(false);
        setSessionStats({ correct: 0, total: 0 });
        setStudying(false);
        setSelectedTemas([]);
        setSessionDeck([]);
      };

      const toggleTema = (temaId) => {
        setSelectedTemas(prev =>
          prev.includes(temaId) ? prev.filter(t => t !== temaId) : [...prev, temaId]
        );
      };

      // Materia selection screen
      if (!selectedMateria) {
        const allMaterias = materias.filter(m => m.ativo !== false);
        const semFiltered = semesterFilter ? allMaterias.filter(m => m.modulo === semesterFilter) : allMaterias;
        const filteredMaterias = semFiltered.filter(m => fuzzyMatch(searchQuery, m.nome) || fuzzyMatch(searchQuery, m.sigla || ''));
        const semesters = [...new Set(allMaterias.map(m => m.modulo))].sort((a,b) => a-b);

        return (
          <>
            <div className="screen-content">
              <h2 className="section-title">Flashcards</h2>
              {semesters.length > 1 && (
                <div className="semester-tabs">
                  <button className={`semester-tab ${!semesterFilter ? 'active' : ''}`} onClick={() => setSemesterFilter(null)}>Todos</button>
                  {semesters.map(s => (
                    <button key={s} className={`semester-tab ${semesterFilter === s ? 'active' : ''}`} onClick={() => setSemesterFilter(s)}>Módulo {s}</button>
                  ))}
                </div>
              )}
              <div className="subject-search-wrap">
                <span className="subject-search-icon"><IconSearch /></span>
                <input type="search" className="subject-search" placeholder="Buscar matéria..." value={searchQuery} onChange={e => setSearchQuery(e.target.value)} />
              </div>
              <div className="subject-select-list">
                {filteredMaterias.length === 0 && (
                  <div style={{ textAlign: 'center', padding: '40px 0', color: 'var(--text-secondary)' }}><p>Nenhum resultado encontrado.</p></div>
                )}
                {filteredMaterias.map(m => {
                  const count = pureFlashcards.filter(f => f.materia === m.id).length;
                  const dueCount = SM2.getReviewDueCards(pureFlashcards.filter(f => f.materia === m.id), srData).length;
                  const reviewedCount = count - dueCount;
                  const pct = count > 0 ? Math.round((reviewedCount / count) * 100) : 0;
                  const subjectColor = SUBJECT_ICON_MAP[m.id]?.color || m.cor || 'var(--primary)';
                  return (
                    <div key={m.id} className={`subject-select-card${count === 0 ? ' subject-card-empty' : ''}`} onClick={() => { onSelectMateria(m.id); setStudying(false); }}>
                      <SubjectIcon materiaId={m.id} icon={m.icon} cor={m.cor} />
                      <div className="subject-select-info">
                        <div className="subject-select-name">{m.sigla || m.nome}</div>
                        <div className="subject-select-meta">
                          {count > 0 ? `${count} cards${dueCount > 0 ? ` — ${dueCount} para revisar` : ' — em dia ✓'}` : 'Em breve'}
                        </div>
                        {count > 0 && (
                          <div className="subject-progress-bar">
                            <div className="subject-progress-fill" style={{ width: `${pct}%`, background: subjectColor }} />
                          </div>
                        )}
                      </div>
                      <div style={{ color: 'var(--text-secondary)' }}><IconChevronRight /></div>
                    </div>
                  );
                })}
              </div>
            </div>
          </>
        );
      }

      const selectedMateriaObj = materias.find(m => m.id === selectedMateria);
      const backLabel = selectedMateriaObj ? (selectedMateriaObj.sigla || selectedMateriaObj.nome) : 'Flashcards';

      // Tema selector
      if (!studying) {
        const totalCards = filteredByMateria.length;
        const dueTotal = SM2.getReviewDueCards(filteredByMateria, srData).length;
        const materiaObj = materias.find(m => m.id === selectedMateria);
        const temasFromCards = [...new Set(filteredByMateria.map(f => f.tema).filter(Boolean))];

        // Use aulas from materias.json for organized display
        const aulas = materiaObj?.aulas || [];
        const hasAulas = aulas.length > 0;

        return (
          <>
            <div className="screen-content">
              <button className="back-btn" onClick={() => onSelectMateria(null)}>← Flashcards</button>
              <h2 className="section-title">{backLabel}</h2>
              <p style={{ color: 'var(--text-secondary)', fontSize: '14px', marginBottom: '16px' }}>
                {totalCards > 0 ? (dueTotal > 0 ? `${dueTotal} cards para revisar hoje` : 'Todos os cards em dia!') : 'Nenhum flashcard ainda'} — {totalCards} total
              </p>
              <div className="subject-select-list" style={{ paddingBottom: selectedTemas.length > 0 ? '72px' : '0' }}>
                <div className="subject-select-card" onClick={() => { const allCards = filteredByMateria.filter(f => !srData[f.id]?.buried); setSelectedTemas([]); setSessionDeck(buildDeck(allCards)); setStudying(true); }}
                  style={{ borderColor: 'var(--primary)', background: 'rgba(0,200,150,0.06)', marginBottom: '8px' }}>
                  <div className="subject-select-icon" style={{ background: 'rgba(0,200,150,0.15)', color: 'var(--primary)' }}><IconBookOpen /></div>
                  <div className="subject-select-info">
                    <div className="subject-select-name">Todos os assuntos</div>
                    <div className="subject-select-meta">{totalCards} cards{dueTotal > 0 ? ` — ${dueTotal} para revisar` : ''}</div>
                  </div>
                  <div style={{ color: 'var(--primary)' }}><IconChevronRight /></div>
                </div>

                {hasAulas ? (
                  aulas.map(aula => {
                    const cards = filteredByMateria.filter(f => f.tema === aula.id);
                    const dueCount = SM2.getReviewDueCards(cards, srData).length;
                    const isChecked = selectedTemas.includes(aula.id);
                    const hasCards = cards.length > 0;
                    return (
                      <div key={aula.id} className={`subject-select-card${isChecked ? ' tema-selected' : ''}${!hasCards ? ' subject-card-empty' : ''}`} onClick={() => hasCards && toggleTema(aula.id)}>
                        <div className={`tema-checkbox${isChecked ? ' tema-checkbox-checked' : ''}`}>{isChecked ? '✓' : ''}</div>
                        <div className="subject-select-info">
                          <div className="subject-select-name">{aula.tema}</div>
                          <div className="subject-select-meta">{hasCards ? `${cards.length} cards${dueCount > 0 ? ` — ${dueCount} para revisar` : ' — em dia'}` : 'Em breve'}</div>
                        </div>
                      </div>
                    );
                  })
                ) : (
                  temasFromCards.sort().map(tema => {
                    const count = filteredByMateria.filter(f => f.tema === tema).length;
                    const dueCount = SM2.getReviewDueCards(filteredByMateria.filter(f => f.tema === tema), srData).length;
                    const isChecked = selectedTemas.includes(tema);
                    return (
                      <div key={tema} className={`subject-select-card${isChecked ? ' tema-selected' : ''}`} onClick={() => toggleTema(tema)}>
                        <div className={`tema-checkbox${isChecked ? ' tema-checkbox-checked' : ''}`}>{isChecked ? '✓' : ''}</div>
                        <div className="subject-select-info">
                          <div className="subject-select-name">{tema}</div>
                          <div className="subject-select-meta">{count} cards{dueCount > 0 ? ` — ${dueCount} para revisar` : ' — em dia'}</div>
                        </div>
                      </div>
                    );
                  })
                )}
              </div>

              {selectedTemas.length > 0 && (
                <div className="tema-start-bar">
                  <span style={{ color: 'var(--text-secondary)', fontSize: '13px' }}>
                    {selectedTemas.length} assunto{selectedTemas.length > 1 ? 's' : ''} selecionado{selectedTemas.length > 1 ? 's' : ''}
                  </span>
                  <button className="btn btn-primary" style={{ padding: '8px 20px', fontSize: '14px' }} onClick={() => { setSessionDeck([...deck]); setStudying(true); }}>
                    Iniciar estudo →
                  </button>
                </div>
              )}
            </div>
          </>
        );
      }

      // Session complete
      if (sessionComplete) {
        return (
          <>
            <div className="screen-content">
              <div className="session-complete">
                <div className="session-icon">🎉</div>
                <h2 className="session-title">Sessão Concluída!</h2>
                <div className="session-stats">
                  <div className="session-stat">
                    <span className="session-stat-label">Cards Revisados</span>
                    <span className="session-stat-value">{sessionStats.total}</span>
                  </div>
                  <div className="session-stat">
                    <span className="session-stat-label">Acertos</span>
                    <span className="session-stat-value">{sessionStats.correct}</span>
                  </div>
                  <div className="session-stat">
                    <span className="session-stat-label">Taxa de Acerto</span>
                    <span className="session-stat-value">
                      {Math.round((sessionStats.correct / Math.max(sessionStats.total, 1)) * 100)}%
                    </span>
                  </div>
                </div>
                <button className="btn btn-primary" onClick={resetSession}>Nova Sessão</button>
                <button className="btn btn-secondary mt-2" onClick={() => { setStudying(false); setSelectedTemas([]); }}>Escolher outro assunto</button>
              </div>
            </div>
          </>
        );
      }

      // No cards
      if (deck.length === 0) {
        const hasAnyCards = filteredByMateria.length > 0;
        return (
          <>
            <div className="screen-content">
              <button className="back-btn" onClick={() => setStudying(false)}>← {backLabel}</button>
              <div style={{ textAlign: 'center', marginTop: '60px' }}>
                <div style={{ fontSize: '60px', marginBottom: '20px' }}>{hasAnyCards ? '✨' : '🚧'}</div>
                <p style={{ color: 'var(--text-secondary)', marginBottom: '20px' }}>
                  {hasAnyCards ? 'Nenhum card para revisar agora!' : 'Flashcards em breve para esta matéria.'}
                </p>
                {hasAnyCards && <p style={{ color: 'var(--text-secondary)', fontSize: '13px' }}>Todos os cards estão em dia. Volte mais tarde.</p>}
                <button className="btn btn-secondary mt-2" style={{ marginTop: '20px' }} onClick={() => setStudying(false)}>Voltar</button>
              </div>
            </div>
          </>
        );
      }

      // Anki-style flashcard study session
      return (
        <>
          <div className="screen-content">
            <button className="back-btn" onClick={() => setStudying(false)}>← {backLabel}</button>

            <div className="flashcard-progress" style={{ marginBottom: '16px' }}>
              <div style={{ textAlign: 'center', fontSize: '13px', color: 'var(--text-secondary)', marginBottom: '8px' }}>
                {currentIndex + 1} de {sessionDeck.length}
              </div>
              <div className="progress-dots">
                {sessionDeck.slice(0, Math.min(sessionDeck.length, 30)).map((card, idx) => (
                  <div key={idx} className={`progress-dot ${idx === currentIndex ? 'current' : ''} ${idx < currentIndex ? 'completed' : ''}`}></div>
                ))}
                {sessionDeck.length > 30 && <span style={{ color: 'var(--text-secondary)', fontSize: '11px' }}>+{sessionDeck.length - 30}</span>}
              </div>
            </div>

            <div className="flashcard-container">
              <div className="flashcard" onClick={() => setIsFlipped(!isFlipped)} style={{ cursor: 'pointer' }}>
                <div className={`flashcard-inner ${isFlipped ? 'flipped' : ''}`}>
                  <div className="flashcard-front">
                    <div className="flashcard-label">Pergunta</div>
                    <div className="flashcard-text">{currentCard.pergunta}</div>
                    <div className="flashcard-hint">Espaço para virar</div>
                  </div>
                  <div className="flashcard-back">
                    <div className="flashcard-label">Resposta</div>
                    <div className="flashcard-text flashcard-answer">{currentCard.resposta}</div>
                    {currentCard.explicacao && (
                      <div className="flashcard-explanation">{currentCard.explicacao}</div>
                    )}
                  </div>
                </div>
              </div>
            </div>

            {isFlipped && (
              <div style={{ marginTop: '20px' }}>
                {/* Utility row: bury + report */}
                <div style={{ display: 'flex', justifyContent: 'center', gap: '20px', marginBottom: '14px' }}>
                  <button
                    onClick={handleBury}
                    title="Enterrar este card"
                    style={{ background: 'none', border: 'none', color: 'var(--text-secondary)', cursor: 'pointer', fontSize: '17px', lineHeight: 1, padding: '4px', opacity: 0.5, transition: 'opacity 0.15s' }}
                    onMouseEnter={e => e.currentTarget.style.opacity = '1'}
                    onMouseLeave={e => e.currentTarget.style.opacity = '0.5'}
                  >✕</button>
                  <button
                    onClick={handleReport}
                    title="Reportar erro neste card"
                    style={{ background: 'none', border: 'none', color: '#EF4444', cursor: 'pointer', fontSize: '15px', lineHeight: 1, padding: '4px', opacity: 0.72, transition: 'opacity 0.15s' }}
                    onMouseEnter={e => e.currentTarget.style.opacity = '1'}
                    onMouseLeave={e => e.currentTarget.style.opacity = '0.72'}
                  >⚑</button>
                </div>
                {/* Rating buttons — no container box */}
                <div style={{ display: 'flex', gap: '8px', justifyContent: 'center' }}>
                  <button
                    onClick={handleDeNovo}
                    style={{ flex: 1, maxWidth: '90px', padding: '10px 4px', borderRadius: '10px', border: 'none', background: 'rgba(239,68,68,0.15)', color: '#f87171', fontFamily: 'Outfit', fontWeight: 700, fontSize: '13px', cursor: 'pointer', transition: 'background 0.15s' }}
                    onMouseEnter={e => e.currentTarget.style.background = 'rgba(239,68,68,0.28)'}
                    onMouseLeave={e => e.currentTarget.style.background = 'rgba(239,68,68,0.15)'}
                  >
                    <div>De Novo</div>
                    <div style={{ fontSize: '10px', opacity: 0.7, fontWeight: 400, marginTop: '2px' }}>1</div>
                  </button>
                  <button
                    onClick={() => handleRate(5)}
                    style={{ flex: 1, maxWidth: '90px', padding: '10px 4px', borderRadius: '10px', border: 'none', background: 'rgba(0,200,150,0.15)', color: '#00C896', fontFamily: 'Outfit', fontWeight: 700, fontSize: '13px', cursor: 'pointer', transition: 'background 0.15s' }}
                    onMouseEnter={e => e.currentTarget.style.background = 'rgba(0,200,150,0.28)'}
                    onMouseLeave={e => e.currentTarget.style.background = 'rgba(0,200,150,0.15)'}
                  >
                    <div>Fácil</div>
                    <div style={{ fontSize: '10px', opacity: 0.7, fontWeight: 400, marginTop: '2px' }}>2</div>
                  </button>
                  <button
                    onClick={() => handleRate(3)}
                    style={{ flex: 1, maxWidth: '90px', padding: '10px 4px', borderRadius: '10px', border: 'none', background: 'rgba(234,179,8,0.15)', color: '#fbbf24', fontFamily: 'Outfit', fontWeight: 700, fontSize: '13px', cursor: 'pointer', transition: 'background 0.15s' }}
                    onMouseEnter={e => e.currentTarget.style.background = 'rgba(234,179,8,0.28)'}
                    onMouseLeave={e => e.currentTarget.style.background = 'rgba(234,179,8,0.15)'}
                  >
                    <div>Médio</div>
                    <div style={{ fontSize: '10px', opacity: 0.7, fontWeight: 400, marginTop: '2px' }}>3</div>
                  </button>
                  <button
                    onClick={() => handleRate(2)}
                    style={{ flex: 1, maxWidth: '90px', padding: '10px 4px', borderRadius: '10px', border: 'none', background: 'rgba(249,115,22,0.15)', color: '#fb923c', fontFamily: 'Outfit', fontWeight: 700, fontSize: '13px', cursor: 'pointer', transition: 'background 0.15s' }}
                    onMouseEnter={e => e.currentTarget.style.background = 'rgba(249,115,22,0.28)'}
                    onMouseLeave={e => e.currentTarget.style.background = 'rgba(249,115,22,0.15)'}
                  >
                    <div>Difícil</div>
                    <div style={{ fontSize: '10px', opacity: 0.7, fontWeight: 400, marginTop: '2px' }}>4</div>
                  </button>
                </div>
              </div>
            )}

            {!isFlipped && (
              <div style={{ textAlign: 'center', marginTop: '16px' }}>
                <button className="btn btn-primary" onClick={() => setIsFlipped(true)} style={{ padding: '12px 32px' }}>
                  Mostrar Resposta
                </button>
              </div>
            )}
          </div>
        </>
      );
    };

    // Quiz Screen
    const QuizScreen = ({ flashcards, materias, selectedMateria, onSelectMateria, userSemester }) => {
      const [activeQuiz, setActiveQuiz] = useState(null);
      const [activeTemas, setActiveTemas] = useState([]);
      const [showTemaSelector, setShowTemaSelector] = useState(false);
      const [pendingQuiz, setPendingQuiz] = useState(null);
      const [pendingTemas, setPendingTemas] = useState([]);
      const [currentQuestion, setCurrentQuestion] = useState(0);
      const [selectedOption, setSelectedOption] = useState(null);
      const [crossedOut, setCrossedOut] = useState(new Set());
      const [answered, setAnswered] = useState(false);
      const [quizStats, setQuizStats] = useState({ correct: 0, total: 0 });
      const [startTime, setStartTime] = useState(Date.now());
      const [quizComplete, setQuizComplete] = useState(false);
      const [semesterFilter, setSemesterFilter] = useState(userSemester || null);
      const [searchQuery, setSearchQuery] = useState('');
      const [showCadernoErros, setShowCadernoErros] = useState(false);

      // Caderno de erros — localStorage
      const getErros = () => JSON.parse(localStorage.getItem('meduni9_caderno_erros') || '[]');
      const addErro = (questionId) => {
        const erros = getErros();
        if (!erros.includes(questionId)) {
          erros.push(questionId);
          localStorage.setItem('meduni9_caderno_erros', JSON.stringify(erros));
        }
      };
      const removeErro = (questionId) => {
        const erros = getErros().filter(id => id !== questionId);
        localStorage.setItem('meduni9_caderno_erros', JSON.stringify(erros));
      };
      const clearErros = () => localStorage.setItem('meduni9_caderno_erros', '[]');

      const quizQuestions = useMemo(() => {
        return flashcards.filter(f => f.tipo === 'quiz' && f.opcoes && f.opcoes.length > 0);
      }, [flashcards]);

      const quizzes = useMemo(() => {
        const grouped = {};
        materias.filter(m => m.ativo !== false).forEach(m => {
          const questions = quizQuestions.filter(f => f.materia === m.id);
          grouped[m.id] = { name: m.nome, sigla: m.sigla, cards: questions, icon: m.icon, semestre: m.modulo, ativo: m.ativo, cor: m.cor };
        });
        return grouped;
      }, [quizQuestions, materias]);

      const filteredQuizzes = useMemo(() => {
        let result = { ...quizzes };
        if (semesterFilter) {
          const f = {};
          Object.entries(result).forEach(([id, q]) => {
            if (q.semestre === semesterFilter && q.ativo !== false) f[id] = q;
          });
          result = f;
        }
        if (searchQuery) {
          const f = {};
          Object.entries(result).forEach(([id, q]) => {
            if (fuzzyMatch(searchQuery, q.name) || fuzzyMatch(searchQuery, q.sigla || '')) f[id] = q;
          });
          result = f;
        }
        return result;
      }, [quizzes, semesterFilter, searchQuery]);

      useEffect(() => {
        if (!selectedMateria || activeQuiz || showTemaSelector || showCadernoErros || quizComplete) return;
        if (!quizzes[selectedMateria]) return;
        handleMateriaClick(selectedMateria);
      }, [selectedMateria, quizzes, activeQuiz, showTemaSelector, showCadernoErros, quizComplete]);

      // Keyboard shortcuts for quiz
      useEffect(() => {
        if (!activeQuiz || quizComplete) return;
        const handleKey = (e) => {
          if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
          const activeCards = getActiveCards();
          const card = activeCards[currentQuestion];
          if (!card) return;

          if (!answered) {
            // 1-5 select option
            const num = parseInt(e.key);
            if (num >= 1 && num <= card.opcoes.length && !crossedOut.has(num - 1)) {
              setSelectedOption(num - 1);
            }
            // Enter = confirm
            if (e.key === 'Enter' && selectedOption !== null) {
              e.preventDefault();
              handleAnswer();
            }
          } else {
            // Enter or Space = next question
            if (e.key === 'Enter' || e.code === 'Space') {
              e.preventDefault();
              handleNextQuestion();
            }
          }
        };
        window.addEventListener('keydown', handleKey);
        return () => window.removeEventListener('keydown', handleKey);
      }, [activeQuiz, quizComplete, answered, selectedOption, currentQuestion, crossedOut]);

      const handleQuizStart = (materiaId, temasArray) => {
        setActiveQuiz(materiaId);
        setActiveTemas(temasArray || []);
        setCurrentQuestion(0);
        setSelectedOption(null);
        setCrossedOut(new Set());
        setAnswered(false);
        setQuizStats({ correct: 0, total: 0 });
        setStartTime(Date.now());
        setShowTemaSelector(false);
        setPendingQuiz(null);
        setPendingTemas([]);
        setQuizComplete(false);
      };

      const handleMateriaClick = (materiaId) => {
        onSelectMateria(materiaId);
        const cards = quizzes[materiaId]?.cards || [];
        if (cards.length === 0) {
          handleQuizStart(materiaId, []);
          return;
        }
        const temas = [...new Set(cards.map(c => c.tema).filter(Boolean))];
        if (temas.length > 1) {
          setPendingQuiz(materiaId);
          setPendingTemas([]);
          setShowTemaSelector(true);
        } else {
          handleQuizStart(materiaId, []);
        }
      };

      const togglePendingTema = (temaId) => {
        setPendingTemas(prev =>
          prev.includes(temaId) ? prev.filter(t => t !== temaId) : [...prev, temaId]
        );
      };

      const toggleCross = (idx) => {
        const next = new Set(crossedOut);
        if (next.has(idx)) next.delete(idx);
        else next.add(idx);
        if (selectedOption === idx) setSelectedOption(null);
        setCrossedOut(next);
      };

      const getActiveCards = () => {
        if (showCadernoErros) {
          const erros = getErros();
          return quizQuestions.filter(q => erros.includes(q.id));
        }
        if (!activeQuiz) return [];
        const quiz = quizzes[activeQuiz];
        if (!quiz) return [];
        return activeTemas.length > 0
          ? quiz.cards.filter(c => activeTemas.includes(c.tema))
          : quiz.cards;
      };

      const handleAnswer = () => {
        const activeCards = getActiveCards();
        const card = activeCards[currentQuestion];
        const correct = selectedOption === card.correta;

        if (correct) {
          setQuizStats(prev => ({ ...prev, correct: prev.correct + 1 }));
          // Remove from caderno de erros if answered correctly
          removeErro(card.id);
        } else {
          // Add to caderno de erros on wrong answer
          addErro(card.id);
        }
        setAnswered(true);
      };

      const handleNextQuestion = () => {
        const activeCards = getActiveCards();
        if (currentQuestion < activeCards.length - 1) {
          setCurrentQuestion(currentQuestion + 1);
          setSelectedOption(null);
          setCrossedOut(new Set());
          setAnswered(false);
        } else {
          setQuizComplete(true);
          const quizHistory = JSON.parse(localStorage.getItem('meduni9_quiz_history') || '[]');
          quizHistory.push({
            date: new Date().toISOString(),
            materia: showCadernoErros ? 'caderno_erros' : activeQuiz,
            score: quizStats.correct,
            total: activeCards.length,
            time: formatTime(Date.now() - startTime)
          });
          localStorage.setItem('meduni9_quiz_history', JSON.stringify(quizHistory));
        }
      };

      const handleReportQuestion = () => {
        const activeCards = getActiveCards();
        const card = activeCards[currentQuestion];
        if (!card) return;
        const reason = prompt('Descreva o erro da questão (opcional):', '');
        if (reason === null) return;

        submitContentFeedback({
          origem: 'questoes',
          mensagem: reason?.trim() || 'Erro reportado em questão',
          itemId: card.id,
          materia: card.materia || activeQuiz,
          tema: card.tema,
          contexto: {
            pergunta: card.pergunta,
            opcoes: card.opcoes || [],
            correta: card.correta,
            explicacao: card.explicacao || ''
          }
        })
          .then(() => alert('Reporte enviado para o admin. Obrigado!'))
          .catch(() => alert('Nao foi possivel enviar agora. Tente novamente em instantes.'));
      };

      const handleRestartQuiz = () => {
        if (showCadernoErros) {
          setCurrentQuestion(0);
          setSelectedOption(null);
          setCrossedOut(new Set());
          setAnswered(false);
